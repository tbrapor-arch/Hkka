- id: glossika-sx-hl
  title: Glossika Mass Sentences — Hakka Sixian/Hailu, Fluency 1-3
  publisher: Glossika (Michael Campbell; credited Can Qi, Shau Zu Ciin Min)
  year: 2015
  accents: [sixian, hailu]
  use: [sentences]
  format: 3 PDFs, 3,000 sentences (EN, 四縣 characters + Glossika romanisation + IPA, 海陸 the same), 1,521-character index
  url: https://ai.glossika.com/
  licence: all rights reserved
  status: private
  note: >-
    Parsed into Hkka-private/data/glossika/sentences.jsonl (tools/parse_glossika.py). Glossika's romanisation is its
    own "Universal Pinyin" (-p/-t/-k, its own tone marks, which do not always match the dictionary tones), not MOE pinyin. Use it to see which words
    everyday sentences need (glossika_freq in the database) and to check that lesson sentences sound natural; write
    the course's own sentences. Book 1 is mostly A1-A2, book 3 B1.
