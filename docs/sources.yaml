- id: kaga-vocab-102
  title: 客語能力認證基本詞彙 102年版 (certification vocabulary, 2013 edition)
  publisher: 客家委員會 Hakka Affairs Council; merged by Taiwanese-Corpus/hakka_elearning
  year: 2013
  accents: [sixian, hailu, dapu, raoping, zhaoan]
  use: [vocab, sentences, audio]
  format: CSV, Sixian 1,678 初級 + 4,959 中級/中高級 + 604 loanwords
  url: https://github.com/Taiwanese-Corpus/hakka_elearning
  licence: government work; the same lists are now open data (政府資料開放授權條款-第1版)
  status: in-db
  note: >-
    Level, theme (類別), Mandarin and English gloss, one example sentence per word with Mandarin. The audio URLs
    (wiki.hakka.gov.tw) are from 2013 and probably dead. This is the course's core list (v_core).

- id: kaga-vocab-current
  title: 客語能力認證詞彙 115年度 (certification vocabulary 2026, 基礎級 to 高級) + 基礎級暨初級題庫
  publisher: 客家委員會
  year: 115年度 (2026)
  accents: [sixian, hailu, dapu, raoping, zhaoan]
  use: [vocab, sentences, test]
  format: 30 .ods files; Sixian 7,892 words (488 基礎級, 842 初級, 1,711 中級, 2,146 中高級, 2,826 高級), 7,729 examples; 5,055 exam items (all accents)
  url: https://data.gov.tw/dataset/176002
  licence: 政府資料開放授權條款-第1版 (Open Government Data License v1, compatible with CC BY 4.0)
  status: in-db
  note: >-
    Committed in data/gov/115/ (downloaded with data/fetch_gov.ps1 / fetch_gov.sh from
    elearning.hakka.gov.tw/hakka/download-files?c=2, c=3, c=5). Source `kaga115`: the core source of the course
    (v_core = 基礎級 + 初級 + 中級). The five accent lists share their numbering (src_id 'level:編號'), so
    v_word_parallel gives each word in every accent; "此腔無此詞條" rows (word absent in that accent) are skipped.
    Question banks in exam_item: listening, dialogue, reading (multiple choice with answer), picture description,
    speaking prompts, 242 sentences to repeat. 96% of Sixian words shared with the MOE dictionary have the same reading
    key. Audio zips are separate (fetch with -Audio / --audio), not in the repo.

- id: hakka-corpus
  title: 臺灣客語語料庫：客委會出版品或採錄品 (Taiwan Hakka Corpus)
  publisher: 客家委員會
  year: dataset 2025-12 (file DTST20251200015)
  accents: [sixian, hailu, dapu, raoping, zhaoan, south-sixian]
  use: [corpus, sentences]
  format: CSV, 755 texts (651 written, 104 spoken transcripts); Sixian 206 texts, ~300,000 characters
  url: https://data.gov.tw/dataset/176307
  licence: 政府資料開放授權條款-第1版
  status: in-db
  note: >-
    Committed as data/gov/hakka_corpus_176307.csv (the open-data licence allows it with attribution; the cloud build
    machine cannot download it). Texts: certification exam papers 97-106年度, children's rhymes, oral stories, 桐花文學獎
    prize texts. build_db.py counts words in the Sixian texts by longest match on known words (corpus_freq), which
    orders v_core together with Glossika.

- id: hakka-100-sentences
  title: 客家委員會客語百句 (Hakka in 100 sentences, 2012 and 2014 sets)
  publisher: 客家委員會 (easytalk.hakka.gov.tw)
  year: 2012, 2014 (file DTST20230600025)
  accents: [sixian, hailu, dapu, raoping, zhaoan, south-sixian]
  use: [sentences, audio]
  format: CSV, 1,053 rows (accent, hakka, chinese, phonetic, mp3 URL); 195 sentences, 149 in all six accents
  url: https://data.gov.tw/dataset/162998
  licence: 政府資料開放授權條款-第1版
  status: in-db
  note: >-
    Committed as data/gov/hakka_100_sentences_162998.csv; table `sentence`, view `v_sentence_parallel` (one row per
    sentence, one column per accent): the first real data for the accent switch. The file types tone marks with
    look-alike punctuation (’ for ˊ, ‘ for ˋ, ＋ for +, ^ for ˆ); build_db normalises them, checked against the MOE
    Sixian readings. 225 rows lost a character to '?' or a private-use code point in an encoding conversion
    (`hanzi_damaged = 1`; e.g. 你愛食麼?飲料 = 麼个); the romanisation and the audio are intact. Audio URLs are
    from 2012/2014 and not checked.

