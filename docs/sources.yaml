# Catalogue of Hakka (Sixian) documentation and language material.
# Source of truth for docs/sources.md (`make sources`). One item per resource.
#   status:  in-db        loaded by `make db` (downloaded at a pinned commit, not committed)
#            to-import    open licence, importer not written yet (download by hand, see note)
#            reference    read and cite; do not copy into the repo (licence does not allow it, or unclear)
#            private      kept in Hkka-private only
#   use:     spec | vocab | sentences | corpus | audio | textbook | test | pronunciation | dictionary
# Licences checked 2026-11-04; check again before importing anything new.

- id: moe-pinyin-manual
  title: 客家語拼音方案使用手冊 (Hakka romanisation, user manual, 2012 revision)
  publisher: 教育部 Ministry of Education
  year: 2012
  accents: [sixian, hailu, dapu, raoping, zhaoan, south-sixian]
  use: [spec]
  format: PDF, 155 pp.
  url: https://hakkadict.moe.edu.tw/static/resource/客語資源下載/其他資源/hakka_pinyin3.pdf
  licence: government publication, no open licence stated
  status: reference
  note: >-
    The romanisation spec for the course. Initials, finals, tone marks per accent, and the full Sixian syllable table
    (672 syllables). Sixian tones ˊ24 ˇ11 ˋ31 ∅55, checked ˋ2 ∅5. tools/pinyin.py implements it.

- id: moe-pinyin-workbook-sixian
  title: 客家語拼音學習手冊（四縣腔）
  publisher: 教育部
  year: 2016 (e-book 2018)
  accents: [sixian]
  use: [pronunciation, textbook]
  format: PDF
  url: https://language.moe.gov.tw/files/people_files/%E5%AE%A2%E5%AE%B6%E8%AA%9E%E6%8B%BC%E9%9F%B3%E5%AD%B8%E7%BF%92%E6%89%8B%E5%86%8A_%E5%9B%9B%E7%B8%A3%E8%85%94.pdf
  licence: government publication, no open licence stated
  status: reference
  note: >-
    Zero-start pronunciation course, initial+final by lesson, ends with tone sandhi. Example sentences are written with
    sandhi tones (麻油炒豬肝 zuˊ → zuˇ). Model for the course's reading lesson 000. Same series exists for the other
    five accents (南四縣腔, 海陸腔 … same URL pattern).

