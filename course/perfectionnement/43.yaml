exercises:
  translate:
    - en: "This year is a leap year."
      source: kaga115
      sx: {hanzi: "今年係閏年。", pinyin: "gimˊ ngienˇ he iun ngienˇ."}
    - en: "My elder brother is a Catholic."
      source: kaga115
      sx: {hanzi: "阿哥信天主教。", pinyin: "aˊ goˊ xin tienˊ zuˋ gau."}
    - en: "The two of them look very much alike."
      source: kaga115
      sx: {hanzi: "佢兩儕生來異相像。", pinyin: "giˇ liongˋ saˇ sangˊ loiˇ i xiongˊ qiong."}
    - en: "He and I do not share the same faith."
      source: kaga115
      sx: {hanzi: "𠊎同佢無共信仰。", pinyin: "ngaiˇ tungˇ giˇ moˇ kiung xin ngiongˋ."}
    - en: "Today is the year-end feast: the boss is treating us to a meal."
      source: kaga
      sx: {hanzi: "今晡日尾牙，頭家愛請𠊎這兜食飯。", pinyin: "gimˊ buˊ ngidˋ miˊ ngaˇ, teuˇ gaˊ oi qiangˋ ngaiˇ iaˋ deuˊ siid fan."}
  fill:
    - en: "He is a Protestant."
