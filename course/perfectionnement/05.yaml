    sx: {hanzi: 一日三餐兩點心。, pinyin: idˋ ngidˋ samˊ conˊ liongˋ diamˋ ximˊ.}
  - en: When you're ill, you must see the doctor.
    source: kaga115
    sx: {hanzi: 發病仔愛分先生看。, pinyin: bodˋ piang eˋ oi bunˊ xinˊ sangˊ kon.}
