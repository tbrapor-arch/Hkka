    source: kaga115
    sx: {hanzi: 無睡飽會啄目睡。, pinyin: moˇ soi bauˋ voi dugˋ mugˋ soi.}
  - en: Grandpa isn't in the habit of taking an afternoon nap.
    source: kaga115
    sx: {hanzi: 阿公無睡當晝个習慣。, pinyin: aˊ gungˊ moˇ soi dongˊ zu ge xib guan.}
  - en: 'He''s had diarrhoea all day: he must go to the clinic.'
    sx: {hanzi: 佢歸日仔屙瀉𣲩，愛去診所。, pinyin: 'giˇ guiˊ ngidˋ eˇ oˊ xia baˇ, oi hi ziinˊ soˋ.'}
  - en: Three meals and two snacks a day.
