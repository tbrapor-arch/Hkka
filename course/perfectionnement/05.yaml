    sx: {hanzi: 毋好等到___正食。, pinyin: mˇ hoˋ denˋ do ___ zang siid., answer_hanzi: 嘴燥, answer: zoi zauˊ}
  - en: Keep your neck covered.
    sx: {hanzi: ___愛遮等。, pinyin: ___ oi zaˊ denˋ., answer_hanzi: 頸根, answer: giangˋ ginˊ}
  - en: Luckily his stomach is still fine.
    sx: {hanzi: ___肚屎還係當好。, pinyin: ___ duˋ siiˋ hanˇ he dongˊ hoˋ., answer_hanzi: 好得, answer: hoˋ dedˋ}
  - en: When you cough, cover your mouth.
    sx: {hanzi: 嗽个時節，愛___嘴。, pinyin: 'cug ge siiˇ jiedˋ, oi ___ zoi.', answer_hanzi: 揞, answer: emˊ}
