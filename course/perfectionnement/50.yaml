exercises:
  translate:
    - en: "A pair of gloves."
      source: kaga115
      sx: {hanzi: "一雙手落仔。", pinyin: "idˋ sungˊ suˋ labˋ eˇ."}
    - en: "Pig's blood soup."
      source: kaga115
      sx: {hanzi: "豬紅湯。", pinyin: "zuˊ fungˇ tongˊ."}
    - en: "One page a day has to be torn off the calendar."
      source: kaga115
      sx: {hanzi: "日誌一日愛扯一頁。", pinyin: "ngidˋ zii idˋ ngidˋ oi caˋ idˋ iab."}
    - en: "That child is holding on to the hem of his mother's dress."
      source: kaga115
      sx: {hanzi: "該細人仔拉等厥姆个衫尾。", pinyin: "ge se nginˇ eˋ laiˊ denˋ giaˊ meˊ ge samˊ miˊ."}
    - en: "When you go away to work, be serious yourself and don't make your parents worry."
      source: kaga
      sx: {hanzi: "出外做頭路，自家愛認真，毋好分爺哀煩勞。", pinyin: "cudˋ ngoi zo teuˇ lu, qi gaˊ oi ngin ziinˊ, mˇ hoˋ bunˊ iaˇ oiˊ fanˇ loˇ."}
  fill:
    - en: "A tear-off calendar has a page torn off every day."
      sx: {hanzi: "___愛逐日扯。", pinyin: "___ oi dagˋ ngidˋ caˋ.", answer_hanzi: "日誌", answer: "ngidˋ zii"}
    - en: "If you don't eat and drink regularly, sooner or later your health will suffer."
      sx: {hanzi: "___無正常，早慢身體會出問題。", pinyin: "___ moˇ ziin songˇ, zoˋ man siinˊ tiˋ voi cudˋ mun tiˇ.", answer_hanzi: "飲食", answer: "imˋ siid"}
    - en: "There are many kinds of musical instruments."
      sx: {hanzi: "樂器種___當多。", pinyin: "ngog hi zungˋ ___ dongˊ doˊ.", answer_hanzi: "類", answer: "lui"}
    - en: "Sleeve covers keep the sun off, and you needn't fear mosquito bites either."
      sx: {hanzi: "戴___做得抵日頭，也毋驚蚊仔咬。", pinyin: "dai ___ zo dedˋ daiˋ ngidˋ teuˇ, ia mˇ giangˊ munˊ eˋ ngauˊ.", answer_hanzi: "手袖仔", answer: "suˋ qiu eˋ"}
    - en: "The room is brightly lit."
      sx: {hanzi: "___火光光。", pinyin: "___ foˋ gongˊ gongˊ.", answer_hanzi: "間肚", answer: "gienˊ duˋ"}

