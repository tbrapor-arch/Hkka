exercises:
  translate:
    - en: "There is a thermos flask on the table."
      source: kaga
      sx: {hanzi: "桌頂有一隻暖壺。", pinyin: "zogˋ dangˋ iuˊ idˋ zagˋ nonˊ fuˇ."}
    - en: "The sun sets in the west."
      source: kaga115
      sx: {hanzi: "日頭對西片落山。", pinyin: "ngidˋ teuˇ dui xiˊ pienˋ log sanˊ."}
    - en: "Where are you all going in a moment?"
      source: kaga115
      sx: {hanzi: "你兜人等下愛去哪？", pinyin: "nˇ deuˊ nginˇ denˋ ha oi hi nai?"}
    - en: "Now the countryside has tap water too."
      source: kaga
      sx: {hanzi: "這下莊下乜有水道水好用。", pinyin: "iaˋ ha zongˊ ha me iuˊ suiˋ to suiˋ hoˋ iung."}
    - en: "My elder sister is going south today and will be back the next day."
      source: kaga115
      sx: {hanzi: "阿姊今晡日下南，隔日就會轉來。", pinyin: "aˊ jiˋ gimˊ buˊ ngidˋ ha namˇ, gagˋ ngidˋ qiu voi zonˋ loiˇ."}
  fill:
    - en: "The power is off: go and get the torch."
      sx: {hanzi: "停電吔，去拿___出來。", pinyin: "tinˇ tien leˊ, hi naˊ ___ cudˋ loiˇ.", answer_hanzi: "手電筒", answer: "suˋ tien tungˇ"}
    - en: "Is what you say true?"
      sx: {hanzi: "你講个係___个無？", pinyin: "nˇ gongˋ ge he ___ ge moˇ?", answer_hanzi: "真實", answer: "ziinˊ siid"}
    - en: "The shop sells trousers of all kinds."
      sx: {hanzi: "店項有賣___个褲。", pinyin: "diam hong iuˊ mai ___ ge fu.", answer_hanzi: "各式各樣", answer: "gogˋ siidˋ gogˋ iong"}
    - en: "He is always ailing and often goes to the doctor."
      sx: {hanzi: "佢人就破病破病，___去看醫生。", pinyin: "giˇ nginˇ qiu po piang po piang, ___ hi kon iˊ senˊ.", answer_hanzi: "時常", answer: "siiˇ songˇ"}
    - en: "In the morning I went to the river to feel for clams."
      sx: {hanzi: "朝晨𠊎去河壩___。", pinyin: "zeuˊ siinˇ ngaiˇ hi hoˇ ba ___.", answer_hanzi: "覓蜆仔", answer: "mi hanˋ eˇ"}

