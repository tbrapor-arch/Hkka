exercises:
  translate:
    - en: "Scratch someone's back."
      source: kaga115
      sx: {hanzi: "爪背囊。", pinyin: "zauˋ boi nongˇ."}
    - en: "The stone is hard."
      source: kaga115
      sx: {hanzi: "石頭硬硬。", pinyin: "sag teuˇ ngang ngang."}
    - en: "It is enough to wash your hair every other day."
      source: kaga115
      sx: {hanzi: "頭那毛間日洗一到就好。", pinyin: "teuˇ naˇ moˊ gam ngidˋ seˋ idˋ do qiu hoˋ."}
    - en: "Most people generally say it that way."
      source: kaga115
      sx: {hanzi: "一般人普遍會恁樣講。", pinyin: "idˋ banˊ nginˇ puˊ pienˊ voi anˋ ngiongˇ gongˋ."}
    - en: "They are welcoming the gods up ahead: let's stop and watch for a moment."
      source: kaga115
      sx: {hanzi: "頭前在迎神，𫣆兜頓腳看一下仔。", pinyin: "teuˇ qienˇ coiˊ ngiangˇ siinˇ, enˊ deuˊ dunˋ giogˋ kon idˋ ha eˋ."}
  fill:
    - en: "Father has decided to give up drinking."
      sx: {hanzi: "阿爸決定愛___酒。", pinyin: "aˊ baˊ giedˋ tin oi ___ jiuˋ.", answer_hanzi: "戒", answer: "gie"}
    - en: "Doing that will hurt everyone's feelings."
      sx: {hanzi: "恁樣做會___大家个感情。", pinyin: "anˋ ngiongˇ zo voi ___ tai gaˊ ge gamˋ qinˇ.", answer_hanzi: "傷害", answer: "songˊ hoi"}
    - en: "How could you have so little judgement as to pick this one?"
      sx: {hanzi: "仰會恁無___擇著這隻？", pinyin: "ngiongˋ voi anˋ moˇ ___ tog cog iaˋ zagˋ?", answer_hanzi: "眼光", answer: "ngienˋ gongˊ"}
    - en: "Swat mosquitoes inside the mosquito net."
      sx: {hanzi: "在眠帳裡肚___蚊仔。", pinyin: "coiˊ minˇ zong diˊ duˋ ___ munˊ eˋ.", answer_hanzi: "拔", answer: "pad"}
    - en: "If a young person can't be relied on in what he does, he loses people's trust and will hardly succeed."
      sx: {hanzi: "後生人做事，係分人___，就會無信用，異難成功。", pinyin: "heu sangˊ nginˇ zo se, he bunˊ nginˇ ___, qiu voi moˇ xin iung, i nanˇ siinˇ gungˊ.", answer_hanzi: "倚恃毋得", answer: "iˋ sii mˇ dedˋ"}

