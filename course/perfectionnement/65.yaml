exercises:
  translate:
    - en: "(Of a baby) suckle."
      source: kaga115
      sx: {hanzi: "食乳。", pinyin: "siid nen."}
    - en: "So cold that you get goose flesh."
      source: kaga115
      sx: {hanzi: "寒到起雞嫲皮。", pinyin: "honˇ do hiˋ gieˊ maˇ piˇ."}
    - en: "He has a high standing in society."
      source: kaga115
      sx: {hanzi: "佢在社會項當有地位。", pinyin: "giˇ coiˊ sa fi hong dongˊ iuˊ ti vi."}
    - en: "Do you collect stamps? This stamp is for you."
      source: kaga
      sx: {hanzi: "你有集郵無？這張郵票分你。", pinyin: "nˇ iuˊ xib iuˇ moˇ? iaˋ zongˊ iuˇ peuˊ bunˊ nˇ."}
    - en: "His son is now in the top class of kindergarten."
      source: kaga115
      sx: {hanzi: "厥倈仔這下在該讀幼稚園大班。", pinyin: "giaˊ lai eˋ iaˋ ha du ge tug iu ziiˊ ienˇ tai banˊ."}
  fill:
    - en: "One lamp."
      sx: {hanzi: "一___燈。", pinyin: "idˋ ___ denˊ.", answer_hanzi: "盞", answer: "zanˋ"}
    - en: "He loves to show off."
      sx: {hanzi: "佢盡好___。", pinyin: "giˇ qin hau ___.", answer_hanzi: "展風神", answer: "dienˋ fungˊ siinˇ"}
    - en: "Eat these vegetables and the fish by turns."
      sx: {hanzi: "這青菜同魚仔愛___食。", pinyin: "iaˋ qiangˊ coi tungˇ ngˇ eˋ oi ___ siid.", answer_hanzi: "間等", answer: "gam denˋ"}
    - en: "Track athletes all run so fast."
      sx: {hanzi: "___選手逐個都走恁遽。", pinyin: "___ xienˋ suˋ dagˋ ge du zeuˋ anˋ giagˋ.", answer_hanzi: "田徑", answer: "tienˇ gang"}
    - en: "The exam is tomorrow: go and learn your lesson, quick."
      sx: {hanzi: "天光日愛考試，遽啊去___。", pinyin: "tienˊ gongˊ ngidˋ oi kauˋ sii, giagˋ a hi ___.", answer_hanzi: "背書", answer: "poi suˊ"}

