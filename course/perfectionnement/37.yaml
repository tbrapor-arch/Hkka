exercises:
  translate:
    - en: "On a rainy day, rubber boots are more convenient."
      source: kaga
      sx: {hanzi: "落雨天，著水靴筒較利便。", pinyin: "log iˋ tienˊ, zogˋ suiˋ hioˊ tungˇ ka li pien."}
    - en: "Dumplings are eaten dipped in vinegar."
      source: kaga
      sx: {hanzi: "食水餃愛搵酸醋。", pinyin: "siid suiˋ giauˋ oi vun sonˊ cii."}
    - en: "The air in the country is very good."
      source: kaga115
      sx: {hanzi: "莊下空氣當好。", pinyin: "zongˊ ha kungˊ hi dongˊ hoˋ."}
    - en: "Is it really that serious?"
      source: kaga115
      sx: {hanzi: "敢有恁嚴重？", pinyin: "gamˋ iuˊ anˋ ngiamˇ cung?"}
    - en: "She takes a needle and mends the torn clothes."
      source: kaga115
      sx: {hanzi: "佢擎針補爛忒个衫。", pinyin: "giˇ kiaˇ ziimˊ buˋ lan tedˋ ge samˊ."}
  fill:
    - en: "Everything is packed: we can leave at any time."
      sx: {hanzi: "東西都收好吔，___做得出發。", pinyin: "dungˊ xiˊ du suˊ hoˋ leˊ, ___ zo dedˋ cudˋ fadˋ.", answer_hanzi: "隨時", answer: "suiˇ siiˇ"}
    - en: "This jumper was knitted by machine."
      sx: {hanzi: "這領___係用機器打个。", pinyin: "iaˋ liangˊ ___ he iung giˊ hi daˋ ge.", answer_hanzi: "膨線衫", answer: "pong xien samˊ"}
    - en: "A set of numbers."
      sx: {hanzi: "一___號碼。", pinyin: "idˋ ___ ho maˊ.", answer_hanzi: "組", answer: "zuˊ"}
    - en: "His seat is empty: you may sit there."
      sx: {hanzi: "厥___空空，你做得坐。", pinyin: "giaˊ ___ kungˊ kungˊ, nˇ zo dedˋ coˊ.", answer_hanzi: "位仔", answer: "vi eˋ"}
    - en: "Mum has been standing too long: her body can't take it."
      sx: {hanzi: "阿姆企忒久，身體___。", pinyin: "aˊ meˊ kiˊ tedˋ giuˋ, siinˊ tiˋ ___.", answer_hanzi: "佇毋著", answer: "du mˇ diauˇ"}

