id: 17
genre: story
title:
  en: No cock crowing, no dog barking
  sx: {hanzi: 雞無啼狗無吠, pinyin: gieˊ moˇ taiˇ gieuˋ moˇ poi}
review: false
setting: Thursday 19 October 2028, a stormy night. Sam tells what happened in his rented room (進修 2), where his classmate
  阿雄 (進修 10) had come to prepare a class presentation (報告) with him. Sam is the narrator ("𠊎"); a few lines are what was said.
names: [Sam, 阿雄]
dialogue:
- n: 1
  en: Outside there was lightning, and thunder rolling.
  sx: {hanzi: 外背𥍉爧又響雷公。, pinyin: ngoi boi ngiabˋ lang iu hiongˋ luiˇ gungˊ.}
  source: kaga115
- n: 2
  en: A-hiung had come to my room to study, to get our presentation ready for next week.
  sx: {hanzi: 阿雄來𠊎間房讀書，準備下禮拜个報告。, pinyin: 'aˊ hiungˇ loiˇ ngaiˇ gienˊ fongˇ tug suˊ, zunˋ pi ha liˊ bai ge bo go.'}
- n: 3
  speaker: 阿雄
  en: 'There are so many mosquitoes in your room: my legs are bitten all over.'
  sx: {hanzi: 你間房蚊仔恁多，𠊎个腳分蚊仔叼到紅紅。, pinyin: 'nˇ gienˊ fongˇ munˊ eˋ anˋ doˊ, ngaiˇ ge giogˋ bunˊ munˊ eˋ diauˊ do fungˇ fungˇ.'}
- n: 4
  en: Just after ten, out of nowhere, the lights went out.
  sx: {hanzi: 十點過後，好恬恬，電火烏忒吔。, pinyin: 'siib diamˋ go heu, hoˋ diamˊ diamˊ, tien foˋ vuˊ tedˋ leˊ.'}
- n: 5
  en: 'I pressed the switch a few times: nothing.'
  sx: {hanzi: 𠊎撳幾下，電火還係烏烏。, pinyin: 'ngaiˇ kim giˋ ha, tien foˋ hanˇ he vuˊ vuˊ.'}
  check: true
- n: 6
  en: 'The whole building was black, and not a cock crowing nor a dog barking: so quiet it was frightening.'
  sx: {hanzi: 歸棟屋烏烏，雞無啼狗無吠，恬到得人驚。, pinyin: 'guiˊ dung vugˋ vuˊ vuˊ, gieˊ moˇ taiˇ gieuˋ moˇ poi, diamˊ do dedˋ nginˇ giangˊ.'}
- n: 7
  speaker: 阿雄
  en: Have you got a torch?
  sx: {hanzi: 你有手電筒仔無？, pinyin: 'nˇ iuˊ suˋ tien tungˇ eˋ moˇ?'}
- n: 8
  en: I searched for ages, and at last found the torch in the drawer.
  sx: {hanzi: 𠊎尋半日，正在拖箱仔肚尋著手電筒仔。, pinyin: 'ngaiˇ qimˇ ban ngidˋ, zang coiˊ toˊ xiongˊ eˋ duˋ qimˇ doˋ suˋ tien tungˇ eˋ.'}
- n: 9
  en: 'I switched it on: a bright beam.'
  sx: {hanzi: 手電筒仔一扚，光華華仔。, pinyin: 'suˋ tien tungˇ eˋ idˋ diag, gongˊ vaˇ vaˇ eˋ.'}
- n: 10
  en: Just then there were footsteps upstairs.
  sx: {hanzi: 該時節，樓頂有腳步聲。, pinyin: 'ge siiˇ jiedˋ, leuˇ dangˋ iuˊ giogˋ pu sangˊ.'}
- n: 11
  speaker: 阿雄
  en: 'Nobody lives upstairs: how can there be footsteps?'
  sx: {hanzi: 樓頂無人歇，仰會有腳步聲？, pinyin: 'leuˇ dangˋ moˇ nginˇ hed, ngiongˋ voi iuˊ giogˋ pu sangˊ?'}
- n: 12
  en: I came out in goose pimples.
  sx: {hanzi: 𠊎起寒毛菇。, pinyin: ngaiˇ hiˋ honˇ moˊ guˊ.}
- n: 13
  en: Then someone knocked at the door.
  sx: {hanzi: 續等，有人在該敲門。, pinyin: 'sa denˋ, iuˊ nginˇ du ge kau munˇ.'}
- n: 14
  en: A-hiung nearly screamed, and very nearly ran off.
  sx: {hanzi: 阿雄險險喊出來，強強會走忒。, pinyin: 'aˊ hiungˇ hiamˋ hiamˋ hemˊ cudˋ loiˇ, kiongˇ kiongˇ voi zeuˋ tedˋ.'}
- n: 15
  en: Gripping the torch, I crept slowly to the door.
  sx: {hanzi: 𠊎揢等手電筒仔，慢慢仔行到門脣。, pinyin: 'ngaiˇ kag denˋ suˋ tien tungˇ eˋ, man man eˋ hangˇ do munˇ sunˇ.'}
- n: 16
  en: 'I opened it: nobody there, only a gust of cold wind.'
  sx: {hanzi: 門一開，外背無人，淨有一陣冷風。, pinyin: 'munˇ idˋ koiˊ, ngoi boi moˇ nginˇ, qiang iuˊ idˋ ciin langˊ fungˊ.'}
- n: 17
  speaker: Sam
  en: Could it be a ghost?
  sx: {hanzi: 敢係鬼？, pinyin: 'gamˋ he guiˋ?'}
- n: 18
  speaker: 阿雄
  en: 'Don''t talk nonsense: I''ll have nightmares tonight.'
  sx: {hanzi: 莫亂講，𠊎今暗晡會發狂。, pinyin: 'mog lon gongˋ, ngaiˇ gimˊ am buˊ voi bodˋ kongˇ.'}
- n: 19
  en: At that very moment, something was darting about round my feet.
  sx: {hanzi: 就在這時節，有麼个東西在𠊎腳下逐上逐下。, pinyin: 'qiu coiˊ iaˋ siiˇ jiedˋ, iuˊ maˋ ge dungˊ xiˊ coiˊ ngaiˇ giogˋ haˊ giugˋ songˊ
      giugˋ haˊ.'}
- n: 20
  en: I jumped, and dropped the torch on the floor.
  sx: {hanzi: 𠊎著驚，手電筒仔跌落地泥。, pinyin: 'ngaiˇ cog giangˊ, suˋ tien tungˇ eˋ diedˋ log ti naiˇ.'}
- n: 21
  en: A flash of lightning, and I caught sight of a small dark thing.
  sx: {hanzi: 𥍉爧一下，𠊎影著一隻烏烏个細東西。, pinyin: 'ngiabˋ lang idˋ ha, ngaiˇ iangˋ doˋ idˋ zagˋ vuˊ vuˊ ge se dungˊ xiˊ.'}
- n: 22
  en: It was a cat!
  sx: {hanzi: 係一隻貓仔！, pinyin: he idˋ zagˋ meu eˋ!}
- n: 23
  speaker: 阿雄
  en: (sitting down heavily) I got such a fright I feel quite unwell.
  sx: {hanzi: 𠊎著驚到身體毋自然。, pinyin: ngaiˇ cog giangˊ do siinˊ tiˋ mˇ cii ienˇ.}
  check: true
- n: 24
  en: It was soaked through by the rain and covered in dust; who knows where it had got in.
  sx: {hanzi: 佢分雨涿到溼浙浙仔，又歸身塵灰，毋知對哪位入來。, pinyin: 'giˇ bunˊ iˋ dugˋ do siibˋ zeb zeb eˋ, iu guiˊ siinˊ ciinˇ foiˊ, mˇ diˊ
      dui nai vi ngib loiˇ.'}
- n: 25
  en: Before long, the lights came back on.
  sx: {hanzi: 無幾久，電火又光吔。, pinyin: 'moˇ gidˋ giuˋ, tien foˋ iu gongˊ leˊ.'}
- n: 26
  en: The cat looked at us, then jumped up onto the sofa.
  sx: {hanzi: 貓仔看𠊎兜一下，就跳上膨凳。, pinyin: 'meu eˋ kon ngaiˇ deuˊ idˋ ha, qiu tiau songˊ pong den.'}
- n: 27
  speaker: 阿雄
  en: It must have come to chase your cockroach.
  sx: {hanzi: 佢一定係來逐你个黃蚻。, pinyin: giˇ idˋ tin he loiˇ giugˋ nˇ ge vongˇ cad.}
- n: 28
  speaker: Sam
  en: Then it can stay.
  sx: {hanzi: 該佢做得歇這。, pinyin: ge giˇ zo dedˋ hed iaˋ.}
- n: 29
  en: That night, A-hiung, the cat, the cockroach and I all slept under one roof.
  sx: {hanzi: 該暗晡，𠊎同阿雄、貓仔、黃蚻共下歇。, pinyin: 'ge am buˊ, ngaiˇ tungˇ aˊ hiungˇ, meu eˋ, vongˇ cad kiung ha hiedˋ.'}
notes:
- ref: 0
  topic: culture
  text: >
    A story, told by Sam. The title is a saying from the official lists (高級): 雞無啼狗無吠 "no cock crowing, no dog barking",
    for an eerie silence. It is used in line 6.
- ref: 1
  topic: vocab
  text: >
    An official sentence (kaga115). 𥍉爧 ngiabˋ lang "lightning"; 雷公 luiˇ gungˊ "thunder" (響雷公 "it thunders").
- ref: 3
  topic: vocab
  text: >
    蚊仔 "mosquito" (lesson 89); 叼 diauˊ "bite, sting" (of insects: 腳底分蚊仔叼著 "my foot got bitten by a mosquito").
- ref: 4
  topic: vocab
  text: >
    好恬恬 hoˋ diamˊ diamˊ "out of the blue, for no reason" (佢有時節會好恬恬仔發譴 "sometimes he gets angry for no reason"). 烏忒 vuˊ tedˋ
    "go out (of a light or flame)" (風忒大，蠟燭火烏忒吔 "the wind was so strong the candle went out").
- ref: 5
  topic: vocab
  text: >
    撳 kim "press" (an official sentence: 扚電火，一般人會用手指去撳 "to turn the light on, most people press with a finger").
- ref: 6
  topic: vocab
  text: >
    恬 diamˊ "quiet": 恬到得人驚 "so quiet it's frightening" (得人驚, 進修 6). 棟 (lesson 73).
- ref: 9
  topic: vocab
  text: >
    扚 diag "switch on" (電火扚著來 "switch the light on"). 光華華仔 gongˊ vaˇ vaˇ eˋ "very bright" (該葩路燈光華華仔).
- ref: 10
  topic: vocab
  text: >
    樓頂 leuˇ dangˋ "upstairs" appears in official sentences (樓頂並令拚喨…). 腳步 (lesson 90).
- ref: 12
  topic: vocab
  text: >
    起寒毛菇 "come out in goose pimples" (一講著蛇哥，𠊎就會起寒毛菇 "just mention snakes and I get goose pimples").
- ref: 13
  topic: vocab
  text: >
    敲 kau "knock" (敲麼个東西？敲到恁大聲 "what are you knocking? so loud!").
- ref: 14
  topic: vocab
  text: >
    險險 hiamˋ hiamˋ "very nearly" (碗險險分老弟嘳忒 "my brother nearly broke the bowl"); 強強會 kiongˇ kiongˇ voi "almost, on the point
    of". 喊 hemˊ "shout, scream" (checklist).
- ref: 15
  topic: vocab
  text: >
    揢 kag "grip, clutch" (揢拳頭嫲 "clench one's fist").
- ref: 16
  topic: vocab
  text: >
    冷風 langˊ fungˊ "cold wind" (冷風對西北片吹過來). 陣 (lesson 60) counts gusts.
- ref: 17
  topic: vocab
  text: >
    敢係 gamˋ he "could it be…?" (這敢係真實个？ "can this be true?"). 鬼 guiˋ "ghost".
- ref: 18
  topic: false-friend
  text: >
    發狂 bodˋ kongˇ is "have a nightmare" (老妹昨暗晡發狂緊噭 "my little sister had a nightmare last night and kept crying"), not Mandarin
    fākuáng "go mad".
- ref: 19
  topic: vocab
  text: >
    逐上逐下 giugˋ songˊ giugˋ haˊ "chase up and down, dart about" (佢兜在巷仔肚逐上逐下 "they were chasing each other up and down the
    lane").
- ref: 20
  topic: vocab
  text: >
    著驚 cog giangˊ "get a fright" (害𠊎著驚一下 "gave me a fright").
- ref: 21
  topic: vocab
  text: >
    影著 iangˋ doˋ "catch a glimpse of" (頭先有影著一儕人行啊過 "just now I glimpsed someone going past").
- ref: 23
  topic: vocab
  text: >
    毋自然 mˇ cii ienˇ "unwell, out of sorts" (佢寒著，身體毋自然 "he's caught a chill and feels unwell"). After a fright, the line
    is ours; marked for review.
- ref: 24
  topic: vocab
  text: >
    涿 dugˋ "get rained on": 涿到溼浙浙仔 "soaked to the skin" (係無涿到溼浙浙仔斯會寒著哦 "or you'll get soaked and catch cold"). 塵灰 ciinˇ
    foiˊ "dust".
- ref: 25
  topic: vocab
  text: >
    無幾久 moˇ gidˋ giuˋ "before long" (lesson 96).
- ref: 29
  topic: vocab
  text: >
    歇 hiedˋ "stay the night" (checklist), as in 進修 1.
