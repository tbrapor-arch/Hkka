  - en: He shouted so loud he gave me a fright.
    source: kaga115
    sx: {hanzi: 佢喊恁大聲，害𠊎著驚一下。, pinyin: 'giˇ hemˊ anˋ tai sangˊ, hoi ngaiˇ cog giangˊ idˋ ha.'}
  - en: Just mention snakes and I come out in goose pimples.
    source: kaga115
    sx: {hanzi: 一講著蛇哥，𠊎就會起寒毛菇。, pinyin: 'idˋ gongˋ doˋ saˇ goˊ, ngaiˇ qiu voi hiˋ honˇ moˊ guˊ.'}
  - en: Sometimes he gets angry out of the blue.
    source: kaga115
    sx: {hanzi: 佢有時節會好恬恬仔發譴。, pinyin: giˇ iuˊ siiˇ jiedˋ voi hoˋ diamˊ diamˊ eˋ fadˋ kienˋ.}
  - en: My little sister had a nightmare last night and kept crying.
    source: kaga115
    sx: {hanzi: 老妹昨暗晡發狂緊噭。, pinyin: loˋ moi coˊ am buˊ bodˋ kongˇ ginˋ gieu.}
  - en: Just now I glimpsed someone going past.
    source: kaga115
    sx: {hanzi: 頭先有影著一儕人行啊過。, pinyin: teuˇ xienˊ iuˊ iangˋ doˋ idˋ saˇ nginˇ hangˇ a go.}
