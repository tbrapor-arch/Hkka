exercises:
  translate:
    - en: "The two sisters are twins."
      source: kaga115
      sx: {hanzi: "佢兩姊妹係雙生仔。", pinyin: "giˇ liongˋ jiˋ moi he sungˊ sangˊ eˋ."}
    - en: "Dragonflies eat mosquitoes and flies."
      source: kaga
      sx: {hanzi: "揚尾仔愛食蚊仔同烏蠅。", pinyin: "iongˇ miˊ eˋ oi siid munˊ eˋ tungˇ vuˊ inˇ."}
    - en: "I am very glad to listen to you."
      source: kaga115
      sx: {hanzi: "𠊎當樂意聽你講。", pinyin: "ngaiˇ dongˊ log i tangˊ nˇ gongˋ."}
    - en: "Nobody wants to buy that kind of thing."
      source: kaga115
      sx: {hanzi: "該樣東西無人想愛買。", pinyin: "ge iong dungˊ xiˊ moˇ nginˇ xiongˋ oi maiˊ."}
    - en: "The pine trees in the park have grown very fine."
      source: kaga
      sx: {hanzi: "公園肚个松樹生到當靚。", pinyin: "gungˊ ienˇ duˋ ge qiungˇ su sangˊ do dongˊ jiangˊ."}
  fill:
    - en: "On the hilltops in autumn the silver-grass plumes are white."
      sx: {hanzi: "秋天个山頂，___白白。", pinyin: "qiuˊ tienˊ ge sanˊ dangˋ, ___ pag pag.", answer_hanzi: "芒花", answer: "miongˇ faˊ"}
    - en: "You need skill to do a job."
      sx: {hanzi: "做事愛有___。", pinyin: "zo se oi iuˊ ___.", answer_hanzi: "技巧", answer: "giˊ kauˋ"}
    - en: "The beggar-ticks are stuck to my trousers."
      sx: {hanzi: "蝦公夾黏在___項。", pinyin: "haˇ gungˊ giab ngiamˇ coiˊ ___ hong.", answer_hanzi: "褲", answer: "fu"}
    - en: "Did you buy the grapes in the fridge?"
      sx: {hanzi: "冰箱肚个___係毋係你買个？", pinyin: "benˊ xiongˊ duˋ ge ___ he mˇ he nˇ maiˊ ge?", answer_hanzi: "葡萄", answer: "puˇ toˇ"}
    - en: "Please help yourselves to the dishes: don't stand on ceremony."
      sx: {hanzi: "請___挾菜食，毋使細義。", pinyin: "qiangˋ ___ giabˋ coi siid, mˇ siiˋ se ngi.", answer_hanzi: "隨意", answer: "suiˇ i"}

