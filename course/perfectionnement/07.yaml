      sx: {hanzi: "佢無黏時踏___。", pinyin: "giˇ moˇ ngiamˇ siiˇ tab ___.", answer_hanzi: "擋仔", answer: "dongˋ eˇ"}
    - en: "That's my private business!"
      sx: {hanzi: "該係𠊎___个事情！", pinyin: "ge he ngaiˇ ___ ge sii qinˇ!", answer_hanzi: "個人", answer: "ge nginˇ"}
    - en: "Don't eat in such a hurry."
      sx: {hanzi: "食飯毋好恁___。", pinyin: "siid fan mˇ hoˋ anˋ ___.", answer_hanzi: "急", answer: "gibˋ"}

