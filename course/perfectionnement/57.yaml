exercises:
  translate:
    - en: "The corn tastes very sweet."
      source: kaga115
      sx: {hanzi: "包粟食起來盡甜。", pinyin: "bauˊ xiugˋ siid hiˋ loiˇ qin tiamˇ."}
    - en: "Vegetables are fetching a good price these days."
      source: kaga115
      sx: {hanzi: "這駁仔青菜當好價。", pinyin: "iaˋ bogˋ eˇ qiangˊ coi dongˊ hoˋ ga."}
    - en: "Next door they talk very loudly, as if afraid people won't hear."
      source: kaga115
      sx: {hanzi: "隔壁講話大嫲聲，驚人聽毋著樣仔。", pinyin: "gagˋ biagˋ gongˋ fa tai maˇ sangˊ, giangˊ nginˇ tangˊ mˇ doˋ iong eˋ."}
    - en: "There are Hakka overseas too, and some of them still speak Hakka."
      source: kaga115
      sx: {hanzi: "海外乜有客人，有兜仔還會講客話。", pinyin: "hoiˋ ngoi me iuˊ hagˋ nginˇ, iuˊ deuˊ eˋ hanˇ voi gongˋ hagˋ fa."}
    - en: "There is plenty of time: go and play to your heart's content."
      source: kaga115
      sx: {hanzi: "時間當多，你做你放勢仔搞。", pinyin: "siiˇ gienˊ dongˊ doˊ, nˇ zo nˇ fong se eˋ gauˋ."}
  fill:
    - en: "Deeply dissatisfied at heart."
      sx: {hanzi: "心肝肚十分___。", pinyin: "ximˊ gonˊ duˋ siib funˊ ___.", answer_hanzi: "不滿", answer: "budˋ manˊ"}
    - en: "When husband and wife fall out, they sleep side by side without a word."
      sx: {hanzi: "兩公婆___，共下睡就無講話。", pinyin: "liongˋ gungˊ poˇ ___, kiung ha soi qiu moˇ gongˋ fa.", answer_hanzi: "鬥氣", answer: "deu hi"}
    - en: "The edge of this sheet has been creased by someone."
      sx: {hanzi: "這張紙个邊脣分人___哩。", pinyin: "iaˋ zongˊ ziiˋ ge bienˊ sunˇ bunˊ nginˇ ___ leˊ.", answer_hanzi: "拗著", answer: "auˋ doˋ"}
    - en: "Flies won't go however you chase them: what a nuisance."
      sx: {hanzi: "___逐就逐毋走，還得人惱。", pinyin: "___ giugˋ qiu giugˋ mˇ zeuˋ, hanˇ dedˋ nginˇ nauˊ.", answer_hanzi: "烏蠅", answer: "vuˊ inˇ"}
    - en: "The day is still a long way off: it doesn't matter if we don't decide yet."
      sx: {hanzi: "日仔還恁久，___決定無相干。", pinyin: "ngidˋ eˇ hanˇ anˋ giuˋ, ___ giedˋ tin moˇ xiongˊ gonˊ.", answer_hanzi: "吂使", answer: "mangˇ siiˋ"}

