exercises:
  translate:
    - en: "Mother has a gold necklace."
      source: kaga
      sx: {hanzi: "阿姆有一條金䯋鍊。", pinyin: "aˊ meˊ iuˊ idˋ tiauˇ gimˊ pad lien."}
    - en: "Grandpa has been off tobacco for three weeks and is still very optimistic."
      sx: {hanzi: "阿公戒菸三禮拜吔，還係當樂觀。", pinyin: "aˊ gungˊ gie ienˊ samˊ liˊ bai leˊ, hanˇ he dongˊ log gonˊ."}
    - en: "How much is this straw mat?"
      source: kaga115
      sx: {hanzi: "這領草蓆愛賣幾多錢？", pinyin: "iaˋ liangˊ coˋ qiag oi mai giˋ doˊ qienˇ?"}
    - en: "The old lady isn't in the main room: she is cooking at the back."
      source: kaga115
      sx: {hanzi: "老人家無在廳下，在裡背煮飯。", pinyin: "loˋ nginˇ gaˊ moˇ coiˊ tangˊ haˊ, coiˊ diˊ boi zuˋ fan."}
    - en: "The two of them are the same age: both are fifteen."
      source: kaga115
      sx: {hanzi: "佢兩儕平大，共樣係十五歲。", pinyin: "giˇ liongˋ saˇ piangˇ tai, kiung iong he siib ngˋ se."}
  fill:
    - en: "He played till he was filthy all over."
      sx: {hanzi: "搞到歸身___。", pinyin: "gauˋ do guiˊ siinˊ ___.", answer_hanzi: "烏疏疏仔", answer: "vuˊ soˇ soˇ eˋ"}
    - en: "I drank a cup of coffee in the daytime, and at night I couldn't get to sleep."
      sx: {hanzi: "日時頭啉忒一杯咖啡，暗晡頭就___。", pinyin: "ngidˋ siiˇ teuˇ limˊ tedˋ idˋ biˊ gaˊ biˊ, am buˊ teuˇ qiu ___.", answer_hanzi: "睡毋落覺", answer: "soi mˇ log gau"}
    - en: "This water is very shallow: it only comes up to the knee."
      sx: {hanzi: "這水當___，正到膝頭恁深定定。", pinyin: "iaˋ suiˋ dongˊ ___, zang do qidˋ teuˇ anˋ ciimˊ tin tin.", answer_hanzi: "淺", answer: "qienˋ"}
    - en: "Things of iron rust in time."
      sx: {hanzi: "鐵仔个東西，久吔就會___。", pinyin: "tiedˋ eˇ ge dungˊ xiˊ, giuˋ leˊ qiu voi ___.", answer_hanzi: "生鹵", answer: "sangˊ luˊ"}
    - en: "A-min says Grandma has favourites."
      sx: {hanzi: "阿明講阿婆___。", pinyin: "aˊ minˇ gongˋ aˊ poˇ ___.", answer_hanzi: "大細心", answer: "tai se ximˊ"}

