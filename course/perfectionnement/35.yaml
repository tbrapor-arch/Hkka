id: 35
genre: review
title:
  en: "Be content and you'll be happy"
  sx: {hanzi: "人愛知足正會快樂", pinyin: "nginˇ oi diˊ jiugˋ zang voi kuai log"}
review: true
setting: >-
  Thursday 15 February 2029, the third day of the New Year. Sam has come to stay with 鍾伯 and 鍾伯姆 in 美濃 (進修 32).
  They sit in the courtyard after supper with the neighbour 阿財哥. Review of 進修 29–34: no new words.
names: [Sam, 鍾伯, 鍾伯姆, 阿財哥, 美濃, 苗栗, 阿明, 阿公]

dialogue:
  - n: 1
    speaker: 鍾伯
    en: "Sam, you've come laden with bags!"
    sx: {hanzi: "Sam，你大包細包來！", pinyin: "Sam, nˇ tai bauˊ se bauˊ loiˇ!"}
  - n: 2
    speaker: Sam
    en: "It's sweet rice cake from Grandma in Miaoli. She ground the rice and steamed it till the middle of the night."
    sx: {hanzi: "這係苗栗阿婆个甜粄。佢磨粄、炊粄，炊到星光半夜。", pinyin: "iaˋ he meuˇ lid aˊ poˇ ge tiamˇ banˋ. giˇ mo banˋ, coiˊ banˋ, coiˊ do sangˊ gongˊ ban ia."}
    check: true
  - n: 3
    speaker: 鍾伯姆
    en: "So kind of her. Our guest room's ready: stay a few more nights."
    sx: {hanzi: "恁好心。吾屋下个人客間準備好吔，你多歇兩暗晡。", pinyin: "anˋ hoˋ ximˊ. ngaˊ vugˋ kaˊ ge nginˇ hagˋ gienˊ zunˋ pi hoˋ leˊ, nˇ doˊ hiedˋ liongˋ am buˊ."}
    check: true
  - n: 4
    speaker: 鍾伯
    en: "How did you spend the New Year in Miaoli?"
    sx: {hanzi: "你在苗栗年仰般過？", pinyin: "nˇ coiˊ meuˇ lid ngienˇ ngiongˋ banˊ go?"}
    check: true
  - n: 5
    speaker: Sam
    en: "On New Year's Eve Grandpa wrote the door couplets. Young and old ate together, then took sweets for luck and told jokes."
    sx: {hanzi: "年三十暗晡，阿公寫門對仔。大人細子共下食飯，食飽拈甜、講笑科。", pinyin: "ngienˇ samˊ siib am buˊ, aˊ gungˊ xiaˋ munˇ dui eˋ. tai nginˇ se ziiˋ kiung ha siid fan, siid bauˋ ngiamˊ tiamˇ, gongˋ seu koˊ."}
  - n: 6
    speaker: Sam
    en: "On New Year's Day everyone was all smiles, and in the evening the neighbours came round to eat and chat."
    sx: {hanzi: "年初一大家都開容笑面，暗晡頭隔壁个人來打鬥四。", pinyin: "ngienˇ cuˊ idˋ tai gaˊ du koiˊ iungˇ seu mien, am buˊ teuˇ gagˋ biagˋ ge nginˇ loiˇ daˋ deu xi."}
  - n: 7
    speaker: 阿財哥
    en: "Sam, I'm the one who planted cabbages. Did 鍾伯 tell you?"
    sx: {hanzi: "Sam，𠊎就係種包心白个人。鍾伯有同你講無？", pinyin: "Sam, ngaiˇ qiu he zung bauˊ ximˊ pag ge nginˇ. zungˊ bagˋ iuˊ tungˇ nˇ gongˋ moˇ?"}
  - n: 8
    speaker: Sam
    en: "He did. There was a glut of cabbage, the price fell and you lost money."
    sx: {hanzi: "有。包心白大出，嗄落價，你蝕本。", pinyin: "iuˊ. bauˊ ximˊ pag tai cudˋ, sa log ga, nˇ sad bunˋ."}
  - n: 9
    speaker: 阿財哥
    en: "This morning I went to the temple and cast the blocks, and got a 'yes' first time!"
    sx: {hanzi: "今晡日朝晨𠊎去廟項跌筊仔，一跌就聖筊！", pinyin: "gimˊ buˊ ngidˋ zeuˊ siinˇ ngaiˇ hi meu hong diedˋ gau eˋ, idˋ diedˋ qiu siin gau!"}
    check: true
  - n: 10
    speaker: 鍾伯
    en: "So the gods approve. Sooner or later you'll have your luck."
    sx: {hanzi: "恁樣神明合意。早慢你會好空。", pinyin: "anˋ ngiongˇ siinˇ minˇ gagˋ i. zoˋ man nˇ voi hoˋ kungˊ."}
  - n: 11
    speaker: 阿財哥
    en: "This year I won't be greedy: I'll plant a little, and not invest so much."
    sx: {hanzi: "今年𠊎毋敢貪心，種較少兜仔，毋使投資恁多。", pinyin: "gimˊ ngienˇ ngaiˇ mˇ gamˋ tamˊ ximˊ, zung ka seuˋ deuˊ eˋ, mˇ siiˋ teuˇ ziiˊ anˋ doˊ."}
    check: true
  - n: 12
    speaker: Sam
    en: "Grandma told me a tale: 'man's heart climbs ever higher'. You have to be content to be happy."
    sx: {hanzi: "阿婆同𠊎講一隻古：人心節節高。人愛知足正會快樂。", pinyin: "aˊ poˇ tungˇ ngaiˇ gongˋ idˋ zagˋ guˋ: nginˇ ximˊ jiedˋ jiedˋ goˊ. nginˇ oi diˊ jiugˋ zang voi kuai log."}
    check: true
  - n: 13
    speaker: 鍾伯姆
    en: "Your grandma is wise."
    sx: {hanzi: "你阿婆講話當有智慧。", pinyin: "nˇ aˊ poˇ gongˋ fa dongˊ iuˊ zii fi."}
    check: true
  - n: 14
    speaker: 鍾伯
    en: "What's the weather like in Miaoli? Any frost?"
    sx: {hanzi: "苗栗个天時仰般？有落霜無？", pinyin: "meuˇ lid ge tienˊ siiˇ ngiongˋ banˊ? iuˊ log songˊ moˇ?"}
  - n: 15
    speaker: Sam
    en: "There was at the beginning of the month. Grandpa and A-min and I dug sweet potatoes and roasted them in the embers."
    sx: {hanzi: "這隻月初有。𠊎同阿公、阿明改番薯，撿樵來煨番薯。", pinyin: "iaˋ zagˋ ngied cuˊ iuˊ. ngaiˇ tungˇ aˊ gungˊ, aˊ minˇ goiˋ fanˊ suˇ, giamˋ ceuˇ loiˇ voiˊ fanˊ suˇ."}
    check: true
  - n: 16
    speaker: Sam
    en: "A-min wanted to cut down the longan tree for firewood. Grandpa said, 'Cutting down the tree to pick the longans!'"
    sx: {hanzi: "阿明想愛倒樹仔做樵，阿公講：「倒樹仔摘牛眼！」", pinyin: "aˊ minˇ xiongˋ oi doˋ su eˋ zo ceuˇ, aˊ gungˊ gongˋ: doˋ su eˋ zagˋ ngiuˇ ngienˋ!"}
  - n: 17
    speaker: 鍾伯
    en: "A-min's a real ringleader."
    sx: {hanzi: "阿明正經係搞頭王。", pinyin: "aˊ minˇ ziin ginˊ he gauˋ teuˇ vongˇ."}
    check: true
  - n: 18
    speaker: Sam
    en: "He was elected class president too. He promised his classmates to pull together."
    sx: {hanzi: "佢乜當選班長吔。佢應承同學，大家愛團結。", pinyin: "giˇ me dongˊ xienˋ banˊ zongˋ leˊ. giˇ inˋ siinˇ tungˇ hog, tai gaˊ oi tonˇ giedˋ."}
  - n: 19
    speaker: 鍾伯姆
    en: "Children today spend all day on their phones and rarely go out to play."
    sx: {hanzi: "這下个細人仔歸日用手機仔上網，罕得去外背搞。", pinyin: "iaˋ ha ge se nginˇ eˋ guiˊ ngidˋ iung suˋ giˊ eˋ songˊ miongˋ, hanˋ dedˋ hi ngoi boi gauˋ."}
  - n: 20
    speaker: 鍾伯
    en: "When I was small, we went to the river to skim stones and swam about like geese."
    sx: {hanzi: "𠊎細个時節，去河壩打水漂仔，像鵝仔樣泅來泅去。", pinyin: "ngaiˇ se ge siiˇ jiedˋ, hi hoˇ ba daˋ suiˋ piu eˋ, qiong ngoˇ eˋ iong qiuˇ loiˇ qiuˇ hi."}
    check: true
  - n: 21
    speaker: 阿財哥
    en: "Half work, half play: those were the days."
    sx: {hanzi: "半做半尞，該下較快樂。", pinyin: "ban zo ban liau, ge ha ka kuai log."}
    check: true
  - n: 22
    speaker: 鍾伯
    en: "Tomorrow we'll go out and about in 美濃. If you can bear to, stay a few more days."
    sx: {hanzi: "天光日𫣆兜去美濃遶尞。你係盼得，就多歇幾日。", pinyin: "tienˊ gongˊ ngidˋ enˊ deuˊ hi miˊ nungˇ lauˊ liau. nˇ he pan dedˋ, qiu doˊ hiedˋ giˋ ngidˋ."}
    check: true
  - n: 23
    speaker: Sam
    en: "Thank you. Term starts next week. Whatever there is to say, I'll come back and we'll talk face to face."
    sx: {hanzi: "恁仔細。下禮拜愛開學吔。有麼个話，𠊎再來同你當面講。", pinyin: "anˋ ziiˋ se. ha liˊ bai oi koiˊ hog leˊ. iuˊ maˋ ge fa, ngaiˇ zai loiˇ tungˇ nˇ dongˊ mien gongˋ."}
    check: true

