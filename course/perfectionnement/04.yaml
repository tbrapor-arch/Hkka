  - en: Can you explain it to me?
    source: kaga115
    sx: {hanzi: 做得解釋分𠊎聽無？, pinyin: 'zo dedˋ gieˋ siidˋ bunˊ ngaiˇ tangˊ moˇ?'}
  - en: Mainly, he doesn't like reading.
    sx: {hanzi: 主要係佢無愛讀書。, pinyin: zuˋ ieu he giˇ moˇ oi tug suˊ.}
  - en: Be quiet when you go into the library.
    source: kaga115
    sx: {hanzi: 入去圖書館愛細聲。, pinyin: ngib hi tuˇ suˊ gonˋ oi se sangˊ.}
  - en: This bookshop sells every kind of book.
    source: kaga115
    sx: {hanzi: 這間書店麼个書都有賣。, pinyin: iaˋ gienˊ suˊ diam maˋ ge suˊ du iuˊ mai.}
