id: 4
genre: interview
title:
  en: The magpie teaching the mynah
  sx: {hanzi: 阿鵲教烏鷯, pinyin: aˊ xiagˋ gauˊ vuˊ liau}
review: false
setting: Saturday 29 July 2028, at the Lius'. A-min's summer homework is to interview someone and write it up; he has picked
  Sam. He reads his questions from a notebook and records the answers on his phone. In September he starts senior high school.
names: [Sam, 阿明, 阿婆, 阿英, 苗栗, 聯合大學, 法國, 臺灣, 臺北]
dialogue:
- n: 1
  speaker: 阿明
  en: Sam, my holiday homework is to interview someone and write a piece about it. Can I interview you?
  sx: {hanzi: Sam，𠊎个暑假作業係訪問一個人，寫一篇文章。𠊎做得訪問你無？, pinyin: 'Sam, ngaiˇ ge cuˋ gaˋ zogˋ ngiab he fongˋ mun idˋ ge nginˇ, xiaˋ
      idˋ pienˊ vunˇ zongˊ. ngaiˇ zo dedˋ fongˋ mun nˇ moˇ?'}
- n: 2
  speaker: 阿明
  en: 'First question: what made you want to learn Hakka?'
  sx: {hanzi: 第一隻問題：你仰會想學客話？, pinyin: 'ti idˋ zagˋ mun tiˇ: nˇ ngiongˋ voi xiongˋ hog hagˋ fa?'}
- n: 3
  speaker: Sam
  en: In Taipei I heard A-in speaking Hakka. It sounded really lovely, so I started learning.
  sx: {hanzi: 𠊎在臺北聽著阿英講客話，十分好聽，就開始學。, pinyin: 'ngaiˇ coiˊ toiˇ bedˋ tangˊ doˋ aˊ inˊ gongˋ hagˋ fa, siib funˊ hoˋ tangˊ,
      qiu koiˊ ciiˋ hog.'}
- n: 4
  speaker: 阿明
  en: What's difficult about learning Hakka?
  sx: {hanzi: 學客話有麼个困難？, pinyin: 'hog hagˋ fa iuˊ maˋ ge kun nanˇ?'}
- n: 5
  speaker: Sam
  en: Mainly the tones. And there are also some words you can't find in the textbook.
  sx: {hanzi: 主要係聲調。還有兜字課本肚尋毋著。, pinyin: 'zuˋ ieu he sangˊ tiau. hanˇ iuˊ deuˊ sii ko bunˋ duˋ qimˇ mˇ doˋ.'}
- n: 6
  speaker: 阿明
  en: What's your method for learning Hakka?
  sx: {hanzi: 你學客話个方法係麼个？, pinyin: 'nˇ hog hagˋ fa ge fongˊ fabˋ he maˋ ge?'}
- n: 7
  speaker: Sam
  en: 'I''ve got two: one, read the lesson aloud every day; two, talk to people, and never mind getting it wrong.'
  sx: {hanzi: 𠊎有兩隻方法：第一，逐日朗讀課文；第二，同人講話，講毋對乜毋怕。, pinyin: 'ngaiˇ iuˊ liongˋ zagˋ fongˊ fabˋ: ti idˋ, dagˋ ngidˋ long tug ko
      vunˇ; ti ngi, tungˇ nginˇ gongˋ fa, gongˋ mˇ dui me mˇ pa.'}
- n: 8
  speaker: 阿明
  en: Is there any way to get the tones right?
  sx: {hanzi: 聲調有麼个辦法學好？, pinyin: 'sangˊ tiau iuˊ maˋ ge pan fabˋ hog hoˋ?'}
- n: 9
  speaker: Sam
  en: 'No other way: listen every day, speak every day.'
  sx: {hanzi: 無其他个辦法，就係逐日聽，逐日講。, pinyin: 'moˇ kiˇ taˊ ge pan fabˋ, qiu he dagˋ ngidˋ tangˊ, dagˋ ngidˋ gongˋ.'}
- n: 10
  speaker: 阿明
  en: What are the classes like at 聯合大學?
  sx: {hanzi: 聯合大學个課仰般？, pinyin: 'lienˇ hab tai hog ge ko ngiongˋ banˊ?'}
- n: 11
  speaker: Sam
  en: Term doesn't start till September. They say the classes go into a lot of detail, and the teachers explain in Hakka.
  sx: {hanzi: 九月正開學。聽講上課當詳細，先生會用客話解釋。, pinyin: 'giuˋ ngied zang koiˊ hog. tangˊ gongˋ song ko dongˊ xiongˇ se, xinˊ sangˊ
      voi iung hagˋ fa gieˋ siidˋ.'}
- n: 12
  speaker: 阿明
  en: When you were at primary school, what kind of pupil were you?
  sx: {hanzi: 你讀小學个時節，係仰般个學生仔？, pinyin: 'nˇ tug seuˋ hog ge siiˇ jiedˋ, he ngiongˋ banˊ ge hog sangˊ eˋ?'}
- n: 13
  speaker: Sam
  en: My marks weren't great. I didn't want to study; all I liked was playing football.
  sx: {hanzi: 𠊎个成績毋理想。𠊎無愛讀書，淨好踢足球。, pinyin: 'ngaiˇ ge siinˇ jidˋ mˇ liˊ xiongˋ. ngaiˇ moˇ oi tug suˊ, qiang hau tedˋ jiugˋ kiuˇ.'}
- n: 14
  speaker: 阿明
  en: Just like me!
  sx: {hanzi: 同𠊎共樣！, pinyin: tungˇ ngaiˇ kiung iong!}
- n: 15
  speaker: Sam
  en: It was only at senior high that I came to like studying. I was always in the library, and I liked going to bookshops
    too.
  sx: {hanzi: 讀高中，𠊎正好讀書。𠊎輒輒去圖書館，乜好去書店看書。, pinyin: 'tug goˊ zungˊ, ngaiˇ zang hau tug suˊ. ngaiˇ jiab jiab hi tuˇ suˊ gonˋ,
      me hau hi suˊ diam kon suˊ.'}
- n: 16
  speaker: 阿明
  en: When term starts in September I'll be a first-year at senior high. What's different between schools in France and
    in Taiwan?
  sx: {hanzi: 九月開學，𠊎就係高中一年生吔。法國个學校同臺灣个有麼个毋共樣？, pinyin: 'giuˋ ngied koiˊ hog, ngaiˇ qiu he goˊ zungˊ idˋ ngienˇ senˊ leˊ.
      fabˋ guedˋ ge hog gauˋ tungˇ toiˇ vanˇ ge iuˊ maˋ ge mˇ kiung iong?'}
- n: 17
  speaker: Sam
  en: I'm no expert on that side of things; I can only tell you my own experience.
  sx: {hanzi: 這方面𠊎毋係專家，淨講𠊎個人个經驗。, pinyin: 'iaˋ fongˊ mien ngaiˇ mˇ he zonˊ gaˊ, qiang gongˋ ngaiˇ ge nginˇ ge ginˊ ngiam.'}
- n: 18
  speaker: Sam
  en: When I was at school, there were no classes on Wednesday afternoons; we were free and could go to the sports ground and play football.
  sx: {hanzi: 𠊎讀書个時節，禮拜三下晝無上課，學生仔當自由，做得去運動坪踢球。, pinyin: 'ngaiˇ tug suˊ ge siiˇ jiedˋ, liˊ bai samˊ haˊ zu moˇ song ko, hog sangˊ eˋ dongˊ cii iuˇ, zo dedˋ hi
      iun tung piangˇ tedˋ kiuˇ.'}
- n: 19
  speaker: 阿明
  en: Not like Taiwan! In the afternoons we've still got cram school. I don't want to go, but there's nothing I can do about
    it.
  sx: {hanzi: 臺灣就毋係恁樣！𠊎兜下晝還愛去補習。𠊎無愛去，毋過無法度。, pinyin: 'toiˇ vanˇ qiu mˇ he anˋ ngiongˇ! ngaiˇ deuˊ haˊ zu hanˇ oi hi buˋ
      xib. ngaiˇ moˇ oi hi, mˇ go moˇ fabˋ tu.'}
- n: 20
  speaker: Sam
  en: 'Education in Taiwan and in France is different; each has its own good points. Make use of the holidays: you can read
    a bit more.'
  sx: {hanzi: 臺灣个教育同法國个毋共樣，各有各个好。利用避暑，你做得讀加兜仔書。, pinyin: 'toiˇ vanˇ ge gau iugˋ tungˇ fabˋ guedˋ ge mˇ kiung iong, gogˋ
      iuˊ gogˋ ge hoˋ. li iung pidˋ cuˋ, nˇ zo dedˋ tug gaˊ deuˊ eˋ suˊ.'}
  check: true
- n: 21
  speaker: 阿明
  en: What's your dream?
  sx: {hanzi: 你个理想係麼个？, pinyin: 'nˇ ge liˊ xiongˋ he maˋ ge?'}
- n: 22
  speaker: Sam
  en: 'My dream: one day to give a talk in Hakka, and present my research in front of everyone.'
  sx: {hanzi: 𠊎个理想：有一日用客話講演，在大家面前發表𠊎个研究。, pinyin: 'ngaiˇ ge liˊ xiongˋ: iuˊ idˋ ngidˋ iung hagˋ fa gongˋ ienˊ, coiˊ tai
      gaˊ mien qienˇ fadˋ beuˋ ngaiˇ ge ngienˇ giu.'}
- n: 23
  speaker: 阿明
  en: And after that?
  sx: {hanzi: 續等呢？, pinyin: 'sa denˋ neˇ?'}
- n: 24
  speaker: Sam
  en: 'After that… I''d like to teach in France: teach people to speak Hakka.'
  sx: {hanzi: 續等……想在法國教書，教人講客話。, pinyin: 'sa denˋ … xiongˋ coiˊ fabˋ guedˋ gauˊ suˊ, gauˊ nginˇ gongˋ hagˋ fa.'}
- n: 25
  speaker: 阿明
  en: Could you teach me French, in Hakka?
  sx: {hanzi: 你做得用客話教𠊎法國話無？, pinyin: 'nˇ zo dedˋ iung hagˋ fa gauˊ ngaiˇ fabˋ guedˋ fa moˇ?'}
- n: 26
  speaker: Sam
  en: Me? That would be the magpie teaching the mynah!
  sx: {hanzi: 𠊎？該就係阿鵲教烏鷯哦。, pinyin: 'ngaiˇ? ge qiu he aˊ xiagˋ gauˊ vuˊ liau oˊ.'}
- n: 27
  speaker: 阿明
  en: Never mind! You teach, I'll learn. I've got a blackboard and a duster in my room.
  sx: {hanzi: 毋怕！你教，𠊎學。吾房間有粉牌同粉捽仔。, pinyin: 'mˇ pa! nˇ gauˊ, ngaiˇ hog. ngaˊ fongˇ gienˊ iuˊ funˋ paiˇ tungˇ funˋ cud eˋ.'}
- n: 28
  speaker: Sam
  en: '(at the blackboard) Lesson one: the alphabet. A, B, C.'
  sx: {hanzi: 第一課：字母。A、B、C。, pinyin: 'ti idˋ ko: sii muˊ. A, B, C.'}
- n: 29
  speaker: 阿明
  en: That's easy! I'll come top!
  sx: {hanzi: 恁簡單！𠊎會打第一！, pinyin: anˋ gienˋ danˊ! ngaiˇ voi daˋ ti idˋ!}
- n: 30
  speaker: 阿明
  en: (switching off the recorder) And in my piece, you're the main character.
  sx: {hanzi: 𠊎个文章，主角就係你哦。, pinyin: 'ngaiˇ ge vunˇ zongˊ, zuˋ gogˋ qiu he nˇ oˊ.'}
notes:
- ref: 0
  topic: culture
  text: >
    The title is a saying from the official lists (高級): 阿鵲教烏鷯 "the magpie teaching the mynah", said of someone who sets
    up as a teacher without having mastered the subject. Sam uses it on himself in line 26.
- ref: 1
  topic: vocab
  text: >
    避暑作業 "summer homework" (避暑, 進修 1). 訪問 fongˋ mun "interview" (佢訪問个對象係專家 "the person he interviewed is an expert"). 篇
    pienˊ (lesson 94) counts pieces of writing.
- ref: 2
  topic: vocab
  text: >
    第一隻問題 "the first question": 問題 (lesson 74) takes 隻 or 個 (這隻問題, 這個問題 in the official sentences), not 條.
- ref: 3
  topic: vocab
  text: >
    十分 siib funˊ "very, extremely", more formal than 當 (心肚十分憂傷 "deeply sad at heart").
- ref: 5
  topic: grammar
  text: >
    主要 zuˋ ieu "mainly" (活動主要係佢負責 "he is mainly in charge of the event"); 還有兜字 "there are also some words". 尋毋著 "can't
    find": V毋著 (doˋ) is "not manage to V" (checklist).
- ref: 7
  topic: grammar
  text: >
    講毋對 "say it wrong": V毋對 is "do V wrong", unlike V毋著 (line 5). 毋怕 "never mind" (進修 1). 課文 ko vunˇ "the text of a lesson"
    (先生喊佢企起來唸課文 "the teacher had him stand up and read the lesson").
- ref: 11
  topic: vocab
  text: >
    聽講 tangˊ gongˋ "I hear that, they say" (used since lesson 32, declared here). 上課 song ko "have class, go to class". 詳細 xiongˇ se "detailed, thorough". 解釋 gieˋ siidˋ "explain" (做得解釋分𠊎聽無？ "can you
    explain it to me?").
- ref: 13
  topic: grammar
  text: >
    成績毋理想 "my marks weren't great" is an official phrase (佢這擺个成績毋理想; 理想 is also "dream",
    line 21). 好 hau + verb is "like doing" (淨好踢足球 "all he liked was playing football"); 好 hoˋ is "good". Line 15 has it twice.
- ref: 16
  topic: vocab
  text: >
    一年生 idˋ ngienˇ senˊ "first-year pupil"; 二年生 "second year", and so on (你這下幾多年生？ "what year are you in now?").
- ref: 17
  topic: vocab
  text: >
    方面 fongˊ mien "aspect, side" (佢係氣象方面个專家 "he's a weather expert"). 個人 ge nginˇ "personal; individual". 經驗 "experience"
    (lesson 74).
- ref: 18
  topic: vocab
  text: >
    運動坪 iun tung piangˇ "sports ground" (坪 "flat ground", as in 廟坪 "temple square").
- ref: 19
  topic: vocab
  text: >
    無法度 moˇ fabˋ tu "there's nothing for it, it can't be helped". 辦法 pan fabˋ (line 8) is "a way, a solution" (敢有解決个辦法？
    "is there any solution?"); 其他 kiˇ taˊ "other".
- ref: 20
  topic: vocab
  text: >
    利用 li iung "make use of" (時間有限，愛好好來利用正好 "time is short: use it well"). With a stretch of time as its object the line
    is our own; marked for a native speaker. 各有各个好 "each has its good side" follows the official
    各有各个職務; 讀加兜仔書 "read a bit more", with 加 after the verb.
- ref: 22
  topic: false-friend
  text: >
    講演 gongˋ ienˊ "give a talk, speech" is Mandarin 演講 in reverse (講演比賽 "speech contest"). 發表 fadˋ beuˋ "present, publish"
    (發表研究成果).
- ref: 24
  topic: vocab
  text: >
    教書 gauˊ suˊ "teach (as a profession)" (這擺總算分佢考著教書先生 "this time he finally passed the exam to be a teacher"); 教 gauˊ
    "teach", 教育 gau iugˋ "education" (line 20), with 教 in another tone.
- ref: 27
  topic: vocab
  text: >
    粉牌 funˋ paiˇ "blackboard", 粉捽仔 funˋ cud eˋ "board duster": both from the official sentence 粉牌恁屙糟，粉捽仔拿來捽淨 "the blackboard's
    filthy: get the duster and wipe it clean". 捽 "wipe" (lesson 54).
- ref: 29
  topic: vocab
  text: >
    打第一 daˋ ti idˋ "come first" (這擺比賽佢打第一 "he came first this time").
- ref: 30
  topic: vocab
  text: >
    主角 zuˋ gogˋ "the main character, the lead" (in a play or a story).
