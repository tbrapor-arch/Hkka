exercises:
  translate:
    - en: "Elect a president."
      source: kaga115
      sx: {hanzi: "選總統。", pinyin: "xienˋ zungˋ tungˋ."}
    - en: "Requisition land."
      source: kaga115
      sx: {hanzi: "徵收土地。", pinyin: "ziinˊ suˊ tuˋ ti."}
    - en: "No smoking in public places."
      source: kaga115
      sx: {hanzi: "公共場所做毋得食菸。", pinyin: "gungˊ kiung congˇ soˋ zomˇ dedˋ siid ienˊ."}
    - en: "Of all my aunts, the youngest is the prettiest."
      source: kaga115
      sx: {hanzi: "恁多阿姨肚，滿姨最靚。", pinyin: "anˋ doˊ aˊ iˇ duˋ, manˊ iˇ zui jiangˊ."}
    - en: "My legs were so weak that halfway there I could walk no further."
      source: kaga115
      sx: {hanzi: "腳當軟，到半站仔就行毋停動吔。", pinyin: "giogˋ dongˊ ngionˊ, do ban cam eˋ qiu hangˇ mˇ tinˇ tungˊ leˊ."}
  fill:
    - en: "One painting."
      sx: {hanzi: "一___畫。", pinyin: "idˋ ___ fa.", answer_hanzi: "幅", answer: "bugˋ"}
    - en: "This material was provided by the boss."
      sx: {hanzi: "這資料係頭家___个。", pinyin: "iaˋ ziiˊ liau he teuˇ gaˊ ___ ge.", answer_hanzi: "提供", answer: "tiˇ giungˊ"}
    - en: "By comparison it saves money."
      sx: {hanzi: "___來講較省錢。", pinyin: "___ loiˇ gongˋ ka sangˋ qienˇ.", answer_hanzi: "相對", answer: "xiongˊ dui"}
    - en: "Some people are very particular about their clothes, and some are very careless."
      sx: {hanzi: "有人著衫當___，有人盡儘採。", pinyin: "iuˊ nginˇ zogˋ samˊ dongˊ ___, iuˊ nginˇ qin qinˋ caiˋ.", answer_hanzi: "講究", answer: "gongˋ giu"}
    - en: "He has to attend the training for new students."
      sx: {hanzi: "佢愛參加新生___。", pinyin: "giˇ oi camˊ gaˊ xinˊ senˊ ___.", answer_hanzi: "訓練", answer: "hiun lien"}

