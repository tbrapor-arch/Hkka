      source: kaga115
      sx: {hanzi: "這屋仔正兩棧樓定定。", pinyin: "iaˋ vugˋ eˇ zang liongˋ zan leuˇ tin tin."}
    - en: "He is a practised hand at catching chickens."
      source: kaga115
