    sx: {hanzi: 喊人老貨仔當無禮貌。, pinyin: ham nginˇ loˋ fo eˋ dongˊ moˇ liˊ mau.}
  - en: Keep livestock.
    source: kaga115
    sx: {hanzi: 畜頭牲。, pinyin: hiugˋ teuˇ sangˊ.}
  - en: He didn't do as he was told, and Mum punished him.
    sx: {hanzi: 佢毋聽話，分阿姆罰。, pinyin: 'giˇ mˇ tangˊ fa, bunˊ aˊ meˊ fad.'}
  - en: I told you long ago, but you wouldn't believe it.
    sx: {hanzi: 早就同你講過，你就毋信。, pinyin: 'zoˋ qiu tungˇ nˇ gongˋ go, nˇ qiu mˇ xin.'}
  - en: On the ninth of the ninth month, everyone goes up the hills.
    sx: {hanzi: 九月初九，大家就去爬山。, pinyin: 'giuˋ ngied cuˊ giuˋ, tai gaˊ qiu hi paˇ sanˊ.'}
