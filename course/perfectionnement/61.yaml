exercises:
  translate:
    - en: "Buy an envelope."
      source: kaga115
      sx: {hanzi: "買一隻信袋仔。", pinyin: "maiˊ idˋ zagˋ xin toi eˋ."}
    - en: "In the past nobody dared say such a thing."
      sx: {hanzi: "往擺無人敢恁樣講。", pinyin: "vongˊ baiˋ moˇ nginˇ gamˋ anˋ ngiongˇ gongˋ."}
    - en: "I ran into him in the street today."
      source: kaga115
      sx: {hanzi: "今晡日𠊎在街項堵著佢。", pinyin: "gimˊ buˊ ngidˋ ngaiˇ coiˊ gieˊ hong duˇ doˋ giˇ."}
    - en: "After the New Year he resigned."
      source: kaga115
      sx: {hanzi: "年過忒佢就辭職哩。", pinyin: "ngienˇ go tedˋ giˇ qiu ciiˇ ziidˋ leˊ."}
    - en: "He asked the driver to take him to the hotel."
      source: kaga115
      sx: {hanzi: "佢請司機駛車仔載佢去飯店。", pinyin: "giˇ qiangˋ siiˊ giˊ siiˋ caˊ eˋ zai giˇ hi fan diam."}
  fill:
    - en: "Sit beside me and I'll teach you maths."
      sx: {hanzi: "你坐吾___，𠊎教你數學。", pinyin: "nˇ coˊ ngaˊ ___, ngaiˇ gauˊ nˇ su hog.", answer_hanzi: "側膁", answer: "zedˋ iamˋ"}
    - en: "These sweets are imported: they are dear."
      sx: {hanzi: "這糖仔係___个，當貴食。", pinyin: "iaˋ tongˇ eˋ he ___ ge, dongˊ gui siid.", answer_hanzi: "進口", answer: "jin kieuˋ"}
    - en: "It is the first time I have eaten this dish."
      sx: {hanzi: "___食著這品菜。", pinyin: "___ siid doˋ iaˋ pinˋ coi.", answer_hanzi: "頭到", answer: "teuˇ do"}
    - en: "At least he is still very well-behaved."
      sx: {hanzi: "___佢還異乖。", pinyin: "___ giˇ hanˇ i guaiˊ.", answer_hanzi: "至少", answer: "zii seuˋ"}
    - en: "He is very lucky: he wins something in every draw."
      sx: {hanzi: "佢運氣當好，擺擺就抽___。", pinyin: "giˇ iun hi dongˊ hoˋ, baiˋ baiˋ qiu cuˊ ___.", answer_hanzi: "著獎", answer: "cog jiongˋ"}

