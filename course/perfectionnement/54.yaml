exercises:
  translate:
    - en: "Three times five is fifteen."
      source: kaga
      sx: {hanzi: "三乘五係十五。", pinyin: "samˊ siin ngˋ he siib ngˋ."}
    - en: "A debt should not be carried past the New Year."
      source: kaga115
      sx: {hanzi: "欠數毋好欠過年。", pinyin: "kiam sii mˇ hoˋ kiam go ngienˇ."}
    - en: "My elder brother is a clerk at a school."
      source: kaga115
      sx: {hanzi: "阿哥在學校做職員。", pinyin: "aˊ goˊ coiˊ hog gauˋ zo ziidˋ ienˇ."}
    - en: "The typhoon blew the signboard to the end of the street."
      source: kaga115
      sx: {hanzi: "風搓同看板吹到街尾。", pinyin: "fungˊ caiˊ tungˇ kanˊ bangˋ coiˊ do gieˊ miˊ."}
    - en: "He won the first prize this time: he really is lucky."
      source: kaga115
      sx: {hanzi: "佢得著這擺个頭獎，實在當幸運。", pinyin: "giˇ dedˋ doˋ iaˋ baiˋ ge teuˇ jiongˋ, siid cai dongˊ hen iun."}
  fill:
    - en: "Taxes are paid in May."
      sx: {hanzi: "五月愛___。", pinyin: "ngˋ ngied oi ___.", answer_hanzi: "納稅", answer: "nab soi"}
    - en: "Go and get some small change from the shopkeeper."
      sx: {hanzi: "去同頭家換兜仔___。", pinyin: "hi tungˇ teuˇ gaˊ von deuˊ eˋ ___.", answer_hanzi: "零錢", answer: "langˇ qienˇ"}
    - en: "The boss has come to collect what you owe."
      sx: {hanzi: "頭家來尋你___。", pinyin: "teuˇ gaˊ loiˇ qimˇ nˇ ___.", answer_hanzi: "收數", answer: "suˊ sii"}
    - en: "Your homework isn't done properly: the teacher is sure to take marks off."
      sx: {hanzi: "若家庭作業無做好，定著會分先生___分。", pinyin: "ngiaˊ gaˊ tinˇ zogˋ ngiab moˇ zo hoˋ, tin cog voi bunˊ xinˊ sangˊ ___ funˊ.", answer_hanzi: "扣", answer: "kieu"}
    - en: "It hasn't rained for so long that the river level has dropped a great deal."
      sx: {hanzi: "恁久無落雨，河壩水位___異多。", pinyin: "anˋ giuˋ moˇ log iˋ, hoˇ ba suiˋ vi ___ i doˊ.", answer_hanzi: "降低", answer: "gong daiˊ"}

