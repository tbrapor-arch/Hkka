    - en: "Tonight I have to do overtime."
      sx: {hanzi: "暗晡夜愛___。", pinyin: "am buˊ ia oi ___.", answer_hanzi: "加班", answer: "gaˊ banˊ"}
    - en: "A stack of bowls."
      sx: {hanzi: "一___碗。", pinyin: "idˋ ___ vonˋ.", answer_hanzi: "落", answer: "labˋ"}
    - en: "There are a thousand grams in a kilogram."
      sx: {hanzi: "一公斤有一千___。", pinyin: "idˋ gungˊ ginˊ iuˊ idˋ qienˊ ___.", answer_hanzi: "克", answer: "kiedˋ"}
    - en: "This knife is very sharp: hold it carefully."
      sx: {hanzi: "這刀仔當___，愛擎好。", pinyin: "iaˋ doˊ eˋ dongˊ ___, oi kiaˇ hoˋ.", answer_hanzi: "利", answer: "li"}

