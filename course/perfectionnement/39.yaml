exercises:
  translate:
    - en: "There is a convenience store on the corner."
      source: kaga115
      sx: {hanzi: "轉角有一間便利商店。", pinyin: "zonˋ gogˋ iuˊ idˋ gienˊ pien li songˊ diam."}
    - en: "This chef is a very good cook."
      source: kaga115
      sx: {hanzi: "這廚師異會煮食。", pinyin: "iaˋ cuˇ siiˊ i voi zuˋ siid."}
    - en: "Every country uses a different currency."
      source: kaga115
      sx: {hanzi: "逐國用个貨幣無共樣。", pinyin: "dagˋ guedˋ iung ge fo bi moˇ kiung iong."}
    - en: "A great many tourists come to Taiwan."
      source: kaga115
      sx: {hanzi: "來臺灣尞个旅客當多。", pinyin: "loiˇ toiˇ vanˇ liau ge liˊ hagˋ dongˊ doˊ."}
    - en: "She is the accountant of this company."
      source: kaga
      sx: {hanzi: "佢在這間公司做會計。", pinyin: "giˇ coiˊ iaˋ gienˊ gungˊ siiˊ zo fi gie."}
  fill:
