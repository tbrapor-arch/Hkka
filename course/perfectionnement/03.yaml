exercises:
  translate:
    - en: "A rainbow in the east means fine weather."
      source: kaga115
      sx: {hanzi: "東片出天弓會好天。", pinyin: "dungˊ pienˋ cudˋ tienˊ giungˊ voi hoˋ tienˊ."}
    - en: "Grandpa netted these shrimps in the stream."
      sx: {hanzi: "這兜蝦公係阿公在溪項撈个。", pinyin: "iaˋ deuˊ haˇ gungˊ he aˊ gungˊ coiˊ haiˊ hong leuˇ ge."}
    - en: "This bird has hurt its wing and can't fly."
      source: kaga115
      sx: {hanzi: "這鳥仔翼胛著傷，飛毋起來。", pinyin: "iaˋ diauˊ eˋ id gabˋ cog songˊ, biˊ mˇ hiˋ loiˇ."}
    - en: "Caterpillars turn into lovely butterflies."
      source: kaga115
      sx: {hanzi: "虐毛蟲會變到靚靚个揚蝶仔。", pinyin: "ngiogˋ moˊ cungˇ voi bien do jiangˊ jiangˊ ge iongˇ iag eˋ."}
    - en: "He meant to go, but in the end he didn't."
      source: kaga115
      sx: {hanzi: "本成愛去，背尾無去。", pinyin: "bunˋ sangˇ oi hi, boi miˊ moˇ hi."}
  fill:
    - en: "The rainbow is in the west."
      sx: {hanzi: "___在西片。", pinyin: "___ coiˊ xiˊ pienˋ.", answer_hanzi: "天弓", answer: "tienˊ giungˊ"}
    - en: "You're so greedy!"
      sx: {hanzi: "你恁___！", pinyin: "nˇ anˋ ___!", answer_hanzi: "貪", answer: "tamˊ"}
    - en: "In the end he lost his temper."
      sx: {hanzi: "背尾還係___吔。", pinyin: "boi miˊ hanˇ he ___ leˊ.", answer_hanzi: "發譴", answer: "fadˋ kienˋ"}
