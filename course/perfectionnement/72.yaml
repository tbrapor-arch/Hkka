exercises:
  translate:
    - en: "He is rather conservative."
      source: kaga115
      sx: {hanzi: "佢這儕人較保守。", pinyin: "giˇ iaˋ saˇ nginˇ ka boˋ suˋ."}
    - en: "Oil is getting dearer and dearer."
      sx: {hanzi: "石油緊來緊貴。", pinyin: "sag iuˇ ginˋ loiˇ ginˋ gui."}
    - en: "Uncle wants to understand French taste further."
      sx: {hanzi: "阿舅想愛進一步了解法國人个口味。", pinyin: "aˊ kiuˊ xiongˋ oi jin idˋ pu liauˋ gieˋ fabˋ guedˋ nginˇ ge heuˋ mi."}
    - en: "This leather bag is very hard-wearing."
      sx: {hanzi: "這隻皮包仔當耐用。", pinyin: "iaˋ zagˋ piˇ bauˊ eˋ dongˊ nai iung."}
    - en: "Half the customers who came were young people."
      sx: {hanzi: "來个人客，半額係後生人。", pinyin: "loiˇ ge nginˇ hagˋ, ban ngiagˋ he heu sangˊ nginˇ."}
  fill:
    - en: "Barred from leaving the country."
      sx: {hanzi: "限制___。", pinyin: "han zii ___.", answer_hanzi: "出境", answer: "cudˋ gin"}
    - en: "His research won everyone's recognition."
      sx: {hanzi: "厥研究受著大家个___。", pinyin: "giaˊ ngienˇ giu su cog tai gaˊ ge ___.", answer_hanzi: "肯定", answer: "kienˋ tin"}
    - en: "Uncle didn't ask again."
      sx: {hanzi: "阿舅無___問。", pinyin: "aˊ kiuˊ moˇ ___ mun.", answer_hanzi: "𫝘過", answer: "ang go"}
    - en: "Not learning the good things, but copying people who take drugs!"
      sx: {hanzi: "好个毋學，學人___！", pinyin: "hoˋ ge mˇ hog, hog nginˇ ___!", answer_hanzi: "食毒", answer: "siid tug"}
    - en: "Some people don't like the gamey smell of mutton."
      sx: {hanzi: "有兜人驚羊肉___。", pinyin: "iuˊ deuˊ nginˇ giangˊ iongˇ ngiugˋ ___.", answer_hanzi: "臭臊", answer: "cu soˊ"}

