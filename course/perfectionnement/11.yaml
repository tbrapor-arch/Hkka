    source: kaga115
    sx: {hanzi: 燕仔在屋簷下做竇。, pinyin: ien eˋ coiˊ vugˋ iamˇ haˊ zo deu.}
  - en: Cocks crow; hens don't.
    source: kaga115
    sx: {hanzi: 雞公會啼，雞嫲毋會啼。, pinyin: 'gieˊ gungˊ voi taiˇ, gieˊ maˇ mˇ voi taiˇ.'}
  - en: The scent of osmanthus is very alluring.
    source: kaga115
    sx: {hanzi: 桂花个香味當餳人。, pinyin: gui faˊ ge hiongˊ mi dongˊ xiangˇ nginˇ.}
  - en: Every year in March or April, swallows come and nest under our eaves.
    source: kaga
    sx: {hanzi: 逐年三、四月仔，吾屋簷下就會有燕仔來做竇。, pinyin: 'dagˋ ngienˇ samˊ, xi ngied eˋ, ngaˊ vugˋ iamˇ haˊ qiu voi iuˊ ien eˋ loiˇ zo deu.'}
  - en: The plant Dad grafted has put out new shoots.
    source: kaga115
    sx: {hanzi: 阿爸接个花樹過枝綻筍吔。, pinyin: aˊ baˊ jiabˋ ge faˊ su go giˊ can sunˋ leˊ.}
