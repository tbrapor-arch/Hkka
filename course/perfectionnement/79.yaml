exercises:
  translate:
    - en: "The two of them are going into partnership to open a convenience store."
      source: kaga115
      sx: {hanzi: "佢兩儕鬥股，愛開一間便利商店。", pinyin: "giˇ liongˋ saˇ deu guˋ, oi koiˊ idˋ gienˊ pien li songˊ diam."}
