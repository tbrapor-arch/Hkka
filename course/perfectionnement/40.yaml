exercises:
  translate:
    - en: "The spine grows bone spurs."
      source: kaga115
      sx: {hanzi: "龍骨生骨刺。", pinyin: "liungˇ gudˋ sangˊ gudˋ qiugˋ."}
    - en: "He is lame because he was in a car accident some time ago."
      source: kaga115
      sx: {hanzi: "佢因為上擺出車禍，故所正會跛腳。", pinyin: "giˇ inˊ vi song baiˋ cudˋ caˊ fo, gu soˋ zang voi baiˊ giogˋ."}
    - en: "You often hear his voice."
      source: kaga115
      sx: {hanzi: "不時會聽著厥聲。", pinyin: "budˋ siiˇ voi tangˊ doˋ giaˊ sangˊ."}
    - en: "He meant to harm someone and harmed himself instead."
      source: kaga115
      sx: {hanzi: "想害人顛倒害著自家。", pinyin: "xiongˋ hoi nginˇ dienˊ do hoi doˋ qi gaˊ."}
    - en: "His reactions are very quick."
      source: kaga115
      sx: {hanzi: "厥反應當遽。", pinyin: "giaˊ fanˋ in dongˊ giagˋ."}
  fill:
    - en: "The skull is very hard."
      sx: {hanzi: "頭那殼當___。", pinyin: "teuˇ naˇ hogˋ dongˊ ___.", answer_hanzi: "硬", answer: "ngang"}
    - en: "The two of them have nothing much to say to each other."
