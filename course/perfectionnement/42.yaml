      source: kaga115
      sx: {hanzi: "買東西愛撿錢分人。", pinyin: "maiˊ dungˊ xiˊ oi giamˋ qienˇ bunˊ nginˇ."}
    - en: "Go out and see the country."
      source: kaga115
      sx: {hanzi: "出去遶光景。", pinyin: "cudˋ hi lauˊ gongˊ ginˋ."}
    - en: "She is the school's accountant."
      source: kaga115
      sx: {hanzi: "佢在學校做會計。", pinyin: "giˇ coiˊ hog gauˋ zo fi gie."}
    - en: "These vegetables have been sprayed."
      source: kaga115
      sx: {hanzi: "這菜有洩藥仔。", pinyin: "iaˋ coi iuˊ xied iog eˋ."}
    - en: "Split firewood."
      source: kaga115
      sx: {hanzi: "破樵。", pinyin: "po ceuˇ."}
