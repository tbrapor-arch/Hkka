      sx: {hanzi: "阿爸逐日___，當無閒。", pinyin: "aˊ baˊ dagˋ ngidˋ ___, dongˊ moˇ hanˇ.", answer_hanzi: "加班", answer: "gaˊ banˊ"}
    - en: "Don't get too close to him."
      sx: {hanzi: "毋好同佢行忒___。", pinyin: "mˇ hoˋ tungˇ giˇ hangˇ tedˋ ___.", answer_hanzi: "兼", answer: "giamˊ"}
