exercises:
  translate:
    - en: "The minister of education."
      source: kaga115
      sx: {hanzi: "教育部長。", pinyin: "gau iugˋ pu zongˋ."}
    - en: "National policy."
      source: kaga115
      sx: {hanzi: "國家政策。", pinyin: "guedˋ gaˊ ziin cedˋ."}
    - en: "This singer used to be very famous."
      source: kaga115
      sx: {hanzi: "這歌星頭擺當有名。", pinyin: "iaˋ goˊ senˊ teuˇ baiˋ dongˊ iuˊ miangˇ."}
    - en: "He is a manager in this department."
      source: kaga115
      sx: {hanzi: "佢在這個部門做經理。", pinyin: "giˇ coiˊ iaˋ ge pu munˇ zo ginˊ liˊ."}
    - en: "Soldiers all have to learn to shoot."
      source: kaga
      sx: {hanzi: "軍人都愛學打銃仔。", pinyin: "giunˊ nginˇ du oi hog daˋ cung eˋ."}
  fill:
    - en: "When he was called up he drew the army."
      sx: {hanzi: "做兵抽著___。", pinyin: "zo binˊ cuˊ doˋ ___.", answer_hanzi: "陸軍", answer: "liug giunˊ"}
    - en: "An air base."
      sx: {hanzi: "___基地。", pinyin: "___ giˊ ti.", answer_hanzi: "空軍", answer: "kungˊ giunˊ"}
    - en: "If your maths is poor, you must practise harder!"
      sx: {hanzi: "數學毋好斯愛___練習！", pinyin: "su hog mˇ hoˋ siiˇ oi ___ lien xib!", answer_hanzi: "加強", answer: "gaˊ kiongˇ"}
    - en: "In life and in work one must have morals."
      sx: {hanzi: "做人做事愛有___。", pinyin: "zo nginˇ zo se oi iuˊ ___.", answer_hanzi: "道德", answer: "to dedˋ"}
    - en: "She teaches at a primary school."
      sx: {hanzi: "佢在___小學教書。", pinyin: "giˇ coiˊ ___ seuˋ hog gauˊ suˊ.", answer_hanzi: "國民", answer: "guedˋ minˇ"}

