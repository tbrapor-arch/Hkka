exercises:
  translate:
  - en: Immigration formalities.
    source: kaga115
    sx: {hanzi: 入境手續。, pinyin: ngib gin suˋ xiug.}
  - en: 'Ask the man himself: it''s quicker.'
    source: kaga115
    sx: {hanzi: 該件事問佢本人較遽。, pinyin: ge kien sii mun giˇ bunˋ nginˇ ka giagˋ.}
  - en: My elder brother took out a bank loan to buy a house.
    source: kaga115
    sx: {hanzi: 阿哥同銀行貸款買屋。, pinyin: aˊ goˊ tungˇ ngiunˇ hongˇ toi kuanˋ maiˊ vugˋ.}
  - en: Today I received a postcard.
    source: kaga115
    sx: {hanzi: 今晡日𠊎收著一張明信片。, pinyin: gimˊ buˊ ngidˋ ngaiˇ suˊ doˋ idˋ zongˊ minˇ xin pienˋ.}
  - en: Don't tell him about this for the time being.
    source: kaga115
    sx: {hanzi: 這件事暫時吂愛同佢講。, pinyin: iaˋ kien sii qiam siiˇ mangˇ oi tungˇ giˇ gongˋ.}
  fill:
  - en: Luckily someone found your passport.
    sx: {hanzi: 好得有人拈著若___。, pinyin: hoˋ dedˋ iuˊ nginˇ ngiamˊ doˋ ngiaˊ ___., answer_hanzi: 護照, answer: fu zeu}
  - en: Please sign here.
    sx: {hanzi: 請在這位___。, pinyin: qiangˋ coiˊ iaˋ vi ___., answer_hanzi: 簽名, answer: qiamˊ miangˇ}
  - en: The passbook is free.
    sx: {hanzi: 辦簿仔___。, pinyin: pan puˊ eˋ ___., answer_hanzi: 免費, answer: mienˊ fi}
  - en: The interest isn't high.
    sx: {hanzi: ___無高。, pinyin: ___ moˇ goˊ., answer_hanzi: 利子, answer: li ziiˋ}
  - en: The postman comes every day.
    sx: {hanzi: ___逐日就會來。, pinyin: ___ giugˋ ngidˋ qiu voi loiˇ., answer_hanzi: 送信仔个, answer: sung xin eˋ ge}
