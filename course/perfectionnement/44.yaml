      sx: {hanzi: "送佢一支___。", pinyin: "sung giˇ idˋ giˊ ___.", answer_hanzi: "鋼筆", answer: "gong bidˋ"}
    - en: "Before PE you have to change into sports clothes."
      sx: {hanzi: "上___愛先換運動衫。", pinyin: "song ___ oi xienˊ von iun tung samˊ.", answer_hanzi: "體育", answer: "tiˋ iugˋ"}
    - en: "The chalk has gone missing."
      sx: {hanzi: "___毋見忒。", pinyin: "___ mˇ gien tedˋ.", answer_hanzi: "粉筆", answer: "funˋ bidˋ"}
    - en: "As a son or daughter, you must be devoted to your parents."
