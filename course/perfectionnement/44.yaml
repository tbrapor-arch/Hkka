exercises:
  translate:
    - en: "The school hall."
      source: kaga115
      sx: {hanzi: "學校禮堂。", pinyin: "hog gauˋ liˊ tongˇ."}
    - en: "Grandpa loves watching TV serials."
      source: kaga
      sx: {hanzi: "阿公當好看連續劇。", pinyin: "aˊ gungˊ dongˊ hoˋ kon lienˇ xiug kiagˋ."}
    - en: "My younger brother is very successful now."
      source: kaga115
      sx: {hanzi: "老弟這下異有成就。", pinyin: "loˋ taiˊ iaˋ ha i iuˊ siinˇ qiu."}
    - en: "Next week the school is holding a play contest."
      source: kaga
      sx: {hanzi: "下禮拜，學校愛辦話劇比賽。", pinyin: "ha liˊ bai, hog gauˋ oi pan fa kiagˋ biˋ soi."}
    - en: "The photo studio can print photos too."
      source: kaga115
      sx: {hanzi: "翕相館乜做得洗相片。", pinyin: "hibˋ xiong gonˋ me zo dedˋ seˋ xiong pienˋ."}
  fill:
