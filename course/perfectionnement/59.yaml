exercises:
  translate:
    - en: "At the Dragon Boat Festival people eat rice dumplings."
      source: kaga115
      sx: {hanzi: "五月節食粽仔。", pinyin: "ngˋ ngied jiedˋ siid zung eˋ."}
    - en: "Let's go and fly a kite."
      source: kaga115
      sx: {hanzi: "來去放紙鷂仔。", pinyin: "loiˇ hi biong ziiˋ ieu eˋ."}
    - en: "Go to church for the service."
      source: kaga115
      sx: {hanzi: "去教堂做禮拜。", pinyin: "hi gau tongˇ zo liˊ bai."}
    - en: "My little sister loves to sleep hugging her doll."
      source: kaga115
      sx: {hanzi: "老妹當好揇人公仔睡。", pinyin: "loˋ moi dongˊ hoˋ namˋ nginˇ gungˊ eˋ soi."}
    - en: "Children should be devoted to their parents."
      source: kaga115
      sx: {hanzi: "子女愛對爺哀賢孝。", pinyin: "ziiˋ ngˋ oi dui iaˇ oiˊ hienˇ hau."}
  fill:
    - en: "They are letting off firecrackers outside: it is very noisy."
      sx: {hanzi: "外背___，當吵。", pinyin: "ngoi boi ___, dongˊ cauˇ.", answer_hanzi: "打紙炮仔", answer: "daˋ ziiˋ pau eˋ"}
    - en: "He is a straightforward man: what he borrows he always returns."
      sx: {hanzi: "佢做人___，有借定著會還。", pinyin: "giˇ zo nginˇ ___, iuˊ jia tin cog voi vanˇ.", answer_hanzi: "條直", answer: "tiauˇ ciid"}
    - en: "Shall we play at skipping?"
      sx: {hanzi: "𫣆來搞___好無？", pinyin: "enˊ loiˇ gauˋ ___ hoˋ moˇ?", answer_hanzi: "跳索仔", answer: "tiau sogˋ eˇ"}
    - en: "If you do things any old how, people will find fault with you!"
      sx: {hanzi: "做事___，斯會分人嫌哦！", pinyin: "zo se ___, siiˇ voi bunˊ nginˇ hiamˇ oˊ!", answer_hanzi: "儘儘採採", answer: "qinˋ qinˋ caiˋ caiˋ"}
    - en: "His friend's father died, and he went to pay his respects."
      sx: {hanzi: "厥朋友个阿爸過身，佢去___。", pinyin: "giaˊ penˇ iuˊ ge aˊ baˊ go siinˊ, giˇ hi ___.", answer_hanzi: "拈香", answer: "ngiamˊ hiongˊ"}

