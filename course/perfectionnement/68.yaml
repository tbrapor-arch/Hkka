exercises:
  translate:
    - en: "Infrastructure."
      source: kaga115
      sx: {hanzi: "基礎建設。", pinyin: "giˊ cuˋ gien sadˋ."}
    - en: "This area is often flooded."
      source: kaga115
      sx: {hanzi: "這地區輒輒做大水。", pinyin: "iaˋ ti kiˊ jiab jiab zo tai suiˋ."}
    - en: "He has a wicked tongue: what he says often wounds people."
      source: kaga115
      sx: {hanzi: "佢嘴當壞，輒輒出口傷人。", pinyin: "giˇ zoi dongˊ faiˋ, jiab jiab cudˋ kieuˋ songˊ nginˇ."}
    - en: "With a machine installed here it is very handy."
      source: kaga115
      sx: {hanzi: "設一臺機器在這，當方便。", pinyin: "sadˋ idˋ toiˇ giˊ hi coiˊ iaˋ, dongˊ fongˊ pien."}
    - en: "Go straight along this little road and it leads to the motorway."
      source: kaga115
      sx: {hanzi: "這條細路仔直直行，會透到高速公路。", pinyin: "iaˋ tiauˇ se lu eˋ ciid ciid hangˇ, voi teu do goˊ sugˋ gungˊ lu."}
  fill:
    - en: "If prices are stable, people's lives are settled."
      sx: {hanzi: "___係穩定，人民生活就安定。", pinyin: "___ he vunˋ tin, nginˇ minˇ senˊ fad qiu onˊ tin.", answer_hanzi: "物價", answer: "vud ga"}
    - en: "This toothpaste is advertised on television."
      sx: {hanzi: "這種牙膏，電視有___。", pinyin: "iaˋ zungˋ ngaˇ gauˊ, tien sii iuˊ ___.", answer_hanzi: "廣告", answer: "gongˋ go"}
    - en: "When it comes to hiking in the hills, he is always keen."
      sx: {hanzi: "講著去蹶山，佢就當有___。", pinyin: "gongˋ doˋ hi kied sanˊ, giˇ qiu dongˊ iuˊ ___.", answer_hanzi: "願頭", answer: "ngien teuˇ"}
    - en: "Does the bookshop sell this book?"
      sx: {hanzi: "書店___賣這本書？", pinyin: "suˊ diam ___ mai iaˋ bunˋ suˊ?", answer_hanzi: "曾有", answer: "qienˇ iuˊ"}
    - en: "His blood vessel got blocked, and later he had a stroke."
      sx: {hanzi: "佢血管___，背尾就中風吔。", pinyin: "giˇ hiedˋ gonˋ ___, boi miˊ qiu zung fungˊ leˊ.", answer_hanzi: "塞著", answer: "sedˋ doˋ"}

