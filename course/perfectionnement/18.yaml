exercises:
  translate:
  - en: Yesterday's earthquake was magnitude seven.
    source: kaga115
    sx: {hanzi: 昨晡日个地動有七級。, pinyin: coˊ buˊ ngidˋ ge ti tungˊ iuˊ qidˋ kibˋ.}
  - en: The 921 earthquake shook terribly.
    source: kaga115
    sx: {hanzi: 921地動當搖。, pinyin: 921 ti tungˊ dongˊ ieuˇ.}
  - en: The damage from this typhoon is beyond counting.
    source: kaga115
    sx: {hanzi: 這擺風搓个損失無法度計算。, pinyin: iaˋ baiˋ fungˊ caiˊ ge sunˋ siidˋ moˇ fabˋ tu gie son.}
  - en: Houses must be built to stand firm.
    sx: {hanzi: 屋愛起到穩。, pinyin: vugˋ oi hiˋ do vunˋ.}
  - en: Does eating this help?
    source: kaga115
    sx: {hanzi: 食這敢有幫助？, pinyin: 'siid iaˋ gamˋ iuˊ bongˊ cu?'}
