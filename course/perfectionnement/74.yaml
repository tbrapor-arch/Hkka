exercises:
  translate:
    - en: "At dusk we go home from work, ready for dinner."
      source: kaga115
      sx: {hanzi: "臨暗仔轉夜，準備食飯哩。", pinyin: "limˇ am eˋ zonˋ ia, zunˋ pi siid fan leˊ."}
    - en: "In business you must keep your word: then it lasts."
      source: kaga115
      sx: {hanzi: "做生理愛講信用，正會長久。", pinyin: "zo senˊ liˊ oi gongˋ xin iung, zang voi congˇ giuˋ."}
    - en: "Never mind you, I've nothing to eat myself!"
      source: kaga115
      sx: {hanzi: "莫講你，𠊎自家乜無好食！", pinyin: "mog gongˋ nˇ, ngaiˇ qi gaˊ me moˇ hoˋ siid!"}
    - en: "The capital is small: no way to run a big business, we can only start small."
      source: kaga
      sx: {hanzi: "資本毋大，無辦法做大生理，僅可細細仔做啊起。", pinyin: "ziiˊ bunˋ mˇ tai, moˇ pan fabˋ zo tai senˊ liˊ, giunˋ koˋ se se eˋ zo a hiˋ."}
    - en: "Leaving a light well in the building made it much brighter inside."
      source: kaga115
      sx: {hanzi: "大樓肚留隻天井，樓肚个光線改善當多。", pinyin: "tai leuˇ duˋ liuˇ zagˋ tienˊ jiangˋ, leuˇ duˋ ge gongˊ xien goiˋ san dongˊ doˊ."}
  fill:
