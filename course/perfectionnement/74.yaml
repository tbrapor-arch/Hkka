    - en: "This table is made of planks."
      sx: {hanzi: "這張桌仔係用___做个。", pinyin: "iaˋ zongˊ zogˋ eˋ he iung ___ zo ge.", answer_hanzi: "枋仔", answer: "biongˊ eˋ"}
