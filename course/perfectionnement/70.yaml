      展風神 "show off", 筆試, 背書, 紙炮仔 and 圖片 (line 12) are from 進修 65; 訓練 from 進修 66.
  - ref: 13
    topic: vocab
    text: >
      勺, 閹雞, 湛, 暴線縫 (line 14), 疋 and 算毋和 (line 15) are from 進修 69.
  - ref: 16
    topic: vocab
    text: >
      路口 is from 進修 68; 明顯 "clear" from 進修 67.
  - ref: 19
    topic: vocab
    text: >
      相對 "by comparison", 渡 "bring up", 滿子 (line 20) and 以來 (line 21) are from 進修 66.
  - ref: 23
    topic: vocab
    text: >
      過願 "satisfying" is from 進修 65.

new_words:

exercises:
  translate:
    - en: "The fishermen say prices keep rising and renting is very hard."
      sx: {hanzi: "漁民講物價緊起，租屋仔當辛苦。", pinyin: "ngˇ minˇ gongˋ vud ga ginˋ hiˋ, zuˊ vugˋ eˇ dongˊ xinˊ kuˋ."}
    - en: "This painting is square and very easy to see on the wall."
      sx: {hanzi: "這幅畫外形四四角角，掛在壁項當明顯。", pinyin: "iaˋ bugˋ fa ngoi hinˇ xi xi gogˋ gogˋ, gua coiˊ biagˋ hong dongˊ minˇ hienˋ."}
    - en: "The baby plays with her toes all day and keeps dribbling."
      sx: {hanzi: "嬰兒仔歸日搞自家个腳趾，口涎水緊流。", pinyin: "oˇ nga eˋ guiˊ ngidˋ gauˋ qi gaˊ ge giogˋ ziiˋ, heuˋ lanˊ suiˋ ginˋ liuˇ."}
    - en: "The uncle is very particular about food, so cooking is hard work for the youngest aunt."
      sx: {hanzi: "姑丈對食个當講究，滿姑煮菜當辛苦。", pinyin: "guˊ congˊ dui siid ge dongˊ gongˋ giu, manˊ guˊ zuˋ coi dongˊ xinˊ kuˋ."}
    - en: "In the winter holidays A-min collects stamps, and learns flower arranging as well."
      sx: {hanzi: "阿明寒假去集郵，還過學插花。", pinyin: "aˊ minˇ honˇ gaˋ hi xib iuˇ, hanˇ go hog cabˋ faˊ."}
  fill:
    - en: "Give this pot of tea to the old lady to take home."
      sx: {hanzi: "這___茶分叔婆帶轉去。", pinyin: "iaˋ ___ caˇ bunˊ sugˋ poˇ dai zonˋ hi.", answer_hanzi: "壺", answer: "fuˇ"}
    - en: "Grandma's clothes have soy sauce on them."
      sx: {hanzi: "阿婆个衫褲分豆油___。", pinyin: "aˊ poˇ ge samˊ fu bunˊ teu iuˇ ___.", answer_hanzi: "著著", answer: "dauˇ doˋ"}
    - en: "The basketball match ended level."
      sx: {hanzi: "籃球比賽打到___。", pinyin: "lamˇ kiuˇ biˋ soi daˋ do ___.", answer_hanzi: "無輸無贏", answer: "moˇ suˊ moˇ iangˇ"}
    - en: "From the time he came to Taiwan, Sam has spoken Hakka every day."
      sx: {hanzi: "Sam 對來臺灣___，就逐日講客話。", pinyin: "Sam dui loiˇ toiˇ vanˇ ___, qiu dagˋ ngidˋ gongˋ hagˋ fa.", answer_hanzi: "起勢", answer: "hiˋ sii"}
    - en: "How many units of electricity were used this month?"
      sx: {hanzi: "這隻月个電用幾多___？", pinyin: "iaˋ zagˋ ngied ge tien iung giˋ doˊ ___?", answer_hanzi: "磅", answer: "bongˇ"}

