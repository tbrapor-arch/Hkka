exercises:
  translate:
    - en: "Her eyebrows are curved and very pretty."
      source: kaga
      sx: {hanzi: "佢个目眉毛彎彎，當靚。", pinyin: "giˇ ge mugˋ miˇ moˊ vanˊ vanˊ, dongˊ jiangˊ."}
    - en: "This top is too short: your navel will show."
      source: kaga
      sx: {hanzi: "這領衫忒短，肚臍會走出來。", pinyin: "iaˋ liangˊ samˊ tedˋ donˋ, duˋ qiˇ voi zeuˋ cudˋ loiˇ."}
    - en: "My little brother has a grain of rice stuck on his cheek."
      source: kaga115
      sx: {hanzi: "老弟面頰卵項黏等飯糝。", pinyin: "loˋ taiˊ mien gabˋ lonˋ hong ngiamˇ denˋ fan samˋ."}
    - en: "Cut by the knife, the hand keeps bleeding."
      sx: {hanzi: "分刀仔割著，手緊出血。", pinyin: "bunˊ doˊ eˋ godˋ doˋ, suˋ ginˋ cudˋ hiedˋ."}
    - en: "Don't talk nonsense, or someone will tear your mouth for you."
      source: kaga115
      sx: {hanzi: "你莫亂講話，會分人擘嘴角。", pinyin: "nˇ mog lon gongˋ fa, voi bunˊ nginˇ bagˋ zoi gogˋ."}
  fill:
    - en: "Two more stops and we are in Taipei."
      sx: {hanzi: "過兩___就到臺北哩。", pinyin: "go liongˋ ___ qiu do toiˇ bedˋ leˊ.", answer_hanzi: "站", answer: "zam"}
    - en: "You haven't even warmed your seat: why the hurry to go home?"
      sx: {hanzi: "___吂坐燒，仰恁緊愛轉屋下？", pinyin: "___ mangˇ coˊ seuˊ, ngiongˋ anˋ ginˋ oi zonˋ vugˋ kaˊ?", answer_hanzi: "屎胐", answer: "sii vudˋ"}
    - en: "People today make tea on gas; in the old days they used charcoal."
      sx: {hanzi: "現代人___用瓦斯，頭擺人用火炭。", pinyin: "hien toi nginˇ ___ iung ngaˋ siiˊ, teuˇ baiˋ nginˇ iung foˋ tan.", answer_hanzi: "炙茶", answer: "zagˋ caˇ"}
    - en: "Don't carry the chamber pot into the room: the smell is very strong."
      sx: {hanzi: "尿桶莫擐到___，臭味當重。", pinyin: "ngiau tungˋ mog kuan do ___, cu mi dongˊ cungˊ.", answer_hanzi: "間項", answer: "gienˊ hong"}
    - en: "Things with hair on them can't be eaten as they are."
      sx: {hanzi: "有___个東西做毋得直接食。", pinyin: "iuˊ ___ ge dungˊ xiˊ zomˇ dedˋ ciid jiabˋ siid.", answer_hanzi: "毛", answer: "moˊ"}

