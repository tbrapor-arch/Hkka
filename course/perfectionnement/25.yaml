exercises:
  translate:
    - en: "He was in a road accident last month and went into hospital."
      source: kaga115
      sx: {hanzi: "佢上隻月車禍入院。", pinyin: "giˇ song zagˋ ngied caˊ fo ngib ien."}
    - en: "He stole something and was caught on the spot."
      source: kaga115
      sx: {hanzi: "佢偷東西，當場分人捉著。", pinyin: "giˇ teuˊ dungˊ xiˊ, dongˊ congˇ bunˊ nginˇ zogˋ doˋ."}
    - en: "Lawyers know the law very well."
      source: kaga115
      sx: {hanzi: "律師當知法律。", pinyin: "lid siiˊ dongˊ diˊ fabˋ lid."}
    - en: "If you commit a crime, you get locked up."
      source: kaga115
      sx: {hanzi: "犯罪就愛捉去關。", pinyin: "fam cui qiu oi zogˋ hi guanˊ."}
    - en: "You have to go through customs when you go abroad."
      source: kaga115
      sx: {hanzi: "出國愛過海關。", pinyin: "cudˋ guedˋ oi go hoiˋ guanˊ."}
  fill:
