      sx: {hanzi: "高速公路___。", pinyin: "goˊ sugˋ gungˊ lu ___.", answer_hanzi: "塞車", answer: "sedˋ caˊ"}
    - en: "The house next door caught fire."
      sx: {hanzi: "隔壁___。", pinyin: "gagˋ biagˋ ___.", answer_hanzi: "火燒屋", answer: "foˋ seuˊ vugˋ"}
    - en: "The judge sentenced him to eight months in prison."
      sx: {hanzi: "___判佢坐管仔八隻月。", pinyin: "___ pan giˇ coˊ gonˋ eˇ badˋ zagˋ ngied.", answer_hanzi: "法官", answer: "fabˋ gonˊ"}
    - en: "Law and order here is not good."
      sx: {hanzi: "這片___毋好。", pinyin: "iaˋ pienˋ ___ mˇ hoˋ.", answer_hanzi: "治安", answer: "cii onˊ"}
    - en: "Gambling is illegal."
      sx: {hanzi: "賭徼係___个。", pinyin: "duˋ gieuˋ he ___ ge.", answer_hanzi: "違法", answer: "viˇ fabˋ"}

