exercises:
  translate:
    - en: "Play baseball."
      source: kaga115
      sx: {hanzi: "打野球。", pinyin: "daˋ iaˊ kiuˇ."}
    - en: "A university campus is bigger."
      source: kaga115
      sx: {hanzi: "大學个校園較大。", pinyin: "tai hog ge gauˋ ienˇ ka tai."}
    - en: "This toy is a reward for you."
      source: kaga115
      sx: {hanzi: "這玩具係獎勵你个。", pinyin: "iaˋ nguanˇ kiˋ he jiongˋ li nˇ ge."}
    - en: "My elder sister graduated last week."
      source: kaga115
      sx: {hanzi: "阿姊上禮拜卒業哩。", pinyin: "aˊ jiˋ song liˊ bai zudˋ ngiab leˊ."}
    - en: "In PE this week my class is learning volleyball."
      source: kaga115
      sx: {hanzi: "吾班級這禮拜个體育課係學打排球。", pinyin: "ngaˊ banˊ kibˋ iaˋ liˊ bai ge tiˋ iugˋ ko he hog daˋ paiˇ kiuˇ."}
  fill:
    - en: "The high jump competition."
      sx: {hanzi: "___比賽。", pinyin: "___ biˋ soi.", answer_hanzi: "跳高", answer: "tiau goˊ"}
    - en: "The school is going to hold a graduation dance."
      sx: {hanzi: "學校愛辦畢業___。", pinyin: "hog gauˋ oi pan bidˋ ngiab ___.", answer_hanzi: "舞會", answer: "vuˋ fi"}
    - en: "This venue is really big."
      sx: {hanzi: "這___嶄然闊。", pinyin: "iaˋ ___ zamˋ ienˇ fadˋ.", answer_hanzi: "會場", answer: "fi congˇ"}
    - en: "Run five laps of the sports ground."
      sx: {hanzi: "走___五輪。", pinyin: "zeuˋ ___ ngˋ linˊ.", answer_hanzi: "操場", answer: "cauˊ congˇ"}
    - en: "He keeps borrowing money from people: I wonder whether he pays it back."
      sx: {hanzi: "佢___同人借錢，毋知有還無？", pinyin: "giˇ ___ tungˇ nginˇ jia qienˇ, mˇ diˊ iuˊ vanˇ moˇ?", answer_hanzi: "密密", answer: "med med"}

