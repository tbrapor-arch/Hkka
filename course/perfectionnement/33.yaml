exercises:
  translate:
    - en: "This man is a real loner: he has no friends at all."
      sx: {hanzi: "這人當孤老，全無朋友。", pinyin: "iaˋ nginˇ dongˊ guˊ loˋ, qionˇ moˇ penˇ iuˊ."}
    - en: "Stop bullying people, will you?"
      source: kaga115
      sx: {hanzi: "莫恁欺負人好無？", pinyin: "mog anˋ kiˊ fu nginˇ hoˋ moˇ?"}
    - en: "Don't be so greedy, taking so much!"
      source: kaga
      sx: {hanzi: "毋好恁貪心，拿到恁多！", pinyin: "mˇ hoˋ anˋ tamˊ ximˊ, naˊ do anˋ doˊ!"}
    - en: "How can such an amazing thing happen?"
      source: kaga115
      sx: {hanzi: "仰有恁神奇个事？", pinyin: "ngiongˋ iuˊ anˋ siinˇ kiˇ ge sii?"}
    - en: "When it's over, it's over: don't go looking for revenge."
      source: kaga115
      sx: {hanzi: "事情過忒就好，毋好尋人報仇。", pinyin: "sii qinˇ go tedˋ qiu hoˋ, mˇ hoˋ qimˇ nginˇ bo suˇ."}
  fill:
    - en: "The rice jar is empty."
      sx: {hanzi: "___無米吔。", pinyin: "___ moˇ miˋ leˊ.", answer_hanzi: "米缸", answer: "miˋ gongˊ"}
    - en: "You have to be content to be happy."
      sx: {hanzi: "人愛___正會快樂。", pinyin: "nginˇ oi ___ zang voi kuai log.", answer_hanzi: "知足", answer: "diˊ jiugˋ"}
    - en: "Last week this jeweller's was burgled."
      sx: {hanzi: "上禮拜這___分賊仔偷。", pinyin: "song liˊ bai iaˋ ___ bunˊ ced eˋ teuˊ.", answer_hanzi: "金仔店", answer: "gimˊ eˋ diam"}
    - en: "In the end you still have to do it yourself."
      sx: {hanzi: "講恁多，___還係愛自家做。", pinyin: "gongˋ anˋ doˊ, ___ hanˇ he oi qi gaˊ zo.", answer_hanzi: "結局", answer: "giedˋ kiug"}
    - en: "Everyone's lot is different; accept yours."
      sx: {hanzi: "各人个命無共樣，愛___。", pinyin: "gogˋ nginˇ ge miang moˇ kiung iong, oi ___.", answer_hanzi: "認分", answer: "ngin fun"}

