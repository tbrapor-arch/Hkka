      source: kaga115
      sx: {hanzi: "無做事，會緊尞緊懶尸。", pinyin: "moˇ zo sii, voi ginˋ liau ginˋ lanˊ siiˊ."}
    - en: "He can't do a thing, poor soul!"
      source: kaga115
      sx: {hanzi: "麼个都毋會，實在衰過！", pinyin: "maˋ ge du mˇ voi, siid cai coiˊ go!"}
    - en: "The washing machine has broken down."
      source: kaga115
      sx: {hanzi: "洗衫機壞忒。", pinyin: "seˋ samˊ giˊ fai tedˋ."}
    - en: "The key is in the drawer."
      sx: {hanzi: "鎖匙在拖箱仔肚。", pinyin: "soˋ siiˋ coiˊ toˊ xiongˊ eˋ duˋ."}
    - en: "Mum lined everything up neatly."
      source: kaga115
      sx: {hanzi: "阿姆同東西排到正正。", pinyin: "aˊ meˊ tungˇ dungˊ xiˊ paiˇ do zang zang."}
