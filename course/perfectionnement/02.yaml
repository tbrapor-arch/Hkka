    - en: "Today we're giving it a thorough clean."
      sx: {hanzi: "今晡日愛___。", pinyin: "gimˊ buˊ ngidˋ oi ___.", answer_hanzi: "拚掃", answer: "biang so"}
    - en: "It's gone under the sofa."
      sx: {hanzi: "佢走入___下吔。", pinyin: "giˇ zeuˋ ngib ___ haˊ leˊ.", answer_hanzi: "膨凳", answer: "pong den"}
    - en: "Get up a bit earlier in the morning."
      sx: {hanzi: "朝晨愛早兜仔___。", pinyin: "zeuˊ siinˇ oi zoˋ deuˊ eˋ ___.", answer_hanzi: "䟘床", answer: "hong congˇ"}

