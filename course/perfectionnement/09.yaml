  - en: This man is tricking old people.
    sx: {hanzi: 這隻人___老人家。, pinyin: iaˋ zagˋ nginˇ ___ loˋ nginˇ gaˊ., answer_hanzi: 拐, answer: guaiˋ}
  - en: I'm warning you.
    sx: {hanzi: 𠊎___你。, pinyin: ngaiˇ ___ nˇ., answer_hanzi: 警告, answer: ginˋ go}
