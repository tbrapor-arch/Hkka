exercises:
  translate:
  - en: 'He''s a great boaster: don''t believe him!'
    source: kaga115
    sx: {hanzi: 佢當會膨風，莫信佢！, pinyin: 'giˇ dongˊ voi pong fungˊ, mog xin giˇ!'}
  - en: If you bump into someone, you must apologise.
    source: kaga115
    sx: {hanzi: 撞著人愛同人會失禮。, pinyin: cong doˋ nginˇ oi tungˇ nginˇ fi siidˋ liˊ.}
  - en: Go and find out what on earth is going on.
    source: kaga115
    sx: {hanzi: 你去調查一下到底係麼个事情。, pinyin: nˇ hi tiauˇ caˇ idˋ ha do daiˋ he maˋ ge sii qinˇ.}
  - en: This is a misunderstanding.
    source: kaga115
    sx: {hanzi: 這係一個誤會。, pinyin: iaˋ he idˋ ge ngu fi.}
  - en: Please don't take it amiss.
    source: kaga115
    sx: {hanzi: 請你莫見怪。, pinyin: qiangˋ nˇ mog gien guai.}
