exercises:
  translate:
    - en: "You seldom see the two sisters-in-law go out together."
      source: kaga115
      sx: {hanzi: "罕得看著佢兩姊嫂共下出門。", pinyin: "hanˋ dedˋ kon doˋ giˇ liongˋ ziiˋ soˋ kiung ha cudˋ munˇ."}
    - en: "The clock is hung up: you can see it as soon as you come in."
      source: kaga115
      sx: {hanzi: "時鐘仔吊等，一入門就看得著。", pinyin: "siiˇ zungˊ eˋ diau denˋ, idˋ ngib munˇ qiu kon dedˋ doˋ."}
    - en: "After the two brothers divided the property, they still got on very well."
      sx: {hanzi: "兩兄弟分家過後，感情還係當好。", pinyin: "liongˋ hiungˊ ti bunˊ gaˊ go heu, gamˋ qinˇ hanˇ he dongˊ hoˋ."}
    - en: "Grandpa is a great age."
      source: kaga115
      sx: {hanzi: "阿公歲數當大。", pinyin: "aˊ gungˊ se sii dongˊ tai."}
    - en: "Who has been spreading tales?"
      sx: {hanzi: "麼人亂傳話？", pinyin: "maˋ nginˇ lon conˇ fa?"}
  fill:
    - en: "Can it be that he wrote this book?"
      sx: {hanzi: "這本書___係佢寫个？", pinyin: "iaˋ bunˋ suˊ ___ he giˇ xiaˋ ge?", answer_hanzi: "無成", answer: "moˇ sangˇ"}
    - en: "The child at the next table is full of tricks."
      sx: {hanzi: "隔壁桌該細人仔盡會___。", pinyin: "gagˋ biagˋ zogˋ ge se nginˇ eˋ qin voi ___.", answer_hanzi: "作怪", answer: "zogˋ guai"}
    - en: "A person with a stoop looks shorter."
      sx: {hanzi: "背翕翕仔个人看起來較___。", pinyin: "baˇ hibˋ hibˋ eˋ ge nginˇ kon hiˋ loiˇ ka ___.", answer_hanzi: "矮細", answer: "aiˋ se"}
    - en: "On the day of the year-end feast, bring your whole family, big and small, and be my guests!"
      sx: {hanzi: "尾牙該日，你愛帶屋下___來分𠊎請哦！", pinyin: "miˊ ngaˇ ge ngidˋ, nˇ oi dai vugˋ kaˊ ___ loiˇ bunˊ ngaiˇ qiangˋ oˊ!", answer_hanzi: "大大細細", answer: "tai tai se se"}
    - en: "He said it on purpose, for people to hear."
      sx: {hanzi: "佢___講分人聽个。", pinyin: "giˇ ___ gongˋ bunˊ nginˇ tangˊ ge.", answer_hanzi: "挑事", answer: "tiauˊ sii"}

