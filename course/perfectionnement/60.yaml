exercises:
  translate:
    - en: "As soon as the rain is over, I'll set off at once."
      source: kaga
      sx: {hanzi: "雨一過，𠊎馬上出發。", pinyin: "iˋ idˋ go, ngaiˇ maˊ song cudˋ fadˋ."}
    - en: "Last time I went to a banquet with him."
      source: kaga115
      sx: {hanzi: "上滿同佢共下去食酒。", pinyin: "song manˊ tungˇ giˇ kiung ha hi siid jiuˋ."}
    - en: "The two of them are as close as brothers."
      source: kaga115
      sx: {hanzi: "佢兩儕个感情好到像兄弟仔樣仔。", pinyin: "giˇ liongˋ saˇ ge gamˋ qinˇ hoˋ do qiong hiungˊ ti eˋ iong eˋ."}
    - en: "Everyone had just finished the discussion when he took it up and went on again."
      source: kaga115
      sx: {hanzi: "大家正討論煞，佢又接嘴來講。", pinyin: "tai gaˊ zang toˋ lun sod, giˇ iu jiabˋ zoi loiˇ gongˋ."}
    - en: "At break, everyone races to the slide."
      source: kaga
      sx: {hanzi: "下課時節，大家相賽去溜滑梯。", pinyin: "ha ko siiˇ jiedˋ, tai gaˊ xiongˊ coi hi liu vad toiˊ."}
  fill:
    - en: "Do at least a little."
      sx: {hanzi: "加加___做兜仔。", pinyin: "gaˊ gaˊ ___ zo deuˊ eˋ.", answer_hanzi: "減減", answer: "gamˋ gamˋ"}
    - en: "The front door of this house faces north: in winter you can't open it."
      sx: {hanzi: "這間屋仔正門向___，寒天開門就毋得。", pinyin: "iaˋ gienˊ vugˋ eˇ ziin munˇ hiong ___, honˇ tienˊ koiˊ munˇ qiu mˇ dedˋ.", answer_hanzi: "北方", answer: "bedˋ fongˊ"}
    - en: "I kept calling you and you didn't answer: I thought you hadn't heard!"
      sx: {hanzi: "緊喊你，就無___，話著你無聽著呢！", pinyin: "ginˋ hemˊ nˇ, qiu moˇ ___, va doˋ nˇ moˇ tangˊ doˋ neˇ!", answer_hanzi: "應話", answer: "en fa"}
    - en: "His wife's brother has only just graduated this year and has no job yet."
      sx: {hanzi: "厥___今年正大學畢業，吂有食頭路。", pinyin: "giaˊ ___ gimˊ ngienˇ zang tai hog bidˋ ngiab, mangˇ iuˊ siid teuˇ lu.", answer_hanzi: "妻舅仔", answer: "qiˊ kiuˊ eˋ"}
    - en: "When prices fall nobody wants the goods; when they rise everyone fights for them."
      sx: {hanzi: "東西一落價無人愛，一起價___搶。", pinyin: "dungˊ xiˊ idˋ log ga moˇ nginˇ oi, idˋ hiˋ ga ___ qiongˋ.", answer_hanzi: "相賽", answer: "xiongˊ coi"}

