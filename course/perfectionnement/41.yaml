exercises:
  translate:
    - en: "The mountain road is full of bends."
      source: kaga115
      sx: {hanzi: "山路當彎。", pinyin: "sanˊ lu dongˊ vanˊ."}
    - en: "A year has four seasons."
      source: kaga115
      sx: {hanzi: "一年有四季。", pinyin: "idˋ ngienˇ iuˊ xi gui."}
    - en: "This room gets very good light."
      source: kaga
      sx: {hanzi: "這隻間房光線當好。", pinyin: "iaˋ zagˋ gienˊ fongˇ gongˊ xien dongˊ hoˋ."}
