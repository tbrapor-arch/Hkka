      sx: {hanzi: "頭擺厥爸同人打___。", pinyin: "teuˇ baiˋ giaˊ baˊ tungˇ nginˇ daˋ ___.", answer_hanzi: "炭礦", answer: "tan kongˋ"}
    - en: "The cold wind blows from the north-west."
      sx: {hanzi: "冷風對___片吹過來。", pinyin: "langˊ fungˊ dui ___ pienˋ coiˊ go loiˇ.", answer_hanzi: "西北", answer: "xiˊ bedˋ"}
    - en: "The sun comes up over that hill."
      sx: {hanzi: "日頭對該片个___出來。", pinyin: "ngidˋ teuˇ dui ge pienˋ ge ___ cudˋ loiˇ.", answer_hanzi: "山頭", answer: "sanˊ teuˇ"}

