exercises:
  translate:
  - en: For you this is child's play.
    source: kaga115
    sx: {hanzi: 這件事情對你來講係三下钁頭兩畚箕定定。, pinyin: iaˋ kien sii qinˇ dui nˇ loiˇ gongˋ he samˊ ha giogˋ teuˇ liongˋ bun giˊ tin
        tin.}
  - en: A tradesman must have a conscience.
    source: kaga115
    sx: {hanzi: 生理人愛有良心。, pinyin: senˊ liˊ nginˇ oi iuˊ liongˇ ximˊ.}
  - en: The company sent him on a business trip.
    source: kaga115
    sx: {hanzi: 公司派佢出差。, pinyin: gungˊ siiˊ pai giˇ cudˋ caiˊ.}
  - en: I'm taking next Monday off.
    source: kaga115
    sx: {hanzi: 下禮拜一請假。, pinyin: ha liˊ bai idˋ qiangˋ gaˋ.}
  - en: Being a star isn't easy.
    sx: {hanzi: 做明星無恁簡單。, pinyin: zo minˇ senˊ moˇ anˋ gienˋ danˊ.}
  fill:
  - en: How long have you been cutting hair?
    sx: {hanzi: 你___剃幾久吔？, pinyin: 'nˇ ___ ti gidˋ giuˋ leˊ?', answer_hanzi: 剃頭, answer: ti teuˇ}
  - en: I finished my apprenticeship at eighteen.
    sx: {hanzi: 十八歲___。, pinyin: siib badˋ se ___., answer_hanzi: 出師, answer: cudˋ siiˊ}
  - en: Young people like going to hair salons.
    sx: {hanzi: 後生人___去電毛店。, pinyin: heu sangˊ nginˇ ___ hi tien moˊ diam., answer_hanzi: 時行, answer: siiˇ hangˇ}
  - en: Most of them are people I know.
    sx: {hanzi: 多係___。, pinyin: doˊ he ___., answer_hanzi: 熟事人, answer: sug sii nginˇ}
  - en: I only take two days off a year.
    sx: {hanzi: 𠊎一年淨___兩擺。, pinyin: ngaiˇ idˋ ngienˇ qiang ___ liongˋ baiˋ., answer_hanzi: 請假, answer: qiangˋ gaˋ}
