exercises:
  translate:
  - en: Stealing is against the law.
    source: kaga115
    sx: {hanzi: 偷東西係犯法个。, pinyin: teuˊ dungˊ xiˊ he fam fabˋ ge.}
  - en: Be careful crossing the road!
    source: kaga115
    sx: {hanzi: 過大路愛細義！, pinyin: go tai lu oi se ngi!}
  - en: The neighbours get on very well.
    source: kaga115
    sx: {hanzi: 隔壁鄰舍感情當好。, pinyin: gagˋ biagˋ linˇ sa gamˋ qinˇ dongˊ hoˋ.}
  - en: Don't start a fight at the slightest thing.
    source: kaga115
    sx: {hanzi: 毋好動啊著就相打。, pinyin: mˇ hoˋ tungˊ a doˋ qiu xiongˊ daˋ.}
  - en: That couple are very close.
    source: kaga115
    sx: {hanzi: 該兩公婆盡相好。, pinyin: ge liongˋ gungˊ poˇ qin xiongˊ hoˋ.}
  fill:
  - en: A thief stole money.
    sx: {hanzi: 有賊仔___錢。, pinyin: iuˊ ced eˋ ___ qienˇ., answer_hanzi: 偷, answer: teuˊ}
  - en: A scooter ran into a car.
