    source: kaga115
    sx: {hanzi: 客人當省儆。, pinyin: hagˋ nginˇ dongˊ sangˋ kiang.}
  - en: Exercise does the body a lot of good.
    source: kaga115
    sx: {hanzi: 運動對身體有當多好處。, pinyin: iun tung dui siinˊ tiˋ iuˊ dongˊ doˊ hoˋ cu.}
  - en: Family shouldn't be so petty with each other.
    source: kaga115
    sx: {hanzi: 屋下人莫恁計較。, pinyin: vugˋ kaˊ nginˇ mog anˋ gie gau.}
  - en: If there's nowhere to sit, just stand and watch.
    source: kaga115
