      sx: {hanzi: "這擺考試个問答題當簡單，𠊎總下會寫。", pinyin: "iaˋ baiˋ kauˋ sii ge mun dabˋ tiˇ dongˊ gienˋ danˊ, ngaiˇ zungˋ ha voi xiaˋ."}
  fill:
    - en: "The needle is sharp: hold it carefully and don't prick yourself."
      sx: {hanzi: "針尖尖，你斯愛擎好，毋好___。", pinyin: "ziimˊ jiamˊ jiamˊ, nˇ siiˇ oi kiaˇ hoˋ, mˇ hoˋ ___.", answer_hanzi: "刺著", answer: "qiugˋ doˋ"}
    - en: "Mum is in the middle of cooking: could you call back in five minutes?"
      sx: {hanzi: "阿姆___在該煮飯，過五分鐘正打來做得無？", pinyin: "aˊ meˊ ___ du ge zuˋ fan, go ngˋ funˊ zungˊ zang daˋ loiˇ zo dedˋ moˇ?", answer_hanzi: "當當", answer: "dongˊ dongˊ"}
    - en: "The toys are scattered all over the living room: tidy them up quickly!"
      sx: {hanzi: "廳下个玩具___，遽遽收揫來！", pinyin: "tangˊ haˊ ge nguanˇ kiˋ ___, giagˋ giagˋ suˊ qiuˊ loiˇ!", answer_hanzi: "四四散散", answer: "xi xi san san"}
    - en: "Up close, his face really did have lots of freckles."
      sx: {hanzi: "行兼一看，厥面項___有當多烏蠅屎。", pinyin: "hangˇ giamˊ idˋ kon, giaˊ mien hong ___ iuˊ dongˊ doˊ vuˊ inˇ siiˋ.", answer_hanzi: "斷真", answer: "don ziinˊ"}
    - en: "Put two bottles of wine on each table first, and add more if it's not enough."
      sx: {hanzi: "一張桌先放兩罐酒，毋罅正___。", pinyin: "idˋ zongˊ zogˋ xienˊ biong liongˋ gon jiuˋ, mˇ la zang ___.", answer_hanzi: "加添", answer: "gaˊ tiamˊ"}

