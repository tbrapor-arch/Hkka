exercises:
  translate:
    - en: "On the way home from work I was caught in a downpour, and was soaked through in a moment."
      source: kaga115
      sx: {hanzi: "下班个時節堵著浩洪斗雨，一下仔歸身涿到潦潦。", pinyin: "haˊ banˊ ge siiˇ jiedˋ duˇ doˋ heˊ fungˇ deuˋ iˋ, idˋ ha eˋ guiˊ siinˊ dugˋ do lauˇ lauˇ."}
    - en: "These bamboo poles are lying every which way: put them away properly."
      source: kaga115
      sx: {hanzi: "這兜竹篙橫架直架，愛放好勢來。", pinyin: "iaˋ deuˊ zugˋ goˊ vangˇ ga ciid ga, oi biong hoˋ se loiˇ."}
    - en: "My tooth is loose: I think it's going to come out!"
      source: kaga115
      sx: {hanzi: "吾牙齒搖搖，怕係愛㪐忒哩！", pinyin: "ngaˊ ngaˇ ciiˋ ieuˇ ieuˇ, pa he oi ludˋ tedˋ leˊ!"}
    - en: "When he has finished, it's your turn."
      source: kaga115
      sx: {hanzi: "佢講煞，續下來換你。", pinyin: "giˇ gongˋ sod, sa haˊ loiˇ von nˇ."}
    - en: "The questions in this exam were easy: I could write all of them."
