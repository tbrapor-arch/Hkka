exercises:
  translate:
    - en: "Taiwan's biggest airport is in Taoyuan."
      source: kaga115
      sx: {hanzi: "臺灣最大个飛機場在桃園。", pinyin: "toiˇ vanˊ zui tai ge fiˊ giˊ congˇ cai toˇ ienˇ."}
    - en: "I told you last time; how come you've forgotten again?"
      source: kaga115
      sx: {hanzi: "上擺有講過，仰又毋記得？", pinyin: "song baiˋ iuˊ gongˋ go, ngiongˋ iu mˇ gi dedˋ?"}
    - en: "What's worrying you so much?"
      source: kaga115
      sx: {hanzi: "麼个事情分你恁愁？", pinyin: "maˋ ge sii qinˇ bunˊ nˇ anˋ seuˇ?"}
    - en: "He often skips breakfast, so he has no energy at work."
      source: kaga115
      sx: {hanzi: "佢長間毋食朝，故所上班無精神。", pinyin: "giˇ congˇ gienˊ mˇ siid zeuˊ, gu soˋ song banˊ moˇ jinˊ siinˇ."}
    - en: "Remember to be on time the day after tomorrow."
      source: kaga115
      sx: {hanzi: "後日記得愛準時。", pinyin: "heuˊ ngidˋ gi dedˋ oi zunˋ siiˇ."}
  fill:
    - en: "My sister bought a car the day before yesterday."
      sx: {hanzi: "阿姊___正買一臺車仔。", pinyin: "aˊ jiˋ ___ zang maiˊ idˋ toiˇ caˊ eˋ.", answer_hanzi: "前日", answer: "qienˇ ngidˋ"}
    - en: "When did you learn to drive?"
      sx: {hanzi: "你___學駛車仔个？", pinyin: "nˇ ___ hog siiˋ caˊ eˋ ge?", answer_hanzi: "哪央時", answer: "nai iongˊ siiˇ"}
    - en: "How long was the flight?"
      sx: {hanzi: "坐飛行機坐___？", pinyin: "coˊ biˊ hangˇ giˊ coˊ ___?", answer_hanzi: "幾久", answer: "gidˋ giuˋ"}
    - en: "Have a guess: what's Grandma cooking?"
      sx: {hanzi: "你___看啊，阿婆煮麼个？", pinyin: "nˇ ___ kon a, aˊ poˇ zuˋ maˋ ge?", answer_hanzi: "揣", answer: "tonˇ"}
    - en: "Long time no see!"
      sx: {hanzi: "___！", pinyin: "___!", answer_hanzi: "恁久無看著", answer: "anˋ giuˋ moˇ kon doˋ"}

