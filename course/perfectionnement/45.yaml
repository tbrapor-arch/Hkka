    - en: "The teacher spoke to him with a smile."
      sx: {hanzi: "先生___同佢講話。", pinyin: "xinˊ sangˊ ___ tungˇ giˇ gongˋ fa.", answer_hanzi: "笑笑仔", answer: "seu seu eˋ"}
    - en: "He works very deftly."
