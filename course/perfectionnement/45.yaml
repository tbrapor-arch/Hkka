exercises:
  translate:
    - en: "He goes jogging in the park every day."
      source: kaga115
      sx: {hanzi: "佢逐日會去公園慢走。", pinyin: "giˇ dagˋ ngidˋ voi hi gungˊ ienˇ man zeuˋ."}
    - en: "This batch of tea is of very good quality."
      source: kaga115
      sx: {hanzi: "這枋茶品質盡好。", pinyin: "iaˋ biongˊ caˇ pinˋ ziidˋ qin hoˋ."}
    - en: "The scent of osmanthus is very tempting."
      source: kaga115
      sx: {hanzi: "桂花个香味當餳人。", pinyin: "gui faˊ ge hiongˊ mi dongˊ xiangˇ nginˇ."}
    - en: "He bought up all these sweets."
      source: kaga115
      sx: {hanzi: "這糖仔歸下分佢買走。", pinyin: "iaˋ tongˇ eˋ guiˊ ha bunˊ giˇ maiˊ zeuˋ."}
    - en: "At first he said he would take the day off; in the end he said he would come."
      source: kaga115
      sx: {hanzi: "本來講愛請假，包尾佢又講愛來。", pinyin: "bunˋ loiˇ gongˋ oi qiangˋ gaˋ, bauˊ miˊ giˇ iu gongˋ oi loiˇ."}
