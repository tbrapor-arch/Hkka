exercises:
  translate:
    - en: "A play."
      source: kaga115
      sx: {hanzi: "一齣戲。", pinyin: "idˋ cudˋ hi."}
    - en: "A bolt of cloth."
      source: kaga115
      sx: {hanzi: "一疋布仔。", pinyin: "idˋ pidˋ bu eˋ."}
    - en: "Turn it once round."
      source: kaga115
      sx: {hanzi: "捩一圈。", pinyin: "lidˋ idˋ kienˊ."}
    - en: "China's population passed one thousand three hundred million long ago."
      source: kaga
      sx: {hanzi: "中國人口早就超過十三億吔。", pinyin: "zungˊ guedˋ nginˇ kieuˋ zoˋ qiu ceuˊ go siib samˊ i leˊ."}
    - en: "At New Year a capon is killed as an offering to the Lord of Heaven."
      source: kaga115
      sx: {hanzi: "過年㓾一隻閹雞來敬天公。", pinyin: "go ngienˇ ciiˇ idˋ zagˋ iamˊ gieˊ loiˇ gin tienˊ gungˊ."}
  fill:
    - en: "The teaching material has six volumes."
      sx: {hanzi: "教材有六___。", pinyin: "gau coiˇ iuˊ liugˋ ___.", answer_hanzi: "冊", answer: "cagˋ"}
    - en: "A lot of young people can play billiards nowadays."
      sx: {hanzi: "這下當多後生人會___球仔。", pinyin: "iaˋ ha dongˊ doˊ heu sangˊ nginˇ voi ___ kiuˇ eˋ.", answer_hanzi: "揰", answer: "dungˋ"}
    - en: "This deal doesn't pay: it will probably lose money."
      sx: {hanzi: "這買賣___，應該會了錢。", pinyin: "iaˋ maiˊ mai ___, in goiˊ voi leˊ qienˇ.", answer_hanzi: "算毋和", answer: "son mˇ foˇ"}
    - en: "When the seam of a garment bursts, it must be sewn up with needle and thread."
      sx: {hanzi: "衫褲___就愛用針線攣好來。", pinyin: "samˊ fu ___ qiu oi iung ziimˊ xien lionˇ hoˋ loiˇ.", answer_hanzi: "暴線縫", answer: "bau xien pung"}
    - en: "Add a spoonful of sugar."
      sx: {hanzi: "加一___糖落去。", pinyin: "gaˊ idˋ ___ tongˇ log hi.", answer_hanzi: "勺", answer: "sog"}

