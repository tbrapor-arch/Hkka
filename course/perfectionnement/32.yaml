exercises:
  translate:
    - en: "Taiwan used to be an agricultural society."
      source: kaga115
      sx: {hanzi: "臺灣頭擺係農業社會。", pinyin: "toiˇ vanˇ teuˇ baiˋ he nungˇ ngiab sa fi."}
    - en: "Strike lucky."
      source: kaga115
      abridged: true
      sx: {hanzi: "得著好空。", pinyin: "dedˋ doˋ hoˋ kungˊ."}
    - en: "No one does business at a loss."
      source: kaga115
      sx: {hanzi: "蝕本生理無人做。", pinyin: "sad bunˋ senˊ liˊ moˇ nginˇ zo."}
    - en: "The children are grown up: there's no need to fret so."
      source: kaga115
      sx: {hanzi: "細人仔大吔，毋使恁愁慮。", pinyin: "se nginˇ eˋ tai leˊ, mˇ siiˋ anˋ seuˇ li."}
    - en: "How could I bear to let you go?"
      source: kaga115
      sx: {hanzi: "𠊎哪盼得分你走。", pinyin: "ngaiˇ nai pan dedˋ bunˊ nˇ zeuˋ."}
  fill:
    - en: "New Year by the lunar calendar."
      sx: {hanzi: "___過年。", pinyin: "___ go ngienˇ.", answer_hanzi: "舊曆", answer: "kiu lag"}
    - en: "This is dear because the cost is very high."
      sx: {hanzi: "這東西貴係因為___當高。", pinyin: "iaˋ dungˊ xiˊ gui he inˊ vi ___ dongˊ goˊ.", answer_hanzi: "成本", answer: "siinˇ bunˋ"}
    - en: "Go and cast the divination blocks at the temple."
      sx: {hanzi: "去廟項___。", pinyin: "hi meu hong ___.", answer_hanzi: "跌筊仔", answer: "diedˋ gau eˋ"}
    - en: "A temple festival needs the gods invited."
      sx: {hanzi: "做鬧熱愛___。", pinyin: "zo nau ngied oi ___.", answer_hanzi: "請神", answer: "qiangˋ siinˇ"}
    - en: "Let's say it face to face."
      sx: {hanzi: "大家出來___講。", pinyin: "tai gaˊ cudˋ loiˇ ___ gongˋ.", answer_hanzi: "當面", answer: "dongˊ mien"}

