exercises:
  translate:
  - en: Don't be so nervous.
    source: kaga115
    sx: {hanzi: 毋使恁緊張。, pinyin: mˇ siiˋ anˋ ginˋ zongˊ.}
  - en: 'This ring is fake: it''s worth nothing.'
    sx: {hanzi: 這隻禁指係假个，無麼个價值。, pinyin: 'iaˋ zagˋ gim ziiˋ he gaˋ ge, moˇ maˋ ge ga ciid.'}
  - en: He looks very refined.
    source: kaga115
    sx: {hanzi: 佢生到當斯文。, pinyin: giˇ sangˊ do dongˊ siiˊ vunˇ.}
  - en: Children love blowing up balloons.
    source: kaga115
    sx: {hanzi: 細人仔盡好歕雞胲仔。, pinyin: se nginˇ eˋ qin hau punˇ gieˊ goiˊ eˋ.}
  - en: The two families are now related.
    sx: {hanzi: 兩家人係親戚吔。, pinyin: liongˋ gaˊ nginˇ he qinˊ qidˋ leˊ.}
