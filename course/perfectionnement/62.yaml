exercises:
  translate:
    - en: "Carry the child on your back and go for a walk."
      source: kaga115
      sx: {hanzi: "背細人仔去散步。", pinyin: "baˇ se nginˇ eˋ hi san pu."}
    - en: "The clock's battery is flat."
      source: kaga115
      sx: {hanzi: "時鐘仔个電池無電哩。", pinyin: "siiˇ zungˊ eˋ ge tien ciiˇ moˇ tien leˊ."}
    - en: "When you get up in the morning you must brush your teeth."
      source: kaga115
      sx: {hanzi: "朝晨䟘起來愛洗嘴。", pinyin: "zeuˊ siinˇ hong hiˋ loiˇ oi seˋ zoi."}
    - en: "What kind of petrol does your car take?"
      source: kaga
      sx: {hanzi: "你个車仔係用哪種汽油？", pinyin: "nˇ ge caˊ eˋ he iung nai zungˋ hi iuˇ?"}
    - en: "He fell over by mishap and broke his arm!"
      source: kaga115
      sx: {hanzi: "毋堵好跌啊倒，手骨嗄斷忒！", pinyin: "mˇ duˋ hoˋ diedˋ a doˋ, suˋ gudˋ sa tonˊ tedˋ!"}
  fill:
    - en: "My sister is glued to her phone all day."
      sx: {hanzi: "阿姊歸日___等手機仔。", pinyin: "aˊ jiˋ guiˊ ngidˋ ___ denˋ suˋ giˊ eˋ.", answer_hanzi: "掌", answer: "zongˋ"}
    - en: "This invention is really quite wonderful."
      sx: {hanzi: "這___實在異奇妙。", pinyin: "iaˋ ___ siid cai i kiˇ meu.", answer_hanzi: "發明", answer: "fadˋ minˇ"}
    - en: "The two of them love to go for a walk by the lake."
      sx: {hanzi: "佢兩儕盡好去湖脣___。", pinyin: "giˇ liongˋ saˇ qin hau hi fuˇ sunˇ ___.", answer_hanzi: "散步", answer: "san pu"}
    - en: "It is a very ordinary thing: we have heaps at home, you're not the only one."
      sx: {hanzi: "這係異平常个東西，吾屋下___，毋係你正有。", pinyin: "iaˋ he i pinˇ songˇ ge dungˊ xiˊ, ngaˊ vugˋ kaˊ ___, mˇ he nˇ zang iuˊ.", answer_hanzi: "一千擔", answer: "idˋ qienˊ damˊ"}
    - en: "Let's go and fly a kite."
      sx: {hanzi: "___放紙鷂仔。", pinyin: "___ biong ziiˋ ieu eˋ.", answer_hanzi: "來去", answer: "loiˇ hi"}

