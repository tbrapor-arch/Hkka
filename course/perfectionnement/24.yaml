exercises:
  translate:
    - en: "With a sprained foot you can't walk at all."
      source: kaga115
      sx: {hanzi: "腳偏著，行無麼个得。", pinyin: "giogˋ pienˊ doˋ, hangˇ moˇ maˋ ge dedˋ."}
    - en: "A runny nose is a symptom of a cold."
      source: kaga115
      sx: {hanzi: "流鼻係寒著个症頭。", pinyin: "liuˇ pi he honˇ doˋ ge ziin teuˇ."}
    - en: "You rarely come; I'll kill a chicken for lunch."
      source: kaga115
      sx: {hanzi: "你罕得來，當晝㓾雞仔請你。", pinyin: "nˇ hanˋ dedˋ loiˇ, dongˊ zu ciiˇ gieˊ eˋ qiangˋ nˇ."}
    - en: "She's pregnant; she must be careful."
      source: kaga115
      sx: {hanzi: "有身項吔，愛細義。", pinyin: "iuˊ siinˊ hong leˊ, oi se ngi."}
    - en: "Midwives deliver babies."
      source: kaga115
      sx: {hanzi: "產婆會接生。", pinyin: "sanˋ poˇ voi jiabˋ senˊ."}
