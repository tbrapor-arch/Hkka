exercises:
  translate:
    - en: "He sprained his ankle playing basketball yesterday, and now he walks with a limp."
      sx: {hanzi: "佢昨晡日打籃球扭著腳，行路跛啊跛仔。", pinyin: "giˇ coˊ buˊ ngidˋ daˋ lamˇ kiuˇ ngiuˋ doˋ giogˋ, hangˇ lu baiˊ a baiˊ eˋ."}
      hl: {hanzi: "佢昨晡日打籃球腳扭著，行路跛啊跛仔。", pinyin: "gi coˋ buˋ ngid daˊ lam kiu giog ngiuˊ doˊ, hang lu+ bai a+ bai er."}
      check: true
    - en: "Hearing A-in was coming home, Grandma stood at the door all day, looking and looking."
      sx: {hanzi: "聽講阿英愛轉，阿婆歸日企在門口望啊望仔。", pinyin: "tangˊ gongˋ aˊ inˊ oi zonˋ, aˊ poˇ guiˊ ngidˋ kiˊ coiˊ munˇ heuˋ mong a mong eˋ."}
      hl: {hanzi: "聽講阿英愛轉，阿婆歸日企在門口望啊望仔。", pinyin: "tangˇ gongˊ a+ rhinˋ oiˇ zhonˊ, a+ po guiˋ ngid kiˋ coiˋ mun heuˊ mong+ a+ mong+ er."}
      check: true
    - en: "He was hit by a car yesterday; now he limps."
      source: kaga115
      sx: {hanzi: "佢昨晡日分車仔撞著，這下行路跛啊跛仔。", pinyin: "giˇ coˊ buˊ ngidˋ bunˊ caˊ eˋ cong doˋ, iaˋ ha hangˇ lu baiˊ a baiˊ eˋ."}
      hl: {hanzi: "佢昨晡日分車仔撞著，這下行路跛啊跛仔。", pinyin: "gi coˋ buˋ ngid bunˋ chaˋ er cong+ doˊ, liaˊ ha+ hang lu+ bai a+ bai er."}
    - en: "Overcast today; tomorrow it'll clear up."
      sx: {hanzi: "今晡日陰天，天光日會天晴。", pinyin: "gimˊ buˊ ngidˋ imˊ tienˊ, tienˊ gongˊ ngidˋ voi tienˊ qiangˇ."}
      hl: {hanzi: "今晡日陰天，韶早會天晴。", pinyin: "gimˋ buˋ ngid rhimˋ tienˋ, shau zoˊ voi+ tienˋ ciang."}
    - en: "This dish is something new: try a taste."
      sx: {hanzi: "這盤菜係新个，你試嗒看仔。", pinyin: "iaˋ panˇ coi he xinˊ ge, nˇ cii dab kon eˋ."}
      hl: {hanzi: "這盤菜係新个，你試嗒看仔。", pinyin: "liaˊ pan coiˇ heˇ sinˋ gaiˇ, ngi chiˇ dabˋ konˇ er."}
    - en: "After the rain the river is high: don't cross the bridge."
      sx: {hanzi: "落水過後，河壩水當大，莫過橋。", pinyin: "log suiˋ go heu, hoˇ ba suiˋ dongˊ tai, mog go kieuˇ."}
      hl: {hanzi: "落水過後，河壩水當大，莫過橋。", pinyin: "logˋ shuiˊ goˇ heu+, ho baˇ shuiˊ dongˋ tai+, mogˋ goˇ kiau."}
      check: true
  fill:
    - en: "Have a go at grinding it."
      sx: {hanzi: "你試擂___。", pinyin: "nˇ cii luiˇ ___.", answer_hanzi: "看仔", answer: "kon eˋ"}
      hl: {hanzi: "你試擂___。", pinyin: "ngi chiˇ lui ___.", answer_hanzi: "看仔", answer: "konˇ er"}
    - en: "It's raining. (in Hailu)"
      sx: {hanzi: "___了。", pinyin: "___ leˊ.", answer_hanzi: "落水", answer: "log suiˋ"}
      hl: {hanzi: "___了。", pinyin: "___ leˋ.", answer_hanzi: "落水", answer: "logˋ shuiˊ"}
    - en: "Take an umbrella."
      sx: {hanzi: "遮仔___等。", pinyin: "zaˊ eˋ ___ denˋ.", answer_hanzi: "擎", answer: "kiaˇ"}
      hl: {hanzi: "遮仔___等。", pinyin: "zhaˋ er ___ denˊ.", answer_hanzi: "擎", answer: "kia"}

