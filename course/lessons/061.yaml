id: 61
title:
  en: "A rainy weekend"
  sx: {hanzi: "試擂看仔", pinyin: "cii luiˇ kon eˋ"}
  hl: {hanzi: "試擂看仔", pinyin: "chiˇ lui konˇ er"}
review: false
setting: >-
  Saturday 13 March. It has rained since Thursday, a fine grey rain that stops and starts. The factory is shut at
  weekends. 阿傑 turns up at nine with two raincoats and a plan: the bus to 北埔, twenty minutes up the valley, where
  the old street is all 擂茶 shops.
names: [阿傑, 北埔, 苗栗, 劉家, 阿英]

dialogue:
  - n: 1
    speaker: Sam
    en: "(at the window, looking out again and again) It's raining again."
    sx: {hanzi: "又落雨了。", pinyin: "iu log iˋ leˊ."}
    hl: {hanzi: "又落雨了。", pinyin: "rhiu+ logˋ rhiˊ leˋ."}
    check: true
  - n: 2
    speaker: 阿傑
    en: "落雨? Here we say 落水. And it's only a drizzle: 水毛仔."
    sx: {hanzi: "落雨？𫣆兜講落水。又係雨毛仔定定。", pinyin: "log iˋ? enˊ deuˊ gongˋ log suiˋ. iu he iˋ moˊ eˋ tin tin."}
    hl: {hanzi: "落雨？𫣆兜講落水。又係水毛仔定定。", pinyin: "logˋ rhiˊ? enˋ deuˋ gongˊ logˋ shuiˊ. rhiu+ heˇ shuiˊ moˋ er tin+ tin+."}
  - n: 3
    speaker: Sam
    en: "落水… Grandma in Miaoli says 落水 sometimes too. But I say 落雨."
    sx: {hanzi: "落水……苗栗个阿婆有時節乜講落水。毋過𠊎講落雨。", pinyin: "log suiˋ … meuˇ lidˋ ge aˊ poˇ iuˊ siiˇ jiedˋ me gongˋ log suiˋ. mˇ go ngaiˇ gongˋ log iˋ."}
    hl: {hanzi: "落水……苗栗个阿婆有時節乜講落水。毋過𠊎講落雨。", pinyin: "logˋ shuiˊ … miau lidˋ gaiˇ a+ po rhiuˋ shi zied meˇ gongˊ logˋ shuiˊ. m goˇ ngai gongˊ logˋ rhiˊ."}
  - n: 4
    speaker: 阿傑
    en: "It's been stopping and starting since Thursday. Come on, let's go to 北埔 for 擂茶. Take an umbrella."
    sx: {hanzi: "禮拜四到今，落啊落仔，落到毋停。來，𫣆兜去北埔食擂茶。遮仔擎等。", pinyin: "liˊ bai xi do gimˊ, log a log eˋ, log do mˇ tinˇ. loiˇ, enˊ deuˊ hi bedˋ buˊ siid luiˇ caˇ. zaˊ eˋ kiaˇ denˋ."}
    hl: {hanzi: "禮拜四到今，落啊落仔，落到毋停。來，𫣆兜去北埔食擂茶。遮仔擎等。", pinyin: "liˋ baiˇ siˇ doˇ gimˋ, logˋ a+ logˋ er, logˋ doˇ m tin. loi, enˋ deuˋ hiˇ bed buˋ shidˋ lui ca. zhaˋ er kia denˊ."}
    check: true
  - n: 5
    speaker: 頭家
    en: "(in a 擂茶 shop on 北埔 old street) You grind it first, then you drink it. Have a go yourselves."
    sx: {hanzi: "先擂，正食。你兜試擂看仔。", pinyin: "xienˊ luiˇ, zang siid. nˇ deuˊ cii luiˇ kon eˋ."}
    hl: {hanzi: "先擂，正食。你兜試擂看仔。", pinyin: "senˋ lui, zhangˇ shidˋ. ngi deuˋ chiˇ lui konˇ er."}
  - n: 6
    speaker: 阿傑
    en: "(grinding and grinding) Like this?… My arm's aching already."
    sx: {hanzi: "恁樣擂？……擂啊擂仔，手就痠了。", pinyin: "anˋ ngiongˇ luiˇ? … luiˇ a luiˇ eˋ, suˋ qiu sonˊ leˊ."}
    hl: {hanzi: "恁樣擂？……擂啊擂仔，手就痠了。", pinyin: "an ngiong lui? … lui a+ lui er, shiuˊ ciu+ sonˋ leˋ."}
    check: true
  - n: 7
    speaker: Sam
    en: "Let me. Slowly, slowly: it has to be ground nice and fine."
    sx: {hanzi: "分𠊎來。慢慢仔擂，愛擂到幼幼仔。", pinyin: "bunˊ ngaiˇ loiˇ. man man eˋ luiˇ, oi luiˇ do iu iu eˋ."}
    hl: {hanzi: "分𠊎來。慢慢仔擂，愛擂到幼幼仔。", pinyin: "bunˋ ngai loi. man+ man+ er lui, oiˇ lui doˇ rhiuˇ rhiuˇ er."}
  - n: 8
    speaker: 頭家
    en: "Well! You're good at it! Where did you learn?"
    sx: {hanzi: "你當會擂！哪位學个？", pinyin: "nˇ dongˊ voi luiˇ! nai vi hog ge?"}
    hl: {hanzi: "你當會擂！哪位學个？", pinyin: "ngi dongˋ voi+ lui! nai+ vui+ hogˋ gaiˇ?"}
  - n: 9
    speaker: Sam
    en: "My grandma in Miaoli taught me."
    sx: {hanzi: "苗栗个阿婆教𠊎个。", pinyin: "meuˇ lidˋ ge aˊ poˇ gauˊ ngaiˇ ge."}
    hl: {hanzi: "苗栗个阿婆教𠊎个。", pinyin: "miau lidˋ gaiˇ a+ po gauˋ ngai gaiˇ."}
  - n: 10
    speaker: 阿傑
    en: "He's practically one of the Liu family. Half a grandson."
    sx: {hanzi: "佢就像劉家人共樣，半隻孫仔。", pinyin: "giˇ qiu qiong liuˇ gaˊ nginˇ kiung iong, ban zagˋ sunˊ eˋ."}
    hl: {hanzi: "佢就像劉家人共樣，半隻孫仔。", pinyin: "gi ciu+ ciongˇ liu gaˋ ngin kiung+ rhong+, banˇ zhag sunˋ er."}
    check: true
  - n: 11
    speaker: 頭家
    en: "It's still raining outside, and thundering. Have another bowl."
    sx: {hanzi: "外背還在該落水，還打雷公。食加一碗添。", pinyin: "ngoi boi hanˇ du ge log suiˋ, hanˇ daˋ luiˇ gungˊ. siid gaˊ idˋ vonˋ tiamˊ."}
    hl: {hanzi: "外背還在該落水，還打雷公。食加一碗添。", pinyin: "ngo+ boiˇ han diˇ gai logˋ shuiˊ, han daˊ lui gungˋ. shidˋ gaˋ rhid vonˊ tiamˋ."}
  - n: 12
    speaker: Sam
    en: "(at the door, an hour later) The rain's stopped! …The sun's out!"
    sx: {hanzi: "停了！……出日頭了！", pinyin: "tinˇ leˊ! … cudˋ ngidˋ teuˇ leˊ!"}
    hl: {hanzi: "停了！……出日頭了！", pinyin: "tin leˋ! … chud ngid teu leˋ!"}
  - n: 13
    speaker: 阿傑
    en: "(stepping out, straight into a puddle) …My shoes are soaked."
    sx: {hanzi: "……𠊎个鞋溼了。", pinyin: "… ngaiˇ ge haiˇ siibˋ leˊ."}
    hl: {hanzi: "……𠊎个鞋溼了。", pinyin: "… ngai gaiˇ hai shib leˋ."}
  - n: 14
    speaker: Sam
    en: "There's a puddle! Try looking where you're going."
    sx: {hanzi: "該有水窟！你試看路看仔。", pinyin: "ge iuˊ suiˋ fudˋ! nˇ cii kon lu kon eˋ."}
    hl: {hanzi: "該有水窟！你試看路看仔。", pinyin: "gai rhiuˋ shuiˊ fud! ngi chiˇ konˇ lu+ konˇ er."}
    check: true

notes:
  - ref: 1
    topic: hailu
    text: >
      The fifth trip-up of the month, checked in the word lists: "rain" is Sixian 落雨 log iˋ, Hailu 落水 logˋ shuiˊ, and
      "drizzle" Sixian 雨毛仔, Hailu 水毛仔. As with 糜 (lesson 58), Miaoli speakers say 落水 as well: an official Sixian
      example reads 正落過水﹝雨﹞ "it has just rained". Sam's 落雨 is kept in both columns, because it is his word: line 1
      and the Hailu of line 3 are marked for that reason.
  - ref: 4
    topic: grammar
    text: >
      V啊V仔: a verb said twice, linked by 啊 and closed by 仔, describes an action that keeps going, in fits and starts:
      行路跛啊跛仔 "walking with a limp", 歸日仔企在門口望啊望仔 "standing at the door all day, looking and looking",
      車仔動啊動仔 "the bus jolting along" (all official examples). 落啊落仔 "raining on and off" is built the same way,
      and marked for checking: the examples do not have it. 到今 "until now". 遮仔擎等 "take an umbrella (and keep it up)":
      擎 kiaˇ is how you hold an umbrella, a flag or a pen.
  - ref: 5
    topic: grammar
    text: >
      試擂看仔 "have a go at grinding": 試 + V + 看仔, the form Hailu speakers prefer for "try (and see)". Sixian has 試V看啊
      (lesson 36); both are in the official examples (Hailu 換頭試看仔 "try the other end"; Sixian 試看看仔). Note the
      tone of 仔 here: eˋ, as in all the 仔 of this course.
  - ref: 6
    topic: grammar
    text: >
      擂啊擂仔 "grinding and grinding": V啊V仔 again, and the arm aches (痠, lesson 36). Marked for checking: the official
      examples do not grind.
  - ref: 7
    topic: culture
    text: >
      Sam passes on Grandma's lesson 36 word for word: 慢慢仔擂，愛擂到幼幼仔. Lesson 36 had 擂茶 at home; 北埔, up the valley
      from 竹東, sells it to visitors, and its 柿餅 (lesson 54) too.
  - ref: 10
    topic: grammar
    text: >
      就像…共樣 "just like…": 像 (lesson 45) + noun + 共樣 (共樣 "the same", lesson 15). 半隻孫仔 "half a grandson" is 阿傑's joke, not
      a set phrase: marked.
  - ref: 12
    topic: vocab
    text: >
      出日頭 cudˋ ngidˋ teuˇ "the sun comes out" (日頭 "sun", lesson 9). 溼 siibˋ "wet" (line 13); 水窟 "puddle" (line 14).
  - ref: 14
    topic: grammar
    text: >
      你試看路看仔 "try looking at the road (for once)": the 試…看仔 frame round a verb with its object. Sam's sentence, and
      marked: a native speaker may well prefer plain 你看路啊.

