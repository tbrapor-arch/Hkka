    - en: "He's not coming?! (of all things)"
      sx: {hanzi: "佢___毋來？", pinyin: "giˇ ___ mˇ loiˇ?", answer_hanzi: "嗄", answer: "sa"}
      hl: {hanzi: "佢___毋來？", pinyin: "gi ___ m loi?", answer_hanzi: "嗄", answer: "saˇ"}
    - en: "Don't worry."
