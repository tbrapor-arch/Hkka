exercises:
  translate:
    - en: "My brother didn't do as he was told, and Mum was very angry."
      sx: {hanzi: "老弟毋聽話，阿姆當譴。", pinyin: "loˋ taiˊ mˇ tangˊ fa, aˊ meˊ dongˊ kienˋ."}
      hl: {hanzi: "老弟毋聽話，阿姆當閼。", pinyin: "loˊ taiˋ m tangˋ faˇ, a+ meˋ dongˋ ad."}
    - en: "A-in is disappointed; Grandma is sad."
      sx: {hanzi: "阿英當失望，阿婆當傷心。", pinyin: "aˊ inˊ dongˊ siidˋ mong, aˊ poˇ dongˊ songˊ ximˊ."}
      hl: {hanzi: "阿英當失望，阿婆當傷心。", pinyin: "a+ rhinˋ dongˋ shid mong+, a+ po dongˋ shongˋ simˋ."}
    - en: "Grandpa heard Grandma sing, and he was thrilled."
      sx: {hanzi: "阿公聽著阿婆唱歌，當暢。", pinyin: "aˊ gungˊ tangˊ doˋ aˊ poˇ cong goˊ, dongˊ tiong."}
      hl: {hanzi: "阿公聽著阿婆唱歌，當暢。", pinyin: "a+ gungˋ tangˋ doˊ a+ po chongˇ goˋ, dongˋ tiongˇ."}
    - en: "A-in is very kind-hearted; she's only angry, that's all."
      sx: {hanzi: "阿英盡好心，係當譴定定。", pinyin: "aˊ inˊ qin hoˋ ximˊ, he dongˊ kienˋ tin tin."}
      hl: {hanzi: "阿英最好心，係當閼定定。", pinyin: "a+ rhinˋ zuiˇ hoˊ simˋ, heˇ dongˋ ad tin+ tin+."}
    - en: "Don't scold her; she's decided for herself."
      sx: {hanzi: "莫罵佢，佢自家決定了。", pinyin: "mog ma giˇ, giˇ qi gaˊ giedˋ tin leˊ."}
      hl: {hanzi: "莫罵佢，佢自家決定了。", pinyin: "mogˋ maˇ gi, gi cid gaˋ gied tin+ leˋ."}
    - en: "Don't bother about me, and don't worry."
      sx: {hanzi: "莫管𠊎，乜毋使擔心。", pinyin: "mog gonˋ ngaiˇ, me mˇ siiˋ damˊ ximˊ."}
      hl: {hanzi: "莫管𠊎，乜毋使擔心。", pinyin: "mogˋ gonˊ ngai, meˇ m siiˊ damˋ simˋ."}
    - en: "A-min is afraid of dogs."
      sx: {hanzi: "阿明驚狗。", pinyin: "aˊ minˇ giangˊ gieuˋ."}
      hl: {hanzi: "阿明驚狗。", pinyin: "a+ min giangˋ gieuˊ."}
  fill:
