exercises:
  translate:
    - en: "The government has announced that 天穿日 is the national Hakka Day."
      sx: {hanzi: "政府公布，定天穿日為「全國客家日」。", pinyin: "ziin fuˋ gungˊ bu, tin tienˊ conˊ ngidˋ viˇ qionˇ guedˋ hagˋ gaˊ ngidˋ."}
      hl: {hanzi: "政府公布，定天穿日為「全國客家日」。", pinyin: "zhinˇ fuˊ gungˋ buˇ, tin+ tienˋ chonˋ ngid vui cion gued hag gaˋ ngid."}
      source: kaga115
    - en: "Only this big a box: how can so many things fit in it?"
      sx: {hanzi: "這盒仔正恁大仔，哪裝得落恁多東西？", pinyin: "iaˋ hab eˋ zang an tai eˋ, nai zongˊ dedˋ log anˋ doˊ dungˊ xiˊ?"}
