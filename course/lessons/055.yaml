exercises:
  translate:
    - en: "The government has made 天穿日 the national Hakka Day."
      sx: {hanzi: "政府定天穿日做客家日。", pinyin: "ziin fuˋ tin tienˊ conˊ ngidˋ zo hagˋ gaˊ ngidˋ."}
      hl: {hanzi: "政府定天穿日做客家日。", pinyin: "zhinˇ fuˊ tin+ tienˋ chonˋ ngid zoˇ hag gaˋ ngid."}
      check: true
    - en: "Only this big a box: how can so many things fit in it?"
      sx: {hanzi: "這箱仔正恁大仔，仰般裝得落恁多東西？", pinyin: "iaˋ xiongˊ eˋ zang an tai eˋ, ngiongˋ banˊ zongˊ dedˋ log anˋ doˊ dungˊ xiˊ?"}
      hl: {hanzi: "這箱仔正恁大仔，仰般張得落恁多東西？", pinyin: "liaˊ siongˋ er zhangˇ an tai+ er, ngiongˊ banˋ zhongˋ ded logˋ anˊ doˋ dungˋ siˋ?"}
    - en: "The roof leaks; it needs mending."
      sx: {hanzi: "屋頂會漏，愛補。", pinyin: "vugˋ dangˋ voi leu, oi buˋ."}
      hl: {hanzi: "屋頂會漏，愛補。", pinyin: "vug dangˊ voi+ leu+, oiˇ buˊ."}
      check: true
    - en: "Put the suitcase up on the rack."
      sx: {hanzi: "皮箱放到架項去。", pinyin: "piˇ xiongˊ biong do ga hong hi."}
      hl: {hanzi: "皮箱放到架項去。", pinyin: "pi siongˋ biongˇ doˇ gaˇ hong+ hiˇ."}
