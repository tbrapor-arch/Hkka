    - en: "Is everything ready for the contest?"
      sx: {hanzi: "比賽準備好勢吂？", pinyin: "biˋ soi zunˋ pi hoˋ se mangˇ?"}
      hl: {hanzi: "比賽準備好勢吂？", pinyin: "biˊ soiˇ zhunˊ pi+ hoˊ sheˇ mang?"}
