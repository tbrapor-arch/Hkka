    - en: "My shirt has a hole in it; mend it for me."
      sx: {hanzi: "𠊎个衫穿一隻空，摎𠊎補一下。", pinyin: "ngaiˇ ge samˊ conˊ idˋ zagˋ kungˊ, lauˊ ngaiˇ buˋ idˋ ha."}
      hl: {hanzi: "𠊎个衫穿一隻空，摎𠊎補一下。", pinyin: "ngai gaiˇ samˋ chonˋ rhid zhag kungˋ, lauˋ ngai buˊ rhid ha+."}
