exercises:
  translate:
    - en: "Run! The train's coming!"
      sx: {hanzi: "走！火車來了！", pinyin: "zeuˋ! foˋ caˊ loiˇ leˊ!"}
      hl: {hanzi: "走！火車來了！", pinyin: "zeuˊ! foˊ chaˋ loi leˋ!"}
    - en: "Grandma walks to her vegetable garden every day."
      sx: {hanzi: "阿婆逐日行路去菜園。", pinyin: "aˊ poˇ dagˋ ngidˋ hangˇ lu hi coi ienˇ."}
      hl: {hanzi: "阿婆逐日行路去菜園。", pinyin: "a+ po dag ngid hang lu+ hiˇ coiˇ rhan."}
    - en: "The bus stop is on the right."
      sx: {hanzi: "車站在右片。", pinyin: "caˊ zam cai iu pienˋ."}
      hl: {hanzi: "車站在正手片。", pinyin: "chaˋ zhamˇ cai+ zhinˇ shiuˊ pienˊ."}
    - en: "Don't be afraid, it isn't spicy."
      sx: {hanzi: "毋使驚，毋辣。", pinyin: "mˇ siiˋ giangˊ, mˇ lad."}
      hl: {hanzi: "毋使驚，毋辣。", pinyin: "m siiˊ giangˋ, m ladˋ."}
    - en: "Wait for me, I'll be there in five minutes."
      sx: {hanzi: "等𠊎，五分鐘就到。", pinyin: "denˋ ngaiˇ, ngˋ funˊ zungˊ qiu do."}
      hl: {hanzi: "等𠊎，五分鐘就到。", pinyin: "denˊ ngai, ngˊ funˋ zhungˋ ciu+ doˇ."}
  fill:
    - en: "Don't run, walk!"
      sx: {hanzi: "莫___，行！", pinyin: "mog ___, hangˇ!", answer_hanzi: "走", answer: "zeuˋ"}
      hl: {hanzi: "莫___，行！", pinyin: "mogˋ ___, hang!", answer_hanzi: "走", answer: "zeuˊ"}
    - en: "It's over there."
      sx: {hanzi: "在該___。", pinyin: "cai ge ___.", answer_hanzi: "位", answer: "vi"}
      hl: {hanzi: "在該___。", pinyin: "cai+ gai ___.", answer_hanzi: "位", answer: "vui+"}
    - en: "What are you doing tonight?"
      sx: {hanzi: "你___愛做麼个？", pinyin: "nˇ ___ oi zo maˋ ge?", answer_hanzi: "暗晡", answer: "am buˊ"}
      hl: {hanzi: "你___愛做麼个？", pinyin: "ngi ___ oiˇ zoˇ maˊ gaiˇ?", answer_hanzi: "暗晡", answer: "amˇ buˋ"}

