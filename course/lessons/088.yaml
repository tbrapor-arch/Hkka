exercises:
  translate:
    - en: "I sincerely invite everyone to this year's 義民 ceremony."
      sx: {hanzi: "𠊎誠心誠意邀請大家來參加今年个義民祭典。", pinyin: "ngaiˇ siinˇ ximˊ siinˇ i ieuˊ qiangˋ tai gaˊ loiˇ camˊ gaˊ gimˊ ngienˇ ge ngi minˇ ji dienˋ."}
      hl: {hanzi: "𠊎誠心誠意邀請大家來參加今年个義民祭典。", pinyin: "ngai shin simˋ shin rhiˇ rhauˋ ciangˊ tai+ gaˋ loi camˋ gaˋ gimˋ ngien gaiˇ ngi+ min ziˇ dienˊ."}
      source: kaga115
    - en: "Every year in the seventh month everyone goes to the temple to make offerings for the wandering spirits."
      sx: {hanzi: "逐年七月半大家都去廟項普渡拜好兄弟。", pinyin: "dagˋ ngienˇ qidˋ ngied ban tai gaˊ du hi meu hong puˊ tu bai hoˋ hiungˊ ti."}
      hl: {hanzi: "逐年七月半大家都去廟項普渡拜好兄弟。", pinyin: "dag ngien cid ngiedˋ banˇ tai+ gaˋ du+ hiˇ miau+ hong+ puˋ tu+ baiˇ hoˊ hiungˋ ti+."}
      source: kaga115
    - en: "Mum goes with my little sister to worship at the temple."
      sx: {hanzi: "阿姆陪老妹去廟肚拜拜。", pinyin: "aˊ meˊ piˇ loˋ moi hi meu duˋ bai baiˊ."}
      hl: {hanzi: "阿姆陪老妹去廟肚拜拜。", pinyin: "a+ meˋ poi loˊ moiˇ hiˇ miau+ duˊ bai baiˊ."}
    - en: "The head of the committee welcomes the guests at the temple gate."
      sx: {hanzi: "主任委員在廟門口迎人客。", pinyin: "zuˋ im viˊ ienˇ coiˊ meu munˇ heuˋ ngiangˇ nginˇ hagˋ."}
