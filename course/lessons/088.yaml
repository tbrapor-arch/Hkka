      check: true
    - en: "Grandma offers tangerines to the gods."
      sx: {hanzi: "阿婆用柑仔供神明。", pinyin: "aˊ poˇ iung gamˊ eˋ giung siinˇ minˇ."}
      hl: {hanzi: "阿婆用柑仔供神明。", pinyin: "a+ po rhung+ gamˋ er giungˇ shin min."}
      check: true
    - en: "After the offerings, Grandma goes to burn the gold paper."
      sx: {hanzi: "拜拜好了，阿婆去燒金。金紙愛燒好。", pinyin: "bai baiˊ hoˋ leˊ, aˊ poˇ hi seuˊ gimˊ. gimˊ ziiˋ oi seuˊ hoˋ."}
      hl: {hanzi: "拜拜好了，阿婆去燒金。金紙愛燒好。", pinyin: "bai baiˊ hoˊ leˋ, a+ po hiˇ shauˋ gimˋ. gimˋ zhiˊ oiˇ shauˋ hoˊ."}
      check: true
