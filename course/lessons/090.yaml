id: 90
title:
  en: "Rescue"
  sx: {hanzi: "平安轉來就好", pinyin: "pinˇ onˊ zonˋ loiˇ qiu hoˋ"}
  hl: {hanzi: "平安轉來就好", pinyin: "pin onˋ zhonˊ loi ciu+ hoˊ"}
review: false
setting: >-
  The same night, nine o'clock. Grandma raised the alarm at seven; A-in and Mr Liu drove to 南庄 with 阿貴伯's
  nephew, who knows the hills, and torches. Up on the ridge, Sam's phone is down to its last few per cent.
names: [南庄, 阿英, 阿明, 阿姊]

dialogue:
  - n: 1
    speaker: 阿英
    en: "(far below, shouting) A-min! Sam!"
    sx: {hanzi: "阿明！Sam！", pinyin: "aˊ minˇ! Sam!"}
    hl: {hanzi: "阿明！Sam！", pinyin: "a+ min! Sam!"}
  - n: 2
    speaker: 阿明
    en: "Sis! We're here! Here!"
    sx: {hanzi: "阿姊！𠊎兜在這！在這！", pinyin: "aˊ jiˋ! ngaiˇ deuˊ coiˊ iaˋ! coiˊ iaˋ!"}
    hl: {hanzi: "阿姊！𠊎兜在這！在這！", pinyin: "a+ ziˊ! ngai deuˋ coiˋ liaˊ! coiˋ liaˊ!"}
  - n: 3
    speaker: Sam
    en: "(holding the phone up high) Up here! I'm holding up a light: can you see it?"
    sx: {hanzi: "這位！山頂！𠊎擎等電火，看著無？", pinyin: "iaˋ vi! sanˊ dangˋ! ngaiˇ kiaˇ denˋ tien foˋ, kon doˋ moˇ?"}
    hl: {hanzi: "這位！山頂！𠊎擎等電火，看著無？", pinyin: "liaˊ vui+! sanˋ dangˊ! ngai kia denˊ tien+ foˊ, konˇ doˊ mo?"}
  - n: 4
    speaker: 阿爸
    en: "We see it! Don't move! We're coming over!"
    sx: {hanzi: "看著了！莫動！𠊎兜過來！", pinyin: "kon doˋ leˊ! mog tungˊ! ngaiˇ deuˊ go loiˇ!"}
    hl: {hanzi: "看著了！莫動！𠊎兜過來！", pinyin: "konˇ doˊ leˋ! mogˋ tungˋ! ngai deuˋ goˇ loi!"}
  - n: 5
    speaker: 阿英
    en: "(arriving out of breath, torch in hand) Is anyone hurt? We've been walking so fast we're dripping with sweat!"
    sx: {hanzi: "有人受傷無？𠊎兜行到汗流脈落！", pinyin: "iuˊ nginˇ su songˊ moˇ? ngaiˇ deuˊ hangˇ do hon liuˇ mag log!"}
    hl: {hanzi: "有人受傷無？𠊎兜行到汗流脈落！", pinyin: "rhiuˋ ngin shiu+ shongˋ mo? ngai deuˋ hang doˇ hon+ liu mag logˋ!"}
  - n: 6
    speaker: Sam
    en: "A-min's twisted his ankle. He can't walk on it."
    sx: {hanzi: "阿明个腳扭著了，行毋得。", pinyin: "aˊ minˇ ge giogˋ ngiuˋ doˋ leˊ, hangˇ mˇ dedˋ."}
    hl: {hanzi: "阿明个腳扭著了，行毋得。", pinyin: "a+ min gaiˇ giog ngiuˊ doˊ leˋ, hang m ded."}
  - n: 7
    speaker: 阿爸
    en: "Don't be frightened. Dad'll carry you on his back."
    sx: {hanzi: "毋好驚。阿爸揹你。", pinyin: "mˇ hoˋ giangˊ. aˊ baˊ baˇ nˇ."}
    hl: {hanzi: "毋好驚。阿爸揹你。", pinyin: "m hoˊ giangˋ. a+ baˋ ba ngi."}
  - n: 8
    speaker: 阿明
    en: "Dad… I'm sorry."
    sx: {hanzi: "阿爸……敗勢。", pinyin: "aˊ baˊ … paiˇ se."}
    hl: {hanzi: "阿爸……敗勢。", pinyin: "a+ baˋ … pai+ sheˇ."}
  - n: 9
    speaker: 阿爸
    en: "Never mind that. Quick now, walk carefully, follow the torch. Sam, give A-in your arm."
    sx: {hanzi: "莫講了。遽遽，細義行，跈等手電筒仔。Sam，你扶阿英。", pinyin: "mog gongˋ leˊ. giagˋ giagˋ, se ngi hangˇ, tenˇ denˋ suˋ tien tungˇ eˋ. Sam, nˇ fuˇ aˊ inˊ."}
    hl: {hanzi: "莫講了。遽遽，細義行，跈等手電筒仔。Sam，你扶阿英。", pinyin: "mogˋ gongˊ leˋ. giag giag, seˇ ngi+ hang, ten denˊ shiuˊ tien+ tung er. Sam, ngi fu a+ rhinˋ."}
  - n: 10
    speaker: 阿英
    en: "(to Sam, on the way down) Why didn't you call?"
    sx: {hanzi: "你仰會毋打電話？", pinyin: "nˇ ngiongˋ voi mˇ daˋ tien fa?"}
    hl: {hanzi: "你仰會毋打電話？", pinyin: "ngi ngiongˊ voi+ m daˊ tien+ faˇ?"}
  - n: 11
    speaker: Sam
    en: "The calls wouldn't go through. We shouted for help, but there was only the echo."
    sx: {hanzi: "打毋出去。𫣆兜大聲喊救命，單淨有回聲。", pinyin: "daˋ mˇ cudˋ hi. enˊ deuˊ tai sangˊ hemˊ giu miang, danˊ qiang iuˊ fiˇ sangˊ."}
    hl: {hanzi: "打毋出去。𫣆兜大聲喊救命，單淨有回聲。", pinyin: "daˊ m chud hiˇ. enˋ deuˋ tai+ shangˋ hemˋ giuˇ miang+, danˋ ciang+ rhiuˋ fui shangˋ."}
  - n: 12
    speaker: 阿英
    en: "Grandma was so frightened she couldn't eat."
    sx: {hanzi: "阿婆嚇著了，驚到食毋落飯。", pinyin: "aˊ poˇ hagˋ doˋ leˊ, giangˊ do siid mˇ log fan."}
    hl: {hanzi: "阿婆嚇著了，驚到食毋落飯。", pinyin: "a+ po hag doˊ leˋ, giangˋ doˇ shidˋ m logˋ pon+."}
  - n: 13
    speaker: 阿婆
    en: "(at home, eleven at night, running out to the car, crying and trembling) A-min! Sam! You're back safe, that's all that matters!"
    sx: {hanzi: "阿明！Sam！平安轉來就好！", pinyin: "aˊ minˇ! Sam! pinˇ onˊ zonˋ loiˇ qiu hoˋ!"}
    hl: {hanzi: "阿明！Sam！平安轉來就好！", pinyin: "a+ min! Sam! pin onˋ zhonˊ loi ciu+ hoˊ!"}
  - n: 14
    speaker: 阿婆
    en: "Seeing you back safe, my heart can rest."
    sx: {hanzi: "看著你兜平安轉來，𠊎心肝頭就寬心了。", pinyin: "kon doˋ nˇ deuˊ pinˇ onˊ zonˋ loiˇ, ngaiˇ ximˊ gonˊ teuˇ qiu konˊ ximˊ leˊ."}
    hl: {hanzi: "看著你兜平安轉來，𠊎心肝頭就寬心了。", pinyin: "konˇ doˊ ngi deuˋ pin onˋ zhonˊ loi, ngai simˋ gonˋ teu ciu+ konˋ simˋ leˋ."}
    check: true
  - n: 15
    speaker: 阿公
    en: "(at the door) …Back."
    sx: {hanzi: "……轉來了。", pinyin: "… zonˋ loiˇ leˊ."}
    hl: {hanzi: "……轉來了。", pinyin: "… zhonˊ loi leˋ."}
  - n: 16
    speaker: 阿英
    en: "Grandma, don't cry. Look, your hands are shaking."
    sx: {hanzi: "阿婆，莫噭了。你看，你个手緊掣。", pinyin: "aˊ poˇ, mog gieu leˊ. nˇ kon, nˇ ge suˋ ginˋ cadˋ."}
    hl: {hanzi: "阿婆，莫噭了。你看，你个手緊掣。", pinyin: "a+ po, mogˋ giauˇ leˋ. ngi konˇ, ngi gaiˇ shiuˊ ginˊ chad."}
    check: true
  - n: 17
    speaker: 阿明
    en: "Grandma… I'm starving."
    sx: {hanzi: "阿婆……𠊎肚屎枵。", pinyin: "aˊ poˇ … ngaiˇ duˋ siiˋ iauˊ."}
    hl: {hanzi: "阿婆……𠊎肚屎枵。", pinyin: "a+ po … ngai duˊ shiˊ iauˋ."}
  - n: 18
    speaker: 阿婆
    en: "(already on her way to the kitchen) Yes, yes. I'll cook you some noodles. And ice for that ankle."
    sx: {hanzi: "好，好。煮麵分你食。腳愛冰一下。", pinyin: "hoˋ, hoˋ. zuˋ mien bunˊ nˇ siid. giogˋ oi benˊ idˋ ha."}
    hl: {hanzi: "好，好。煮麵分你食。腳愛冰一下。", pinyin: "hoˊ, hoˊ. zhuˊ mien+ bunˋ ngi shidˋ. giog oiˇ benˋ rhid ha+."}
    check: true

notes:
  - ref: 2
    topic: grammar
    text: >
      Urgent speech is short: 在這！在這！ "here! here!", 莫動！ "don't move!", 過來！ (line 4). Each of these is a tone group
      of its own, said with a pause after it; read them aloud that way, not run together.
  - ref: 5
    topic: vocab
    text: >
      汗流脈落 hon liuˇ mag log "dripping with sweat" (kaga115: 汗流浹背). 受傷 su songˊ "be hurt, injured" (佢打球个時節，無細義跌倒受傷 "playing ball, he fell and hurt himself"). 揹 baˇ
      (line 7) "carry on one's back" (lesson 29).
  - ref: 7
    topic: grammar
    text: >
      毋好驚 "don't be afraid": 毋好 + verb is "don't" (lesson 12), as in 毋好驚敗勢 "don't be shy about it" (an official
      sentence). 毋使驚 (lesson 33) reassures ("no need to be afraid"); 毋好驚 tells you not to be.
  - ref: 11
    topic: vocab
    text: >
      喊 has two readings and two meanings: ham "tell (someone to), call" (lesson 10: 喊人來尋), and hemˊ "shout, cry
      out" (kaga115: 喊叫): 大聲喊 tai sangˊ hemˊ "shout at the top of one's voice". 救命 "help! (lit. save a life)":
      緊喊救命 "kept crying for help".
  - ref: 12
    topic: grammar
    text: >
      嚇著 hagˋ doˋ "be frightened, get a fright" (大家聽啊著嗄分佢嚇著 "everyone got a fright when they heard"). 驚到食毋落飯
      "so frightened she couldn't eat": V到 + result (lesson 27) with 食毋落 (lesson 38).
  - ref: 14
    topic: grammar
    text: >
      Grandma's line adapts an official sentence (看著佢平安轉來，大家就寬心了 "seeing him back safe, everyone was at ease").
      寬心 konˊ ximˊ "be at ease" (kaga115: 安心、放心); 心肝頭 "in one's heart". Her version doubles the "heart", the way
      relief does, so it is marked for checking.
  - ref: 15
    topic: culture
    text: >
      Grandpa's two words at the door say everything he has to say.
  - ref: 18
    topic: vocab
    text: >
      冰 benˊ "ice"; as a verb, "chill, put ice on": 腳愛冰一下 "the ankle needs ice". Hot noodles at eleven at night are
      the Liu family's answer to any fright.

