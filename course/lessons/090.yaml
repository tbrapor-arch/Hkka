exercises:
  translate:
    - en: "His tooth hurt so much he kept crying for help."
      sx: {hanzi: "佢个牙齒痛到緊喊救命。", pinyin: "giˇ ge ngaˇ ciiˋ tung do ginˋ hemˊ giu miang."}
      hl: {hanzi: "佢个牙齒痛到緊喊救命。", pinyin: "gi gaiˇ nga chiˊ tungˇ doˇ ginˊ hemˋ giuˇ miang+."}
      check: true
    - en: "He heard footsteps behind him and turned round to see who it was."
      sx: {hanzi: "佢聽著後頭个腳步響，回轉頭來看係麼人。", pinyin: "giˇ tangˊ doˋ heu teuˇ ge giogˋ pu hiongˋ, fiˇ zonˋ teuˇ loiˇ kon he maˋ nginˇ."}
      hl: {hanzi: "佢聽著後頭个腳步響，回轉頭來看係麼人。", pinyin: "gi tangˋ doˊ heu+ teu gaiˇ giog pu+ hiongˊ, fui zhonˊ teu loi konˇ heˇ maˊ ngin."}
      source: kaga115
    - en: "If anyone's hurt, call the police and an ambulance."
      sx: {hanzi: "若係有人受傷，愛打電話喊警察同救護車。", pinyin: "na he iuˊ nginˇ su songˊ, oi daˋ tien fa ham ginˋ cadˋ tungˇ giu fu caˊ."}
      hl: {hanzi: "若係有人受傷，愛打電話喊警察摎救護車。", pinyin: "na+ heˇ rhiuˋ ngin shiu+ shongˋ, oiˇ daˊ tien+ faˇ hamˇ ginˇ cad lauˋ giuˇ fu+ chaˋ."}
    - en: "We shouted his name, but he didn't answer. Don't go near the edge: it isn't safe."
      sx: {hanzi: "𫣆兜喊佢个名，佢無應。莫偎過去，毋安全。", pinyin: "enˊ deuˊ hemˊ giˇ ge miangˇ, giˇ moˇ en. mog vaˋ go hi, mˇ onˊ qionˇ."}
      hl: {hanzi: "𫣆兜喊佢个名，佢無應。莫偎過去，毋安全。", pinyin: "enˋ deuˋ hemˋ gi gaiˇ miang, gi mo enˇ. mogˋ vaˊ goˇ hiˇ, m onˋ cion."}
      check: true
    - en: "The doctor saved him."
      sx: {hanzi: "先生救著佢。", pinyin: "xinˊ sangˊ giu doˋ giˇ."}
      hl: {hanzi: "先生救著佢。", pinyin: "sinˋ sangˋ giuˇ doˊ gi."}
      check: true
    - en: "A lot of firemen are working to rescue people there."
      sx: {hanzi: "當多人在該搶救。", pinyin: "dongˊ doˊ nginˇ du ge qiongˋ giu."}
      hl: {hanzi: "當多人在該搶救。", pinyin: "dongˋ doˋ ngin diˇ gai ciongˊ giuˇ."}
    - en: "Grandma got such a fright her heart was racing."
      sx: {hanzi: "阿婆嚇著了，心跳當遽。", pinyin: "aˊ poˇ hagˋ doˋ leˊ, ximˊ tiau dongˊ giagˋ."}
      hl: {hanzi: "阿婆嚇著了，心跳當遽。", pinyin: "a+ po hag doˊ leˋ, simˋ tiauˇ dongˋ giag."}
      check: true
  fill:
    - en: "Don't be frightened!"
      sx: {hanzi: "毋好___！", pinyin: "mˇ hoˋ ___!", answer_hanzi: "驚", answer: "giangˊ"}
      hl: {hanzi: "毋好___！", pinyin: "m hoˊ ___!", answer_hanzi: "驚", answer: "giangˋ"}
    - en: "Is anyone hurt?"
      sx: {hanzi: "有人___無？", pinyin: "iuˊ nginˇ ___ moˇ?", answer_hanzi: "受傷", answer: "su songˊ"}
      hl: {hanzi: "有人___無？", pinyin: "rhiuˋ ngin ___ mo?", answer_hanzi: "受傷", answer: "shiu+ shongˋ"}
    - en: "Back safe: that's all that matters."
      sx: {hanzi: "___轉來就好。", pinyin: "___ zonˋ loiˇ qiu hoˋ.", answer_hanzi: "平安", answer: "pinˇ onˊ"}
      hl: {hanzi: "___轉來就好。", pinyin: "___ zhonˊ loi ciu+ hoˊ.", answer_hanzi: "平安", answer: "pin onˋ"}

