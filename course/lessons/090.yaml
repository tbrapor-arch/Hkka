id: 90
title:
  en: "Rescue"
  sx: {hanzi: "平安轉來就好", pinyin: "pinˇ onˊ zonˋ loiˇ qiu hoˋ"}
  hl: {hanzi: "平安轉來就好", pinyin: "pin onˋ zhonˊ loi ciu+ hoˊ"}
review: false
setting: >-
  The same night, nine o'clock. At seven, when the boys were not back, Grandma phoned 119; the fire brigade's rescue
  team (消防隊) went up from 南庄, and A-in and Mr Liu drove there to meet them. On the slope below the ridge, Sam's
  phone is down to its last few per cent, with no signal.
names: [南庄, 阿英, 阿明, 阿姊, 消防隊]

dialogue:
  - n: 1
    speaker: 阿英
    en: "(far below, shouting) A-min! Sam!"
    sx: {hanzi: "阿明！Sam！", pinyin: "aˊ minˇ! Sam!"}
    hl: {hanzi: "阿明！Sam！", pinyin: "a+ min! Sam!"}
  - n: 2
    speaker: 阿明
    en: "Sis! We're here! Here!"
    sx: {hanzi: "阿姊！𠊎兜在這！在這！", pinyin: "aˊ jiˋ! ngaiˇ deuˊ coiˊ iaˋ! coiˊ iaˋ!"}
    hl: {hanzi: "阿姊！𠊎兜在這！在這！", pinyin: "a+ ze! ngai deuˋ coiˋ liaˊ! coiˋ liaˊ!"}
  - n: 3
    speaker: Sam
    en: "(holding the phone up high) Up here! I'm holding up a light: can you see it?"
    sx: {hanzi: "這位！山頂！𠊎擎等電火，看著無？", pinyin: "iaˋ vi! sanˊ dangˋ! ngaiˇ kiaˇ denˋ tien foˋ, kon doˋ moˇ?"}
    hl: {hanzi: "這位！山頂！𠊎擎等電火，看著無？", pinyin: "liaˊ vui+! sanˋ dangˊ! ngai kia denˊ tien+ foˊ, konˇ doˊ mo?"}
  - n: 4
    speaker: 消防隊員
    en: "(a rescuer, from below) We see it! Don't move! We're the fire brigade, we're coming up close to get you!"
    sx: {hanzi: "看著吔！莫動！𠊎兜係消防隊，偎過來搶救你兜！", pinyin: "kon doˋ leˊ! mog tungˊ! ngaiˇ deuˊ he seuˊ fongˇ cui, vaˋ go loiˇ qiongˋ giu nˇ deuˊ!"}
    hl: {hanzi: "看著咧！莫動！𠊎兜係消防隊，偎過來搶救你兜！", pinyin: "konˇ doˊ leˋ! mogˋ tungˋ! ngai deuˋ heˇ siauˋ fong chui+, vaˊ goˇ loi ciongˊ giuˇ ngi deuˋ!"}
  - n: 5
    speaker: 阿英
    en: "(arriving out of breath, torch in hand) Is anyone hurt? We've been walking so fast we're dripping with sweat!"
    sx: {hanzi: "有人受傷無？𠊎兜行到汗流脈落！", pinyin: "iuˊ nginˇ su songˊ moˇ? ngaiˇ deuˊ hangˇ do hon liuˇ mag log!"}
    hl: {hanzi: "有人受傷無？𠊎兜行到汗流脈落！", pinyin: "rhiuˋ ngin shiu+ shongˋ mo? ngai deuˋ hang doˇ hon+ liu mag logˋ!"}
  - n: 6
    speaker: Sam
    en: "A-min's twisted his ankle. He can't walk on it."
    sx: {hanzi: "阿明个腳目珠扭著吔，行毋得。", pinyin: "aˊ minˇ ge giogˋ mugˋ zuˊ ngiuˋ doˋ leˊ, hangˇ mˇ dedˋ."}
    hl: {hanzi: "阿明个腳目珠偏著咧，行毋得。", pinyin: "a+ min gaiˇ giog mug zhuˋ pienˋ doˊ leˋ, hang m ded."}
  - n: 7
    speaker: 阿爸
    en: "Don't be frightened. Dad'll carry you on his back."
    sx: {hanzi: "毋好驚。阿爸揹你。", pinyin: "mˇ hoˋ giangˊ. aˊ baˊ baˇ nˇ."}
    hl: {hanzi: "毋好驚。阿爸揹你。", pinyin: "m hoˊ giangˋ. a+ baˋ ba ngi."}
  - n: 8
    speaker: 阿明
    en: "Dad… I'm sorry."
    sx: {hanzi: "阿爸……敗勢。", pinyin: "aˊ baˊ … paiˇ se."}
    hl: {hanzi: "阿爸……敗勢。", pinyin: "a+ baˋ … pai+ sheˇ."}
  - n: 9
    speaker: 阿爸
    en: "Never mind that. It's dark: walk slowly, walk carefully, follow the torch. Sam, give A-in your arm."
    sx: {hanzi: "莫講吔。暗晡頭，慢慢仔行，細義行，跈等手電筒仔。Sam，你扶阿英。", pinyin: "mog gongˋ leˊ. am buˊ teuˇ, man man eˋ hangˇ, se ngi hangˇ, tenˇ denˋ suˋ tien tungˇ eˋ. Sam, nˇ fuˇ aˊ inˊ."}
    hl: {hanzi: "莫講咧。暗晡頭，慢慢仔行，細義行，跈等手電筒仔。Sam，你扶阿英。", pinyin: "mogˋ gongˊ leˋ. amˇ buˋ teu, man+ man+ er hang, seˇ ngi+ hang, ten denˊ shiuˊ tien+ tung er. Sam, ngi fu a+ rhinˋ."}
  - n: 10
    speaker: 阿英
    en: "(to Sam, on the way down) Why didn't you call?"
    sx: {hanzi: "你仰會無打電話？", pinyin: "nˇ ngiongˋ voi moˇ daˋ tien fa?"}
    hl: {hanzi: "你仰會無打電話？", pinyin: "ngi ngiongˊ voi+ mo daˊ tien+ faˇ?"}
  - n: 11
    speaker: Sam
    en: "The calls wouldn't go through. We shouted for help, but there was only the echo."
    sx: {hanzi: "打毋出去。𠊎兜大聲喊救命，單淨有應聲。", pinyin: "daˋ mˇ cudˋ hi. ngaiˇ deuˊ tai sangˊ hemˊ giu miang, danˊ qiang iuˊ in sangˊ."}
    hl: {hanzi: "打毋出去。𠊎兜大聲喊救命，單淨有應聲。", pinyin: "daˊ m chud hiˇ. ngai deuˋ tai+ shangˋ hemˋ giuˇ miang+, danˋ ciang+ rhiuˋ rhinˇ shangˋ."}
  - n: 12
    speaker: 阿英
    en: "Grandma was so frightened she couldn't eat. She phoned 119 and called the fire brigade, the police and an ambulance. As soon as we're back at the car, call her, quick!"
    sx: {hanzi: "阿婆嚇著吔，驚到食毋落飯。佢打一一九，喊消防隊、警察同救護車來救你兜。到車項，遽遽打電話分佢！", pinyin: "aˊ poˇ hagˋ doˋ leˊ, giangˊ do siid mˇ log fan. giˇ daˋ idˋ idˋ giuˋ, ham seuˊ fongˇ cui, ginˋ cadˋ tungˇ giu fu caˊ loiˇ giu nˇ deuˊ. do caˊ hong, giagˋ giagˋ daˋ tien fa bunˊ giˇ!"}
    hl: {hanzi: "阿婆嚇著咧，驚到食毋落飯。佢打一一九，喊消防隊、警察摎救護車來救你兜。到車項，遽遽打電話分佢！", pinyin: "a+ po hag doˊ leˋ, giangˋ doˇ shidˋ m logˋ pon+. gi daˊ rhid rhid giuˊ, hamˇ siauˋ fong chui+, ginˇ cad lauˋ giuˇ fu+ chaˋ loi giuˇ ngi deuˋ. doˇ chaˋ hong+, giag giag daˊ tien+ faˇ bunˋ gi!"}
  - n: 13
    speaker: 阿婆
    en: "(at home, eleven at night, running out to the car, crying and trembling) A-min! Sam! You're back safe, that's all that matters!"
    sx: {hanzi: "阿明！Sam！平安轉來就好！", pinyin: "aˊ minˇ! Sam! pinˇ onˊ zonˋ loiˇ qiu hoˋ!"}
    hl: {hanzi: "阿明！Sam！平安轉來就好！", pinyin: "a+ min! Sam! pin onˋ zhonˊ loi ciu+ hoˊ!"}
  - n: 14
    speaker: 阿婆
    en: "Seeing you back safe, my heart can rest."
    sx: {hanzi: "看著你兜平安轉來，𠊎心肝頭就寬心吔。", pinyin: "kon doˋ nˇ deuˊ pinˇ onˊ zonˋ loiˇ, ngaiˇ ximˊ gonˊ teuˇ qiu konˊ ximˊ leˊ."}
    hl: {hanzi: "看著你兜平安轉來，𠊎心肝頭就寬心咧。", pinyin: "konˇ doˊ ngi deuˋ pin onˋ zhonˊ loi, ngai simˋ gonˋ teu ciu+ konˋ simˋ leˋ."}
    check: true
  - n: 15
    speaker: 阿公
    en: "(at the door) …Back."
    sx: {hanzi: "……轉來吔。", pinyin: "… zonˋ loiˇ leˊ."}
    hl: {hanzi: "……轉來咧。", pinyin: "… zhonˊ loi leˋ."}
  - n: 16
    speaker: 阿英
    en: "Grandma, don't cry. Look, your hands are shaking."
    sx: {hanzi: "阿婆，莫噭吔。你看，你个手緊掣。", pinyin: "aˊ poˇ, mog gieu leˊ. nˇ kon, nˇ ge suˋ ginˋ cadˋ."}
    hl: {hanzi: "阿婆，莫噭咧。你看，你个手緊掣。", pinyin: "a+ po, mogˋ giauˇ leˋ. ngi konˇ, ngi gaiˇ shiuˊ ginˊ chad."}
    check: true
  - n: 17
    speaker: 阿明
    en: "Grandma… I'm starving."
    sx: {hanzi: "阿婆……𠊎肚屎枵。", pinyin: "aˊ poˇ … ngaiˇ duˋ siiˋ iauˊ."}
    hl: {hanzi: "阿婆……𠊎肚屎枵。", pinyin: "a+ po … ngai duˊ shiˊ iauˋ."}
  - n: 18
    speaker: 阿婆
    en: "(already on her way to the kitchen) Yes, yes. I'll cook you some noodles. And that ankle needs ice."
    sx: {hanzi: "好，好。煮麵分你食。腳目珠愛冰敷。", pinyin: "hoˋ, hoˋ. zuˋ mien bunˊ nˇ siid. giogˋ mugˋ zuˊ oi benˊ fuˊ."}
    hl: {hanzi: "好，好。煮麵分你食。腳目珠愛冰敷。", pinyin: "hoˊ, hoˊ. zhuˊ mien+ bunˋ ngi shidˋ. giog mug zhuˋ oiˇ benˋ fuˋ."}

notes:
  - ref: 2
    topic: grammar
    text: >
      Urgent speech is short: 在這！在這！ "here! here!", 莫動！ "don't move!", 過來！ (line 4). Each of these is a tone group
      of its own, said with a pause after it; read them aloud that way, not run together.
  - ref: 5
    topic: vocab
    text: >
      汗流脈落 hon liuˇ mag log "dripping with sweat" (kaga115: 汗流浹背). 受傷 su songˊ "be hurt, injured" (佢打球个時節，無細義跌倒受傷 "playing ball, he fell and hurt himself"). 揹 baˇ
      (line 7) "carry on one's back" (lesson 29).
  - ref: 7
    topic: grammar
    text: >
      毋好驚 "don't be afraid": 毋好 + verb is "don't" (lesson 12). 毋使驚 (lesson 33) reassures ("no need to be
      afraid"); 毋好驚 tells you not to be.
  - ref: 11
    topic: vocab
    text: >
      喊 has two readings. The 2013 lists split them, ham 叫 "call, tell (someone to)" (喊人來尋, lesson 89) and hemˊ 喊叫
      "shout"; the MOE dictionary gives both senses under both readings, so the split is a tendency, not a rule.
      大聲喊 tai sangˊ hemˊ "shout at the top of one's voice"; 救命 "help! (lit. save a life)": 緊喊救命 "kept crying for
      help". 應聲 in sangˊ "echo" (kaga115: 回音): 行到山坑肚，講話較大聲兜仔，就會應聲 (official example).
  - ref: 12
    topic: grammar
    text: >
      嚇著 hagˋ doˋ "be frightened, get a fright" (大家聽啊著嗄分佢嚇著 "everyone got a fright when they heard"). 驚到食毋落飯
      "so frightened she couldn't eat": V到 + result (lesson 27) with 食毋落 (lesson 38).
  - ref: 12
    topic: culture
    text: >
      119 (一一九 idˋ idˋ giuˋ) is the number for fire, rescue and ambulance in Taiwan; the 消防隊 (fire brigade) runs
      mountain rescue. The official examples: 火燒屋愛通知消防隊來救火 "for a fire, call the fire brigade". Two pieces of
      general knowledge, not from the data: if your own network has no signal, 112 can often still be dialled; and when
      lost in the hills, stay where you are and let the rescuers come to you, as the boys did. 消防隊 is not in the
      word lists and is given as a name.
  - ref: 14
    topic: grammar
    text: >
      Grandma's line adapts an official sentence (看著佢平安轉來，大家就寬心吔 "seeing him back safe, everyone was at ease").
      寬心 konˊ ximˊ "be at ease" (kaga115: 安心、放心); 心肝頭 "in one's heart". Her version doubles the "heart", the way
      relief does, so it is marked for checking.
  - ref: 15
    topic: culture
    text: >
      Grandpa's three syllables at the door, 轉來吔, say everything he has to say.
  - ref: 18
    topic: vocab
    text: >
      腳目珠愛冰敷 "the ankle needs an ice pack": 冰 benˊ "ice", 冰敷 "apply ice". The official sentence gives the rule:
      腳目珠扭着，一對時內愛冰敷正較遽好 "a twisted ankle needs ice within twenty-four hours to heal faster" (Hailu
      腳目珠偏着…). 腳目珠 giogˋ mugˋ zuˊ "ankle", literally "the eye of the foot". Hot noodles at eleven at night are
      the Liu family's answer to any fright.

