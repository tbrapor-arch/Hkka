      hl: {hanzi: "你最歡喜哪隻季節？——春天，有桐花。", pinyin: "ngi zuiˇ fonˋ hiˊ nai+ zhag guiˇ zied? — chunˋ tienˋ, rhiuˋ tung faˋ."}
