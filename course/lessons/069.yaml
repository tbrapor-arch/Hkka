id: 69
title:
  en: "The 桐花 festival"
  sx: {hanzi: "開到白雪雪仔", pinyin: "koiˊ do pag xiedˋ xiedˋ eˇ"}
  hl: {hanzi: "開到白雪雪", pinyin: "koiˋ doˇ pagˋ sied sied"}
review: false
setting: >-
  Sunday 25 April, the hills above 公館, where Grandpa used to walk with his tea (lesson 20). The tung trees are in
  flower, and the path is white with fallen petals. A-in and Sam have come alone, as they agreed on the phone in March
  (lesson 60).
names: [阿英, 公館, 竹東]

dialogue:
  - n: 1
    speaker: 阿英
    en: "Look: the whole hillside of tung trees is snow-white with flowers."
    sx: {hanzi: "你看，滿山个油桐花開到白雪雪仔。", pinyin: "nˇ kon, manˊ sanˊ ge iuˇ tungˇ faˊ koiˊ do pag xiedˋ xiedˋ eˇ."}
    hl: {hanzi: "你看，滿山个油桐花開到白雪雪。", pinyin: "ngi konˇ, manˋ sanˋ gaiˇ rhiu tung faˋ koiˋ doˇ pagˋ sied sied."}
  - n: 2
    speaker: Sam
    en: "And the mountain path is covered with fallen petals, all white too. It's like snow in May."
    sx: {hanzi: "山路項乜係落花，白雪雪仔，像五月个雪。", pinyin: "sanˊ lu hong me he log faˊ, pag xiedˋ xiedˋ eˇ, qiong ngˋ ngied ge xiedˋ."}
    hl: {hanzi: "山路項乜係落花，白雪雪仔，像五月个雪。", pinyin: "sanˋ lu+ hong+ meˇ heˇ logˋ faˋ, pagˋ sied sied er, ciongˇ ngˊ ngiedˋ gaiˇ sied."}
  - n: 3
    speaker: 阿英
    en: "In spring the tung flowers bloom; in summer it's hot; in autumn the leaves turn red."
    sx: {hanzi: "春天桐花開，熱天當熱，秋天樹葉變紅。", pinyin: "cunˊ tienˊ tungˇ faˊ koiˊ, ngied tienˊ dongˊ ngied, qiuˊ tienˊ su iab bien fungˇ."}
    hl: {hanzi: "春天桐花開，熱天當熱，秋天樹葉變紅。", pinyin: "chunˋ tienˋ tung faˋ koiˋ, ngiedˋ tienˋ dongˋ ngiedˋ, ciuˋ tienˋ shu+ rhabˋ bienˇ fung."}
  - n: 4
    speaker: Sam
    en: "And the tea fields are green all year."
    sx: {hanzi: "茶園歸年都浸青。", pinyin: "caˇ ienˇ guiˊ ngienˇ du jim qiangˊ."}
    hl: {hanzi: "茶園歸年都浸青。", pinyin: "ca rhan guiˋ ngien du+ zimˇ ciangˋ."}
    check: true
  - n: 5
    speaker: 阿英
    en: "(laughing) You've learnt 浸青? Then how do you say 'very red'?"
    sx: {hanzi: "你會講浸青吔？恁樣，「當紅」愛仰般講？", pinyin: "nˇ voi gongˋ jim qiangˊ leˊ? anˋ ngiongˇ, dongˊ fungˇ oi ngiongˋ banˊ gongˋ?"}
    hl: {hanzi: "你會講浸青咧？恁樣，「當紅」愛仰般講？", pinyin: "ngi voi+ gongˊ zimˇ ciangˋ leˋ? an ngiong, dongˋ fung oiˇ ngiongˊ banˋ gongˊ?"}
  - n: 6
    speaker: Sam
    en: "啾紅! Like your face right now."
    sx: {hanzi: "啾紅！像你這下个面。", pinyin: "jiuˊ fungˇ! qiong nˇ iaˋ ha ge mien."}
    hl: {hanzi: "啾紅！像你這下个面。", pinyin: "ziuˋ fung! ciongˇ ngi liaˊ ha+ gaiˇ mienˇ."}
  - n: 7
    speaker: 阿英
    en: "…Sam. The thing you couldn't say in the letter."
    sx: {hanzi: "……Sam。信肚講毋出來个。", pinyin: "… Sam. xin duˋ gongˋ mˇ cudˋ loiˇ ge."}
    hl: {hanzi: "……Sam。信肚講毋出來个。", pinyin: "… Sam. sinˇ duˊ gongˊ m chud loi gaiˇ."}
  - n: 8
    speaker: Sam
    en: "(stopping on the path) In 竹東, every day… I missed you."
    sx: {hanzi: "在竹東，逐日……𠊎盡想你。", pinyin: "coiˊ zugˋ dungˊ, dagˋ ngidˋ … ngaiˇ qin xiongˋ nˇ."}
    hl: {hanzi: "在竹東，逐日……𠊎最想你。", pinyin: "coiˋ zhug dungˋ, dag ngid … ngai zuiˇ siongˊ ngi."}
  - n: 9
    speaker: 阿英
    en: "(after a moment) I know. …I'm going to the county interview."
    sx: {hanzi: "𠊎知。……縣政府个面試，𠊎愛去。", pinyin: "ngaiˇ diˊ. … ien ziin fuˋ ge mien cii, ngaiˇ oi hi."}
    hl: {hanzi: "𠊎知。……縣政府个面試，𠊎愛去。", pinyin: "ngai diˋ. … rhanˇ zhinˇ fuˊ gaiˇ mienˇ chiˇ, ngai oiˇ hiˇ."}
    check: true
  - n: 10
    speaker: Sam
    en: "Really? Because of the job, or…"
    sx: {hanzi: "有影無？係為著頭路，還係……", pinyin: "iuˊ iangˋ moˇ? he vi doˋ teuˇ lu, hanˇ he …"}
    hl: {hanzi: "有影無？係為著頭路，抑係……", pinyin: "rhiuˋ rhangˊ mo? heˇ vui+ doˊ teu lu+, rha+ heˇ …"}
  - n: 11
    speaker: 阿英
    en: "(walking on, not looking back) Come on, take a photo. The flowers are falling: in a week there'll be none left."
    sx: {hanzi: "來，翕相。花緊落，過一禮拜就無吔。", pinyin: "loiˇ, hibˋ xiong. faˊ ginˋ log, go idˋ liˊ bai qiu moˇ leˊ."}
    hl: {hanzi: "來，翕相。花緊落，過一禮拜就無咧。", pinyin: "loi, hib siongˇ. faˋ ginˊ logˋ, goˇ rhid liˋ baiˇ ciu+ mo leˋ."}
  - n: 12
    speaker: Sam
    en: "(taking the photo) The sky's blue, the clouds are white, the flowers are white…"
    sx: {hanzi: "天頂青青，雲白雪雪仔，花乜白雪雪仔……", pinyin: "tienˊ dangˋ qiangˊ qiangˊ, iunˇ pag xiedˋ xiedˋ eˇ, faˊ me pag xiedˋ xiedˋ eˇ …"}
    hl: {hanzi: "天頂青青，雲白雪雪仔，花乜白雪雪仔……", pinyin: "tienˋ dangˊ ciangˋ ciangˋ, rhun pagˋ sied sied er, faˋ meˇ pagˋ sied sied er …"}
  - n: 13
    speaker: 阿英
    en: "And your face is 啾紅 too."
    sx: {hanzi: "你个面乜啾紅。", pinyin: "nˇ ge mien me jiuˊ fungˇ."}
    hl: {hanzi: "你个面乜啾紅。", pinyin: "ngi gaiˇ mienˇ meˇ ziuˋ fung."}
  - n: 14
    speaker: 阿英
    en: "Come and sit in the shade of the trees and cool off. Look, a butterfly!"
    sx: {hanzi: "來，坐在樹蔭下背尞涼。你看，揚蝶仔！", pinyin: "loiˇ, coˊ coiˊ su im haˊ boi liau liongˇ. nˇ kon, iongˇ iag eˋ!"}
    hl: {hanzi: "來，坐在樹蔭下背尞涼。你看，蝶仔！", pinyin: "loi, coˋ coiˋ shu+ rhimˇ haˋ boiˇ liau+ liong. ngi konˇ, rhagˋ er!"}
  - n: 15
    speaker: Sam
    en: "(sitting on a stone) This path is lovely to walk, and the woods are beautiful… I'd come here every year at this season."
    sx: {hanzi: "這條山路當好行，樹林當靚……𠊎逐年這隻季節都想來。", pinyin: "iaˋ tiauˇ sanˊ lu dongˊ hoˋ hangˇ, su naˇ dongˊ jiangˊ … ngaiˇ dagˋ ngienˇ iaˋ zagˋ gui jiedˋ du xiongˋ loiˇ."}
    hl: {hanzi: "這條山路當好行，樹林當靚……𠊎逐年這隻季節都想來。", pinyin: "liaˊ tiau sanˋ lu+ dongˋ hoˊ hang, shu+ na dongˋ ziangˋ … ngai dag ngien liaˊ zhag guiˇ zied du+ siongˊ loi."}

notes:
  - ref: 1
    topic: grammar
    text: >
      白雪雪仔 pag xiedˋ xiedˋ eˇ "snow-white": colour + an image said twice, ABB. The line is an official sentence in
      Sixian (滿山个油桐花開到白雪雪仔) and Hailu (…開到白雪雪); the Hailu word list itself has 白雪雪仔 pagˋ sied sied er,
      with 仔, and its definition gives 天頂个雲白雪雪仔 (Sam's line 12). Compare the AA of lesson 45: ABB
      adds a picture, "white as snow". 開到白雪雪 "bloom until (the hill is) snow-white": V到 + result (lesson 27).
  - ref: 1
    topic: culture
    text: >
      油桐花 iuˇ tungˇ faˊ, the tung tree's white flower, blooms in the Hakka hills in April and May; an official example
      mentions 桐花祭 "the tung blossom festival", and another sends people to 苗栗公館 to see it (天光日放尞，𠊎摎你兜共下
      去苗栗公館看油桐花). The flowers give 桐油 "tung oil": 桐油係桐花打子取桐仁榨出來个 "tung oil is pressed from the
      kernels of the tung fruit" (official). The dictionary's entry for 桐花 adds 所以又叫五月雪 "so it is also called
      'May snow'", which is what Sam half says in line 2 (油桐花 is also 六月雪, "June snow"). 落花 "fallen petals" (line 2).
  - ref: 3
    topic: vocab
    text: >
      The seasons: 春天 "spring", 熱天 "summer", 秋天 "autumn", 寒天 "winter" (lesson 29; Hailu 冷天). Sixian 熱天 and 寒天
      are "the hot time" and "the cold time".
  - ref: 4
    topic: grammar
    text: >
      Fixed intensifiers: some colour words take their own "very" in front: 浸青 jim qiangˊ "deep green"
      (浸青个短豆仔 "bright green string beans"), 啾紅 jiuˊ fungˇ "bright red" (五月个石榴仔花開到啾紅 "the May pomegranate
      flowers come out bright red", official; also 漬紅 for the same red, 歸身變到啾紅(漬紅)). 青 qiangˊ (lesson 8) covers green and blue: 天頂青青 (line 12) "the sky is blue". 歸年
      "the whole year": 歸 "whole".
  - ref: 8
    topic: culture
    text: >
      𠊎盡想你 "I missed you so much": 盡 "very" here, not "most" (盡 is both; Hailu 最). In the letter (lesson 62) Sam
      wrote 想念, a written word with one example; out loud it is 想 (大家人都盡想你呢 "everyone misses you so much").
      Here he says whom. A-in's answer is two
      syllables, then a decision: the family meeting (lesson 68) had no conclusion; on this walk she decides to go to
      the interview (lesson 75).
  - ref: 10
    topic: hailu
    text: >
      還係 "or" in a question is Sixian; Hailu says 抑係 (lesson 18). Sam is cut off before he can finish.
  - ref: 11
    topic: grammar
    text: >
      花緊落 "the flowers keep falling": 緊 + verb "keep on…" (lesson 29). 過一禮拜 "a week from now".
  - ref: 14
    topic: vocab
    text: >
      揚蝶仔 iongˇ iag eˋ "butterfly" (Hailu 蝶仔); 坐在樹蔭下背尞涼 "sit in the shade and cool off" is an official
      sentence: 樹蔭 su im "the shade of a tree", 尞涼 liau liongˇ "rest in the cool". 樹林 (line 15) "woods, forest".

