      sx: {hanzi: "佢昨晡日著一領啾紅个衫，看起來當靚。", pinyin: "giˇ coˊ buˊ ngidˋ zogˋ idˋ liangˊ jiuˊ fungˇ ge samˊ, kon hiˋ loiˇ dongˊ jiangˊ."}
      hl: {hanzi: "佢昨晡日著一領啾紅个衫，看起來當靚。", pinyin: "gi coˋ buˋ ngid zhog rhid liangˋ ziuˋ fung gaiˇ samˋ, konˇ hiˊ loi dongˋ ziangˋ."}
      source: moe
