exercises:
  translate:
    - en: "Grandma's radio is always on the Hakka channel."
      sx: {hanzi: "阿婆个收音機逐日都在客家頻道。", pinyin: "aˊ poˇ ge suˊ imˊ giˊ dagˋ ngidˋ du coiˊ hagˋ gaˊ pinˇ to."}
      hl: {hanzi: "阿婆个收音機逐日都在客家頻道。", pinyin: "a+ po gaiˇ shiuˋ rhimˋ giˋ dag ngid du+ coiˋ hag gaˋ pin to+."}
    - en: "A-in recorded the programme on her phone; the station will broadcast it again tonight."
      sx: {hanzi: "阿英用手機仔錄音，電臺今暗晡會再播一擺。", pinyin: "aˊ inˊ iung suˋ giˊ eˋ liug imˊ, tien toiˇ gimˊ am buˊ voi zai boˊ idˋ baiˋ."}
      hl: {hanzi: "阿英用手機錄音，電臺今暗晡會再播一擺。", pinyin: "a+ rhinˋ rhung+ shiuˊ giˋ liugˋ rhimˋ, tien+ toi gimˋ amˇ buˋ voi+ zaiˇ boˋ rhid baiˊ."}
      check: true
    - en: "A radio has to pick up the waves before you can hear the station's programmes."
      sx: {hanzi: "收音機愛收得著電波，正聽得著電臺个節目。", pinyin: "suˊ imˊ giˊ oi suˊ dedˋ doˋ tien poˊ, zang tangˊ dedˋ doˋ tien toiˇ ge jiedˋ mug."}
      hl: {hanzi: "收音機愛收得著電波，正聽得著電臺个節目。", pinyin: "shiuˋ rhimˋ giˋ oiˇ shiuˋ ded doˊ tien+ poˋ, zhangˇ tangˋ ded doˊ tien+ toi gaiˇ zied mug."}
    - en: "Wait a moment, I'll write down your name and number."
      sx: {hanzi: "等一下，𠊎摎你个姓名同號碼寫起來。", pinyin: "denˋ idˋ ha, ngaiˇ lauˊ nˇ ge xiang miangˇ tungˇ ho maˊ xiaˋ hiˋ loiˇ."}
      hl: {hanzi: "等一下，𠊎摎你个姓名摎號碼寫起來。", pinyin: "denˊ rhid ha+, ngai lauˋ ngi gaiˇ siangˇ miang lauˋ ho+ maˋ siaˊ hiˊ loi."}
    - en: "Grandpa likes listening to the radio while he works in the tea field."
      sx: {hanzi: "阿公好一片在茶園做事，一片聽廣播。", pinyin: "aˊ gungˊ hau idˋ pienˋ coiˊ caˇ ienˇ zo se, idˋ pienˋ tangˊ gongˋ boˊ."}
      hl: {hanzi: "阿公好一片在茶園做事，一片聽廣播。", pinyin: "a+ gungˋ hauˇ rhid pienˊ coiˋ ca rhan zoˇ she+, rhid pienˊ tangˋ gongˊ boˇ."}
      check: true
    - en: "The next item is a song performed by the villagers of 美濃."
      sx: {hanzi: "下一个節目，係美濃鄉親表演个歌曲。", pinyin: "ha idˋ ge jiedˋ mug, he miˊ nungˇ hiongˊ qinˊ beuˋ ienˊ ge goˊ kiugˋ."}
      hl: {hanzi: "下一个節目，係美濃鄉親表演个歌曲。", pinyin: "ha+ rhid gaiˇ zied mug, heˇ miˊ nung hiongˋ cinˋ biauˊ rhanˋ gaiˇ goˋ kiug."}
    - en: "She has hosted this programme for ten years, and she hosts it brilliantly."
      sx: {hanzi: "佢擔任這隻節目个主持人十年了，主持到當精彩。", pinyin: "giˇ damˊ im iaˋ zagˋ jiedˋ mug ge zuˋ ciiˇ nginˇ siib ngienˇ leˊ, zuˋ ciiˇ do dongˊ jinˊ caiˋ."}
      hl: {hanzi: "佢擔任這隻節目个主持人十年了，主持到當精彩。", pinyin: "gi damˋ rhim+ liaˊ zhag zied mug gaiˇ zhuˊ chi ngin shibˋ ngien leˋ, zhuˊ chi doˇ dongˋ zinˋ caiˊ."}
      check: true
  fill:
