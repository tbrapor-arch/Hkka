exercises:
  translate:
    - en: "He is set on winning next month's Hakka speech contest, and now he practises hard every day."
      sx: {hanzi: "佢一心想愛拿著下隻月客話演講比賽个第一名，這下逐日當煞猛練習。", pinyin: "giˇ idˋ ximˊ xiongˋ oi naˊ doˋ ha zagˋ ngied hagˋ fa ienˊ gongˋ biˋ soi ge ti idˋ miangˇ, iaˋ ha dagˋ ngidˋ dongˊ sadˋ mangˊ lien xib."}
      hl: {hanzi: "佢一心想愛拿著下隻月客話演講比賽个第一名，這下逐日當煞猛練習。", pinyin: "gi rhid simˋ siongˊ oiˇ naˋ doˊ ha+ zhag ngiedˋ hag voiˋ rhanˋ gongˊ biˊ soiˇ gaiˇ ti+ rhid miang, liaˊ ha+ dag ngid dongˋ sad mangˋ lien+ sibˋ."}
      source: kaga115
    - en: "The mother tongue has to be passed on: the future depends on the young."
      sx: {hanzi: "母語愛傳承，未來就看後生人。", pinyin: "muˊ ngiˊ oi conˇ siinˇ, vi loiˇ qiu kon heu sangˊ nginˇ."}
      hl: {hanzi: "母語愛傳承，未來就看後生人。", pinyin: "muˋ ngiˋ oiˇ chon shin, vui+ loi ciu+ konˇ heu+ sangˋ ngin."}
    - en: "On his way to work every day he passes the 伯公 shrine."
      sx: {hanzi: "佢逐日去上班，都會經過伯公下。", pinyin: "giˇ dagˋ ngidˋ hi songˊ banˊ, du voi ginˊ go bagˋ gungˊ haˊ."}
      hl: {hanzi: "佢逐日去上班，都會經過伯公下。", pinyin: "gi dag ngid hiˇ shongˋ banˋ, du+ voi+ ginˋ goˇ bag gungˋ haˋ."}
    - en: "At the Dragon Boat festival there aren't only 粽子 to eat: there are boat races to watch as well."
      sx: {hanzi: "五月節毋單淨有粽仔食，還有划龍船好看。", pinyin: "ngˋ ngied jiedˋ mˇ danˊ qiang iuˊ zung eˋ siid, hanˇ iuˊ paˇ liungˇ sonˇ hoˋ kon."}
      hl: {hanzi: "五月節毋單淨有粽仔食，還有划龍船好看。", pinyin: "ngˊ ngiedˋ zied m danˋ ciang+ rhiuˋ zungˇ er shidˋ, han rhiuˋ pa liung shon hoˊ konˇ."}
      check: true
    - en: "So it was you! I thought it was A-min."
      sx: {hanzi: "原來係你！𠊎試著係阿明。", pinyin: "ngienˇ loiˇ he nˇ! ngaiˇ cii doˋ he aˊ minˇ."}
      hl: {hanzi: "原來係你！𠊎試著係阿明。", pinyin: "ngien loi heˇ ngi! ngai chiˇ doˊ heˇ a+ min."}
  fill:
    - en: "Not only does she teach, she's also the head of department."
      sx: {hanzi: "佢___教書，還係主任。", pinyin: "giˇ ___ gauˊ suˊ, hanˇ he zuˋ im.", answer_hanzi: "毋單淨", answer: "mˇ danˊ qiang"}
      hl: {hanzi: "佢___教書，還係主任。", pinyin: "gi ___ gauˋ shuˋ, han heˇ zhuˊ rhim+.", answer_hanzi: "毋單淨", answer: "m danˋ ciang+"}
    - en: "Speak for about five minutes."
      sx: {hanzi: "講五分鐘___。", pinyin: "gongˋ ngˋ funˊ zungˊ ___.", answer_hanzi: "左右", answer: "zoˋ iu"}
      hl: {hanzi: "講五分鐘___。", pinyin: "gongˊ ngˊ funˋ zhungˋ ___.", answer_hanzi: "左右", answer: "zoˊ rhiu+"}
    - en: "I often forget."
      sx: {hanzi: "𠊎___毋記得。", pinyin: "ngaiˇ ___ mˇ gi dedˋ.", answer_hanzi: "輒常", answer: "jiab songˇ"}
      hl: {hanzi: "𠊎___毋記得。", pinyin: "ngai ___ m giˇ ded.", answer_hanzi: "輒常", answer: "ziabˋ shong"}

