  - {hanzi: 幾, pinyin: "giˋ", en: "how many, which (幾)", hl: {hanzi: 幾, pinyin: "giˊ"}}
  - {hanzi: 點, pinyin: "diamˋ", en: "o'clock", hl: {hanzi: 點, pinyin: "diamˊ"}}
  - {hanzi: 火車, pinyin: "foˋ caˊ", en: "train", hl: {hanzi: 火車, pinyin: "foˊ chaˋ"}}
  - {hanzi: 六, pinyin: "liugˋ", en: "six", hl: {hanzi: 六, pinyin: "liug"}}
  - {hanzi: 這下, pinyin: "iaˋ ha", en: "now", hl: {hanzi: 這下, pinyin: "liaˊ ha+"}}
  - {hanzi: 半, pinyin: "ban", en: "half", hl: {hanzi: 半, pinyin: "banˇ"}}
  - {hanzi: 阿姊, pinyin: "aˊ jiˋ", en: "big sister", hl: {hanzi: 阿姊, pinyin: "a+ ze"}}
