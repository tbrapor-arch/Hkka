exercises:
  translate:
    - en: "Where is Grandpa going?"
      sx: {hanzi: "阿公愛去哪位？", pinyin: "aˊ gungˊ oi hi nai vi?"}
      hl: {hanzi: "阿公愛去哪位？", pinyin: "a+ gungˋ oiˇ hiˇ nai+ vui+?"}
    - en: "What time is it now?"
      sx: {hanzi: "這下幾點？", pinyin: "iaˋ ha giˋ diamˋ?"}
      hl: {hanzi: "這下幾點？", pinyin: "liaˊ ha+ giˊ diamˊ?"}
    - en: "I have to work tomorrow at eight."
      sx: {hanzi: "𠊎天光日八點愛做事。", pinyin: "ngaiˇ tienˊ gongˊ ngidˋ badˋ diamˋ oi zo se."}
      hl: {hanzi: "𠊎韶早八點愛做事。", pinyin: "ngai shau zoˊ bad diamˊ oiˇ zoˇ she+."}
    - en: "A-min slept until half past six."
      sx: {hanzi: "阿明睡到六點半。", pinyin: "aˊ minˇ soi do liugˋ diamˋ ban."}
      hl: {hanzi: "阿明睡到六點半。", pinyin: "a+ min shoi+ doˇ liug diamˊ banˇ."}
    - en: "Yesterday A-in was going back to Taipei; today she isn't going."
      sx: {hanzi: "昨晡日阿英愛轉去臺北，今晡日毋去了。", pinyin: "coˊ buˊ ngidˋ aˊ inˊ oi zonˋ hi toiˇ bedˋ, gimˊ buˊ ngidˋ mˇ hi leˊ."}
      hl: {hanzi: "昨晡日阿英愛轉去臺北，今晡日毋去了。", pinyin: "coˋ buˋ ngid a+ rhinˋ oiˇ zhonˊ hiˇ toi bed, gimˋ buˋ ngid m hiˇ leˋ."}
  fill:
    - en: "What are you going to Taipei for?"
      sx: {hanzi: "你去臺北做___？", pinyin: "nˇ hi toiˇ bedˋ zo ___?", answer_hanzi: "麼个", answer: "maˋ ge"}
      hl: {hanzi: "你去臺北做___？", pinyin: "ngi hiˇ toi bed zoˇ ___?", answer_hanzi: "麼个", answer: "maˊ gaiˇ"}
    - en: "Grandma doesn't speak Mandarin."
      sx: {hanzi: "阿婆毋會講___。", pinyin: "aˊ poˇ mˇ voi gongˋ ___.", answer_hanzi: "華語", answer: "faˇ ngiˊ"}
      hl: {hanzi: "阿婆毋會講___。", pinyin: "a+ po m voi+ gongˊ ___.", answer_hanzi: "華語", answer: "fa ngiˋ"}
    - en: "It's six o'clock now."
      sx: {hanzi: "___六點了。", pinyin: "___ liugˋ diamˋ leˊ.", answer_hanzi: "這下", answer: "iaˋ ha"}
      hl: {hanzi: "___六點了。", pinyin: "___ liug diamˊ leˋ.", answer_hanzi: "這下", answer: "liaˊ ha+"}

