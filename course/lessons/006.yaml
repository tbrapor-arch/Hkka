  - {hanzi: 睡, pinyin: "soi", en: "sleep, lie down", hl: {hanzi: 睡, pinyin: "shoi+"}}
  - {hanzi: 到, pinyin: "do", en: "until, to (a point)", hl: {hanzi: 到, pinyin: "doˇ"}}
  - {hanzi: 華語, pinyin: "faˇ ngiˊ", en: "Mandarin (language)", hl: {hanzi: 華語, pinyin: "fa ngiˋ"}}
