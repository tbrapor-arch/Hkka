exercises:
  translate:
    - en: "It's going to rain tomorrow."
      sx: {hanzi: "天光日會落雨。", pinyin: "tienˊ gongˊ ngidˋ voi log iˋ."}
      hl: {hanzi: "韶早會落水。", pinyin: "shau zoˊ voi+ logˋ shuiˊ."}
    - en: "This congee is very hot."
      sx: {hanzi: "這碗粥當燒。", pinyin: "iaˋ vonˋ zugˋ dongˊ seuˊ."}
      hl: {hanzi: "這碗糜當燒。", pinyin: "liaˊ vonˊ moi dongˋ shauˋ."}
    - en: "The tea has gone cold."
      sx: {hanzi: "茶冷了。", pinyin: "caˇ langˊ leˊ."}
      hl: {hanzi: "茶冷了。", pinyin: "ca langˋ leˋ."}
    - en: "It's so hot today!"
      sx: {hanzi: "今晡日恁熱！", pinyin: "gimˊ buˊ ngidˋ anˋ ngied!"}
      hl: {hanzi: "今晡日恁熱！", pinyin: "gimˋ buˋ ngid anˊ ngiedˋ!"}
    - en: "Grandma is drying A-min's shirt."
      sx: {hanzi: "阿婆在該晒阿明个衫。", pinyin: "aˊ poˇ du ge sai aˊ minˇ ge samˊ."}
      hl: {hanzi: "阿婆在該晒阿明个衫。", pinyin: "a+ po diˇ gai saiˇ a+ min gaiˇ samˋ."}
    - en: "I don't know. It's seven now; at nine A-in is coming."
      sx: {hanzi: "𠊎毋知。這下七點，九點阿英會來。", pinyin: "ngaiˇ mˇ diˊ. iaˋ ha qidˋ diamˋ, giuˋ diamˋ aˊ inˊ voi loiˇ."}
      hl: {hanzi: "𠊎毋知。這下七點，九點阿英會來。", pinyin: "ngai m diˋ. liaˊ ha+ cid diamˊ, giuˊ diamˊ a+ rhinˋ voi+ loi."}
  fill:
    - en: "It's raining!"
      sx: {hanzi: "落雨___！", pinyin: "log iˋ ___!", answer_hanzi: "了", answer: "leˊ"}
      hl: {hanzi: "落水___！", pinyin: "logˋ shuiˊ ___!", answer_hanzi: "了", answer: "leˋ"}
    - en: "How do you know?"
      sx: {hanzi: "你___知？", pinyin: "nˇ ___ diˊ?", answer_hanzi: "仰會", answer: "ngiongˋ voi"}
      hl: {hanzi: "你___知？", pinyin: "ngi ___ diˋ?", answer_hanzi: "仰會", answer: "ngiongˊ voi+"}
    - en: "Have some hot tea."
      sx: {hanzi: "食___茶。", pinyin: "siid ___ caˇ.", answer_hanzi: "燒", answer: "seuˊ"}
      hl: {hanzi: "食___茶。", pinyin: "shidˋ ___ ca.", answer_hanzi: "燒", answer: "shauˋ"}

