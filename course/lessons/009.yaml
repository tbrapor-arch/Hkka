id: 9
title:
  en: "It's going to rain"
  sx: {hanzi: "會落雨", pinyin: "voi log iˋ"}
  hl: {hanzi: "會落水", pinyin: "voi+ logˋ shuiˊ"}
review: false
setting: >-
  Wednesday morning, a blue sky. Grandma is carrying out the washing; Grandpa is on the porch with his tea, looking at
  the hills.
names: [阿明, 阿英]

dialogue:
  - n: 1
    speaker: 阿婆
    en: "The sun's strong today. Sam, come and hang out the washing!"
    sx: {hanzi: "今晡日日頭當大。Sam，來晒衫褲！", pinyin: "gimˊ buˊ ngidˋ ngidˋ teuˇ dongˊ tai. Sam, loiˇ sai samˊ fu!"}
    hl: {hanzi: "今晡日日頭當大。Sam，來晒衫褲！", pinyin: "gimˋ buˋ ngid ngid teu dongˋ tai+. Sam, loi saiˇ samˋ fuˇ!"}
  - n: 2
    speaker: 阿公
    en: "(looking at the hills) It's going to rain."
    sx: {hanzi: "會落雨。", pinyin: "voi log iˋ."}
    hl: {hanzi: "會落水。", pinyin: "voi+ logˋ shuiˊ."}
  - n: 3
    speaker: Sam
    en: "Rain? The sky's so blue, the sun's so strong… It won't!"
    sx: {hanzi: "會落雨？天恁青，日頭恁大……毋會！", pinyin: "voi log iˋ? tienˊ anˋ qiangˊ, ngidˋ teuˇ anˋ tai … mˇ voi!"}
    hl: {hanzi: "會落水？天恁青，日頭恁大……毋會！", pinyin: "voi+ logˋ shuiˊ? tienˋ anˊ ciangˋ, ngid teu anˊ tai+ … m voi+!"}
  - n: 4
    speaker: 阿婆
    en: "If Grandpa says it'll rain, it'll rain."
    sx: {hanzi: "阿公講會落雨，就會落雨。", pinyin: "aˊ gungˊ gongˋ voi log iˋ, qiu voi log iˋ."}
    hl: {hanzi: "阿公講會落水，就會落水。", pinyin: "a+ gungˋ gongˊ voi+ logˋ shuiˊ, ciu+ voi+ logˋ shuiˊ."}
  - n: 5
    speaker: 阿婆
    en: "(three hours later) Sam! It's raining! Quick, get the washing in!"
    sx: {hanzi: "Sam！落雨了！遽遽收衫褲！", pinyin: "Sam! log iˋ leˊ! giagˋ giagˋ suˊ samˊ fu!"}
    hl: {hanzi: "Sam！落水了！遽遽收衫褲！", pinyin: "Sam! logˋ shuiˊ leˋ! giag giag shiuˋ samˋ fuˇ!"}
  - n: 6
    speaker: Sam
    en: "(back on the porch, soaked) Such heavy rain…"
    sx: {hanzi: "雨落恁大……", pinyin: "iˋ log anˋ tai …"}
    hl: {hanzi: "落恁大水……", pinyin: "logˋ anˊ tai+ shuiˊ …"}
  - n: 7
    speaker: 阿公
    en: "(perfectly dry) I told you."
    sx: {hanzi: "𠊎講過了。", pinyin: "ngaiˇ gongˋ go leˊ."}
    hl: {hanzi: "𠊎講過了。", pinyin: "ngai gongˊ goˇ leˋ."}
  - n: 8
    speaker: Sam
    en: "Grandpa, how did you know?"
    sx: {hanzi: "阿公，你仰會知？", pinyin: "aˊ gungˊ, nˇ ngiongˋ voi diˊ?"}
    hl: {hanzi: "阿公，你仰會知？", pinyin: "a+ gungˋ, ngi ngiongˊ voi+ diˋ?"}
  - n: 9
    speaker: 阿公
    en: "Look at the sky."
    sx: {hanzi: "看天。", pinyin: "kon tienˊ."}
    hl: {hanzi: "看天。", pinyin: "konˇ tienˋ."}
  - n: 10
    speaker: 阿公
    en: "(pouring a cup) Cold? Have some hot tea."
    sx: {hanzi: "寒無？食燒茶。", pinyin: "honˇ moˇ? siid seuˊ caˇ."}
    hl: {hanzi: "冷無？食燒茶。", pinyin: "langˋ mo? shidˋ shauˋ ca."}

notes:
  - ref: 1
    topic: vocab
    text: >
      日頭 ngidˋ teuˇ "the sun" (太陽); 日頭當大 "the sun is strong", literally "very big". 晒衫褲 sai samˊ fu "hang
      the washing out in the sun". 衫褲 "clothes", literally "tops and trousers"; 衫 samˊ alone is a top, a shirt.
  - ref: 2
    topic: grammar
    text: >
      會 voi, which you know as "can" (會講客話), also says what is going to happen: 會落雨 "it's going to rain".
      Mandarin does this too (會下雨), but Hakka leans on it harder: 會 can mean "about to, any minute now", as in
      會落雨了 "it's about to rain". Its negative is 毋會 "won't" (line 3). 落雨 log iˋ "rain" (下雨): rain "falls".
  - ref: 4
    topic: grammar
    text: >
      阿公講會落雨，就會落雨 "if Grandpa says it'll rain, it'll rain": as in lesson 3, the "if" is unspoken, and 就
      qiu "then" carries it, as in Mandarin.
  - ref: 5
    topic: grammar
    text: >
      落雨了 "it's raining (now)": 了 at the end marks the change, as in 雞卵無了 and 這下五點半了. 遽遽 giagˋ giagˋ
      "quick, hurry" (快快). 收 suˊ "take in, collect", as in Mandarin.
  - ref: 7
    topic: grammar
    text: >
      𠊎講過了 "I said so (already)", four syllables of pure satisfaction. 過 go after a verb marks it as done; you
      will meet it again for "have ever done" (lesson 16). The fuller 𠊎就同你講過了 is "I told you so". Grandpa has
      said barely twenty words in three lessons and been right every time.
  - ref: 8
    topic: vocab
    text: >
      仰會 ngiongˋ voi "how come, how" (怎麼會): 你仰會知？ "how do you know?", literally "how can you know". 知 diˊ "know" (知道); 毋知 "don't know".
      Mandarin zh- → d- here: 知 zhī → diˊ, an old pronunciation Hakka kept.
  - ref: 10
    topic: false-friend
    text: >
      Two kinds of hot. 燒 seuˊ is hot to the touch: 燒茶 "hot tea", 粥當燒 "the congee is very hot". 熱 ngied is hot
      weather or a hot body: 今晡日當熱 "it's very hot today". Mandarin 燒 is "burn" or "fever"; here it is the
      everyday word for anything you can scald your tongue on. Two kinds of cold, too: 寒 honˇ is
      how a person feels (寒無？ "are you cold?", 當寒 "it's freezing"), 冷 langˊ is for cold things (茶冷了 "the tea's
      gone cold").
  - ref: 0
    topic: hailu
    text: >
      Hailu does not say 落雨: it says 落水 logˋ shuiˊ, "water falls", and rain is 水. So 會落水 "it's going to rain",
      落恁大水 "such heavy rain". And Hailu says 冷 for a person too: 冷無？ where Sixian says 寒無？. 燒 is shauˋ, 收
      shiuˋ.

