exercises:
  translate:
    - en: "Grandpa is seventy-eight this year."
      sx: {hanzi: "阿公今年七十八歲。", pinyin: "aˊ gungˊ gimˊ ngienˇ qidˋ siib badˋ se."}
      hl: {hanzi: "阿公今年七十八歲。", pinyin: "a+ gungˋ gimˋ ngien cid shibˋ bad soiˇ."}
    - en: "Have you ever been to 公館? — Yes, once."
      sx: {hanzi: "你識去過公館無？——識，去過一擺。", pinyin: "nˇ siidˋ hi go gungˊ gonˋ moˇ? — siidˋ, hi go idˋ baiˋ."}
      hl: {hanzi: "你識去過公館無？——識，去過一擺。", pinyin: "ngi shid hiˇ goˇ gungˋ gonˊ mo? — shid, hiˇ goˇ rhid baiˊ."}
    - en: "In the old days there were no buses; now there are."
      sx: {hanzi: "頭擺無巴士，這下有了。", pinyin: "teuˇ baiˋ moˇ ba siiˋ, iaˋ ha iuˊ leˊ."}
      hl: {hanzi: "頭擺無巴士，這下有了。", pinyin: "teu baiˊ mo ba siiˋ, liaˊ ha+ rhiuˋ leˋ."}
    - en: "When I was young I sang every day."
      sx: {hanzi: "𠊎後生个時節逐日唱歌。", pinyin: "ngaiˇ heu sangˊ ge siiˇ jiedˋ dagˋ ngidˋ cong goˊ."}
      hl: {hanzi: "𠊎後生个時節逐日唱歌。", pinyin: "ngai heu+ sangˋ gaiˇ shi zied dag ngid chongˇ goˋ."}
    - en: "Old people love talking about the old days."
      sx: {hanzi: "老人家好講頭擺个事情。", pinyin: "loˋ nginˇ gaˊ hau gongˋ teuˇ baiˋ ge sii qinˇ."}
      hl: {hanzi: "老人家好講頭擺个事情。", pinyin: "loˊ ngin gaˋ hauˇ gongˊ teu baiˊ gaiˇ sii+ cin."}
    - en: "From here to the station is one hour on foot."
      sx: {hanzi: "行路去火車頭愛一點鐘。", pinyin: "hangˇ lu hi foˋ caˊ teuˇ oi idˋ diamˋ zungˊ."}
      hl: {hanzi: "行路去火車頭愛一點鐘。", pinyin: "hang lu+ hiˇ foˊ chaˋ teu oiˇ rhid diamˊ zhungˋ."}
  fill:
    - en: "He has never walked it."
      sx: {hanzi: "佢毋___行過。", pinyin: "giˇ mˇ ___ hangˇ go.", answer_hanzi: "識", answer: "siidˋ"}
      hl: {hanzi: "佢毋___行過。", pinyin: "gi m ___ hang goˇ.", answer_hanzi: "識", answer: "shid"}
    - en: "At that time there was no train."
      sx: {hanzi: "___無火車。", pinyin: "___ moˇ foˋ caˊ.", answer_hanzi: "該下", answer: "ge ha"}
      hl: {hanzi: "___無火車。", pinyin: "___ mo foˊ chaˋ.", answer_hanzi: "該下", answer: "gai ha+"}
    - en: "Two hours."
      sx: {hanzi: "兩___。", pinyin: "liongˋ ___.", answer_hanzi: "點鐘", answer: "diamˋ zungˊ"}
      hl: {hanzi: "兩___。", pinyin: "liongˊ ___.", answer_hanzi: "點鐘", answer: "diamˊ zhungˋ"}

