exercises:
  translate:
    - en: "Mum sends her daughter a box of mandarins."
      sx: {hanzi: "阿姆寄一箱柑仔分厥妹仔。", pinyin: "aˊ meˊ gi idˋ xiongˊ gamˊ eˋ bunˊ giaˊ moi eˋ."}
      hl: {hanzi: "阿姆寄一箱柑仔分厥妹仔。", pinyin: "a+ meˋ giˇ rhid siongˋ gamˋ er bunˋ gia moiˇ er."}
    - en: "This box is very heavy; that one's light."
      sx: {hanzi: "這隻箱仔當重，該隻當輕。", pinyin: "iaˋ zagˋ xiongˊ eˋ dongˊ cungˊ, ge zagˋ dongˊ kiangˊ."}
      hl: {hanzi: "這隻箱仔當重，該隻當輕。", pinyin: "liaˊ zhag siongˋ er dongˋ chungˋ, gai zhag dongˋ kiangˋ."}
    - en: "By plane or by boat?"
      sx: {hanzi: "坐飛行機，抑係坐船？", pinyin: "coˊ biˊ hangˇ giˊ, ia he coˊ sonˇ?"}
      hl: {hanzi: "坐飛行機，抑係坐船？", pinyin: "coˋ fuiˋ hang giˋ, rha+ heˇ coˋ shon?"}
    - en: "A-min lent Sam two hundred. Sam has to pay him back."
      sx: {hanzi: "阿明借分 Sam 兩百。Sam 愛還佢。", pinyin: "aˊ minˇ jia bunˊ Sam liongˋ bagˋ. Sam oi vanˇ giˇ."}
      hl: {hanzi: "阿明借分 Sam 兩百。Sam 愛還佢。", pinyin: "a+ min ziaˇ bunˋ Sam liongˊ bag. Sam oiˇ van gi."}
    - en: "Is there a post office near here? I want to buy stamps."
      sx: {hanzi: "這位有郵局無？𠊎愛買郵票。", pinyin: "iaˋ vi iuˊ iuˇ kiug moˇ? ngaiˇ oi maiˊ iuˇ peuˊ."}
      hl: {hanzi: "這位有郵局無？𠊎愛買郵票。", pinyin: "liaˊ vui+ rhiuˋ rhiu kiugˋ mo? ngai oiˇ maiˋ rhiu piauˇ."}
    - en: "Lucie writes her mum a letter."
      sx: {hanzi: "Lucie 寫一封信仔分厥姆。", pinyin: "Lucie xiaˋ idˋ fungˊ xin eˋ bunˊ giaˊ meˊ."}
      hl: {hanzi: "Lucie 寫一封信仔分厥姆。", pinyin: "Lucie siaˊ rhid fungˋ sinˇ er bunˋ gia meˋ."}
  fill:
    - en: "Send it to my mum."
      sx: {hanzi: "寄___吾姆。", pinyin: "gi ___ ngaˊ meˊ.", answer_hanzi: "分", answer: "bunˊ"}
      hl: {hanzi: "寄___𠊎姆。", pinyin: "giˇ ___ ngai meˋ.", answer_hanzi: "分", answer: "bunˋ"}
    - en: "And you? (what about you?)"
      sx: {hanzi: "你___？", pinyin: "nˇ ___?", answer_hanzi: "呢", answer: "neˇ"}
      hl: {hanzi: "你___？", pinyin: "ngi ___?", answer_hanzi: "呢", answer: "neˇ"}
    - en: "Pay me back!"
      sx: {hanzi: "___𠊎！", pinyin: "___ ngaiˇ!", answer_hanzi: "還", answer: "vanˇ"}
      hl: {hanzi: "___𠊎！", pinyin: "___ ngai!", answer_hanzi: "還", answer: "van"}

