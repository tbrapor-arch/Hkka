exercises:
  translate:
    - en: "Sam looked every word up in the dictionary."
      sx: {hanzi: "Sam 逐隻詞都在字典肚尋過。", pinyin: "Sam dagˋ zagˋ ciiˇ du coiˊ sii dienˋ duˋ qimˇ go."}
      hl: {hanzi: "Sam 逐隻詞都在字典肚尋過。", pinyin: "Sam dag zhag cii du+ coiˋ sii+ dienˊ duˊ cim goˇ."}
      check: true
    - en: "A-in copied the poem out in calligraphy."
      sx: {hanzi: "阿英用書法摎這首詩抄起來。", pinyin: "aˊ inˊ iung suˊ fabˋ lauˊ iaˋ suˋ siiˊ cauˊ hiˋ loiˇ."}
      hl: {hanzi: "阿英用書法摎這首詩抄起來。", pinyin: "a+ rhinˋ rhung+ shuˋ fab lauˋ liaˊ shiuˊ shiˋ cauˋ hiˊ loi."}
    - en: "A-min has to learn a classical poem by heart for school."
      sx: {hanzi: "阿明在學校愛背一首古詩。", pinyin: "aˊ minˇ coiˊ hog gauˋ oi boi idˋ suˋ guˋ siiˊ."}
      hl: {hanzi: "阿明在學校愛背一首古詩。", pinyin: "a+ min coiˋ hogˋ gauˊ oiˇ boiˇ rhid shiuˊ guˊ shiˋ."}
      check: true
    - en: "Reading aloud, you have to keep the rhythm; the length of each line is the same."
      sx: {hanzi: "朗讀愛注意節奏，逐句个長短都共樣。", pinyin: "long tug oi zu i jiedˋ zeu, dagˋ gi ge congˇ donˋ du kiung iong."}
      hl: {hanzi: "朗讀愛注意節奏，逐句个長短都共樣。", pinyin: "longˇ tugˋ oiˇ zhuˇ rhiˇ zied zeuˇ, dag giˇ gaiˇ chong donˊ du+ kiung+ rhong+."}
      check: true
    - en: "Smell it: the whole house smells of tea."
      sx: {hanzi: "你聞看啊，滿屋都係茶香。", pinyin: "nˇ vunˇ kon a, manˊ vugˋ du he caˇ hiongˊ."}
      hl: {hanzi: "你聞看啊，滿屋都係茶香。", pinyin: "ngi vun konˇ a+, manˋ vug du+ heˇ ca hiongˋ."}
    - en: "I had a dream: I dreamt I'd become a poet."
      sx: {hanzi: "𠊎做一隻夢，夢著自家變做詩人。", pinyin: "ngaiˇ zo idˋ zagˋ mung, mung doˋ qi gaˊ bien zo siiˊ nginˇ."}
      hl: {hanzi: "𠊎做一隻夢，夢著自家變做詩人。", pinyin: "ngai zoˇ rhid zhag mung+, mung+ doˊ cid gaˋ bienˇ zoˇ shiˋ ngin."}
      check: true
    - en: "Writing (creative writing) is hard, but the feeling is wonderful."
      sx: {hanzi: "創作當難，毋過感覺當好。寫文章乜係恁樣。", pinyin: "congˋ zogˋ dongˊ nanˇ, mˇ go gamˋ gogˋ dongˊ hoˋ. xiaˋ vunˇ zongˊ me he anˋ ngiongˇ."}
      hl: {hanzi: "創作當難，毋過感覺當好。寫文章乜係恁樣。", pinyin: "congˊ zog dongˋ nan, m goˇ gamˊ gog dongˋ hoˊ. siaˊ vun zhongˋ meˇ heˇ an ngiong."}
