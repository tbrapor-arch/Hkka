exercises:
  translate:
    - en: "Is it true?"
      sx: {hanzi: "係真个無？", pinyin: "he ziinˊ ge moˇ?"}
      hl: {hanzi: "係真个無？", pinyin: "heˇ zhinˋ gaiˇ mo?"}
    - en: "Is there a needle and thread?"
      sx: {hanzi: "有針同線無？", pinyin: "iuˊ ziimˊ tungˇ xien moˇ?"}
      hl: {hanzi: "有針摎線無？", pinyin: "rhiuˋ zhimˋ lauˋ sienˇ mo?"}
    - en: "Sam goes to work at five and finishes at four."
      sx: {hanzi: "Sam 五點上班，四點下班。", pinyin: "Sam ngˋ diamˋ songˊ banˊ, xi diamˋ haˊ banˊ."}
      hl: {hanzi: "Sam 五點上班，四點下班。", pinyin: "Sam ngˊ diamˊ shongˋ banˋ, siˇ diamˊ haˋ banˋ."}
    - en: "The floor is slippery. Watch out, safety first."
      sx: {hanzi: "地泥當滑，愛注意安全。", pinyin: "ti naiˇ dongˊ vad, oi zu i onˊ qionˇ."}
      hl: {hanzi: "地泥當滑，愛注意安全。", pinyin: "ti+ nai dongˋ vadˋ, oiˇ zhuˇ rhiˇ onˋ cion."}
    - en: "阿蘭嫂 is very hard-working; she knows all the factory's rules."
      sx: {hanzi: "阿蘭嫂做事當認真，工廠个規矩佢全部知。", pinyin: "aˊ lanˇ soˋ zo se dongˊ ngin ziinˊ, gungˊ congˋ ge guiˊ giˋ giˇ qionˇ pu diˊ."}
      hl: {hanzi: "阿蘭嫂做事當認真，工廠个規矩佢全部知。", pinyin: "a+ lan soˊ zoˇ she+ dongˋ ngin+ zhinˋ, gungˋ chong gaiˇ guiˋ giˊ gi cion pu+ diˋ."}
    - en: "Getting up at four isn't something I'm used to."
      sx: {hanzi: "四點起來，𠊎毋習慣。", pinyin: "xi diamˋ hiˋ loiˇ, ngaiˇ mˇ xib guan."}
      hl: {hanzi: "四點起來，𠊎毋習慣。", pinyin: "siˇ diamˊ hiˊ loi, ngai m sibˋ guanˇ."}
      check: true
    - en: "Every day 阿傑 has a bowl of 粄條 for lunch."
      sx: {hanzi: "阿傑逐日食晝都會食一碗粄條。", pinyin: "aˊ kied dagˋ ngidˋ siid zu du voi siid idˋ vonˋ banˋ tiauˇ."}
      hl: {hanzi: "阿傑逐日食晝都會食一碗粄條。", pinyin: "a+ kiedˋ dag ngid shidˋ zhiuˇ du+ voi+ shidˋ rhid vonˊ banˊ tiau."}
