exercises:
  translate:
    - en: "This cloth is easy to wash and dries fast."
      sx: {hanzi: "這種布好洗又遽燥。", pinyin: "iaˋ zungˋ bu hoˋ seˋ iu giagˋ zauˊ."}
      hl: {hanzi: "這種布好洗又遽燥。", pinyin: "liaˊ zhungˊ buˇ hoˊ seˊ rhiu+ giag zauˋ."}
    - en: "It has just rained, and this road is really hard going."
      sx: {hanzi: "正落過水，這條路當毋好行。", pinyin: "zang log go suiˋ, iaˋ tiauˇ lu dongˊ mˇ hoˋ hangˇ."}
      hl: {hanzi: "正落過水，這條路當毋好行。", pinyin: "zhangˇ logˋ goˇ shuiˊ, liaˊ tiau lu+ dongˋ m hoˊ hang."}
    - en: "Grandma took the hen's eggs home to fry a radish omelette."
      sx: {hanzi: "雞嫲生个雞卵分阿婆收轉去煎菜脯卵吔。", pinyin: "gieˊ maˇ sangˊ ge gieˊ lonˋ bunˊ aˊ poˇ suˊ zonˋ hi jienˊ coi puˋ lonˋ leˊ."}
      hl: {hanzi: "雞嫲生个雞卵分阿婆收轉去煎菜脯卵咧。", pinyin: "gaiˋ ma sangˋ gaiˇ gaiˋ lonˊ bunˋ a+ po shiuˋ zhonˊ hiˇ zienˋ coiˇ buˊ lonˊ leˋ."}
      source: moe
    - en: "This soup is too bland; add a little salt. — Careful, don't make it too salty."
      sx: {hanzi: "這碗湯忒淡，加兜仔鹽。——莫加忒多，會忒鹹。", pinyin: "iaˋ vonˋ tongˊ tedˋ tamˊ, gaˊ deuˊ eˋ iamˇ. — mog gaˊ tedˋ doˊ, voi tedˋ hamˇ."}
      hl: {hanzi: "這碗湯忒淡，加兜仔鹽。——莫加忒多，會忒鹹。", pinyin: "liaˊ vonˊ tongˋ ted tamˋ, gaˋ deuˋ er rham. — mogˋ gaˋ ted doˋ, voi+ ted ham."}
    - en: "Serve me some rice, I'm starving. — Don't shovel it in so fast!"
      sx: {hanzi: "摎𠊎添飯，𠊎當餓。——莫划飯划恁遽！", pinyin: "lauˊ ngaiˇ tiamˊ fan, ngaiˇ dongˊ ngo. — mog paˇ fan paˇ anˋ giagˋ!"}
      hl: {hanzi: "摎𠊎添飯，𠊎當餓。——莫划飯划恁遽！", pinyin: "lauˋ ngai tiamˋ pon+, ngai dongˋ ngo+. — mogˋ paˋ pon+ pa anˊ giag!"}
      check: true
    - en: "What's for dinner tonight? — Fish, green vegetables and bamboo shoots."
      sx: {hanzi: "今暗晡食夜食麼个？——魚肉、青菜摎筍。", pinyin: "gimˊ am buˊ siid ia siid maˋ ge? — ngˇ ngiugˋ, qiangˊ coi lauˊ sunˋ."}
      hl: {hanzi: "今暗晡食夜食麼个？——魚肉、青菜摎筍。", pinyin: "gimˋ amˇ buˋ shidˋ rha+ shidˋ maˊ gaiˇ? — ng ngiug, ciangˋ coiˇ lauˋ sunˊ."}
    - en: "This food has gone off: it smells. Don't eat it."
      sx: {hanzi: "這兜食物臭吔，莫食。", pinyin: "iaˋ deuˊ siid vud cu leˊ, mog siid."}
      hl: {hanzi: "這兜食物臭咧，莫食。", pinyin: "liaˊ deuˋ shidˋ vudˋ chiuˇ leˋ, mogˋ shidˋ."}
    - en: "Add a little vinegar to the bitter melon."
      sx: {hanzi: "苦瓜加兜仔酸醋。", pinyin: "fuˋ guaˊ gaˊ deuˊ eˋ sonˊ cii."}
      hl: {hanzi: "苦瓜加兜仔酸醋。", pinyin: "fuˊ guaˋ gaˋ deuˋ er sonˋ siiˇ."}
      check: true
