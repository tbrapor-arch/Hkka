id: 59
title:
  en: "The lunch box"
  sx: {hanzi: "肚飢？肚屎枵！", pinyin: "duˋ giˊ? duˋ siiˋ iauˊ!"}
  hl: {hanzi: "肚飢？肚屎枵！", pinyin: "duˊ giˋ? duˊ shiˊ iauˋ!"}
review: false
setting: >-
  Wednesday 3 March, twelve o'clock. 阿蘭嫂 and 阿傑 bring lunch boxes from home and eat at the long table by the
  door. Sam, who has been eating at 阿舅's every day, has been told that today the family is out.
names: [阿蘭嫂, 阿傑]

dialogue:
  - n: 1
    speaker: 阿蘭嫂
    en: "Lunchtime! Sam, where's your lunch box?"
    sx: {hanzi: "食晝吔！Sam，你个便當呢？", pinyin: "siid zu leˊ! Sam, nˇ ge pien dongˊ neˇ?"}
    hl: {hanzi: "食晝咧！Sam，你个便當呢？", pinyin: "shidˋ zhiuˇ leˋ! Sam, ngi gaiˇ pien+ dongˋ neˇ?"}
  - n: 2
    speaker: Sam
    en: "I didn't bring one… and I'm starving."
    sx: {hanzi: "𠊎無帶……毋過𠊎當肚飢。", pinyin: "ngaiˇ moˇ dai … mˇ go ngaiˇ dongˊ duˋ giˊ."}
    hl: {hanzi: "𠊎無帶……毋過𠊎當肚飢。", pinyin: "ngai mo daiˇ … m goˇ ngai dongˋ duˊ giˋ."}
    check: true
  - n: 3
    speaker: 阿傑
    en: "肚飢? Here we say 肚屎枵."
    sx: {hanzi: "肚飢？𠊎兜講肚屎枵。", pinyin: "duˋ giˊ? ngaiˇ deuˊ gongˋ duˋ siiˋ iauˊ."}
    hl: {hanzi: "肚飢？𠊎兜講肚屎枵。", pinyin: "duˊ giˋ? ngai deuˋ gongˊ duˊ shiˊ iauˋ."}
  - n: 4
    speaker: Sam
    en: "肚屎枵… that's hard to say! 肚飢 is easier."
    sx: {hanzi: "肚屎枵……當毋好講！肚飢較好講。", pinyin: "duˋ siiˋ iauˊ … dongˊ mˇ hoˋ gongˋ! duˋ giˊ ka hoˋ gongˋ."}
    hl: {hanzi: "肚屎枵……當毋好講！肚飢較好講。", pinyin: "duˊ shiˊ iauˋ … dongˋ m hoˊ gongˊ! duˊ giˋ haˇ hoˊ gongˊ."}
  - n: 5
    speaker: 阿蘭嫂
    en: "Don't worry, I've brought plenty. Here, sit down, and start eating first."
    sx: {hanzi: "毋使驚，𠊎帶當多。來，坐等來，先食等來。", pinyin: "mˇ siiˋ giangˊ, ngaiˇ dai dongˊ doˊ. loiˇ, coˊ denˋ loiˇ, xienˊ siid denˋ loiˇ."}
    hl: {hanzi: "毋使驚，𠊎帶當多。來，坐等來，先食等來。", pinyin: "m siiˊ giangˋ, ngai daiˇ dongˋ doˋ. loi, coˋ denˊ loi, senˋ shidˋ denˊ loi."}
  - n: 6
    speaker: Sam
    en: "Thank y… I mean, 承蒙你!"
    sx: {hanzi: "恁……毋係，承蒙你！", pinyin: "anˋ … mˇ he, siinˇ mungˇ nˇ!"}
    hl: {hanzi: "恁……毋係，承蒙你！", pinyin: "anˊ … m heˇ, shin mung ngi!"}
  - n: 7
    speaker: 阿蘭嫂
    en: "Dried-radish omelette, braised pork, aubergine, bitter melon, greens, and rice. Come and help us eat it up."
    sx: {hanzi: "菜脯卵、爌肉、吊菜仔、苦瓜、青菜，還有飯。你來𢯭食。", pinyin: "coi puˋ lonˋ, kong ngiugˋ, diau coi eˋ, fuˋ guaˊ, qiangˊ coi, hanˇ iuˊ fan. nˇ loiˇ ten siid."}
    hl: {hanzi: "菜脯卵、爌肉、吊菜仔、苦瓜、青菜，還有飯。你來𢯭食。", pinyin: "coiˇ buˊ lonˊ, kongˇ ngiug, diauˇ coiˇ er, fuˊ guaˋ, ciangˋ coiˇ, han rhiuˋ pon+. ngi loi tenˇ shidˋ."}
    check: true
  - n: 8
    speaker: Sam
    en: "(shovelling it in) Mm, the rice (fan) is really good!"
    sx: {hanzi: "這碗飯當好食！", pinyin: "iaˋ vonˋ fan dongˊ hoˋ siid!"}
    hl: {hanzi: "這碗飯當好食！", pinyin: "liaˊ vonˊ fan dongˋ hoˊ shidˋ!"}
    check: true
  - n: 9
    speaker: 阿傑
    en: "You say fan; we say pon… And don't shovel your rice in so fast!"
    sx: {hanzi: "你講 fan，𠊎兜講 pon……莫划飯划恁遽！", pinyin: "nˇ gongˋ fan, ngaiˇ deuˊ gongˋ pon … mog paˇ fan paˇ anˋ giagˋ!"}
    hl: {hanzi: "你講 fan，𠊎兜講 pon……莫划飯划恁遽！", pinyin: "ngi gongˊ fan, ngai deuˋ gongˊ pon … mogˋ paˋ pon+ pa anˊ giag!"}
    check: true
  - n: 10
    speaker: Sam
    en: "Pon? How come it's so different?"
    sx: {hanzi: "Pon？仰會差恁多？", pinyin: "Pon? ngiongˋ voi caˊ anˋ doˊ?"}
    hl: {hanzi: "Pon？仰會差恁多？", pinyin: "Pon? ngiongˊ voi+ caˋ anˊ doˋ?"}
  - n: 11
    speaker: 阿蘭嫂
    en: "Sixian and Hailu: the same characters, read differently."
    sx: {hanzi: "四縣、海陸，字共樣，讀法無共樣。", pinyin: "xi ien, hoiˋ liugˋ, sii kiung iong, tug fabˋ moˇ kiung iong."}
    hl: {hanzi: "四縣、海陸，字共樣，讀法無共樣。", pinyin: "siˇ rhanˇ, hoiˊ liugˋ, sii+ kiung+ rhong+, tugˋ fab mo kiung+ rhong+."}
  - n: 12
    speaker: 阿傑
    en: "The radish omelette is 阿蘭嫂's speciality. Tasty, and easy to make."
    sx: {hanzi: "菜脯卵係阿蘭嫂个拿手好菜。好食，乜好做。", pinyin: "coi puˋ lonˋ he aˊ lanˇ soˋ ge naˊ suˋ hoˋ coi. hoˋ siid, me hoˋ zo."}
    hl: {hanzi: "菜脯卵係阿蘭嫂个拿手好菜。好食，乜好做。", pinyin: "coiˇ buˊ lonˊ heˇ a+ lan soˊ gaiˇ naˋ shiuˊ hoˊ coiˇ. hoˊ shidˋ, meˇ hoˊ zoˇ."}
  - n: 13
    speaker: 阿蘭嫂
    en: "Easy to make? You make it, then, and we'll see!"
    sx: {hanzi: "好做？你做看啊！", pinyin: "hoˋ zo? nˇ zo kon a!"}
    hl: {hanzi: "好做？你做看啊！", pinyin: "hoˊ zoˇ? ngi zoˇ konˇ a+!"}
  - n: 14
    speaker: 阿傑
    en: "…I'll stick to eating. 阿蘭嫂, give me some more rice, I'm starving."
    sx: {hanzi: "……𠊎食就好。阿蘭嫂，摎𠊎添飯，𠊎當餓。", pinyin: "… ngaiˇ siid qiu hoˋ. aˊ lanˇ soˋ, lauˊ ngaiˇ tiamˊ fan, ngaiˇ dongˊ ngo."}
    hl: {hanzi: "……𠊎食就好。阿蘭嫂，摎𠊎添飯，𠊎當餓。", pinyin: "… ngai shidˋ ciu+ hoˊ. a+ lan soˊ, lauˋ ngai tiamˋ pon+, ngai dongˋ ngo+."}
  - n: 15
    speaker: 阿蘭嫂
    en: "Sam, how does it taste?"
    sx: {hanzi: "Sam，味緒仰般？", pinyin: "Sam, mi xi ngiongˋ banˊ?"}
    hl: {hanzi: "Sam，味緒仰般？", pinyin: "Sam, mui+ siˇ ngiongˊ banˋ?"}
  - n: 16
    speaker: Sam
    en: "Delicious! Only now I'm thirsty."
    sx: {hanzi: "當好食！就係有兜仔嘴燥。", pinyin: "dongˊ hoˋ siid! qiu he iuˊ deuˊ eˋ zoi zauˊ."}
    hl: {hanzi: "當好食！就係有兜仔嘴燥。", pinyin: "dongˋ hoˊ shidˋ! ciu+ heˇ rhiuˋ deuˋ er zhoiˇ zauˋ."}
  - n: 17
    speaker: 阿傑
    en: "Here, have some soy milk. Tonight, for dinner, I'll buy you 粄條."
    sx: {hanzi: "來，食豆乳。今暗晡食夜，𠊎請你食粄條。", pinyin: "loiˇ, siid teu nen. gimˊ am buˊ siid ia, ngaiˇ qiangˋ nˇ siid banˋ tiauˇ."}
    hl: {hanzi: "來，食豆乳。今暗晡食夜，𠊎請你食粄條。", pinyin: "loi, shidˋ teu+ nenˇ. gimˋ amˇ buˋ shidˋ rha+, ngai ciangˊ ngi shidˋ banˊ tiau."}

notes:
  - ref: 2
    topic: hailu
    text: >
      Third trip-up, checked in the word lists: "hungry" is Sixian 肚飢 duˋ giˊ (lesson 27), Hailu 肚屎枵 duˊ shiˊ iauˋ,
      literally "belly-guts-empty". Sam's line is written with his own Miaoli word in both columns, because that is
      what he says: the Hailu column of line 2 is marked for checking for that reason. In the official lists the split
      is clean (Sixian 肚屎枵 0 times, Hailu 9), though the dictionary's examples, which carry no accent, have it 4 times
      (肚屎枵﹝飢﹞了，尋一家飯館食東西): a Sixian speaker will understand it.
  - ref: 4
    topic: grammar
    text: >
      好 hoˋ + verb "easy to": 較好講 "easier to say", 好做 (line 12) "easy to make", 當毋好講 "really hard to say". It is
      the 好 of 好食 "tasty" and 好聽 "nice to listen to" (lesson 37), not 好 hau "like doing" (lesson 11). The official
      examples: 特多龍个布仔好洗又遽燥 "polyester is easy to wash and dries fast", 這條路當毋好行 "this road is hard going".
  - ref: 5
    topic: grammar
    text: >
      坐等來 "sit down (and stay sitting)", 先食等來 "start eating first (without waiting)": V等來 from lesson 52, the host's
      formula. 𠊎帶當多 "I've brought plenty".
  - ref: 6
    topic: hailu
    text: >
      Sam is learning: he starts 恁仔細 and switches to 承蒙你 (lesson 53), the word his 竹東 hosts use, in mid-word.
      承蒙 is known in Sixian (once in the Sixian official list, and 10 times in the dictionary's examples, which carry
      no accent: 承蒙你个招待，有閒正來尞); in 竹東 it is simply the usual word.
  - ref: 7
    topic: culture
    text: >
      菜脯卵 "omelette with dried radish": in the official examples, 雞嫲生个雞卵分阿婆收轉去煎菜脯卵 "Grandma took the hen's
      eggs home to fry a radish omelette". 爌肉 "braised pork belly" is 阿姆个拿手好菜 "Mum's speciality" in another example.
      吊菜仔 "aubergine" (a Hakka word), 苦瓜 "bitter melon". 你來𢯭食 "come and help eat it up": 𢯭 (𢯭手, lesson 16) +
      食, a word in the lists, and the polite way to share a lunch box. The line is marked because the menu is ours.
  - ref: 9
    topic: hailu
    text: >
      Fourth trip-up: 飯 is fan in Sixian, pon+ in Hailu (lesson 3 gave both). 划飯 paˇ fan "shovel rice into your mouth
      (bowl at your lips)" is in the word lists; 莫划飯划恁遽 "don't shovel your rice in so fast" (the attested pattern
      划飯划當遽; the Hailu list writes 划 pa alone, paˋ in 划飯). The character is the same; the word in the mouth is
      not, and here not even the tone pattern helps: fan and pon are two different syllables. Most differences between
      the accents are tones (lesson 0's Sixian → Hailu tone code) and a few initials (Sixian z, c, s against Hailu zh,
      ch, sh); a shorter list are different words (天光日 / 韶早). Line 8's Hailu column keeps Sam's fan.
  - ref: 15
    topic: vocab
    text: >
      味緒 mi xi "taste, flavour": 味緒仰般？ "how does it taste?". 嘴燥 zoi zauˊ "thirsty", literally "mouth dry"
      (燥, lesson 54). 豆乳 teu nen "soy milk": the soy-sauce 豆油 of lesson 17 is the other famous bean product.
  - ref: 10
    topic: grammar
    text: >
      仰會差恁多？ "how come it's so different?": 仰會 "how come" (lesson 9), 差 caˊ "differ, be different", 恁多 "so much".
  - ref: 12
    topic: vocab
    text: >
      拿手好菜 "speciality dish": 拿 + 手 "good at, one's forte", from the official example 該係阿姆个拿手好菜.

