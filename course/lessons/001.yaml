exercises:
  translate:
    - en: "This is A-min."
      sx: {hanzi: "這係阿明。", pinyin: "iaˋ he aˊ minˇ."}
      hl: {hanzi: "這係阿明。", pinyin: "liaˊ heˇ a+ min."}
    - en: "I can speak a little Hakka."
      sx: {hanzi: "𠊎會講一息仔客話。", pinyin: "ngaiˇ voi gongˋ idˋ xid eˋ hagˋ fa."}
      hl: {hanzi: "𠊎會講一息仔客話。", pinyin: "ngai voi+ gongˊ rhid sid er+ hag voiˋ."}
    - en: "He isn't my little brother."
      sx: {hanzi: "佢毋係吾老弟。", pinyin: "giˇ mˇ he ngaˊ loˋ taiˊ."}
      hl: {hanzi: "佢毋係𠊎老弟。", pinyin: "gi m heˇ ngai loˊ taiˋ."}
    - en: "Welcome, A-in!"
      sx: {hanzi: "阿英，歡迎！", pinyin: "aˊ inˊ, fonˊ ngiangˇ!"}
      hl: {hanzi: "阿英，歡迎！", pinyin: "a+ rhinˋ, fonˋ ngiang!"}
    - en: "What did you say?"
      sx: {hanzi: "你講麼个？", pinyin: "nˇ gongˋ maˋ ge?"}
      hl: {hanzi: "你講麼个？", pinyin: "ngi gongˊ maˊ gaiˇ?"}
  fill:
    - en: "My surname is Liu."
      sx: {hanzi: "𠊎___劉。", pinyin: "ngaiˇ ___ liuˇ.", answer_hanzi: "姓", answer: "xiang"}
      hl: {hanzi: "𠊎___劉。", pinyin: "ngai ___ liu.", answer_hanzi: "姓", answer: "siangˇ"}
    - en: "She isn't A-in."
      sx: {hanzi: "佢___阿英。", pinyin: "giˇ ___ aˊ inˊ.", answer_hanzi: "毋係", answer: "mˇ he"}
      hl: {hanzi: "佢___阿英。", pinyin: "gi ___ a+ rhinˋ.", answer_hanzi: "毋係", answer: "m heˇ"}
    - en: "Thank you, A-min!"
      sx: {hanzi: "___，阿明！", pinyin: "___, aˊ minˇ!", answer_hanzi: "恁仔細", answer: "anˋ ziiˋ se"}
      hl: {hanzi: "___，阿明！", pinyin: "___, a+ min!", answer_hanzi: "承蒙", answer: "shin mung"}

