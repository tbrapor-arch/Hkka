id: 5
title:
  en: "At the market"
  sx: {hanzi: "一斤幾多錢？", pinyin: "idˋ ginˊ giˋ doˊ qienˇ?"}
  hl: {hanzi: "一斤幾多錢？", pinyin: "rhid ginˋ giˊ doˋ cien?"}
review: false
setting: >-
  Sunday morning, the market in 苗栗. Mrs Liu shops fast and Sam carries the bags. The first stall is fruit and
  vegetables; it is November, and the mandarins are in.
names: [苗栗]

dialogue:
  - n: 1
    speaker: 阿姆
    en: "How much are the mandarins?"
    zh: "老闆，橘子多少錢？"
    sx: {hanzi: "頭家，柑仔一斤幾多錢？", pinyin: "teuˇ gaˊ, gamˊ eˋ idˋ ginˊ giˋ doˊ qienˇ?"}
    hl: {hanzi: "頭家，柑仔一斤幾多錢？", pinyin: "teu gaˋ, gamˋ er rhid ginˋ giˊ doˋ cien?"}
  - n: 2
    speaker: 頭家
    en: "Forty a catty, three catties for a hundred."
    sx: {hanzi: "一斤四十，三斤一百。", pinyin: "idˋ ginˊ xi siib, samˊ ginˊ idˋ bagˋ."}
    hl: {hanzi: "一斤四十，三斤一百。", pinyin: "rhid ginˋ siˇ shibˋ, samˋ ginˋ rhid bag."}
  - n: 3
    speaker: 阿姆
    en: "I'll have three catties. And the luffas?"
    sx: {hanzi: "𠊎愛三斤。菜瓜幾多錢？", pinyin: "ngaiˇ oi samˊ ginˊ. coi guaˊ giˋ doˊ qienˇ?"}
    hl: {hanzi: "𠊎愛三斤。菜瓜幾多錢？", pinyin: "ngai oiˇ samˋ ginˋ. coiˇ guaˋ giˊ doˋ cien?"}
  - n: 4
    speaker: 頭家
    en: "Twenty each."
    sx: {hanzi: "一條二十。", pinyin: "idˋ tiauˇ ngi siib."}
    hl: {hanzi: "一條二十。", pinyin: "rhid tiau ngi+ shibˋ."}
  - n: 5
    speaker: 阿姆
    en: "Two, then."
    sx: {hanzi: "兩條。", pinyin: "liongˋ tiauˇ."}
    hl: {hanzi: "兩條。", pinyin: "liongˊ tiau."}
  - n: 6
    speaker: 頭家
    en: "That's a hundred and forty altogether. (to Sam) Here, have a mandarin!"
    sx: {hanzi: "總共一百四十。……送你一粒！", pinyin: "zungˋ kiung idˋ bagˋ xi siib. … sung nˇ idˋ liab!"}
    hl: {hanzi: "總共一百四十。……送你一粒！", pinyin: "zungˊ kiung+ rhid bag siˇ shibˋ. … sungˇ ngi rhid liab!"}
  - n: 7
    speaker: Sam
    en: "Thank you!"
    sx: {hanzi: "恁仔細！", pinyin: "anˋ ziiˋ se!"}
    hl: {hanzi: "承蒙你！", pinyin: "shin mung ngi!"}
  - n: 8
    speaker: 頭家
    en: "You can speak Hakka!"
    sx: {hanzi: "你會講客話！", pinyin: "nˇ voi gongˋ hagˋ fa!"}
    hl: {hanzi: "你會講客話！", pinyin: "ngi voi+ gongˊ hag voiˋ!"}
  - n: 9
    speaker: Sam
    en: "A little."
    sx: {hanzi: "一息仔。", pinyin: "idˋ xid eˋ."}
    hl: {hanzi: "一息仔。", pinyin: "rhid sid er+."}
  - n: 10
    speaker: 阿姆
    en: "Come on, Sam, we still have to buy a chicken."
    sx: {hanzi: "來，Sam，還愛買一隻雞仔。", pinyin: "loiˇ, Sam, hanˇ oi maiˊ idˋ zagˋ gieˊ eˋ."}
    hl: {hanzi: "來，Sam，還愛買一隻雞仔。", pinyin: "loi, Sam, han oiˇ maiˋ rhid zhag gaiˋ er."}

notes:
  - ref: 1
    topic: vocab
    text: >
      頭家 teuˇ gaˊ is what you call whoever runs a shop or stall (Mandarin 老闆). 幾多 giˋ doˊ is "how much, how many"
      (多少); 幾多錢？ "how much (money)?". The pattern 一斤幾多錢？ "how much a catty?" is the market question.
  - ref: 1
    topic: false-friend
    text: >
      斤 ginˊ is the Taiwanese catty, 600 grams, not the mainland 500 g 斤. Prices at markets are still per 斤.
      柑仔 gamˊ eˋ "mandarin orange" (橘子); said gamˊ meˋ, because 仔 takes the -m before it (Lesson 0, §5).
  - ref: 2
    topic: pronunciation
    text: >
      Numbers so far: 一 idˋ, 二 ngi, 三 samˊ, 四 xi, 五 ngˋ, 十 siib, 百 bagˋ. Watch 四 xi and 十 siib: one is
      open and high, the other ends in a clipped -b. 四十 xi siib "forty", 一百 idˋ bagˋ "a hundred". 五 ngˋ is a
      syllable with no vowel at all. Six to nine come next lesson. And sandhi again: 三斤 is said samˇ ginˊ.
  - ref: 4
    topic: grammar
    text: >
      Classifiers, as in Mandarin, but with Hakka choices. 條 tiauˇ for long things: 一條菜瓜 "a luffa" (菜瓜 coi
      guaˊ, the sponge gourd, the gourd that goes into Hakka soups and stir-fries). 粒 liab for small round things: 一粒柑仔 "a
      mandarin". 隻 zagˋ (line 10) is the everyday one: animals, and many objects that Mandarin counts with 個.
  - ref: 4
    topic: grammar
    text: >
      二 ngi and 兩 liongˋ split as in Mandarin: 二十 "twenty" in numbers, 兩條 "two (of them)" before a classifier.
      二 ngi is Mandarin èr with the ng- you already know from 人 nginˇ and 日 ngidˋ (Lesson 0, §6).
  - ref: 6
    topic: vocab
    text: >
      總共 zungˋ kiung "altogether". 送 sung "give (as a present)": 送你一粒 "one for you, free". A small gift is
      normal at a stall where the customer comes back every week.
  - ref: 8
    topic: culture
    text: >
      Lines 8 and 9 are lesson 1 again, word for word. That is how it goes: every stallholder in Miaoli will be
      delighted that the foreigner speaks Hakka, and you will have this exchange a hundred times. Have the answer
      ready.
  - ref: 10
    topic: vocab
    text: >
      雞仔 gieˊ eˋ "chicken", the everyday word for the bird (the meat is usually 雞肉). 買 maiˊ "buy", with a rising tone where
      Mandarin has tone 3: like 有 iuˊ, an m-, n-, l- or vowel-initial tone-3 word (Lesson 0, §3). Its partner 賣
      "sell" is mai, high and level.
  - ref: 0
    topic: hailu
    text: >
      In Hailu, 隻 is zhag, 十 shibˋ, 二 ngi+. The tone code at work on numbers: Sixian 三 samˊ, 四 xi, 五 ngˋ;
      Hailu 三 samˋ, 四 siˇ, 五 ngˊ.

