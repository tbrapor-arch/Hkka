exercises:
  translate:
    - en: "How much is a catty of eggs?"
      sx: {hanzi: "雞卵一斤幾多錢？", pinyin: "gieˊ lonˋ idˋ ginˊ giˋ doˊ qienˇ?"}
      hl: {hanzi: "雞卵一斤幾多錢？", pinyin: "gaiˋ lonˊ rhid ginˋ giˊ doˋ cien?"}
    - en: "I want five catties of mandarins."
      sx: {hanzi: "𠊎愛五斤柑仔。", pinyin: "ngaiˇ oi ngˋ ginˊ gamˊ eˋ."}
      hl: {hanzi: "𠊎愛五斤柑仔。", pinyin: "ngai oiˇ ngˊ ginˋ gamˋ er."}
    - en: "Grandma wants to buy two chickens."
      sx: {hanzi: "阿婆愛買兩隻雞仔。", pinyin: "aˊ poˇ oi maiˊ liongˋ zagˋ gieˊ eˋ."}
      hl: {hanzi: "阿婆愛買兩隻雞仔。", pinyin: "a+ po oiˇ maiˋ liongˊ zhag gaiˋ er."}
    - en: "Altogether a hundred and twenty."
      sx: {hanzi: "總共一百二十。", pinyin: "zungˋ kiung idˋ bagˋ ngi siib."}
      hl: {hanzi: "總共一百二十。", pinyin: "zungˊ kiung+ rhid bag ngi+ shibˋ."}
    - en: "This one's for you (a gift)."
      sx: {hanzi: "這粒送你。", pinyin: "iaˋ liab sung nˇ."}
      hl: {hanzi: "這粒送你。", pinyin: "liaˊ liab sungˇ ngi."}
  fill:
    - en: "How much is it?"
      sx: {hanzi: "___錢？", pinyin: "___ qienˇ?", answer_hanzi: "幾多", answer: "giˋ doˊ"}
      hl: {hanzi: "___錢？", pinyin: "___ cien?", answer_hanzi: "幾多", answer: "giˊ doˋ"}
    - en: "Two luffas."
      sx: {hanzi: "兩___菜瓜。", pinyin: "liongˋ ___ coi guaˊ.", answer_hanzi: "條", answer: "tiauˇ"}
      hl: {hanzi: "兩___菜瓜。", pinyin: "liongˊ ___ coiˇ guaˋ.", answer_hanzi: "條", answer: "tiau"}
    - en: "Three mandarins."
      sx: {hanzi: "三___柑仔。", pinyin: "samˊ ___ gamˊ eˋ.", answer_hanzi: "粒", answer: "liab"}
      hl: {hanzi: "三___柑仔。", pinyin: "samˋ ___ gamˋ er.", answer_hanzi: "粒", answer: "liab"}

