exercises:
  translate:
    - en: "Although we have no money now, if we save a little every day we can buy a house in a few years."
      sx: {hanzi: "雖然這下無錢，毋過逐日存兜仔，幾年後就做得買屋。", pinyin: "suiˊ ienˇ iaˋ ha moˇ qienˇ, mˇ go dagˋ ngidˋ sunˇ deuˊ eˋ, giˋ ngienˇ heu qiu zo dedˋ maiˊ vugˋ."}
      hl: {hanzi: "雖然這下無錢，毋過逐日存兜仔，幾年後就做得買屋。", pinyin: "suiˋ rhan liaˊ ha+ mo cien, m goˇ dag ngid sun deuˋ er, giˊ ngien heu+ ciu+ zoˇ ded maiˋ vug."}
    - en: "He wasn't late at all: he even came early."
      sx: {hanzi: "佢毋單止無慢到，甚至還較早到。", pinyin: "giˇ mˇ danˊ ziiˋ moˇ man do, siimˋ zii hanˇ ka zoˋ do."}
      hl: {hanzi: "佢毋單止無慢到，甚至還較早到。", pinyin: "gi m danˋ zhiˊ mo man+ doˇ, shimˊ zhiˇ han haˇ zoˊ doˇ."}
    - en: "The couple have made up already."
      sx: {hanzi: "佢兩公婆早就和好了。", pinyin: "giˇ liongˋ gungˊ poˇ zoˋ qiu foˇ hoˋ leˊ."}
      hl: {hanzi: "佢兩公婆早就和好了。", pinyin: "gi liongˊ gungˋ po zoˊ ciu+ fo hoˊ leˋ."}
    - en: "You broke the window: you have to pay for it."
      sx: {hanzi: "你打爛窗門，愛賠。", pinyin: "nˇ daˋ lan cungˊ munˇ, oi poiˇ."}
      hl: {hanzi: "你打爛窗門，愛賠。", pinyin: "ngi daˊ lan+ cungˋ mun, oiˇ poi."}
    - en: "Sam and A-min are like brothers. Besides, they never quarrel any more."
      sx: {hanzi: "Sam 同阿明像兄弟。另外，佢兜無吵了。", pinyin: "Sam tungˇ aˊ minˇ qiong hiungˊ ti. nang ngoi, giˇ deuˊ moˇ cauˇ leˊ."}
      hl: {hanzi: "Sam 摎阿明像兄弟。另外，佢兜無吵了。", pinyin: "Sam lauˋ a+ min ciongˇ hiungˋ ti+. nang+ ngoi+, gi deuˋ mo cau leˋ."}
      check: true
    - en: "A-min is saving money to buy a phone."
      sx: {hanzi: "阿明在該存錢，愛買手機仔。", pinyin: "aˊ minˇ du ge sunˇ qienˇ, oi maiˊ suˋ giˊ eˋ."}
      hl: {hanzi: "阿明在該存錢，愛買手機。", pinyin: "a+ min diˇ gai sun cien, oiˇ maiˋ shiuˊ giˋ."}
  fill:
    - en: "Although I wanted it, I did wrong."
      sx: {hanzi: "___𠊎想愛，___𠊎做毋著。", pinyin: "___ ngaiˇ xiongˋ oi, ___ ngaiˇ zo mˇ cog.", answer_hanzi: "雖然……毋過", answer: "suiˊ ienˇ … mˇ go"}
      hl: {hanzi: "___𠊎想愛，___𠊎做毋著。", pinyin: "___ ngai siongˊ oiˇ, ___ ngai zoˇ m chogˋ.", answer_hanzi: "雖然……毋過", answer: "suiˋ rhan … m goˇ"}
    - en: "I forgive you."
      sx: {hanzi: "𠊎___你。", pinyin: "ngaiˇ ___ nˇ.", answer_hanzi: "原諒", answer: "ngienˇ liong"}
      hl: {hanzi: "𠊎___你。", pinyin: "ngai ___ ngi.", answer_hanzi: "原諒", answer: "ngien liong+"}
    - en: "You shouldn't have done that."
      sx: {hanzi: "你毋___恁樣做。", pinyin: "nˇ mˇ ___ anˋ ngiongˇ zo.", answer_hanzi: "應該", answer: "in goiˊ"}
      hl: {hanzi: "你毋___恁樣做。", pinyin: "ngi m ___ an ngiong zoˇ.", answer_hanzi: "應該", answer: "rhinˇ goiˋ"}

