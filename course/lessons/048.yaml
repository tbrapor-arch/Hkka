id: 48
title:
  en: "Making up"
  sx: {hanzi: "床頭吵，床尾和", pinyin: "congˇ teuˇ cauˇ, congˇ miˊ foˇ"}
  hl: {hanzi: "床頭吵，床尾和", pinyin: "cong teu cau, cong muiˋ fo"}
review: false
setting: >-
  Saturday morning. A-min and Sam have not spoken since yesterday afternoon. At eight, someone knocks on Sam's door:
  A-min, holding a shoebox and a small red envelope. Grandpa had a word with him last night.
names: [阿明]

dialogue:
  - n: 1
    speaker: 阿明
    en: "Sam… I'm sorry."
    sx: {hanzi: "Sam……失禮。", pinyin: "Sam … siidˋ liˊ."}
    hl: {hanzi: "Sam……失禮。", pinyin: "Sam … shid liˋ."}
  - n: 2
    speaker: 阿明
    en: "Though I really wanted these shoes, what I did was wrong. I shouldn't have used your card behind your back."
    sx: {hanzi: "雖然𠊎當想愛這雙鞋，毋過𠊎做毋著。𠊎毋應該偷偷仔用你个卡。", pinyin: "suiˊ ienˇ ngaiˇ dongˊ xiongˋ oi iaˋ sungˊ haiˇ, mˇ go ngaiˇ zo mˇ cog. ngaiˇ mˇ in goiˊ teuˊ teuˊ eˋ iung nˇ ge kaˋ."}
    hl: {hanzi: "雖然𠊎當想愛這雙鞋，毋過𠊎做毋著。𠊎毋應該偷偷用你个卡。", pinyin: "suiˋ rhan ngai dongˋ siongˊ oiˇ liaˊ sungˋ hai, m goˇ ngai zoˇ m chogˋ. ngai m rhinˇ goiˋ teuˋ teuˋ rhung+ ngi gaiˇ kaˊ."}
  - n: 3
    speaker: Sam
    en: "So you admit it?"
    sx: {hanzi: "你承認了？", pinyin: "nˇ siinˇ ngin leˊ?"}
    hl: {hanzi: "你承認了？", pinyin: "ngi shin ngin+ leˋ?"}
  - n: 4
    speaker: 阿明
    en: "I admit it. And not only will I send the shoes back, I'll pay you back the money as well."
    sx: {hanzi: "承認。𠊎毋單止愛退鞋，還愛還你錢。", pinyin: "siinˇ ngin. ngaiˇ mˇ danˊ ziiˋ oi tui haiˇ, hanˇ oi vanˇ nˇ qienˇ."}
    hl: {hanzi: "承認。𠊎毋單止愛退鞋，還愛還你錢。", pinyin: "shin ngin+. ngai m danˋ zhiˊ oiˇ tuiˇ hai, han oiˇ van ngi cien."}
  - n: 5
    speaker: Sam
    en: "Have you got the money?"
    sx: {hanzi: "你有錢無？", pinyin: "nˇ iuˊ qienˇ moˇ?"}
    hl: {hanzi: "你有錢無？", pinyin: "ngi rhiuˋ cien mo?"}
  - n: 6
    speaker: 阿明
    en: "(holding out the envelope) Last year's New Year red envelope. I saved it. Eight hundred, for the jacket."
    sx: {hanzi: "舊年過年个紅包，𠊎存起來个。八百，衫个錢。", pinyin: "kiu ngienˇ go ngienˇ ge fungˇ bauˊ, ngaiˇ sunˇ hiˋ loiˇ ge. badˋ bagˋ, samˊ ge qienˇ."}
    hl: {hanzi: "舊年過年个紅包，𠊎存起來个。八百，衫个錢。", pinyin: "kiu+ ngien goˇ ngien gaiˇ fung bauˋ, ngai sun hiˊ loi gaiˇ. bad bag, samˋ gaiˇ cien."}
  - n: 7
    speaker: Sam
    en: "(taking it, then giving it back) …I'm sorry too. Yesterday I was far too loud."
    sx: {hanzi: "……𠊎乜失禮。昨晡日𠊎忒大聲了。", pinyin: "… ngaiˇ me siidˋ liˊ. coˊ buˊ ngidˋ ngaiˇ tedˋ tai sangˊ leˊ."}
    hl: {hanzi: "……𠊎乜失禮。昨晡日𠊎忒大聲了。", pinyin: "… ngai meˇ shid liˋ. coˋ buˋ ngid ngai ted tai+ shangˋ leˋ."}
  - n: 8
    speaker: 阿明
    en: "Grandpa told me off last night. Not just me: he said you were wrong too."
    sx: {hanzi: "昨暗晡阿公罵𠊎。毋單止罵𠊎，佢還講你乜毋著。", pinyin: "coˊ am buˊ aˊ gungˊ ma ngaiˇ. mˇ danˊ ziiˋ ma ngaiˇ, giˇ hanˇ gongˋ nˇ me mˇ cog."}
    hl: {hanzi: "昨暗晡阿公罵𠊎。毋單止罵𠊎，佢還講你乜毋著。", pinyin: "coˋ amˇ buˋ a+ gungˋ maˇ ngai. m danˋ zhiˊ maˇ ngai, gi han gongˊ ngi meˇ m chogˋ."}
  - n: 9
    speaker: Sam
    en: "Right, then. I forgive you. Keep the jacket; the money counts as a red envelope from me."
    sx: {hanzi: "好，原諒你。衫留等，錢算𠊎送分你个紅包。", pinyin: "hoˋ, ngienˇ liong nˇ. samˊ liuˇ denˋ, qienˇ son ngaiˇ sung bunˊ nˇ ge fungˇ bauˊ."}
    hl: {hanzi: "好，原諒你。衫留等，錢算𠊎送分你个紅包。", pinyin: "hoˊ, ngien liong+ ngi. samˋ liu nenˊ, cien sonˇ ngai sungˇ bunˋ ngi gaiˇ fung bauˋ."}
  - n: 10
    speaker: 阿明
    en: "Really? (grinning) You're like my big brother."
    sx: {hanzi: "正經？你就像吾阿哥。", pinyin: "ziin ginˊ? nˇ qiu qiong ngaˊ aˊ goˊ."}
    hl: {hanzi: "正經？你就像𠊎个阿哥。", pinyin: "zhinˇ ginˋ? ngi ciu+ ciongˇ ngai gaiˇ a+ goˋ."}
  - n: 11
    speaker: 阿婆
    en: "(who has been listening at the foot of the stairs) That's it! 'Quarrel at the head of the bed, make up at the foot!'"
    sx: {hanzi: "好了！床頭吵，床尾和！", pinyin: "hoˋ leˊ! congˇ teuˇ cauˇ, congˇ miˊ foˇ!"}
    hl: {hanzi: "好了！床頭吵，床尾和！", pinyin: "hoˊ leˋ! cong teu cau, cong muiˋ fo!"}
  - n: 12
    speaker: 阿明
    en: "Grandma, that saying's about husbands and wives!"
    sx: {hanzi: "阿婆，該句係講兩公婆个！", pinyin: "aˊ poˇ, ge gi he gongˋ liongˋ gungˊ poˇ ge!"}
    hl: {hanzi: "阿婆，該句係講兩公婆个！", pinyin: "a+ po, gai giˇ heˇ gongˊ liongˊ gungˋ po gaiˇ!"}
  - n: 13
    speaker: 阿婆
    en: "Near enough! Come and have breakfast."
    sx: {hanzi: "差毋多！來食朝。", pinyin: "caˊ mˇ doˊ! loiˇ siid zeuˊ."}
    hl: {hanzi: "差毋多！來食朝。", pinyin: "caˋ m doˋ! loi shidˋ zhauˋ."}

notes:
  - ref: 1
    topic: vocab
    text: >
      失禮 siidˋ liˊ (lesson 38): "excuse me" to a stranger, and "I'm sorry" when you have wronged someone; 敗勢 is
      closer to "how embarrassing, sorry". A-min chooses the serious word.
  - ref: 2
    topic: grammar
    text: >
      雖然…，毋過… "although…, (but)…": unlike English, Hakka says both: 雖然𠊎當想愛這雙鞋，毋過𠊎做毋著. Official example:
      佢雖然在外地讀書，毋過三不二時就會轉屋下一擺 "although he studies far away, he comes home every now and then".
      做毋著 "did wrong": 做 + 毋著 (lesson 47). 應該 in goiˊ "should, ought to"; 毋應該 "shouldn't have".
  - ref: 4
    topic: grammar
    text: >
      毋單止 A，還 B "not only A, but also B": 𠊎毋單止愛退鞋，還愛還你錢. 毋單止 mˇ danˊ ziiˋ is a block ("not just
      stopping at"); the official examples also have 毋單淨…還…. Line 8 uses it again.
  - ref: 6
    topic: culture
    text: >
      Children's New Year red envelopes are meant to be saved: 存起來 "put away, saved". 存 sunˇ "keep, deposit"; 存錢 "save
      money". A-min's 舊年个紅包 has survived a whole year, which tells you how sorry he is.
  - ref: 9
    topic: vocab
    text: >
      原諒 ngienˇ liong "forgive". 錢算𠊎送分你个紅包 "count the money as a red envelope from me": 算 "count as"
      (lesson 25). Sam gives A-min's own envelope back to him as his.
  - ref: 11
    topic: culture
    text: >
      床頭吵，床尾和 "quarrel at the head of the bed, make up at its foot": a saying about married couples, quoted in an
      official example (佢兩公婆早就和好了). 兩公婆 (line 12) "husband and wife, the couple". Grandma knows exactly what the
      saying is about. 該句 "that sentence, that saying": 句 classifier for sayings and sentences.

