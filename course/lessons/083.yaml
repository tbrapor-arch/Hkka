      sx: {hanzi: "___", pinyin: "___", answer_hanzi: "當時", answer: "dongˊ siiˇ"}
      hl: {hanzi: "___", pinyin: "___", answer_hanzi: "該當時", answer: "gai dongˋ shi"}
    - en: "What colour is it?"
      sx: {hanzi: "係麼个___？", pinyin: "he maˋ ge ___?", answer_hanzi: "色", answer: "sedˋ"}
      hl: {hanzi: "係麼个___？", pinyin: "heˇ maˊ gaiˇ ___?", answer_hanzi: "色", answer: "sed"}
    - en: "The man in the suit is Grandpa."
      sx: {hanzi: "著西裝___該隻人係阿公。", pinyin: "zogˋ xiˊ zongˊ ___ ge zagˋ nginˇ he aˊ gungˊ.", answer_hanzi: "个", answer: "ge"}
      hl: {hanzi: "著西裝___該隻人係阿公。", pinyin: "zhog siˋ zongˋ ___ gai zhag ngin heˇ a+ gungˋ.", answer_hanzi: "个", answer: "gaiˇ"}

