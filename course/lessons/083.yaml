exercises:
  translate:
    - en: "In those days brides sat in a sedan chair; now they ride in a car."
      sx: {hanzi: "當時个新娘坐花轎，這下个新娘坐車仔。", pinyin: "dongˊ siiˇ ge xinˊ ngiongˇ coˊ faˊ kieu, iaˋ ha ge xinˊ ngiongˇ coˊ caˊ eˋ."}
      hl: {hanzi: "該當時个新娘坐花轎，這下个新娘坐車仔。", pinyin: "gai dongˋ shi gaiˇ sinˋ ngiong coˋ faˋ kiau+, liaˊ ha+ gaiˇ sinˋ ngiong coˋ chaˋ er."}
      check: true
    - en: "The matchmaker brought the dowry; the bride wore her formal dress."
      sx: {hanzi: "媒人婆擐等嫁妝來，新娘著禮服。", pinyin: "moiˇ nginˇ poˇ kuan denˋ ga zongˊ loiˇ, xinˊ ngiongˇ zogˋ liˊ fug."}
      hl: {hanzi: "媒人婆擐等嫁妝來，新娘著禮服。", pinyin: "moi ngin po kuan+ denˊ gaˇ zongˋ loi, sinˋ ngiong zhog liˋ fugˋ."}
      check: true
    - en: "After leaving the army, great-uncle married great-aunt's friend."
      sx: {hanzi: "叔公退伍以後，討姑婆个朋友做餔娘。", pinyin: "sugˋ gungˊ tui ngˋ iˊ heu, toˋ guˊ poˇ ge penˇ iuˊ zo buˊ ngiongˇ."}
      hl: {hanzi: "叔公退伍以後，討姑婆个朋友做餔娘。", pinyin: "shug gungˋ tuiˇ ngˊ rhiˋ heu+, toˊ guˋ po gaiˇ pen rhiuˋ zoˇ buˋ ngiong."}
    - en: "Photos from the 1970s are all black and white."
      sx: {hanzi: "七十年代个相片，全部係烏白个。", pinyin: "qidˋ siib ngienˇ toi ge xiong pienˋ, qionˇ pu he vuˊ pag ge."}
      hl: {hanzi: "七十年代个相片，全部係烏白个。", pinyin: "cid shibˋ ngien toi+ gaiˇ siongˇ pienˊ, cion pu+ heˇ vuˋ pagˋ gaiˇ."}
    - en: "A-in has a whole pile of photos of Sam from before."
      sx: {hanzi: "阿英有一疊 Sam 以前个相片。", pinyin: "aˊ inˊ iuˊ idˋ tiab Sam iˊ qienˇ ge xiong pienˋ."}
      hl: {hanzi: "阿英有一疊 Sam 以前个相片。", pinyin: "a+ rhinˋ rhiuˋ rhid tiabˋ Sam rhiˋ cien gaiˇ siongˇ pienˊ."}
      check: true
    - en: "In the year 66 of the Republic (1977), Grandpa was a young man of twenty-eight."
      sx: {hanzi: "民國六十六年，阿公係二十八歲个少年。", pinyin: "minˇ guedˋ liugˋ siib liugˋ ngienˇ, aˊ gungˊ he ngi siib badˋ se ge seu ngienˇ."}
      hl: {hanzi: "民國六十六年，阿公係二十八歲个少年。", pinyin: "min gued liug shibˋ liug ngien, a+ gungˋ heˇ ngi+ shibˋ bad soiˇ gaiˇ shauˇ ngien."}
  fill:
