id: 83
title:
  en: "An old photo album"
  sx: {hanzi: "五十年前个相片", pinyin: "ngˋ siib ngienˇ qienˇ ge xiong pienˋ"}
  hl: {hanzi: "五十年前个相片", pinyin: "ngˊ shibˋ ngien cien gaiˇ siongˇ pienˊ"}
review: false
setting: >-
  Sunday 13 June, a wet afternoon. Looking for Grandpa's old walking stick upstairs, A-in has found a cardboard box
  instead. Everyone is round the table in the main room, Grandpa in his chair at the head, the photos spread out in
  front of him.
names: [阿英, 阿明]

dialogue:
  - n: 1
    speaker: 阿英
    en: "Grandma, I found a box of old photos upstairs!"
    sx: {hanzi: "阿婆，𠊎在樓頂尋著一箱舊相片！", pinyin: "aˊ poˇ, ngaiˇ coiˊ leuˇ dangˋ qimˇ doˋ idˋ xiongˊ kiu xiong pienˋ!"}
    hl: {hanzi: "阿婆，𠊎在樓頂尋著一箱舊相片！", pinyin: "a+ po, ngai coiˋ leu dangˊ cim doˊ rhid siongˋ kiu+ siongˇ pienˊ!"}
  - n: 2
    speaker: 阿婆
    en: "That box! I've been looking for it for years. In the old days the photos lay in piles, one pile on top of another."
    sx: {hanzi: "這箱相片，𠊎尋幾多年了！以前相片係一疊一疊个。", pinyin: "iaˋ xiongˊ xiong pienˋ, ngaiˇ qimˇ giˋ doˊ ngienˇ leˊ! iˊ qienˇ xiong pienˋ he idˋ tiab idˋ tiab ge."}
    hl: {hanzi: "這箱相片，𠊎尋幾多年了！以前相片係一疊一疊个。", pinyin: "liaˊ siongˋ siongˇ pienˊ, ngai cim giˊ doˋ ngien leˋ! rhiˋ cien siongˇ pienˊ heˇ rhid tiabˋ rhid tiabˋ gaiˇ."}
  - n: 3
    speaker: Sam
    en: "(holding up a black-and-white photo) Who's this? The young man in the suit?"
    sx: {hanzi: "這係麼人？著西裝个該隻後生人？", pinyin: "iaˋ he maˋ nginˇ? zogˋ xiˊ zongˊ ge ge zagˋ heu sangˊ nginˇ?"}
    hl: {hanzi: "這係麼人？著西裝个該隻後生人？", pinyin: "liaˊ heˇ maˊ ngin? zhog siˋ zongˋ gaiˇ gai zhag heu+ sangˋ ngin?"}
  - n: 4
    speaker: 阿婆
    en: "That's your grandpa. It was taken on our wedding day, fifty years ago."
    sx: {hanzi: "該係阿公。這張係五十年前，𠊎兜結婚該日翕个。", pinyin: "ge he aˊ gungˊ. iaˋ zongˊ he ngˋ siib ngienˇ qienˇ, ngaiˇ deuˊ giedˋ funˊ ge ngidˋ hibˋ ge."}
    hl: {hanzi: "該係阿公。這張係五十年前，𠊎兜結婚該日翕个。", pinyin: "gai heˇ a+ gungˋ. liaˊ zhongˋ heˇ ngˊ shibˋ ngien cien, ngai deuˋ gied funˋ gai ngid hib gaiˇ."}
  - n: 5
    speaker: 阿明
    en: "Grandpa was so thin! And look at all that hair!"
    sx: {hanzi: "阿公恁瘦！頭那毛恁多！", pinyin: "aˊ gungˊ anˋ ceu! teuˇ naˇ moˊ anˋ doˊ!"}
    hl: {hanzi: "阿公恁瘦！頭那毛恁多！", pinyin: "a+ gungˋ anˊ seuˇ! teu na moˋ anˊ doˋ!"}
  - n: 6
    speaker: 阿公
    en: "(touching the top of his head, saying nothing)"
    sx: {hanzi: "……", pinyin: "…"}
    hl: {hanzi: "……", pinyin: "…"}
  - n: 7
    speaker: Sam
    en: "And the bride beside him is you, Grandma? You can't see what colour your clothes are."
    sx: {hanzi: "企在佢身邊个新娘就係阿婆？看毋著衫係麼个色。", pinyin: "kiˊ coiˊ giˇ siinˊ bienˊ ge xinˊ ngiongˇ qiu he aˊ poˇ? kon mˇ doˋ samˊ he maˋ ge sedˋ."}
    hl: {hanzi: "企在佢身邊个新娘就係阿婆？看毋著衫係麼个色。", pinyin: "kiˋ coiˋ gi shinˋ bienˋ gaiˇ sinˋ ngiong ciu+ heˇ a+ po? konˇ m doˊ samˋ heˇ maˊ gaiˇ sed."}
    check: true
  - n: 8
    speaker: 阿婆
    en: "It's me. In those days there were no colour photos. The clothes I wore that day were red."
    sx: {hanzi: "係𠊎。當時無彩色相片，全部係烏白个。𠊎該日著个衫，係紅色个。", pinyin: "he ngaiˇ. dongˊ siiˇ moˇ caiˋ sedˋ xiong pienˋ, qionˇ pu he vuˊ pag ge. ngaiˇ ge ngidˋ zogˋ ge samˊ, he fungˇ sedˋ ge."}
    hl: {hanzi: "係𠊎。該當時無彩色相片，全部係烏白个。𠊎該日著个衫，係紅色个。", pinyin: "heˇ ngai. gai dongˋ shi mo caiˊ sed siongˇ pienˊ, cion pu+ heˇ vuˋ pagˋ gaiˇ. ngai gai ngid zhog gaiˇ samˋ, heˇ fung sed gaiˇ."}
  - n: 9
    speaker: 阿英
    en: "How old were you then, Grandma? Did a matchmaker introduce you?"
    sx: {hanzi: "當時阿婆幾多歲？係媒人婆紹介个無？", pinyin: "dongˊ siiˇ aˊ poˇ giˋ doˊ se? he moiˇ nginˇ poˇ seu gie ge moˇ?"}
    hl: {hanzi: "該當時阿婆幾多歲？係媒人婆紹介个無？", pinyin: "gai dongˋ shi a+ po giˊ doˋ soiˇ? heˇ moi ngin po shauˇ gaiˇ gaiˇ mo?"}
  - n: 10
    speaker: 阿婆
    en: "Twenty-five. A year younger than you are now."
    sx: {hanzi: "二十五。比你這下還細一歲。", pinyin: "ngi siib ngˋ. biˋ nˇ iaˋ ha hanˇ se idˋ se."}
    hl: {hanzi: "二十五。比你這下還細一歲。", pinyin: "ngi+ shibˋ ngˊ. biˊ ngi liaˊ ha+ han seˇ rhid soiˇ."}
  - n: 11
    speaker: 阿明
    en: "And this one? Who's the little boy sitting in the yard?"
    sx: {hanzi: "還有這張？坐在禾埕个該隻細人仔係麼人？", pinyin: "hanˇ iuˊ iaˋ zongˊ? coˊ coiˊ voˇ tangˇ ge ge zagˋ se nginˇ eˋ he maˋ nginˇ?"}
    hl: {hanzi: "還有這張？坐在禾埕个該隻細人仔係麼人？", pinyin: "han rhiuˋ liaˊ zhongˋ? coˋ coiˋ vo tang gaiˇ gai zhag seˇ ngin er heˇ maˊ ngin?"}
  - n: 12
    speaker: 阿婆
    en: "That's your dad! Three years old, in front of the old family house. And the man holding him is your great-uncle, back from his army service."
    sx: {hanzi: "該係你阿爸！三歲个時節，在頭擺个伙房前翕个。揇等佢个，係做兵轉來个叔公。", pinyin: "ge he nˇ aˊ baˊ! samˊ se ge siiˇ jiedˋ, coiˊ teuˇ baiˋ ge foˋ fongˇ qienˇ hibˋ ge. namˋ denˋ giˇ ge, he zo binˊ zonˋ loiˇ ge sugˋ gungˊ."}
    hl: {hanzi: "該係你阿爸！三歲个時節，在頭擺个伙房前翕个。揇等佢个，係做兵轉來个叔公。", pinyin: "gai heˇ ngi a+ baˋ! samˋ soiˇ gaiˇ shi zied, coiˋ teu baiˊ gaiˇ foˊ fong cien hib gaiˇ. namˊ denˊ gi gaiˇ, heˇ zoˇ binˋ zhonˊ loi gaiˇ shug gungˋ."}
    check: true
  - n: 13
    speaker: 阿明
    en: "Dad was so chubby!"
    sx: {hanzi: "阿爸頭擺恁肥！", pinyin: "aˊ baˊ teuˇ baiˋ anˋ piˇ!"}
    hl: {hanzi: "阿爸頭擺恁肥！", pinyin: "a+ baˋ teu baiˊ anˊ pui!"}
  - n: 14
    speaker: Sam
    en: "Times have changed, but Grandpa's face hasn't changed much."
    sx: {hanzi: "時代改變了，毋過阿公个面無麼个變。", pinyin: "siiˇ toi goiˋ bien leˊ, mˇ go aˊ gungˊ ge mien moˇ maˋ ge bien."}
    hl: {hanzi: "時代改變了，毋過阿公个面無麼个變。", pinyin: "shi toi+ goiˊ bienˇ leˋ, m goˇ a+ gungˋ gaiˇ mienˇ mo maˊ gaiˇ bienˇ."}
  - n: 15
    speaker: 阿公
    en: "(picking up the wedding photo) This one: it's mine."
    sx: {hanzi: "這張，分𠊎。", pinyin: "iaˋ zongˊ, bunˊ ngaiˇ."}
    hl: {hanzi: "這張，分𠊎。", pinyin: "liaˊ zhongˋ, bunˋ ngai."}
  - n: 16
    speaker: 阿婆
    en: "(smiling) Fifty years ago he was just the same: two words at a time."
    sx: {hanzi: "五十年前佢乜係恁樣，一擺講兩隻字。", pinyin: "ngˋ siib ngienˇ qienˇ giˇ me he anˋ ngiongˇ, idˋ baiˋ gongˋ liongˋ zagˋ sii."}
    hl: {hanzi: "五十年前佢乜係恁樣，一擺講兩隻字。", pinyin: "ngˊ shibˋ ngien cien gi meˇ heˇ an ngiong, rhid baiˊ gongˊ liongˊ zhag sii+."}

notes:
  - ref: 3
    topic: grammar
    text: >
      著西裝个該隻後生人 "the young man in the suit", literally "wear-suit 个 that young man": a whole clause, then 个,
      then the noun. The demonstrative and classifier (該隻) can come after the clause, as here, or before it. 西裝 from
      lesson 74; 後生人 "young man" (lesson 40).
  - ref: 4
    topic: grammar
    text: >
      𠊎兜結婚該日翕个 "taken on the day we married": the time clause 𠊎兜結婚該日 "the day we married" is built the same
      way, clause + 該日 "that day". 係…翕个 "was taken (then)": the 係…个 frame (lesson 32). 𠊎兜 leaves the
      grandchildren out: they weren't there.
  - ref: 7
    topic: grammar
    text: >
      企在佢身邊个新娘 "the bride standing beside him": clause + 个 + noun again. 看毋著 kon mˇ doˋ "can't see": V毋著
      (lesson 47, the "can't" reading doˋ). 色 sedˋ "colour": 麼个色 "what colour". 身邊 siinˊ bienˊ "at one's side".
      The line is marked for a check: the whole clause is the course's own.
  - ref: 8
    topic: grammar
    text: >
      "In those days": 當時 dongˊ siiˇ is 初級 in the lists for both accents. 該當時 gai dongˋ shi is the Hailu
      favourite: MOE marks it "僅海陸用，四縣為「該央時」", yet five Sixian example sentences have it anyway
      (該當時𠊎就同佢講過這件事情). So the Sixian column says 當時, the Hailu column 該當時, and either would be heard. 烏白 vuˊ pag "black-and-white", 彩色 caiˋ sedˋ
      "colour (photo, television)". 𠊎該日著个衫 "the clothes I wore that day": one more clause before its noun.
  - ref: 10
    topic: grammar
    text: >
      比你這下還細一歲 "a year younger than you are now": 比 + adjective + amount (lesson 66), with 還 "still, even".
      A-in is twenty-six (lesson 31).
  - ref: 12
    topic: vocab
    text: >
      伙房 "the family compound" and 禾埕 "the yard in front of it" from lesson 71. 揇等 namˋ denˋ "holding (in your
      arms)", 揇 with the 等 of lesson 29. 做兵 zo binˊ "do military service", 叔公 sugˋ gungˊ "great-uncle (grandfather's
      younger brother)". The line is marked for its stacked clauses.
  - ref: 14
    topic: vocab
    text: >
      時代 siiˇ toi "the times, an era", 改變 goiˋ bien "change", 無麼个變 "hasn't changed much": 變 (lesson 64).
  - ref: 16
    topic: culture
    text: >
      一擺講兩隻字 "two words at a time": Grandma's verdict on her husband, then and now. The one time he says more, he
      sings it (lesson 82).

