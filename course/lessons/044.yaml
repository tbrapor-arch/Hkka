      sx: {hanzi: "___無看著你！", pinyin: "___ moˇ kon doˋ nˇ!", answer_hanzi: "恁久", answer: "anˋ giuˋ"}
      hl: {hanzi: "___無看著你！", pinyin: "___ mo konˇ doˊ ngi!", answer_hanzi: "恁久", answer: "anˊ giuˊ"}
    - en: "Congratulations, congratulations!"
      sx: {hanzi: "___，___！", pinyin: "___, ___!", answer_hanzi: "恭喜", answer: "giungˊ hiˋ"}
      hl: {hanzi: "___，___！", pinyin: "___, ___!", answer_hanzi: "恭喜", answer: "giungˋ hiˊ"}
    - en: "Kissing with conical hats on: still a long way off."
      sx: {hanzi: "戴等笠嫲唚嘴：___。", pinyin: "dai denˋ libˋ maˇ jimˊ zoi: ___.", answer_hanzi: "差得遠", answer: "caˊ dedˋ ienˋ"}
