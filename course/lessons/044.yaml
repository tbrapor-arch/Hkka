id: 44
title:
  en: "The wedding banquet"
  sx: {hanzi: "戴等笠嫲唚嘴", pinyin: "dai denˋ libˋ maˇ jimˊ zoi"}
  hl: {hanzi: "戴等笠嫲唚嘴", pinyin: "daiˇ denˊ lib ma zimˋ zhoiˇ"}
review: false
setting: >-
  Saturday evening, a red marquee across the lane from the 伯公 shrine: thirty round tables, a stage, a karaoke machine.
  A-in is home for the weekend. The Lius sit at the neighbours' table, and the dishes keep coming.
names: [財伯姆, 阿財伯, 阿興, 阿英, 阿明, 阿珠, 劉]

dialogue:
  - n: 1
    speaker: 阿珠
    en: "(an elderly relative of the bride's side, taking Grandma's hands) Grandma Liu! Haven't seen you for ages!"
    sx: {hanzi: "劉阿婆！恁久無看著你！", pinyin: "liuˇ aˊ poˇ! anˋ giuˋ moˇ kon doˋ nˇ!"}
    hl: {hanzi: "劉阿婆！恁久無看著你！", pinyin: "liu a+ po! anˊ giuˊ mo konˇ doˊ ngi!"}
  - n: 2
    speaker: 阿婆
    en: "A-tsu! Ten years at least! You haven't changed a bit."
    sx: {hanzi: "阿珠！有十年吔！你還係恁後生。", pinyin: "aˊ zuˊ! iuˊ siib ngienˇ leˊ! nˇ hanˇ he anˋ heu sangˊ."}
    hl: {hanzi: "阿珠！有十年咧！你還係恁後生。", pinyin: "a+ zhuˋ! rhiuˋ shibˋ ngien leˋ! ngi han heˇ anˊ heu+ sangˋ."}
  - n: 3
    speaker: 阿明
    en: "(as the bride passes in her third dress) The bride is so pretty!"
    sx: {hanzi: "新娘當靚！", pinyin: "xinˊ ngiongˇ dongˊ jiangˊ!"}
    hl: {hanzi: "新娘當靚！", pinyin: "sinˋ ngiong dongˋ ziangˋ!"}
  - n: 4
    speaker: 阿婆
    en: "As the saying goes: 'three parts looks, seven parts dress.'"
    sx: {hanzi: "俗語講：「三分人才，七分打扮。」", pinyin: "xiug ngiˊ gongˋ: samˊ funˊ nginˇ coiˇ, qidˋ funˊ daˋ ban."}
    hl: {hanzi: "俗語講：「三分人才，七分打扮。」", pinyin: "siugˋ ngiˋ gongˊ: samˋ funˋ ngin coi, cid funˋ daˊ banˇ."}
  - n: 5
    speaker: 阿英
    en: "Grandma! Don't say that, she might hear you."
    sx: {hanzi: "阿婆！莫恁樣講，佢會聽著。", pinyin: "aˊ poˇ! mog anˋ ngiongˇ gongˋ, giˇ voi tangˊ doˋ."}
    hl: {hanzi: "阿婆！莫恁樣講，佢會聽著。", pinyin: "a+ po! mogˋ an ngiong gongˊ, gi voi+ tangˋ doˊ."}
  - n: 6
    speaker: 財伯姆
    en: "(coming over) The bride and groom are going round every table to toast the guests. Get your glasses ready!"
    sx: {hanzi: "新娘公、新娘愛逐張桌去摎人客敬酒。杯仔拿等！", pinyin: "xinˊ ngiongˇ gungˊ, xinˊ ngiongˇ oi dagˋ zongˊ zogˋ hi lauˊ nginˇ hagˋ gin jiuˋ. biˊ eˋ naˊ denˋ!"}
    hl: {hanzi: "新娘公、新娘愛逐張桌去摎人客敬酒。杯仔拿等！", pinyin: "sinˋ ngiong gungˋ, sinˋ ngiong oiˇ dag zhongˋ zog hiˇ lauˋ ngin hag ginˇ ziuˊ. buiˋ er naˋ denˊ!"}
  - n: 7
    speaker: 阿興
    en: "(the groom, red in the face, raising his glass) Thank you all for coming! Thank you! Bottoms up!"
    sx: {hanzi: "感謝大家來！恁仔細！乾杯！", pinyin: "gamˋ qia tai gaˊ loiˇ! anˋ ziiˋ se! gonˊ biˊ!"}
    hl: {hanzi: "感謝大家來！承蒙你兜！乾杯！", pinyin: "gamˊ cia+ tai+ gaˋ loi! shin mung ngi deuˋ! gonˋ buiˋ!"}
  - n: 8
    speaker: 阿婆
    en: "Congratulations! May you, husband and wife, be happy together for a hundred years."
    sx: {hanzi: "恭喜，恭喜！祝你夫妻百年好合。", pinyin: "giungˊ hiˋ, giungˊ hiˋ! zugˋ nˇ fuˊ qiˊ bagˋ ngienˇ hoˋ hab."}
    hl: {hanzi: "恭喜，恭喜！祝你夫妻百年好合。", pinyin: "giungˋ hiˊ, giungˋ hiˊ! zhug ngi fuˋ ciˋ bag ngien hoˊ habˋ."}
  - n: 9
    speaker: 財伯姆
    en: "(looking from A-in to Sam and back) Grandma Liu, when is your A-in getting married? Remember to invite me to the banquet!"
    sx: {hanzi: "劉阿婆，你兜阿英哪久愛嫁？記得請𠊎食酒！", pinyin: "liuˇ aˊ poˇ, nˇ deuˊ aˊ inˊ nai giuˋ oi ga? gi dedˋ qiangˋ ngaiˇ siid jiuˋ!"}
    hl: {hanzi: "劉阿婆，你兜阿英哪久愛嫁？記得請𠊎食酒！", pinyin: "liu a+ po, ngi deuˋ a+ rhinˋ nai+ giuˊ oiˇ gaˇ? giˇ ded ciangˊ ngai shidˋ ziuˊ!"}
  - n: 10
    speaker: 阿婆
    en: "(glancing at A-in, then firmly at her bowl) Grandma isn't interfering any more."
    sx: {hanzi: "阿婆毋管吔。", pinyin: "aˊ poˇ mˇ gonˋ leˊ."}
    hl: {hanzi: "阿婆毋管咧。", pinyin: "a+ po m gonˊ leˋ."}
  - n: 11
    speaker: 阿公
    en: "(who has said nothing all evening, to no one in particular) Kissing with your conical hats on."
    sx: {hanzi: "戴等笠嫲唚嘴。", pinyin: "dai denˋ libˋ maˇ jimˊ zoi."}
    hl: {hanzi: "戴等笠嫲唚嘴。", pinyin: "daiˇ denˊ lib ma zimˋ zhoiˇ."}
  - n: 12
    speaker: Sam
    en: "(whispering to A-min) What does that mean?"
    sx: {hanzi: "該係麼个意思？", pinyin: "ge he maˋ ge i sii?"}
    hl: {hanzi: "該係麼个意思？", pinyin: "gai heˇ maˊ gaiˇ rhiˇ siiˇ?"}
  - n: 13
    speaker: 阿明
    en: "It's a 師傅話, a saying with a hidden end. Hats on, you can't get close: 'still a long way off'."
    sx: {hanzi: "這係師傅話。戴等笠嫲，唚毋著：差得遠！", pinyin: "iaˋ he siiˊ fu fa. dai denˋ libˋ maˇ, jimˊ mˇ doˋ: caˊ dedˋ ienˋ!"}
    hl: {hanzi: "這係師傅話。戴等笠嫲，唚毋著：差得遠！", pinyin: "liaˊ heˇ siiˋ fu+ faˇ. daiˇ denˊ lib ma, zimˋ m doˊ: caˋ ded rhanˊ!"}
  - n: 14
    speaker: 阿英
    en: "(very busy with the fish) This fish is delicious."
    sx: {hanzi: "這尾魚當好食。", pinyin: "iaˋ miˊ ngˇ dongˊ hoˋ siid."}
    hl: {hanzi: "這尾魚當好食。", pinyin: "liaˊ muiˋ ng dongˋ hoˊ shidˋ."}

notes:
  - ref: 1
    topic: grammar
    text: >
      恁久無看著你！ "long time no see!": the greeting of lesson 22, now with 你 at the end, as in the official examples
      (恁久無看著你，前暫仔你去哪？). 阿珠 is from the bride's side.
  - ref: 4
    topic: culture
    text: >
      俗語 xiug ngiˊ "saying, proverb", and 老古人言 "the words of the old folk" for the same thing: four- or seven-syllable
      lines quoted as they are. 三分人才，七分打扮 "three parts looks, seven parts dress" is an official example; 人才
      "looks, appearance", 打扮 "dress up, get up". Learn a saying as a whole, like a word.
  - ref: 6
    topic: culture
    text: >
      敬酒 gin jiuˋ "toast (someone)": 摎人客敬酒 "toast the guests", with 摎 (lesson 40) for the person. 新郎新娘愛逐張桌
      去摎人客敬酒 is the official example this line follows. 杯仔 "glass, cup"; 乾杯 "bottoms up". 逐張桌 "every table":
      張 is the classifier for tables.
  - ref: 7
    topic: vocab
    text: >
      恁仔細 stands alone, as a thank-you of its own: the groom says what he is thanking for with 感謝 gamˋ qia
      ("感謝大家來" "thank you all for coming"), then 恁仔細！ The official examples work the same way: 恁仔細（多謝），送恁多
      東西分𠊎. Hailu 承蒙 can take the person: 承蒙你兜.
  - ref: 8
    topic: culture
    text: >
      恭喜 giungˊ hiˋ "congratulations", said twice. 祝你夫妻百年好合 "may you, husband and wife, have a hundred years of
      harmony" is the official wedding wish (in full: 祝你夫妻百年好合，五世其昌). 祝 "wish (someone something)", 夫妻
      fuˊ qiˊ "husband and wife".
  - ref: 9
    topic: culture
    text: >
      哪久愛嫁？記得請𠊎食酒 "when is she getting married? remember to invite me to the banquet": an official example asks
      the same of a son (若倈仔哪久愛討餔娘？記得請𠊎食酒). 哪久 "when". Grandma keeps the promise of lesson 42.
  - ref: 11
    topic: culture
    text: >
      師傅話 siiˊ fu fa: a two-part saying, like 戴等笠嫲唚嘴 "kissing with conical hats on". You say the first half and the
      listener supplies the meaning, here 差得遠 caˊ dedˋ ienˋ "a long way off" (an official example explains this one).
      Grandpa means A-in and Sam, or perhaps A-in and marriage in general. He does not say which. 唚 jimˊ "kiss"; 唚毋著
      "can't manage to kiss": after a verb, 毋著 is mˇ doˋ "not manage to" (著 doˋ, lesson 33). Don't confuse it with 毋著
      mˇ cog "wrong" (lesson 47): same characters, different reading.
  - ref: 14
    topic: vocab
    text: >
      尾 miˊ is the classifier for fish (Hailu muiˋ): 這尾魚 "this fish". A-in has found something urgent to do.
  - ref: 0
    topic: hailu
    text: >
      Hailu: 承蒙 shin mung for 恁仔細, 杯 buiˋ, 尾 muiˋ, 唚 zimˋ, and V等 denˊ (拿等, 戴等).

