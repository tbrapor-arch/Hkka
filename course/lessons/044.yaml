exercises:
  translate:
    - en: "Everyone toasts the newly-weds."
      sx: {hanzi: "大家摎新人敬酒。", pinyin: "tai gaˊ lauˊ xinˊ nginˇ gin jiuˋ."}
      hl: {hanzi: "大家摎新人敬酒。", pinyin: "tai+ gaˋ lauˋ sinˋ ngin ginˇ ziuˊ."}
    - en: "The groom looks very smart today."
      sx: {hanzi: "新娘公今晡日當派頭。", pinyin: "xinˊ ngiongˇ gungˊ gimˊ buˊ ngidˋ dongˊ pai teuˇ."}
      hl: {hanzi: "新娘公今晡日當派頭。", pinyin: "sinˋ ngiong gungˋ gimˋ buˋ ngid dongˋ paiˇ teu."}
    - en: "The old folk say: 'A thousand days at home are good; half a morning away is hard.'"
      sx: {hanzi: "老古人言：「在家千日好，出門半朝難。」", pinyin: "loˋ guˋ nginˇ ngienˇ: coiˊ gaˊ qienˊ ngidˋ hoˋ, cudˋ munˇ ban zeuˊ nanˇ."}
      hl: {hanzi: "老古人言：「在家千日好，出門半朝難。」", pinyin: "loˊ guˊ ngin ngien: coiˋ gaˋ cienˋ ngid hoˊ, chud mun banˇ zhauˋ nan."}
    - en: "Grandpa doesn't drink alcohol; he drinks tea."
      sx: {hanzi: "阿公毋食酒，佢食茶。", pinyin: "aˊ gungˊ mˇ siid jiuˋ, giˇ siid caˇ."}
      hl: {hanzi: "阿公毋食酒，佢食茶。", pinyin: "a+ gungˋ m shidˋ ziuˊ, gi shidˋ ca."}
    - en: "Everyone gives the newly-weds their blessing: a hundred years of harmony!"
      sx: {hanzi: "大家祝福新人：百年好合！", pinyin: "tai gaˊ zugˋ fugˋ xinˊ nginˇ: bagˋ ngienˇ hoˋ hab!"}
      hl: {hanzi: "大家祝福新人：百年好合！", pinyin: "tai+ gaˋ zhug fug sinˋ ngin: bag ngien hoˊ habˋ!"}
  fill:
