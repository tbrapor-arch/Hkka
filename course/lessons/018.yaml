  - {hanzi: 爬山, pinyin: "paˇ sanˊ", en: "go hiking, climb a mountain", hl: {hanzi: 爬山, pinyin: "pa sanˋ"}}
  - {hanzi: 還係, pinyin: "hanˇ he", en: "or (in questions); still", hl: {hanzi: 抑係, pinyin: "rha+ heˇ"}}
  - {hanzi: 海脣, pinyin: "hoiˋ sunˇ", en: "seaside", hl: {hanzi: 海脣, pinyin: "hoiˊ shun"}}
