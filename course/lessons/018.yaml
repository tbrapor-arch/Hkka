  - {hanzi: 出門, pinyin: "cudˋ munˇ", en: "go out, leave the house", hl: {hanzi: 出門, pinyin: "chud mun"}}
  - {hanzi: 便當, pinyin: "pien dongˊ", en: "lunch box", hl: {hanzi: 便當, pinyin: "pien+ dongˋ"}}
