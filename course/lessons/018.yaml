exercises:
  translate:
    - en: "Do you want tea or soup?"
      sx: {hanzi: "你愛食茶，抑係食湯？", pinyin: "nˇ oi siid caˇ, ia he siid tongˊ?"}
      hl: {hanzi: "你愛食茶，抑係食湯？", pinyin: "ngi oiˇ shidˋ ca, rha+ heˇ shidˋ tongˋ?"}
    - en: "On Sunday morning we're going out together."
      sx: {hanzi: "禮拜日朝晨，𠊎兜共下出門。", pinyin: "liˊ bai ngidˋ zeuˊ siinˇ, ngaiˇ deuˊ kiung ha cudˋ munˇ."}
      hl: {hanzi: "禮拜日朝晨，𠊎兜共下出門。", pinyin: "liˋ baiˇ ngid zhauˋ shin, ngai deuˋ kiung+ ha+ chud mun."}
    - en: "How many people are coming back?"
      sx: {hanzi: "幾多儕會轉來？", pinyin: "giˋ doˊ saˇ voi zonˋ loiˇ?"}
      hl: {hanzi: "幾多儕會轉來？", pinyin: "giˊ doˋ sa voi+ zhonˊ loi?"}
    - en: "Come and visit when you're free!"
      sx: {hanzi: "有閒來尞！", pinyin: "iuˊ hanˇ loiˇ liau!"}
      hl: {hanzi: "有閒來尞！", pinyin: "rhiuˋ han loi liau+!"}
    - en: "Grandma asks Sam: are you taking a lunch box?"
      sx: {hanzi: "阿婆問 Sam：你愛帶便當無？", pinyin: "aˊ poˇ mun Sam: nˇ oi dai pien dongˊ moˇ?"}
      hl: {hanzi: "阿婆問 Sam：你愛帶便當無？", pinyin: "a+ po munˇ Sam: ngi oiˇ daiˇ pien+ dongˋ mo?"}
  fill:
    - en: "The mountains, or the sea?"
      sx: {hanzi: "去山，___去海？", pinyin: "hi sanˊ, ___ hi hoiˋ?", answer_hanzi: "還係", answer: "hanˇ he"}
      hl: {hanzi: "去山，___去海？", pinyin: "hiˇ sanˋ, ___ hiˇ hoiˊ?", answer_hanzi: "抑係", answer: "rha+ heˇ"}
    - en: "A-in is coming back on Friday."
      sx: {hanzi: "阿英禮拜五會___。", pinyin: "aˊ inˊ liˊ bai ngˋ voi ___.", answer_hanzi: "轉來", answer: "zonˋ loiˇ"}
      hl: {hanzi: "阿英禮拜五會___。", pinyin: "a+ rhinˋ liˋ baiˇ ngˊ voi+ ___.", answer_hanzi: "轉來", answer: "zhonˊ loi"}
    - en: "Let's go together."
      sx: {hanzi: "𠊎兜___去。", pinyin: "ngaiˇ deuˊ ___ hi.", answer_hanzi: "共下", answer: "kiung ha"}
      hl: {hanzi: "𠊎兜___去。", pinyin: "ngai deuˋ ___ hiˇ.", answer_hanzi: "共下", answer: "kiung+ ha+"}

