exercises:
  translate:
    - en: "Sweet 粄 is very sticky."
      sx: {hanzi: "甜粄當黏。", pinyin: "tiamˇ banˋ dongˊ ngiamˇ."}
      hl: {hanzi: "甜粄當黏。", pinyin: "tiam banˊ dongˋ ngiam."}
    - en: "Every year before the New Year, we sweep the house and put up the couplets."
      sx: {hanzi: "逐年過年前，𫣆兜都會掃屋、貼春聯。", pinyin: "dagˋ ngienˇ go ngienˇ qienˇ, enˊ deuˊ du voi so vugˋ, diabˋ cunˊ lienˇ."}
      hl: {hanzi: "逐年過年前，𫣆兜都會掃屋、貼春聯。", pinyin: "dag ngien goˇ ngien cien, enˋ deuˋ du+ voi+ soˇ vug, dab chunˋ lien."}
      check: true
    - en: "Tomorrow is New Year's Eve."
      sx: {hanzi: "天光日係年三十。", pinyin: "tienˊ gongˊ ngidˋ he ngienˇ samˊ siib."}
      hl: {hanzi: "韶早係年三十。", pinyin: "shau zoˊ heˇ ngien samˋ shibˋ."}
    - en: "Fry the radish cake in the wok."
      sx: {hanzi: "蘿蔔粄放落鑊煎。", pinyin: "loˇ ped banˋ biong log vog jienˊ."}
      hl: {hanzi: "菜頭粄放落鑊煎。", pinyin: "coiˇ teu banˊ biongˇ logˋ vogˋ zienˋ."}
    - en: "Eating radish cake at New Year has become a Hakka custom."
      sx: {hanzi: "過年食蘿蔔粄，係客家人个習俗。", pinyin: "go ngienˇ siid loˇ ped banˋ, he hagˋ gaˊ nginˇ ge xib xiug."}
      hl: {hanzi: "過年食菜頭粄，係客家人个習俗。", pinyin: "goˇ ngien shidˋ coiˇ teu banˊ, heˇ hag gaˋ ngin gaiˇ sibˋ siugˋ."}
    - en: "Rice is used to make 粄."
      sx: {hanzi: "米做得做粄。", pinyin: "miˋ zo dedˋ zo banˋ."}
      hl: {hanzi: "米做得做粄。", pinyin: "miˊ zoˇ ded zoˇ banˊ."}
  fill:
