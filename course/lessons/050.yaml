id: 50
title:
  en: "Making 粄 for the New Year"
  sx: {hanzi: "逐年過年都會打粄", pinyin: "dagˋ ngienˇ go ngienˇ du voi daˋ banˋ"}
  hl: {hanzi: "逐年過年都會打粄", pinyin: "dag ngien goˇ ngien du+ voi+ daˊ banˊ"}
review: false
setting: >-
  Thursday 4 February 2027, the day before New Year's Eve. A-min's school has broken up for the winter holidays. The
  house has been swept from top to bottom, the couplets are waiting to go up, and the kitchen belongs to Grandma and
  Mrs Liu. Sam is summoned.
names: [阿明, 阿英]

dialogue:
  - n: 1
    speaker: 阿姆
    en: "Sam, the couplets are up; now come and give us a hand! Today we're making 粄."
    sx: {hanzi: "Sam，春聯貼好吔，來𢯭手！𫣆兜今晡日愛打粄。", pinyin: "Sam, cunˊ lienˇ diabˋ hoˋ leˊ, loiˇ ten suˋ! enˊ deuˊ gimˊ buˊ ngidˋ oi daˋ banˋ."}
    hl: {hanzi: "Sam，春聯貼好咧，來𢯭手！𫣆兜今晡日愛打粄。", pinyin: "Sam, chunˋ lien dab hoˊ leˋ, loi tenˇ shiuˊ! enˋ deuˋ gimˋ buˋ ngid oiˇ daˊ banˊ."}
  - n: 2
    speaker: Sam
    en: "粄? What kind?"
    sx: {hanzi: "打粄？打麼个粄？", pinyin: "daˋ banˋ? daˋ maˋ ge banˋ?"}
    hl: {hanzi: "打粄？打麼个粄？", pinyin: "daˊ banˊ? daˊ maˊ gaiˇ banˊ?"}
  - n: 3
    speaker: 阿婆
    en: "Sweet 粄, risen 粄 and radish 粄. Every New Year we make them."
    sx: {hanzi: "甜粄、發粄摎蘿蔔粄。逐年過年，𠊎兜都會做。", pinyin: "tiamˇ banˋ, fadˋ banˋ lauˊ loˇ ped banˋ. dagˋ ngienˇ go ngienˇ, ngaiˇ deuˊ du voi zo."}
    hl: {hanzi: "甜粄、發粄摎菜頭粄。逐年過年，𠊎兜都會做。", pinyin: "tiam banˊ, fad banˊ lauˋ coiˇ teu banˊ. dag ngien goˇ ngien, ngai deuˋ du+ voi+ zoˇ."}
  - n: 4
    speaker: Sam
    en: "Why three kinds?"
    sx: {hanzi: "做麼个愛做三種？", pinyin: "zo maˋ ge oi zo samˊ zungˋ?"}
    hl: {hanzi: "做麼个愛做三種？", pinyin: "zoˇ maˊ gaiˇ oiˇ zoˇ samˋ zhungˊ?"}
  - n: 5
    speaker: 阿姆
    en: "You eat sweet 粄 and hope for a sweet New Year. Risen 粄 stands for getting rich. And radish 粄… A-min just loves it."
    sx: {hanzi: "食甜粄，望新年甜甜。發粄表示會發財。蘿蔔粄……阿明盡愛食。", pinyin: "siid tiamˇ banˋ, mong xinˊ ngienˇ tiamˇ tiamˇ. fadˋ banˋ beuˋ sii voi fadˋ coiˇ. loˇ ped banˋ … aˊ minˇ qin oi siid."}
    hl: {hanzi: "食甜粄，望新年甜甜。發粄表示會發財。菜頭粄……阿明最愛食。", pinyin: "shidˋ tiam banˊ, mong+ sinˋ ngien tiam tiam. fad banˊ biauˊ shi+ voi+ fad coi. coiˇ teu banˊ … a+ min zuiˇ oiˇ shidˋ."}
    check: true
  - n: 6
    speaker: 阿明
    en: "Fried radish 粄 smells fantastic!"
    sx: {hanzi: "蘿蔔粄煎來食，當香！", pinyin: "loˇ ped banˋ jienˊ loiˇ siid, dongˊ hiongˊ!"}
    hl: {hanzi: "菜頭粄煎來食，當香！", pinyin: "coiˇ teu banˊ zienˋ loi shidˋ, dongˋ hiongˋ!"}
  - n: 7
    speaker: 阿婆
    en: "Sam, do you know how to make 粄?"
    sx: {hanzi: "Sam，你曉得做粄無？", pinyin: "Sam, nˇ hiauˋ dedˋ zo banˋ moˇ?"}
    hl: {hanzi: "Sam，你曉得做粄無？", pinyin: "Sam, ngi hiauˊ ded zoˇ banˊ mo?"}
  - n: 8
    speaker: Sam
    en: "I don't know how to make it. But I've eaten it!"
    sx: {hanzi: "𠊎毋曉得做。毋過𠊎識食過！", pinyin: "ngaiˇ mˇ hiauˋ dedˋ zo. mˇ go ngaiˇ siidˋ siid go!"}
    hl: {hanzi: "𠊎毋曉得做。毋過𠊎識食過！", pinyin: "ngai m hiauˊ ded zoˇ. m goˇ ngai shid shidˋ goˇ!"}
  - n: 9
    speaker: 阿婆
    en: "Eating it, yes: that Grandma knows. You eat everything!"
    sx: {hanzi: "食，阿婆知。你麼个都食！", pinyin: "siid, aˊ poˇ diˊ. nˇ maˋ ge du siid!"}
    hl: {hanzi: "食，阿婆知。你麼个都食！", pinyin: "shidˋ, a+ po diˋ. ngi maˊ gaiˇ du+ shidˋ!"}
  - n: 10
    speaker: 阿姆
    en: "(pouring rice batter into the steaming tray) Batter in, sugar in… then two hours in the steamer, on the stove."
    sx: {hanzi: "米漿放落去，加糖……在灶頭炊兩點鐘。", pinyin: "miˋ jiongˊ biong log hi, gaˊ tongˇ … coiˊ zo teuˇ coiˊ liongˋ diamˋ zungˊ."}
    hl: {hanzi: "米漿放落去，加糖……在灶頭炊兩點鐘。", pinyin: "miˊ ziongˋ biongˇ logˋ hiˇ, gaˋ tong … coiˋ zoˇ teu chuiˋ liongˊ diamˊ zhungˋ."}
    check: true
  - n: 11
    speaker: 阿婆
    en: "When you make risen 粄, remember to put the leaven in, or it won't rise."
    sx: {hanzi: "打發粄該下，愛記得放發酵，無就毋會發。", pinyin: "daˋ fadˋ banˋ ge ha, oi gi dedˋ biong fadˋ gau, moˇ qiu mˇ voi fadˋ."}
    hl: {hanzi: "打發粄該下，愛記得放發酵，無就毋會發。", pinyin: "daˊ fad banˊ gai ha+, oiˇ giˇ ded biongˇ fad gauˇ, mo ciu+ m voi+ fad."}
  - n: 12
    speaker: 阿明
    en: "(two hours later, hovering) Has it risen?"
    sx: {hanzi: "發吔無？", pinyin: "fadˋ leˊ moˇ?"}
    hl: {hanzi: "發咧無？", pinyin: "fad leˋ mo?"}
  - n: 13
    speaker: 阿姆
    en: "It has! Beautifully! A good sign for the new year. Tomorrow's New Year's Eve: just in time."
    sx: {hanzi: "發吔！當發！新年會發財。天光日係年三十，堵堵好。", pinyin: "fadˋ leˊ! dongˊ fadˋ! xinˊ ngienˇ voi fadˋ coiˇ. tienˊ gongˊ ngidˋ he ngienˇ samˊ siib, duˋ duˋ hoˋ."}
    hl: {hanzi: "發咧！當發！新年會發財。韶早係年三十，堵堵好。", pinyin: "fad leˋ! dongˋ fad! sinˋ ngien voi+ fad coi. shau zoˊ heˇ ngien samˋ shibˋ, duˊ duˊ hoˊ."}
  - n: 14
    speaker: 阿婆
    en: "A-min! No eating on the sly! Sweet 粄 is sticky: it'll stick to your teeth."
    sx: {hanzi: "阿明！莫偷食！甜粄當黏，會黏牙齒。", pinyin: "aˊ minˇ! mog teuˊ siid! tiamˇ banˋ dongˊ ngiamˇ, voi ngiamˇ ngaˇ ciiˋ."}
    hl: {hanzi: "阿明！莫偷食！甜粄當黏，會黏牙齒。", pinyin: "a+ min! mogˋ teuˋ shidˋ! tiam banˊ dongˋ ngiam, voi+ ngiam nga chiˊ."}
  - n: 15
    speaker: 阿明
    en: "(mouth full) I'm not eating on the sly… I'm having a taste!"
    sx: {hanzi: "𠊎無偷食……𠊎在該嗒看啊！", pinyin: "ngaiˇ moˇ teuˊ siid … ngaiˇ du ge dab kon a!"}
    hl: {hanzi: "𠊎無偷食……𠊎在該嗒看啊！", pinyin: "ngai mo teuˋ shidˋ … ngai diˇ gai dabˋ konˇ a+!"}

notes:
  - ref: 0
    topic: method
    text: >
      The second wave starts today. Keep going forward as before, and from now on also go back each day to one early
      lesson, starting with lesson 1: cover the Hakka, read the English, and say the Hakka aloud. Lesson 51 sends you
      back to lesson 2, and so on. What you once only understood, you now produce.
  - ref: 1
    topic: vocab
    text: >
      打粄 "make 粄": 打 (lesson 33) is the everyday verb for making them; 做粄 says the same. 粄 banˋ (lesson 11) covers
      every rice-flour cake and noodle.
  - ref: 3
    topic: grammar
    text: >
      逐年過年…都會做 "every New Year, we make them": 會 for what happens as a rule, a habit, not "will". The official
      example sentence says the same thing: 原在人逐年過年就會挨粄來做甜粄、發粄摎菜頭粄 "people used to grind rice every
      New Year to make sweet, risen and radish 粄". 逐年 "every year", like 逐日 (lesson 17).
  - ref: 5
    topic: culture
    text: >
      Each 粄 carries a wish: 甜粄 for sweetness, 發粄 "risen 粄" for 發財 "getting rich" (過年打發粄，表示會發財, an
      official example). 望 mong "hope for": the official 過年食發粄，望大家今年都有好个發展 "eat risen 粄 at New Year,
      hoping everyone does well this year"; Mrs Liu's line about 甜粄 copies that shape and is marked for a check.
      甜甜 is the AA form of lesson 45. 表示 beuˋ sii "stand for, mean". 阿明盡愛食 "A-min loves it": 盡 is "very" as often
      as "most" (lesson 8), and 愛食 "love to eat" (not 好食, which is "tasty").
  - ref: 7
    topic: grammar
    text: >
      Three "know"s, all in one scene (lessons 9, 17, 26): 曉得做粄 "know how to make 粄" (a skill), 識食過 "have eaten it
      (before)" (識 + V過 is "have ever done", as 毋識講過 is "have never said"), 阿婆知 "Grandma knows (that)" (a fact).
  - ref: 10
    topic: vocab
    text: >
      炊 coiˊ "steam" (also heard cuiˊ; Hailu chuiˋ): 炊粄, the word in every official 粄 sentence; 蒸 is the
      Mandarin-looking alternative.
      米漿 "rice batter", 灶頭 "the stove". The details of Mrs Liu's method are marked for a check.
  - ref: 11
    topic: grammar
    text: >
      An official example word for word: 打發粄該下，愛記得放發酵，無就毋會發. 該下 (lesson 20) "at that time, when": 打發粄該下
      "when you make risen 粄". 無就 "or else, otherwise". 發 fadˋ "rise" (dough), and also "prosper".
  - ref: 14
    topic: vocab
    text: >
      偷食 "eat on the sly": 偷 from 偷偷仔 (lesson 46). A-min's defence uses 嗒看啊 from lesson 36.
  - ref: 0
    topic: hailu
    text: >
      Hailu: 菜頭粄 for 蘿蔔粄 (the dictionary marks 菜頭 as Hailu only), 炊 chuiˋ, 最愛食 for 盡愛食, 韶早 for 天光日.

