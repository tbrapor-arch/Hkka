    - en: "Put the leaven in, or else it won't rise."
      sx: {hanzi: "放發酵，___毋會發。", pinyin: "biong fadˋ gau, ___ mˇ voi fadˋ.", answer_hanzi: "無就", answer: "moˇ qiu"}
      hl: {hanzi: "放發酵，___毋會發。", pinyin: "biongˇ fad gauˇ, ___ m voi+ fad.", answer_hanzi: "無就", answer: "mo ciu+"}
