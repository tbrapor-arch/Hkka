      sx: {hanzi: "___，𫣆兜都會打粄。", pinyin: "___, enˊ deuˊ du voi daˋ banˋ.", answer_hanzi: "逐年", answer: "dagˋ ngienˇ"}
      hl: {hanzi: "___，𫣆兜都會打粄。", pinyin: "___, enˋ deuˋ du+ voi+ daˊ banˊ.", answer_hanzi: "逐年", answer: "dag ngien"}
    - en: "Put the leaven in, or else it won't rise."
      sx: {hanzi: "放發酵，___毋會發。", pinyin: "biong fadˋ gau, ___ mˇ voi fadˋ.", answer_hanzi: "無就", answer: "moˇ qiu"}
      hl: {hanzi: "放發酵，___毋會發。", pinyin: "biongˇ fad gauˇ, ___ m voi+ fad.", answer_hanzi: "無就", answer: "mo ciu+"}
    - en: "I've eaten it (before)."
      sx: {hanzi: "𠊎___食過。", pinyin: "ngaiˇ ___ siid go.", answer_hanzi: "識", answer: "siidˋ"}
      hl: {hanzi: "𠊎___食過。", pinyin: "ngai ___ shidˋ goˇ.", answer_hanzi: "識", answer: "shid"}

