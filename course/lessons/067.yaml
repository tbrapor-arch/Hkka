id: 67
title:
  en: "Wood carving in 三義"
  sx: {hanzi: "你試刻看啊", pinyin: "nˇ cii kadˋ kon a"}
  hl: {hanzi: "你試刻看啊", pinyin: "ngi chiˇ kad konˇ a+"}
review: false
setting: >-
  Sunday 11 April, 三義, half an hour south of Miaoli. A-in has brought Sam and A-min to the old street of carving
  shops. In a workshop that smells of camphor, an old master in an apron is carving a Buddha out of a tree stump, and
  has a spare knife.
names: [阿英, 阿明, 三義]

dialogue:
  - n: 1
    speaker: 阿英
    en: "A whole street of carving shops: that's what 三義 is known for."
    sx: {hanzi: "歸街仔雕刻店係三義盡大个特色。", pinyin: "guiˊ gieˊ eˋ diauˊ kiedˋ diam he samˊ ngi qin tai ge tid sedˋ."}
    hl: {hanzi: "歸街仔雕刻店係三義最大个特色。", pinyin: "guiˋ gaiˋ er diauˋ kad diamˇ heˇ samˋ ngi+ zuiˇ tai+ gaiˇ tidˋ sed."}
    source: moe
  - n: 2
    speaker: Sam
    en: "So many shops! (in the workshop) A Buddha! What wood is this carved from?"
    sx: {hanzi: "恁多店！……一尊佛祖！這係麼个樹做个？", pinyin: "anˋ doˊ diam! … idˋ zunˊ fud zuˋ! iaˋ he maˋ ge su zo ge?"}
    hl: {hanzi: "恁多店！……一尊佛祖！這係麼个樹做个？", pinyin: "anˊ doˋ diamˇ! … rhid zunˋ fudˋ zuˊ! liaˊ heˇ maˊ gaiˇ shu+ zoˇ gaiˇ?"}
  - n: 3
    speaker: 師傅
    en: "Camphor. The stump of a camphor tree is good for carving."
    sx: {hanzi: "樟樹。樟樹个樹頭做得拿來雕刻。", pinyin: "zongˊ su. zongˊ su ge su teuˇ zo dedˋ naˊ loiˇ diauˊ kiedˋ."}
    hl: {hanzi: "樟樹。樟樹个樹頭做得拿來雕刻。", pinyin: "zhongˋ shu+. zhongˋ shu+ gaiˇ shu+ teu zoˇ ded naˋ loi diauˋ kad."}
  - n: 4
    speaker: 阿明
    en: "Master, can he have a go at carving?"
    sx: {hanzi: "師傅，佢做得刻看啊無？", pinyin: "siiˊ fu, giˇ zo dedˋ kadˋ kon a moˇ?"}
    hl: {hanzi: "師傅，佢做得刻看啊無？", pinyin: "siiˋ fu+, gi zoˇ ded kad konˇ a+ mo?"}
  - n: 5
    speaker: 師傅
    en: "Try it. Be careful with the knife: don't let it cut you."
    sx: {hanzi: "你試刻看啊。刀仔愛細義，莫分刀仔割著。", pinyin: "nˇ cii kadˋ kon a. doˊ eˋ oi se ngi, mog bunˊ doˊ eˋ godˋ doˋ."}
    hl: {hanzi: "你試刻看啊。刀仔愛細義，莫分刀仔割著。", pinyin: "ngi chiˇ kad konˇ a+. doˋ er oiˇ seˇ ngi+, mogˋ bunˋ doˋ er god doˊ."}
  - n: 6
    speaker: Sam
    en: "(ten minutes later) Camphor is hard. It's not easy to carve."
    sx: {hanzi: "樟樹當硬，毋好刻。", pinyin: "zongˊ su dongˊ ngang, mˇ hoˋ kadˋ."}
    hl: {hanzi: "樟樹當硬，毋好刻。", pinyin: "zhongˋ shu+ dongˋ ngang+, m hoˊ kad."}
  - n: 7
    speaker: 師傅
    en: "Everyone's like that at the start. Learn three years from an old master, and the day you set up on your own, you're famous."
    sx: {hanzi: "一開始都恁樣。跈老師傅學三年，一出山就出名了。", pinyin: "idˋ koiˊ ciiˋ du anˋ ngiongˇ. tenˇ loˋ siiˊ fu hog samˊ ngienˇ, idˋ cudˋ sanˊ qiu cudˋ miangˇ leˊ."}
    hl: {hanzi: "一開始都恁樣。跈老師傅學三年，一出山就出名了。", pinyin: "rhid koiˋ shiˊ du+ an ngiong. ten loˊ siiˋ fu+ hogˋ samˋ ngien, rhid chud sanˋ ciu+ chud miang leˋ."}
  - n: 8
    speaker: 師傅
    en: "(an hour later) What's that you've carved?"
    sx: {hanzi: "你刻个係麼个？", pinyin: "nˇ kadˋ ge he maˋ ge?"}
    hl: {hanzi: "你刻个係麼个？", pinyin: "ngi kad gaiˇ heˇ maˊ gaiˇ?"}
  - n: 9
    speaker: Sam
    en: "A bird… for Grandma."
    sx: {hanzi: "一隻鳥仔……分阿婆个。", pinyin: "idˋ zagˋ diauˊ eˋ … bunˊ aˊ poˇ ge."}
    hl: {hanzi: "一隻鳥仔……分阿婆个。", pinyin: "rhid zhag diauˋ er … bunˋ a+ po gaiˇ."}
  - n: 10
    speaker: 阿明
    en: "A bird? It looks like a chicken!"
    sx: {hanzi: "鳥仔？看起來像一隻雞仔！", pinyin: "diauˊ eˋ? kon hiˋ loiˇ qiong idˋ zagˋ gieˊ eˋ!"}
    hl: {hanzi: "鳥仔？看起來像一隻雞仔！", pinyin: "diauˋ er? konˇ hiˊ loi ciongˇ rhid zhag gaiˋ er!"}
  - n: 11
    speaker: 師傅
    en: "For a first go, it's not bad at all."
    sx: {hanzi: "頭一擺刻，會做得了。", pinyin: "teuˇ idˋ baiˋ kadˋ, voi zo dedˋ leˊ."}
    hl: {hanzi: "頭一擺刻，會做得了。", pinyin: "teu rhid baiˊ kad, voi+ zoˇ ded leˋ."}
  - n: 12
    speaker: 阿英
    en: "Grandma's bound to be pleased. It's your first piece of work."
    sx: {hanzi: "阿婆定著會歡喜。這係你頭一件作品。", pinyin: "aˊ poˇ tin cog voi fonˊ hiˋ. iaˋ he nˇ teuˇ idˋ kien zogˋ pinˋ."}
    hl: {hanzi: "阿婆定著會歡喜。這係你頭一件作品。", pinyin: "a+ po tin+ chogˋ voi+ fonˋ hiˊ. liaˊ heˇ ngi teu rhid kien+ zog pinˊ."}
    check: true
  - n: 13
    speaker: Sam
    en: "A-in, would you like one? I'll carve another for you."
    sx: {hanzi: "阿英，你愛無？𠊎再刻一隻分你。", pinyin: "aˊ inˊ, nˇ oi moˇ? ngaiˇ zai kadˋ idˋ zagˋ bunˊ nˇ."}
    hl: {hanzi: "阿英，你愛無？𠊎再刻一隻分你。", pinyin: "a+ rhinˋ, ngi oiˇ mo? ngai zaiˇ kad rhid zhag bunˋ ngi."}
  - n: 14
    speaker: 阿英
    en: "(smiling) A bird, then. Not one that looks like a chicken."
    sx: {hanzi: "刻一隻鳥仔，莫刻到像雞仔。", pinyin: "kadˋ idˋ zagˋ diauˊ eˋ, mog kadˋ do qiong gieˊ eˋ."}
    hl: {hanzi: "刻一隻鳥仔，莫刻到像雞仔。", pinyin: "kad rhid zhag diauˋ er, mogˋ kad doˇ ciongˇ gaiˋ er."}

notes:
  - ref: 1
    topic: culture
    text: >
      三義 is the woodcarving town of Miaoli county; the official examples say so twice (歸街仔雕刻店係三義盡大个特色,
      苗栗三義个木雕產業，聞名全國). A-in quotes the first one (the Sixian line is the official one; the Hailu line is the course's). 盡 here is
      "most" (the word lists give Sixian 盡 as 最…, and Hailu uses 最 for it). 歸街仔 "the whole
      street": 歸 "whole" (lesson 57) + 街 (lesson 54).
  - ref: 3
    topic: vocab
    text: >
      樟樹 zongˊ su "camphor tree", the tree of the Hakka hills: 樟樹做得焗腦 "camphor trees can be distilled for camphor" (official). 樹頭 su teuˇ "tree
      stump, the base of a tree". The line follows an official example: 樟樹个樹頭做得拿來雕刻.
  - ref: 4
    topic: grammar
    text: >
      刻看啊 "have a go at carving" and 試刻看啊 (line 5) "try carving": the V看啊 and 試V看啊 of lesson 36, now with a new
      verb. 刻 kadˋ "carve" (also "scold"); 雕刻 diauˊ kiedˋ is the noun and the formal verb.
  - ref: 6
    topic: grammar
    text: >
      毋好刻 "not easy to carve": 好 hoˋ + verb is "easy to…" (lesson 59: 好食, 好做), and 毋好 + verb its opposite. An
      official example: 竹簡當重又毋好刻字 "bamboo slips were heavy and hard to write on"; and 當毋好行 "very hard going (to
      walk)". Don't confuse it with 毋好 "don't"
      (lesson 12): 毋好刻！ alone would be "don't carve!". 硬 ngang "hard", 軟 ngionˊ "soft".
  - ref: 7
    topic: grammar
    text: >
      The master's line is an official sentence (跈老師傅學三年，一出山就出名了). 一…就… "as soon as…, then…"; 出山
      "leave the mountain", here "finish the apprenticeship, set up on your own"; 出名 "become famous". 一開始 "at the start" (lesson 58);
      not 頭先, which is only "a moment ago".
  - ref: 11
    topic: grammar
    text: >
      會做得 voi zo dedˋ "not bad, quite good": 生理會做得 "business is not bad" (official, in both accents); with 了,
      "it's coming along". The syllabus form 會做得仔 has no example with 仔. Beware 還好: in Hakka 還 + adjective is
      "very", not the Mandarin "so-so": 阿姆這擺包个粽仔還好食 "the 粽 Mum made this time are really good". 頭一擺
      (lesson 52) "the first time". 一件作品 (line 12) "a piece of work".

