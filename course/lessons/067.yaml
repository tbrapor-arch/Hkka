      sx: {hanzi: "___刻。", pinyin: "___ kadˋ.", answer_hanzi: "毋好", answer: "mˇ hoˋ"}
      hl: {hanzi: "___刻。", pinyin: "___ kad.", answer_hanzi: "毋好", answer: "m hoˊ"}
    - en: "Not bad, quite good."
      sx: {hanzi: "___了。", pinyin: "___ leˊ.", answer_hanzi: "會做得", answer: "voi zo dedˋ"}
