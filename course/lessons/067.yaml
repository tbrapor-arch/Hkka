exercises:
  translate:
    - en: "This statue of the earth god was carved by an old master."
      sx: {hanzi: "這尊伯公係老師傅刻个。", pinyin: "iaˋ zunˊ bagˋ gungˊ he loˋ siiˊ fu kadˋ ge."}
      hl: {hanzi: "這尊伯公係老師傅刻个。", pinyin: "liaˊ zunˋ bag gungˋ heˇ loˊ siiˋ fu+ kad gaiˇ."}
    - en: "This piece is very fine to look at, but it's expensive."
      sx: {hanzi: "這件作品當好看，毋過當貴。", pinyin: "iaˋ kien zogˋ pinˋ dongˊ hoˋ kon, mˇ go dongˊ gui."}
      hl: {hanzi: "這件作品當好看，毋過當貴。", pinyin: "liaˊ kien+ zog pinˊ dongˋ hoˊ konˇ, m goˇ dongˋ guiˇ."}
    - en: "This kind of wood is soft; it's easy to carve."
      sx: {hanzi: "這種木材當軟，當好刻。", pinyin: "iaˋ zungˋ mugˋ caiˇ dongˊ ngionˊ, dongˊ hoˋ kadˋ."}
      hl: {hanzi: "這種木材當軟，當好刻。", pinyin: "liaˊ zhungˊ mug cai dongˋ ngionˋ, dongˋ hoˊ kad."}
      check: true
    - en: "The master's craftsmanship is very good: his Buddhas are famous."
      sx: {hanzi: "師傅个手藝當好，佢刻个佛祖當出名。", pinyin: "siiˊ fu ge suˋ ngi dongˊ hoˋ, giˇ kadˋ ge fud zuˋ dongˊ cudˋ miangˇ."}
      hl: {hanzi: "師傅个手藝當好，佢刻个佛祖當出名。", pinyin: "siiˋ fu+ gaiˇ shiuˊ ngi+ dongˋ hoˊ, gi kad gaiˇ fudˋ zuˊ dongˋ chud miang."}
    - en: "三義's carving is art."
      sx: {hanzi: "三義个雕刻係藝術。", pinyin: "samˊ ngi ge diauˊ kiedˋ he ngi sud."}
      hl: {hanzi: "三義个雕刻係藝術。", pinyin: "samˋ ngi+ gaiˇ diauˋ kad heˇ ngi+ sudˋ."}
    - en: "The chickens are under the tree; the birds are in the tree."
      sx: {hanzi: "雞仔在樹下背，鳥仔在樹項。", pinyin: "gieˊ eˋ coiˊ su haˊ boi, diauˊ eˋ coiˊ su hong."}
      hl: {hanzi: "雞仔在樹下背，鳥仔在樹項。", pinyin: "gaiˋ er coiˋ shu+ haˋ boiˇ, diauˋ er coiˋ shu+ hong+."}
