id: 87
title:
  en: "Eight-tone music"
  sx: {hanzi: "客家个八音", pinyin: "hagˋ gaˊ ge badˋ imˊ"}
  hl: {hanzi: "客家个八音", pinyin: "hag gaˋ gaiˇ bad rhimˋ"}
review: false
setting: >-
  Saturday 24 July, after dinner. Grandpa's old friend 阿貴伯 leads a small 八音 band, and they are rehearsing in front
  of the temple for the 義民 festival next month. A-min has been sent to fetch Grandpa; Sam comes along.
names: [阿貴伯, 阿劉哥, 阿德, 銅鑼, 義民, 阿明]

dialogue:
  - n: 1
    speaker: 阿明
    en: "Grandpa, 阿貴伯 says their 八音 band is practising in front of the temple, and he's asking you to come and listen."
    sx: {hanzi: "阿公，阿貴伯講，佢兜个八音團在廟前練習，喊你去聽。", pinyin: "aˊ gungˊ, aˊ gui bagˋ gongˋ, giˇ deuˊ ge badˋ imˊ tonˇ coiˊ meu qienˇ lien xib, ham nˇ hi tangˊ."}
    hl: {hanzi: "阿公，阿貴伯講，佢兜个八音團在廟前練習，喊你去聽。", pinyin: "a+ gungˋ, a+ guiˇ bag gongˊ, gi deuˋ gaiˇ bad rhimˋ ton coiˋ miau+ cien lien+ sibˋ, hamˇ ngi hiˇ tangˋ."}
  - n: 2
    speaker: 阿公
    en: "Right."
    sx: {hanzi: "好。", pinyin: "hoˋ."}
    hl: {hanzi: "好。", pinyin: "hoˊ."}
  - n: 3
    speaker: 阿貴伯
    en: "(at the temple, putting down his drumsticks) 阿劉哥, you've only just got here! We've only just started."
    sx: {hanzi: "阿劉哥，你正來啊到！𠊎兜正開始。", pinyin: "aˊ liuˇ goˊ, nˇ zang loiˇ a do! ngaiˇ deuˊ zang koiˊ ciiˋ."}
    hl: {hanzi: "阿劉哥，你正來啊到！𠊎兜正開始。", pinyin: "a+ liu goˋ, ngi zhangˇ loi a+ doˇ! ngai deuˋ zhangˇ koiˋ shiˊ."}
  - n: 4
    speaker: Sam
    en: "So this is 八音?"
    sx: {hanzi: "這就係八音？", pinyin: "iaˋ qiu he badˋ imˊ?"}
    hl: {hanzi: "這就係八音？", pinyin: "liaˊ ciu+ heˇ bad rhimˋ?"}
  - n: 5
    speaker: 阿貴伯
    en: "It is. The traditional music of the Hakka is 八音."
    sx: {hanzi: "係啊。客家个傳統音樂就係八音。", pinyin: "he a. hagˋ gaˊ ge conˇ tungˋ imˊ ngog qiu he badˋ imˊ."}
    hl: {hanzi: "係啊。客家个傳統音樂斯係八音。", pinyin: "heˇ a+. hag gaˋ gaiˇ chon tungˊ rhimˋ ngogˋ sii+ heˇ bad rhimˋ."}
  - n: 6
    speaker: Sam
    en: "And what instruments are these?"
    sx: {hanzi: "這兜係麼个樂器？", pinyin: "iaˋ deuˊ he maˋ ge ngog hi?"}
    hl: {hanzi: "這兜係麼个樂器？", pinyin: "liaˊ deuˋ heˇ maˊ gaiˇ ngogˋ hiˇ?"}
  - n: 7
    speaker: 阿貴伯
    en: "This is the 笛仔: you blow it, and it's loud. That's the fiddle: 阿德 is bowing it. And there's the drum and the gong."
    sx: {hanzi: "這係笛仔，吹起來當大聲。該係弦仔，阿德在該鋸弦仔。還有鼓同銅鑼。", pinyin: "iaˋ he tag eˋ, coiˊ hiˋ loiˇ dongˊ tai sangˊ. ge he hienˇ eˋ, aˊ dedˋ du ge gi hienˇ eˋ. hanˇ iuˊ guˋ tungˇ tungˇ loˇ."}
    hl: {hanzi: "這係笛仔，歕起來當大聲。該係弦仔，阿德在該挨弦仔。還有鼓摎銅鑼。", pinyin: "liaˊ heˇ tagˋ er, pun hiˊ loi dongˋ tai+ shangˋ. gai heˇ hien er, a+ ded diˇ gai aiˋ hien er. han rhiuˋ guˊ lauˋ tung lo."}
  - n: 8
    speaker: Sam
    en: "銅鑼? Like the town of 銅鑼, where the museum is?"
    sx: {hanzi: "銅鑼？同博物館該隻銅鑼共樣？", pinyin: "tungˇ loˇ? tungˇ bogˋ vud gonˋ ge zagˋ tungˇ loˇ kiung iong?"}
    hl: {hanzi: "銅鑼？摎博物館該隻銅鑼共樣？", pinyin: "tung lo? lauˋ bog vudˋ gonˊ gai zhag tung lo kiung+ rhong+?"}
  - n: 9
    speaker: 阿明
    en: "Same word! Gong your 銅鑼 too loud and your ears hurt, and you'll disturb other people."
    sx: {hanzi: "共樣个字！打銅鑼打到恁大聲，耳公會痛，會吵著別儕人。", pinyin: "kiung iong ge sii! daˋ tungˇ loˇ daˋ do anˋ tai sangˊ, ngiˋ gungˊ voi tung, voi cauˇ doˋ ped saˇ nginˇ."}
    hl: {hanzi: "共樣个字！打銅鑼打到恁大聲，耳空會痛，會吵著別儕人。", pinyin: "kiung+ rhong+ gaiˇ sii+! daˊ tung lo daˊ doˇ anˊ tai+ shangˋ, ngiˊ kungˋ voi+ tungˇ, voi+ cau doˊ pedˋ sa ngin."}
  - n: 10
    speaker: Sam
    en: "(as the band starts again, Grandpa murmurs something) What did Grandpa say?"
    sx: {hanzi: "阿公講麼个？", pinyin: "aˊ gungˊ gongˋ maˋ ge?"}
    hl: {hanzi: "阿公講麼个？", pinyin: "a+ gungˋ gongˊ maˊ gaiˇ?"}
  - n: 11
    speaker: 阿明
    en: "Grandpa says that in the old days he played the fiddle too, every so often. But only the fiddle."
    sx: {hanzi: "阿公講，頭擺佢三不五時乜會鋸弦仔。毋過佢單淨會鋸弦仔。", pinyin: "aˊ gungˊ gongˋ, teuˇ baiˋ giˇ samˊ budˋ ngˋ siiˇ me voi gi hienˇ eˋ. mˇ go giˇ danˊ qiang voi gi hienˇ eˋ."}
    hl: {hanzi: "阿公講，頭擺佢三不五時乜會挨弦仔。毋過佢單淨會挨弦仔。", pinyin: "a+ gungˋ gongˊ, teu baiˊ gi samˋ bud ngˊ shi meˇ voi+ aiˋ hien er. m goˇ gi danˋ ciang+ voi+ aiˋ hien er."}
  - n: 12
    speaker: 阿貴伯
    en: "That's right! Your grandpa was a fine fiddler when he was young. Here, have a go."
    sx: {hanzi: "係啊！你阿公後生个時節，鋸弦仔當會！來，你試看啊。", pinyin: "he a! nˇ aˊ gungˊ heu sangˊ ge siiˇ jiedˋ, gi hienˇ eˋ dongˊ voi! loiˇ, nˇ cii kon a."}
    hl: {hanzi: "係啊！你阿公後生个時節，挨弦仔當會！來，你試看啊。", pinyin: "heˇ a+! ngi a+ gungˋ heu+ sangˋ gaiˇ shi zied, aiˋ hien er dongˋ voi+! loi, ngi chiˇ konˇ a+."}
  - n: 13
    speaker: 阿公
    en: "(after a few notes, looking at his fingers) My hands have gone stiff."
    sx: {hanzi: "手硬了。", pinyin: "suˋ ngang leˊ."}
    hl: {hanzi: "手硬了。", pinyin: "shiuˊ ngang+ leˋ."}
  - n: 14
    speaker: 阿貴伯
    en: "A bit of practice and they'll loosen up. At the 義民 festival, come and play with us!"
    sx: {hanzi: "練一下就好了。義民節，你來同𠊎兜共下鋸！", pinyin: "lien idˋ ha qiu hoˋ leˊ. ngi minˇ jiedˋ, nˇ loiˇ tungˇ ngaiˇ deuˊ kiung ha gi!"}
    hl: {hanzi: "練一下就好了。義民節，你來摎𠊎兜共下挨！", pinyin: "lien+ rhid ha+ ciu+ hoˊ leˋ. ngi+ min zied, ngi loi lauˋ ngai deuˋ kiung+ ha+ aiˋ!"}
  - n: 15
    speaker: 阿公
    en: "…I'll come once I've practised it properly."
    sx: {hanzi: "……愛練好正來。", pinyin: "… oi lien hoˋ zang loiˇ."}
    hl: {hanzi: "……愛練好正來。", pinyin: "… oiˇ lien+ hoˊ zhangˇ loi."}
  - n: 16
    speaker: Sam
    en: "(whispering to A-min) Get Grandpa talking about the fiddle and he has plenty to say!"
    sx: {hanzi: "阿公講著弦仔就有話講！", pinyin: "aˊ gungˊ gongˋ doˋ hienˇ eˋ qiu iuˊ fa gongˋ!"}
    hl: {hanzi: "阿公講著弦仔就有話講！", pinyin: "a+ gungˋ gongˊ doˊ hien er ciu+ rhiuˋ faˇ gongˊ!"}
  - n: 17
    speaker: 阿貴伯
    en: "(who heard) With your grandpa, our band will be complete!"
    sx: {hanzi: "你阿公來，𠊎兜个八音團就齊全了！", pinyin: "nˇ aˊ gungˊ loiˇ, ngaiˇ deuˊ ge badˋ imˊ tonˇ qiu ceˇ qionˇ leˊ!"}
    hl: {hanzi: "你阿公來，𠊎兜个八音團就齊全了！", pinyin: "ngi a+ gungˋ loi, ngai deuˋ gaiˇ bad rhimˋ ton ciu+ ce cion leˋ!"}
  - n: 18
    speaker: 阿明
    en: "阿貴伯 beats the drum and leads, Grandpa plays the fiddle… and Sam strikes the gong!"
    sx: {hanzi: "阿貴伯帶頭打鼓又指揮，阿公鋸弦仔……Sam 打銅鑼！", pinyin: "aˊ gui bagˋ dai teuˇ daˋ guˋ iu ziiˋ fiˊ, aˊ gungˊ gi hienˇ eˋ … Sam daˋ tungˇ loˇ!"}
    hl: {hanzi: "阿貴伯帶頭打鼓又指揮，阿公挨弦仔……Sam 打銅鑼！", pinyin: "a+ guiˇ bag daiˇ teu daˊ guˊ rhiu+ zhiˊ fuiˋ, a+ gungˋ aiˋ hien er … Sam daˊ tung lo!"}
    check: true

notes:
  - ref: 1
    topic: grammar
    text: >
      Reported speech has no special form: 阿貴伯講，佢兜…, 喊你去聽 "阿貴伯 says their band… (and) he's asking you to come
      and listen". The 佢 inside is 阿貴伯's 𠊎, turned round as in English. Line 11 does the same with Grandpa's words.
      八音團 "八音 band": 團 tonˇ "group, troupe".
  - ref: 3
    topic: grammar
    text: >
      正 zang before a verb has two jobs. "Just (now)": 你正來啊到 "you've only just got here" (official, both accents:
      你正來啊到，凳仔就吂坐燒… "you've only just arrived, you haven't even warmed the stool…"), 𠊎兜正開始 "we've only
      just started" (another official example: 正落過水﹝雨﹞，這條路㕸㕸涉涉，當毋好行 "it has only just rained, the road is
      muddy and hard going"). "Only then" after a condition, as since lesson 24: 愛練好正來 (line 15) "only when I've
      practised properly will I come".
  - ref: 5
    topic: culture
    text: >
      An official sentence, in both accents: Sixian 客家个傳統音樂就係八音, Hailu 客家个傳統音樂斯係八音 (with Hailu 斯 for 就).
      By general knowledge, a 八音 band plays at weddings, festivals and temple rites, with wind, strings and
      percussion; the name is older than any count of the instruments.
  - ref: 7
    topic: vocab
    text: >
      The verbs go with the instruments, and here the accents differ. For the 笛仔 (the shawm, glossed 嗩吶), the Sixian
      examples say 吹 coiˊ (老了正學吹笛仔), and 歕 pun appears in the Hailu version of the same sentence; so Sixian
      吹笛仔, Hailu 歕笛仔. For the fiddle, Sixian says 鋸 gi "saw" (逐日朝晨都有老人家在公園肚鋸弦仔), while the parallel
      sentences give Hailu 挨 aiˋ: Sixian 你鋸弦仔，佢和山歌 / Hailu 你挨弦仔，佢和山歌 (and the Hailu official sentence 𠊎姨丈仔當會挨弦仔, adapted in the exercises); there is no
      Hailu 鋸弦. In the exercise, 和 foˇ (lesson 48, "make up") is "sing along to": 佢和山歌. The drum and gong take 打 in both (打鼓, 打銅鑼). 弦仔 hienˇ eˋ "fiddle", 鼓 guˋ "drum".
  - ref: 9
    topic: vocab
    text: >
      The town 銅鑼 and the gong 銅鑼 are the same word: "brass gong". A-min's warning is an official sentence word for
      word (打銅鑼打到恁大聲，會吵著別儕人); its Hailu line is the course's transposition. 別儕人 ped saˇ nginˇ "other people"
      (Hailu 別儕). Official sentences in this lesson's exercises are Sixian only unless the note says otherwise (the
      國樂團 one exists in both accents); the other Hailu lines are the course's transposition.
  - ref: 11
    topic: grammar
    text: >
      單淨 danˊ qiang "only, merely" before the verb: 佢單淨會鋸弦仔 is borrowed from an official sentence (在恁多樂器裡肚，佢單淨
      會鋸弦仔 "of all those instruments, the only one he can play is the fiddle"). Compare 定定 (lesson 26), which goes at
      the end: 佢會鋸弦仔定定.
  - ref: 13
    topic: grammar
    text: >
      手硬了 "my hands have gone stiff": 了 for the change of state (lesson 9). Grandpa sang every day in the tea garden in
      his youth (lesson 20) but refused to sing for the family until lesson 37; now it turns out he played too.

