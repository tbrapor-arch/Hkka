exercises:
  translate:
    - en: "No wonder he can't bear to leave: the Lius are his home."
      sx: {hanzi: "難怪佢毋盼得走：劉家係佢屋下。", pinyin: "nanˇ guai giˇ mˇ pan dedˋ zeuˋ: liuˇ gaˊ he giˇ vugˋ kaˊ."}
      hl: {hanzi: "難怪佢毋盼得走：劉家係佢屋下。", pinyin: "nan guaiˇ gi m panˇ ded zeuˊ: liu gaˋ heˇ gi vug haˋ."}
    - en: "Since he came to Miaoli, his Hakka has made a lot of progress."
      sx: {hanzi: "自從佢來苗栗，佢个客話進步當多。", pinyin: "cii qiungˇ giˇ loiˇ meuˇ lid, giˇ ge hagˋ fa jin pu dongˊ doˊ."}
      hl: {hanzi: "自從佢來苗栗，佢个客話進步當多。", pinyin: "cii+ ciung gi loi miau lidˋ, gi gaiˇ hag voiˋ zinˇ pu+ dongˋ doˋ."}
    - en: "Eat your bowl clean, and the year will be good."
      sx: {hanzi: "食空空，好年冬。", pinyin: "siid kungˊ kungˊ, hoˋ ngienˇ dungˊ."}
      hl: {hanzi: "食空空，好年冬。", pinyin: "shidˋ kungˋ kungˋ, hoˊ ngien dungˋ."}
    - en: "Grandpa remembers things from fifty years ago very clearly."
      sx: {hanzi: "阿公五十年前个事情都記到清清楚楚。", pinyin: "aˊ gungˊ ngˋ siib ngienˇ qienˇ ge sii qinˇ du gi do qinˊ qinˊ cuˋ cuˋ."}
      hl: {hanzi: "阿公五十年前个事情都記到清清楚楚。", pinyin: "a+ gungˋ ngˊ shibˋ ngien cien gaiˇ sii+ cin du+ giˇ doˇ cinˋ cinˋ cuˊ cuˊ."}
    - en: "In about ten minutes the train sets off."
      sx: {hanzi: "再過十分鐘左右，火車就出發了。", pinyin: "zai go siib funˊ zungˊ zoˋ iu, foˋ caˊ qiu cudˋ fadˋ leˊ."}
      hl: {hanzi: "再過十分鐘左右，火車就出發了。", pinyin: "zaiˇ goˇ shibˋ funˋ zhungˋ zoˊ rhiu+, foˊ chaˋ ciu+ chud fad leˋ."}
  fill:
    - en: "A rice steamer on New Year's Eve: never a moment's rest."
      sx: {hanzi: "三十暗晡个飯甑：___。", pinyin: "samˊ siib am buˊ ge fan zen: ___.", answer_hanzi: "無閒", answer: "moˇ hanˇ"}
      hl: {hanzi: "三十暗晡个飯甑：___。", pinyin: "samˋ shibˋ amˇ buˋ gaiˇ pon+ zenˇ: ___.", answer_hanzi: "無閒", answer: "mo han"}
    - en: "At last he's arrived."
      sx: {hanzi: "佢___到了。", pinyin: "giˇ ___ do leˊ.", answer_hanzi: "總算", answer: "zungˋ son"}
      hl: {hanzi: "佢___到了。", pinyin: "gi ___ doˇ leˋ.", answer_hanzi: "總算", answer: "zungˊ sonˇ"}
    - en: "Keep in touch every week."
      sx: {hanzi: "逐禮拜愛___。", pinyin: "dagˋ liˊ bai oi ___.", answer_hanzi: "聯絡", answer: "lienˇ log"}
      hl: {hanzi: "逐禮拜愛___。", pinyin: "dag liˋ baiˇ oiˇ ___.", answer_hanzi: "聯絡", answer: "lien logˋ"}

