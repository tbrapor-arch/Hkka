exercises:
  translate:
    - en: "The sports day started this morning; lots of people came."
      sx: {hanzi: "運動會今晡日朝晨正式開始，當多人來參加。", pinyin: "iun tung fi gimˊ buˊ ngidˋ zeuˊ siinˇ ziin siidˋ koiˊ ciiˋ, dongˊ doˊ nginˇ loiˇ camˊ gaˊ."}
      hl: {hanzi: "運動會今晡日朝晨正式開始，當多人來參加。", pinyin: "rhun+ tung+ fui+ gimˋ buˋ ngid zhauˋ shin zhinˇ shid koiˋ shiˊ, dongˋ doˋ ngin loi camˋ gaˋ."}
      source: moe
    - en: "Let's race and see who's faster; the loser buys dinner."
      sx: {hanzi: "𫣆兜來走相逐，看麼人走較遽，輸个人愛請食飯。", pinyin: "enˊ deuˊ loiˇ zeuˋ xiongˊ giugˋ, kon maˋ nginˇ zeuˋ ka giagˋ, suˊ ge nginˇ oi qiangˋ siid fan."}
      hl: {hanzi: "𫣆兜來走追仔，看麼人走較遽，輸个人愛請食飯。", pinyin: "enˋ deuˋ loi zeuˊ duiˋ er, konˇ maˊ ngin zeuˊ haˇ giag, shuˋ gaiˇ ngin oiˇ ciangˊ shidˋ pon+."}
    - en: "The athletes jumped over the finishing line."
      sx: {hanzi: "選手跳過終點。", pinyin: "xienˋ suˋ tiau go zungˊ diamˋ."}
      hl: {hanzi: "選手跳過終點。", pinyin: "sienˊ shiuˊ tiauˇ goˇ zhungˋ diamˊ."}
      check: true
    - en: "Is Grandma taller than Grandpa? — No, Grandpa is taller."
      sx: {hanzi: "阿婆比阿公較高無？——無，阿公較高。", pinyin: "aˊ poˇ biˋ aˊ gungˊ ka goˊ moˇ? — moˇ, aˊ gungˊ ka goˊ."}
      hl: {hanzi: "阿婆比阿公較高無？——無，阿公較高。", pinyin: "a+ po biˊ a+ gungˋ haˇ goˋ mo? — mo, a+ gungˋ haˇ goˋ."}
    - en: "A-min's team trained hard every day, so they won."
      sx: {hanzi: "阿明个隊逐日當煞猛練習，故所贏了。", pinyin: "aˊ minˇ ge cui dagˋ ngidˋ dongˊ sadˋ mangˊ lien xib, gu soˋ iangˇ leˊ."}
      hl: {hanzi: "阿明个隊逐日當煞猛練習，所以贏了。", pinyin: "a+ min gaiˇ chui+ dag ngid dongˋ sad mangˋ lien+ sibˋ, soˊ rhiˋ rhang leˋ."}
    - en: "A-min plays ball every day."
      sx: {hanzi: "阿明逐日打球。", pinyin: "aˊ minˇ dagˋ ngidˋ daˋ kiuˇ."}
      hl: {hanzi: "阿明逐日打球。", pinyin: "a+ min dag ngid daˊ kiu."}
