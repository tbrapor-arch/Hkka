id: 66
title:
  en: "A-min's sports day"
  sx: {hanzi: "佢比𠊎較高", pinyin: "giˇ biˋ ngaiˇ ka goˊ"}
  hl: {hanzi: "佢比𠊎較高", pinyin: "gi biˊ ngai haˇ goˋ"}
review: false
setting: >-
  Saturday 10 April, A-min's junior high school sports day. The whole family is in the stands, A-in included, with
  Grandma's flask of tea and a bag of oranges. A-min has one rival this year: his classmate 阿宏.
names: [阿英, 阿明, 阿宏]

dialogue:
  - n: 1
    speaker: 阿明
    en: "Today's race at the sports day: I've got to beat 阿宏."
    sx: {hanzi: "今晡日運動會个走相逐，𠊎定著愛贏阿宏。", pinyin: "gimˊ buˊ ngidˋ iun tung fi ge zeuˋ xiongˊ giugˋ, ngaiˇ tin cog oi iangˇ aˊ fenˇ."}
    hl: {hanzi: "今晡日運動會个走追仔，𠊎定著愛贏阿宏。", pinyin: "gimˋ buˋ ngid rhun+ tung+ fui+ gaiˇ zeuˊ duiˋ er, ngai tin+ chogˋ oiˇ rhang a+ fen."}
  - n: 2
    speaker: Sam
    en: "Who's 阿宏?"
    sx: {hanzi: "阿宏係麼人？", pinyin: "aˊ fenˇ he maˋ nginˇ?"}
    hl: {hanzi: "阿宏係麼人？", pinyin: "a+ fen heˇ maˊ ngin?"}
  - n: 3
    speaker: 阿明
    en: "A classmate. He's taller than me, and his legs are longer."
    sx: {hanzi: "𠊎同班个同學。佢比𠊎較高，腳乜較長。", pinyin: "ngaiˇ tungˇ banˊ ge tungˇ hog. giˇ biˋ ngaiˇ ka goˊ, giogˋ me ka congˇ."}
    hl: {hanzi: "𠊎同班个同學。佢比𠊎較高，腳乜較長。", pinyin: "ngai tung banˋ gaiˇ tung hogˋ. gi biˊ ngai haˇ goˋ, giog meˇ haˇ chong."}
  - n: 4
    speaker: 阿英
    en: "How many centimetres have you grown this year?"
    sx: {hanzi: "你今年高加幾多公分？", pinyin: "nˇ gimˊ ngienˇ goˊ gaˊ giˋ doˊ gungˊ funˊ?"}
    hl: {hanzi: "你今年高加幾多公分？", pinyin: "ngi gimˋ ngien goˋ gaˋ giˊ doˋ gungˋ funˋ?"}
    source: kaga
  - n: 5
    speaker: 阿明
    en: "Five centimetres! But 阿宏 is still a bit taller than me."
    sx: {hanzi: "五公分！毋過阿宏還係比𠊎高一息仔。", pinyin: "ngˋ gungˊ funˊ! mˇ go aˊ fenˇ hanˇ he biˋ ngaiˇ goˊ idˋ xid eˋ."}
    hl: {hanzi: "五公分！毋過阿宏還係比𠊎高一息仔。", pinyin: "ngˊ gungˋ funˋ! m goˇ a+ fen han heˇ biˊ ngai goˋ rhid sid er+."}
  - n: 6
    speaker: 阿婆
    en: "(on her feet, as the runners set off) Come on, A-min! Come on!"
    sx: {hanzi: "阿明，加油！加油！", pinyin: "aˊ minˇ, gaˊ iuˇ! gaˊ iuˇ!"}
    hl: {hanzi: "阿明，加油！加油！", pinyin: "a+ min, gaˋ rhiu! gaˋ rhiu!"}
  - n: 7
    speaker: Sam
    en: "A-min's faster! …Oh. 阿宏 got to the finishing line first. 阿宏's won."
    sx: {hanzi: "阿明走較遽！……啊，阿宏先到終點，阿宏贏了。", pinyin: "aˊ minˇ zeuˋ ka giagˋ! … a, aˊ fenˇ xienˊ do zungˊ diamˋ, aˊ fenˇ iangˇ leˊ."}
    hl: {hanzi: "阿明走較遽！……啊，阿宏先到終點，阿宏贏了。", pinyin: "a+ min zeuˊ haˇ giag! … a+, a+ fen senˋ doˇ zhungˋ diamˊ, a+ fen rhang leˋ."}
    check: true
  - n: 8
    speaker: 阿明
    en: "(out of breath, back in the stands) I lost… He came first, I came second. Only one step in it."
    sx: {hanzi: "𠊎輸忒了……佢得著頭名，𠊎得著第二名。爭差一步定定。", pinyin: "ngaiˇ suˊ tedˋ leˊ … giˇ dedˋ doˋ teuˇ miangˇ, ngaiˇ dedˋ doˋ ti ngi miangˇ. zenˊ caˊ idˋ pu tin tin."}
    hl: {hanzi: "𠊎輸忒了……佢得著頭名，𠊎得著第二名。爭差一步定定。", pinyin: "ngai shuˋ ted leˋ … gi ded doˊ teu miang, ngai ded doˊ ti+ ngi+ miang. zangˋ caˋ rhid pu+ tin+ tin+."}
    check: true
  - n: 9
    speaker: 阿公
    en: "Second is good too."
    sx: {hanzi: "第二名乜當好。", pinyin: "ti ngi miangˇ me dongˊ hoˋ."}
    hl: {hanzi: "第二名乜當好。", pinyin: "ti+ ngi+ miang meˇ dongˋ hoˊ."}
  - n: 10
    speaker: 阿明
    en: "There's still the relay this afternoon. Our team has trained hard every day: we have to win that!"
    sx: {hanzi: "下晝還有接力賽。𠊎兜个隊逐日煞猛練習，定著愛贏！", pinyin: "haˊ zu hanˇ iuˊ jiabˋ lid soi. ngaiˇ deuˊ ge cui dagˋ ngidˋ sadˋ mangˊ lien xib, tin cog oi iangˇ!"}
    hl: {hanzi: "下晝還有接力賽。𠊎兜个隊逐日煞猛練習，定著愛贏！", pinyin: "haˋ zhiuˇ han rhiuˋ ziab lidˋ soiˇ. ngai deuˋ gaiˇ chui+ dag ngid sad mangˋ lien+ sibˋ, tin+ chogˋ oiˇ rhang!"}
  - n: 11
    speaker: 阿英
    en: "(that afternoon, jumping up) They've won! A-min's class came first!"
    sx: {hanzi: "贏了！阿明个班得著頭名！", pinyin: "iangˇ leˊ! aˊ minˇ ge banˊ dedˋ doˋ teuˇ miangˇ!"}
    hl: {hanzi: "贏了！阿明个班得著頭名！", pinyin: "rhang leˋ! a+ min gaiˇ banˋ ded doˊ teu miang!"}
  - n: 12
    speaker: 阿明
    en: "Told you so!"
    sx: {hanzi: "𠊎講過了！", pinyin: "ngaiˇ gongˋ go leˊ!"}
    hl: {hanzi: "𠊎講過了！", pinyin: "ngai gongˊ goˇ leˋ!"}
  - n: 13
    speaker: 阿婆
    en: "Good, good. Winning or losing doesn't matter in a contest; what's important is sportsmanship."
    sx: {hanzi: "比賽个輸贏無相干，重要个係愛有運動精神。", pinyin: "biˋ soi ge suˊ iangˇ moˇ xiongˊ gonˊ, cung ieu ge he oi iuˊ iun tung jinˊ siinˇ."}
    hl: {hanzi: "比賽个輸贏無相干，重要个係愛有運動精神。", pinyin: "biˊ soiˇ gaiˇ shuˋ rhang mo siongˋ gonˋ, chung+ rhauˇ gaiˇ heˇ oiˇ rhiuˋ rhun+ tung+ zinˋ shin."}
    source: moe
  - n: 14
    speaker: 阿明
    en: "Grandma, you can talk: you're better than all of us. You came third singing 山歌!"
    sx: {hanzi: "阿婆，你比𠊎兜還較慶！你唱山歌得著第三名！", pinyin: "aˊ poˇ, nˇ biˋ ngaiˇ deuˊ hanˇ ka kiang! nˇ cong sanˊ goˊ dedˋ doˋ ti samˊ miangˇ!"}
    hl: {hanzi: "阿婆，你比𠊎兜還較慶！你唱山歌得著第三名！", pinyin: "a+ po, ngi biˊ ngai deuˋ han haˇ kiangˇ! ngi chongˇ sanˋ goˋ ded doˊ ti+ samˋ miang!"}
    check: true

notes:
  - ref: 3
    topic: grammar
    text: >
      Comparison: X 比 Y 較 + adjective, "X is more… than Y": 佢比𠊎較高 "he is taller than me" (an official example has
      exactly this: 佢比𠊎較高，逐擺排列仔總係排到𠊎背尾 "he's taller than me; in line he always ends up behind me").
      Without 比, 較 alone is "rather, more": 阿明走較遽 (line 7) "A-min is (running) faster". 比 from lesson 15.
      With an amount, 較 drops out: 比𠊎高一息仔 (line 5) "a bit taller than me", 比 + adjective + amount (official
      examples: 比華人高一息仔, 比一般車高加盡多). So "taller than you by five centimetres" is 比你高五公分.
  - ref: 4
    topic: grammar
    text: >
      高加幾多公分 "grown how many centimetres taller": adjective + 加 + amount, the 加 of 食加一碗 (lesson 38), and the
      official sentence word for word. The answer follows the same pattern: 高加五公分.
  - ref: 1
    topic: hailu
    text: >
      走相逐 zeuˋ xiongˊ giugˋ "a race, run a race" (逐 "chase") is Sixian; the Hailu lists give 走追仔 zeuˊ duiˋ er. Both
      are built on 走 "run" (lesson 13: in Hakka 走 is run, 行 is walk).
  - ref: 8
    topic: grammar
    text: >
      Ranks: 頭名 teuˇ miangˇ "first place" (also 第一名), 第二名 "second", 第三名 "third" (lesson 60), and they take a
      verb: 得著頭名 "came first" (得著 "obtain", 打頭名 is also attested; official: 這擺走追仔，老弟得著頭名). 輸 suˊ "lose",
      贏 iangˇ "win, beat": 𠊎愛贏阿宏 "I have to beat 阿宏", 輸忒了 "lost". 爭差一步 "one step's difference": 爭差 "the
      difference, the gap".
  - ref: 13
    topic: grammar
    text: >
      Grandma's line is an official sentence. 無相干 moˇ xiongˊ gonˊ "doesn't matter" (like 無要緊, lesson 38); 重要个係…
      "what matters is…". 輸贏 "winning and losing", like Mandarin 輸贏.
  - ref: 14
    topic: grammar
    text: >
      你比𠊎兜還較慶 "you're even better than us": 慶 kiang "capable, good at things" (還慶哦 "how clever!"), with 還較
      "even more". The line is marked for checking. 高過你 "taller than you" is sometimes cited as a Hakka comparative,
      but its two hits in the data are not comparatives (過高過長 "both tall and long"); and 贏過 is "have won before"
      (佢贏過幾擺比賽). The course sticks to 比.

