exercises:
  translate:
    - en: "My uncle is taking a wife; his in-laws are from 竹南."
      sx: {hanzi: "吾阿叔愛討餔娘，親家係竹南人。", pinyin: "ngaˊ aˊ sugˋ oi toˋ buˊ ngiongˇ, qinˊ gaˊ he zugˋ namˇ nginˇ."}
      hl: {hanzi: "𠊎阿叔愛討餔娘，親家係竹南人。", pinyin: "ngai a+ shug oiˇ toˊ buˋ ngiong, cinˋ gaˋ heˇ zhug nam ngin."}
    - en: "If it rains, the banquet will be held indoors."
      sx: {hanzi: "係講落雨，酒席就在屋肚辦。", pinyin: "he gongˋ log iˋ, jiuˋ xid qiu coiˊ vugˋ duˋ pan."}
      hl: {hanzi: "係講落水，酒席就在屋肚辦。", pinyin: "heˇ gongˊ logˋ shuiˊ, ziuˊ sidˋ ciu+ coiˋ vug duˊ pan+."}
      check: true
