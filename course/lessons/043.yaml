      hl: {hanzi: "佢个老公一定會來。", pinyin: "gi gaiˇ loˊ gungˋ rhid tin+ voi+ loi."}
    - en: "The bride's family is in 竹南; her uncle (mother's brother) will come too."
      sx: {hanzi: "新娘个外家在竹南，厥阿舅乜會來。", pinyin: "xinˊ ngiongˇ ge ngoi gaˊ coiˊ zugˋ namˇ, giaˊ aˊ kiuˊ me voi loiˇ."}
      hl: {hanzi: "新娘个外家在竹南，佢个阿舅乜會來。", pinyin: "sinˋ ngiong gaiˇ ngoi+ gaˋ coiˋ zhug nam, gi gaiˇ a+ kiuˋ meˇ voi+ loi."}
