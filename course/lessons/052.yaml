exercises:
  translate:
    - en: "On New Year's Day relatives and friends come to visit."
      sx: {hanzi: "年初一，親戚朋友來拜年。", pinyin: "ngienˇ cuˊ idˋ, qinˊ qidˋ penˇ iuˊ loiˇ bai ngienˇ."}
      hl: {hanzi: "年初一，親戚朋友來拜年。", pinyin: "ngien cuˋ rhid, cinˋ cid pen rhiuˋ loi baiˇ ngien."}
      source: moe
    - en: "At the beginning of the year, when people meet, they say 恭喜發財."
      sx: {hanzi: "年頭大家見面，都會講恭喜發財。", pinyin: "ngienˇ teuˇ tai gaˊ gien mien, du voi gongˋ giungˊ hiˋ fadˋ coiˇ."}
      hl: {hanzi: "年頭大家見面，都會講恭喜發財。", pinyin: "ngien teu tai+ gaˋ gienˇ mienˇ, du+ voi+ gongˊ giungˋ hiˊ fad coi."}
    - en: "Sit down together and watch the TV."
      sx: {hanzi: "共下坐等來看電視。", pinyin: "kiung ha coˊ denˋ loiˇ kon tien sii."}
      hl: {hanzi: "共下坐等來看電視。", pinyin: "kiung+ ha+ coˋ denˊ loi konˇ tien+ shi+."}
    - en: "Everyone is in new clothes for the New Year. Good luck this year!"
      sx: {hanzi: "過年大家都著新衫。今年好運！", pinyin: "go ngienˇ tai gaˊ du zogˋ xinˊ samˊ. gimˊ ngienˇ hoˋ iun!"}
      hl: {hanzi: "過年大家都著新衫。今年好運！", pinyin: "goˇ ngien tai+ gaˋ du+ zhog sinˋ samˋ. gimˋ ngien hoˊ rhun+!"}
      check: true
    - en: "In the first month we go out on New Year visits; your luck will be good."
      sx: {hanzi: "正月去行春，運氣會當好。", pinyin: "zangˊ ngied hi hangˇ cunˊ, iun hi voi dongˊ hoˋ."}
      hl: {hanzi: "正月去行春，運氣會當好。", pinyin: "zhangˋ ngiedˋ hiˇ hang chunˋ, rhun+ hiˇ voi+ dongˋ hoˊ."}
      check: true
    - en: "柑 sounds like 金."
      sx: {hanzi: "柑聽起來像金。", pinyin: "gamˊ tangˊ hiˋ loiˇ qiong gimˊ."}
      hl: {hanzi: "柑聽起來像金。", pinyin: "gamˋ tangˋ hiˊ loi ciongˇ gimˋ."}
    - en: "Mrs Liu looks after the guests. You mustn't sweep today, or you'll have bad luck (so the family says)."
      sx: {hanzi: "阿姆招呼人客。今晡日毋好掃屋，無就會衰。", pinyin: "aˊ meˊ zeuˊ fuˊ nginˇ hagˋ. gimˊ buˊ ngidˋ mˇ hoˋ so vugˋ, moˇ qiu voi soiˊ."}
      hl: {hanzi: "阿姆招呼人客。今晡日毋好掃屋，無就會衰。", pinyin: "a+ meˋ zhauˋ fuˋ ngin hag. gimˋ buˋ ngid m hoˊ soˇ vug, mo ciu+ voi+ soiˋ."}
      check: true
    - en: "The red envelopes are red; the neighbours drop in for a chat."
      sx: {hanzi: "紅包係紅色个；鄰舍來坐尞。", pinyin: "fungˇ bauˊ he fungˇ sedˋ ge; linˇ sa loiˇ coˊ liau."}
      hl: {hanzi: "紅包係紅色个；鄰舍來坐尞。", pinyin: "fung bauˋ heˇ fung sed gaiˇ; lin shaˇ loi coˋ liau+."}
