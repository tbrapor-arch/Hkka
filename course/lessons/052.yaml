id: 52
title:
  en: "New Year's Day"
  sx: {hanzi: "坐等來！", pinyin: "coˊ denˋ loiˇ!"}
  hl: {hanzi: "坐等來！", pinyin: "coˋ denˊ loi!"}
review: false
setting: >-
  Saturday 6 February, 年初一, the first day of the year. Nobody sweeps today (the family says it would sweep the luck
  away). At ten
  o'clock the first visitors arrive: the neighbours 阿財伯 and 財伯姆, in new clothes, with a bag of tangerines.
names: [阿財伯, 財伯姆, 阿英, 阿明]

dialogue:
  - n: 1
    speaker: 阿婆
    en: "A-tsai! 財伯姆! Happy New Year!"
    sx: {hanzi: "阿財伯、財伯姆！新年快樂！", pinyin: "aˊ coiˇ bagˋ, coiˇ bagˋ meˊ! xinˊ ngienˇ kuai log!"}
    hl: {hanzi: "阿財伯、財伯姆！新年快樂！", pinyin: "a+ coi bag, coi bag meˊ! sinˋ ngien kuaiˇ logˋ!"}
  - n: 2
    speaker: 財伯姆
    en: "Happy New Year, and may everything go as you wish!"
    sx: {hanzi: "恭喜新年快樂，萬事如意！", pinyin: "giungˊ hiˋ xinˊ ngienˇ kuai log, van sii iˇ i!"}
    hl: {hanzi: "恭喜新年快樂，萬事如意！", pinyin: "giungˋ hiˊ sinˋ ngien kuaiˇ logˋ, van+ sii+ rhi rhiˇ!"}
  - n: 3
    speaker: 阿婆
    en: "Come in, come in! Sit yourselves down! A-in, come and look after our guests!"
    sx: {hanzi: "入來，入來！坐等來！阿英，來招呼人客！", pinyin: "ngib loiˇ, ngib loiˇ! coˊ denˋ loiˇ! aˊ inˊ, loiˇ zeuˊ fuˊ nginˇ hagˋ!"}
    hl: {hanzi: "入來，入來！坐等來！阿英，來招呼人客！", pinyin: "ngibˋ loi, ngibˋ loi! coˋ denˊ loi! a+ rhinˋ, loi zhauˋ fuˋ ngin hag!"}
    check: true
  - n: 4
    speaker: 阿財伯
    en: "Going visiting at New Year empty-handed is bad manners. These tangerines are for you."
    sx: {hanzi: "過年空手去拜年，當失禮。這兜柑仔分你兜。", pinyin: "go ngienˇ kungˊ suˋ hi bai ngienˇ, dongˊ siidˋ liˊ. iaˋ deuˊ gamˊ eˋ bunˊ nˇ deuˊ."}
    hl: {hanzi: "過年空手去拜年，當失禮。這兜柑仔分你兜。", pinyin: "goˇ ngien kungˋ shiuˊ hiˇ baiˇ ngien, dongˋ shid liˋ. liaˊ deuˋ gamˋ er bunˋ ngi deuˋ."}
  - n: 5
    speaker: 阿婆
    en: "Coming is enough, and you've brought a present too: you shouldn't have! Come, have some tea first, and help yourselves to sweets and melon seeds while you're at it."
    sx: {hanzi: "人來就好，還擐等路來，恁客氣！來，先食茶，糖仔、瓜子先食等來。", pinyin: "nginˇ loiˇ qiu hoˋ, hanˇ kuan denˋ lu loiˇ, anˋ hagˋ hi! loiˇ, xienˊ siid caˇ, tongˇ eˋ, guaˊ ziiˋ xienˊ siid denˋ loiˇ."}
    hl: {hanzi: "人來就好，還擐等路來，恁客氣！來，先食茶，糖仔、瓜子先食等來。", pinyin: "ngin loi ciu+ hoˊ, han kuan+ denˊ lu+ loi, anˊ hag hiˇ! loi, senˋ shidˋ ca, tong er, guaˋ ziiˊ senˋ shidˋ denˊ loi."}
    check: true
  - n: 6
    speaker: 財伯姆
    en: "Sam, your first New Year in Taiwan. Having fun?"
    sx: {hanzi: "Sam，你頭一擺在臺灣過年。好尞無？", pinyin: "Sam, nˇ teuˇ idˋ baiˋ coiˊ toiˇ vanˇ go ngienˇ. hoˋ liau moˇ?"}
    hl: {hanzi: "Sam，你頭一擺在臺灣過年。好尞無？", pinyin: "Sam, ngi teu rhid baiˊ coiˋ toi van goˇ ngien. hoˊ liau+ mo?"}
    check: true
  - n: 7
    speaker: Sam
    en: "Great fun! Last night A-min was letting off firecrackers till the middle of the night."
    sx: {hanzi: "當好尞！昨暗晡阿明放紙炮仔放到半夜。", pinyin: "dongˊ hoˋ liau! coˊ am buˊ aˊ minˇ biong ziiˋ pau eˋ biong do ban ia."}
    hl: {hanzi: "當好尞！昨暗晡阿明放紙炮仔放到半夜。", pinyin: "dongˋ hoˊ liau+! coˋ amˇ buˋ a+ min biongˇ zhiˊ pauˇ er biongˇ doˇ banˇ rha+."}
  - n: 8
    speaker: 阿明
    en: "Uncle A-tsai, prosperity to you! Good luck this year!"
    sx: {hanzi: "阿財伯，恭喜發財！今年好運！", pinyin: "aˊ coiˇ bagˋ, giungˊ hiˋ fadˋ coiˇ! gimˊ ngienˇ hoˋ iun!"}
    hl: {hanzi: "阿財伯，恭喜發財！今年好運！", pinyin: "a+ coi bag, giungˋ hiˊ fad coi! gimˋ ngien hoˊ rhun+!"}
  - n: 9
    speaker: 阿財伯
    en: "(laughing, reaching into his pocket) The bigger you get, the better you get at asking for red envelopes!"
    sx: {hanzi: "你這隻細人仔，緊大緊會討紅包！", pinyin: "nˇ iaˋ zagˋ se nginˇ eˋ, ginˋ tai ginˋ voi toˋ fungˇ bauˊ!"}
    hl: {hanzi: "你這隻細人仔，緊大緊會討紅包！", pinyin: "ngi liaˊ zhag seˇ ngin er, ginˊ tai+ ginˊ voi+ toˊ fung bauˋ!"}
  - n: 10
    speaker: 財伯姆
    en: "And where's A-in? …How old is A-in this year?"
    sx: {hanzi: "阿英呢？……阿英今年幾多歲了？", pinyin: "aˊ inˊ neˇ? … aˊ inˊ gimˊ ngienˇ giˋ doˊ se leˊ?"}
    hl: {hanzi: "阿英呢？……阿英今年幾多歲了？", pinyin: "a+ rhinˋ neˇ? … a+ rhinˋ gimˋ ngien giˊ doˋ soiˇ leˋ?"}
  - n: 11
    speaker: 阿英
    en: "(appearing from the kitchen, with a very bright smile) Happy New Year, 財伯姆!"
    sx: {hanzi: "財伯姆，新年快樂！", pinyin: "coiˇ bagˋ meˊ, xinˊ ngienˇ kuai log!"}
    hl: {hanzi: "財伯姆，新年快樂！", pinyin: "coi bag meˊ, sinˋ ngien kuaiˇ logˋ!"}
  - n: 12
    speaker: 財伯姆
    en: "Happy New Year! This year you must…"
    sx: {hanzi: "新年快樂！今年你愛……", pinyin: "xinˊ ngienˇ kuai log! gimˊ ngienˇ nˇ oi …"}
    hl: {hanzi: "新年快樂！今年你愛……", pinyin: "sinˋ ngien kuaiˇ logˋ! gimˋ ngien ngi oiˇ …"}
  - n: 13
    speaker: 阿婆
    en: "(cutting in) Tea! Have some tea! This year Grandma doesn't interfere."
    sx: {hanzi: "食茶！食茶！今年阿婆毋管了。", pinyin: "siid caˇ! siid caˇ! gimˊ ngienˇ aˊ poˇ mˇ gonˋ leˊ."}
    hl: {hanzi: "食茶！食茶！今年阿婆毋管了。", pinyin: "shidˋ ca! shidˋ ca! gimˋ ngien a+ po m gonˊ leˋ."}
  - n: 14
    speaker: 阿財伯
    en: "(finishing his tea) Right: the New Year is the season for going round. We've other houses to visit; relatives and friends are expecting us."
    sx: {hanzi: "好，新正年時係行春時節。𠊎兜愛去別家拜年了，親戚朋友在該等。", pinyin: "hoˋ, xinˊ zangˊ ngienˇ siiˇ he hangˇ cunˊ siiˇ jiedˋ. ngaiˇ deuˊ oi hi ped gaˊ bai ngienˇ leˊ, qinˊ qidˋ penˇ iuˊ du ge denˋ."}
    hl: {hanzi: "好，新正年時係行春時節。𠊎兜愛去別家拜年了，親戚朋友在該等。", pinyin: "hoˊ, sinˋ zhangˋ ngien shi heˇ hang chunˋ shi zied. ngai deuˋ oiˇ hiˇ pedˋ gaˋ baiˇ ngien leˋ, cinˋ cid pen rhiuˋ diˇ gai denˊ."}

notes:
  - ref: 2
    topic: culture
    text: >
      The New Year greeting, from an official example: 正月初一過新年，大家見面就講：恭喜新年快樂，萬事如意 "on the first day
      of the first month, when people meet they say: happy New Year, may all go as you wish". 恭喜發財 (line 8) is the
      cheekier one, with an eye on the red envelope. 正月 zangˊ ngied "the first lunar month".
  - ref: 3
    topic: grammar
    text: >
      坐等來 "sit yourselves down (and stay)": verb + 等來 asks someone to do something and settle into it. The official
      examples have 共下坐等來看 "sit down together and watch", 省等來用 "use it sparingly", 扛等來 "carry it along".
      先食等來 (line 5) "have some while you wait, help yourselves first". 入來 "come in".
  - ref: 4
    topic: culture
    text: >
      An official example word for word: 過年空手去拜年，當失禮 "visiting at New Year empty-handed is rude"; another says 去人
      屋下拜年愛擐等路去 "take a present when you visit at New Year". 拜年 "pay a New Year visit"; 空手 "empty-handed". That
      tangerines are lucky because 柑 gamˊ sounds a little like 金 gimˊ "gold" is general knowledge, not in the data.
  - ref: 5
    topic: vocab
    text: >
      An official example word for word: 人來就好，還擐等路來，恁客氣 "coming is enough, and you've brought a present too:
      you shouldn't have". 擐 kuan "carry (in the hand)", 等路 denˋ lu "a visitor's present". 客氣 hagˋ hi "polite,
      standing on ceremony".
  - ref: 6
    topic: grammar
    text: >
      頭一擺 "the first time". Not 頭擺, which is "in the old days" (lesson 34). 好尞 "fun": 尞 liau "have fun, go out,
      visit" (lesson 18).
  - ref: 9
    topic: grammar
    text: >
      緊大緊會討紅包 "the bigger he gets, the better he gets at asking for red envelopes": 緊 X 緊 Y from lesson 51.
  - ref: 13
    topic: culture
    text: >
      Grandma has changed sides since lesson 41: 阿婆毋管了 "Grandma doesn't interfere", and she shields A-in from the
      neighbour's question.
  - ref: 14
    topic: culture
    text: >
      新正年時，乜係行春時節 "the New Year days are also the season for going round" is an official sentence: 行春 hangˇ cunˊ
      "go out visiting at New Year", 新正年時 "the New Year days". 別家 "other households".

