exercises:
  translate:
    - en: "Don't spend money any old how, and don't waste it."
      sx: {hanzi: "莫儘採花錢，乜莫浪費。", pinyin: "mog qinˋ caiˋ faˊ qienˇ, me mog long fi."}
      hl: {hanzi: "莫儘採花錢，乜莫浪費。", pinyin: "mogˋ cinˊ caiˊ faˋ cien, meˇ mogˋ long+ fuiˇ."}
    - en: "He won't admit he did it on purpose."
      sx: {hanzi: "佢毋承認佢係故意个。", pinyin: "giˇ mˇ siinˇ ngin giˇ he gu i ge."}
      hl: {hanzi: "佢毋承認佢係故意个。", pinyin: "gi m shin ngin+ gi heˇ guˇ rhiˇ gaiˇ."}
    - en: "Be careful with the card; don't let it get lost."
      sx: {hanzi: "卡愛細義，莫打毋見忒。", pinyin: "kaˋ oi se ngi, mog daˋ mˇ gien tedˋ."}
      hl: {hanzi: "卡愛細義，莫打毋見忒。", pinyin: "kaˊ oiˇ seˇ ngi+, mogˋ daˊ m gienˇ ted."}
    - en: "He argues, but he's got no reason on his side."
      sx: {hanzi: "佢當會詏，毋過無道理。", pinyin: "giˇ dongˊ voi au, mˇ go moˇ to liˊ."}
      hl: {hanzi: "佢當會詏，毋過無道理。", pinyin: "gi dongˋ voi+ auˇ, m goˇ mo to+ liˋ."}
    - en: "Speak quietly; Grandpa is asleep."
      sx: {hanzi: "細聲講，阿公在該睡目。", pinyin: "se sangˊ gongˋ, aˊ gungˊ du ge soi mugˋ."}
      hl: {hanzi: "細聲講，阿公在該睡目。", pinyin: "seˇ shangˋ gongˊ, a+ gungˋ diˇ gai shoi+ mug."}
    - en: "Even if he says sorry, I'm not taking any notice of him."
      sx: {hanzi: "就算佢講敗勢，𠊎乜毋理佢。", pinyin: "qiu son giˇ gongˋ paiˇ se, ngaiˇ me mˇ liˊ giˇ."}
      hl: {hanzi: "就算佢講敗勢，𠊎乜毋理佢。", pinyin: "ciu+ sonˇ gi gongˊ pai+ sheˇ, ngai meˇ m liˋ gi."}
    - en: "On Saturdays A-in is either sleeping or eating."
      sx: {hanzi: "禮拜六阿英毋係睡目，就係食飯。", pinyin: "liˊ bai liugˋ aˊ inˊ mˇ he soi mugˋ, qiu he siid fan."}
      hl: {hanzi: "禮拜六阿英毋係睡目，就係食飯。", pinyin: "liˋ baiˇ liug a+ rhinˋ m heˇ shoi+ mug, ciu+ heˇ shidˋ pon+."}
    - en: "Is that right or wrong? — It's right; you made no mistake. Really."
      sx: {hanzi: "該係著抑係毋著？——著，你無錯。正經。", pinyin: "ge he cog ia he mˇ cog? — cog, nˇ moˇ co. ziin ginˊ."}
      hl: {hanzi: "該係著抑係毋著？——著，你無錯。正經。", pinyin: "gai heˇ chogˋ rha+ heˇ m chogˋ? — chogˋ, ngi mo coˇ. zhinˇ ginˋ."}
      check: true
  fill:
    - en: "It's your fault."
      sx: {hanzi: "係你___。", pinyin: "he nˇ ___.", answer_hanzi: "毋著", answer: "mˇ cog"}
      hl: {hanzi: "係你___。", pinyin: "heˇ ngi ___.", answer_hanzi: "毋著", answer: "m chogˋ"}
    - en: "Even if it's a hundred dollars, you have to ask."
      sx: {hanzi: "___係一百箍，乜愛問。", pinyin: "___ he idˋ bagˋ kieuˊ, me oi mun.", answer_hanzi: "就算", answer: "qiu son"}
      hl: {hanzi: "___係一百箍，乜愛問。", pinyin: "___ heˇ rhid bag kieuˋ, meˇ oiˇ munˇ.", answer_hanzi: "就算", answer: "ciu+ sonˇ"}
    - en: "We've fallen out."
      sx: {hanzi: "𠊎兜___了。", pinyin: "ngaiˇ deuˊ ___ leˊ.", answer_hanzi: "冤家", answer: "ienˊ gaˊ"}
      hl: {hanzi: "𠊎兜___了。", pinyin: "ngai deuˋ ___ leˋ.", answer_hanzi: "冤家", answer: "rhanˋ gaˋ"}

