id: 47
title:
  en: "The quarrel"
  sx: {hanzi: "毋係你毋著，係麼人毋著？", pinyin: "mˇ he nˇ mˇ cog, he maˋ nginˇ mˇ cog?"}
  hl: {hanzi: "毋係你毋著，係麼人毋著？", pinyin: "m heˇ ngi m chogˋ, heˇ maˊ ngin m chogˋ?"}
review: false
setting: >-
  Friday, four o'clock. A-min is just back from school, the parcel from lesson 46 has come, and Sam's phone has just
  told him how much his card was charged. It was not eight hundred.
names: [阿明, 阿英]

dialogue:
  - n: 1
    speaker: Sam
    en: "A-min! How did you spend two thousand three hundred? We agreed: only the jacket!"
    sx: {hanzi: "阿明！你仰會花兩千三？講好淨衫定定！", pinyin: "aˊ minˇ! nˇ ngiongˋ voi faˊ liongˋ qienˊ samˊ? gongˋ hoˋ qiang samˊ tin tin!"}
    hl: {hanzi: "阿明！你仰會花兩千三？講好淨衫定定！", pinyin: "a+ min! ngi ngiongˊ voi+ faˋ liongˊ cienˋ samˋ? gongˊ hoˊ ciang+ samˋ tin+ tin+!"}
  - n: 2
    speaker: 阿明
    en: "It wasn't me! The website got it wrong!"
    sx: {hanzi: "毋係𠊎！係網站毋著！", pinyin: "mˇ he ngaiˇ! he miongˋ zam mˇ cog!"}
    hl: {hanzi: "毋係𠊎！係網站毋著！", pinyin: "m heˇ ngai! heˇ miongˊ zhamˇ m chogˋ!"}
  - n: 3
    speaker: Sam
    en: "If it isn't the website's fault, it's yours. What's in the box?"
    sx: {hanzi: "毋係網站毋著，就係你毋著。箱仔肚有麼个？", pinyin: "mˇ he miongˋ zam mˇ cog, qiu he nˇ mˇ cog. xiongˊ eˋ duˋ iuˊ maˋ ge?"}
    hl: {hanzi: "毋係網站毋著，就係你毋著。箱仔肚有麼个？", pinyin: "m heˇ miongˊ zhamˇ m chogˋ, ciu+ heˇ ngi m chogˋ. siongˋ er duˊ rhiuˋ maˊ gaiˇ?"}
  - n: 4
    speaker: 阿明
    en: "…OK, I added a pair of shoes. But even if I did, you don't have to be so angry!"
    sx: {hanzi: "……好，𠊎加一雙鞋。毋過就算𠊎加一雙，你乜毋使恁譴！", pinyin: "… hoˋ, ngaiˇ gaˊ idˋ sungˊ haiˇ. mˇ go qiu son ngaiˇ gaˊ idˋ sungˊ, nˇ me mˇ siiˋ anˋ kienˋ!"}
    hl: {hanzi: "……好，𠊎加一雙鞋。毋過就算𠊎加一雙，你乜毋使恁閼！", pinyin: "… hoˊ, ngai gaˋ rhid sungˋ hai. m goˇ ciu+ sonˇ ngai gaˋ rhid sungˋ, ngi meˇ m siiˊ anˊ ad!"}
  - n: 5
    speaker: Sam
    en: "You didn't ask me! Even if it were a hundred dollars, you'd have to ask."
    sx: {hanzi: "你無問𠊎！就算係一百箍，乜愛問。", pinyin: "nˇ moˇ mun ngaiˇ! qiu son he idˋ bagˋ kieuˊ, me oi mun."}
    hl: {hanzi: "你無問𠊎！就算係一百箍，乜愛問。", pinyin: "ngi mo munˇ ngai! ciu+ sonˇ heˇ rhid bag kieuˋ, meˇ oiˇ munˇ."}
  - n: 6
    speaker: 阿明
    en: "You're rich. What's two thousand three hundred to you?"
    sx: {hanzi: "你係有錢人，兩千三算麼个？", pinyin: "nˇ he iuˊ qienˇ nginˇ, liongˋ qienˊ samˊ son maˋ ge?"}
    hl: {hanzi: "你係有錢人，兩千三算麼个？", pinyin: "ngi heˇ rhiuˋ cien ngin, liongˊ cienˋ samˋ sonˇ maˊ gaiˇ?"}
  - n: 7
    speaker: Sam
    en: "I'm not rich! You lied to me, and you wasted money."
    sx: {hanzi: "𠊎毋係有錢人！你騙𠊎，又浪費錢。", pinyin: "ngaiˇ mˇ he iuˊ qienˇ nginˇ! nˇ pien ngaiˇ, iu long fi qienˇ."}
    hl: {hanzi: "𠊎毋係有錢人！你騙𠊎，又浪費錢。", pinyin: "ngai m heˇ rhiuˋ cien ngin! ngi pienˇ ngai, rhiu+ long+ fuiˇ cien."}
  - n: 8
    speaker: 阿婆
    en: "(from the kitchen door) What's going on? Why so loud?"
    sx: {hanzi: "麼个事？做麼个恁大聲？", pinyin: "maˋ ge sii? zo maˋ ge anˋ tai sangˊ?"}
    hl: {hanzi: "麼个事？做麼个恁大聲？", pinyin: "maˊ gaiˇ sii+? zoˇ maˊ gaiˇ anˊ tai+ shangˋ?"}
  - n: 9
    speaker: 阿明
    en: "(grabbing the box and running for the stairs) I'm not talking to him any more!"
    sx: {hanzi: "𠊎毋愛同佢講話了！", pinyin: "ngaiˇ mˇ oi tungˇ giˇ gongˋ fa leˊ!"}
    hl: {hanzi: "𠊎毋愛摎佢講話了！", pinyin: "ngai m oiˇ lauˋ gi gongˊ faˇ leˋ!"}
  - n: 10
    speaker: Sam
    en: "(to Grandma) He used my card behind my back. Now we've had a row."
    sx: {hanzi: "佢偷偷仔用𠊎个卡。這下𠊎兜冤家了。", pinyin: "giˇ teuˊ teuˊ eˋ iung ngaiˇ ge kaˋ. iaˋ ha ngaiˇ deuˊ ienˊ gaˊ leˊ."}
    hl: {hanzi: "佢偷偷用𠊎个卡。這下𠊎兜冤家了。", pinyin: "gi teuˋ teuˋ rhung+ ngai gaiˇ kaˊ. liaˊ ha+ ngai deuˋ rhanˋ gaˋ leˋ."}
  - n: 11
    speaker: 阿婆
    en: "(sighing) He really does love an argument. It's plainly his fault, and he still shouts at people."
    sx: {hanzi: "佢實在當好詏，明明就係佢毋著，還恁大聲罵人。", pinyin: "giˇ siid cai dongˊ hau au, minˇ minˇ qiu he giˇ mˇ cog, hanˇ anˋ tai sangˊ ma nginˇ."}
    hl: {hanzi: "佢實在當好詏，明明就係佢毋著，還恁大聲罵人。", pinyin: "gi shidˋ cai+ dongˋ hauˇ auˇ, min min ciu+ heˇ gi m chogˋ, han anˊ tai+ shangˋ maˇ ngin."}
    source: kaga115
  - n: 12
    speaker: Sam
    en: "And he won't admit he did it on purpose."
    sx: {hanzi: "佢乜毋承認佢係故意个。", pinyin: "giˇ me mˇ siinˇ ngin giˇ he gu i ge."}
    hl: {hanzi: "佢乜毋承認佢係故意个。", pinyin: "gi meˇ m shin ngin+ gi heˇ guˇ rhiˇ gaiˇ."}
  - n: 13
    speaker: 阿公
    en: "(from his armchair, without looking up) Where are the shoes?"
    sx: {hanzi: "鞋呢？", pinyin: "haiˇ neˇ?"}
    hl: {hanzi: "鞋呢？", pinyin: "hai neˇ?"}
  - n: 14
    speaker: Sam
    en: "He's taken them up to his room. He's locked the door; I can't get at them."
    sx: {hanzi: "佢拿上去間房了。門關等，𠊎拿佢毋著。", pinyin: "giˇ naˊ songˊ hi gienˊ fongˇ leˊ. munˇ guanˊ denˋ, ngaiˇ naˊ giˇ mˇ doˋ."}
    hl: {hanzi: "佢拿上去間房了。門關等，𠊎拿佢毋著。", pinyin: "gi naˋ shongˋ hiˇ gienˋ fong leˋ. mun guanˋ denˊ, ngai naˋ gi m doˊ."}
    check: true
  - n: 15
    speaker: 阿公
    en: "He's in the wrong. But you, keep your voice down."
    sx: {hanzi: "佢毋著。毋過你乜愛細聲兜。", pinyin: "giˇ mˇ cog. mˇ go nˇ me oi se sangˊ deuˊ."}
    hl: {hanzi: "佢毋著。毋過你乜愛細聲兜。", pinyin: "gi m chogˋ. m goˇ ngi meˇ oiˇ seˇ shangˋ deuˋ."}

notes:
  - ref: 1
    topic: vocab
    text: >
      花 faˊ "spend": 花錢 "spend money"; the same character as "flower". 講好 "we agreed": 講 + 好 "settled" (lesson 38).
  - ref: 2
    topic: grammar
    text: >
      毋著 mˇ cog "wrong, at fault": 係網站毋著 "it's the website that's wrong", 佢毋著 (line 13) "he's in the wrong". 著 cog
      alone is "right, correct" (lesson 10), so 毋著 is literally "not right". Read it mˇ cog when it means
      "wrong". After a verb, the same characters are mˇ doˋ, "not manage to" (拿佢毋著, line 14; 做毋著 "can't do it"). Official example: 明明就係佢毋著，還恁大聲罵人 "it's
      plainly his fault, and he still shouts at people".
  - ref: 3
    topic: grammar
    text: >
      毋係 A，就係 B "if not A, then B; either A or B": 毋係網站毋著，就係你毋著 "if it's not the website's fault, it's
      yours". Official example: 金條毋係五兩，就係十兩 "gold bars are either five or ten taels". 箱仔肚 "in the box".
  - ref: 4
    topic: grammar
    text: >
      就算…，乜… "even if…, still…": 就算𠊎加一雙，你乜毋使恁譴 "even if I did add a pair, you needn't be so angry". 就算 qiu
      son goes at the head of the first clause, 乜 before the verb of the second. Official example: 就算係親兄弟，在金錢方面
      乜愛一還一，二還二 "even between brothers, money must be paid back to the last cent".
  - ref: 5
    topic: vocab
    text: >
      箍 kieuˊ "dollar" (in speech): 一百箍 "a hundred dollars", literally "hoops", from the round coins. In writing and on
      price tags, 元.
  - ref: 10
    topic: vocab
    text: >
      冤家 ienˊ gaˊ "quarrel, have a row": 𠊎兜冤家了 "we've fallen out". Not "enemies" as in Mandarin 冤家: a Hakka
      false friend. 騙 pien (line 7) "lie to, cheat".
  - ref: 11
    topic: vocab
    text: >
      Grandma's line is an official sentence, word for word. 好詏 hau au "argumentative, love an argument": 好 hau "be
      fond of" (lesson 26) + 詏 "argue". 明明 "plainly", 罵人 "shout at people". 浪費 (line 7) "waste"; 承認 (line 12)
      "admit", 故意 "on purpose".
  - ref: 14
    topic: grammar
    text: >
      拿佢毋著 "can't get hold of it": verb + 佢 + 毋著 is "try to do it and fail": 摸佢毋著 "couldn't touch her" (a dream,
      in an official example), 收買佢毋著 "couldn't bribe him". 佢 here is "it", the shoes; the pattern is Hakka, with no
      Mandarin model. 拿上去 "taken up (there)". Marked for checking with 拿 as the verb.
  - ref: 15
    topic: culture
    text: >
      Grandpa gives each side half: he blames A-min, and he tells Sam to lower his voice. 細聲兜 "a bit more quietly":
      細聲 "softly", with 兜 "a bit" (official example: 細聲兜，細嬰兒仔堵堵睡忒).

