id: 23
title:
  en: "The harvest opera"
  sx: {hanzi: "恁早！", pinyin: "anˋ zoˋ!"}
  hl: {hanzi: "恁早！", pinyin: "anˊ zoˊ!"}
review: false
setting: >-
  Tuesday, nine in the morning, the square in front of the temple. A bamboo stage, red lanterns, rows of plastic
  stools, and half the village. Grandpa has put on his good jacket; it is the only thing that gets him out of the
  house in winter.
names: [阿財伯, 阿英, 阿明]

dialogue:
  - n: 1
    speaker: 阿財伯
    en: "Morning, Grandpa, Grandma! This year's opera is really lively!"
    sx: {hanzi: "阿公、阿婆，恁早！今年个收冬戲當鬧熱！", pinyin: "aˊ gungˊ, aˊ poˇ, anˋ zoˋ! gimˊ ngienˇ ge suˊ dungˊ hi dongˊ nau ngied!"}
    hl: {hanzi: "阿公、阿婆，恁早！今年个收冬戲當鬧熱！", pinyin: "a+ gungˋ, a+ po, anˊ zoˊ! gimˋ ngien gaiˇ shiuˋ dungˋ hiˇ dongˋ nau+ ngiedˋ!"}
  - n: 2
    speaker: Sam
    en: "Morning, A-tsai! Have you eaten?"
    sx: {hanzi: "阿財伯，恁早！食飽吂？", pinyin: "aˊ coiˇ bagˋ, anˋ zoˋ! siid bauˋ mangˇ?"}
    hl: {hanzi: "阿財伯，恁早！食飽吂？", pinyin: "a+ coi bag, anˊ zoˊ! shidˋ bauˊ mang?"}
  - n: 3
    speaker: 阿財伯
    en: "(to Grandma, impressed) This foreigner's a good talker!"
    sx: {hanzi: "這隻外國人當會講！", pinyin: "iaˋ zagˋ ngoi guedˋ nginˇ dongˊ voi gongˋ!"}
    hl: {hanzi: "這隻外國人當會講！", pinyin: "liaˊ zhag ngoi+ gued ngin dongˋ voi+ gongˊ!"}
  - n: 4
    speaker: 阿公
    en: "(that afternoon, eyes on the stage) That girl sings well."
    sx: {hanzi: "該隻細妹仔當會唱。", pinyin: "ge zagˋ se moi eˋ dongˊ voi cong."}
    hl: {hanzi: "該隻細妹仔當會唱。", pinyin: "gai zhag seˇ moiˇ er dongˋ voi+ chongˇ."}
  - n: 5
    speaker: Sam
    en: "What are they singing?"
    sx: {hanzi: "佢兜在該唱麼个？", pinyin: "giˇ deuˊ du ge cong maˋ ge?"}
    hl: {hanzi: "佢兜在該唱麼个？", pinyin: "gi deuˋ diˇ gai chongˇ maˊ gaiˇ?"}
  - n: 6
    speaker: 阿婆
    en: "Tea-picking opera. Grandpa used to sing it too."
    sx: {hanzi: "採茶戲。頭擺阿公乜會唱。", pinyin: "caiˋ caˇ hi. teuˇ baiˋ aˊ gungˊ me voi cong."}
    hl: {hanzi: "採茶戲。頭擺阿公乜會唱。", pinyin: "caiˊ ca hiˇ. teu baiˊ a+ gungˋ meˇ voi+ chongˇ."}
  - n: 7
    speaker: 阿婆
    en: "(whispering) Look, his lips are moving!"
    sx: {hanzi: "你看，佢个嘴在該動！", pinyin: "nˇ kon, giˇ ge zoi du ge tungˊ!"}
    hl: {hanzi: "你看，佢个嘴在該動！", pinyin: "ngi konˇ, gi gaiˇ zhoiˇ diˇ gai tungˋ!"}
  - n: 8
    speaker: 阿婆
    en: "(later, inside the temple) Come, tell the gods what you wish for."
    sx: {hanzi: "來，你有麼个願望，同神明講。", pinyin: "loiˇ, nˇ iuˊ maˋ ge ngien mong, tungˇ siinˇ minˇ gongˋ."}
    hl: {hanzi: "來，你有麼个願望，摎神明講。", pinyin: "loi, ngi rhiuˋ maˊ gaiˇ ngien+ mong+, lauˋ shin min gongˊ."}
  - n: 9
    speaker: Sam
    en: "I hope… that everyone at home stays safe and well."
    sx: {hanzi: "𠊎希望……屋下大家都平安。", pinyin: "ngaiˇ hiˊ mong … vugˋ kaˊ tai gaˊ du pinˇ onˊ."}
    hl: {hanzi: "𠊎希望……屋下大家都平安。", pinyin: "ngai hiˋ mong+ … vug haˋ tai+ gaˋ du+ pin onˋ."}
  - n: 10
    speaker: 阿婆
    en: "Me too. …And that A-in gets married soon!"
    sx: {hanzi: "𠊎乜係。……還有，阿英早兜仔嫁！", pinyin: "ngaiˇ me he. … hanˇ iuˊ, aˊ inˊ zoˋ deuˊ eˋ ga!"}
    hl: {hanzi: "𠊎乜係。……還有，阿英早兜仔嫁！", pinyin: "ngai meˇ heˇ. … han rhiuˋ, a+ rhinˋ zoˊ deuˋ er gaˇ!"}
  - n: 11
    speaker: Sam
    en: "(choking) Grandma!"
    sx: {hanzi: "阿婆！", pinyin: "aˊ poˇ!"}
    hl: {hanzi: "阿婆！", pinyin: "a+ po!"}

notes:
  - ref: 1
    topic: vocab
    text: >
      恁早 anˋ zoˋ "good morning", literally "so early!": the morning greeting to anyone you meet, older people above
      all, and often followed by 食飽吂？ (line 2, which is an official example sentence word for word with another
      name). 鬧熱 nau ngied "lively, bustling", Mandarin 熱鬧 the other way round, like 間房 and 人客.
  - ref: 3
    topic: grammar
    text: >
      當會 + verb "be good at": 當會講 "a good talker", 當會唱 "sings well", 阿公當會講古 "Grandpa is a great storyteller".
      會 is "can", 當會 "can very well". You met 會 for skills (lesson 1) and for what is about to happen (lesson 9);
      this is the third use. 外國人 ngoi guedˋ nginˇ "foreigner".
  - ref: 4
    topic: grammar
    text: >
      該隻細妹仔 "that girl": 這 and 該 take a classifier before a noun, and 隻 is the everyday one, people included.
  - ref: 6
    topic: culture
    text: >
      採茶戲 caiˋ caˇ hi, "tea-picking opera", is Hakka opera: it grew out of the songs sung on the tea slopes, the
      山歌 of lesson 20, into little stage plays; the classic 三腳採茶 has three roles, a clown and two girls. The 收冬戲 hires a troupe
      for several days; mornings are for the gods, and the plays for people start after lunch: 朝晨頭打八仙，下晝頭戲仔正上棚
      "in the morning the Eight Immortals, in the afternoon the plays go on stage".
  - ref: 7
    topic: vocab
    text: >
      動 tungˊ "move": 佢个嘴在該動 "his lips are moving". The opera troupe sings it, and so does Grandpa, silently.
  - ref: 8
    topic: vocab
    text: >
      神明 siinˇ minˇ "the gods", more respectful than plain 神. 願望 ngien mong "wish". 希望 hiˊ mong "hope" (line 9),
      as in Mandarin. 大家 tai gaˊ "everyone".
  - ref: 10
    topic: culture
    text: >
      嫁 ga "(of a woman) marry": 早兜仔嫁 "marry a bit sooner". 早兜仔 "a little earlier", the 兜仔 of lesson 19. A
      granddaughter past twenty-five, unmarried: in a Hakka family this is a topic, and the temple is where Grandma raises
      it with the authorities. The son-in-law gossip of lesson 16 has reached her too.
  - ref: 0
    topic: hailu
    text: >
      Hailu: 恁早 anˊ zoˊ, 當會 dongˋ voi+, 鬧熱 nau+ ngiedˋ, 嫁 gaˇ.

