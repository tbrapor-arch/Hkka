exercises:
  translate:
    - en: "Grandpa is a great storyteller."
      source: kaga115
      sx: {hanzi: "阿公當會講古。", pinyin: "aˊ gungˊ dongˊ voi gongˋ guˋ."}
      hl: {hanzi: "阿公當會講古。", pinyin: "a+ gungˋ dongˋ voi+ gongˊ guˊ."}
    - en: "There are a lot of people in front of the stage; it's very lively."
      sx: {hanzi: "戲棚前當多人，當鬧熱。", pinyin: "hi pangˇ qienˇ dongˊ doˊ nginˇ, dongˊ nau ngied."}
      hl: {hanzi: "戲棚前當多人，當鬧熱。", pinyin: "hiˇ pang cien dongˋ doˋ ngin, dongˋ nau+ ngiedˋ."}
    - en: "In front of the temple there are a lot of red lanterns."
      sx: {hanzi: "廟前有當多紅燈籠。", pinyin: "meu qienˇ iuˊ dongˊ doˊ fungˇ denˊ nungˇ."}
      hl: {hanzi: "廟前有當多紅燈籠。", pinyin: "miau+ cien rhiuˋ dongˋ doˋ fung denˋ nung."}
    - en: "A-min is good at dancing."
      sx: {hanzi: "阿明當會跳舞。", pinyin: "aˊ minˇ dongˊ voi tiau vuˋ."}
      hl: {hanzi: "阿明當會跳舞。", pinyin: "a+ min dongˋ voi+ tiauˇ vuˊ."}
    - en: "Please, help me!"
      sx: {hanzi: "拜託，摎𠊎𢯭手！", pinyin: "bai togˋ, lauˊ ngaiˇ ten suˋ!"}
      hl: {hanzi: "拜託，摎𠊎𢯭手！", pinyin: "baiˇ tog, lauˋ ngai tenˇ shiuˊ!"}
    - en: "I hope my sister comes."
      sx: {hanzi: "𠊎希望吾老妹會來。", pinyin: "ngaiˇ hiˊ mong ngaˊ loˋ moi voi loiˇ."}
      hl: {hanzi: "𠊎希望𠊎老妹會來。", pinyin: "ngai hiˋ mong+ ngai loˊ moiˇ voi+ loi."}
