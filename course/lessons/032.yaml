  - {hanzi: 男仔人, pinyin: "namˇ eˋ nginˇ", en: "man", hl: {hanzi: 男仔人, pinyin: "nam er ngin"}}
  - {hanzi: 感情, pinyin: "gamˋ qinˇ", en: "relationship, feelings (between people)", hl: {hanzi: 感情, pinyin: "gamˊ cin"}}
