id: 32
title:
  en: "The neighbours talk"
  sx: {hanzi: "聽講……", pinyin: "tangˊ gongˋ …"}
  hl: {hanzi: "聽講……", pinyin: "tangˇ gongˊ …"}
review: false
setting: >-
  Saturday morning, early, at the 伯公 shrine (lesson 22). Grandma meets A-tsai and his wife, who have news. In a village this
  size, news travels faster than the bus.
names: [阿財, 阿財伯, 財伯姆, 大湖, 阿英]

dialogue:
  - n: 1
    speaker: 財伯姆
    en: "Grandma Liu, I hear Sam has a girlfriend!"
    sx: {hanzi: "阿婆，聽講 Sam 有女朋友了！", pinyin: "aˊ poˇ, tangˊ gongˋ Sam iuˊ ngˋ penˇ iuˊ leˊ!"}
    hl: {hanzi: "阿婆，聽講 Sam 有女朋友了！", pinyin: "a+ po, tangˇ gongˊ Sam rhiuˋ ngˊ pen rhiuˋ leˋ!"}
  - n: 2
    speaker: 阿婆
    en: "A girlfriend? Who said so?"
    sx: {hanzi: "女朋友？麼人講个？", pinyin: "ngˋ penˇ iuˊ? maˋ nginˇ gongˋ ge?"}
    hl: {hanzi: "女朋友？麼人講个？", pinyin: "ngˊ pen rhiuˋ? maˊ ngin gongˊ gaiˇ?"}
  - n: 3
    speaker: 財伯姆
    en: "A-tsai did. He saw Sam picking strawberries in 大湖 with a foreign girl. And they were holding hands!"
    sx: {hanzi: "阿財講个。佢看著 Sam 同一隻外國細妹仔在大湖摘草莓，兩儕還牽手！", pinyin: "aˊ coiˇ gongˋ ge. giˇ kon doˋ Sam tungˇ idˋ zagˋ ngoi guedˋ se moi eˋ coiˊ tai fuˇ zagˋ coˋ moiˇ, liongˋ saˇ hanˇ kienˊ suˋ!"}
    hl: {hanzi: "阿財講个。佢看著 Sam 摎一隻外國細妹仔在大湖摘草莓，兩儕還牽手！", pinyin: "a+ coi gongˊ gaiˇ. gi konˇ doˊ Sam lauˋ rhid zhag ngoi+ gued seˇ moiˇ er coiˋ tai+ fu zag coˊ moi, liongˊ sa han kienˋ shiuˊ!"}
  - n: 4
    speaker: 阿婆
    en: "(laughing) That's his younger sister!"
    sx: {hanzi: "該係厥老妹！", pinyin: "ge he giaˊ loˋ moi!"}
    hl: {hanzi: "該係厥老妹！", pinyin: "gai heˇ gia loˊ moiˇ!"}
  - n: 5
    speaker: 阿財伯
    en: "His sister? Really? You're kidding!"
    sx: {hanzi: "老妹？有影無？莫講笑！", pinyin: "loˋ moi? iuˊ iangˋ moˇ? mog gongˋ seu!"}
    hl: {hanzi: "老妹？有影無？莫講笑！", pinyin: "loˊ moiˇ? rhiuˋ rhangˊ mo? mogˋ gongˊ siauˇ!"}
  - n: 6
    speaker: 阿婆
    en: "Really. …But between you and me, A-in gets on very well with him."
    sx: {hanzi: "有影。……還有，𠊎看阿英同佢感情當好。", pinyin: "iuˊ iangˋ. … hanˇ iuˊ, ngaiˇ kon aˊ inˊ tungˇ giˇ gamˋ qinˇ dongˊ hoˋ."}
    hl: {hanzi: "有影。……還有，𠊎看阿英摎佢感情當好。", pinyin: "rhiuˋ rhangˊ. … han rhiuˋ, ngai konˇ a+ rhinˋ lauˋ gi gamˊ cin dongˋ hoˊ."}
  - n: 7
    speaker: 財伯姆
    en: "Is that so? A-in and Sam?"
    sx: {hanzi: "係毋係？阿英同 Sam？", pinyin: "he mˇ he? aˊ inˊ tungˇ Sam?"}
    hl: {hanzi: "係毋係？阿英摎 Sam？", pinyin: "heˇ m heˇ? a+ rhinˋ lauˋ Sam?"}
  - n: 8
    speaker: 阿婆
    en: "I don't know… I've only heard it myself, that's all. It's a secret, don't tell anyone!"
    sx: {hanzi: "𠊎毋知……𠊎乜係聽講个定定。這係祕密，做毋得同人講！", pinyin: "ngaiˇ mˇ diˊ … ngaiˇ me he tangˊ gongˋ ge tin tin. iaˋ he bi med, zomˇ dedˋ tungˇ nginˇ gongˋ!"}
    hl: {hanzi: "𠊎毋知……𠊎乜係聽講个定定。這係祕密，做毋得摎人講！", pinyin: "ngai m diˋ … ngai meˇ heˇ tangˇ gongˊ gaiˇ tin+ tin+. liaˊ heˇ biˇ medˋ, zoˇ m ded lauˋ ngin gongˊ!"}
  - n: 9
    speaker: 財伯姆
    en: "If they get married, the whole lot of us will go to the wedding banquet!"
    sx: {hanzi: "若係佢兜結婚，𠊎兜全部愛去食酒！", pinyin: "na he giˇ deuˊ giedˋ funˊ, ngaiˇ deuˊ qionˇ pu oi hi siid jiuˋ!"}
    hl: {hanzi: "若係佢兜結婚，𠊎兜全部愛去食酒！", pinyin: "na+ heˇ gi deuˋ gied funˋ, ngai deuˋ cion pu+ oiˇ hiˇ shidˋ ziuˊ!"}
  - n: 10
    speaker: 阿財伯
    en: "(patting his pockets) Where are my glasses?"
    sx: {hanzi: "𠊎个目鏡呢？", pinyin: "ngaiˇ ge mugˋ giang neˇ?"}
    hl: {hanzi: "𠊎个目鏡呢？", pinyin: "ngai gaiˇ mug giangˇ neˇ?"}
  - n: 11
    speaker: 財伯姆
    en: "Here they are! On your head!"
    sx: {hanzi: "這毋係！在你个頭那頂！", pinyin: "iaˋ mˇ he! coiˊ nˇ ge teuˇ naˇ dangˋ!"}
    hl: {hanzi: "這毋係！在你个頭那頂！", pinyin: "liaˊ m heˇ! coiˋ ngi gaiˇ teu na dangˊ!"}
    check: true
  - n: 12
    speaker: 阿婆
    en: "Right, right. I must get home for breakfast."
    sx: {hanzi: "好了，好了。𠊎愛轉去食朝了。", pinyin: "hoˋ leˊ, hoˋ leˊ. ngaiˇ oi zonˋ hi siid zeuˊ leˊ."}
    hl: {hanzi: "好了，好了。𠊎愛轉去食朝了。", pinyin: "hoˊ leˋ, hoˊ leˋ. ngai oiˇ zhonˊ hiˇ shidˋ zhauˋ leˋ."}

notes:
  - ref: 1
    topic: grammar
    text: >
      聽講 tangˊ gongˋ "I hear (that), they say": 聽講 Sam 有女朋友 "I hear Sam has a girlfriend". The opening of every
      piece of village news. 女朋友 "girlfriend" is simply 女 ngˋ "female" + 朋友 (lesson 11); 女 is a syllable with no
      vowel, like 五 and 魚. "A man" is 男仔人 namˇ eˋ nginˇ.
  - ref: 3
    topic: grammar
    text: >
      看著 Sam 同…摘草莓 "saw Sam picking strawberries with…": after 看著 the whole scene follows, as in Mandarin.
      阿財講个 "A-tsai said so": 係 left out of the 係…个 frame, as often in speech.
  - ref: 5
    topic: grammar
    text: >
      有影 iuˊ iangˋ "true, for real", literally "there is a shadow (of it)"; 無影 "not true, nothing to it". 有影無？
      "really? is it true?" is the reply to any 聽講. A Hakka word with no Mandarin look-alike: worth learning as a block.
  - ref: 6
    topic: culture
    text: >
      𠊎看 "the way I see it, I think": Grandma passes on gossip as her own observation, then (line 8) calls it a secret.
      By lunchtime it will be at the bus stop of lesson 13.
  - ref: 7
    topic: grammar
    text: >
      係毋係 he mˇ he "is it (or not)?": the A-not-A question, as Mandarin 是不是. Alone, it asks for confirmation: 係毋係？
      "really? is that so?"; inside a sentence, it turns it into a question: 你係毋係 Sam 个女朋友？ "are you Sam's girlfriend?".
  - ref: 9
    topic: grammar
    text: >
      若係 na he "if": 若係佢兜結婚 "if they get married". It goes at the start of the clause, and the result follows
      without any word for "then". 食酒 is the wedding banquet of lesson 27: "drinking" is what a village wedding is
      remembered for.
  - ref: 11
    topic: grammar
    text: >
      這毋係！ "here it is!", literally "isn't this (it)?": a rhetorical question used as a pointer. None of the official
      example sentences uses it in this sense, so the line is marked for a native speaker's check. 目鏡 mugˋ giang
      "glasses" (目 "eye" + 鏡 "lens"); 頭那頂 "on (one's) head": 頭那 (lesson 12) + 頂 "top".

