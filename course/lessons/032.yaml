exercises:
  translate:
    - en: "I hear the neighbour is going to sell his house."
      sx: {hanzi: "聽講鄰舍愛賣屋。", pinyin: "tangˊ gongˋ linˇ sa oi mai vugˋ."}
      hl: {hanzi: "聽講鄰舍愛賣屋。", pinyin: "tangˇ gongˊ lin shaˇ oiˇ mai+ vug."}
    - en: "Is this news true or false? Do you believe it?"
      sx: {hanzi: "這消息係毋係假个？你相信無？", pinyin: "iaˋ seuˊ xidˋ he mˇ he gaˋ ge? nˇ xiongˊ xin moˇ?"}
      hl: {hanzi: "這消息係毋係假个？你相信無？", pinyin: "liaˊ siauˋ sid heˇ m heˇ gaˊ gaiˇ? ngi siongˋ sinˇ mo?"}
    - en: "Don't believe him, he's joking."
      sx: {hanzi: "莫相信佢，佢在該講笑。", pinyin: "mog xiongˊ xin giˇ, giˇ du ge gongˋ seu."}
      hl: {hanzi: "莫相信佢，佢在該講笑。", pinyin: "mogˋ siongˋ sinˇ gi, gi diˇ gai gongˊ siauˇ."}
    - en: "A-tsai saw two people holding hands: a man and a woman."
      sx: {hanzi: "阿財看著兩儕人牽手：一隻男仔人，一隻細妹仔。", pinyin: "aˊ coiˇ kon doˋ liongˋ saˇ nginˇ kienˊ suˋ: idˋ zagˋ namˇ eˋ nginˇ, idˋ zagˋ se moi eˋ."}
      hl: {hanzi: "阿財看著兩儕人牽手：一隻男仔人，一隻細妹仔。", pinyin: "a+ coi konˇ doˊ liongˊ sa ngin kienˋ shiuˊ: rhid zhag nam er ngin, rhid zhag seˇ moiˇ er."}
    - en: "Don't laugh! If you laugh, I won't tell you."
      sx: {hanzi: "莫笑！若係你笑，𠊎就毋同你講。", pinyin: "mog seu! na he nˇ seu, ngaiˇ qiu mˇ tungˇ nˇ gongˋ."}
      hl: {hanzi: "莫笑！若係你笑，𠊎就毋摎你講。", pinyin: "mogˋ siauˇ! na+ heˇ ngi siauˇ, ngai ciu+ m lauˋ ngi gongˊ."}
    - en: "Are you Sam's girlfriend?"
      sx: {hanzi: "你係毋係 Sam 个女朋友？", pinyin: "nˇ he mˇ he Sam ge ngˋ penˇ iuˊ?"}
      hl: {hanzi: "你係毋係 Sam 个女朋友？", pinyin: "ngi heˇ m heˇ Sam gaiˇ ngˊ pen rhiuˋ?"}
  fill:
    - en: "I hear (that) A-in's coming back."
      sx: {hanzi: "___阿英愛轉來。", pinyin: "___ aˊ inˊ oi zonˋ loiˇ.", answer_hanzi: "聽講", answer: "tangˊ gongˋ"}
      hl: {hanzi: "___阿英愛轉來。", pinyin: "___ a+ rhinˋ oiˇ zhonˊ loi.", answer_hanzi: "聽講", answer: "tangˇ gongˊ"}
    - en: "I hear the bride is beautiful. Really?"
      sx: {hanzi: "聽講新娘當靚。___", pinyin: "tangˊ gongˋ xinˊ ngiongˇ dongˊ jiangˊ. ___", answer_hanzi: "有影無", answer: "iuˊ iangˋ moˇ"}
      hl: {hanzi: "聽講新娘當靚。___", pinyin: "tangˇ gongˊ sinˋ ngiong dongˋ ziangˋ. ___", answer_hanzi: "有影無", answer: "rhiuˋ rhangˊ mo"}
    - en: "Where are my glasses?"
      sx: {hanzi: "𠊎个___呢？", pinyin: "ngaiˇ ge ___ neˇ?", answer_hanzi: "目鏡", answer: "mugˋ giang"}
      hl: {hanzi: "𠊎个___呢？", pinyin: "ngai gaiˇ ___ neˇ?", answer_hanzi: "目鏡", answer: "mug giangˇ"}

