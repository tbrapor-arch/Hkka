id: 8
title:
  en: "Grandma's garden"
  sx: {hanzi: "當辣！", pinyin: "dongˊ lad!"}
  hl: {hanzi: "當辣！", pinyin: "dongˋ ladˋ!"}
review: false
setting: >-
  Tuesday, four in the afternoon. Behind the house, between the tea bushes and the road, Grandma keeps a vegetable
  garden. She has a basket; Sam has nothing to do, so now he has a basket too.
names: [阿明]

dialogue:
  - n: 1
    speaker: 阿婆
    en: "Sam, come and see my garden!"
    sx: {hanzi: "Sam，來看吾菜園！", pinyin: "Sam, loiˇ kon ngaˊ coi ienˇ!"}
    hl: {hanzi: "Sam，來看𠊎个菜園！", pinyin: "Sam, loi konˇ ngai gaiˇ coiˇ rhan!"}
  - n: 2
    speaker: Sam
    en: "It's so big! Grandma, what are all these vegetables?"
    sx: {hanzi: "恁大！阿婆，這兜係麼个菜？", pinyin: "anˋ tai! aˊ poˇ, iaˋ deuˊ he maˋ ge coi?"}
    hl: {hanzi: "恁大！阿婆，這兜係麼个菜？", pinyin: "anˊ tai+! a+ po, liaˊ deuˋ heˇ maˊ gaiˇ coiˇ?"}
  - n: 3
    speaker: 阿婆
    en: "This is mustard greens, and that's sweet potato. Look at this one, it's the biggest!"
    sx: {hanzi: "這係芥菜，該係番薯。你看，這條盡大！", pinyin: "iaˋ he gie coi, ge he fanˊ suˇ. nˇ kon, iaˋ tiauˇ qin tai!"}
    hl: {hanzi: "這係芥菜，該係番薯。你看，這條最大！", pinyin: "liaˊ heˇ gaiˇ coiˇ, gai heˇ fanˋ shu. ngi konˇ, liaˊ tiau zuiˇ tai+!"}
  - n: 4
    speaker: Sam
    en: "The mustard greens are very… green."
    zh: "芥菜很……綠。"
    sx: {hanzi: "芥菜當……綠。", pinyin: "gie coi dongˊ … liug."}
    hl: {hanzi: "芥菜當……綠。", pinyin: "gaiˇ coiˇ dongˋ … liugˋ."}
  - n: 5
    speaker: 阿婆
    en: "Green? In Hakka we say 青!"
    sx: {hanzi: "綠？客話講「青」！", pinyin: "liug? hagˋ fa gongˋ \"qiangˊ\"!"}
    hl: {hanzi: "綠？客話講「青」！", pinyin: "liugˋ? hag voiˋ gongˊ \"ciangˋ\"!"}
  - n: 6
    speaker: Sam
    en: "Green… And those red ones, what are they?"
    sx: {hanzi: "青……該兜紅个係麼个？", pinyin: "qiangˊ … ge deuˊ fungˇ ge he maˋ ge?"}
    hl: {hanzi: "青……該兜紅个係麼个？", pinyin: "ciangˋ … gai deuˋ fung gaiˇ heˇ maˊ gaiˇ?"}
  - n: 7
    speaker: 阿婆
    en: "Chillies. Very hot!"
    sx: {hanzi: "番椒。當辣！", pinyin: "fanˊ zeuˊ. dongˊ lad!"}
    hl: {hanzi: "番椒。當辣！", pinyin: "fanˋ ziauˋ. dongˋ ladˋ!"}
  - n: 8
    speaker: Sam
    en: "(bites one anyway) …Hot! Really, really hot!"
    sx: {hanzi: "……辣！盡辣！", pinyin: "… lad! qin lad!"}
    hl: {hanzi: "……辣！最辣！", pinyin: "… ladˋ! zuiˇ ladˋ!"}
  - n: 9
    speaker: 阿婆
    en: "(not very sorry) Sweet, is it?"
    sx: {hanzi: "甜無？", pinyin: "tiamˇ moˇ?"}
    hl: {hanzi: "甜無？", pinyin: "tiam mo?"}

notes:
  - ref: 1
    topic: vocab
    text: >
      看 kon "look, see": Mandarin kàn, high and level in Hakka. 菜園 coi ienˇ "vegetable garden". 吾菜園 "my garden":
      吾 also goes straight before ordinary nouns (吾菜園, 吾屋下), though with things 吾个菜園 is just as good.
  - ref: 2
    topic: grammar
    text: >
      恁 anˋ "so, this (much)": 恁大！ "so big!". It goes before an adjective, like Mandarin 這麼 / 那麼. 這兜 iaˋ deuˊ
      "these" and 該兜 ge deuˊ "those" (line 6): 兜 makes a plural of 這 and 該, like 些 in 這些 / 那些.
  - ref: 3
    topic: false-friend
    text: >
      盡 qin is "the most" in Sixian: 這條盡大 "this one is the biggest". In Mandarin 盡 is "to the limit" and the
      superlative is 最; in Sixian it is 盡 (and 最 is creeping in from Mandarin). 芥菜 gie coi "mustard greens", the
      Hakka vegetable: salted and dried, it becomes 鹹菜 and 福菜, which you will eat all year. 番薯 fanˊ suˇ
      "sweet potato".
  - ref: 4
    topic: false-friend
    text: >
      當 dongˊ is the everyday "very", Mandarin 很: 當大 "very big", 當辣 "very hot". It has nothing to do with Mandarin
      當 "act as" or 應當. Rising tone, and in speech it often takes over a whole sentence: 當好！ "great!". Grandma
      uses it in every second sentence; so will you.
  - ref: 5
    topic: false-friend
    text: >
      青 qiangˊ is the colour of plants (and of the sky and the sea: green and blue are one colour here). Mandarin has
      綠 for leaves; Hakka understands 綠 liug, but for a vegetable it says 青. The other colours are as in Mandarin:
      紅 fungˇ red, 白 pag white, 黃 vongˇ yellow, except black, 烏 vuˊ (Mandarin 黑).
  - ref: 6
    topic: grammar
    text: >
      紅个 "red ones": 个 after an adjective makes it a noun, like Mandarin 紅的. 該兜紅个 "those red ones".
  - ref: 7
    topic: vocab
    text: >
      番椒 fanˊ zeuˊ "chilli pepper" (辣椒). 番 marks things that came from overseas, as in 番薯: chillies and sweet
      potatoes both arrived from the Americas. 辣 lad "hot (spicy)". Sandhi: 番 fanˊ before 椒 zeuˊ is said fanˇ, but
      before 薯 suˇ it stays fanˊ.
  - ref: 9
    topic: culture
    text: >
      Grandma's 甜無？ "sweet?" is a callback to lesson 4: Sam called the oolong sweet. Teasing a guest is a sign that
      he is not a guest any more.
  - ref: 0
    topic: hailu
    text: >
      Where Sixian says 盡 for "most", Hailu says 最 zuiˇ: 這條最大. Hailu also tends to put 个 after 𠊎 before a
      thing (𠊎个菜園). 恁 is anˊ, 當 dongˋ: the tone code again.

