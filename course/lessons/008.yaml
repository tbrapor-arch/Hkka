exercises:
  translate:
    - en: "This tea is very sweet."
      sx: {hanzi: "這茶當甜。", pinyin: "iaˋ caˇ dongˊ tiamˇ."}
      hl: {hanzi: "這茶當甜。", pinyin: "liaˊ ca dongˋ tiam."}
    - en: "This sweet potato is the biggest."
      sx: {hanzi: "這條番薯盡大。", pinyin: "iaˋ tiauˇ fanˊ suˇ qin tai."}
      hl: {hanzi: "這條番薯最大。", pinyin: "liaˊ tiau fanˋ shu zuiˇ tai+."}
    - en: "The white ones are mine, the black ones are A-min's."
      sx: {hanzi: "白个係𠊎个，烏个係阿明个。", pinyin: "pag ge he ngaiˇ ge, vuˊ ge he aˊ minˇ ge."}
      hl: {hanzi: "白个係𠊎个，烏个係阿明个。", pinyin: "pagˋ gaiˇ heˇ ngai gaiˇ, vuˋ gaiˇ heˇ a+ min gaiˇ."}
    - en: "Grandma's sweet potatoes are so big!"
      sx: {hanzi: "阿婆个番薯恁大！", pinyin: "aˊ poˇ ge fanˊ suˇ anˋ tai!"}
      hl: {hanzi: "阿婆个番薯恁大！", pinyin: "a+ po gaiˇ fanˋ shu anˊ tai+!"}
    - en: "Are the chillies hot?"
      sx: {hanzi: "番椒辣無？", pinyin: "fanˊ zeuˊ lad moˇ?"}
      hl: {hanzi: "番椒辣無？", pinyin: "fanˋ ziauˋ ladˋ mo?"}
  fill:
    - en: "Mustard greens are green."
      sx: {hanzi: "芥菜係___个。", pinyin: "gie coi he ___ ge.", answer_hanzi: "青", answer: "qiangˊ"}
      hl: {hanzi: "芥菜係___个。", pinyin: "gaiˇ coiˇ heˇ ___ gaiˇ.", answer_hanzi: "青", answer: "ciangˋ"}
    - en: "This one is the hottest."
      sx: {hanzi: "這條___辣。", pinyin: "iaˋ tiauˇ ___ lad.", answer_hanzi: "盡", answer: "qin"}
      hl: {hanzi: "這條___辣。", pinyin: "liaˊ tiau ___ ladˋ.", answer_hanzi: "最", answer: "zuiˇ"}
    - en: "The garden is very big."
      sx: {hanzi: "菜園___大。", pinyin: "coi ienˇ ___ tai.", answer_hanzi: "當", answer: "dongˊ"}
      hl: {hanzi: "菜園___大。", pinyin: "coiˇ rhan ___ tai+.", answer_hanzi: "當", answer: "dongˋ"}

