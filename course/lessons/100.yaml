exercises:
  translate:
    - en: "Having you all is my good fortune; you are my benefactors."
      sx: {hanzi: "有你兜係𠊎个福氣，你兜係𠊎个恩人。", pinyin: "iuˊ nˇ deuˊ he ngaiˇ ge fugˋ hi, nˇ deuˊ he ngaiˇ ge enˊ nginˇ."}
      hl: {hanzi: "有你兜係𠊎个福氣，你兜係𠊎个恩人。", pinyin: "rhiuˋ ngi deuˋ heˇ ngai gaiˇ fug hiˇ, ngi deuˋ heˇ ngai gaiˇ enˋ ngin."}
    - en: "The days of one's youth are well worth remembering."
      sx: {hanzi: "後生時个生活，盡值得回憶。", pinyin: "heu sangˊ siiˇ ge senˊ fad, qin dad dedˋ fiˇ i."}
      hl: {hanzi: "後生時个生活，盡值得回憶。", pinyin: "heu+ sangˋ shi gaiˇ senˋ fadˋ, cin+ dadˋ ded fui rhiˇ."}
      source: moe
    - en: "Since leaving Miaoli, I've been a little lonely."
      sx: {hanzi: "離開苗栗以後，𠊎有兜仔孤單。", pinyin: "liˇ koiˊ meuˇ lidˋ iˊ heu, ngaiˇ iuˊ deuˊ eˋ guˊ danˊ."}
      hl: {hanzi: "離開苗栗以後，𠊎有兜仔孤單。", pinyin: "li koiˋ miau lid rhiˋ heu+, ngai rhiuˋ deuˋ er guˋ danˋ."}
      check: true
    - en: "Every year, at New Year, I'll phone home; later on, I'll come back to live."
      sx: {hanzi: "年年過年，𠊎會打電話轉屋下；日後，𠊎會轉來戴。", pinyin: "ngienˇ ngienˇ go ngienˇ, ngaiˇ voi daˋ tien fa zonˋ vugˋ kaˊ; ngidˋ heu, ngaiˇ voi zonˋ loiˇ dai."}
      hl: {hanzi: "年年過年，𠊎會打電話轉屋下；日後，𠊎會轉來戴。", pinyin: "ngien ngien goˇ ngien, ngai voi+ daˊ tien+ faˇ zhonˊ vug haˋ; ngid heu+, ngai voi+ zhonˊ loi daiˇ."}
      check: true
    - en: "Look, the tree outside the window has turned white."
      sx: {hanzi: "你看，窗門外該頭樹仔變白了。", pinyin: "nˇ kon, cungˊ munˇ ngoi ge teuˇ su eˋ bien pag leˊ."}
