exercises:
  translate:
    - en: "He wanted to change to an easier job."
      sx: {hanzi: "佢想愛換一隻較輕鬆个頭路。", pinyin: "giˇ xiongˋ oi von idˋ zagˋ ka kiangˊ sungˊ ge teuˇ lu."}
      hl: {hanzi: "佢想愛換一隻較輕鬆个頭路。", pinyin: "gi siongˊ oiˇ von+ rhid zhag haˇ kiangˋ sungˋ gaiˇ teu lu+."}
    - en: "Taipei is far; the county government is near home."
      sx: {hanzi: "台北當遠，縣政府離屋下當近。", pinyin: "toiˇ bedˋ dongˊ ienˋ, ien ziin fuˋ liˇ vugˋ kaˊ dongˊ kiunˊ."}
      hl: {hanzi: "台北當遠，縣政府離屋下當近。", pinyin: "toi bed dongˋ rhanˊ, rhanˇ zhinˇ fuˊ li vug haˋ dongˋ kiunˋ."}
    - en: "Even on Sunday, Dad still has to go to work."
      sx: {hanzi: "禮拜日，阿爸還係愛去上班。", pinyin: "liˊ bai ngidˋ, aˊ baˊ hanˇ he oi hi songˊ banˊ."}
      hl: {hanzi: "禮拜日，阿爸還係愛去上班。", pinyin: "liˋ baiˇ ngid, a+ baˋ han heˇ oiˇ hiˇ shongˋ banˋ."}
    - en: "Earning money is hard work."
      sx: {hanzi: "賺錢當辛苦。", pinyin: "con qienˇ dongˊ xinˊ kuˋ."}
      hl: {hanzi: "賺錢當辛苦。", pinyin: "con+ cien dongˋ sinˋ kuˊ."}
    - en: "We discussed it for two hours and reached no conclusion."
      sx: {hanzi: "大家討論兩點鐘久，還係無結論。", pinyin: "tai gaˊ toˋ lun liongˋ diamˋ zungˊ giuˋ, hanˇ he moˇ giedˋ lun."}
      hl: {hanzi: "大家討論兩點鐘久，還係無結論。", pinyin: "tai+ gaˋ toˊ lun+ liongˊ diamˊ zhungˋ giuˊ, han heˇ mo gied lun+."}
    - en: "What do you think? — I think the income from the county job is too low."
      sx: {hanzi: "你个想法係麼个？——𠊎想縣政府个收入忒少。", pinyin: "nˇ ge xiongˋ fabˋ he maˋ ge? — ngaiˇ xiongˋ ien ziin fuˋ ge suˊ ngib tedˋ seuˋ."}
      hl: {hanzi: "你个想法係麼个？——𠊎想縣政府个收入忒少。", pinyin: "ngi gaiˇ siongˊ fab heˇ maˊ gaiˇ? — ngai siongˊ rhanˇ zhinˇ fuˊ gaiˇ shiuˋ ngibˋ ted shauˊ."}
  fill:
    - en: "Unless there's a reason, I don't want to go out."
      sx: {hanzi: "___有事情，𠊎毋想出門。", pinyin: "___ iuˊ sii qinˇ, ngaiˇ mˇ xiongˋ cudˋ munˇ.", answer_hanzi: "除非", answer: "cuˇ fiˊ"}
      hl: {hanzi: "___有事情，𠊎毋想出門。", pinyin: "___ rhiuˋ sii+ cin, ngai m siongˊ chud mun.", answer_hanzi: "除非", answer: "chu fuiˋ"}
    - en: "I'd rather work hard myself."
      sx: {hanzi: "𠊎___自家辛苦。", pinyin: "ngaiˇ ___ qi gaˊ xinˊ kuˋ.", answer_hanzi: "甘願", answer: "gamˊ ngien"}
      hl: {hanzi: "𠊎___自家辛苦。", pinyin: "ngai ___ cid gaˋ sinˋ kuˊ.", answer_hanzi: "甘願", answer: "gamˋ ngien+"}

