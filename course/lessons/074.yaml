exercises:
  translate:
    - en: "Are you daft or what? I asked you to buy spring onions and you bought garlic!"
      sx: {hanzi: "你戇抑毋係？喊你買蔥仔，你嗄買著蒜仔轉來！", pinyin: "nˇ ngong ia mˇ he? ham nˇ maiˊ cungˊ eˋ, nˇ sa maiˊ doˋ son eˋ zonˋ loiˇ!"}
      hl: {hanzi: "你戇抑毋係？喊你買蔥仔，你嗄買著蒜仔轉來！", pinyin: "ngi ngongˇ rha+ m heˇ? hamˇ ngi maiˋ cungˋ er, ngi saˇ maiˋ doˊ sonˇ er zhonˊ loi!"}
    - en: "He has no confidence at all about tomorrow's interview."
      sx: {hanzi: "對天光日个面試，佢全無信心。", pinyin: "dui tienˊ gongˊ ngidˋ ge mien cii, giˇ qionˇ moˇ xin ximˊ."}
      hl: {hanzi: "對韶早个面試，佢全無信心。", pinyin: "duiˇ shau zoˊ gaiˇ mienˇ chiˇ, gi cion mo sinˇ simˋ."}
    - en: "Don't you forget, now!"
      sx: {hanzi: "毋好毋記得哦！", pinyin: "mˇ hoˋ mˇ gi dedˋ oˋ!"}
      hl: {hanzi: "毋好毋記得哦！", pinyin: "m hoˊ m giˇ ded oˊ!"}
    - en: "Her Hakka is getting better and better."
      sx: {hanzi: "佢个客話越來越好。", pinyin: "giˇ ge hagˋ fa ied loiˇ ied hoˋ."}
      hl: {hanzi: "佢个客話越來越好。", pinyin: "gi gaiˇ hag voiˋ rhadˋ loi rhadˋ hoˊ."}
    - en: "This matters a lot: on no account forget it."
      sx: {hanzi: "這件事當重要，千萬毋好毋記得。", pinyin: "iaˋ kien sii dongˊ cung ieu, qienˊ van mˇ hoˋ mˇ gi dedˋ."}
      hl: {hanzi: "這件事當重要，千萬毋好毋記得。", pinyin: "liaˊ kien+ sii+ dongˋ chung+ rhauˇ, cienˋ van+ m hoˊ m giˇ ded."}
    - en: "Today he wore a suit specially, for the interview. Good luck!"
      sx: {hanzi: "佢今晡日為著參加面試，特別著西裝。祝佢好運！", pinyin: "giˇ gimˊ buˊ ngidˋ vi doˋ camˊ gaˊ mien cii, tid pied zogˋ xiˊ zongˊ. zugˋ giˇ hoˋ iun!"}
      hl: {hanzi: "佢今晡日為著參加面試，特別著西裝。祝佢好運！", pinyin: "gi gimˋ buˋ ngid vui+ doˊ camˋ gaˋ mienˇ chiˇ, tidˋ piedˋ zhog siˋ zongˋ. zhug gi hoˊ rhun+!"}
