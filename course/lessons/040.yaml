exercises:
  translate:
    - en: "Please get me a newspaper."
      sx: {hanzi: "拜託，摎𠊎拿一張報紙。", pinyin: "bai togˋ, lauˊ ngaiˇ naˊ idˋ zongˊ bo ziiˋ."}
      hl: {hanzi: "拜託，摎𠊎拿一張報紙。", pinyin: "baiˇ tog, lauˋ ngai naˋ rhid zhongˋ boˇ zhiˊ."}
    - en: "A-min is tall; Grandma is short."
      sx: {hanzi: "阿明當高，阿婆當矮。", pinyin: "aˊ minˇ dongˊ goˊ, aˊ poˇ dongˊ aiˋ."}
      hl: {hanzi: "阿明當高，阿婆當矮。", pinyin: "a+ min dongˋ goˋ, a+ po dongˋ aiˊ."}
    - en: "The grass in the tea field is long: cut it short."
      sx: {hanzi: "茶園个草當長，剪短來。", pinyin: "caˇ ienˇ ge coˋ dongˊ congˇ, jienˋ donˋ loiˇ."}
      hl: {hanzi: "茶園个草當長，剪短來。", pinyin: "ca rhan gaiˇ coˊ dongˋ chong, zienˊ donˊ loi."}
      check: true
    - en: "Grandpa cuts very neatly, and the rows are dead straight."
      sx: {hanzi: "阿公剪到當好勢，當直。", pinyin: "aˊ gungˊ jienˋ do dongˊ hoˋ se, dongˊ ciid."}
      hl: {hanzi: "阿公剪到當好勢，當直。", pinyin: "a+ gungˋ zienˊ doˇ dongˋ hoˊ sheˇ, dongˋ chidˋ."}
    - en: "The branches are too long: saw them shorter."
      sx: {hanzi: "樹椏忒長，用鋸仔鋸短。", pinyin: "su aˊ tedˋ congˇ, iung gi eˋ gi donˋ."}
      hl: {hanzi: "樹椏忒長，用鋸仔鋸短。", pinyin: "shu+ aˋ ted chong, rhung+ giˇ er giˇ donˊ."}
    - en: "Keep the new leaves; don't cut them off!"
      sx: {hanzi: "新葉留等，莫剪忒！", pinyin: "xinˊ iab liuˇ denˋ, mog jienˋ tedˋ!"}
      hl: {hanzi: "新葉留等，莫剪忒！", pinyin: "sinˋ rhabˋ liu denˊ, mogˋ zienˊ ted!"}
  fill:
    - en: "Can you give me a hand?"
      sx: {hanzi: "你做得摎𠊎___無？", pinyin: "nˇ zo dedˋ lauˊ ngaiˇ ___ moˇ?", answer_hanzi: "𢯭手", answer: "ten suˋ"}
      hl: {hanzi: "你做得摎𠊎___無？", pinyin: "ngi zoˇ ded lauˋ ngai ___ mo?", answer_hanzi: "𢯭手", answer: "tenˇ shiuˊ"}
    - en: "I'll come with you."
      sx: {hanzi: "𠊎___你去。", pinyin: "ngaiˇ ___ nˇ hi.", answer_hanzi: "跈", answer: "tenˇ"}
      hl: {hanzi: "𠊎___你去。", pinyin: "ngai ___ ngi hiˇ.", answer_hanzi: "跈", answer: "ten"}
    - en: "Let's do it together."
      sx: {hanzi: "𫣆兜___做。", pinyin: "enˊ deuˊ ___ zo.", answer_hanzi: "共下", answer: "kiung ha"}
      hl: {hanzi: "𫣆兜___做。", pinyin: "enˋ deuˋ ___ zoˇ.", answer_hanzi: "共下", answer: "kiung+ ha+"}

