exercises:
  translate:
    - en: "This umbrella is broken; it's no use to you."
      sx: {hanzi: "這枝遮仔壞吔，你借去乜無用。", pinyin: "iaˋ giˊ zaˊ eˋ fai leˊ, nˇ jia hi me moˇ iung."}
      hl: {hanzi: "這枝遮仔壞咧，你借去乜無用。", pinyin: "liaˊ giˋ zhaˋ er fai+ leˋ, ngi ziaˇ hiˇ meˇ mo rhung+."}
      source: moe
    - en: "Take an umbrella when you go out: it keeps off the sun."
      sx: {hanzi: "出去記得帶一枝遮仔抵日頭。", pinyin: "cudˋ hi gi dedˋ dai idˋ giˊ zaˊ eˋ daiˋ ngidˋ teuˇ."}
      hl: {hanzi: "出去記得帶一枝遮仔抵日頭。", pinyin: "chud hiˇ giˇ ded daiˇ rhid giˋ zhaˋ er diˊ ngid teu."}
    - en: "Mother's Day is coming: what are you going to buy for your mum?"
      sx: {hanzi: "母親節會到吔，你愛買麼个東西送若姆？", pinyin: "muˊ qinˊ jiedˋ voi do leˊ, nˇ oi maiˊ maˋ ge dungˊ xiˊ sung ngiaˊ meˊ?"}
      hl: {hanzi: "母親節會到咧，你愛買麼个東西送若姆？", pinyin: "muˋ cinˋ zied voi+ doˇ leˋ, ngi oiˇ maiˋ maˊ gaiˇ dungˋ siˋ sungˇ ngia meˋ?"}
    - en: "At New Year and at festivals, our maternal grandmother makes rice cakes for us."
      sx: {hanzi: "過年過節，姐婆都會做粄仔分𫣆食。", pinyin: "go ngienˇ go jiedˋ, jiaˋ poˇ du voi zo banˋ eˋ bunˊ enˊ siid."}
      hl: {hanzi: "過年過節，姐婆都會做粄仔分𫣆食。", pinyin: "goˇ ngien goˇ zied, ziaˊ po du+ voi+ zoˇ banˊ er bunˋ enˋ shidˋ."}
      source: moe
    - en: "The ribs are bamboo; the black oil is made with charcoal."
      sx: {hanzi: "骨係竹仔，烏油係用火炭煮个。", pinyin: "gudˋ he zugˋ eˇ, vuˊ iuˇ he iung foˋ tan zuˋ ge."}
      hl: {hanzi: "骨係竹仔，烏油係用火炭煮个。", pinyin: "gud heˇ zhug er, vuˋ rhiu heˇ rhung+ foˊ tanˇ zhuˊ gaiˇ."}
