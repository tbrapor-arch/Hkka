id: 72
title:
  en: "Paper umbrellas and 面帕粄"
  sx: {hanzi: "一枝紙遮仔", pinyin: "idˋ giˊ ziiˋ zaˊ eˋ"}
  hl: {hanzi: "一枝紙遮仔", pinyin: "rhid giˋ zhiˊ zhaˋ er"}
review: false
setting: >-
  The same Saturday, five o'clock. 鍾伯 has walked them to an umbrella workshop on the main street, where an old
  craftsman, 林師傅, is painting flowers on a half-open umbrella of oiled paper. Tomorrow is Mother's Day.
names: [美濃, 林師傅, 鍾伯, 鍾伯姆, 阿英, 苗栗]

dialogue:
  - n: 1
    speaker: 林師傅
    en: "Come and look. Umbrellas made of oiled paper are 美濃's most famous craft."
    sx: {hanzi: "油紙做个遮仔係美濃盡有名个手工藝。", pinyin: "iuˇ ziiˋ zo ge zaˊ eˋ he miˊ nungˇ qin iuˊ miangˇ ge suˋ gungˊ ngi."}
    hl: {hanzi: "油紙做个遮仔係美濃盡有名个手工藝。", pinyin: "rhiu zhiˊ zoˇ gaiˇ zhaˋ er heˇ mi nung cin+ rhiuˋ miang gaiˇ shiuˊ gungˋ ngi+."}
    source: moe
  - n: 2
    speaker: Sam
    en: "They're beautiful! What are they made of?"
    sx: {hanzi: "當靚！係用麼个做个？", pinyin: "dongˊ jiangˊ! he iung maˋ ge zo ge?"}
    hl: {hanzi: "當靚！係用麼个做个？", pinyin: "dongˋ ziangˋ! heˇ rhung+ maˊ gaiˇ zoˇ gaiˇ?"}
  - n: 3
    speaker: 林師傅
    en: "Bamboo for the ribs, paper on top. Then you paint the flowers, and coat it with tung oil, boiled with charcoal: then the paper won't spoil."
    sx: {hanzi: "竹仔做骨，紙做面。畫好花，再過搽桐油；桐油摎火炭共下煮，紙正毋會壞。", pinyin: "zugˋ eˇ zo gudˋ, ziiˋ zo mien. fa hoˋ faˊ, zai go caˇ tungˇ iuˇ; tungˇ iuˇ lauˊ foˋ tan kiung ha zuˋ, ziiˋ zang mˇ voi fai."}
    hl: {hanzi: "竹仔做骨，紙做面。畫好花，再過搽桐油；桐油摎火炭共下煮，紙正毋會壞。", pinyin: "zhug er zoˇ gud, zhiˊ zoˇ mienˇ. fa+ hoˊ faˋ, zaiˇ goˇ ca tung rhiu; tung rhiu lauˋ foˊ tanˇ kiung+ ha+ zhuˊ, zhiˊ zhangˇ m voi+ fai+."}
    check: true
  - n: 4
    speaker: 阿英
    en: "Tung oil? From the tung blossom?"
    sx: {hanzi: "桐油？就係桐花个油？", pinyin: "tungˇ iuˇ? qiu he tungˇ faˊ ge iuˇ?"}
    hl: {hanzi: "桐油？就係桐花个油？", pinyin: "tung rhiu? ciu+ heˇ tung faˋ gaiˇ rhiu?"}
  - n: 5
    speaker: 林師傅
    en: "That's it. When the blossom has gone, the tree bears seeds, and the oil comes from the seeds."
    sx: {hanzi: "係。桐花謝忒，就打子；油係對桐子來个。", pinyin: "he. tungˇ faˊ qia tedˋ, qiu daˋ ziiˋ; iuˇ he dui tungˇ ziiˋ loiˇ ge."}
    hl: {hanzi: "係。桐花謝忒，就打子；油係對桐子來个。", pinyin: "heˇ. tung faˋ cia+ ted, ciu+ daˊ ziiˊ; rhiu heˇ duiˇ tung ziiˊ loi gaiˇ."}
    check: true
  - n: 6
    speaker: Sam
    en: "So in the old days, umbrellas were for keeping off the rain?"
    sx: {hanzi: "頭擺个遮仔，係用來抵水个係無？", pinyin: "teuˇ baiˋ ge zaˊ eˋ, he iung loiˇ daiˋ suiˋ ge he moˇ?"}
    hl: {hanzi: "頭擺个遮仔，係用來抵水个係無？", pinyin: "teu baiˊ gaiˇ zhaˋ er, heˇ rhung+ loi diˊ shuiˊ gaiˇ heˇ mo?"}
  - n: 7
    speaker: 林師傅
    en: "Against the rain and the sun. Now, of all things, they've become works of art, for people to admire."
    sx: {hanzi: "抵水也抵日頭。這下嗄變成藝術品，分人欣賞。", pinyin: "daiˋ suiˋ ia daiˋ ngidˋ teuˇ. iaˋ ha sa bien sangˇ ngi sud pinˋ, bunˊ nginˇ himˊ songˋ."}
    hl: {hanzi: "抵水也抵日頭。這下嗄變成藝術品，分人欣賞。", pinyin: "diˊ shuiˊ rha+ diˊ ngid teu. liaˊ ha+ saˇ bienˇ shang ngi+ sudˋ pinˊ, bunˋ ngin hiunˋ shongˊ."}
  - n: 8
    speaker: 阿英
    en: "Mother's Day is coming. I want to buy one for my mum."
    sx: {hanzi: "母親節會到吔，𠊎愛買一枝送吾姆。", pinyin: "muˊ qinˊ jiedˋ voi do leˊ, ngaiˇ oi maiˊ idˋ giˊ sung ngaˊ meˊ."}
    hl: {hanzi: "母親節會到咧，𠊎愛買一枝送𠊎姆。", pinyin: "muˋ cinˋ zied voi+ doˇ leˋ, ngai oiˇ maiˋ rhid giˋ sungˇ ngai meˋ."}
  - n: 9
    speaker: 林師傅
    en: "This one, with the painted flowers: twelve hundred."
    sx: {hanzi: "這枝畫花个，一千二。", pinyin: "iaˋ giˊ fa faˊ ge, idˋ qienˊ ngi."}
    hl: {hanzi: "這枝畫花个，一千二。", pinyin: "liaˊ giˋ fa+ faˋ gaiˇ, rhid cienˋ ngi+."}
  - n: 10
    speaker: Sam
    en: "(to A-in, under his breath) Twelve hundred! 蓋 expensive!"
    sx: {hanzi: "一千二！蓋貴！", pinyin: "idˋ qienˊ ngi! goi gui!"}
    hl: {hanzi: "一千二！蓋貴！", pinyin: "rhid cienˋ ngi+! goiˇ guiˇ!"}
  - n: 11
    speaker: 阿英
    en: "(laughing) You've picked it up already! …All right, we'll just buy one."
    sx: {hanzi: "你學會吔！……好，𫣆買一枝就好。", pinyin: "nˇ hog voi leˊ! … hoˋ, enˊ maiˊ idˋ giˊ qiu hoˋ."}
    hl: {hanzi: "你學會咧！……好，𫣆買一枝就好。", pinyin: "ngi hogˋ voi+ leˋ! … hoˊ, enˋ maiˋ rhid giˋ ciu+ hoˊ."}
  - n: 12
    speaker: 鍾伯姆
    en: "(that evening, in the noodle shop) Two bowls of 面帕粄, and a plate of fried egg."
    sx: {hanzi: "兩碗面帕粄，一盤炒卵。", pinyin: "liongˋ vonˋ mien pa banˋ, idˋ panˇ cauˋ lonˋ."}
    hl: {hanzi: "兩碗面帕粄，一盤炒卵。", pinyin: "liongˊ vonˊ mienˇ paˇ banˊ, rhid pan cauˊ lonˊ."}
  - n: 13
    speaker: Sam
    en: "面帕粄… isn't it the same as Miaoli 粄條?"
    sx: {hanzi: "面帕粄……毋係同苗栗个粄條共樣？", pinyin: "mien pa banˋ … mˇ he tungˇ meuˇ lid ge banˋ tiauˇ kiung iong?"}
    hl: {hanzi: "面帕粄……毋係摎苗栗个粄條共樣？", pinyin: "mienˇ paˇ banˊ … m heˇ lauˋ miau lidˋ gaiˇ banˊ tiau kiung+ rhong+?"}
  - n: 14
    speaker: 鍾伯
    en: "The same, yes. But ours tastes better!"
    sx: {hanzi: "共樣係共樣，毋過𠊎等个較好食！", pinyin: "kiung iong he kiung iong, mˇ go ngaiˇ denˋ ge ka hoˋ siid!"}
    hl: {hanzi: "共樣係共樣，毋過𠊎兜个較好食！", pinyin: "kiung+ rhong+ heˇ kiung+ rhong+, m goˇ ngai deuˋ gaiˇ haˇ hoˊ shidˋ!"}
  - n: 15
    speaker: 阿英
    en: "(to Sam) Every place says its own tastes better."
    sx: {hanzi: "逐隻地方都講自家个較好食。", pinyin: "dagˋ zagˋ ti fongˊ du gongˋ qi gaˊ ge ka hoˋ siid."}
    hl: {hanzi: "逐隻地方都講自家个較好食。", pinyin: "dag zhag ti+ fongˋ du+ gongˊ cid gaˋ gaiˇ haˇ hoˊ shidˋ."}

notes:
  - ref: 1
    topic: culture
    text: >
      This line is an official example sentence, word for word: 油紙做个遮仔係美濃盡有名个手工藝. 盡有名 "the most
      famous": 盡 is "most" here, and just as often "very" (lesson 8). 手工藝 "handicraft":
      手 + 工藝 "craft". Another official sentence, about tung oil: 桐油摎火炭共下煮出來个烏油，係做紙遮仔當重要个材料
      "the black oil made by boiling tung oil with charcoal is an important material for paper umbrellas".
  - ref: 3
    topic: vocab
    text: >
      竹仔做骨，紙做面 "bamboo for the bones, paper for the face": 骨 gudˋ "bone, frame", 面 "face, surface". 搽 caˇ
      "apply, rub on" (oil, ointment, lipstick). The steps are general knowledge put in simple words; the line is marked
      for checking.
  - ref: 5
    topic: vocab
    text: >
      打子 "bear seed": 打 (lesson 33) + 子 ziiˋ "seed", as in the official 茶樹會打子，茶子做得做茶油. 謝忒 "wither, fall"
      (of flowers). The 桐花 of lesson 69 come back as oil on an umbrella.
  - ref: 6
    topic: grammar
    text: >
      用來 + verb "used for": 係用來抵水个 "was used to keep off the rain". 抵 daiˋ "block, shield from" (Hailu diˊ),
      a Hakka word: 抵水, 抵日頭. The examples are few: the Sixian official list has 抵水 and 抵雨 once each (and the dictionary twice each), the Hailu list 抵水 twice. The
      official sentence (line 7) writes 抵水, with 雨 as a bracketed alternative.
  - ref: 7
    topic: grammar
    text: >
      The official sentence: 油紙遮上早(頭擺)係用來抵水(雨)也(乜)抵日頭个，這下嗄變成藝術品，分人欣賞哩 (the brackets
      give alternative words). Here it is split between Sam and the craftsman. 嗄 (lesson 41) "of all things": nobody
      expected an umbrella to become a work of art. 變成 "become":
      變 (lesson 64) + 成. 藝術 "art" from lesson 67, + 品 "piece". 分人欣賞 "for people to admire": 分 + person + verb, "let someone…".
  - ref: 8
    topic: grammar
    text: >
      Measure words: 一枝遮仔 "an umbrella" (the official examples use 枝 or 支: 這枝遮仔壞吔), 一碗面帕粄, 一盤炒卵. The
      classifier comes between the number and the noun, and it is the classifier that 這 points at: 這枝畫花个 "this one
      with the flowers" (line 9), with the noun left out.
  - ref: 10
    topic: grammar
    text: >
      Sam's first southern word, in the wrong place: 蓋貴 "very dear" is grammatical, but in Miaoli people would say 當貴.
      學會 "have learnt (it)": 學 + 會, the same 會 as "can".
  - ref: 12
    topic: grammar
    text: >
      仔 links: 遮仔, 竹仔, 粄仔 (the general word for rice cakes: 過年過節，姐婆都會做粄仔). Before 仔 the syllable keeps its
      tone, and 仔 itself follows it closely (lesson 0).

