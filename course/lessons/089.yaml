id: 89
title:
  en: "Lost in the mountains"
  sx: {hanzi: "尋毋著路", pinyin: "qimˇ mˇ doˋ lu"}
  hl: {hanzi: "尋毋著路", pinyin: "cim m doˊ lu+"}
review: false
setting: >-
  Saturday 28 August. Sam and A-min have taken the bus to 南庄 and walked up into the hills above it. It is four in
  the afternoon, they are at the top, and the view is wonderful. Grandma knows where they are, roughly.
names: [南庄, 阿明, 阿姊]

dialogue:
  - n: 1
    speaker: 阿明
    en: "Sam, we've climbed right to the top! Look how wide the sky and the land are!"
    sx: {hanzi: "Sam，蹶山蹶到山崗頂了！你看，天闊地闊！", pinyin: "Sam, kied sanˊ kied do sanˊ gongˊ dangˋ leˊ! nˇ kon, tienˊ fadˋ ti fadˋ!"}
    hl: {hanzi: "Sam，蹶山蹶到山崗頂了！你看，天闊地闊！", pinyin: "Sam, kiedˋ sanˋ kiedˋ doˇ sanˋ gongˋ dangˊ leˋ! ngi konˇ, tienˋ fad ti+ fad!"}
  - n: 2
    speaker: Sam
    en: "Beautiful! But the mist is coming up. Shall we go back down?"
    sx: {hanzi: "當靚！毋過起濛紗煙了，𫣆兜轉去好無？", pinyin: "dongˊ jiangˊ! mˇ go hiˋ mungˇ saˊ ienˊ leˊ, enˊ deuˊ zonˋ hi hoˋ moˇ?"}
    hl: {hanzi: "當靚！毋過起濛紗了，𫣆兜轉去好無？", pinyin: "dongˋ ziangˋ! m goˇ hiˊ mung saˋ leˋ, enˋ deuˋ zhonˊ hiˇ hoˊ mo?"}
  - n: 3
    speaker: 阿明
    en: "OK. Let's take this path back."
    sx: {hanzi: "好。對這條山路轉去。", pinyin: "hoˋ. dui iaˋ tiauˇ sanˊ lu zonˋ hi."}
    hl: {hanzi: "好。對這條山路轉去。", pinyin: "hoˊ. duiˇ liaˊ tiau sanˋ lu+ zhonˊ hiˇ."}
  - n: 4
    speaker: Sam
    en: "(an hour later) A-min, this isn't the path we came up by. There was a fork back there."
    sx: {hanzi: "阿明，這條毋係𫣆兜上來个路。後背有岔路。", pinyin: "aˊ minˇ, iaˋ tiauˇ mˇ he enˊ deuˊ songˊ loiˇ ge lu. heu boi iuˊ ca lu."}
    hl: {hanzi: "阿明，這條毋係𫣆兜上來个路。後背有岔路。", pinyin: "a+ min, liaˊ tiau m heˇ enˋ deuˋ shongˋ loi gaiˇ lu+. heu+ boiˇ rhiuˋ caˇ lu+."}
  - n: 5
    speaker: 阿明
    en: "Should we have gone left, the one up ahead?"
    sx: {hanzi: "係毋係愛行左片，頭前該條？", pinyin: "he mˇ he oi hangˇ zoˋ pienˋ, teuˇ qienˇ ge tiauˇ?"}
    hl: {hanzi: "係毋係愛行左片，頭前該條？", pinyin: "heˇ m heˇ oiˇ hang zoˊ pienˊ, teu cien gai tiau?"}
  - n: 6
    speaker: Sam
    en: "I don't know… The mist's so thick I can't see the path. We can't find the way."
    sx: {hanzi: "𠊎毋知……濛紗煙恁重，看毋著路。𫣆兜撞走了。", pinyin: "ngaiˇ mˇ diˊ … mungˇ saˊ ienˊ anˋ cungˊ, kon mˇ doˋ lu. enˊ deuˊ cong zeuˋ leˊ."}
    hl: {hanzi: "𠊎毋知……濛煙恁重，看毋著路。𫣆兜撞走了。", pinyin: "ngai m diˋ … mung rhanˋ anˊ chungˋ, konˇ m doˊ lu+. enˋ deuˋ cong+ zeuˊ leˋ."}
  - n: 7
    speaker: 阿明
    en: "I'll phone my sister… No, the phone can't get through."
    sx: {hanzi: "𠊎打電話分阿姊……毋係，手機仔打毋出去。", pinyin: "ngaiˇ daˋ tien fa bunˊ aˊ jiˋ … mˇ he, suˋ giˊ eˋ daˋ mˇ cudˋ hi."}
    hl: {hanzi: "𠊎打電話分阿姊……毋係，手機打毋出去。", pinyin: "ngai daˊ tien+ faˇ bunˋ a+ ze … m heˇ, shiuˊ giˋ daˊ m chud hiˇ."}
  - n: 8
    speaker: Sam
    en: "Don't be frightened. Let's sit down and rest a bit."
    sx: {hanzi: "毋使驚。𫣆兜坐等來，歇一下。", pinyin: "mˇ siiˋ giangˊ. enˊ deuˊ coˊ denˋ loiˇ, hiedˋ idˋ ha."}
    hl: {hanzi: "毋使驚。𫣆兜坐等來，歇一下。", pinyin: "m siiˊ giangˋ. enˋ deuˋ coˋ denˊ loi, hied rhid ha+."}
  - n: 9
    speaker: 阿明
    en: "(stepping off the path, slipping) Ow! I've twisted my ankle!"
    sx: {hanzi: "啊！𠊎个腳目珠扭著了！", pinyin: "a! ngaiˇ ge giogˋ mugˋ zuˊ ngiuˋ doˋ leˊ!"}
    hl: {hanzi: "啊！𠊎个腳目珠偏著了！", pinyin: "a+! ngai gaiˇ giog mug zhuˋ pienˋ doˊ leˋ!"}
  - n: 10
    speaker: Sam
    en: "Does it hurt? Can you walk?"
    sx: {hanzi: "會痛無？行得無？", pinyin: "voi tung moˇ? hangˇ dedˋ moˇ?"}
    hl: {hanzi: "會痛無？行得無？", pinyin: "voi+ tungˇ mo? hang ded mo?"}
  - n: 11
    speaker: 阿明
    en: "It hurts. I can't walk on it."
    sx: {hanzi: "會痛。行毋得了。", pinyin: "voi tung. hangˇ mˇ dedˋ leˊ."}
    hl: {hanzi: "會痛。行毋得了。", pinyin: "voi+ tungˇ. hang m ded leˋ."}
  - n: 12
    speaker: Sam
    en: "The sun's going down… It'll be dark soon. At night it's cold up in the hills."
    sx: {hanzi: "日頭落山了……天愛斷烏了。暗晡夜山頂當寒。", pinyin: "ngidˋ teuˇ log sanˊ leˊ … tienˊ oi tonˊ vuˊ leˊ. am buˊ ia sanˊ dangˋ dongˊ honˇ."}
    hl: {hanzi: "日頭落山了……天愛斷烏了。暗晡夜山頂當冷。", pinyin: "ngid teu logˋ sanˋ leˋ … tienˋ oiˇ tonˋ vuˋ leˋ. amˇ buˋ rha+ sanˋ dangˊ dongˋ langˋ."}
  - n: 13
    speaker: 阿明
    en: "Sam… I'm scared. There are mosquitoes, and maybe snakes."
    sx: {hanzi: "Sam……𠊎驚。有蚊仔，驚怕還有蛇。", pinyin: "Sam … ngaiˇ giangˊ. iuˊ munˊ eˋ, giangˊ pa hanˇ iuˊ saˇ."}
    hl: {hanzi: "Sam……𠊎驚。有蚊仔，驚怕還有蛇。", pinyin: "Sam … ngai giangˋ. rhiuˋ munˋ er, giangˋ paˇ han rhiuˋ sha."}
  - n: 14
    speaker: Sam
    en: "Don't be. Grandma knows we came to 南庄. If we're not home by dark, she'll get people to come and look for us."
    sx: {hanzi: "毋使驚。阿婆知𫣆兜來南庄。若係斷烏還吂轉，佢會喊人來尋。", pinyin: "mˇ siiˋ giangˊ. aˊ poˇ diˊ enˊ deuˊ loiˇ namˇ zongˊ. na he tonˊ vuˊ hanˇ mangˇ zonˋ, giˇ voi ham nginˇ loiˇ qimˇ."}
    hl: {hanzi: "毋使驚。阿婆知𫣆兜來南庄。若係斷烏還吂轉，佢會喊人來尋。", pinyin: "m siiˊ giangˋ. a+ po diˋ enˋ deuˋ loi nam zhongˋ. na+ heˇ tonˋ vuˋ han mang zhonˊ, gi voi+ hamˇ ngin loi cim."}
  - n: 15
    speaker: 阿明
    en: "(an hour later) It's got so dark you can't even see a face."
    sx: {hanzi: "斷烏了，暗到人面都看毋著了。", pinyin: "tonˊ vuˊ leˊ, am do nginˇ mien du kon mˇ doˋ leˊ."}
    hl: {hanzi: "斷烏了，暗到人面都看毋著了。", pinyin: "tonˋ vuˋ leˋ, amˇ doˇ ngin mienˇ du+ konˇ m doˊ leˋ."}
    source: moe
  - n: 16
    speaker: Sam
    en: "I didn't bring a torch, but my phone still has some power. It'll light the path a little. Put your backpack under your foot."
    sx: {hanzi: "𠊎無帶手電筒仔，毋過𠊎个手機仔還有電，做得照一息仔路。你个背包拿來囥在腳下背。", pinyin: "ngaiˇ moˇ dai suˋ tien tungˇ eˋ, mˇ go ngaiˇ ge suˋ giˊ eˋ hanˇ iuˊ tien, zo dedˋ zeu idˋ xid eˋ lu. nˇ ge boi bauˊ naˊ loiˇ kong coiˊ giogˋ haˊ boi."}
    hl: {hanzi: "𠊎無帶手電筒仔，毋過𠊎个手機還有電，做得照一息仔路。你个背包拿來囥在腳下背。", pinyin: "ngai mo daiˇ shiuˊ tien+ tung er, m goˇ ngai gaiˇ shiuˊ giˋ han rhiuˋ tien+, zoˇ ded zhauˇ rhid sid er lu+. ngi gaiˇ boiˇ bauˋ naˋ loi kongˇ coiˋ giog haˋ boiˇ."}
    check: true

notes:
  - ref: 1
    topic: grammar
    text: >
      蹶山蹶到山崗頂 "climbed till we reached the top": the verb phrase said twice, with V到 + place the second time. The
      official example: 蹶山蹶到山崗頂，看著天闊地闊个風景，心情當暢快. 天闊地闊 "the sky wide, the land wide", 闊 fadˋ
      "wide" (the Mandarin 寬). 山崗 sanˊ gongˊ "hilltop, ridge".
  - ref: 2
    topic: vocab
    text: >
      起濛紗煙 "the mist rises": 濛紗煙 mungˇ saˊ ienˊ is the 2026 list's word for 霧 "mist, fog" (also written 濛沙煙),
      and 起濛煙 is "fog comes up". The examples: 朝晨頭起濛紗煙，大體會好天 "when mist rises early in the morning, the
      day is usually fine", and 山項濛沙煙恁重，看毋著對面个路 "the mist on the mountain is so thick you can't see the
      path opposite" (line 6). Hailu: the list gives 濛煙, and a Hailu example says 起濛紗个時節.
  - ref: 4
    topic: vocab
    text: >
      岔路 ca lu "a fork in the road". 𫣆兜上來个路 "the path we came up by": a relative clause with 个 (lesson 83).
  - ref: 6
    topic: grammar
    text: >
      Verb + 毋著 doˋ "can't manage to": 看毋著 "can't see" (MOE lists both readings, kon mˇ doˋ and kon mˇ cog), 尋毋著
      "can't find" (恁暗了，尋毋著車仔轉屋下 "so late, no car to get home"). The positive is 看著 / 尋著 (lessons 22, 33).
      尋毋著路 "can't find the way"; Hakka also has a word for "get lost": 撞走 cong zeuˋ (2026 list: 迷路), as in
      𫣆兜撞走了 (line 6). The syllabus form 行毋去 has no example; 行毋得 (line 11)
      does: 頭前个紅毛泥路歸條必壢，行毋得了 "the concrete road ahead had cracked from end to end: impassable".
  - ref: 7
    topic: grammar
    text: >
      毋係 at the start of a correction: "no, wait…". 打毋出去 "the call won't go out": V毋 + direction, the same pattern
      as 看毋著 (official, both accents: 電話分人切斷吔，打毋出去 "the line has been cut, calls won't go out").
  - ref: 11
    topic: grammar
    text: >
      行毋得 "can't walk (on it)": 得 after 毋 says the action isn't possible at all. 行得無？ (line 10) "can you walk?" is
      the question form.
  - ref: 14
    topic: grammar
    text: >
      佢會喊人來尋 "she'll get people to come and look": 會 for what will happen (lesson 34), 喊 + person + verb "have
      someone do" (lesson 10). Sam uses 𫣆兜 for "we" here: Grandma knows about both of them.
  - ref: 15
    topic: vocab
    text: >
      斷烏 tonˊ vuˊ "be pitch dark, night has fallen" (kaga115: 天色完全暗黑). A-min's line is the official sentence word
      for word; its Hailu line is the course's transposition.
  - ref: 16
    topic: grammar
    text: >
      照一息仔路 "light the path a little": 照 zeu "shine (on)", also "according to" (照𠊎看, lesson 86). 囥 kong "put away,
      tuck". 電 tien "electricity, power".

