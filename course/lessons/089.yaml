exercises:
  translate:
    - en: "After days of heavy rain, the mountain road has given way in many places."
      source: moe
      abridged: true
      sx: {hanzi: "連等落幾下日大雨，山路有當多地方崩忒了，大家出入當毋方便。", pinyin: "lienˇ denˋ log giˋ ha ngidˋ tai iˋ, sanˊ lu iuˊ dongˊ doˊ ti fongˊ benˊ tedˋ leˊ, tai gaˊ cudˋ ngib dongˊ mˇ fongˊ pien."}
      hl: {hanzi: "連等落幾下日大水，山路有當多地方崩忒了，大家出入當毋方便。", pinyin: "lien denˊ logˋ giˊ ha+ ngid tai+ shuiˊ, sanˋ lu+ rhiuˋ dongˋ doˋ ti+ fongˋ benˋ ted leˋ, tai+ gaˋ chud ngibˋ dongˋ m fongˋ pien+."}
    - en: "Ahead there's a stream, and a bridge over it."
      sx: {hanzi: "頭前有一條溪，溪項有一條橋。", pinyin: "teuˇ qienˇ iuˊ idˋ tiauˇ haiˊ, haiˊ hong iuˊ idˋ tiauˇ kieuˇ."}
      hl: {hanzi: "頭前有一條溪，溪項有一條橋。", pinyin: "teu cien rhiuˋ rhid tiau haiˋ, haiˋ hong+ rhiuˋ rhid tiau kiau."}
    - en: "Take a torch for the mountain at night."
      sx: {hanzi: "暗晡夜上山頂，愛帶手電筒仔。", pinyin: "am buˊ ia songˊ sanˊ dangˋ, oi dai suˋ tien tungˇ eˋ."}
      hl: {hanzi: "暗晡夜上山頂，愛帶手電筒仔。", pinyin: "amˇ buˋ rha+ shongˋ sanˋ dangˊ, oiˇ daiˇ shiuˊ tien+ tung er."}
    - en: "The clouds are low; we can't see the hilltop."
      sx: {hanzi: "雲當低，看毋著山崗頂。", pinyin: "iunˇ dongˊ daiˊ, kon mˇ doˋ sanˊ gongˊ dangˋ."}
      hl: {hanzi: "雲當低，看毋著山崗頂。", pinyin: "rhun dongˋ daiˋ, konˇ m doˊ sanˋ gongˋ dangˊ."}
    - en: "This stream is very wide."
      sx: {hanzi: "這條溪當闊。", pinyin: "iaˋ tiauˇ haiˊ dongˊ fadˋ."}
      hl: {hanzi: "這條溪當闊。", pinyin: "liaˊ tiau haiˋ dongˋ fad."}
    - en: "Speak loudly, and the hills give back an echo."
      sx: {hanzi: "大聲講，山項有回聲。", pinyin: "tai sangˊ gongˋ, sanˊ hong iuˊ fiˇ sangˊ."}
      hl: {hanzi: "大聲講，山項有回聲。", pinyin: "tai+ shangˋ gongˊ, sanˋ hong+ rhiuˋ fui shangˋ."}
      check: true
  fill:
    - en: "We can't find the way."
      sx: {hanzi: "𫣆兜尋___路。", pinyin: "enˊ deuˊ qimˇ ___ lu.", answer_hanzi: "毋著", answer: "mˇ doˋ"}
      hl: {hanzi: "𫣆兜尋___路。", pinyin: "enˋ deuˋ cim ___ lu+.", answer_hanzi: "毋著", answer: "m doˊ"}
    - en: "It's pitch dark."
      sx: {hanzi: "___了。", pinyin: "___ leˊ.", answer_hanzi: "斷烏", answer: "tonˊ vuˊ"}
      hl: {hanzi: "___了。", pinyin: "___ leˋ.", answer_hanzi: "斷烏", answer: "tonˋ vuˋ"}
    - en: "I can't walk on it any more."
      sx: {hanzi: "行___了。", pinyin: "hangˇ ___ leˊ.", answer_hanzi: "毋得", answer: "mˇ dedˋ"}
      hl: {hanzi: "行___了。", pinyin: "hang ___ leˋ.", answer_hanzi: "毋得", answer: "m ded"}

