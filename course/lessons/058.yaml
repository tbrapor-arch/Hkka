id: 58
title:
  en: "Colleagues"
  sx: {hanzi: "一頭食，一頭講", pinyin: "idˋ teuˇ siid, idˋ teuˇ gongˋ"}
  hl: {hanzi: "一頭食，一頭講", pinyin: "rhid teu shidˋ, rhid teu gongˊ"}
review: false
setting: >-
  Monday 1 March, nine o'clock: the break. The first batch of the day is boxed and the steamers are quiet for half
  an hour. 阿蘭嫂 has brought a pot from home; 阿傑 is eating with one hand and scrolling with the other.
names: [阿蘭嫂, 阿傑, 阿英, 苗栗, 新竹]

dialogue:
  - n: 1
    speaker: 阿蘭嫂
    en: "Take a break, have some breakfast. I've brought rice porridge, nice and hot, with dried radish and fermented tofu. Here are the spoons."
    sx: {hanzi: "歇一下，食朝。𠊎煮糜來了，燒燒，還有菜脯摎豆腐乳。湯匙在這。", pinyin: "hiedˋ idˋ ha, siid zeuˊ. ngaiˇ zuˋ moiˇ loiˇ leˊ, seuˊ seuˊ, hanˇ iuˊ coi puˋ lauˊ teu fu iˊ. tongˊ ciiˇ coiˊ iaˋ."}
    hl: {hanzi: "歇一下，食朝。𠊎煮糜來了，燒燒，還有菜脯摎豆腐乳。湯匙在這。", pinyin: "hied rhid ha+, shidˋ zhauˋ. ngai zhuˊ moi loi leˋ, shauˋ shauˋ, han rhiuˋ coiˇ buˊ lauˋ teu+ fu+ rhi. tongˋ shi coiˋ liaˊ."}
  - n: 2
    speaker: Sam
    en: "Porridge? Lovely! I always have bread in the morning."
    sx: {hanzi: "糜？當好！𠊎朝晨都食麵包。", pinyin: "moiˇ? dongˊ hoˋ! ngaiˇ zeuˊ siinˇ du siid mien bauˊ."}
    hl: {hanzi: "糜？當好！𠊎朝晨都食麵包。", pinyin: "moi? dongˋ hoˊ! ngai zhauˋ shin du+ shidˋ mien+ bauˋ."}
  - n: 3
    speaker: 阿蘭嫂
    en: "Do you Miaoli people say 糜 too?"
    sx: {hanzi: "你兜苗栗人乜講糜無？", pinyin: "nˇ deuˊ meuˇ lid nginˇ me gongˋ moiˇ moˇ?"}
    hl: {hanzi: "你兜苗栗人乜講糜無？", pinyin: "ngi deuˋ miau lidˋ ngin meˇ gongˊ moi mo?"}
  - n: 4
    speaker: 阿傑
    en: "Some say 糜, some say something else. Sam, your Hailu's getting better and better."
    sx: {hanzi: "有講糜个，乜有講別樣个。Sam，你个海陸話越來越好了。", pinyin: "iuˊ gongˋ moiˇ ge, me iuˊ gongˋ ped iong ge. Sam, nˇ ge hoiˋ liugˋ fa ied loiˇ ied hoˋ leˊ."}
    hl: {hanzi: "有講糜个，乜有講別樣个。Sam，你个海陸話越來越好了。", pinyin: "rhiuˋ gongˊ moi gaiˇ, meˇ rhiuˋ gongˊ pedˋ rhong+ gaiˇ. Sam, ngi gaiˇ hoiˊ liugˋ voiˋ rhadˋ loi rhadˋ hoˊ leˋ."}
  - n: 5
    speaker: Sam
    en: "Better and better? No: the more I speak, the more mixed up it gets."
    sx: {hanzi: "越來越好？毋係，緊講緊亂。", pinyin: "ied loiˇ ied hoˋ? mˇ he, ginˋ gongˋ ginˋ lon."}
    hl: {hanzi: "越來越好？毋係，緊講緊亂。", pinyin: "rhadˋ loi rhadˋ hoˊ? m heˇ, ginˊ gongˊ ginˊ lon+."}
  - n: 6
    speaker: 阿蘭嫂
    en: "That's how it is to start with. It'll come."
    sx: {hanzi: "一開始都係恁樣。慢慢就會。", pinyin: "idˋ koiˊ ciiˋ du he anˋ ngiongˇ. man man qiu voi."}
    hl: {hanzi: "一開始都係恁樣。慢慢就會。", pinyin: "rhid koiˋ shiˊ du+ heˇ an ngiong. man+ man+ ciu+ voi+."}
    check: true
  - n: 7
    speaker: 阿傑
    en: "(eating and looking at his phone at the same time) Sam… has A-in got a boyfriend?"
    sx: {hanzi: "Sam……阿英有男朋友無？", pinyin: "Sam … aˊ inˊ iuˊ namˇ penˇ iuˊ moˇ?"}
    hl: {hanzi: "Sam……阿英有男朋友無？", pinyin: "Sam … a+ rhinˋ rhiuˋ nam pen rhiuˋ mo?"}
  - n: 8
    speaker: Sam
    en: "Why ask me?"
    sx: {hanzi: "做麼个問𠊎？", pinyin: "zo maˋ ge mun ngaiˇ?"}
    hl: {hanzi: "做麼个問𠊎？", pinyin: "zoˇ maˊ gaiˇ munˇ ngai?"}
  - n: 9
    speaker: 阿傑
    en: "On the second day of the New Year I saw her on the old street. She's really pretty!"
    sx: {hanzi: "初二𠊎在老街看著佢。當靚！", pinyin: "cuˊ ngi ngaiˇ coiˊ loˋ gieˊ kon doˋ giˇ. dongˊ jiangˊ!"}
    hl: {hanzi: "初二𠊎在老街看著佢。當靚！", pinyin: "cuˋ ngi+ ngai coiˋ loˊ gaiˋ konˇ doˊ gi. dongˋ ziangˋ!"}
  - n: 10
    speaker: 阿蘭嫂
    en: "阿傑, don't talk and eat at the same time: it's easy to get distracted."
    sx: {hanzi: "阿傑，莫一頭食，一頭講話，容易分心。", pinyin: "aˊ kiedˋ, mog idˋ teuˇ siid, idˋ teuˇ gongˋ fa, iungˇ i funˊ ximˊ."}
    hl: {hanzi: "阿傑，莫一頭食，一頭講話，容易分心。", pinyin: "a+ kied, mogˋ rhid teu shidˋ, rhid teu gongˊ faˇ, rhung rhiˇ funˋ simˋ."}
  - n: 11
    speaker: Sam
    en: "I… I don't know."
    sx: {hanzi: "𠊎……𠊎毋知。", pinyin: "ngaiˇ … ngaiˇ mˇ diˊ."}
    hl: {hanzi: "𠊎……𠊎毋知。", pinyin: "ngai … ngai m diˋ."}
  - n: 12
    speaker: 阿蘭嫂
    en: "Look at that: Sam's embarrassed! He's gone all red in the face!"
    sx: {hanzi: "你看，Sam 見笑了！面紅紅！", pinyin: "nˇ kon, Sam gien seu leˊ! mien fungˇ fungˇ!"}
    hl: {hanzi: "你看，Sam 見笑了！面紅紅！", pinyin: "ngi konˇ, Sam gienˇ siauˇ leˋ! mienˇ fung fung!"}
  - n: 13
    speaker: 阿傑
    en: "Ohh… I get it."
    sx: {hanzi: "……𠊎知了。", pinyin: "… ngaiˇ diˊ leˊ."}
    hl: {hanzi: "……𠊎知了。", pinyin: "… ngai diˋ leˋ."}
  - n: 14
    speaker: 阿蘭嫂
    en: "That's enough chatter. Back to work! The more you chat, the less you get done."
    sx: {hanzi: "好了，莫打嘴鼓了，做事！緊打嘴鼓，緊做毋煞。", pinyin: "hoˋ leˊ, mog daˋ zoi guˋ leˊ, zo se! ginˋ daˋ zoi guˋ, ginˋ zo mˇ sod."}
    hl: {hanzi: "好了，莫打嘴鼓了，做事！緊打嘴鼓，緊做毋煞。", pinyin: "hoˊ leˋ, mogˋ daˊ zhoiˇ guˊ leˋ, zoˇ she+! ginˊ daˊ zhoiˇ guˊ, ginˊ zoˇ m sod."}
    check: true

notes:
  - ref: 1
    topic: vocab
    text: >
      歇一下 "take a break": 歇 (lesson 22) + 一下 "a moment". 糜 moiˇ "rice porridge"; 燒燒 "nice and hot", the AA of
      lesson 45. 食朝 "breakfast" (lesson 25): at
      a factory that starts at five, breakfast is at nine.
  - ref: 3
    topic: hailu
    text: >
      Not a trip-up this time, and 阿蘭嫂 is checking. The word lists give Sixian 粥 zugˋ (lesson 3) and Hailu 糜 moi for
      "rice porridge"; but Sixian official examples use 糜 as well (𠊎盡好食糜傍豆腐乳 "I love rice porridge with
      fermented tofu", with 粥 given as the alternative; 盡 there is "really", and the Hailu version has 最, as in lesson
      26's 最惜). So 阿傑's answer in line 4 is exact: some Miaoli people say 糜,
      some say 粥. 你兜苗栗人 "you Miaoli people": 你兜 + a noun.
  - ref: 4
    topic: grammar
    text: >
      越來越 ied loiˇ ied "more and more": 越來越好 "better and better", 越來越少 "fewer and fewer". It is the newer
      pattern, from Mandarin, and it is everywhere in the official examples (93 of them). 有講糜个，乜有講別樣个 "some say
      糜, some say something else": 有 + verb + 个. 海陸話 "Hailu (speech)": 海陸 + 話, as 四縣話 (lesson 53).
  - ref: 5
    topic: grammar
    text: >
      緊講緊亂 "the more I speak, the more mixed up it gets": 緊 X 緊 Y, the Hakka pattern (lesson 51: 緊食緊愛食). The
      official examples use it for the same things Mandarin uses 越…越 for: 這下个筆記型電腦，緊做緊輕 "laptops get
      lighter and lighter". 亂 lon "in a muddle".
  - ref: 6
    topic: grammar
    text: >
      一開始 idˋ koiˊ ciiˋ "at first, to begin with": 一 + 開始 "begin" (逐件事情个一開始會較難 "everything is harder at
      the start"). Not 頭先, which is "just now" (lesson 33).
  - ref: 7
    topic: vocab
    text: >
      男朋友 "boyfriend": 男 namˇ + 朋友, built like 女朋友 (lesson 32). 阿傑 is not shy.
  - ref: 9
    topic: grammar
    text: >
      初二𠊎在老街看著佢 "on 初二 I saw her on the old street": 阿傑 was in the crowd of lesson 54. 初二 cuˊ ngi "the second
      day (of the month, of the New Year)". 靚 "pretty" (lesson 15).
  - ref: 10
    topic: grammar
    text: >
      一頭…一頭… "while, at the same time": 莫一頭食，一頭講話 "don't eat and talk at the same time". The official example:
      一頭讀書，一頭搞電腦，容易分心 "studying and playing on the computer at the same time, you get distracted".
  - ref: 12
    topic: grammar
    text: >
      見笑 gien seu "embarrassed, shy": a Hakka word, not the Mandarin "laugh at". 面紅紅 "red in the face": the AA
      adjective of lesson 45, after its noun. The A-in and Sam thread moves one step:
      Sam does not answer, and his face does it for him.
  - ref: 14
    topic: vocab
    text: >
      打嘴鼓 daˋ zoi guˋ "chat, chatter", literally "beat the mouth drum". 做毋煞 "can't get it finished": 煞 "finish"
      (lesson 33), with 毋 in the middle. 阿蘭嫂's second sentence is a 緊…緊… of her own making: marked for checking.

