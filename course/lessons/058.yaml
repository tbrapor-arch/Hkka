exercises:
  translate:
    - en: "I love rice porridge with fermented tofu."
      sx: {hanzi: "𠊎盡好食糜傍豆腐乳。", pinyin: "ngaiˇ qin hau siid moiˇ bongˋ teu fu iˊ."}
      hl: {hanzi: "𠊎最好食糜傍豆腐乳。", pinyin: "ngai zuiˇ hauˇ shidˋ moi bongˊ teu+ fu+ rhi."}
    - en: "Grandma eats rice porridge in the morning; she doesn't like bread."
      sx: {hanzi: "阿婆朝晨食糜，毋好食麵包。", pinyin: "aˊ poˇ zeuˊ siinˇ siid moiˇ, mˇ hau siid mien bauˊ."}
      hl: {hanzi: "阿婆朝晨食糜，毋好食麵包。", pinyin: "a+ po zhauˋ shin shidˋ moi, m hauˇ shidˋ mien+ bauˋ."}
    - en: "Fermented tofu is made from tofu."
      sx: {hanzi: "豆腐乳係用豆腐做个。", pinyin: "teu fu iˊ he iung teu fu zo ge."}
      hl: {hanzi: "豆腐乳係用豆腐做个。", pinyin: "teu+ fu+ rhi heˇ rhung+ teu+ fu+ zoˇ gaiˇ."}
    - en: "阿傑 works at a company in 新竹 now? — No, at 阿舅's factory."
      sx: {hanzi: "阿傑這下在新竹个公司做事無？——毋係，在阿舅个工廠。", pinyin: "aˊ kiedˋ iaˋ ha coiˊ xinˊ zugˋ ge gungˊ siiˊ zo se moˇ? — mˇ he, coiˊ aˊ kiuˊ ge gungˊ congˋ."}
      hl: {hanzi: "阿傑這下在新竹个公司做事無？——毋係，在阿舅个工廠。", pinyin: "a+ kied liaˊ ha+ coiˋ sinˋ zhug gaiˇ gungˋ siiˋ zoˇ she+ mo? — m heˇ, coiˋ a+ kiuˋ gaiˇ gungˋ chong."}
    - en: "Studying and playing on the computer at the same time, you get distracted easily."
      sx: {hanzi: "一頭讀書，一頭搞電腦，容易分心。", pinyin: "idˋ teuˇ tug suˊ, idˋ teuˇ gauˋ tien noˋ, iungˇ i funˊ ximˊ."}
      hl: {hanzi: "一頭讀書，一頭搞電腦，容易分心。", pinyin: "rhid teu tugˋ shuˋ, rhid teu gauˊ tien+ noˊ, rhung rhiˇ funˋ simˋ."}
      source: kaga115
    - en: "Laptops these days get lighter and lighter."
      sx: {hanzi: "這下个筆記型電腦，緊做緊輕。", pinyin: "iaˋ ha ge bidˋ gi hinˇ tien noˋ, ginˋ zo ginˋ kiangˊ."}
      hl: {hanzi: "這下个筆記型電腦，緊做緊輕。", pinyin: "liaˊ ha+ gaiˇ bid giˇ hin tien+ noˊ, ginˊ zoˇ ginˊ kiangˋ."}
      source: kaga115
    - en: "There are fewer and fewer people who make 粄條 by hand."
      sx: {hanzi: "用手做粄條个人越來越少了。", pinyin: "iung suˋ zo banˋ tiauˇ ge nginˇ ied loiˇ ied seuˋ leˊ."}
      hl: {hanzi: "用手做粄條个人越來越少了。", pinyin: "rhung+ shiuˊ zoˇ banˊ tiau gaiˇ ngin rhadˋ loi rhadˋ shauˊ leˋ."}
    - en: "Rice porridge with dried radish: easy to eat."
      sx: {hanzi: "糜傍菜脯，當容易食。", pinyin: "moiˇ bongˋ coi puˋ, dongˊ iungˇ i siid."}
      hl: {hanzi: "糜傍菜脯，當容易食。", pinyin: "moi bongˊ coiˇ buˊ, dongˋ rhung rhiˇ shidˋ."}
      check: true
    - en: "阿傑's pay isn't much, but he likes it here."
      sx: {hanzi: "阿傑个薪水無幾多，毋過佢好在這做事。", pinyin: "aˊ kiedˋ ge xinˊ suiˋ moˇ giˋ doˊ, mˇ go giˇ hau coiˊ iaˋ zo se."}
      hl: {hanzi: "阿傑个薪水無幾多，毋過佢好在這做事。", pinyin: "a+ kied gaiˇ sinˋ shuiˊ mo giˊ doˋ, m goˇ gi hauˇ coiˋ liaˊ zoˇ she+."}
      check: true
  fill:
    - en: "Better and better."
      sx: {hanzi: "___好。", pinyin: "___ hoˋ.", answer_hanzi: "越來越", answer: "ied loiˇ ied"}
      hl: {hanzi: "___好。", pinyin: "___ hoˊ.", answer_hanzi: "越來越", answer: "rhadˋ loi rhadˋ"}
    - en: "The more I speak, the more mixed up it gets."
      sx: {hanzi: "___講___亂。", pinyin: "___ gongˋ ___ lon.", answer_hanzi: "緊", answer: "ginˋ"}
      hl: {hanzi: "___講___亂。", pinyin: "___ gongˊ ___ lon+.", answer_hanzi: "緊", answer: "ginˊ"}
    - en: "Don't eat and talk at the same time."
      sx: {hanzi: "莫___食，___講話。", pinyin: "mog ___ siid, ___ gongˋ fa.", answer_hanzi: "一頭", answer: "idˋ teuˇ"}
      hl: {hanzi: "莫___食，___講話。", pinyin: "mogˋ ___ shidˋ, ___ gongˊ faˇ.", answer_hanzi: "一頭", answer: "rhid teu"}

