exercises:
  translate:
    - en: "What does this song mean?"
      sx: {hanzi: "這條歌係麼个意思？", pinyin: "iaˋ tiauˇ goˊ he maˋ ge i sii?"}
      hl: {hanzi: "這條歌係麼个意思？", pinyin: "liaˊ tiau goˋ heˇ maˊ gaiˇ rhiˇ siiˇ?"}
    - en: "Do you understand? — I understand."
      sx: {hanzi: "你明白無？——𠊎明白。", pinyin: "nˇ minˇ ped moˇ? — ngaiˇ minˇ ped."}
      hl: {hanzi: "你明白無？——𠊎明白。", pinyin: "ngi min pagˋ mo? — ngai min pagˋ."}
    - en: "Be quiet, Grandpa is singing."
      sx: {hanzi: "恬恬，阿公在該唱歌。", pinyin: "diamˊ diamˊ, aˊ gungˊ du ge cong goˊ."}
      hl: {hanzi: "恬恬，阿公在該唱歌。", pinyin: "diamˋ diamˋ, a+ gungˋ diˇ gai chongˇ goˋ."}
    - en: "Grandma nags him every day: 'Go to the bank! Buy the cabbage!'"
      sx: {hanzi: "阿婆逐日唸佢：「去銀行！買白菜！」", pinyin: "aˊ poˇ dagˋ ngidˋ ngiam giˇ: hi ngiunˇ hongˇ! maiˊ pag coi!"}
      hl: {hanzi: "阿婆逐日唸佢：「去銀行！買白菜！」", pinyin: "a+ po dag ngid ngiam+ gi: hiˇ ngiun hong! maiˋ pagˋ coiˇ!"}
    - en: "What happened? — Nothing. Grandpa sang a song."
      sx: {hanzi: "發生麼个事？——無麼个。阿公唱一條歌。", pinyin: "fadˋ senˊ maˋ ge sii? — moˇ maˋ ge. aˊ gungˊ cong idˋ tiauˇ goˊ."}
      hl: {hanzi: "發生麼个事？——無麼个。阿公唱一條歌。", pinyin: "fad senˋ maˊ gaiˇ sii+? — mo maˊ gaiˇ. a+ gungˋ chongˇ rhid tiau goˋ."}
    - en: "Grandpa has drunk this kind of tea all his life."
      sx: {hanzi: "阿公一生人食這種茶。", pinyin: "aˊ gungˊ idˋ senˊ nginˇ siid iaˋ zungˋ caˇ."}
      hl: {hanzi: "阿公一生人食這種茶。", pinyin: "a+ gungˋ rhid senˋ ngin shidˋ liaˊ zhungˊ ca."}
    - en: "Raw vegetables? Hakka people don't eat them."
      sx: {hanzi: "生个菜？客家人毋食。", pinyin: "sangˊ ge coi? hagˋ gaˊ nginˇ mˇ siid."}
      hl: {hanzi: "生个菜？客家人毋食。", pinyin: "sangˋ gaiˇ coiˇ? hag gaˋ ngin m shidˋ."}
  fill:
    - en: "His voice is lovely."
      sx: {hanzi: "佢个聲當___。", pinyin: "giˇ ge sangˊ dongˊ ___.", answer_hanzi: "好聽", answer: "hoˋ tangˊ"}
      hl: {hanzi: "佢个聲當___。", pinyin: "gi gaiˇ shangˋ dongˋ ___.", answer_hanzi: "好聽", answer: "hoˊ tangˋ"}
    - en: "Two kinds of reading."
      sx: {hanzi: "兩___讀法。", pinyin: "liongˋ ___ tug fabˋ.", answer_hanzi: "種", answer: "zungˋ"}
      hl: {hanzi: "兩___讀法。", pinyin: "liongˊ ___ tugˋ fab.", answer_hanzi: "種", answer: "zhungˊ"}

