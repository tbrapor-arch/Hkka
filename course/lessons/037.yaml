id: 37
title:
  en: "Grandpa sings"
  sx: {hanzi: "唱一條山歌", pinyin: "cong idˋ tiauˇ sanˊ goˊ"}
  hl: {hanzi: "唱一條山歌", pinyin: "chongˇ rhid tiau sanˋ goˋ"}
review: false
setting: >-
  The same evening, after the guests have gone. The 擂茶 bowl is empty, Grandpa is in a good mood, and Sam remembers
  lesson 20, when Grandpa refused to sing.
names: [阿明]

dialogue:
  - n: 1
    speaker: Sam
    en: "Grandpa, you sang mountain songs in the tea garden in the old days. Will you sing me one tonight?"
    sx: {hanzi: "阿公，你頭擺在茶園唱山歌。今暗晡唱一條分𠊎聽，好無？", pinyin: "aˊ gungˊ, nˇ teuˇ baiˋ coiˊ caˇ ienˇ cong sanˊ goˊ. gimˊ am buˊ cong idˋ tiauˇ bunˊ ngaiˇ tangˊ, hoˋ moˇ?"}
    hl: {hanzi: "阿公，你頭擺在茶園唱山歌。今暗晡唱一條分𠊎聽，好無？", pinyin: "a+ gungˋ, ngi teu baiˊ coiˋ ca rhan chongˇ sanˋ goˋ. gimˋ amˇ buˋ chongˇ rhid tiau bunˋ ngai tangˋ, hoˊ mo?"}
  - n: 2
    speaker: 阿公
    en: "I'm old. My voice isn't nice to listen to any more."
    sx: {hanzi: "𠊎老吔，聲毋好聽吔。", pinyin: "ngaiˇ loˋ leˊ, sangˊ mˇ hoˋ tangˊ leˊ."}
    hl: {hanzi: "𠊎老咧，聲毋好聽咧。", pinyin: "ngai loˊ leˋ, shangˋ m hoˊ tangˋ leˋ."}
  - n: 3
    speaker: 阿婆
    en: "Don't listen to him. When he was young, everyone knew what a good singer he was."
    sx: {hanzi: "莫聽佢講。佢後生个時節，大家都知佢當會唱。", pinyin: "mog tangˊ giˇ gongˋ. giˇ heu sangˊ ge siiˇ jiedˋ, tai gaˊ du diˊ giˇ dongˊ voi cong."}
    hl: {hanzi: "莫聽佢講。佢後生个時節，大家都知佢當會唱。", pinyin: "mogˋ tangˋ gi gongˊ. gi heu+ sangˋ gaiˇ shi zied, tai+ gaˋ du+ diˋ gi dongˋ voi+ chongˇ."}
  - n: 4
    speaker: 阿婆
    en: "And I married him because I heard him sing."
    sx: {hanzi: "𠊎就係聽佢唱山歌，正嫁分佢个。", pinyin: "ngaiˇ qiu he tangˊ giˇ cong sanˊ goˊ, zang ga bunˊ giˇ ge."}
    hl: {hanzi: "𠊎就係聽佢唱山歌，正嫁分佢个。", pinyin: "ngai ciu+ heˇ tangˋ gi chongˇ sanˋ goˋ, zhangˇ gaˇ bunˋ gi gaiˇ."}
  - n: 5
    speaker: 阿明
    en: "What?! Grandma, you never told us that!"
    sx: {hanzi: "麼个？阿婆，你毋識講過！", pinyin: "maˋ ge? aˊ poˇ, nˇ mˇ siidˋ gongˋ go!"}
    hl: {hanzi: "麼个？阿婆，你毋識講過！", pinyin: "maˊ gaiˇ? a+ po, ngi m shid gongˊ goˇ!"}
  - n: 6
    speaker: 阿公
    en: "(after a long silence, clearing his throat, he sings) 'Youth comes rarely in a life: / I sing a mountain song to let my girl know.'"
    sx: {hanzi: "人生難得後生時，唱條山歌分妹知。", pinyin: "nginˇ senˊ nanˇ dedˋ heu sangˊ siiˇ, cong tiauˇ sanˊ goˊ bunˊ moi diˊ."}
    hl: {hanzi: "人生難得後生時，唱條山歌分妹知。", pinyin: "ngin senˋ nan ded heu+ sangˋ shi, chongˇ tiau sanˋ goˋ bunˋ moiˇ diˋ."}
  - n: 7
    speaker: 阿明
    en: "(as everyone claps) Grandpa, that was lovely!"
    sx: {hanzi: "阿公，當好聽！", pinyin: "aˊ gungˊ, dongˊ hoˋ tangˊ!"}
    hl: {hanzi: "阿公，當好聽！", pinyin: "a+ gungˋ, dongˋ hoˊ tangˋ!"}
  - n: 8
    speaker: Sam
    en: "人生 'senˊ'… 後生 'sangˊ'? The same character, read two ways?"
    sx: {hanzi: "人生……後生？同一隻字，兩種讀法？", pinyin: "nginˇ senˊ … heu sangˊ? tungˇ idˋ zagˋ sii, liongˋ zungˋ tug fabˋ?"}
    hl: {hanzi: "人生……後生？同一隻字，兩種讀法？", pinyin: "ngin senˋ … heu+ sangˋ? tung rhid zhag sii+, liongˊ zhungˊ tugˋ fab?"}
    check: true
  - n: 9
    speaker: 阿公
    en: "Yes. The way you read a word in books isn't the same as the way you say it."
    sx: {hanzi: "係。讀書个讀法同講話个講法無共樣。", pinyin: "he. tug suˊ ge tug fabˋ tungˇ gongˋ fa ge gongˋ fabˋ moˇ kiung iong."}
    hl: {hanzi: "係。讀書个讀法摎講話个講法無共樣。", pinyin: "heˇ. tugˋ shuˋ gaiˇ tugˋ fab lauˋ gongˊ faˇ gaiˇ gongˊ fab mo kiung+ rhong+."}
    check: true
  - n: 10
    speaker: 阿婆
    en: "(softly) You still remember that song?"
    sx: {hanzi: "你還記得這條歌？", pinyin: "nˇ hanˇ gi dedˋ iaˋ tiauˇ goˊ?"}
    hl: {hanzi: "你還記得這條歌？", pinyin: "ngi han giˇ ded liaˊ tiau goˋ?"}
  - n: 11
    speaker: 阿公
    en: "I remember. Fifty years now."
    sx: {hanzi: "記得。五十年吔。", pinyin: "gi dedˋ. ngˋ siib ngienˇ leˊ."}
    hl: {hanzi: "記得。五十年咧。", pinyin: "giˇ ded. ngˊ shibˋ ngien leˋ."}
  - n: 12
    speaker: 阿明
    en: "Grandpa, sing another one!"
    sx: {hanzi: "阿公，還愛一條！", pinyin: "aˊ gungˊ, hanˇ oi idˋ tiauˇ!"}
    hl: {hanzi: "阿公，還愛一條！", pinyin: "a+ gungˋ, han oiˇ rhid tiau!"}
  - n: 13
    speaker: 阿公
    en: "No more. (to Grandma, quietly) You sing."
    sx: {hanzi: "毋唱吔。……你唱。", pinyin: "mˇ cong leˊ. … nˇ cong."}
    hl: {hanzi: "毋唱咧。……你唱。", pinyin: "m chongˇ leˋ. … ngi chongˇ."}

notes:
  - ref: 2
    topic: grammar
    text: >
      聲 sangˊ "voice, sound"; 好聽 "nice to listen to" (好 hoˋ + 聽), like 好食 "tasty", 好看 "nice to look at": 毋好聽 "not
      nice to hear".
  - ref: 4
    topic: grammar
    text: >
      聽佢唱山歌，正嫁分佢 "heard him sing, and only then married him": 正 "only then" (lesson 24). 嫁分佢 "marry him": 嫁
      (lesson 23) + 分 "to". 就係…个 frames the whole explanation: "that's why".
  - ref: 6
    topic: culture
    text: >
      The verse is written for this course, in the shape of a 山歌 line: seven syllables, a pair of lines ending on
      時 / 知, which rhyme in Hailu (shi / diˋ); in Sixian, siiˇ / diˊ is only a near rhyme. Its pieces are attested:
      後生時 "one's youth", 唱條山歌 (愛唱山歌莫驚羞，唱條山歌結朋友), 分人知 "let someone know". Traditional 山歌 were improvised on the slopes, often as a sung exchange between a young man and a
      young woman. 妹 here is "my girl", the way songs address her; 阿哥 is the boy.
  - ref: 8
    topic: grammar
    text: >
      Two readings of one character. Many characters have an everyday reading, used in speech, and a learned reading,
      used in reading aloud and in words that came through books:
      生 sangˊ in 生日 "birthday", 後生 "young", 生 "raw"; senˊ in 人生 "life", 發生 "happen", 一生人 "a lifetime".
      白 pag in 白 "white", 白菜 "cabbage"; ped in 明白 "understand".
      行 hangˇ in 行路 "walk"; henˇ in 行為 "behaviour". (行 hongˇ in 銀行 "bank" is a different word, "a firm".)
      The dictionary gives each word its reading: learn the word, not the character.
  - ref: 9
    topic: vocab
    text: >
      讀法 "way of reading" and 講法 "way of saying": verb + 法 "the way of doing it". 講法 is in the lists; 讀法 is not, so
      lines 8 and 9 are marked for checking.
      同一隻字 "the same character": 字 (lesson 26), with 隻 as its classifier here.
  - ref: 13
    topic: culture
    text: >
      His reply to "another one" is two words, and the next song is Grandma's. You will hear it in a later lesson.
  - ref: 0
    topic: hailu
    text: >
      Hailu reads 明白 min pagˋ, with the everyday 白: the split between readings is not the same in every accent, which
      is one more reason to learn words, not characters.

