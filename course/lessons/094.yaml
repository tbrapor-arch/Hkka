      sx: {hanzi: "𠊎个心肝___。", pinyin: "ngaiˇ ge ximˊ gonˊ ___.", answer_hanzi: "七上八落", answer: "qidˋ songˊ badˋ log"}
      hl: {hanzi: "𠊎个心肝___。", pinyin: "ngai gaiˇ simˋ gonˋ ___.", answer_hanzi: "七上八落", answer: "cid shongˋ bad logˋ"}
