exercises:
  translate:
    - en: "Thinking she had to go on stage in a moment, my sister's heart was all of a flutter."
      sx: {hanzi: "想著等下愛上臺表演，老妹心頭就七上八落。", pinyin: "xiongˋ doˋ denˋ ha oi songˊ toiˇ beuˋ ienˊ, loˋ moi ximˊ teuˇ qiu qidˋ songˊ badˋ log."}
      hl: {hanzi: "想著等下愛上臺表演，老妹心頭就七上八落。", pinyin: "siongˊ doˊ denˊ ha+ oiˇ shongˋ toi biauˊ rhanˋ, loˊ moiˇ simˋ teu ciu+ cid shongˋ bad logˋ."}
      source: kaga115
    - en: "Your performance today was impressive. So good!"
      sx: {hanzi: "你今晡日个表現當厲害。恁會！", pinyin: "nˇ gimˊ buˊ ngidˋ ge beuˋ hien dongˊ li hoi. anˋ voi!"}
      hl: {hanzi: "你今晡日个表現當厲害。恁會！", pinyin: "ngi gimˋ buˋ ngid gaiˇ biauˊ hien+ dongˋ li+ hoi+. anˋ voi+!"}
    - en: "A-min was very brave on 南庄 that night."
      sx: {hanzi: "該暗晡在南庄，阿明當勇敢。", pinyin: "ge am buˊ coiˊ namˇ zongˊ, aˊ minˇ dongˊ iungˋ gamˋ."}
      hl: {hanzi: "該暗晡在南庄，阿明當勇敢。", pinyin: "gai amˇ buˋ coiˋ nam zhongˋ, a+ min dongˋ rhungˊ gamˊ."}
    - en: "I feel this speech is a bit too long: it goes over five minutes."
      sx: {hanzi: "𠊎試著這篇演講忒長了，超過五分鐘。", pinyin: "ngaiˇ cii doˋ iaˋ pienˊ ienˊ gongˋ tedˋ congˇ leˊ, ceuˊ go ngˋ funˊ zungˊ."}
      hl: {hanzi: "𠊎試著這篇演講忒長了，超過五分鐘。", pinyin: "ngai chiˇ doˊ liaˊ pienˋ rhanˋ gongˊ ted chong leˋ, chauˋ goˇ ngˊ funˋ zhungˋ."}
      check: true
