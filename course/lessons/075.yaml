id: 75
title:
  en: "A-in's interview"
  sx: {hanzi: "請你紹介自家", pinyin: "qiangˋ nˇ seu gie qi gaˊ"}
  hl: {hanzi: "請你紹介自家", pinyin: "ciangˊ ngi shauˇ gaiˇ cid gaˋ"}
review: false
setting: >-
  Monday 17 May, ten in the morning, a meeting room at the 苗栗 county office. A-in, in her best jacket, sits across
  the table from two interviewers: 彭主任, who runs the Hakka affairs section (彭主任 is "Director Peng": 主任 "head of a section"), and a younger colleague, 黃先生, who
  takes notes. Afterwards, at home.
names: [彭主任, 黃先生, 劉小姐, 劉英, 阿英, 苗栗, 美濃, 六堆]

dialogue:
  - n: 1
    speaker: 彭主任
    en: "Miss Liu, please sit down. Have you had lunch? …Ah no, it's only ten. Have you eaten this morning?"
    sx: {hanzi: "劉小姐，請坐。朝晨食過了無？", pinyin: "lauˇ seuˋ jiˋ, qiangˋ coˊ. zeuˊ siinˇ siid go leˊ moˇ?"}
    hl: {hanzi: "劉小姐，請坐。朝晨食過了無？", pinyin: "liu siauˊ ziˊ, ciangˊ coˋ. zhauˋ shin shidˋ goˇ leˋ mo?"}
    check: true
  - n: 2
    speaker: 阿英
    en: "I have, thank you."
    sx: {hanzi: "食過了。恁仔細。", pinyin: "siid go leˊ. anˋ ziiˋ se."}
    hl: {hanzi: "食過了。承蒙你。", pinyin: "shidˋ goˇ leˋ. shin mung ngi."}
  - n: 3
    speaker: 彭主任
    en: "Then first, would you introduce yourself?"
    sx: {hanzi: "先請你紹介自家。", pinyin: "xienˊ qiangˋ nˇ seu gie qi gaˊ."}
    hl: {hanzi: "先請你紹介自家。", pinyin: "senˋ ciangˊ ngi shauˇ gaiˇ cid gaˋ."}
  - n: 4
    speaker: 阿英
    en: "My name is Liu Ying; I'm from 苗栗. At university I studied literature, and I've worked for three years for a company in Taipei."
    sx: {hanzi: "𠊎安到劉英，苗栗人。大學讀个係文學，在臺北个公司做過三年。", pinyin: "ngaiˇ onˊ do lauˇ inˊ, meuˇ lidˋ nginˇ. tai hog tug ge he vunˇ hog, coiˊ toiˇ bedˋ ge gungˊ siiˊ zo go samˊ ngienˇ."}
    hl: {hanzi: "𠊎安到劉英，苗栗人。大學讀个係文學，在臺北个公司做過三年。", pinyin: "ngai onˋ doˇ liu rhinˋ, miau lid ngin. tai+ hogˋ tugˋ gaiˇ heˇ vun hogˋ, coiˋ toi bed gaiˇ gungˋ siiˋ zoˇ goˇ samˋ ngien."}
  - n: 5
    speaker: 彭主任
    en: "What are your ideas about Hakka culture?"
    sx: {hanzi: "你對客家文化有麼个想法？", pinyin: "nˇ dui hagˋ gaˊ vunˇ fa iuˊ maˋ ge xiongˋ fabˋ?"}
    hl: {hanzi: "你對客家文化有麼个想法？", pinyin: "ngi duiˇ hag gaˋ vun faˇ rhiuˋ maˊ gaiˇ siongˊ fab?"}
  - n: 6
    speaker: 阿英
    en: "Hakka culture isn't only in museums. It's in people's homes. My grandmother makes 粄 every year and sings mountain songs; my grandfather grows tea."
    sx: {hanzi: "客家文化毋係淨在博物館肚，係在大家个屋下。吾婆逐年做粄、唱山歌；吾公種茶。", pinyin: "hagˋ gaˊ vunˇ fa mˇ he qiang coiˊ bogˋ vud gonˋ duˋ, he coiˊ tai gaˊ ge vugˋ kaˊ. ngaˊ poˇ dagˋ ngienˇ zo banˋ, cong sanˊ goˊ; ngaˊ gungˊ zung caˇ."}
    hl: {hanzi: "客家文化毋係淨在博物館肚，係在大家个屋下。𠊎阿婆逐年做粄、唱山歌；𠊎阿公種茶。", pinyin: "hag gaˋ vun faˇ m heˇ ciang+ coiˋ bog vudˋ gonˊ duˊ, heˇ coiˋ tai+ gaˋ gaiˇ vug haˋ. ngai a+ po dag ngien zoˇ banˊ, chongˇ sanˋ goˋ; ngai a+ gungˋ zhungˇ ca."}
  - n: 7
    speaker: 黃先生
    en: "Have you ever been to 六堆?"
    sx: {hanzi: "你有去過六堆無？", pinyin: "nˇ iuˊ hi go liugˋ duiˊ moˇ?"}
    hl: {hanzi: "你有去過六堆無？", pinyin: "ngi rhiuˋ hiˇ goˇ liug duiˋ mo?"}
  - n: 8
    speaker: 阿英
    en: "Yes. Just last week I went to 美濃: I saw the tobacco barns and the paper umbrellas, and heard the southern accent."
    sx: {hanzi: "有。上禮拜正去過美濃，看過菸樓、紙遮仔，乜聽過南部个口音。", pinyin: "iuˊ. song liˊ bai zang hi go mi nungˇ, kon go ienˊ leuˇ, ziiˋ zaˊ eˋ, me tangˊ go namˇ pu ge kieuˋ imˊ."}
    hl: {hanzi: "有。上禮拜正去過美濃，看過菸樓、紙遮仔，乜聽過南部个口音。", pinyin: "rhiuˋ. shong+ liˋ baiˇ zhangˇ hiˇ goˇ mi nung, konˇ goˇ rhanˋ leu, zhiˊ zhaˋ er, meˇ tangˋ goˇ nam pu+ gaiˇ kieuˊ rhimˋ."}
  - n: 9
    speaker: 彭主任
    en: "If we took you on, when could you start?"
    sx: {hanzi: "若係請你來，你幾時做得上班？", pinyin: "na he qiangˋ nˇ loiˇ, nˇ giˋ siiˇ zo dedˋ songˊ banˊ?"}
    hl: {hanzi: "若係請你來，你幾時做得上班？", pinyin: "na+ heˇ ciangˊ ngi loi, ngi giˊ shi zoˇ ded shongˋ banˋ?"}
  - n: 10
    speaker: 阿英
    en: "Next month."
    sx: {hanzi: "下隻月就做得。", pinyin: "ha zagˋ ngied qiu zo dedˋ."}
    hl: {hanzi: "下隻月就做得。", pinyin: "ha+ zhag ngiedˋ ciu+ zoˇ ded."}
  - n: 11
    speaker: 彭主任
    en: "Good. We'll let you know. Thank you."
    sx: {hanzi: "好。𠊎兜會通知你。恁仔細。", pinyin: "hoˋ. ngaiˇ deuˊ voi tungˊ diˊ nˇ. anˋ ziiˋ se."}
    hl: {hanzi: "好。𠊎兜會通知你。承蒙你。", pinyin: "hoˊ. ngai deuˋ voi+ tungˋ diˋ ngi. shin mung ngi."}
  - n: 12
    speaker: 阿婆
    en: "(at home, four in the afternoon) The phone's ringing! A-in, it's for you!"
    sx: {hanzi: "電話響了！阿英，你个！", pinyin: "tien fa hiongˋ leˊ! aˊ inˊ, nˇ ge!"}
    hl: {hanzi: "電話響了！阿英，你个！", pinyin: "tien+ faˇ hiongˊ leˋ! a+ rhinˋ, ngi gaiˇ!"}
  - n: 13
    speaker: 阿英
    en: "(putting the phone down, very calmly) I've had the notice to start work. I've passed the interview."
    sx: {hanzi: "收著上班通知了。這擺个面試過關了。", pinyin: "suˊ doˋ songˊ banˊ tungˊ diˊ leˊ. iaˋ baiˋ ge mien cii go guanˊ leˊ."}
    hl: {hanzi: "收著上班通知了。這擺个面試過關了。", pinyin: "shiuˋ doˊ shongˋ banˋ tungˋ diˋ leˋ. liaˊ baiˊ gaiˇ mienˇ chiˇ goˇ guanˋ leˋ."}
  - n: 14
    speaker: Sam
    en: "Congratulations! So you're coming back to Miaoli!"
    sx: {hanzi: "恭喜！恁樣你愛轉來苗栗了！", pinyin: "giungˊ hiˋ! anˋ ngiongˇ nˇ oi zonˋ loiˇ meuˇ lidˋ leˊ!"}
    hl: {hanzi: "恭喜！恁樣你愛轉來苗栗了！", pinyin: "giungˋ hiˊ! an ngiong ngi oiˇ zhonˊ loi miau lid leˋ!"}
  - n: 15
    speaker: 阿英
    en: "I am. I've decided: I'm taking it."
    sx: {hanzi: "係。𠊎決定了，𠊎愛去。", pinyin: "he. ngaiˇ giedˋ tin leˊ, ngaiˇ oi hi."}
    hl: {hanzi: "係。𠊎決定了，𠊎愛去。", pinyin: "heˇ. ngai gied tin+ leˋ, ngai oiˇ hiˇ."}
  - n: 16
    speaker: 阿婆
    en: "Grandma's not interfering… but Grandma's very happy!"
    sx: {hanzi: "阿婆毋管……毋過阿婆當歡喜！", pinyin: "aˊ poˇ mˇ gonˋ … mˇ go aˊ poˇ dongˊ fonˊ hiˋ!"}
    hl: {hanzi: "阿婆毋管……毋過阿婆當歡喜！", pinyin: "a+ po m gonˊ … m goˇ a+ po dongˋ fonˋ hiˊ!"}

notes:
  - ref: 1
    topic: grammar
    text: >
      食過了無？ "have you eaten?": 過 after a verb marks something done and finished (食過飯了 "has had a meal"), as in the
      official example 阿公頭先食過飯咧 "Grandpa ate a moment ago". It is the polite opener even in an office. 劉小姐
      "Miss Liu" is how a stranger addresses her (小姐 is not in the word lists; the course treats the title as part of
      the name). The line is marked for checking.
  - ref: 4
    topic: grammar
    text: >
      The formal register: full sentences, no jokes, 𠊎安到… "my name is…" (lesson 22), 大學讀个係文學 "what I studied at
      university was literature" (a 个 clause as the subject), 做過三年 "worked for three years": 過 + length of time,
      done and over.
  - ref: 6
    topic: grammar
    text: >
      毋係淨…，係… "not only…, but…": 淨 (lesson 46) "only". 吾婆, 吾公 "my grandmother, my grandfather": in front of
      strangers A-in uses the possessive kin terms of lesson 2 (吾 + kin, no 个). The Hailu line says 𠊎阿婆, as Hailu
      does (lesson 2). 博物館 bogˋ vud gonˋ "museum".
  - ref: 7
    topic: grammar
    text: >
      有 + verb + 過 "have ever…": 你有去過六堆無？ "have you ever been to 六堆?", answered 有 "yes, I have" or 無 "no".
      The 有 marks something that has actually happened (已然), the 過 that it is in your experience. Line 8 strings
      three of them: 去過, 看過, 聽過.
  - ref: 13
    topic: grammar
    text: >
      An official example, almost word for word: 下晝收著上班通知，這擺个面試過關哩 "this afternoon he got the notice to
      start: he'd passed the interview". 過關 "get through, pass" (literally "pass the barrier"); 通知 "notice; notify"
      (line 11).
  - ref: 15
    topic: culture
    text: >
      The decision is A-in's, and she makes it the moment the phone call ends. Grandma, true to lesson 42, does not
      interfere; she merely announces her feelings.

