exercises:
  translate:
    - en: "Please fill in this form, and bring your CV."
      sx: {hanzi: "請你填這張表，履歷乜愛帶來。", pinyin: "qiangˋ nˇ tienˇ iaˋ zongˊ beuˋ, liˊ lid me oi dai loiˇ."}
      hl: {hanzi: "請你填這張表，履歷乜愛帶來。", pinyin: "ciangˊ ngi tien liaˊ zhongˋ biauˊ, liˋ lidˋ meˇ oiˇ daiˇ loi."}
    - en: "Have you ever been to a Hakka museum? — No, never."
      sx: {hanzi: "你有去過客家博物館無？——無，毋識去過。", pinyin: "nˇ iuˊ hi go hagˋ gaˊ bogˋ vud gonˋ moˇ? — moˇ, mˇ siidˋ hi go."}
      hl: {hanzi: "你有去過客家博物館無？——無，毋識去過。", pinyin: "ngi rhiuˋ hiˇ goˇ hag gaˋ bog vudˋ gonˊ mo? — mo, m shid hiˇ goˇ."}
    - en: "The plan: preserve the Hakka language, and promote it among young people."
      sx: {hanzi: "計畫係保存客家語言，向年輕人推廣。", pinyin: "gie vag he boˋ sunˇ hagˋ gaˊ ngiˊ ngienˇ, hiong ngienˇ kiangˊ nginˇ tuiˊ gongˋ."}
      hl: {hanzi: "計畫係保存客家語言，向年輕人推廣。", pinyin: "gieˇ vagˋ heˇ boˊ sun hag gaˋ ngiˋ ngien, hiongˇ ngien kiangˋ ngin tuiˋ gongˊ."}
      check: true
    - en: "She has worked for the government for a year, and organised many events."
      sx: {hanzi: "佢在公家做過一年，辦過當多活動。", pinyin: "giˇ coiˊ gungˊ gaˊ zo go idˋ ngienˇ, pan go dongˊ doˊ fad tung."}
      hl: {hanzi: "佢在公家做過一年，辦過當多活動。", pinyin: "gi coiˋ gungˋ gaˋ zoˇ goˇ rhid ngien, pan+ goˇ dongˋ doˋ fadˋ tung+."}
      check: true
    - en: "We'll send you the documents next month."
      sx: {hanzi: "下隻月𠊎兜會寄資料分你。", pinyin: "ha zagˋ ngied ngaiˇ deuˊ voi gi ziiˊ liau bunˊ nˇ."}
      hl: {hanzi: "下隻月𠊎兜會寄資料分你。", pinyin: "ha+ zhag ngiedˋ ngai deuˋ voi+ giˇ ziiˋ liau+ bunˋ ngi."}
    - en: "The director says everyone will be notified next month."
      sx: {hanzi: "主任講，下隻月會通知大家。", pinyin: "zuˋ im gongˋ, ha zagˋ ngied voi tungˊ diˊ tai gaˊ."}
      hl: {hanzi: "主任講，下隻月會通知大家。", pinyin: "zhuˊ rhim+ gongˊ, ha+ zhag ngiedˋ voi+ tungˋ diˋ tai+ gaˋ."}
  fill:
    - en: "Have you eaten?"
      sx: {hanzi: "食___了無？", pinyin: "siid ___ leˊ moˇ?", answer_hanzi: "過", answer: "go"}
      hl: {hanzi: "食___了無？", pinyin: "shidˋ ___ leˋ mo?", answer_hanzi: "過", answer: "goˇ"}
    - en: "Have you ever been to 美濃?"
      sx: {hanzi: "你___去過美濃無？", pinyin: "nˇ ___ hi go mi nungˇ moˇ?", answer_hanzi: "有", answer: "iuˊ"}
      hl: {hanzi: "你___去過美濃無？", pinyin: "ngi ___ hiˇ goˇ mi nung mo?", answer_hanzi: "有", answer: "rhiuˋ"}
    - en: "I've passed the interview."
      sx: {hanzi: "面試___了。", pinyin: "mien cii ___ leˊ.", answer_hanzi: "過關", answer: "go guanˊ"}
      hl: {hanzi: "面試___了。", pinyin: "mienˇ chiˇ ___ leˋ.", answer_hanzi: "過關", answer: "goˇ guanˋ"}

