id: 38
title:
  en: "Sam's treat"
  sx: {hanzi: "食加一碗添", pinyin: "siid gaˊ idˋ vonˋ tiamˊ"}
  hl: {hanzi: "食加一碗添", pinyin: "shidˋ gaˋ rhid vonˊ tiamˋ"}
review: false
setting: >-
  Tuesday evening. To thank the family for Lucie's week, Sam takes them out to a Hakka restaurant in town. A round
  table, a menu, and a draught from the door.
names: [阿明, 客家小炒, Lucie]

dialogue:
  - n: 1
    speaker: Sam
    en: "(arriving, to the waiter) Excuse me, have you got a round table?"
    sx: {hanzi: "失禮，有圓桌無？", pinyin: "siidˋ liˊ, iuˊ ienˇ zogˋ moˇ?"}
    hl: {hanzi: "失禮，有圓桌無？", pinyin: "shid liˋ, rhiuˋ rhan zog mo?"}
  - n: 2
    speaker: Sam
    en: "Tonight's on me! Order as much as you like from the menu."
    sx: {hanzi: "今暗晡𠊎請！菜單項个菜盡量點。", pinyin: "gimˊ am buˊ ngaiˇ qiangˋ! coi danˊ hong ge coi qin liong diamˋ."}
    hl: {hanzi: "今暗晡𠊎請！菜單項个菜盡量點。", pinyin: "gimˋ amˇ buˋ ngai ciangˊ! coiˇ danˋ hong+ gaiˇ coiˇ cin+ liong+ diamˊ."}
  - n: 3
    speaker: 阿婆
    en: "No need for so much. Three or four dishes will do."
    sx: {hanzi: "毋使恁多，點三四盤就好。", pinyin: "mˇ siiˋ anˋ doˊ, diamˋ samˊ xi panˇ qiu hoˋ."}
    hl: {hanzi: "毋使恁多，點三四盤就好。", pinyin: "m siiˊ anˊ doˋ, diamˊ samˋ siˇ pan ciu+ hoˊ."}
  - n: 4
    speaker: 服務生
    en: "What would you like?"
    sx: {hanzi: "你兜愛食麼个？", pinyin: "nˇ deuˊ oi siid maˋ ge?"}
    hl: {hanzi: "你兜愛食麼个？", pinyin: "ngi deuˋ oiˇ shidˋ maˊ gaiˇ?"}
  - n: 5
    speaker: 阿明
    en: "客家小炒, pork, cabbage, and a big bowl of soup!"
    sx: {hanzi: "客家小炒、豬肉、白菜，還有一碗公湯！", pinyin: "hagˋ gaˊ seuˋ cauˋ, zuˊ ngiugˋ, pag coi, hanˇ iuˊ idˋ vonˋ gungˊ tongˊ!"}
    hl: {hanzi: "客家小炒、豬肉、白菜，還有一碗公湯！", pinyin: "hag gaˋ siauˊ cauˊ, zhuˋ ngiug, pagˋ coiˇ, han rhiuˋ rhid vonˊ gungˋ tongˋ!"}
  - n: 6
    speaker: 阿婆
    en: "Go easy on the salt in the dishes: Grandpa mustn't eat things that salty."
    sx: {hanzi: "菜放少兜鹽，阿公做毋得食恁鹹。", pinyin: "coi biong seuˋ deuˊ iamˇ, aˊ gungˊ zo mˇ dedˋ siid anˋ hamˇ."}
    hl: {hanzi: "菜放少兜鹽，阿公做毋得食恁鹹。", pinyin: "coiˇ biongˇ shauˊ deuˋ rham, a+ gungˋ zoˇ m ded shidˋ anˊ ham."}
  - n: 7
    speaker: 阿公
    en: "(pulling his collar up) The door's open. It's cold in here."
    sx: {hanzi: "門開等，這位當寒。", pinyin: "munˇ koiˊ denˋ, iaˋ vi dongˊ honˇ."}
    hl: {hanzi: "門開等，這位當冷。", pinyin: "mun koiˋ denˊ, liaˊ vui+ dongˋ langˋ."}
  - n: 8
    speaker: 阿婆
    en: "You're a layer short! Your thick jacket went home with Lucie."
    sx: {hanzi: "你著少一領衫！你个燒暖衫分 Lucie 著轉去吔。", pinyin: "nˇ zogˋ seuˋ idˋ liangˊ samˊ! nˇ ge seuˊ nonˊ samˊ bunˊ Lucie zogˋ zonˋ hi leˊ."}
    hl: {hanzi: "你著少一領衫！你个燒暖衫分 Lucie 著轉去咧。", pinyin: "ngi zhog shauˊ rhid liangˋ samˋ! ngi gaiˇ shauˋ nonˋ samˋ bunˋ Lucie zhog zhonˊ hiˇ leˋ."}
    check: true
  - n: 9
    speaker: Sam
    en: "Sorry, Grandpa…"
    sx: {hanzi: "阿公，敗勢……", pinyin: "aˊ gungˊ, paiˇ se …"}
    hl: {hanzi: "阿公，敗勢……", pinyin: "a+ gungˋ, pai+ sheˇ …"}
  - n: 10
    speaker: 阿公
    en: "Never mind. Once I've eaten I'll be warm."
    sx: {hanzi: "無要緊。食飽就燒暖吔。", pinyin: "moˇ ieu ginˋ. siid bauˋ qiu seuˊ nonˊ leˊ."}
    hl: {hanzi: "無要緊。食飽就燒暖咧。", pinyin: "moˇ rhauˇ ginˊ. shidˋ bauˊ ciu+ shauˋ nonˋ leˋ."}
  - n: 11
    speaker: 阿明
    en: "(half an hour later) Waiter, another bowl of rice! (to the table) Sam's paying, so I'm having another bowl!"
    sx: {hanzi: "服務生，加一碗飯！……Sam 請，𠊎愛食加一碗添！", pinyin: "fug vu senˊ, gaˊ idˋ vonˋ fan! … Sam qiangˋ, ngaiˇ oi siid gaˊ idˋ vonˋ tiamˊ!"}
    hl: {hanzi: "服務生，加一碗飯！……Sam 請，𠊎愛食加一碗添！", pinyin: "fugˋ muˇ senˋ, gaˋ rhid vonˊ pon+! … Sam ciangˊ, ngai oiˇ shidˋ gaˋ rhid vonˊ tiamˋ!"}
    check: true
  - n: 12
    speaker: 阿婆
    en: "That's three already! In a moment you won't be able to eat any more."
    sx: {hanzi: "你食三碗吔！等下食毋落。", pinyin: "nˇ siid samˊ vonˋ leˊ! denˋ ha siid mˇ log."}
    hl: {hanzi: "你食三碗咧！等下食毋落。", pinyin: "ngi shidˋ samˋ vonˊ leˋ! denˊ ha+ shidˋ m logˋ."}
  - n: 13
    speaker: Sam
    en: "(at the end, at the counter, to the owner) The bill, please."
    sx: {hanzi: "頭家，算數。", pinyin: "teuˇ gaˊ, son sii."}
    hl: {hanzi: "頭家，算數。", pinyin: "teu gaˋ, sonˇ siiˇ."}
    check: true
  - n: 14
    speaker: 頭家
    en: "It's been paid. The lady paid a moment ago."
    sx: {hanzi: "算過吔。該隻阿婆頭先算忒吔。", pinyin: "son go leˊ. ge zagˋ aˊ poˇ teuˇ xienˊ son tedˋ leˊ."}
    hl: {hanzi: "算過咧。該隻阿婆頭先算忒咧。", pinyin: "sonˇ goˇ leˋ. gai zhag a+ po teu senˋ sonˇ ted leˋ."}
    check: true
  - n: 15
    speaker: Sam
    en: "Grandma! We agreed I was paying!"
    sx: {hanzi: "阿婆！講好係𠊎請个！", pinyin: "aˊ poˇ! gongˋ hoˋ he ngaiˇ qiangˋ ge!"}
    hl: {hanzi: "阿婆！講好係𠊎請个！", pinyin: "a+ po! gongˊ hoˊ heˇ ngai ciangˊ gaiˇ!"}
  - n: 16
    speaker: 阿婆
    en: "Next time."
    sx: {hanzi: "下二擺。", pinyin: "ha ngi baiˋ."}
    hl: {hanzi: "下二擺。", pinyin: "ha+ ngi+ baiˊ."}

notes:
  - ref: 2
    topic: grammar
    text: >
      𠊎請 "I'm treating, it's on me": 請 (lesson 16, "invite") alone. 菜單項个菜盡量點 "order as much as you like from the
      menu" is almost word for word an official example sentence: the formula of every host. 點 "order (a dish)".
  - ref: 3
    topic: grammar
    text: >
      三四盤 "three or four dishes": two numbers side by side are "about", as in Mandarin. 盤 "plate" (lesson 27) counts
      the dishes.
  - ref: 6
    topic: grammar
    text: >
      放少兜鹽 "put in less salt": 少兜 "a bit less" goes after the verb, before the thing, exactly like 加: 加兜鹽 "a bit
      more salt". The official example: 這盤菜放少兜鹽就毋會恁鹹 "put less salt in this dish and it won't be so salty".
  - ref: 8
    topic: grammar
    text: >
      著少一領衫 "wearing one layer too few": verb + 少 + amount says you did too little of it; verb + 加 + amount (line
      10) says do more. Both words sit between the verb and the number. The 加 form is well attested (著加一領衫添 "put
      on one more layer"); the 少 form of this exact line is marked for checking.
  - ref: 10
    topic: vocab
    text: >
      敗勢 paiˇ se "sorry, embarrassed" (line 8) and 無要緊 moˇ ieu ginˋ "never mind, it doesn't matter": the everyday
      apology and its answer.
  - ref: 11
    topic: grammar
    text: >
      食加一碗添 "eat one more bowl": 加 + amount after the verb, and 添 tiamˊ "more, in addition" at the very end. 添 is a
      Hakka favourite: 睡加一下添 "sleep a little longer", 等加一下添 "wait a bit more". 加一碗飯 "one more bowl of rice"
      is marked for checking: the official examples have the pattern, not this line.
  - ref: 12
    topic: grammar
    text: >
      食毋落 "can't eat any more (it won't go down)": 落 log "down", with 毋 between verb and ending. 等下 "in a moment".
  - ref: 14
    topic: culture
    text: >
      算數 son sii "settle the bill"; 算過吔 "it's settled" (marked for checking). Grandma has paid behind the host's back, and the 下二擺 "next time" that follows
      may never come. A saying from the official examples:
      講著食，大家就擠等來；講著算數，大家就閃開開 "talk about eating and everyone crowds in; talk about the bill and
      everyone scatters".

