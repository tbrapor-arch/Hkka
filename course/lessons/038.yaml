exercises:
  translate:
    - en: "Excuse me, is there a round table?"
      sx: {hanzi: "失禮，有圓桌無？", pinyin: "siidˋ liˊ, iuˊ ienˇ zogˋ moˇ?"}
      hl: {hanzi: "失禮，有圓桌無？", pinyin: "shid liˋ, rhiuˋ rhan zog mo?"}
    - en: "This restaurant's 客家小炒 is famous."
      sx: {hanzi: "這間餐廳个客家小炒當有名。", pinyin: "iaˋ gienˊ conˊ tangˊ ge hagˋ gaˊ seuˋ cauˋ dongˊ iuˊ miangˇ."}
      hl: {hanzi: "這間餐廳个客家小炒當有名。", pinyin: "liaˊ gienˋ conˋ tangˋ gaiˇ hag gaˋ siauˊ cauˊ dongˋ rhiuˋ miang."}
    - en: "Waiter, could we have the menu? What's the name of this dish?"
      sx: {hanzi: "服務生，菜單分𠊎兜。這盤菜喊做麼个名？", pinyin: "fug vu senˊ, coi danˊ bunˊ ngaiˇ deuˊ. iaˋ panˇ coi ham zo maˋ ge miangˇ?"}
      hl: {hanzi: "服務生，菜單分𠊎兜。這盤菜喊做麼个名？", pinyin: "fugˋ muˇ senˋ, coiˇ danˋ bunˋ ngai deuˋ. liaˊ pan coiˇ hamˇ zoˇ maˊ gaiˇ miang?"}
    - en: "Wait a bit longer; the soup isn't ready yet."
      sx: {hanzi: "等加一下添，湯吂好。", pinyin: "denˋ gaˊ idˋ ha tiamˊ, tongˊ mangˇ hoˋ."}
      hl: {hanzi: "等加一下添，湯吂好。", pinyin: "denˊ gaˋ rhid ha+ tiamˋ, tongˋ mang hoˊ."}
    - en: "Stop eating! You can't eat any more."
      sx: {hanzi: "停，莫食吔！你食毋落吔。", pinyin: "tinˇ, mog siid leˊ! nˇ siid mˇ log leˊ."}
      hl: {hanzi: "停，莫食咧！你食毋落咧。", pinyin: "tin, mogˋ shidˋ leˋ! ngi shidˋ m logˋ leˋ."}
    - en: "Put on one more layer, it's cold outside."
      sx: {hanzi: "著加一領衫添，外背當寒。", pinyin: "zogˋ gaˊ idˋ liangˊ samˊ tiamˊ, ngoi boi dongˊ honˇ."}
      hl: {hanzi: "著加一領衫添，外背當冷。", pinyin: "zhog gaˋ rhid liangˋ samˋ tiamˋ, ngo+ boiˇ dongˋ langˋ."}
    - en: "Pass me a pair of chopsticks."
      sx: {hanzi: "拿一雙筷仔分𠊎。", pinyin: "naˊ idˋ sungˊ kuai eˋ bunˊ ngaiˇ."}
      hl: {hanzi: "拿一雙箸分𠊎。", pinyin: "naˋ rhid sungˋ chu+ bunˋ ngai."}
