exercises:
  translate:
    - en: "We're going to the market tomorrow."
      sx: {hanzi: "𠊎兜天光日愛去買菜。", pinyin: "ngaiˇ deuˊ tienˊ gongˊ ngidˋ oi hi maiˊ coi."}
      hl: {hanzi: "𠊎兜韶早愛去買菜。", pinyin: "ngai deuˋ shau zoˊ oiˇ hiˇ maiˋ coiˇ."}
    - en: "They're not at home."
      sx: {hanzi: "佢兜無在屋下。", pinyin: "giˇ deuˊ moˇ coiˊ vugˋ kaˊ."}
      hl: {hanzi: "佢兜無在屋下。", pinyin: "gi deuˋ mo coiˋ vug haˋ."}
    - en: "Grandma tells A-min to sleep."
      sx: {hanzi: "阿婆喊阿明去睡目。", pinyin: "aˊ poˇ ham aˊ minˇ hi soi mugˋ."}
      hl: {hanzi: "阿婆喊阿明去睡目。", pinyin: "a+ po hamˇ a+ min hiˇ shoi+ mug."}
    - en: "I want to talk to Grandpa too."
      sx: {hanzi: "𠊎乜愛摎阿公講話。", pinyin: "ngaiˇ me oi lauˊ aˊ gungˊ gongˋ fa."}
      hl: {hanzi: "𠊎乜愛摎阿公講話。", pinyin: "ngai meˇ oiˇ lauˋ a+ gungˋ gongˊ faˇ."}
    - en: "Every day when I eat, Grandma says 'two bowls!'"
      sx: {hanzi: "𠊎逐日食飯，阿婆都講「兩碗！」", pinyin: "ngaiˇ dagˋ ngidˋ siid fan, aˊ poˇ du gongˋ \"liongˋ vonˋ!\""}
      hl: {hanzi: "𠊎逐日食飯，阿婆都講「兩碗！」", pinyin: "ngai dag ngid shidˋ pon+, a+ po du+ gongˊ \"liongˊ vonˊ!\""}
  fill:
    - en: "You're right."
      sx: {hanzi: "你講个___。", pinyin: "nˇ gongˋ ge ___.", answer_hanzi: "著", answer: "cog"}
      hl: {hanzi: "你講个___。", pinyin: "ngi gongˊ gaiˇ ___.", answer_hanzi: "著", answer: "chogˋ"}
    - en: "Who teaches you Hakka? — My teacher."
      sx: {hanzi: "麼人教你客話？——吾___。", pinyin: "maˋ nginˇ gauˊ nˇ hagˋ fa? — ngaˊ ___.", answer_hanzi: "先生", answer: "xinˊ sangˊ"}
      hl: {hanzi: "麼人教你客話？——𠊎___。", pinyin: "maˊ ngin gauˋ ngi hag voiˋ? — ngai ___.", answer_hanzi: "先生", answer: "sinˋ sangˋ"}
    - en: "A-in talks to Sam on the phone."
      sx: {hanzi: "阿英___Sam 講電話。", pinyin: "aˊ inˊ ___ Sam gongˋ tien fa.", answer_hanzi: "同", answer: "tungˇ"}
      hl: {hanzi: "阿英___Sam 講電話。", pinyin: "a+ rhinˋ ___ Sam gongˊ tien+ faˇ.", answer_hanzi: "摎", answer: "lauˋ"}

