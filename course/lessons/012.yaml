exercises:
  translate:
    - en: "My head hurts, and my eyes hurt too."
      sx: {hanzi: "𠊎頭那痛，目珠乜痛。", pinyin: "ngaiˇ teuˇ naˇ tung, mugˋ zuˊ me tung."}
      hl: {hanzi: "𠊎頭那痛，目珠乜痛。", pinyin: "ngai teu na tungˇ, mug zhuˋ meˇ tungˇ."}
    - en: "Don't eat it, it's very hot!"
      sx: {hanzi: "莫食，當燒！", pinyin: "mog siid, dongˊ seuˊ!"}
      hl: {hanzi: "莫食，當燒！", pinyin: "mogˋ shidˋ, dongˋ shauˋ!"}
    - en: "A-min has a fever; he has to take his medicine."
      sx: {hanzi: "阿明發燒，愛食藥仔。", pinyin: "aˊ minˇ fadˋ seuˊ, oi siid iog eˋ."}
      hl: {hanzi: "阿明發燒，愛食藥仔。", pinyin: "a+ min fad shauˋ, oiˇ shidˋ rhogˋ er."}
    - en: "(after a chilli) My mouth is on fire!"
      sx: {hanzi: "𠊎个嘴當辣！", pinyin: "ngaiˇ ge zoi dongˊ lad!"}
      hl: {hanzi: "𠊎个嘴當辣！", pinyin: "ngai gaiˇ zhoiˇ dongˋ ladˋ!"}
    - en: "My hands are cold, and so are my feet."
      sx: {hanzi: "𠊎个手當冷，腳乜冷。", pinyin: "ngaiˇ ge suˋ dongˊ langˊ, giogˋ me langˊ."}
      hl: {hanzi: "𠊎个手當冷，腳乜冷。", pinyin: "ngai gaiˇ shiuˊ dongˋ langˋ, giog meˇ langˋ."}
  fill:
    - en: "My stomach hurts."
      sx: {hanzi: "𠊎___痛。", pinyin: "ngaiˇ ___ tung.", answer_hanzi: "肚屎", answer: "duˋ siiˋ"}
      hl: {hanzi: "𠊎___痛。", pinyin: "ngai ___ tungˇ.", answer_hanzi: "肚屎", answer: "duˊ shiˊ"}
    - en: "Don't eat cold things!"
      sx: {hanzi: "___食冷个！", pinyin: "___ siid langˊ ge!", answer_hanzi: "莫", answer: "mog"}
      hl: {hanzi: "___食冷个！", pinyin: "___ shidˋ langˋ gaiˇ!", answer_hanzi: "莫", answer: "mogˋ"}
    - en: "No need to see a doctor."
      sx: {hanzi: "___去看先生。", pinyin: "___ hi kon xinˊ sangˊ.", answer_hanzi: "毋使", answer: "mˇ siiˋ"}
      hl: {hanzi: "___去看先生。", pinyin: "___ hiˇ konˇ sinˋ sangˋ.", answer_hanzi: "毋使", answer: "m siiˊ"}

