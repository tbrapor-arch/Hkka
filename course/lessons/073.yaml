      hl: {hanzi: "鳥仔摎葉仔食忒，樹仔空忒去了。", pinyin: "diauˋ er lauˋ rhabˋ er shidˋ ted, shu+ er kungˋ ted hiˇ leˋ."}
      check: true
    - en: "The barns stand by the roadside, at the edge of the fields."
      sx: {hanzi: "菸樓企在路脣、田脣。", pinyin: "ienˊ leuˇ kiˊ coiˊ lu sunˇ, tienˇ sunˇ."}
      hl: {hanzi: "菸樓企在路脣、田脣。", pinyin: "rhanˋ leu kiˋ coiˋ lu+ shun, tien shun."}
      check: true
