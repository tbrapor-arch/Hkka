exercises:
  translate:
    - en: "That old house will soon be pulled down."
      sx: {hanzi: "該棟舊屋仔，無幾久就愛拆忒了。", pinyin: "ge dung kiu vugˋ eˇ, moˇ giˋ giuˋ qiu oi cagˋ tedˋ leˊ."}
      hl: {hanzi: "該棟舊屋仔，無幾久就愛拆忒了。", pinyin: "gai dungˇ kiu+ vug er, mo giˊ giuˊ ciu+ oiˇ cag ted leˋ."}
      source: kaga115
    - en: "In the old days water wasn't as easy to get as it is now."
      sx: {hanzi: "頭擺个人用水無像這下恁方便。", pinyin: "teuˇ baiˋ ge nginˇ iung suiˋ moˇ qiong iaˋ ha anˋ fongˊ pien."}
      hl: {hanzi: "頭擺个人用水無像這下恁方便。", pinyin: "teu baiˊ gaiˇ ngin rhung+ shuiˊ mo siongˇ liaˊ ha+ anˊ fongˋ pien+."}
    - en: "The barn has a tall chimney; the history of 美濃 is in these buildings."
      sx: {hanzi: "菸樓有高高个煙囪，美濃个歷史就在這兜屋仔肚。", pinyin: "ienˊ leuˇ iuˊ goˊ goˊ ge ienˊ cungˊ, mi nungˇ ge lid siiˋ qiu coiˊ iaˋ deuˊ vugˋ eˇ duˋ."}
      hl: {hanzi: "菸樓有高高个煙囪，美濃个歷史就在這兜屋仔肚。", pinyin: "rhanˋ leu rhiuˋ goˋ goˋ gaiˇ rhanˋ cungˋ, mi nung gaiˇ lidˋ siiˊ ciu+ coiˋ liaˊ deuˋ vug er duˊ."}
