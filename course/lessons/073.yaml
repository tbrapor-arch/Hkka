id: 73
title:
  en: "The tobacco barns"
  sx: {hanzi: "變到恁安靜", pinyin: "bien do anˋ onˊ qin"}
  hl: {hanzi: "變到恁安靜", pinyin: "bienˇ doˇ anˊ onˋ cin+"}
review: false
setting: >-
  Sunday 9 May, Mother's Day, early morning. 鍾伯 has lent them two old bicycles and rides ahead along the field roads.
  Here and there, above the fields, stands a tall narrow building with a little roof perched on top of its roof: a
  菸樓, a tobacco curing barn.
names: [美濃, 鍾伯, 鍾伯姆, 阿英, 菸樓, 鍾理和]

dialogue:
  - n: 1
    speaker: 鍾伯
    en: "Look at that tall building over there: that's a 菸樓."
    sx: {hanzi: "你看該棟高高个屋仔，就係菸樓。", pinyin: "nˇ kon ge dung goˊ goˊ ge vugˋ eˇ, qiu he ienˊ leuˇ."}
    hl: {hanzi: "你看該棟高高个屋仔，就係菸樓。", pinyin: "ngi konˇ gai dungˇ goˋ goˋ gaiˇ vug er, ciu+ heˇ rhanˋ leu."}
  - n: 2
    speaker: Sam
    en: "(braking hard on his bicycle) Wait for me! Ride a bit slower!"
    sx: {hanzi: "等𠊎！腳踏車騎較慢兜仔！", pinyin: "denˋ ngaiˇ! giogˋ tab caˊ kiˇ ka man deuˊ eˋ!"}
    hl: {hanzi: "等𠊎！腳踏車騎較慢兜仔！", pinyin: "denˊ ngai! giog tabˋ chaˋ ki haˇ man+ deuˋ er!"}
  - n: 3
    speaker: Sam
    en: "A 菸樓? What was it for?"
    sx: {hanzi: "菸樓？做麼个用个？", pinyin: "ienˊ leuˇ? zo maˋ ge iung ge?"}
    hl: {hanzi: "菸樓？做麼个用个？", pinyin: "rhanˋ leu? zoˇ maˊ gaiˇ rhung+ gaiˇ?"}
  - n: 4
    speaker: 鍾伯
    en: "In the old days 美濃 people grew tobacco. The leaves have to be dried over a fire, and that was done inside the barn."
    sx: {hanzi: "頭擺美濃人種菸。菸葉愛用火燻燥來，就在菸樓肚燻。", pinyin: "teuˇ baiˋ mi nungˇ nginˇ zung ienˊ. ienˊ iab oi iung foˋ fun zauˊ loiˇ, qiu coiˊ ienˊ leuˇ duˋ fun."}
    hl: {hanzi: "頭擺美濃人種菸。菸葉愛用火燻燥來，就在菸樓肚燻。", pinyin: "teu baiˊ mi nung ngin zhungˇ rhanˋ. rhanˋ rhabˋ oiˇ rhung+ foˊ funˇ zauˋ loi, ciu+ coiˋ rhanˋ leu duˊ funˇ."}
  - n: 5
    speaker: 阿英
    en: "And now? Does anyone still grow tobacco?"
    sx: {hanzi: "這下呢？還有人種菸無？", pinyin: "iaˋ ha neˇ? hanˇ iuˊ nginˇ zung ienˊ moˇ?"}
    hl: {hanzi: "這下呢？還有人種菸無？", pinyin: "liaˊ ha+ neˇ? han rhiuˋ ngin zhungˇ rhanˋ mo?"}
  - n: 6
    speaker: 鍾伯
    en: "Hardly anyone. In the old days everyone grew it; now the barns have all gone empty."
    sx: {hanzi: "盡少了。頭擺大家都種，這下菸樓都空忒去了。", pinyin: "qin seuˋ leˊ. teuˇ baiˋ tai gaˊ du zung, iaˋ ha ienˊ leuˇ du kungˊ tedˋ hi leˊ."}
    hl: {hanzi: "盡少了。頭擺大家都種，這下菸樓都空忒去了。", pinyin: "cin+ shauˊ leˋ. teu baiˊ tai+ gaˋ du+ zhungˇ, liaˊ ha+ rhanˋ leu du+ kungˋ ted hiˇ leˋ."}
    check: true
  - n: 7
    speaker: 鍾伯姆
    en: "(catching up) The young people all go off to work elsewhere. In the countryside it's mostly old folk, and they help one another."
    sx: {hanzi: "後生人都出外食頭路，鄉下大部分係老人家，大家互相𢯭手。", pinyin: "heu sangˊ nginˇ du cudˋ ngoi siid teuˇ lu, hiongˊ ha tai pu fun he loˋ nginˇ gaˊ, tai gaˊ fu xiongˊ ten suˋ."}
    hl: {hanzi: "後生人都出外食頭路，鄉下大部分係老人家，大家互相𢯭手。", pinyin: "heu+ sangˋ ngin du+ chud ngoi+ shidˋ teu lu+, hiongˋ ha+ tai+ pu+ fun+ heˇ loˊ ngin gaˋ, tai+ gaˋ fu+ siongˋ tenˇ shiuˊ."}
  - n: 8
    speaker: Sam
    en: "美濃 has become so quiet…"
    sx: {hanzi: "美濃變到恁安靜……", pinyin: "mi nungˇ bien do anˋ onˊ qin …"}
    hl: {hanzi: "美濃變到恁安靜……", pinyin: "mi nung bienˇ doˇ anˊ onˋ cin+ …"}
  - n: 9
    speaker: 鍾伯
    en: "Quiet, yes, but prettier too. Now people come to look and take photos of the barns."
    sx: {hanzi: "係較安靜，毋過也較靚了。這下有人專門來看菸樓、翕相。", pinyin: "he ka onˊ qin, mˇ go ia ka jiangˊ leˊ. iaˋ ha iuˊ nginˇ zonˊ munˇ loiˇ kon ienˊ leuˇ, hibˋ xiong."}
    hl: {hanzi: "係較安靜，毋過也較靚了。這下有人專門來看菸樓、翕相。", pinyin: "heˇ haˇ onˋ cin+, m goˇ rha+ haˇ ziangˋ leˋ. liaˊ ha+ rhiuˋ ngin zhonˋ mun loi konˇ rhanˋ leu, hib siongˇ."}
  - n: 10
    speaker: Sam
    en: "That tall thing on the roof: is it a chimney?"
    sx: {hanzi: "屋頂高高該隻，係煙囪係無？", pinyin: "vugˋ dangˋ goˊ goˊ ge zagˋ, he ienˊ cungˊ he moˇ?"}
    hl: {hanzi: "屋頂高高該隻，係煙囪係無？", pinyin: "vug dangˊ goˋ goˋ gai zhag, heˇ rhanˋ cungˋ heˇ mo?"}
    check: true
  - n: 11
    speaker: 鍾伯
    en: "It is. Some of the old barns have been pulled down, but you can still see them by the roads and at the edges of the fields."
    sx: {hanzi: "係。有兜舊菸樓拆忒了，毋過路脣、田脣還看得著。", pinyin: "he. iuˊ deuˊ kiu ienˊ leuˇ cagˋ tedˋ leˊ, mˇ go lu sunˇ, tienˇ sunˇ hanˇ kon dedˋ doˋ."}
    hl: {hanzi: "係。有兜舊菸樓拆忒了，毋過路脣、田脣還看得著。", pinyin: "heˇ. rhiuˋ deuˋ kiu+ rhanˋ leu cag ted leˋ, m goˇ lu+ shun, tien shun han konˇ ded doˊ."}
  - n: 12
    speaker: 阿英
    en: "That's 美濃's history."
    sx: {hanzi: "這就係美濃个歷史。", pinyin: "iaˋ qiu he mi nungˇ ge lid siiˋ."}
    hl: {hanzi: "這就係美濃个歷史。", pinyin: "liaˊ ciu+ heˇ mi nung gaiˇ lidˋ siiˊ."}
  - n: 13
    speaker: 鍾伯
    en: "(pointing across a field) Over that way is where 鍾理和 lived. He was a famous writer."
    sx: {hanzi: "該片係鍾理和頭擺歇个屋仔。鍾理和先生係臺灣大名鼎鼎个文學家。", pinyin: "ge pienˋ he zungˊ liˊ foˇ teuˇ baiˋ hed ge vugˋ eˇ. zungˊ liˊ foˇ xinˊ sangˊ he toiˇ vanˇ tai miangˇ dinˋ dinˋ ge vunˇ hog gaˊ."}
    hl: {hanzi: "該片係鍾理和頭擺歇个屋仔。鍾理和先生係臺灣大名鼎鼎个文學家。", pinyin: "gai pienˊ heˇ zhungˋ liˋ vo teu baiˊ hied gaiˇ vug er. zhungˋ liˋ vo sinˋ sangˋ heˇ toi van tai+ miang dinˊ dinˊ gaiˇ vun hogˋ gaˋ."}
  - n: 14
    speaker: Sam
    en: "Was he from 美濃?"
    sx: {hanzi: "佢係美濃人？", pinyin: "giˇ he mi nungˇ nginˇ?"}
    hl: {hanzi: "佢係美濃人？", pinyin: "gi heˇ mi nung ngin?"}
  - n: 15
    speaker: 鍾伯
    en: "He was. He wrote about our life here, the farming families' life."
    sx: {hanzi: "係。佢寫𠊎等美濃人个生活，耕田人个生活。", pinyin: "he. giˇ xiaˋ ngaiˇ denˋ mi nungˇ nginˇ ge senˊ fad, gangˊ tienˇ nginˇ ge senˊ fad."}
    hl: {hanzi: "係。佢寫𠊎兜美濃人个生活，耕田人个生活。", pinyin: "heˇ. gi siaˊ ngai deuˋ mi nung ngin gaiˇ senˋ fadˋ, gangˋ tien ngin gaiˇ senˋ fadˋ."}
  - n: 16
    speaker: 阿英
    en: "(looking at her phone) Oh! Today's Mother's Day. I must call Mum."
    sx: {hanzi: "啊，今晡日係母親節！𠊎愛打電話分吾姆。", pinyin: "a, gimˊ buˊ ngidˋ he muˊ qinˊ jiedˋ! ngaiˇ oi daˋ tien fa bunˊ ngaˊ meˊ."}
    hl: {hanzi: "啊，今晡日係母親節！𠊎愛打電話分𠊎姆。", pinyin: "a+, gimˋ buˋ ngid heˇ muˋ cinˋ zied! ngai oiˇ daˊ tien+ faˇ bunˋ ngai meˋ."}
  - n: 17
    speaker: 阿英
    en: "(on the phone) Mum, happy Mother's Day! …What did I buy you? I'm not telling. You'll see when I'm home!"
    sx: {hanzi: "阿姆，母親節快樂！……買麼个東西？毋講，轉來正知！", pinyin: "aˊ meˊ, muˊ qinˊ jiedˋ kuai log! … maiˊ maˋ ge dungˊ xiˊ? mˇ gongˋ, zonˋ loiˇ zang diˊ!"}
    hl: {hanzi: "阿姆，母親節快樂！……買麼个東西？毋講，轉來正知！", pinyin: "a+ meˋ, muˋ cinˋ zied kuaiˇ logˋ! … maiˋ maˊ gaiˇ dungˋ siˋ? m gongˊ, zhonˊ loi zhangˇ diˋ!"}
    check: true

notes:
  - ref: 1
    topic: vocab
    text: >
      棟 dung, the classifier for buildings (該棟舊屋仔 is an official example), and 屋仔 vugˋ eˇ "house, building".
      高高 "nice and tall": the doubled adjective of lesson 45. 菸樓 "tobacco barn" is not in the word lists; the course
      gives it as a name.
  - ref: 4
    topic: culture
    text: >
      菸葉愛用火燻燥來 "the leaves must be dried over a fire" is an official example sentence. 燻 fun "smoke, cure with
      smoke", 燥 (lesson 54) "dry", 燻燥來 "smoke them dry": verb + result + 來, a pattern you will meet again in lesson
      76 (洗淨來). 種 zung "grow, plant" (lesson 45); 種 zungˋ "kind" (lesson 37) is another tone. That 美濃 was a tobacco town until
      the late twentieth century is general knowledge, not from the data.
  - ref: 6
    topic: grammar
    text: >
      頭擺… 這下… "in the old days… now…": the two time words set up a contrast, as in the official 頭擺个人用水無像這下恁方便
      "in the old days, water wasn't as easy to get as it is now". 空忒去 "has gone empty": adjective + 忒去, "has become
      (and stayed)…", here with 忒 (gone) and 去 (away). The official examples have 忒去 mostly after verbs (食忒去, 倒忒去);
      after an adjective the line is marked for checking. 盡少 "very few": 盡 is "very" here, as often as "most" (lesson
      8); Hailu says 盡少 too (16 examples, against one 最少).
  - ref: 7
    topic: vocab
    text: >
      出外 "go away (from home), go elsewhere": 出外食頭路 "go off to work": 大家共樣係出外食頭路个人 is an official
      example. 食頭路 "have a job, work for a living". 老人家 (lesson 20) "old folk".
  - ref: 8
    topic: grammar
    text: >
      變到恁安靜 "has become so quiet": 變到 + 恁 + adjective, "has turned so…", as in the official 一轉到春尾就變到恁燒暖
      "as soon as it's late spring it turns so warm".
  - ref: 13
    topic: culture
    text: >
      鍾理和先生係臺灣大名鼎鼎个文學家 is an official example, word for word. 大名鼎鼎 "of great renown", a four-character
      phrase. That 鍾理和 (1915–1960) came from 美濃 and wrote about its farming life is general knowledge.
  - ref: 17
    topic: grammar
    text: >
      轉來正知 "you'll know when you're… when I'm back": 正 "only then" (lesson 24). The umbrella of lesson 72 is the
      present, and A-in keeps the secret.

