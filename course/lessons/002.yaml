  - {hanzi: 阿公, pinyin: "aˊ gungˊ", en: "grandfather (father's father)", hl: {hanzi: 阿公, pinyin: "a+ gungˋ"}}
  - {hanzi: 吔, pinyin: "leˊ", en: "(end of sentence) new situation", hl: {hanzi: 咧, pinyin: "leˋ"}}
  - {hanzi: 婆, pinyin: "poˇ", en: "grandmother (after 吾, 若, 厥)", hl: {hanzi: 婆, pinyin: "po"}}
  - {hanzi: 公, pinyin: "gungˊ", en: "grandfather (after 吾, 若, 厥)", hl: {hanzi: 公, pinyin: "gungˋ"}}
  - {hanzi: 該, pinyin: "ge", en: "that (那)", hl: {hanzi: 該, pinyin: "gai"}}
  - {hanzi: 就, pinyin: "qiu", en: "just, precisely; then (就)", hl: {hanzi: 就, pinyin: "ciu+"}}
  - {hanzi: 坐, pinyin: "coˊ", en: "sit", hl: {hanzi: 坐, pinyin: "coˋ"}}
  - {hanzi: 阿爸, pinyin: "aˊ baˊ", en: "dad", hl: {hanzi: 阿爸, pinyin: "a+ baˋ"}}
  - {hanzi: 阿姆, pinyin: "aˊ meˊ", en: "mum", hl: {hanzi: 阿姆, pinyin: "a+ meˋ"}}
  - {hanzi: 爸, pinyin: "baˊ", en: "dad (after 吾, 若, 厥)", hl: {hanzi: 爸, pinyin: "baˋ"}}
  - {hanzi: 姆, pinyin: "meˊ", en: "mum (after 吾, 若, 厥)", hl: {hanzi: 姆, pinyin: "meˋ"}}
  - {hanzi: 若, pinyin: "ngiaˊ", en: "your", hl: {hanzi: 若个, pinyin: "ngia gaiˇ"}}
  - {hanzi: 間房, pinyin: "gienˊ fongˇ", en: "bedroom", hl: {hanzi: 間房, pinyin: "gienˋ fong"}}
  - {hanzi: 个, pinyin: "ge", en: "'s, of (的)", hl: {hanzi: 个, pinyin: "gaiˇ"}}
  - {hanzi: 伯姆, pinyin: "bagˋ meˊ", en: "auntie (a friend's mother; father's elder brother's wife)", hl: {hanzi: 伯姆, pinyin: "bag meˊ"}}
  - {hanzi: 又, pinyin: "iu", en: "again", hl: {hanzi: 又, pinyin: "rhiu+"}}

exercises:
  translate:
    - en: "This is my dad, and that's my mum."
      sx: {hanzi: "這係吾爸，該係吾姆。", pinyin: "iaˋ he ngaˊ baˊ, ge he ngaˊ meˊ."}
      hl: {hanzi: "這係𠊎爸，該係𠊎姆。", pinyin: "liaˊ heˇ ngai baˋ, gai heˇ ngai meˋ."}
    - en: "So that's your grandpa?"
      sx: {hanzi: "該就係若公？", pinyin: "ge qiu he ngiaˊ gungˊ?"}
      hl: {hanzi: "該就係若公？", pinyin: "gai ciu+ heˇ ngia gungˋ?"}
    - en: "This is mine, that's yours."
      sx: {hanzi: "這係𠊎个，該係你个。", pinyin: "iaˋ he ngaiˇ ge, ge he nˇ ge."}
      hl: {hanzi: "這係𠊎个，該係你个。", pinyin: "liaˊ heˇ ngai gaiˇ, gai heˇ ngi gaiˇ."}
    - en: "Grandma, A-in's here!"
      sx: {hanzi: "阿婆，阿英來吔！", pinyin: "aˊ poˇ, aˊ inˊ loiˇ leˊ!"}
      hl: {hanzi: "阿婆，阿英來咧！", pinyin: "a+ po, a+ rhinˋ loi leˋ!"}
    - en: "A-min again!"
      sx: {hanzi: "又係阿明！", pinyin: "iu he aˊ minˇ!"}
      hl: {hanzi: "又係阿明！", pinyin: "rhiu+ heˇ a+ min!"}
  fill:
    - en: "This is my grandma."
      sx: {hanzi: "這係___婆。", pinyin: "iaˋ he ___ poˇ.", answer_hanzi: "吾", answer: "ngaˊ"}
      hl: {hanzi: "這係___婆。", pinyin: "liaˊ heˇ ___ po.", answer_hanzi: "𠊎", answer: "ngai"}
    - en: "That's A-min's."
      sx: {hanzi: "該係阿明___。", pinyin: "ge he aˊ minˇ ___.", answer_hanzi: "个", answer: "ge"}
      hl: {hanzi: "該係阿明___。", pinyin: "gai heˇ a+ min ___.", answer_hanzi: "个", answer: "gaiˇ"}
    - en: "Sit, A-in."
      sx: {hanzi: "___，阿英。", pinyin: "___, aˊ inˊ.", answer_hanzi: "坐", answer: "coˊ"}
      hl: {hanzi: "___，阿英。", pinyin: "___, a+ rhinˋ.", answer_hanzi: "坐", answer: "coˋ"}

