id: 2
title:
  en: "The Liu house"
  sx: {hanzi: "這係吾婆", pinyin: "iaˋ he ngaˊ poˇ"}
  hl: {hanzi: "這係𠊎婆", pinyin: "liaˊ heˇ ngai po"}
review: false
setting: >-
  Twenty minutes later, a two-storey house among tea bushes outside 苗栗. Grandma is at the door before the car stops;
  Grandpa does not get up from his chair.
names: [苗栗, 阿英, 阿明]

dialogue:
  - n: 1
    speaker: 阿明
    en: "Grandma! Grandpa! Sam's here!"
    sx: {hanzi: "阿婆！阿公！Sam 來吔！", pinyin: "aˊ poˇ! aˊ gungˊ! Sam loiˇ leˊ!"}
    hl: {hanzi: "阿婆！阿公！Sam 來咧！", pinyin: "a+ po! a+ gungˋ! Sam loi leˋ!"}
  - n: 2
    speaker: 阿英
    en: "Sam, this is my grandma, and that's my grandpa."
    zh: "Sam，這是我奶奶，那是我爺爺。"
    sx: {hanzi: "Sam，這係吾婆，該係吾公。", pinyin: "Sam, iaˋ he ngaˊ poˇ, ge he ngaˊ gungˊ."}
    hl: {hanzi: "Sam，這係𠊎婆，該係𠊎公。", pinyin: "Sam, liaˊ heˇ ngai po, gai heˇ ngai gungˋ."}
  - n: 3
    speaker: 阿婆
    en: "So you're Sam? Welcome, welcome!"
    sx: {hanzi: "你就係 Sam？歡迎，歡迎！", pinyin: "nˇ qiu he Sam? fonˊ ngiangˇ, fonˊ ngiangˇ!"}
    hl: {hanzi: "你就係 Sam？歡迎，歡迎！", pinyin: "ngi ciu+ heˇ Sam? fonˋ ngiang, fonˋ ngiang!"}
  - n: 4
    speaker: Sam
    en: "Thank you, Grandma."
    sx: {hanzi: "恁仔細，阿婆。", pinyin: "anˋ ziiˋ se, aˊ poˇ."}
    hl: {hanzi: "承蒙你，阿婆。", pinyin: "shin mung ngi, a+ po."}
  - n: 5
    speaker: 阿公
    en: "Sit."
    sx: {hanzi: "坐。", pinyin: "coˊ."}
    hl: {hanzi: "坐。", pinyin: "coˋ."}
  - n: 6
    speaker: 阿英
    en: "Dad, Mum, this is Sam."
    sx: {hanzi: "阿爸，阿姆，佢係 Sam。", pinyin: "aˊ baˊ, aˊ meˊ, giˇ he Sam."}
    hl: {hanzi: "阿爸，阿姆，佢係 Sam。", pinyin: "a+ baˋ, a+ meˋ, gi heˇ Sam."}
  - n: 7
    speaker: 阿姆
    en: "Welcome! Come, Sam, this is your room."
    zh: "歡迎！來，Sam，這是你的房間。"
    sx: {hanzi: "歡迎！來，Sam，這係若間房。", pinyin: "fonˊ ngiangˇ! loiˇ, Sam, iaˋ he ngiaˊ gienˊ fongˇ."}
    hl: {hanzi: "歡迎！來，Sam，這係若个間房。", pinyin: "fonˋ ngiang! loi, Sam, liaˊ heˇ ngia gaiˇ gienˋ fong."}
  - n: 8
    speaker: 阿明
    en: "That one's mine."
    sx: {hanzi: "該係𠊎个。", pinyin: "ge he ngaiˇ ge."}
    hl: {hanzi: "該係𠊎个。", pinyin: "gai heˇ ngai gaiˇ."}
  - n: 9
    speaker: Sam
    en: "Thank you, Mrs Liu!"
    sx: {hanzi: "恁仔細，伯姆！", pinyin: "anˋ ziiˋ se, bagˋ meˊ!"}
    hl: {hanzi: "承蒙你，伯姆！", pinyin: "shin mung ngi, bag meˊ!"}
  - n: 10
    speaker: 阿明
    en: "(to A-in) Another thank-you…"
    sx: {hanzi: "又係恁仔細……", pinyin: "iu he anˋ ziiˋ se…"}
    hl: {hanzi: "又係承蒙你……", pinyin: "rhiu+ heˇ shin mung ngi…"}

notes:
  - ref: 1
    topic: vocab
    text: >
      The family words: 阿公 aˊ gungˊ grandfather, 阿婆 aˊ poˇ grandmother (both on the father's side), 阿爸 aˊ baˊ
      dad, 阿姆 aˊ meˊ mum. 阿公 you know from Taiwan Mandarin. Careful with the other two: in Mandarin 阿婆 is any old
      woman, and if you know Taigi, its 阿姆 is an aunt; here they are Grandma and Mum. In sandhi, 阿 turns low before the rising 公,
      爸, 姆 (aˇ gungˊ, aˇ baˊ, aˇ meˊ) and stays before 婆.
  - ref: 1
    topic: grammar
    text: >
      吔 leˊ at the end of a sentence marks a new situation, like Mandarin 了: Sam 來吔 "Sam's here (now)". It is a
      rising tone, not a neutral one. Spelling: the official 115年度 word lists write it 吔 in Sixian (about 650 of their
      sentences, against 6 with 了) and 咧 leˋ in Hailu; the MOE dictionary writes 了 leˊ, and you will see that too
      (lesson 89 quotes it). This course follows the lists, whose recordings you will hear. The lists give 吔 no
      romanisation: the reading leˊ is the dictionary's, and a lighter eˊ is also heard (south Sixian e²⁴); listen.
  - ref: 2
    topic: grammar
    text: >
      "My grandma" is 吾婆 ngaˊ poˇ: after 吾 "my", the 阿 drops. So 吾公, 吾婆, 吾爸, 吾姆 (forms like 厥阿姆 do occur, but the short ones are usual). The same
      goes for "your" and "his/her": 若 ngiaˊ (若爸 "your dad") and 厥 giaˊ (厥姆 "his mum"), which you'll meet soon.
      An easy way to hold them: each keeps its pronoun's opening sound, ends in -a and rises. 𠊎 ngaiˇ → 吾 ngaˊ, 你
      ngiˇ → 若 ngiaˊ, 佢 giˇ → 厥 giaˊ.
  - ref: 2
    topic: false-friend
    text: >
      該 ge is "that", Mandarin 那: 這係… 該係… "this is… that is…". It has nothing to do with Mandarin 該 "should".
      It is one of the most frequent words in Hakka (number 12 in the course's frequency list), so the reflex is
      worth building now.
  - ref: 3
    topic: grammar
    text: >
      你就係 Sam？ "So you're Sam?": 就 qiu as in Mandarin 就是, the person in front of you being the one expected.
      Grandma talks; Grandpa, in line 5, will not use two words where one will do.
  - ref: 5
    topic: pronunciation
    text: >
      坐 coˊ: Mandarin zuò, Hakka coˊ, with a puff of air (c = ts with aspiration) and a rising tone. Many Mandarin
      tone-4 words with voiced old initials come out aspirated in Hakka: 坐 coˊ, 大 tai, 弟 taiˊ.
  - ref: 7
    topic: vocab
    text: >
      間房 gienˊ fongˇ is "bedroom", Mandarin 房間 the other way round. 若間房 "your room": 若 straight before the
      noun. Before ordinary things you can also add 个 (若个間房); before family words, never.
  - ref: 8
    topic: grammar
    text: >
      个 ge is the Hakka 的: 𠊎个 "mine", 你个 "yours". It is the second most frequent word in Hakka; you will see it in
      almost every line from now on. It is also the general classifier (lesson 5).
  - ref: 9
    topic: culture
    text: >
      Sam does not call A-in's mother 阿姆 "Mum": she is 伯姆 bagˋ meˊ to him, literally "wife of father's elder
      brother", the polite way to address a friend's mother. The family call her 阿姆; Sam, the guest, says 伯姆.
      (A-in briefed him on the train.)
  - ref: 10
    topic: vocab
    text: >
      又係 iu he "again" (又是). A-min has started counting.
  - ref: 0
    topic: hailu
    text: >
      Hailu says 𠊎婆, 𠊎公 (𠊎 before a family word, no 吾), and "your" is 若个 ngia gaiˇ. Its 个 is gaiˇ, its 該 gai,
      its 這 liaˊ. Before a family word Hailu also uses plain 若 (若公 "your grandpa"). 阿 is a+ (mid level) in every Hailu kinship word.

new_words:
