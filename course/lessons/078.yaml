exercises:
  translate:
    - en: "Grandpa fell coming down the ladder; the nurse is with him."
      sx: {hanzi: "阿公對梯仔下來跌倒，護理師在該。", pinyin: "aˊ gungˊ dui toiˊ eˋ haˊ loiˇ diedˋ doˋ, fu liˊ siiˊ coiˊ ge."}
      hl: {hanzi: "阿公對梯仔下來跌倒，護理師在該。", pinyin: "a+ gungˋ duiˇ toiˋ er haˋ loi died doˊ, fu+ liˋ siiˋ coiˋ gai."}
    - en: "He fell over and broke a bone."
      source: kaga115
      abridged: true
      sx: {hanzi: "佢跌倒，骨頭斷忒。", pinyin: "giˇ diedˋ doˋ, gudˋ teuˇ tonˊ tedˋ."}
      hl: {hanzi: "佢跢倒，骨頭斷忒。", pinyin: "gi doiˋ doˊ, gud teu tonˋ ted."}
    - en: "Peeling a tangerine, I wasn't careful, and cut my finger on the knife."
      sx: {hanzi: "削柑仔个皮無細義，手指分刀仔割著，出血吔。", pinyin: "xiogˋ gamˊ eˋ ge piˇ moˇ se ngi, suˋ ziiˋ bunˊ doˊ eˋ godˋ doˋ, cudˋ hiedˋ leˊ."}
      hl: {hanzi: "削柑仔个皮無細義，手指分刀仔割著，出血咧。", pinyin: "siog gamˋ er gaiˇ pi mo seˇ ngi+, shiuˊ zhiˊ bunˋ doˋ er god doˊ, chud hied leˋ."}
    - en: "Grandma keeps Grandpa company in the ward every day."
      sx: {hanzi: "阿婆逐日在病房陪阿公。", pinyin: "aˊ poˇ dagˋ ngidˋ coiˊ piang fongˇ piˇ aˊ gungˊ."}
      hl: {hanzi: "阿婆逐日在病房陪阿公。", pinyin: "a+ po dag ngid coiˋ piang+ fong poi a+ gungˋ."}
    - en: "After the treatment he recovered quickly."
      sx: {hanzi: "治療以後，佢恢復到當遽。", pinyin: "cii liauˇ iˊ heu, giˇ fiˊ fug do dongˊ giagˋ."}
      hl: {hanzi: "治療以後，佢恢復到當遽。", pinyin: "chi+ liau rhiˋ heu+, gi fuiˋ fugˋ doˇ dongˋ giag."}
      check: true
    - en: "He's only just out of hospital and still weak: no heavy work."
      sx: {hanzi: "佢正出院，身體還弱弱，毋好做粗事。", pinyin: "giˇ zang cudˋ ien, siinˊ tiˋ hanˇ ngiog ngiog, mˇ hoˋ zo cuˊ se."}
      hl: {hanzi: "佢正出院，身體還弱弱，毋好做粗事。", pinyin: "gi zhangˇ chud rhanˇ, shinˋ tiˊ han ngiogˋ ngiogˋ, m hoˊ zoˇ cuˋ she+."}
    - en: "Put this shirt on; the nurse is coming."
      sx: {hanzi: "這領衫著起來，護士愛來吔。", pinyin: "iaˋ liangˊ samˊ zogˋ hiˋ loiˇ, fu sii oi loiˇ leˊ."}
      hl: {hanzi: "這領衫著起來，護士愛來咧。", pinyin: "liaˊ liangˋ samˋ zhog hiˊ loi, fu+ sii+ oiˇ loi leˋ."}
      check: true
  fill:
    - en: "His knee is swollen."
      sx: {hanzi: "佢个膝頭___起來吔。", pinyin: "giˇ ge qidˋ teuˇ ___ hiˋ loiˇ leˊ.", answer_hanzi: "腫", answer: "zungˋ"}
      hl: {hanzi: "佢个膝頭___起來咧。", pinyin: "gi gaiˇ cid teu ___ hiˊ loi leˋ.", answer_hanzi: "腫", answer: "zhungˊ"}
    - en: "He's going on ninety (not ninety yet), and he's still fit."
      sx: {hanzi: "佢今年___九十歲吔，身體還當健。", pinyin: "giˇ gimˊ ngienˇ ___ giuˋ siib se leˊ, siinˊ tiˋ hanˇ dongˊ kien.", answer_hanzi: "會", answer: "voi"}
      hl: {hanzi: "佢今年___九十歲咧，身體還當健。", pinyin: "gi gimˋ ngien ___ giuˊ shibˋ soiˇ leˋ, shinˋ tiˊ han dongˋ kien+.", answer_hanzi: "會", answer: "voi+"}
    - en: "I'm afraid it will rain."
      sx: {hanzi: "𠊎___會落雨。", pinyin: "ngaiˇ ___ voi log iˋ.", answer_hanzi: "驚怕", answer: "giangˊ pa"}
      hl: {hanzi: "𠊎___會落水。", pinyin: "ngai ___ voi+ logˋ shuiˊ.", answer_hanzi: "驚怕", answer: "giangˋ paˇ"}

