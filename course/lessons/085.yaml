exercises:
  translate:
    - en: "When you have time, you ought to go back to the mainland and see the relatives in the ancestral homeland."
      sx: {hanzi: "有閒个時節，應該愛轉長山看看原鄉个親戚。", pinyin: "iuˊ hanˇ ge siiˇ jiedˋ, in goiˊ oi zonˋ congˇ sanˊ kon kon ngienˇ hiongˊ ge qinˊ qidˋ."}
      hl: {hanzi: "有閒个時節，應該愛轉長山看看原鄉个親戚。", pinyin: "rhiuˋ han gaiˇ shi zied, rhinˇ goiˋ oiˇ zhonˊ chong sanˋ konˇ konˇ ngien hiongˋ gaiˇ cinˋ cid."}
      source: kaga115
    - en: "The museum guide explains the history of the Hakka very clearly."
      sx: {hanzi: "博物館个人解說客家人个歷史，講到當清楚。", pinyin: "bogˋ vud gonˋ ge nginˇ gieˋ sodˋ hagˋ gaˊ nginˇ ge lid siiˋ, gongˋ do dongˊ qinˊ cuˋ."}
      hl: {hanzi: "博物館个人解說客家人个歷史，講到當清楚。", pinyin: "bog vudˋ gonˊ gaiˇ ngin gaiˊ shod hag gaˋ ngin gaiˇ lidˋ siiˊ, gongˊ doˇ dongˋ cinˋ cuˊ."}
      check: true
    - en: "He left his home town to study a great many years ago."
      sx: {hanzi: "佢離開家鄉去讀書盡多年了。", pinyin: "giˇ liˇ koiˊ gaˊ hiongˊ hi tug suˊ qin doˊ ngienˇ leˊ."}
