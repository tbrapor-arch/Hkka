exercises:
  translate:
    - en: "Hakka people working the hills always sang mountain songs while they picked tea."
      sx: {hanzi: "客家人耕山耕園，總係緊摘茶緊唱山歌。", pinyin: "hagˋ gaˊ nginˇ gangˊ sanˊ gangˊ ienˇ, zungˋ he ginˋ zagˋ caˇ ginˋ cong sanˊ goˊ."}
      hl: {hanzi: "客家人耕山耕園，總係緊摘茶緊唱山歌。", pinyin: "hag gaˋ ngin gangˋ sanˋ gangˋ rhan, zungˊ heˇ ginˊ zag ca ginˊ chongˇ sanˋ goˋ."}
      source: moe
      check: true
    - en: "Picking tea, pick the tender tips."
      sx: {hanzi: "摘茶愛摘嫩茶。", pinyin: "zagˋ caˇ oi zagˋ nun caˇ."}
      hl: {hanzi: "摘茶愛摘嫩茶。", pinyin: "zag ca oiˇ zag nun+ ca."}
    - en: "This mountain song fits together really well when it's sung back and forth."
      sx: {hanzi: "這條山歌對唱起來當搭嘴。", pinyin: "iaˋ tiauˇ sanˊ goˊ dui cong hiˋ loiˇ dongˊ dabˋ zoi."}
      hl: {hanzi: "這條山歌對唱起來當搭嘴。", pinyin: "liaˊ tiau sanˋ goˋ duiˇ chongˇ hiˊ loi dongˋ dab zhoiˇ."}
      source: moe
    - en: "Grandma has a lot of old mountain-song records at home."
      sx: {hanzi: "阿婆屋下有當多頭擺个山歌唱片。", pinyin: "aˊ poˇ vugˋ kaˊ iuˊ dongˊ doˊ teuˇ baiˋ ge sanˊ goˊ cong pienˋ."}
      hl: {hanzi: "阿婆屋下有當多頭擺个山歌唱片。", pinyin: "a+ po vug haˋ rhiuˋ dongˋ doˋ teu baiˊ gaiˇ sanˋ goˋ chongˇ pienˊ."}
    - en: "In the tea garden, the tea-picking girl had a singing match with the cowherd on the opposite hill."
      sx: {hanzi: "摘茶阿妹在茶園，同對面山个阿哥拚山歌。", pinyin: "zagˋ caˇ aˊ moi coiˊ caˇ ienˇ, tungˇ dui mien sanˊ ge aˊ goˊ biang sanˊ goˊ."}
      hl: {hanzi: "摘茶阿妹在茶園，摎對面山个阿哥拚山歌。", pinyin: "zag ca a+ moiˇ coiˋ ca rhan, lauˋ duiˇ mienˇ sanˋ gaiˇ a+ goˋ biangˇ sanˋ goˋ."}
      check: true
    - en: "This tune has a lot of high notes; the chrysanthemum song has a lot of low ones."
      sx: {hanzi: "這條曲高音當多，〈菊花〉該條曲低音當多。", pinyin: "iaˋ tiauˇ kiugˋ goˊ imˊ dongˊ doˊ, kiugˋ faˊ ge tiauˇ kiugˋ daiˊ imˊ dongˊ doˊ."}
      hl: {hanzi: "這條曲高音當多，〈菊花〉該條曲低音當多。", pinyin: "liaˊ tiau kiug goˋ rhimˋ dongˋ doˋ, kiug faˋ gai tiau kiug daiˋ rhimˋ dongˋ doˋ."}
      check: true
  fill:
    - en: "So beautiful!"
      sx: {hanzi: "恁___！", pinyin: "anˋ ___!", answer_hanzi: "靚", answer: "jiangˊ"}
      hl: {hanzi: "恁___！", pinyin: "anˊ ___!", answer_hanzi: "靚", answer: "ziangˋ"}
    - en: "He sings a line, I answer with a line."
      sx: {hanzi: "佢唱一句，𠊎___一句。", pinyin: "giˇ cong idˋ gi, ngaiˇ ___ idˋ gi.", answer_hanzi: "應", answer: "en"}
