id: 82
title:
  en: "Grandma teaches Sam a 山歌"
  sx: {hanzi: "恁靚个山歌", pinyin: "anˋ jiangˊ ge sanˊ goˊ"}
  hl: {hanzi: "恁靚个山歌", pinyin: "anˊ ziangˋ gaiˇ sanˋ goˋ"}
review: false
setting: >-
  Saturday 12 June, nine in the morning, on the veranda. Grandpa's hand is healing and he is back in his chair,
  watching the tea field Sam has been cutting for him. A-in, who lives at home again, has the Saturday off. Sam has asked Grandma for a
  singing lesson, and Grandma has put on her good blouse for it.
names: [阿英, 採茶調, 苗栗]

dialogue:
  - n: 1
    speaker: Sam
    en: "Grandma, could you teach me to sing a mountain song?"
    sx: {hanzi: "阿婆，你做得教𠊎唱山歌無？", pinyin: "aˊ poˇ, nˇ zo dedˋ gauˊ ngaiˇ cong sanˊ goˊ moˇ?"}
    hl: {hanzi: "阿婆，你做得教𠊎唱山歌無？", pinyin: "a+ po, ngi zoˇ ded gauˋ ngai chongˇ sanˋ goˋ mo?"}
  - n: 2
    speaker: 阿婆
    en: "I can. I'll start you on an old tune, the 'Tea-picking tune'. A traditional song: everyone in Miaoli knows it, and there are old records of it."
    sx: {hanzi: "做得。𠊎先教你一條老調，〈採茶調〉。傳統个山歌，苗栗人都會唱，乜有頭擺个唱片。", pinyin: "zo dedˋ. ngaiˇ xienˊ gauˊ nˇ idˋ tiauˇ loˋ tiau, caiˋ caˇ tiau. conˇ tungˋ ge sanˊ goˊ, meuˇ lidˋ nginˇ du voi cong, me iuˊ teuˇ baiˋ ge cong pienˋ."}
    hl: {hanzi: "做得。𠊎先教你一條老調，〈採茶調〉。傳統个山歌，苗栗人都會唱，乜有頭擺个唱片。", pinyin: "zoˇ ded. ngai senˋ gauˋ ngi rhid tiau loˊ tiau+, caiˊ ca tiau+. chon tungˊ gaiˇ sanˋ goˋ, miau lid ngin du+ voi+ chongˇ, meˇ rhiuˋ teu baiˊ gaiˇ chongˇ pienˊ."}
    check: true
  - n: 3
    speaker: 阿婆
    en: "(singing) 'In the first month we pick tea: it is New Year,'"
    sx: {hanzi: "正月摘茶是新年，", pinyin: "zangˊ ngied zagˋ caˇ sii xinˊ ngienˇ,", groups: "zangˊ ngied | zagˋ caˇ | sii xinˊ ngienˇ,"}
    hl: {hanzi: "正月摘茶是新年，", pinyin: "zhangˋ ngiedˋ zag ca shi+ sinˋ ngien,", groups: "zhangˋ ngiedˋ | zag ca | shi+ sinˋ ngien,"}
  - n: 4
    speaker: Sam
    en: "(singing after her) 'In the first month we pick tea, it's New Year…'"
    sx: {hanzi: "正月摘茶係新年……", pinyin: "zangˊ ngied zagˋ caˇ he xinˊ ngienˇ …"}
    hl: {hanzi: "正月摘茶係新年……", pinyin: "zhangˋ ngiedˋ zag ca heˇ sinˋ ngien …"}
  - n: 5
    speaker: 阿婆
    en: "Not 係: 是! In a song, some words take the book reading. 係 is for talking, 是 is for singing."
    sx: {hanzi: "毋係「係」，係「是」！唱歌个時節，有兜字用讀書个讀法。講話講「係」，唱歌唱「是」。", pinyin: "mˇ he he, he sii! cong goˊ ge siiˇ jiedˋ, iuˊ deuˊ sii iung tug suˊ ge tug fabˋ. gongˋ fa gongˋ he, cong goˊ cong sii."}
    hl: {hanzi: "毋係「係」，係「是」！唱歌个時節，有兜字用讀書个讀法。講話講「係」，唱歌唱「是」。", pinyin: "m heˇ heˇ, heˇ shi+! chongˇ goˋ gaiˇ shi zied, rhiuˋ deuˋ sii+ rhung+ tugˋ shuˋ gaiˇ tugˋ fab. gongˊ faˇ gongˊ heˇ, chongˇ goˋ chongˇ shi+."}
    check: true
  - n: 6
    speaker: 阿婆
    en: "(singing) 'Sisters, hand in hand, go into the tea garden. Under the tea bushes, I think back: when will the day come that our hard times end?'"
    sx: {hanzi: "姊妹牽手入茶園。茶頭樹下思想起，等到哪日出頭天。", pinyin: "jiˋ moi kienˊ suˋ ngib caˇ ienˇ. caˇ teuˇ su haˊ siiˊ xiongˋ hiˋ, denˋ do nai ngidˋ cudˋ teuˇ tienˊ.", groups: "jiˋ moi | kienˊ suˋ | ngib caˇ ienˇ. caˇ teuˇ | su haˊ | siiˊ xiongˋ hiˋ, denˋ do | nai ngidˋ | cudˋ teuˇ tienˊ."}
    hl: {hanzi: "姊妹牽手入茶園。茶頭樹下思想起，等到哪日出頭天。", pinyin: "ziˊ moiˇ kienˋ shiuˊ ngibˋ ca rhan. ca teu shu+ haˋ siiˋ siongˊ hiˊ, denˊ doˇ nai+ ngid chud teu tienˋ.", groups: "ziˊ moiˇ | kienˋ shiuˊ | ngibˋ ca rhan. ca teu | shu+ haˋ | siiˋ siongˊ hiˊ, denˊ doˇ | nai+ ngid | chud teu tienˋ."}
  - n: 7
    speaker: Sam
    en: "So beautiful! But I can't get it out. The tones of the words and the tune don't match?"
    sx: {hanzi: "恁靚！毋過𠊎唱毋出來。字个聲調同曲調無共樣？", pinyin: "anˋ jiangˊ! mˇ go ngaiˇ cong mˇ cudˋ loiˇ. sii ge sangˊ tiau tungˇ kiugˋ tiau moˇ kiung iong?"}
    hl: {hanzi: "恁靚！毋過𠊎唱毋出來。字个聲調摎曲調無共樣？", pinyin: "anˊ ziangˋ! m goˇ ngai chongˇ m chud loi. sii+ gaiˇ shangˋ tiau+ lauˋ kiug tiau+ mo kiung+ rhong+?"}
  - n: 8
    speaker: 阿婆
    en: "Singing a mountain song, the tune goes high and low, but the words have to stay words. Sing the tones wrong and people won't understand you."
    sx: {hanzi: "唱山歌，曲調有高有低，毋過字還係字。聲調唱毋對，人就聽毋識。", pinyin: "cong sanˊ goˊ, kiugˋ tiau iuˊ goˊ iuˊ daiˊ, mˇ go sii hanˇ he sii. sangˊ tiau cong mˇ dui, nginˇ qiu tangˊ mˇ siidˋ."}
    hl: {hanzi: "唱山歌，曲調有高有低，毋過字還係字。聲調唱毋對，人就聽毋識。", pinyin: "chongˇ sanˋ goˋ, kiug tiau+ rhiuˋ goˋ rhiuˋ daiˋ, m goˇ sii+ han heˇ sii+. shangˋ tiau+ chongˇ m duiˇ, ngin ciu+ tangˋ m shid."}
    check: true
  - n: 9
    speaker: 阿英
    en: "Grandma, you and Grandpa used to sing to each other, didn't you? Did you always have singing matches?"
    sx: {hanzi: "阿婆，你同阿公頭擺係對唱个，係毋係？你兜總係拚山歌？", pinyin: "aˊ poˇ, nˇ tungˇ aˊ gungˊ teuˇ baiˋ he dui cong ge, he mˇ he? nˇ deuˊ zungˋ he biang sanˊ goˊ?"}
    hl: {hanzi: "阿婆，你摎阿公頭擺係對唱个，係毋係？你兜總係拚山歌？", pinyin: "a+ po, ngi lauˋ a+ gungˋ teu baiˊ heˇ duiˇ chongˇ gaiˇ, heˇ m heˇ? ngi deuˋ zungˊ heˇ biangˇ sanˋ goˋ?"}
  - n: 10
    speaker: 阿婆
    en: "That's right. He sang a line, I answered with a line. That's how a song brings two people together."
    sx: {hanzi: "係啊。佢唱一句，𠊎應一句。唱條山歌來結緣。", pinyin: "he a. giˇ cong idˋ gi, ngaiˇ en idˋ gi. cong tiauˇ sanˊ goˊ loiˇ giedˋ ienˇ."}
    hl: {hanzi: "係啊。佢唱一句，𠊎應一句。唱條山歌來結緣。", pinyin: "heˇ a+. gi chongˇ rhid giˇ, ngai enˇ rhid giˇ. chongˇ tiau sanˋ goˋ loi gied rhan."}
  - n: 11
    speaker: 阿公
    en: "(from his chair) The third line. You sang it too fast. And no need to take the high notes so high."
    sx: {hanzi: "第三句，你唱忒遽了。高音乜毋使恁高。", pinyin: "ti samˊ gi, nˇ cong tedˋ giagˋ leˊ. goˊ imˊ me mˇ siiˋ anˋ goˊ."}
    hl: {hanzi: "第三句，你唱忒遽了。高音乜毋使恁高。", pinyin: "ti+ samˋ giˇ, ngi chongˇ ted giag leˋ. goˋ rhimˋ meˇ m siiˊ anˊ goˋ."}
  - n: 12
    speaker: 阿婆
    en: "You sing it, then!"
    sx: {hanzi: "你來唱！", pinyin: "nˇ loiˇ cong!"}
    hl: {hanzi: "你來唱！", pinyin: "ngi loi chongˇ!"}
  - n: 13
    speaker: 阿公
    en: "(slowly, low) 'Under the tea bushes, I think back…'"
    sx: {hanzi: "茶頭樹下思想起……", pinyin: "caˇ teuˇ su haˊ siiˊ xiongˋ hiˋ …"}
    hl: {hanzi: "茶頭樹下思想起……", pinyin: "ca teu shu+ haˋ siiˋ siongˊ hiˊ …"}
  - n: 14
    speaker: Sam
    en: "(to A-in, whispering) The old couple singing to each other: in tune, and lovely to hear."
    sx: {hanzi: "佢兩公婆對唱，合線又好聽。", pinyin: "giˇ liongˋ gungˊ poˇ dui cong, gabˋ xien iu hoˋ tangˊ."}
    hl: {hanzi: "佢兩公婆對唱，合線又好聽。", pinyin: "gi liongˊ gungˋ po duiˇ chongˇ, gab sienˇ rhiu+ hoˊ tangˋ."}

notes:
  - ref: 2
    topic: culture
    text: >
      〈採茶調〉 "the Tea-picking tune": the course quotes the dictionary's example sentence, which gives these lines as
      引自客家山歌〈採茶調〉 ("quoted from the Hakka mountain song 'Tea-picking tune'"), with no author or date. Whether
      this wording is anonymous folk text is not in the data: check a printed collection before relying on it. 傳統 conˇ tungˋ "traditional". 調 tiau "tune": the official examples also
      name the classic tunes 〈老山歌〉、〈山歌子〉、〈平板〉. Whether every Miaoli person can sing this one is Grandma's
      claim, not the data's.
  - ref: 3
    topic: grammar
    text: >
      Lines 3 and 6 are the official text, word for word: 正月摘茶是新年，姊妹牽手入茶園。茶頭樹下思想起，等到哪日出頭天。
      Seven syllables a line, three beats (`groups`). The rhyme is on lines 1, 2 and 4: 年 ngienˇ, 園 ienˇ, 天 tienˊ, all
      -ien in Sixian. In Hailu 園 is rhan, so there the rhyme is only near. The dictionary gives the song only as a Sixian example; the
      Hailu column is the course's own transposition.
      Sandhi: 正 zangˊ before 月 ngied (陽入) is sung zangˇ (lesson 0).
  - ref: 5
    topic: grammar
    text: >
      是 sii, the book word for "is", where speech says 係 (lesson 1). Grandma's rule "係 for talking, 是 for singing"
      matches the song's text, which has 是; the official examples use 係 everywhere else, and 是 otherwise only in
      compounds (是非, 真是). The rule rests on this one song, and it is for songs: Sam's poem in lesson 81 says 係, as
      speech does. Compare 生 sangˊ / senˊ (lesson 37).
  - ref: 6
    topic: vocab
    text: >
      姊妹 jiˋ moi "sisters, the girls"; 入 ngib "go into"; 樹下 su haˊ "under the trees, the bushes"; 思想起 siiˊ xiongˋ hiˋ
      "think back, remember (with longing)", a set phrase of songs; 哪日 "which day, when"; 出頭天 cudˋ teuˇ tienˊ "the
      day you rise out of hardship". The song is a girl's song: picking tea is hard, and she hopes for better days.
  - ref: 7
    topic: grammar
    text: >
      恁靚 "so beautiful": 恁 + adjective as an exclamation (lesson 34), with 靚 jiangˊ (lesson 15), the everyday Hakka
      "beautiful". 唱毋出來 "can't get it out (when singing)": V毋出來, as 講毋出來 (lesson 62). 聲調 "tone" (lesson
      53) against 曲調 kiugˋ tiau "tune, melody".
  - ref: 8
    topic: culture
    text: >
      What Grandma says about tones and melody is general knowledge about Hakka singing, not something the data
      states: the tune has its own shape, but a singer keeps the words recognisable. 有高有低 "goes up and down":
      有 X 有 Y for two opposites. 聽毋識 "can't understand (by listening)".
  - ref: 10
    topic: culture
    text: >
      對唱 dui cong "sing to each other, antiphonal singing": an official example says 客家山歌係男女對唱个較多 "Hakka
      mountain songs are mostly sung back and forth between men and women". 應 en "answer, respond". 唱條山歌來結緣
      "sing a mountain song and make a bond" is the official sentence, word for word (Sixian only, like the two
      exercises marked as official; their Hailu columns are the course's transposition); 結緣 "form a bond". 合線
      gabˋ xien "in tune, in harmony", from 佢兩公婆對唱客家山歌，合線又好聽 (line 14).
  - ref: 11
    topic: culture
    text: >
      第三句 "the third line": Grandpa remembers exactly where the song slows down. It is the line he sang to her fifty
      years ago, in this course's story.

