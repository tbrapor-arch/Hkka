id: 33
title:
  en: "Lucie's phone"
  sx: {hanzi: "手機仔打毋見忒了", pinyin: "suˋ giˊ eˋ daˋ mˇ gien tedˋ leˊ"}
  hl: {hanzi: "手機打毋見忒了", pinyin: "shiuˊ giˋ daˊ m gienˇ ted leˋ"}
review: false
setting: >-
  Breakfast, two days before Lucie flies home. Lucie comes down the stairs in a panic; Sam translates, and the whole
  family starts searching.
names: [Lucie, 阿英, 阿明]

dialogue:
  - n: 1
    speaker: Lucie
    en: "(in French) Sam! My phone… I can't find it!"
    sx: {hanzi: "Sam ! Mon téléphone… Je ne le trouve plus !", pinyin: "Sam ! Mon téléphone… Je ne le trouve plus !"}
    hl: {hanzi: "Sam ! Mon téléphone… Je ne le trouve plus !", pinyin: "Sam ! Mon téléphone… Je ne le trouve plus !"}
  - n: 2
    speaker: Sam
    en: "Grandma, Lucie's lost her phone!"
    sx: {hanzi: "阿婆，Lucie 个手機仔打毋見忒了！", pinyin: "aˊ poˇ, Lucie ge suˋ giˊ eˋ daˋ mˇ gien tedˋ leˊ!"}
    hl: {hanzi: "阿婆，Lucie 个手機打毋見忒了！", pinyin: "a+ po, Lucie gaiˇ shiuˊ giˋ daˊ m gienˇ ted leˋ!"}
  - n: 3
    speaker: 阿婆
    en: "No need to panic. Where did she put it a moment ago?"
    sx: {hanzi: "毋使驚。佢頭先放在哪位？", pinyin: "mˇ siiˋ giangˊ. giˇ teuˇ xienˊ biong coiˊ nai vi?"}
    hl: {hanzi: "毋使驚。佢頭先放在哪位？", pinyin: "m siiˊ giangˋ. gi teu senˋ biongˇ coiˋ nai+ vui+?"}
  - n: 4
    speaker: Sam
    en: "She doesn't remember. Last night she still had it: she was on it in bed."
    sx: {hanzi: "佢毋記得了。昨暗晡還有，佢在床項打電話。", pinyin: "giˇ mˇ gi dedˋ leˊ. coˊ am buˊ hanˇ iuˊ, giˇ coiˊ congˇ hong daˋ tien fa."}
    hl: {hanzi: "佢毋記得了。昨暗晡還有，佢在床項打電話。", pinyin: "gi m giˇ ded leˋ. coˋ amˇ buˋ han rhiuˋ, gi coiˋ cong hong+ daˊ tien+ faˇ."}
  - n: 5
    speaker: 阿明
    en: "Did it fall out in the car? I'll go and look."
    sx: {hanzi: "係毋係跌忒在車項？𠊎去尋。", pinyin: "he mˇ he diedˋ tedˋ coiˊ caˊ hong? ngaiˇ hi qimˇ."}
    hl: {hanzi: "係毋係跌忒在車項？𠊎去尋。", pinyin: "heˇ m heˇ died ted coiˋ chaˋ hong+? ngai hiˇ cim."}
  - n: 6
    speaker: 阿英
    en: "(a minute later) Not in the car. Not under the stools either."
    sx: {hanzi: "車項尋無。凳仔下背乜尋無。", pinyin: "caˊ hong qimˇ moˇ. den eˋ haˊ boi me qimˇ moˇ."}
    hl: {hanzi: "車項尋無。凳仔下背乜尋無。", pinyin: "chaˋ hong+ cim mo. denˇ er haˋ boiˇ meˇ cim mo."}
  - n: 7
    speaker: 阿英
    en: "I'll ring it. Everyone, listen!"
    sx: {hanzi: "𠊎打手機仔分佢。大家聽！", pinyin: "ngaiˇ daˋ suˋ giˊ eˋ bunˊ giˇ. tai gaˊ tangˊ!"}
    hl: {hanzi: "𠊎打手機分佢。大家聽！", pinyin: "ngai daˊ shiuˊ giˋ bunˋ gi. tai+ gaˋ tangˋ!"}
  - n: 8
    speaker: 阿婆
    en: "It's ringing! … Grandpa, it's in your pocket!"
    sx: {hanzi: "響了！……阿公，在你个袋仔！", pinyin: "hiongˋ leˊ! … aˊ gungˊ, coiˊ nˇ ge toi eˋ!"}
    hl: {hanzi: "響了！……阿公，在你个袋仔！", pinyin: "hiongˊ leˋ! … a+ gungˋ, coiˋ ngi gaiˇ toi+ er!"}
  - n: 9
    speaker: 阿公
    en: "(taking it out, puzzled) Isn't this mine?"
    sx: {hanzi: "這……毋係𠊎个？", pinyin: "iaˋ … mˇ he ngaiˇ ge?"}
    hl: {hanzi: "這……毋係𠊎个？", pinyin: "liaˊ … m heˇ ngai gaiˇ?"}
  - n: 10
    speaker: 阿婆
    en: "Yours is on the table! The two of them are the same black, and you can't even tell your own!"
    sx: {hanzi: "你个在桌項！兩支共樣烏，你連自家个都毋知！", pinyin: "nˇ ge coiˊ zogˋ hong! liongˋ giˊ kiung iong vuˊ, nˇ lienˇ qi gaˊ ge du mˇ diˊ!"}
    hl: {hanzi: "你个在桌項！兩支共樣烏，你連自家个都毋知！", pinyin: "ngi gaiˇ coiˋ zog hong+! liongˊ giˋ kiung+ rhong+ vuˋ, ngi lien cid gaˋ gaiˇ du+ m diˋ!"}
  - n: 11
    speaker: 阿公
    en: "I picked it up off the table just now… Here, give it back to her."
    sx: {hanzi: "𠊎頭先在桌項拈个……好，還分佢。", pinyin: "ngaiˇ teuˇ xienˊ coiˊ zogˋ hong ngiamˊ ge … hoˋ, vanˇ bunˊ giˇ."}
    hl: {hanzi: "𠊎頭先在桌項拈个……好，還分佢。", pinyin: "ngai teu senˋ coiˋ zog hong+ ngiamˋ gaiˇ … hoˊ, van bunˋ gi."}
  - n: 12
    speaker: Lucie
    en: "(in French, hugging Grandpa) Thank you, Grandpa!"
    sx: {hanzi: "Merci, Grandpa !", pinyin: "Merci, Grandpa !"}
    hl: {hanzi: "Merci, Grandpa !", pinyin: "Merci, Grandpa !"}
  - n: 13
    speaker: 阿婆
    en: "Right, it's found. Everyone eat up; we'll talk once we've finished eating."
    sx: {hanzi: "好了，尋著了。大家緊食，食煞正講。", pinyin: "hoˋ leˊ, qimˇ doˋ leˊ. tai gaˊ ginˋ siid, siid sod zang gongˋ."}
    hl: {hanzi: "好了，尋著了。大家緊食，食煞正講。", pinyin: "hoˊ leˋ, cim doˊ leˋ. tai+ gaˋ ginˊ shidˋ, shidˋ sod zhangˇ gongˊ."}

notes:
  - ref: 2
    topic: grammar
    text: >
      Two ways to lose something. 打毋見忒 daˋ mˇ gien tedˋ "lose, mislay", literally "hit-not-see-away": you no longer know
      where it is. 跌忒 diedˋ tedˋ (line 5) "drop, lose": it fell somewhere. 忒 is the "away, gone" ending of lesson 27
      (鹹忒 "too salty"): here, after a verb, it says the thing is gone. 手機仔 "mobile phone" (Hailu 手機).
  - ref: 3
    topic: grammar
    text: >
      毋使驚 "don't worry, no need to be afraid": 毋使 (lesson 11) only reassures, where 莫 (lesson 12) "don't!" forbids. 頭先 teuˇ xienˊ "a moment ago, just now".
  - ref: 4
    topic: grammar
    text: >
      記得 gi dedˋ "remember", 毋記得 "forget" (literally "not remember"): Hakka has no separate word for "forget" in
      everyday speech. 昨暗晡 "last night": 昨 "yesterday" + 暗晡 "evening". 床項 "in bed": 項 "on" again (lesson 29).
  - ref: 6
    topic: grammar
    text: >
      尋 qimˇ "look for" (the Mandarin 找); 尋無 "look for and not find, can't find"; 尋著 (line 13) "look for and find,
      found". The verb says what you did, the ending says how it came out: 看著 "saw", 尋著 "found", 尋無 "didn't find".
      下背 haˊ boi "under, underneath".
  - ref: 10
    topic: grammar
    text: >
      共樣 "the same" (lesson 15): 兩支共樣烏 "the two (phones) are the same black". 支 is the classifier for a phone. 連自家个都
      毋知 "doesn't even know his own": 連…都 "even", as in Mandarin.
  - ref: 11
    topic: grammar
    text: >
      拈 ngiamˊ "pick up (a small thing)". 還分佢 "give it back to her": 還 (lesson 30) + 分 "to".
  - ref: 13
    topic: grammar
    text: >
      食煞 "finish eating": 煞 sod "end, finish" goes after the verb, like 忒 and 著: 講煞 "finish talking", 做煞 "finish
      working". 食煞正講 "eat first, talk after": 正 "only then" (lesson 24, 食飽正食). 好 does the same job when the
      result is "done properly": 洗好 "washed (and done)", 放好 "put away properly".

