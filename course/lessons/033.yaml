exercises:
  translate:
    - en: "I've lost my phone. Have you seen it?"
      sx: {hanzi: "𠊎个手機仔打毋見忒了，你有看著無？", pinyin: "ngaiˇ ge suˋ giˊ eˋ daˋ mˇ gien tedˋ leˊ, nˇ iuˊ kon doˋ moˇ?"}
      hl: {hanzi: "𠊎个手機打毋見忒了，你有看著無？", pinyin: "ngai gaiˇ shiuˊ giˋ daˊ m gienˇ ted leˋ, ngi rhiuˋ konˇ doˊ mo?"}
    - en: "No need to look for it: it's under the bed."
      sx: {hanzi: "毋使尋，在床下背。", pinyin: "mˇ siiˋ qimˇ, coiˊ congˇ haˊ boi."}
      hl: {hanzi: "毋使尋，在床下背。", pinyin: "m siiˊ cim, coiˋ cong haˋ boiˇ."}
    - en: "Grandma has finished talking; Sam has washed the bowls."
      sx: {hanzi: "阿婆講煞了，Sam 碗洗好了。", pinyin: "aˊ poˇ gongˋ sod leˊ, Sam vonˋ seˋ hoˋ leˊ."}
      hl: {hanzi: "阿婆講煞了，Sam 碗洗好了。", pinyin: "a+ po gongˊ sod leˋ, Sam vonˊ seˊ hoˊ leˋ."}
    - en: "Do you remember? We ate here last night."
      sx: {hanzi: "你記得無？𫣆兜昨暗晡在這食飯。", pinyin: "nˇ gi dedˋ moˇ? enˊ deuˊ coˊ am buˊ coiˊ iaˋ siid fan."}
      hl: {hanzi: "你記得無？𫣆兜昨暗晡在這食飯。", pinyin: "ngi giˇ ded mo? enˋ deuˋ coˋ amˇ buˋ coiˋ liaˊ shidˋ pon+."}
    - en: "Our two phones are the same: both black."
      sx: {hanzi: "𠊎兜兩支手機仔共樣，都係烏个。", pinyin: "ngaiˇ deuˊ liongˋ giˊ suˋ giˊ eˋ kiung iong, du he vuˊ ge."}
      hl: {hanzi: "𠊎兜兩支手機共樣，都係烏个。", pinyin: "ngai deuˋ liongˊ giˋ shiuˊ giˋ kiung+ rhong+, du+ heˇ vuˋ gaiˇ."}
  fill:
    - en: "I forgot."
      sx: {hanzi: "𠊎___了。", pinyin: "ngaiˇ ___ leˊ.", answer_hanzi: "毋記得", answer: "mˇ gi dedˋ"}
      hl: {hanzi: "𠊎___了。", pinyin: "ngai ___ leˋ.", answer_hanzi: "毋記得", answer: "m giˇ ded"}
    - en: "Found it!"
      sx: {hanzi: "___著了！", pinyin: "___ doˋ leˊ!", answer_hanzi: "尋", answer: "qimˇ"}
      hl: {hanzi: "___著了！", pinyin: "___ doˊ leˋ!", answer_hanzi: "尋", answer: "cim"}
    - en: "Pick it up, it's fallen on the ground."
      sx: {hanzi: "___起來，跌忒在地泥項。", pinyin: "___ hiˋ loiˇ, diedˋ tedˋ coiˊ ti naiˇ hong.", answer_hanzi: "拈", answer: "ngiamˊ"}
      hl: {hanzi: "___起來，跌忒在地泥項。", pinyin: "___ hiˊ loi, died ted coiˋ ti+ nai hong+.", answer_hanzi: "拈", answer: "ngiamˋ"}

