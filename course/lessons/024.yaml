id: 24
title:
  en: "At the pharmacy"
  sx: {hanzi: "食飽正食", pinyin: "siid bauˋ zang siid"}
  hl: {hanzi: "食飽正食", pinyin: "shidˋ bauˊ zhangˇ shidˋ"}
review: false
setting: >-
  Wednesday morning. Grandpa coughed all night, and Grandma sends him to the pharmacy in town with Sam, because he
  will not go to a doctor. The pharmacist has known him for forty years.
names: [阿明]

dialogue:
  - n: 1
    speaker: 頭家
    en: "Uncle, what's wrong? (where doesn't it feel right?)"
    sx: {hanzi: "阿伯，哪位毋鬆爽？", pinyin: "aˊ bagˋ, nai vi mˇ sungˊ songˋ?"}
    hl: {hanzi: "阿伯，哪位毋鬆爽？", pinyin: "a+ bag, nai+ vui+ m sungˋ songˊ?"}
  - n: 2
    speaker: 阿公
    en: "Caught a cold."
    sx: {hanzi: "寒著。", pinyin: "honˇ doˋ."}
    hl: {hanzi: "冷著。", pinyin: "langˋ doˊ."}
  - n: 3
    speaker: Sam
    en: "Yesterday he sat out in front of the temple for a whole day, watching the opera. Now his nose is running."
    sx: {hanzi: "佢昨晡日在廟前坐一日，看收冬戲。這下流鼻水。", pinyin: "giˇ coˊ buˊ ngidˋ coiˊ meu qienˇ coˊ idˋ ngidˋ, kon suˊ dungˊ hi. iaˋ ha liuˇ pi suiˋ."}
    hl: {hanzi: "佢昨晡日在廟前坐一日，看收冬戲。這下流鼻水。", pinyin: "gi coˋ buˋ ngid coiˋ miau+ cien coˋ rhid ngid, konˇ shiuˋ dungˋ hiˇ. liaˊ ha+ lau pi+ shuiˊ."}
  - n: 4
    speaker: 頭家
    en: "Does your throat hurt? Are you coughing?"
    sx: {hanzi: "喉嗹痛無？會咳嗽無？", pinyin: "heuˇ lienˇ tung moˇ? voi kiedˋ cug moˇ?"}
    hl: {hanzi: "喉嗹痛無？會咳嗽無？", pinyin: "heu lien tungˇ mo? voi+ kied cugˋ mo?"}
  - n: 5
    speaker: 阿公
    en: "I am."
    sx: {hanzi: "會。", pinyin: "voi."}
    hl: {hanzi: "會。", pinyin: "voi+."}
  - n: 6
    speaker: 頭家
    en: "Take this medicine three times a day, after meals. For three days."
    sx: {hanzi: "這藥仔一日食三擺，食飽正食。食三日。", pinyin: "iaˋ iog eˋ idˋ ngidˋ siid samˊ baiˋ, siid bauˋ zang siid. siid samˊ ngidˋ."}
    hl: {hanzi: "這藥仔一日食三擺，食飽正食。食三日。", pinyin: "liaˊ rhogˋ er rhid ngid shidˋ samˋ baiˊ, shidˋ bauˊ zhangˇ shidˋ. shidˋ samˋ ngid."}
  - n: 7
    speaker: 阿公
    en: "Three days? One is enough."
    sx: {hanzi: "三日？一日就罅吔。", pinyin: "samˊ ngidˋ? idˋ ngidˋ qiu la leˊ."}
    hl: {hanzi: "三日？一日就罅咧。", pinyin: "samˋ ngid? rhid ngid ciu+ la+ leˋ."}
  - n: 8
    speaker: Sam
    en: "Grandpa! He said three days!"
    sx: {hanzi: "阿公！頭家講三日！", pinyin: "aˊ gungˊ! teuˇ gaˊ gongˋ samˊ ngidˋ!"}
    hl: {hanzi: "阿公！頭家講三日！", pinyin: "a+ gungˋ! teu gaˋ gongˊ samˋ ngid!"}
  - n: 9
    speaker: 頭家
    en: "(laughing, holding out a handful of sweets) The medicine's very bitter. Here, these sweets are for you."
    sx: {hanzi: "這藥仔當苦。這兜糖仔分你。", pinyin: "iaˋ iog eˋ dongˊ fuˋ. iaˋ deuˊ tongˇ eˋ bunˊ nˇ."}
    hl: {hanzi: "這藥仔當苦。這兜糖仔分你。", pinyin: "liaˊ rhogˋ er dongˋ fuˊ. liaˊ deuˋ tong er bunˋ ngi."}
  - n: 10
    speaker: 阿公
    en: "(pocketing the sweets; to Sam) You give him the money."
    sx: {hanzi: "錢，你分頭家。", pinyin: "qienˇ, nˇ bunˊ teuˇ gaˊ."}
    hl: {hanzi: "錢，你分頭家。", pinyin: "cien, ngi bunˋ teu gaˋ."}
  - n: 11
    speaker: Sam
    en: "…Yes, Grandpa."
    sx: {hanzi: "……係，阿公。", pinyin: "… he, aˊ gungˊ."}
    hl: {hanzi: "……係，阿公。", pinyin: "… heˇ, a+ gungˋ."}

notes:
  - ref: 1
    topic: vocab
    text: >
      哪位毋鬆爽？ "where doesn't it feel right? what's wrong?": 鬆爽 sungˊ songˋ "comfortable, at ease", 毋鬆爽 "unwell,
      not feeling right". 哪位 "where" (lesson 6) asks which part of you.
  - ref: 2
    topic: vocab
    text: >
      寒著 honˇ doˋ "catch a cold" (感冒): 寒 "cold" + 著 doˋ "get", like 看著 "get to see". 感冒 gamˋ mo is also
      understood. Hailu says 冷著, as it says 冷 for 寒.
  - ref: 3
    topic: grammar
    text: >
      坐一日 "sat for a (whole) day": the length of time comes after the verb, as in Mandarin 坐了一天. 日 ngidˋ "day":
      一日, 三日.
  - ref: 4
    topic: vocab
    text: >
      喉嗹 heuˇ lienˇ "throat" (喉嚨). 咳嗽 kiedˋ cug "cough". The answer to 會…無？ is 會 (yes) or 毋會 (no), as in
      lesson 15.
  - ref: 6
    topic: grammar
    text: >
      一日食三擺 "three times a day", word for word "one day eat three times": the frequency comes after the verb.
      食飽正食 "take it only after eating", literally "eat (until) full, only then take (it)": the 正 of lessons 16
      and 19 again. Medicine is 食, like food and tea.
  - ref: 7
    topic: vocab
    text: >
      罅 la "enough": 一日就罅吔 "one day will do". 毋罅 "not enough". A Hakka word with its own character; Mandarin 夠.
  - ref: 9
    topic: false-friend
    text: >
      分 bunˊ is "give": 這兜糖仔分你 "these sweets are for you", 錢分頭家 "give the money to the shopkeeper". It is the
      same character as 分 funˊ "divide", read differently and meaning something else. This 分 will grow: "let"
      in lesson 25, "to (someone)" and the passive later; for now, it gives. 糖仔 tongˇ eˋ "sweets".
  - ref: 10
    topic: culture
    text: >
      Grandpa's sentence puts the money first, as the topic: 錢，你分頭家 "the money, you give it to him". He has
      the sweets; Sam has the bill.
  - ref: 0
    topic: hailu
    text: >
      Hailu: 冷著 for 寒著, 分 bunˋ, 罅 la+. "Nose" is 鼻空 in Hailu, 鼻公 in Sixian.

