exercises:
  translate:
    - en: "A-min has a cold: his nose is running, and it's all red."
      sx: {hanzi: "阿明寒著，流鼻水，鼻公當紅。", pinyin: "aˊ minˇ honˇ doˋ, liuˇ pi suiˋ, pi gungˊ dongˊ fungˇ."}
      hl: {hanzi: "阿明冷著，流鼻水，鼻空當紅。", pinyin: "a+ min langˋ doˊ, lau pi+ shuiˊ, pi+ kungˋ dongˋ fung."}
    - en: "Take two pills each time, after meals."
      sx: {hanzi: "一擺食兩粒，食飽正食。", pinyin: "idˋ baiˋ siid liongˋ liab, siid bauˋ zang siid."}
      hl: {hanzi: "一擺食兩粒，食飽正食。", pinyin: "rhid baiˊ shidˋ liongˊ liab, shidˋ bauˊ zhangˇ shidˋ."}
    - en: "This medicine is very bitter."
      sx: {hanzi: "這藥仔當苦。", pinyin: "iaˋ iog eˋ dongˊ fuˋ."}
      hl: {hanzi: "這藥仔當苦。", pinyin: "liaˊ rhogˋ er dongˋ fuˊ."}
    - en: "Grandma gives Sam a packet of sweets."
      sx: {hanzi: "阿婆分 Sam 一包糖仔。", pinyin: "aˊ poˇ bunˊ Sam idˋ bauˊ tongˇ eˋ."}
      hl: {hanzi: "阿婆分 Sam 一包糖仔。", pinyin: "a+ po bunˋ Sam rhid bauˋ tong er."}
    - en: "Is there enough water? — Not enough."
      sx: {hanzi: "水罅無？——毋罅。", pinyin: "suiˋ la moˇ? — mˇ la."}
      hl: {hanzi: "水罅無？——毋罅。", pinyin: "shuiˊ la+ mo? — m la+."}
    - en: "He's ill; he has to go to the pharmacy."
      sx: {hanzi: "佢破病吔，愛去藥房。", pinyin: "giˇ po piang leˊ, oi hi iog fongˇ."}
      hl: {hanzi: "佢破病咧，愛去藥房。", pinyin: "gi poˇ piang+ leˋ, oiˇ hiˇ rhog fong."}
    - en: "Grandpa is in very good health."
      sx: {hanzi: "阿公个身體當好。", pinyin: "aˊ gungˊ ge siinˊ tiˋ dongˊ hoˋ."}
      hl: {hanzi: "阿公个身體當好。", pinyin: "a+ gungˋ gaiˇ shinˋ tiˊ dongˋ hoˊ."}
  fill:
    - en: "Three times a day."
      sx: {hanzi: "一日三___。", pinyin: "idˋ ngidˋ samˊ ___.", answer_hanzi: "擺", answer: "baiˋ"}
      hl: {hanzi: "一日三___。", pinyin: "rhid ngid samˋ ___.", answer_hanzi: "擺", answer: "baiˊ"}
    - en: "Take it only after eating."
      sx: {hanzi: "食飽___食。", pinyin: "siid bauˋ ___ siid.", answer_hanzi: "正", answer: "zang"}
      hl: {hanzi: "食飽___食。", pinyin: "shidˋ bauˊ ___ shidˋ.", answer_hanzi: "正", answer: "zhangˇ"}
    - en: "One day is enough."
      sx: {hanzi: "一日就___吔。", pinyin: "idˋ ngidˋ qiu ___ leˊ.", answer_hanzi: "罅", answer: "la"}
      hl: {hanzi: "一日就___咧。", pinyin: "rhid ngid ciu+ ___ leˋ.", answer_hanzi: "罅", answer: "la+"}

