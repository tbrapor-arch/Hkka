exercises:
  translate:
    - en: "There's nobody at home."
      sx: {hanzi: "無人在屋下。", pinyin: "moˇ nginˇ cai vugˋ kaˊ."}
      hl: {hanzi: "無人在屋下。", pinyin: "mo ngin cai+ vug haˋ."}
    - en: "Grandma burns incense at the shrine every morning."
      sx: {hanzi: "阿婆逐日朝晨去伯公下燒香。", pinyin: "aˊ poˇ dagˋ ngidˋ zeuˊ siinˇ hi bagˋ gungˊ haˊ seuˊ hiongˊ."}
      hl: {hanzi: "阿婆逐日朝晨去伯公下燒香。", pinyin: "a+ po dag ngid zhauˋ shin hiˇ bag gungˋ haˋ shauˋ hiongˋ."}
    - en: "What's your name? — My surname is Liu, my name is A-min."
      sx: {hanzi: "你安到麼个？——𠊎姓劉，安到阿明。", pinyin: "nˇ onˊ do maˋ ge? — ngaiˇ xiang liuˇ, onˊ do aˊ minˇ."}
      hl: {hanzi: "你安到麼个？——𠊎姓劉，安到阿明。", pinyin: "ngi onˋ doˇ maˊ gaiˇ? — ngai siangˇ liu, onˋ doˇ a+ min."}
    - en: "Where do you live? — I live in 苗栗."
      sx: {hanzi: "你在哪位歇？——𠊎在苗栗歇。", pinyin: "nˇ coiˊ nai vi hed? — ngaiˇ coiˊ meuˇ lid hed."}
      hl: {hanzi: "你在哪位歇？——𠊎在苗栗歇。", pinyin: "ngi coiˋ nai+ vui+ hied? — ngai coiˋ miau lidˋ hied."}
    - en: "Long time no see! Are you well?"
      sx: {hanzi: "恁久無看著！恁久好無？", pinyin: "anˋ giuˋ moˇ kon doˋ! anˋ giuˋ hoˋ moˇ?"}
      hl: {hanzi: "恁久無看著！恁久好無？", pinyin: "anˊ giuˊ mo konˇ doˊ! anˊ giuˊ hoˊ mo?"}
    - en: "In front of the temple there's an opera."
      sx: {hanzi: "廟前有戲。", pinyin: "meu qienˇ iuˊ hi."}
      hl: {hanzi: "廟前有戲。", pinyin: "miau+ cien rhiuˋ hiˇ."}
    - en: "Have you seen A-min? — No, I haven't."
      sx: {hanzi: "你有看著阿明無？——無看著。", pinyin: "nˇ iuˊ kon doˋ aˊ minˇ moˇ? — moˇ kon doˋ."}
      hl: {hanzi: "你有看著阿明無？——無看著。", pinyin: "ngi rhiuˋ konˇ doˊ a+ min mo? — mo konˇ doˊ."}
    - en: "Lately Grandpa has been very busy."
      sx: {hanzi: "阿公恁久當無閒。", pinyin: "aˊ gungˊ anˋ giuˋ dongˊ moˇ hanˇ."}
      hl: {hanzi: "阿公恁久當無閒。", pinyin: "a+ gungˋ anˊ giuˊ dongˋ mo han."}
    - en: "Everyone at home is safe and well."
      sx: {hanzi: "屋下人都平安。", pinyin: "vugˋ kaˊ nginˇ du pinˇ onˊ."}
      hl: {hanzi: "屋下人都平安。", pinyin: "vug haˋ ngin du+ pin onˋ."}
  fill:
    - en: "My name is Sam."
      sx: {hanzi: "𠊎___Sam。", pinyin: "ngaiˇ ___ Sam.", answer_hanzi: "安到", answer: "onˊ do"}
      hl: {hanzi: "𠊎___Sam。", pinyin: "ngai ___ Sam.", answer_hanzi: "安到", answer: "onˋ doˇ"}
    - en: "Don't eat it! (a rule)"
      sx: {hanzi: "___食！", pinyin: "___ siid!", answer_hanzi: "毋好", answer: "mˇ hoˋ"}
      hl: {hanzi: "___食！", pinyin: "___ shidˋ!", answer_hanzi: "毋好", answer: "m hoˊ"}
    - en: "Great-uncle and great-aunt."
      sx: {hanzi: "伯公同___。", pinyin: "bagˋ gungˊ tungˇ ___.", answer_hanzi: "伯婆", answer: "bagˋ poˇ"}
      hl: {hanzi: "伯公摎___。", pinyin: "bag gungˋ lauˋ ___.", answer_hanzi: "伯婆", answer: "bag po"}

