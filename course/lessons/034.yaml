exercises:
  translate:
    - en: "The wind is strong: shut the window."
      sx: {hanzi: "風當大，窗門關好來。", pinyin: "fungˊ dongˊ tai, cungˊ munˇ guanˊ hoˋ loiˇ."}
      hl: {hanzi: "風當大，窗門關好來。", pinyin: "fungˋ dongˋ tai+, cungˋ mun guanˋ hoˊ loi."}
    - en: "Tomorrow the temperature will drop to just eight degrees."
      sx: {hanzi: "天光日溫度會落到八度定定。", pinyin: "tienˊ gongˊ ngidˋ vunˊ tu voi log do badˋ tu tin tin."}
      hl: {hanzi: "韶早溫度會落到八度定定。", pinyin: "shau zoˊ vunˋ tu+ voi+ logˋ doˇ bad tu+ tin+ tin+."}
    - en: "The weather is bad: going out is dangerous."
      sx: {hanzi: "天時毋好，出去當危險。", pinyin: "tienˊ siiˇ mˇ hoˋ, cudˋ hi dongˊ nguiˇ hiamˋ."}
      hl: {hanzi: "天時毋好，出去當危險。", pinyin: "tienˋ shi m hoˊ, chud hiˇ dongˋ ngui hiamˊ."}
    - en: "In the old days, did it snow on 合歡山?"
      sx: {hanzi: "頭擺合歡山會落雪無？", pinyin: "teuˇ baiˋ hab fonˊ sanˊ voi log xiedˋ moˇ?"}
      hl: {hanzi: "頭擺合歡山會落雪無？", pinyin: "teu baiˊ habˋ fonˋ sanˋ voi+ logˋ sied mo?"}
    - en: "Miaoli is hot in summer and cold in winter."
      sx: {hanzi: "苗栗熱天當熱，寒天當寒。", pinyin: "meuˇ lidˋ ngied tienˊ dongˊ ngied, honˇ tienˊ dongˊ honˇ."}
      hl: {hanzi: "苗栗熱天當熱，冷天當冷。", pinyin: "miau lid ngiedˋ tienˋ dongˋ ngiedˋ, langˋ tienˋ dongˋ langˋ."}
    - en: "Let's go up the mountain to see the snow!"
      sx: {hanzi: "𫣆兜上山看雪！", pinyin: "enˊ deuˊ songˊ sanˊ kon xiedˋ!"}
      hl: {hanzi: "𫣆兜上山看雪！", pinyin: "enˋ deuˋ shongˋ sanˋ konˇ sied!"}
  fill:
    - en: "My hat was blown away by the wind."
      sx: {hanzi: "𠊎个帽仔___風吹走了。", pinyin: "ngaiˇ ge mo eˋ ___ fungˊ coiˊ zeuˋ leˊ.", answer_hanzi: "分", answer: "bunˊ"}
      hl: {hanzi: "𠊎个帽仔___風吹走了。", pinyin: "ngai gaiˇ mo+ er ___ fungˋ choiˋ zeuˊ leˋ.", answer_hanzi: "分", answer: "bunˋ"}
    - en: "Will it rain tomorrow?"
      sx: {hanzi: "天光日___落雨無？", pinyin: "tienˊ gongˊ ngidˋ ___ log iˋ moˇ?", answer_hanzi: "會", answer: "voi"}
      hl: {hanzi: "韶早___落水無？", pinyin: "shau zoˊ ___ logˋ shuiˊ mo?", answer_hanzi: "會", answer: "voi+"}
    - en: "Will the plane leave on time?"
      sx: {hanzi: "飛行機會___無？", pinyin: "biˊ hangˇ giˊ voi ___ moˇ?", answer_hanzi: "準時", answer: "zunˋ siiˇ"}
      hl: {hanzi: "飛行機會___無？", pinyin: "fuiˋ hang giˋ voi+ ___ mo?", answer_hanzi: "準時", answer: "zhunˊ shi"}

