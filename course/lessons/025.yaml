      hl: {hanzi: "___較便宜兜仔無？", pinyin: "___ haˇ pien ngi deuˋ er mo?", answer_hanzi: "做得", answer: "zoˇ ded"}
    - en: "How many nights?"
      sx: {hanzi: "幾多___？", pinyin: "giˋ doˊ ___?", answer_hanzi: "暗晡", answer: "am buˊ"}
      hl: {hanzi: "幾多___？", pinyin: "giˊ doˋ ___?", answer_hanzi: "暗晡", answer: "amˇ buˋ"}
    - en: "I'll charge you a thousand."
      sx: {hanzi: "___你一千。", pinyin: "___ nˇ idˋ qienˊ.", answer_hanzi: "算", answer: "son"}
      hl: {hanzi: "___你一千。", pinyin: "___ ngi rhid cienˋ.", answer_hanzi: "算", answer: "sonˇ"}

