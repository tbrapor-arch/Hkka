exercises:
  translate:
    - en: "May I have a shower? — Of course."
      sx: {hanzi: "做得洗身無？——做得。", pinyin: "zo dedˋ seˋ siinˊ moˇ? — zo dedˋ."}
      hl: {hanzi: "做得洗身無？——做得。", pinyin: "zoˇ ded seˊ shinˋ mo? — zoˇ ded."}
    - en: "You mustn't smoke here."
      sx: {hanzi: "這位做毋得食煙。", pinyin: "iaˋ vi zomˇ dedˋ siid ienˊ."}
      hl: {hanzi: "這位做毋得食煙。", pinyin: "liaˊ vui+ zoˇ m ded shidˋ rhanˋ."}
    - en: "Where is the room key?"
      sx: {hanzi: "間房个鎖匙在哪位？", pinyin: "gienˊ fongˇ ge soˋ siiˋ coiˊ nai vi?"}
      hl: {hanzi: "間房个鎖匙在哪位？", pinyin: "gienˋ fong gaiˇ soˊ shi coiˋ nai+ vui+?"}
    - en: "What's the price for one night?"
      sx: {hanzi: "一暗晡个價錢係幾多？", pinyin: "idˋ am buˊ ge ga qienˇ he giˋ doˊ?"}
      hl: {hanzi: "一暗晡个價錢係幾多？", pinyin: "rhid amˇ buˋ gaiˇ gaˇ cien heˇ giˊ doˋ?"}
    - en: "Next time, stay at our house!"
      sx: {hanzi: "下二擺，在吾屋下歇！", pinyin: "ha ngi baiˋ, coiˊ ngaˊ vugˋ kaˊ hiedˋ!"}
      hl: {hanzi: "下二擺，在𠊎屋下歇！", pinyin: "ha+ ngi+ baiˊ, coiˋ ngai vug haˋ hied!"}
  fill:
