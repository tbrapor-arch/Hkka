exercises:
  translate:
    - en: "Grandpa fell in the tea field and stayed in hospital a week."
      sx: {hanzi: "阿公在茶園跌倒，在醫院戴院一隻禮拜。", pinyin: "aˊ gungˊ coiˊ caˇ ienˇ diedˋ doˋ, coiˊ iˊ ien dai ien idˋ zagˋ liˊ bai."}
      hl: {hanzi: "阿公在茶園跢倒，在醫院戴院一隻禮拜。", pinyin: "a+ gungˋ coiˋ ca rhan doiˋ doˊ, coiˋ rhiˋ rhanˇ daiˇ rhanˇ rhid zhag liˋ baiˇ."}
    - en: "The bone isn't broken; the knee is just swollen."
      sx: {hanzi: "骨頭無斷忒，膝頭腫起來定定。", pinyin: "gudˋ teuˇ moˇ tonˊ tedˋ, qidˋ teuˇ zungˋ hiˋ loiˇ tin tin."}
      hl: {hanzi: "骨頭無斷忒，膝頭腫起來定定。", pinyin: "gud teu mo tonˋ ted, cid teu zhungˊ hiˊ loi tin+ tin+."}
    - en: "Thank you! — Not at all. Come and see us when you're free."
      sx: {hanzi: "恁仔細！——毋使客氣。有閒正來尞。", pinyin: "anˋ ziiˋ se! — mˇ siiˋ hagˋ hi. iuˊ hanˇ zang loiˇ liau."}
      hl: {hanzi: "承蒙你！——毋使客氣。有閒正來尞。", pinyin: "shin mung ngi! — m siiˊ hag hiˇ. rhiuˋ han zhangˇ loi liau+."}
    - en: "Grandma called in to the radio programme to thank the nurses."
      sx: {hanzi: "阿婆打電話去電臺叩應，感謝醫院个護士。", pinyin: "aˊ poˇ daˋ tien fa hi tien toiˇ ko inˋ, gamˋ qia iˊ ien ge fu sii."}
      hl: {hanzi: "阿婆打電話去電臺叩應，感謝醫院个護士。", pinyin: "a+ po daˊ tien+ faˇ hiˇ tien+ toi ko inˋ, gamˊ cia+ rhiˋ rhanˇ gaiˇ fu+ sii+."}
    - en: "Sam's poem rhymes, and it reads smoothly."
      sx: {hanzi: "Sam 个詩有押韻，讀起來當順。", pinyin: "Sam ge siiˊ iuˊ abˋ iun, tug hiˋ loiˇ dongˊ sun."}
      hl: {hanzi: "Sam 个詩有押韻，讀起來當順。", pinyin: "Sam gaiˇ shiˋ rhiuˋ ab rhun+, tugˋ hiˊ loi dongˋ shun+."}
    - en: "In those days there were no colour photos."
      sx: {hanzi: "當時無彩色相片。", pinyin: "dongˊ siiˇ moˇ caiˋ sedˋ xiong pienˋ."}
      hl: {hanzi: "該當時無彩色相片。", pinyin: "gai dongˋ shi mo caiˊ sed siongˇ pienˊ."}
    - en: "He'll be seventy-nine this year, and he's still fit."
      sx: {hanzi: "佢今年會七十九歲了，身體還當健。", pinyin: "giˇ gimˊ ngienˇ voi qidˋ siib giuˋ se leˊ, siinˊ tiˋ hanˇ dongˊ kien."}
      hl: {hanzi: "佢今年會七十九歲了，身體還當健。", pinyin: "gi gimˋ ngien voi+ cid shibˋ giuˊ soiˇ leˋ, shinˋ tiˊ han dongˋ kien+."}
  fill:
    - en: "In a song, 'is' is sung 是."
      sx: {hanzi: "唱歌唱「___」。", pinyin: "cong goˊ cong ___.", answer_hanzi: "是", answer: "sii"}
      hl: {hanzi: "唱歌唱「___」。", pinyin: "chongˇ goˋ chongˇ ___.", answer_hanzi: "是", answer: "shi+"}
    - en: "The woman standing beside him is Grandma."
      sx: {hanzi: "企在佢身邊___該隻細妹人係阿婆。", pinyin: "kiˊ coiˊ giˇ siinˊ bienˊ ___ ge zagˋ se moi nginˇ he aˊ poˇ.", answer_hanzi: "个", answer: "ge"}
      hl: {hanzi: "企在佢身邊___該隻細妹人係阿婆。", pinyin: "kiˋ coiˋ gi shinˋ bienˋ ___ gai zhag seˇ moiˇ ngin heˇ a+ po.", answer_hanzi: "个", answer: "gaiˇ"}
      check: true
    - en: "I'm afraid it's going to rain."
      sx: {hanzi: "___會落雨。", pinyin: "___ voi log iˋ.", answer_hanzi: "驚怕", answer: "giangˊ pa"}
      hl: {hanzi: "___會落水。", pinyin: "___ voi+ logˋ shuiˊ.", answer_hanzi: "驚怕", answer: "giangˋ paˇ"}

