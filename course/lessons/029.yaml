exercises:
  translate:
    - en: "Grandma is wearing a hat and carrying a basket."
      sx: {hanzi: "阿婆戴等帽仔，拿等菜籃。", pinyin: "aˊ poˇ dai denˋ mo eˋ, naˊ denˋ coi lamˇ."}
      hl: {hanzi: "阿婆戴等帽仔，拿等菜籃。", pinyin: "a+ po daiˇ nenˊ mo+ er, naˋ nenˊ coiˇ lam."}
    - en: "Don't keep eating sweets!"
      sx: {hanzi: "莫緊食糖仔！", pinyin: "mog ginˋ siid tongˇ eˋ!"}
      hl: {hanzi: "莫緊食糖仔！", pinyin: "mogˋ ginˊ shidˋ tong er!"}
    - en: "The green ones aren't ripe yet."
      sx: {hanzi: "青个還吂熟。", pinyin: "qiangˊ ge hanˇ mangˇ sug."}
      hl: {hanzi: "青个還吂熟。", pinyin: "ciangˋ gaiˇ han mang shugˋ."}
    - en: "Grandpa's son carries the vegetables on his back to the field."
      sx: {hanzi: "阿公个倈仔揹等菜去田項。", pinyin: "aˊ gungˊ ge lai eˋ baˇ denˋ coi hi tienˇ hong."}
      hl: {hanzi: "阿公个倈仔揹等菜去田項。", pinyin: "a+ gungˋ gaiˇ laiˇ er ba nenˊ coiˇ hiˇ tien hong+."}
    - en: "Try it! Winter fruit is very sweet."
      sx: {hanzi: "試看！寒天个果子當甜。", pinyin: "cii kon! honˇ tienˊ ge goˋ ziiˋ dongˊ tiamˇ."}
      hl: {hanzi: "試看！冷天个果子當甜。", pinyin: "chiˇ konˇ! langˋ tienˋ gaiˇ goˊ ziiˊ dongˋ tiam."}
    - en: "Grandpa sat in the car; the strawberries are on the table."
      sx: {hanzi: "阿公坐等車項，草莓在桌仔項。", pinyin: "aˊ gungˊ coˊ denˋ caˊ hong, coˋ moiˇ coiˊ zogˋ eˋ hong."}
      hl: {hanzi: "阿公坐等車項，草莓在桌項。", pinyin: "a+ gungˋ coˋ nenˊ chaˋ hong+, coˊ moi coiˋ zog hong+."}
  fill:
    - en: "He keeps eating."
      sx: {hanzi: "佢___食。", pinyin: "giˇ ___ siid.", answer_hanzi: "緊", answer: "ginˋ"}
      hl: {hanzi: "佢___食。", pinyin: "gi ___ shidˋ.", answer_hanzi: "緊", answer: "ginˊ"}
    - en: "Holding the basket."
      sx: {hanzi: "拿___菜籃。", pinyin: "naˊ ___ coi lamˇ.", answer_hanzi: "等", answer: "denˋ"}
      hl: {hanzi: "拿___菜籃。", pinyin: "naˋ ___ coiˇ lam.", answer_hanzi: "等", answer: "nenˊ"}
    - en: "Pick a few more!"
      sx: {hanzi: "摘___兜仔！", pinyin: "zagˋ ___ deuˊ eˋ!", answer_hanzi: "加", answer: "gaˊ"}
      hl: {hanzi: "摘___兜仔！", pinyin: "zag ___ deuˋ er!", answer_hanzi: "加", answer: "gaˋ"}

