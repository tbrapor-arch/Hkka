      sx: {hanzi: "擂茶愛用麼个材料？", pinyin: "luiˇ caˇ oi iung maˋ ge coiˇ liau?"}
      hl: {hanzi: "擂茶愛用麼个材料？", pinyin: "lui ca oiˇ rhung+ maˊ gaiˇ coi liau+?"}
    - en: "Ladle a bowl for the guests."
