id: 36
title:
  en: "Making 擂茶"
  sx: {hanzi: "你試看啊", pinyin: "nˇ cii kon a"}
  hl: {hanzi: "你試看啊", pinyin: "ngi chiˇ konˇ a+"}
review: false
setting: >-
  Sunday afternoon, a week after Lucie has flown home. The house is quiet. Guests are coming at four, and Grandma
  has taken down the big earthenware bowl from the top of the cupboard.
names: [阿明]

dialogue:
  - n: 1
    speaker: 阿婆
    en: "We've got guests coming this afternoon. Let's make 擂茶."
    sx: {hanzi: "今晡日下晝有人客愛來，𫣆兜來擂茶。", pinyin: "gimˊ buˊ ngidˋ haˊ zu iuˊ nginˇ hagˋ oi loiˇ, enˊ deuˊ loiˇ luiˇ caˇ."}
    hl: {hanzi: "今晡日下晝有人客愛來，𫣆兜來擂茶。", pinyin: "gimˋ buˋ ngid haˋ zhiuˇ rhiuˋ ngin hag oiˇ loi, enˋ deuˋ loi lui ca."}
  - n: 2
    speaker: Sam
    en: "擂茶? What's that?"
    sx: {hanzi: "擂茶？係麼个？", pinyin: "luiˇ caˇ? he maˋ ge?"}
    hl: {hanzi: "擂茶？係麼个？", pinyin: "lui ca? heˇ maˊ gaiˇ?"}
  - n: 3
    speaker: 阿婆
    en: "The ingredients are tea leaves, peanuts and sesame. You put them in the grinding bowl, grind them to a paste with the stick, add boiling water, and that's 擂茶."
    sx: {hanzi: "材料係茶米、番豆、麻仔。放落擂缽，用棍仔擂綿，加滾水，就係擂茶。", pinyin: "coiˇ liau he caˇ miˋ, fanˊ teu, maˇ eˋ. biong log luiˇ badˋ, iung gun eˋ luiˇ mienˇ, gaˊ gunˋ suiˋ, qiu he luiˇ caˇ."}
    hl: {hanzi: "材料係茶米、地豆、麻仔。放落擂缽，用棍仔擂綿，加滾水，就係擂茶。", pinyin: "coi liau+ heˇ ca miˊ, ti+ teu+, ma er. biongˇ logˋ lui bad, rhung+ gunˇ er lui mien, gaˋ gunˊ shuiˊ, ciu+ heˇ lui ca."}
  - n: 4
    speaker: 阿婆
    en: "(handing him the stick) Here, you have a go."
    sx: {hanzi: "來，你試看啊。", pinyin: "loiˇ, nˇ cii kon a."}
    hl: {hanzi: "來，你試看啊。", pinyin: "loi, ngi chiˇ konˇ a+."}
  - n: 5
    speaker: Sam
    en: "(grinding with all his might) Like this?"
    sx: {hanzi: "恁樣啊？", pinyin: "anˋ ngiongˇ a?"}
    hl: {hanzi: "恁樣啊？", pinyin: "an ngiong a+?"}
  - n: 6
    speaker: 阿婆
    en: "Not so hard! Grind slowly; it has to be nice and fine."
    sx: {hanzi: "毋使恁大力！慢慢仔擂，愛擂到幼幼仔。", pinyin: "mˇ siiˋ anˋ tai lid! man man eˋ luiˇ, oi luiˇ do iu iu eˋ."}
    hl: {hanzi: "毋使恁大力！慢慢仔擂，愛擂到幼幼仔。", pinyin: "m siiˊ anˊ tai+ lidˋ! man+ man+ er lui, oiˇ lui doˇ rhiuˇ rhiuˇ er."}
  - n: 7
    speaker: Sam
    en: "(ten minutes later) My arm's aching…"
    sx: {hanzi: "𠊎个手痠了……", pinyin: "ngaiˇ ge suˋ sonˊ leˊ …"}
    hl: {hanzi: "𠊎个手痠了……", pinyin: "ngai gaiˇ shiuˊ sonˋ leˋ …"}
  - n: 8
    speaker: 阿明
    en: "Sam, you've got no strength! Let me do it."
    sx: {hanzi: "Sam 恁無力！分𠊎來。", pinyin: "Sam anˋ moˇ lid! bunˊ ngaiˇ loiˇ."}
    hl: {hanzi: "Sam 恁無力！分𠊎來。", pinyin: "Sam anˊ mo lidˋ! bunˋ ngai loi."}
  - n: 9
    speaker: 阿明
    en: "(three seconds of furious grinding) Done!"
    sx: {hanzi: "好了！", pinyin: "hoˋ leˊ!"}
    hl: {hanzi: "好了！", pinyin: "hoˊ leˋ!"}
  - n: 10
    speaker: 阿婆
    en: "Done, my foot! It's still really coarse."
    sx: {hanzi: "好麼个！還當粗！", pinyin: "hoˋ maˋ ge! hanˇ dongˊ cuˊ!"}
    hl: {hanzi: "好麼个！還當粗！", pinyin: "hoˊ maˊ gaiˇ! han dongˋ cuˋ!"}
  - n: 11
    speaker: 阿婆
    en: "(at last) Right. Add the boiling water and give it a quick stir… Sam, have a taste."
    sx: {hanzi: "好，加滾水，摝摝仔……Sam，你嗒看啊。", pinyin: "hoˋ, gaˊ gunˋ suiˋ, lugˋ lugˋ eˋ … Sam, nˇ dab kon a."}
    hl: {hanzi: "好，加滾水，摝摝仔……Sam，你嗒看啊。", pinyin: "hoˊ, gaˋ gunˊ shuiˊ, lug lug er … Sam, ngi dabˋ konˇ a+."}
  - n: 12
    speaker: Sam
    en: "Mm… it smells wonderful! And it's not sweet, it's savoury?"
    sx: {hanzi: "……當香！毋係甜个，係鹹个？", pinyin: "… dongˊ hiongˊ! mˇ he tiamˇ ge, he hamˇ ge?"}
    hl: {hanzi: "……當香！毋係甜个，係鹹个？", pinyin: "… dongˋ hiongˋ! m heˇ tiam gaiˇ, heˇ ham gaiˇ?"}
    check: true
  - n: 13
    speaker: 阿婆
    en: "This one is savoury. Use it to wash down rice and vegetables. …There, the guests are here!"
    sx: {hanzi: "這碗係鹹个，做得傍飯食。……好，人客來了！", pinyin: "iaˋ vonˋ he hamˇ ge, zo dedˋ bongˋ fan siid. … hoˋ, nginˇ hagˋ loiˇ leˊ!"}
    hl: {hanzi: "這碗係鹹个，做得傍飯食。……好，人客來了！", pinyin: "liaˊ vonˊ heˇ ham gaiˇ, zoˇ ded bongˊ pon+ shidˋ. … hoˊ, ngin hag loi leˋ!"}
    check: true

notes:
  - ref: 1
    topic: culture
    text: >
      擂茶 luiˇ caˇ "ground tea": the official example sentences describe it as tea leaves, peanuts, sesame and other
      ingredients ground together and mixed with water, 客家有名个擂茶 "the famous Hakka 擂茶". 擂 luiˇ is the verb, "grind
      in a bowl"; 擂缽 the ridged earthenware bowl it is ground in, with a wooden stick.
  - ref: 3
    topic: grammar
    text: >
      Grandma's recipe follows the official example almost word for word: 材料放落擂缽，用樹棍仔去擂綿 "put the ingredients
      in the bowl and grind them to a paste with a stick", then add water and 摝摝仔 "give it a stir" (line 11). A verb
      said twice, with 仔 or 啊 after it, is "do it a little, briefly": 摝摝仔, 看看啊 "have a look round". 用棍仔擂
      "grind with a stick": 用 iung "use" before a tool, as Mandarin 用. 綿 mienˇ "soft, mushy, ground to a paste".
      番豆 fanˊ teu "peanut" (Hailu 地豆); 麻仔 "sesame"; 滾水 "boiling water".
  - ref: 4
    topic: grammar
    text: >
      試看啊 "try (and see)", 嗒看啊 "taste (and see)" (line 11): verb + 看啊 is "have a go at", the Mandarin 看看. 試 can
      stand in front as well: 試摸看啊 "try touching it". Both forms are in the official examples.
  - ref: 6
    topic: grammar
    text: >
      毋使恁大力 "no need to push so hard": 大力 "with force", 無力 (line 8) "weak, without strength", from 力 lid "strength".
      擂到幼幼仔 "grind it till it's nice and fine": V到 + result (lesson 27). 幼 iu "fine" (not coarse), doubled with 仔
      as in the attested 剁到幼幼仔 "chop it fine"; its opposite is 粗 cuˊ "coarse" (line 10). 慢慢仔 "slowly", with the
      same AA仔 shape.
  - ref: 10
    topic: grammar
    text: >
      好麼个！ "good, what?!", Grandma's way of rejecting a claim: X麼个 after someone's word throws it back. Use it with
      care; it is not polite to an elder.
  - ref: 12
    topic: culture
    text: >
      Grandma's answer and Sam's surprise are marked for a native speaker's check: the official examples describe the
      ingredients, not the taste, and families make it both ways. 傍 bongˋ "eat (something) with rice": 傍飯 "as an
      accompaniment to rice".

