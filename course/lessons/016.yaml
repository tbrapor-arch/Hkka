  - {hanzi: 過, pinyin: "go", en: "(after a verb) have done before", hl: {hanzi: 過, pinyin: "goˇ"}}
  - {hanzi: 賣, pinyin: "mai", en: "sell", hl: {hanzi: 賣, pinyin: "mai+"}}
