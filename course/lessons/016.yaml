exercises:
  translate:
    - en: "I'm busy this morning; I'm free this afternoon."
      sx: {hanzi: "𠊎上晝無閒，下晝有閒。", pinyin: "ngaiˇ song zu moˇ hanˇ, haˊ zu iuˊ hanˇ."}
      hl: {hanzi: "𠊎上晝無閒，下晝有閒。", pinyin: "ngai shong+ zhiuˇ mo han, haˋ zhiuˇ rhiuˋ han."}
    - en: "A-min won't be here until five."
      sx: {hanzi: "阿明五點正會來。", pinyin: "aˊ minˇ ngˋ diamˋ zang voi loiˇ."}
      hl: {hanzi: "阿明五點正會來。", pinyin: "a+ min ngˊ diamˊ zhangˇ voi+ loi."}
    - en: "Have you ever eaten rice noodles?"
      sx: {hanzi: "你食過粄條無？", pinyin: "nˇ siid go banˋ tiauˇ moˇ?"}
      hl: {hanzi: "你食過粄條無？", pinyin: "ngi shidˋ goˇ banˊ tiau mo?"}
    - en: "Grandma is Hakka; Sam isn't."
      sx: {hanzi: "阿婆係客人，Sam 毋係。", pinyin: "aˊ poˇ he hagˋ nginˇ, Sam mˇ he."}
      hl: {hanzi: "阿婆係客人，Sam 毋係。", pinyin: "a+ po heˇ hag ngin, Sam m heˇ."}
    - en: "We have guests at midday."
      sx: {hanzi: "當晝有人客來。", pinyin: "dongˊ zu iuˊ nginˇ hagˋ loiˇ."}
      hl: {hanzi: "當晝有人客來。", pinyin: "dongˋ zhiuˇ rhiuˋ ngin hag loi."}
  fill:
    - en: "He won't come until three."
      sx: {hanzi: "佢三點___會來。", pinyin: "giˇ samˊ diamˋ ___ voi loiˇ.", answer_hanzi: "正", answer: "zang"}
      hl: {hanzi: "佢三點___會來。", pinyin: "gi samˋ diamˊ ___ voi+ loi.", answer_hanzi: "正", answer: "zhangˇ"}
    - en: "I've never been to Taipei."
      sx: {hanzi: "𠊎無去___臺北。", pinyin: "ngaiˇ moˇ hi ___ toiˇ bedˋ.", answer_hanzi: "過", answer: "go"}
      hl: {hanzi: "𠊎無去___臺北。", pinyin: "ngai mo hiˇ ___ toi bed.", answer_hanzi: "過", answer: "goˇ"}
    - en: "Can you come and help?"
      sx: {hanzi: "你來___好無？", pinyin: "nˇ loiˇ ___ hoˋ moˇ?", answer_hanzi: "𢯭手", answer: "ten suˋ"}
      hl: {hanzi: "你來___好無？", pinyin: "ngi loi ___ hoˊ mo?", answer_hanzi: "𢯭手", answer: "tenˇ shiuˊ"}

