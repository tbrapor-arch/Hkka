exercises:
  translate:
    - en: "On New Year's Eve the whole family eats together."
      sx: {hanzi: "年三十暗晡，全家人共下食團圓飯。", pinyin: "ngienˇ samˊ siib am buˊ, qionˇ gaˊ nginˇ kiung ha siid tonˇ ienˇ fan."}
      hl: {hanzi: "年三十暗晡，全家人共下食團圓飯。", pinyin: "ngien samˋ shibˋ amˇ buˋ, cion gaˋ ngin kiung+ ha+ shidˋ ton rhan pon+."}
    - en: "A new bride first pays her respects to the ancestors."
      sx: {hanzi: "新娘正入門，愛先拜阿公婆。", pinyin: "xinˊ ngiongˇ zang ngib munˇ, oi xienˊ bai aˊ gungˊ poˇ."}
      hl: {hanzi: "新娘正入門，愛先拜阿公婆。", pinyin: "sinˋ ngiong zhangˇ ngibˋ mun, oiˇ senˋ baiˇ a+ gungˋ po."}
      source: moe
    - en: "The offerings: pork, a rooster and a fish. No duck."
      sx: {hanzi: "三牲：豬肉、雞公摎魚。無鴨。", pinyin: "samˊ senˊ: zuˊ ngiugˋ, gieˊ gungˊ lauˊ ngˇ. moˇ abˋ."}
      hl: {hanzi: "三牲：豬肉、雞公摎魚。無鴨。", pinyin: "samˋ senˋ: zhuˋ ngiug, gaiˋ gungˋ lauˋ ng. mo ab."}
      check: true
    - en: "Long-life greens are made with mustard greens."
      sx: {hanzi: "長年菜係用芥菜煮个。", pinyin: "congˇ ngienˇ coi he iung gie coi zuˋ ge."}
      hl: {hanzi: "長年菜係用芥菜煮个。", pinyin: "chong ngien coiˇ heˇ rhung+ gaiˇ coiˇ zhuˊ gaiˇ."}
    - en: "The more he talks, the more he wants to talk."
      sx: {hanzi: "佢緊講緊愛講。", pinyin: "giˇ ginˋ gongˋ ginˋ oi gongˋ."}
      hl: {hanzi: "佢緊講緊愛講。", pinyin: "gi ginˊ gongˊ ginˊ oiˇ gongˊ."}
    - en: "A-min wants to stay up till dawn; the grown-ups are in the main room playing cards."
      sx: {hanzi: "阿明愛守到天光；大人在廳下打牌仔。", pinyin: "aˊ minˇ oi suˋ do tienˊ gongˊ; tai nginˇ coiˊ tangˊ haˊ daˋ paiˇ eˋ."}
      hl: {hanzi: "阿明愛守到天光；大人在廳下打牌仔。", pinyin: "a+ min oiˇ shiuˊ doˇ tienˋ gongˋ; tai+ ngin coiˋ tangˋ haˋ daˊ pai er."}
      check: true
    - en: "On New Year's Eve you have to go home, so the whole family is together."
      sx: {hanzi: "年三十暗晡，愛轉去屋下，全家人團圓。", pinyin: "ngienˇ samˊ siib am buˊ, oi zonˋ hi vugˋ kaˊ, qionˇ gaˊ nginˇ tonˇ ienˇ."}
      hl: {hanzi: "年三十暗晡，愛轉去屋下，全家人團圓。", pinyin: "ngien samˋ shibˋ amˇ buˋ, oiˇ zhonˊ hiˇ vug haˋ, cion gaˋ ngin ton rhan."}
    - en: "Tomorrow is New Year's Day. A-min is very good to his grandparents: he gives Grandpa his 粄 first."
      sx: {hanzi: "天光日係年初一。阿明當孝順，粄先分阿公食。", pinyin: "tienˊ gongˊ ngidˋ he ngienˇ cuˊ idˋ. aˊ minˇ dongˊ hau sun, banˋ xienˊ bunˊ aˊ gungˊ siid."}
      hl: {hanzi: "韶早係年初一。阿明當孝順，粄先分阿公食。", pinyin: "shau zoˊ heˇ ngien cuˋ rhid. a+ min dongˋ hauˇ shun+, banˊ senˋ bunˋ a+ gungˋ shidˋ."}
    - en: "Grandma burns incense and puts it in the incense burner."
      sx: {hanzi: "阿婆燒香，放在香爐。", pinyin: "aˊ poˇ seuˊ hiongˊ, biong coiˊ hiongˊ luˇ."}
      hl: {hanzi: "阿婆燒香，放在香爐。", pinyin: "a+ po shauˋ hiongˋ, biongˇ coiˋ hiongˋ lu."}
