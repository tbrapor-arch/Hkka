id: 51
title:
  en: "New Year's Eve"
  sx: {hanzi: "年三十暗晡", pinyin: "ngienˇ samˊ siib am buˊ"}
  hl: {hanzi: "年三十暗晡", pinyin: "ngien samˋ shibˋ amˇ buˋ"}
review: false
setting: >-
  Friday 5 February, New Year's Eve. Everyone is home: A-in since this morning, Mr Liu with the shop shut until the
  fifth. On the table in the main room stand the offerings, pork, a chicken and a fish, and the incense is lit. The
  round table is laid for seven.
names: [阿英, 阿明]

dialogue:
  - n: 1
    speaker: 阿爸
    en: "On New Year's Eve the whole family sits round the table together. First we pay our respects to the ancestors, and only then do we eat the reunion dinner."
    sx: {hanzi: "年三十暗晡，全家人愛圍爐。先拜阿公婆，正食團圓飯。", pinyin: "ngienˇ samˊ siib am buˊ, qionˇ gaˊ nginˇ oi viˇ luˇ. xienˊ bai aˊ gungˊ poˇ, zang siid tonˇ ienˇ fan."}
    hl: {hanzi: "年三十暗晡，全家人愛圍爐。先拜阿公婆，正食團圓飯。", pinyin: "ngien samˋ shibˋ amˇ buˋ, cion gaˋ ngin oiˇ vui lu. senˋ baiˇ a+ gungˋ po, zhangˇ shidˋ ton rhan pon+."}
  - n: 2
    speaker: Sam
    en: "阿公婆? But Grandpa and Grandma are right here!"
    sx: {hanzi: "阿公婆？阿公摎阿婆就在這位啊！", pinyin: "aˊ gungˊ poˇ? aˊ gungˊ lauˊ aˊ poˇ qiu coiˊ iaˋ vi a!"}
    hl: {hanzi: "阿公婆？阿公摎阿婆就在這位啊！", pinyin: "a+ gungˋ po? a+ gungˋ lauˋ a+ po ciu+ coiˋ liaˊ vui+ a+!"}
    check: true
  - n: 3
    speaker: 阿英
    en: "Not them! 阿公婆 are the ancestors: the family from long ago."
    sx: {hanzi: "毋係！阿公婆就係祖公，頭擺个人。", pinyin: "mˇ he! aˊ gungˊ poˇ qiu he zuˋ gungˊ, teuˇ baiˋ ge nginˇ."}
    hl: {hanzi: "毋係！阿公婆就係祖公，頭擺个人。", pinyin: "m heˇ! a+ gungˋ po ciu+ heˇ zuˊ gungˋ, teu baiˊ gaiˇ ngin."}
  - n: 4
    speaker: 阿婆
    en: "(in the main room, before the ancestors' tablet) Ancestors, the three offerings are laid out, and the incense is in the burner. This year Sam is spending the New Year in our house too."
    sx: {hanzi: "阿公婆，三牲放好吔，香乜放在香爐吔。今年 Sam 乜在𫣆兜屋下過年。", pinyin: "aˊ gungˊ poˇ, samˊ senˊ biong hoˋ leˊ, hiongˊ me biong coiˊ hiongˊ luˇ leˊ. gimˊ ngienˇ Sam me coiˊ enˊ deuˊ vugˋ kaˊ go ngienˇ."}
    hl: {hanzi: "阿公婆，三牲放好咧，香乜放在香爐咧。今年 Sam 乜在𫣆兜屋下過年。", pinyin: "a+ gungˋ po, samˋ senˋ biongˇ hoˊ leˋ, hiongˋ meˇ biongˇ coiˋ hiongˋ lu leˋ. gimˋ ngien Sam meˇ coiˋ enˋ deuˋ vug haˋ goˇ ngien."}
  - n: 5
    speaker: 阿姆
    en: "(at the round table) Come on, have some 長年菜. Eat it and you'll live to a hundred."
    sx: {hanzi: "來，食長年菜。食長年菜，做得長命百歲。", pinyin: "loiˇ, siid congˇ ngienˇ coi. siid congˇ ngienˇ coi, zo dedˋ congˇ miang bagˋ se."}
    hl: {hanzi: "來，食長年菜。食長年菜，做得長命百歲。", pinyin: "loi, shidˋ chong ngien coiˇ. shidˋ chong ngien coiˇ, zoˇ ded chong miang+ bag soiˇ."}
  - n: 6
    speaker: Sam
    en: "It's a bit bitter… but the more you eat, the more you want!"
    sx: {hanzi: "有兜仔苦……毋過緊食緊愛食！", pinyin: "iuˊ deuˊ eˋ fuˋ … mˇ go ginˋ siid ginˋ oi siid!"}
    hl: {hanzi: "有兜仔苦……毋過緊食緊愛食！", pinyin: "rhiuˋ deuˋ er fuˊ … m goˇ ginˊ shidˋ ginˊ oiˇ shidˋ!"}
  - n: 7
    speaker: 阿明
    en: "Grandpa! Happy New Year and prosperity! Hand over the red envelope!"
    sx: {hanzi: "阿公！恭喜發財，紅包拿來！", pinyin: "aˊ gungˊ! giungˊ hiˋ fadˋ coiˇ, fungˇ bauˊ naˊ loiˇ!"}
    hl: {hanzi: "阿公！恭喜發財，紅包拿來！", pinyin: "a+ gungˋ! giungˋ hiˊ fad coi, fung bauˋ naˋ loi!"}
  - n: 8
    speaker: 阿公
    en: "(taking out a red envelope) Here."
    sx: {hanzi: "拿去。", pinyin: "naˊ hi."}
    hl: {hanzi: "拿去。", pinyin: "naˋ hiˇ."}
  - n: 9
    speaker: 阿婆
    en: "And Sam has one too."
    sx: {hanzi: "Sam 乜有一隻。", pinyin: "Sam me iuˊ idˋ zagˋ."}
    hl: {hanzi: "Sam 乜有一隻。", pinyin: "Sam meˇ rhiuˋ rhid zhag."}
  - n: 10
    speaker: Sam
    en: "Me too? But I'm a grown-up!"
    sx: {hanzi: "𠊎乜有？毋過𠊎係大人吔！", pinyin: "ngaiˇ me iuˊ? mˇ go ngaiˇ he tai nginˇ leˊ!"}
    hl: {hanzi: "𠊎乜有？毋過𠊎係大人咧！", pinyin: "ngai meˇ rhiuˋ? m goˇ ngai heˇ tai+ ngin leˋ!"}
  - n: 11
    speaker: 阿婆
    en: "In Grandma's house, you're a child."
    sx: {hanzi: "在阿婆屋下，你就係細人仔。", pinyin: "coiˊ aˊ poˇ vugˋ kaˊ, nˇ qiu he se nginˇ eˋ."}
    hl: {hanzi: "在阿婆屋下，你就係細人仔。", pinyin: "coiˋ a+ po vug haˋ, ngi ciu+ heˇ seˇ ngin er."}
  - n: 12
    speaker: 阿爸
    en: "(handing Grandpa a red envelope of his own) Dad, this red envelope is for you: more luck and long life."
    sx: {hanzi: "阿爸，這紅包分你添福壽。", pinyin: "aˊ baˊ, iaˋ fungˇ bauˊ bunˊ nˇ tiamˊ fugˋ su."}
    hl: {hanzi: "阿爸，這紅包分你添福壽。", pinyin: "a+ baˋ, liaˊ fung bauˋ bunˋ ngi tiamˋ fug shiu+."}
  - n: 13
    speaker: 阿爸
    en: "(watching A-min reach for the radish cake again) A-min is getting fatter and fatter."
    sx: {hanzi: "阿明緊來緊大箍吔。", pinyin: "aˊ minˇ ginˋ loiˇ ginˋ tai kieuˊ leˊ."}
    hl: {hanzi: "阿明緊來緊大箍咧。", pinyin: "a+ min ginˊ loi ginˊ tai+ kieuˋ leˋ."}
  - n: 14
    speaker: 阿明
    en: "It's Grandma's fault: her 粄 is too good! …Tonight we're letting off firecrackers and playing cards till dawn!"
    sx: {hanzi: "係阿婆个粄忒好食！……今暗晡𫣆兜愛放紙炮仔，打牌仔打到天光！", pinyin: "he aˊ poˇ ge banˋ tedˋ hoˋ siid! … gimˊ am buˊ enˊ deuˊ oi biong ziiˋ pau eˋ, daˋ paiˇ eˋ daˋ do tienˊ gongˊ!"}
    hl: {hanzi: "係阿婆个粄忒好食！……今暗晡𫣆兜愛放紙炮仔，打牌仔打到天光！", pinyin: "heˇ a+ po gaiˇ banˊ ted hoˊ shidˋ! … gimˋ amˇ buˋ enˋ deuˋ oiˇ biongˇ zhiˊ pauˇ er, daˊ pai er daˊ doˇ tienˋ gongˋ!"}
  - n: 15
    speaker: 阿公
    en: "(getting up) I'm going to bed at nine."
    sx: {hanzi: "𠊎九點睡目。", pinyin: "ngaiˇ giuˋ diamˋ soi mugˋ."}
    hl: {hanzi: "𠊎九點睡目。", pinyin: "ngai giuˊ diamˊ shoi+ mug."}

notes:
  - ref: 1
    topic: culture
    text: >
      Two official examples in one: 年三十該暗晡全家人愛圍爐食夜 "on New Year's Eve the whole family gathers round for
      dinner", and 年三十暗晡，先拜祖公正食團圓飯 "first worship the ancestors, then eat the reunion dinner". 圍爐 viˇ luˇ,
      literally "surround the stove", is the dictionary's word for the family gathering on New Year's Eve. 拜 (lesson 22) "worship, pay respects to", here the ancestors. 團圓飯 "reunion
      dinner": 團圓 "be together as a family". The offerings are 三牲, pork, chicken and fish.
  - ref: 2
    topic: false-friend
    text: >
      阿公婆 aˊ gungˊ poˇ, all in one word, is "the ancestors", and 阿公婆牌 their tablet in the main room: 新娘正入門，愛先
      拜阿公婆 "a new bride first pays her respects to the ancestors". Sam heard 阿公 + 阿婆. 祖公 (line 3) says the same.
  - ref: 5
    topic: culture
    text: >
      長年菜 congˇ ngienˇ coi, mustard greens stewed long, eaten at New Year 望大家做得長命百歲 "so that everyone may live
      to a hundred" (official example). The dictionary explains it: the long leaves of the mustard green stand for a
      long life.
  - ref: 6
    topic: grammar
    text: >
      緊 X 緊 Y "the more X, the more Y": 緊食緊愛食 "the more you eat, the more you want" (an official example, said of
      watermelon in summer). With 來, it is "more and more": 緊來緊大箍 (line 12) "fatter and fatter", 緊來緊多 "more and
      more". 緊 is the "keep on" of lesson 29.
  - ref: 7
    topic: culture
    text: >
      恭喜發財，紅包拿來！ "Happy New Year, hand over the red envelope!": the official examples quote it as what you hear at
      every New Year. Children get 紅包 from grandparents and parents; line 12 shows a grown-up giving one to his own father.
  - ref: 12
    topic: culture
    text: >
      An official example word for word: 阿伯，這紅包分你添福壽 "here's a red envelope for you, for more luck and long life"
      (said to an uncle; Mr Liu says it to his father). 添 "add" (the 添 of lesson 38), 福壽 "good fortune and long life".
  - ref: 11
    topic: grammar
    text: >
      大人 "grown-up, adult" and 細人仔 (lesson 31) "child". 在阿婆屋下 "in Grandma's house": no word for "in" is needed
      after 在.
  - ref: 14
    topic: grammar
    text: >
      打牌仔打到天光 "play cards till dawn": the verb is repeated before 到 when it has an object (打牌仔 + 打到…). 天光 "daybreak"
      is the 天光 of 天光日 "tomorrow" (lesson 6). 放紙炮仔 "let off firecrackers": 三十暗晡，家家屋屋都會放紙炮仔迎新年
      (official example).

