exercises:
  translate:
    - en: "That fish isn't cooked through: you can't eat it!"
      sx: {hanzi: "該尾魚仔無煮熟，食毋得！", pinyin: "ge miˊ ngˇ eˋ moˇ zuˋ sug, siid mˇ dedˋ!"}
      hl: {hanzi: "該尾魚仔無煮熟，食毋得！", pinyin: "gai muiˋ ng er mo zhuˊ shugˋ, shidˋ m ded!"}
      source: moe
    - en: "The beans aren't cooked: they're still raw."
      sx: {hanzi: "這綠豆無煮熟，食起來還生生！", pinyin: "iaˋ liug teu moˇ zuˋ sug, siid hiˋ loiˇ hanˇ sangˊ sangˊ!"}
      hl: {hanzi: "這綠豆無煮熟，食起來還生生！", pinyin: "liaˊ liugˋ teu+ mo zhuˊ shugˋ, shidˋ hiˊ loi han sangˋ sangˋ!"}
      check: true
    - en: "Put a little sugar and pepper in, and mix."
      sx: {hanzi: "放兜仔糖、胡椒落去，攪攪啊。", pinyin: "biong deuˊ eˋ tongˇ, fuˇ zeuˊ log hi, giauˊ giauˊ a."}
      hl: {hanzi: "放兜仔糖、胡椒落去，攪攪啊。", pinyin: "biongˇ deuˋ er tong, fu ziauˋ logˋ hiˇ, giauˋ giauˋ a+."}
      check: true
    - en: "As it happens, Mum was home, so she taught me how to cook it."
      sx: {hanzi: "堵好阿姆在屋下，佢就教𠊎仰般煮。", pinyin: "duˋ hoˋ aˊ meˊ coiˊ vugˋ kaˊ, giˇ qiu gauˊ ngaiˇ ngiongˋ banˊ zuˋ."}
      hl: {hanzi: "堵好阿姆在屋下，佢就教𠊎仰般煮。", pinyin: "duˊ hoˊ a+ meˋ coiˋ vug haˋ, gi ciu+ gauˋ ngai ngiongˊ banˋ zhuˊ."}
      check: true
    - en: "Cut the pork into strips; we'll celebrate with fried pork tonight."
      sx: {hanzi: "摎豬肉切絲來，今暗晡炒炒肉來慶祝。", pinyin: "lauˊ zuˊ ngiugˋ qiedˋ siiˊ loiˇ, gimˊ am buˊ cauˋ cauˋ ngiugˋ loiˇ kin zugˋ."}
      hl: {hanzi: "摎豬肉切絲來，今暗晡炒炒肉來慶祝。", pinyin: "lauˋ zhuˋ ngiug cied siiˋ loi, gimˋ amˇ buˋ cauˊ cauˊ ngiug loi kinˇ zhug."}
      check: true
    - en: "Mum steams fish, Grandma braises pork, and Sam blanches the sprouts and fries the vermicelli."
      sx: {hanzi: "阿姆蒸魚仔，阿婆滷豬肉，Sam 煠豆芽、炒米粉。", pinyin: "aˊ meˊ ziinˊ ngˇ eˋ, aˊ poˇ luˊ zuˊ ngiugˋ, Sam sab teu ngaˇ, cauˋ miˋ funˋ."}
      hl: {hanzi: "阿姆炊魚仔，阿婆滷豬肉，Sam 煠豆芽、炒米粉。", pinyin: "a+ meˋ chuiˋ ng er, a+ po luˋ zhuˋ ngiug, Sam sabˋ teu+ nga, cauˊ miˊ funˊ."}
  fill:
    - en: "Wash the bean sprouts clean."
      sx: {hanzi: "豆芽愛洗___來。", pinyin: "teu ngaˇ oi seˋ ___ loiˇ.", answer_hanzi: "淨", answer: "qiang"}
