id: 92
title:
  en: "Mid-Autumn sayings"
  sx: {hanzi: "三十暗晡个飯甑", pinyin: "samˊ siib am buˊ ge fan zen"}
  hl: {hanzi: "三十暗晡个飯甑", pinyin: "samˋ shibˋ amˇ buˋ gaiˇ pon+ zenˇ"}
review: false
setting: >-
  Wednesday 15 September, the Mid-Autumn festival (八月半). The whole family is out on the threshing floor after
  dinner, A-min's ankle long healed, a pile of pomelos on the low table and the moon coming up over the tea hills.
  It is cool at last. A-min has an idea.
names: [財伯姆, 南庄]

dialogue:
  - n: 1
    speaker: 阿姆
    en: "It's the fifteenth of the eighth month tonight, no wonder the moon is so big and round. The weather's lovely and cool. Come and have some pomelo, everyone! It's a 文旦."
    sx: {hanzi: "今暗晡係八月半，難怪月光又大又圓。天時恁涼爽，大家來食柚仔！這係文旦。", pinyin: "gimˊ am buˊ he badˋ ngied ban, nanˇ guai ngied gongˊ iu tai iu ienˇ. tienˊ siiˇ anˋ liongˇ songˋ, tai gaˊ loiˇ siid iu eˋ! iaˋ he vunˇ dan."}
    hl: {hanzi: "今暗晡係八月半，難怪月光又大又圓。天時恁涼爽，大家來食柚仔！這係文旦。", pinyin: "gimˋ amˇ buˋ heˇ bad ngiedˋ banˇ, nan guaiˇ ngiedˋ gongˋ rhiu+ tai+ rhiu+ rhan. tienˋ shi anˊ liong songˊ, tai+ gaˋ loi shidˋ rhiu+ er! liaˊ heˇ vun danˇ."}
  - n: 2
    speaker: Sam
    en: "Grandma, how do you eat a pomelo?"
    sx: {hanzi: "阿婆，柚仔愛仰般食？", pinyin: "aˊ poˇ, iu eˋ oi ngiongˋ banˊ siid?"}
    hl: {hanzi: "阿婆，柚仔愛仰般食？", pinyin: "a+ po, rhiu+ er oiˇ ngiongˊ banˋ shidˋ?"}
  - n: 3
    speaker: 阿婆
    en: "First you cut it open, then you peel off the skin. Here, have a go."
    sx: {hanzi: "先㓾開，再剝皮。來，你試看啊。", pinyin: "xienˊ ciiˇ koiˊ, zai bogˋ piˇ. loiˇ, nˇ cii kon a."}
    hl: {hanzi: "先㓾開，再剝皮。來，你試看啊。", pinyin: "senˋ chi koiˋ, zaiˇ bog pi. loi, ngi chiˇ konˇ a+."}
  - n: 4
    speaker: 阿明
    en: "Grandpa, Grandma, tonight you two have a 師傅話 contest. All right?"
    sx: {hanzi: "阿公、阿婆，今暗晡你兜來比賽師傅話，好無？", pinyin: "aˊ gungˊ, aˊ poˇ, gimˊ am buˊ nˇ deuˊ loiˇ biˋ soi siiˊ fu fa, hoˋ moˇ?"}
    hl: {hanzi: "阿公、阿婆，今暗晡你兜來比賽師傅話，好無？", pinyin: "a+ gungˋ, a+ po, gimˋ amˇ buˋ ngi deuˋ loi biˊ soiˇ siiˋ fu+ faˇ, hoˊ mo?"}
  - n: 5
    speaker: 阿公
    en: "All right."
    sx: {hanzi: "好。", pinyin: "hoˋ."}
    hl: {hanzi: "好。", pinyin: "hoˊ."}
  - n: 6
    speaker: 阿婆
    en: "Me first. 'Carrying water in a vegetable basket…'"
    sx: {hanzi: "𠊎先：菜籃㧡水……", pinyin: "ngaiˇ xienˊ: coi lamˇ kaiˊ suiˋ …"}
    hl: {hanzi: "𠊎先：菜籃㧡水……", pinyin: "ngai senˋ: coiˇ lam kaiˋ shuiˊ …"}
  - n: 7
    speaker: 阿公
    en: "'…wasted effort.'"
    sx: {hanzi: "無採工。", pinyin: "moˇ caiˋ gungˊ."}
    hl: {hanzi: "無採工。", pinyin: "mo caiˊ gungˋ."}
  - n: 8
    speaker: 阿婆
    en: "'The rice bucket on New Year's Eve…'"
    sx: {hanzi: "三十暗晡个飯甑……", pinyin: "samˊ siib am buˊ ge fan zen …"}
    hl: {hanzi: "三十暗晡个飯甑……", pinyin: "samˋ shibˋ amˇ buˋ gaiˇ pon+ zenˇ …"}
  - n: 9
    speaker: 阿公
    en: "'…never has a moment's rest.'"
    sx: {hanzi: "無閒。", pinyin: "moˇ hanˇ."}
    hl: {hanzi: "無閒。", pinyin: "mo han."}
  - n: 10
    speaker: Sam
    en: "Why is a rice bucket busy?"
    sx: {hanzi: "飯甑做麼个會無閒？", pinyin: "fan zen zo maˋ ge voi moˇ hanˇ?"}
    hl: {hanzi: "飯甑做麼个會無閒？", pinyin: "pon+ zenˇ zoˇ maˊ gaiˇ voi+ mo han?"}
  - n: 11
    speaker: 阿英
    en: "On New Year's Eve the whole family eats at home, and the rice steamer is busy all evening. These days I'm like the New Year's Eve rice steamer: no time at all."
    sx: {hanzi: "三十暗晡大家都在屋下食飯，飯甑一暗晡都無閒。𠊎近來就像三十暗晡个飯甑：無閒。", pinyin: "samˊ siib am buˊ tai gaˊ du coiˊ vugˋ kaˊ siid fan, fan zen idˋ am buˊ du moˇ hanˇ. ngaiˇ kiun loiˇ qiu qiong samˊ siib am buˊ ge fan zen: moˇ hanˇ."}
    hl: {hanzi: "三十暗晡大家都在屋下食飯，飯甑一暗晡都無閒。𠊎近來就像三十暗晡个飯甑：無閒。", pinyin: "samˋ shibˋ amˇ buˋ tai+ gaˋ du+ coiˋ vug haˋ shidˋ pon+, pon+ zenˇ rhid amˇ buˋ du+ mo han. ngai kiun+ loi ciu+ ciongˇ samˋ shibˋ amˇ buˋ gaiˇ pon+ zenˇ: mo han."}
  - n: 12
    speaker: 阿婆
    en: "(to A-min) And you, going up to 南庄 like that: 'a duck in the seventh month', no idea of danger!"
    sx: {hanzi: "你同 Sam 去南庄，就像七月半个鴨仔：毋知死！", pinyin: "nˇ tungˇ Sam hi namˇ zongˊ, qiu qiong qidˋ ngied ban ge abˋ eˇ: mˇ diˊ xiˋ!"}
    hl: {hanzi: "你摎 Sam 去南庄，就像七月半个鴨仔：毋知死！", pinyin: "ngi lauˋ Sam hiˇ nam zhongˋ, ciu+ ciongˇ cid ngiedˋ banˇ gaiˇ ab er: m diˋ siˊ!"}
  - n: 13
    speaker: 阿公
    en: "My turn. 'Sugar cane in the twelfth month…'"
    sx: {hanzi: "輪著𠊎。十二月甘蔗……", pinyin: "linˊ doˋ ngaiˇ. siib ngi ngied gamˊ za …"}
    hl: {hanzi: "輪著𠊎。十二月甘蔗……", pinyin: "linˋ doˊ ngai. shibˋ ngi+ ngiedˋ gamˋ zhaˇ …"}
  - n: 14
    speaker: 阿婆
    en: "'…sweet at every joint.' (pretending to be cross) Why are you buttering me up tonight?"
    sx: {hanzi: "目目甜。你今暗晡做麼个恁會阿𧩣人？", pinyin: "mugˋ mugˋ tiamˇ. nˇ gimˊ am buˊ zo maˋ ge anˋ voi oˊ noˋ nginˇ?"}
    hl: {hanzi: "目目甜。你今暗晡做麼个恁會安𧩣人？", pinyin: "mug mug tiam. ngi gimˋ amˇ buˋ zoˇ maˊ gaiˇ anˊ voi+ onˋ noˊ ngin?"}
  - n: 15
    speaker: 阿明
    en: "Sam's turn!"
    sx: {hanzi: "換 Sam！", pinyin: "von Sam!"}
    hl: {hanzi: "換 Sam！", pinyin: "von+ Sam!"}
  - n: 16
    speaker: Sam
    en: "I know one. 'A nose with three nostrils…'"
    sx: {hanzi: "𠊎識一句：三隻鼻公空……", pinyin: "ngaiˇ siidˋ idˋ gi: samˊ zagˋ pi gungˊ kungˊ …"}
    hl: {hanzi: "𠊎識一句：三隻鼻空笐……", pinyin: "ngai shid rhid giˇ: samˋ zhag pi+ kungˋ gong …"}
  - n: 17
    speaker: 阿婆
    en: "(with a glance at the neighbours' house) '…poking into other people's business!'"
    sx: {hanzi: "閒管！", pinyin: "hanˇ gonˋ!"}
    hl: {hanzi: "閒管！", pinyin: "han gonˊ!"}
  - n: 18
    speaker: 阿英
    en: "If 財伯姆 heard that…"
    sx: {hanzi: "若係財伯姆聽著……", pinyin: "na he coiˇ bagˋ meˊ tangˊ doˋ …"}
    hl: {hanzi: "若係財伯姆聽著……", pinyin: "na+ heˇ coi bag meˊ tangˋ doˊ …"}
  - n: 19
    speaker: 阿公
    en: "'A felt hat on your knee…' (nobody knows it) '…no face, no eyes: shameless.' So in the end, I win."
    sx: {hanzi: "膝頭戴氈帽……無面無目。結果，𠊎贏了。", pinyin: "qidˋ teuˇ dai zamˊ mo … moˇ mien moˇ mugˋ. giedˋ goˋ, ngaiˇ iangˇ leˊ."}
    hl: {hanzi: "膝頭戴氈帽……無面無目。結果，𠊎贏了。", pinyin: "cid teu daiˇ zhanˋ mo+ … mo mienˇ mo mug. gied goˊ, ngai rhang leˋ."}
  - n: 20
    speaker: 阿明
    en: "(looking up) Grandma, is there a rabbit on the moon?"
    sx: {hanzi: "阿婆，月光項有兔仔無？", pinyin: "aˊ poˇ, ngied gongˊ hong iuˊ tu eˋ moˇ?"}
    hl: {hanzi: "阿婆，月光項有兔仔無？", pinyin: "a+ po, ngiedˋ gongˋ hong+ rhiuˋ tuˇ er mo?"}
  - n: 21
    speaker: 阿婆
    en: "There is. 嫦娥 and her rabbit. Look!"
    sx: {hanzi: "有。嫦娥同兔仔。你看！", pinyin: "iuˊ. songˇ ngoˇ tungˇ tu eˋ. nˇ kon!"}
    hl: {hanzi: "有。嫦娥摎兔仔。你看！", pinyin: "rhiuˋ. shong ngo lauˋ tuˇ er. ngi konˇ!"}

notes:
  - ref: 1
    topic: culture
    text: >
      八月半 badˋ ngied ban "the fifteenth of the eighth month", the Hakka name of the Mid-Autumn festival. The official
      examples: 八月半對𫣆俚來講，係歸家人共下賞月、食月餅个團圓日 "for us, 八月半 is the day the whole family is together,
      looks at the moon and eats mooncakes", and, a little sadly, 現代人過八月半就湊伴炙肉，結果大家就無看著月光 "people
      today spend it barbecuing together, and nobody looks at the moon". 難怪 "no wonder": 今晡日係月半，難怪月光又大又圓
      is almost line 1 (official). 月光 ngied gongˊ is the moon itself.
  - ref: 2
    topic: grammar
    text: >
      仰般食 "how do you eat it": 仰般 "how" (lesson 15). A pomelo is a fruit you have to be shown.
  - ref: 3
    topic: vocab
    text: >
      㓾 ciiˇ "cut open" (fruit; also "slaughter"): 㓾柚仔 is the official example. 剝皮 "peel (off the skin)": 剝 bogˋ;
      食柚仔愛剝皮 (official). 柚仔 iu eˋ "pomelo"; the big Mid-Autumn pomelo of 麻豆 is 文旦 (exercise).
  - ref: 4
    topic: culture
    text: >
      師傅話 (lesson 44): the first half is said, the listener supplies the second. Every saying here is in the data,
      most as a dictionary entry, all with an example sentence: 菜籃㧡水－無採工 (kaga115 word for word), 三十暗晡个飯甑－
      無閒, 三隻鼻公空－閒管, 七月半个鴨仔 (MOE: 不知死活), and 膝頭戴氈帽, which is not an entry but appears in a kaga115
      example: 有一句師傅話講：「膝頭戴氈帽，無面無目。」. For 十二月甘蔗, see line 14.
  - ref: 7
    topic: vocab
    text: >
      無採工 moˇ caiˋ gungˊ "wasted effort, all for nothing" (water runs out through the basket). It stands alone too:
      學到半桶水就無採工吔 "learn it only halfway and it's all for nothing" (official).
  - ref: 11
    topic: grammar
    text: >
      飯甑 fan zen "the wooden rice steamer" (Hailu pon+ zenˇ): on New Year's Eve it never stops. A-in explains a saying
      the way Hakka speakers do, by spelling out the picture. The official example applies it to oneself: 𠊎近來就像三十暗晡
      个飯甑－－無閒，故所無辦法跈你共下去旅行 "I'm as busy as the New Year's Eve rice steamer these days, so I can't
      come travelling with you", which A-in quotes. kaga115 gives the saying a second sense: the steamer is needed at
      home that night, so it "can't be lent out" (自己需要用，無法借給他人). 一暗晡 "all evening". 近來 "lately" (lesson 62).
  - ref: 12
    topic: culture
    text: >
      七月半个鴨仔 "a duck in the seventh month" (毋知死 "doesn't know it's going to die"): ducks are killed for the
      festival of the seventh month, and the duck has no idea. The official example: 講等毋好去，你偏偏愛去，就像七月半个
      鴨仔－毋知死 "we told you not to go, and you went anyway". Grandma has waited eighteen days to say it (lesson 90).
  - ref: 13
    topic: grammar
    text: >
      輪著𠊎 "it's my turn": MOE has it word for word (輪著𠊎。), and kaga115 這隻月輪著𠊎值班 "this month it's my turn on
      duty". 輪 linˊ (kaga115; MOE reads linˇ) "take turns", as Mandarin 輪到我. 換 Sam (line 15) "Sam's turn": 換
      "change" (lesson 46).
  - ref: 14
    topic: vocab
    text: >
      阿𧩣 oˊ noˋ "praise, flatter" (Hailu 安𧩣 onˋ noˊ): 佢盡會阿𧩣人，講話像十二月甘蔗－目目甜 "he's very good at buttering
      people up; his words are as sweet as sugar cane in the twelfth month" (kaga 2013; 盡 "very"). 目 here is a joint of
      the cane: sweet at every one. kaga115 completes the saying differently, 十二月甘蔗－兩頭甜 (Hailu 雙頭甜) "sweet at
      both ends", of double good luck: 佢考著醫師牌仔又愛討餔娘吔，正經係十二月甘蔗－兩頭甜.
  - ref: 16
    topic: hailu
    text: >
      Sixian 鼻公空 "nostril", Hailu 鼻空笐 pi+ kungˋ gong (kaga and kaga115): the Hailu saying is 三隻鼻空笐－閒管, as in
      kaga115 這毋係你个事，莫三隻鼻空笐─閒管. 閒管 hanˇ gonˋ "meddle": 閒 "idle" (lesson 16's 有閒) + 管 "mind" (lesson 41).
  - ref: 19
    topic: vocab
    text: >
      膝頭戴氈帽 "a felt hat on your knee": a knee has no face and no eyes, 無面無目 "shameless, with no sense of shame"
      (dictionary: 不講情面，沒有羞恥). Grandpa wins with the one nobody knows. 氈帽 zamˊ mo "felt hat".
  - ref: 21
    topic: culture
    text: >
      嫦娥 songˇ ngoˇ, who flew to the moon (the dictionary entry tells the story); the rabbit on the moon is general
      knowledge, not in the data.

