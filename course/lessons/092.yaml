exercises:
  translate:
    - en: "People today eat and chat at Mid-Autumn, and in the end nobody looks at the moon."
      sx: {hanzi: "現代人過八月半淨食淨講，結果大家都無看月光。", pinyin: "hien toi nginˇ go badˋ ngied ban qiang siid qiang gongˋ, giedˋ goˋ tai gaˊ du moˇ kon ngied gongˊ."}
      hl: {hanzi: "現代人過八月半淨食淨講，結果大家都無看月光。", pinyin: "hien+ toi+ ngin goˇ bad ngiedˋ banˇ ciang+ shidˋ ciang+ gongˊ, gied goˊ tai+ gaˋ du+ mo konˇ ngiedˋ gongˋ."}
      check: true
    - en: "You learn it only halfway? Then it's all for nothing."
      sx: {hanzi: "你學到一半就毋學？恁樣就無採工。", pinyin: "nˇ hog do idˋ ban qiu mˇ hog? anˋ ngiongˇ qiu moˇ caiˋ gungˊ."}
      hl: {hanzi: "你學到一半就毋學？恁樣就無採工。", pinyin: "ngi hogˋ doˇ rhid banˇ ciu+ m hogˋ? an ngiong ciu+ mo caiˊ gungˋ."}
    - en: "Tonight it's pleasantly cool. Shall we eat a wendan pomelo?"
      sx: {hanzi: "今暗晡當涼爽。𫣆兜食一粒文旦好無？", pinyin: "gimˊ am buˊ dongˊ liongˇ songˋ. enˊ deuˊ siid idˋ liab vunˇ dan hoˋ moˇ?"}
      hl: {hanzi: "今暗晡當涼爽。𫣆兜食一粒文旦好無？", pinyin: "gimˋ amˇ buˋ dongˋ liong songˊ. enˋ deuˋ shidˋ rhid liabˋ vun danˇ hoˊ mo?"}
    - en: "Don't meddle: it's none of your business."
      sx: {hanzi: "這毋係若事，莫三隻鼻公空：閒管。", pinyin: "iaˋ mˇ he ngiaˊ sii, mog samˊ zagˋ pi gungˊ kungˊ: hanˇ gonˋ."}
