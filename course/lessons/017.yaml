exercises:
  translate:
    - en: "How do I get to the school?"
      sx: {hanzi: "學校仰般去？", pinyin: "hog gauˋ ngiongˋ banˊ hi?"}
      hl: {hanzi: "學校仰般去？", pinyin: "hogˋ gauˊ ngiongˊ banˋ hiˇ?"}
    - en: "The soy sauce shop is next door to the station."
      sx: {hanzi: "豆油店在火車頭隔壁。", pinyin: "teu iuˇ diam coiˊ foˋ caˊ teuˇ gagˋ biagˋ."}
      hl: {hanzi: "豆油店在火車頭隔壁。", pinyin: "teu+ rhiu diamˇ coiˋ foˊ chaˋ teu gag biag."}
    - en: "Do you know her? — No, I don't."
      sx: {hanzi: "你識佢無？——毋識。", pinyin: "nˇ siidˋ giˇ moˇ? — mˇ siidˋ."}
      hl: {hanzi: "你識佢無？——毋識。", pinyin: "ngi shid gi mo? — m shid."}
    - en: "The small shop is behind the school."
      sx: {hanzi: "細个店在學校後背。", pinyin: "se ge diam coiˊ hog gauˋ heu boi."}
      hl: {hanzi: "細个店在學校後背。", pinyin: "seˇ gaiˇ diamˇ coiˋ hogˋ gauˊ heu+ boiˇ."}
    - en: "Grandpa has gone out; Grandma has gone into the garden."
      sx: {hanzi: "阿公出去吔，阿婆去菜園吔。", pinyin: "aˊ gungˊ cudˋ hi leˊ, aˊ poˇ hi coi ienˇ leˊ."}
      hl: {hanzi: "阿公出去咧，阿婆去菜園咧。", pinyin: "a+ gungˋ chud hiˇ leˋ, a+ po hiˇ coiˇ rhan leˋ."}
    - en: "Every time I come, A-min is at school."
      sx: {hanzi: "𠊎逐擺來，阿明都在學校。", pinyin: "ngaiˇ dagˋ baiˋ loiˇ, aˊ minˇ du coiˊ hog gauˋ."}
      hl: {hanzi: "𠊎逐擺來，阿明都在學校。", pinyin: "ngai dag baiˊ loi, a+ min du+ coiˋ hogˋ gauˊ."}
  fill:
    - en: "After you."
      sx: {hanzi: "你行___。", pinyin: "nˇ hangˇ ___.", answer_hanzi: "先", answer: "xienˊ"}
      hl: {hanzi: "你行___。", pinyin: "ngi hang ___.", answer_hanzi: "先", answer: "senˋ"}
    - en: "I'll take you there."
      sx: {hanzi: "𠊎___你去。", pinyin: "ngaiˇ ___ nˇ hi.", answer_hanzi: "帶", answer: "dai"}
      hl: {hanzi: "𠊎___你去。", pinyin: "ngai ___ ngi hiˇ.", answer_hanzi: "帶", answer: "daiˇ"}
    - en: "The shop is across the street."
      sx: {hanzi: "店在___。", pinyin: "diam coiˊ ___.", answer_hanzi: "對面", answer: "dui mien"}
      hl: {hanzi: "店在___。", pinyin: "diamˇ coiˋ ___.", answer_hanzi: "對面", answer: "duiˇ mienˇ"}

