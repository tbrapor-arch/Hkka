id: 17
title:
  en: "Lost in Miaoli"
  sx: {hanzi: "你先行", pinyin: "nˇ xienˊ hangˇ"}
  hl: {hanzi: "你先行", pinyin: "ngi senˋ hang"}
review: false
setting: >-
  Wednesday afternoon in 苗栗 town. Mrs Liu has sent Sam for soy sauce from "the shop opposite the station". He has
  been walking for twenty minutes and the station has not appeared. A schoolgirl in uniform is waiting at the lights.
names: [阿明, 苗栗]

dialogue:
  - n: 1
    speaker: Sam
    en: "Excuse me, I don't know the way. How do I get to the station?"
    sx: {hanzi: "細妹仔，借問，𠊎毋知路。火車頭仰般去？", pinyin: "se moi eˋ, jia mun, ngaiˇ mˇ diˊ lu. foˋ caˊ teuˇ ngiongˋ banˊ hi?"}
    hl: {hanzi: "細妹仔，借問，𠊎毋知路。火車頭仰般去？", pinyin: "seˇ moiˇ er, ziaˇ munˇ, ngai m diˋ lu+. foˊ chaˋ teu ngiongˊ banˋ hiˇ?"}
  - n: 2
    speaker: 細妹仔
    en: "The station? I'm going there too. I'll take you."
    sx: {hanzi: "火車頭？𠊎乜愛去，𠊎帶你去。", pinyin: "foˋ caˊ teuˇ? ngaiˇ me oi hi, ngaiˇ dai nˇ hi."}
    hl: {hanzi: "火車頭？𠊎乜愛去，𠊎帶你去。", pinyin: "foˊ chaˋ teu? ngai meˇ oiˇ hiˇ, ngai daiˇ ngi hiˇ."}
  - n: 3
    speaker: 細妹仔
    en: "(looking at him) You're Sam, aren't you? A-min says you speak Hakka."
    sx: {hanzi: "你係 Sam，係無？阿明講你會講客話。", pinyin: "nˇ he Sam, he moˇ? aˊ minˇ gongˋ nˇ voi gongˋ hagˋ fa."}
    hl: {hanzi: "你係 Sam，係無？阿明講你會講客話。", pinyin: "ngi heˇ Sam, heˇ mo? a+ min gongˊ ngi voi+ gongˊ hag voiˋ."}
  - n: 4
    speaker: Sam
    en: "Do you know A-min?"
    sx: {hanzi: "你識阿明？", pinyin: "nˇ siidˋ aˊ minˇ?"}
    hl: {hanzi: "你識阿明？", pinyin: "ngi shid a+ min?"}
  - n: 5
    speaker: 細妹仔
    en: "We're classmates."
    sx: {hanzi: "𠊎兜係同學。", pinyin: "ngaiˇ deuˊ he tungˇ hog."}
    hl: {hanzi: "𠊎兜係同學。", pinyin: "ngai deuˋ heˇ tung hogˋ."}
  - n: 6
    speaker: 細妹仔
    en: "(at a narrow gap between parked scooters) After you."
    sx: {hanzi: "你先行。", pinyin: "nˇ xienˊ hangˇ."}
    hl: {hanzi: "你先行。", pinyin: "ngi senˋ hang."}
  - n: 7
    speaker: Sam
    en: "No, no, after you."
    sx: {hanzi: "毋使，毋使，你先行。", pinyin: "mˇ siiˋ, mˇ siiˋ, nˇ xienˊ hangˇ."}
    hl: {hanzi: "毋使，毋使，你先行。", pinyin: "m siiˊ, m siiˊ, ngi senˋ hang."}
  - n: 8
    speaker: 細妹仔
    en: "(two minutes later) Here's the station. The shop's just opposite."
    sx: {hanzi: "火車頭到吔。店就在對面。", pinyin: "foˋ caˊ teuˇ do leˊ. diam qiu coiˊ dui mien."}
    hl: {hanzi: "火車頭到咧。店就在對面。", pinyin: "foˊ chaˋ teu doˇ leˋ. diamˇ ciu+ coiˋ duiˇ mienˇ."}
  - n: 9
    speaker: Sam
    en: "Thank you! …I walked past it three times."
    sx: {hanzi: "恁仔細！……𠊎行過去三擺吔！", pinyin: "anˋ ziiˋ se! … ngaiˇ hangˇ go hi samˊ baiˋ leˊ!"}
    hl: {hanzi: "承蒙你！……𠊎行過去三擺咧！", pinyin: "shin mung ngi! … ngai hang goˇ hiˇ samˋ baiˊ leˋ!"}
  - n: 10
    speaker: 細妹仔
    en: "(laughing) I'll tell A-min!"
    sx: {hanzi: "𠊎愛同阿明講！", pinyin: "ngaiˇ oi tungˇ aˊ minˇ gongˋ!"}
    hl: {hanzi: "𠊎愛摎阿明講！", pinyin: "ngai oiˇ lauˋ a+ min gongˊ!"}

notes:
  - ref: 1
    topic: vocab
    text: >
      細妹仔 se moi eˋ "girl, young woman", and a friendly way to address one. 細 se is "small" (Mandarin 小) in
      everyday Hakka: 細人仔 "child", 細倈仔 "boy". 火車頭 foˋ caˊ teuˇ "railway station", literally "train head".
      火車頭仰般去？ "how do you get to the station?": the place first, then 仰般去 "how go".
  - ref: 2
    topic: vocab
    text: >
      帶 dai "take (someone somewhere), bring": 𠊎帶你去 "I'll take you". 路 lu "road, way": 毋知路 "don't know the way".
  - ref: 4
    topic: false-friend
    text: >
      識 siidˋ "know (a person), recognise" (認識): 你識阿明？ "do you know A-min?"; 毋識 "don't know (him)". In Mandarin
      識 is mostly bookish; here it is everyday, and it will soon also mean "have ever (done)". 同學 tungˇ hog
      "classmate", as in Mandarin.
  - ref: 6
    topic: grammar
    text: >
      你先行 "you go first, after you" (你先走): the polite words at a door or on a narrow path, and the start of a
      small politeness duel (line 7) that someone has to lose. 先 xienˊ "first". The MOE articles on word order also
      describe 你行先, with 先 after the verb, an older Hakka order you may hear from older speakers; lesson 38 has
      the words that really do like to come after the verb (食加一碗).
  - ref: 8
    topic: vocab
    text: >
      火車頭到吔 "here's the station", literally "the station has arrived": 到 do "arrive". 店 diam "shop"; 對面 dui mien
      "opposite, across the street", as in Mandarin.
  - ref: 9
    topic: grammar
    text: >
      行過去三擺 "walked past (it) three times": 行過去 "walk past", a direction after the verb, and 擺 baiˋ "time, occasion" (the 擺 of 逐擺): 三擺
      "three times". 一擺, 兩擺: 擺 is Hakka's 次.
  - ref: 0
    topic: hailu
    text: >
      Hailu: 先 senˋ, 識 shid, 對面 duiˇ mienˇ. 你先行 is also Hailu.

