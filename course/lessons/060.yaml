exercises:
  translate:
    - en: "The news says a typhoon is coming."
      sx: {hanzi: "聽新聞報導講，有隻風搓會到了。", pinyin: "tangˊ xinˊ vunˇ bo toˊ gongˋ, iuˊ zagˋ fungˊ caiˊ voi do leˊ."}
      hl: {hanzi: "聽新聞報導講，有隻風搓會到了。", pinyin: "tangˋ sinˋ vun boˇ toˋ gongˊ, rhiuˋ zhag fungˋ caiˋ voi+ doˇ leˋ."}
      source: moe
    - en: "Because it rained, there were few visitors."
      sx: {hanzi: "因為落雨，故所遊客當少。", pinyin: "inˊ vi log iˋ, gu soˋ iuˇ hagˋ dongˊ seuˋ."}
      hl: {hanzi: "因為落水，所以遊客當少。", pinyin: "rhinˋ vui+ logˋ shuiˊ, soˊ rhiˋ rhiu hag dongˋ shauˊ."}
    - en: "Miaoli county has a population of over five hundred thousand."
      sx: {hanzi: "苗栗縣个人口有五十幾萬。", pinyin: "meuˇ lidˋ ien ge nginˇ kieuˋ iuˊ ngˋ siib giˋ van."}
      hl: {hanzi: "苗栗縣个人口有五十幾萬。", pinyin: "miau lidˋ rhanˇ gaiˇ ngin kieuˊ rhiuˋ ngˊ shibˋ giˊ van+."}
      check: true
    - en: "The reporter asked the county government how many people took part."
      sx: {hanzi: "記者問縣政府，有幾多人參加。", pinyin: "gi zaˋ mun ien ziin fuˋ, iuˊ giˋ doˊ nginˇ camˊ gaˊ."}
      hl: {hanzi: "記者問縣政府，有幾多人參加。", pinyin: "giˇ zhaˊ munˇ rhanˇ zhinˇ fuˊ, rhiuˋ giˊ doˋ ngin camˋ gaˋ."}
    - en: "Grandma's favourite programme is the Hakka mountain-song show."
      sx: {hanzi: "阿婆最好看个節目，係客家山歌節目。", pinyin: "aˊ poˇ zui hau kon ge jiedˋ mug, he hagˋ gaˊ sanˊ goˊ jiedˋ mug."}
      hl: {hanzi: "阿婆最好看个節目，係客家山歌節目。", pinyin: "a+ po zuiˇ hauˇ konˇ gaiˇ zied mug, heˇ hag gaˋ sanˋ goˋ zied mug."}
  fill:
