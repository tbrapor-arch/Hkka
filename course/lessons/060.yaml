      sx: {hanzi: "___當寒，___無人出去。", pinyin: "___ dongˊ honˇ, ___ moˇ nginˇ cudˋ hi.", answer_hanzi: "因為……故所", answer: "inˊ vi … gu soˋ"}
      hl: {hanzi: "___當冷，___無人出去。", pinyin: "___ dongˋ langˋ, ___ mo ngin chud hiˇ.", answer_hanzi: "因為……所以", answer: "rhinˋ vui+ … soˊ rhiˋ"}
    - en: "Several hundred thousand visitors."
      sx: {hanzi: "幾十___遊客。", pinyin: "giˋ siib ___ iuˇ hagˋ.", answer_hanzi: "萬", answer: "van"}
      hl: {hanzi: "幾十___遊客。", pinyin: "giˊ shibˋ ___ rhiu hag.", answer_hanzi: "萬", answer: "van+"}
    - en: "She came third."
      sx: {hanzi: "佢得著___三名。", pinyin: "giˇ dedˋ doˋ ___ samˊ miangˇ.", answer_hanzi: "第", answer: "ti"}
      hl: {hanzi: "佢得著___三名。", pinyin: "gi ded doˊ ___ samˋ miang.", answer_hanzi: "第", answer: "ti+"}

