id: 99
title:
  en: "Speaking Sixian and Hailu"
  sx: {hanzi: "一下四縣，一下海陸", pinyin: "idˋ ha xi ien, idˋ ha hoiˋ liug"}
  hl: {hanzi: "一下四縣，一下海陸", pinyin: "rhid ha+ siˇ rhanˇ, rhid ha+ hoiˊ liugˋ"}
review: false
setting: >-
  Saturday 18 December, noon in France and seven in the evening in Miaoli. Sam, back home for three weeks, calls the
  Lius on his phone. In Miaoli the whole family crowds round A-in's phone on the kitchen table; 阿舅 joins the call
  from 竹東. In the story, Grandma speaks Sixian and 阿舅 Hailu, and Sam answers each in their own; as everywhere in
  the course, every line is still given in both accents (note 0).
names: [法國, 竹東, 苗栗, 阿舅, 阿明, 阿英, 海陸]

dialogue:
  - n: 1
    speaker: 阿英
    en: "Sam, can you see us? We're all here, the whole family!"
    sx: {hanzi: "Sam，看得著無？𠊎兜全家都在這位！", pinyin: "Sam, kon dedˋ doˋ moˇ? ngaiˇ deuˊ qionˇ gaˊ du coiˊ iaˋ vi!"}
    hl: {hanzi: "Sam，看得著無？𠊎兜全家都在這位！", pinyin: "Sam, konˇ ded doˊ mo? ngai deuˋ cion gaˋ du+ coiˋ liaˊ vui+!"}
  - n: 2
    speaker: Sam
    en: "I can! We're so far apart: it's about twelve here in France, and seven in the evening in Miaoli. Seven hours' difference. I've just had lunch."
    sx: {hanzi: "看得著！隔恁遠：法國這下大概十二點，苗栗暗晡頭七點，差七點鐘。𠊎正食晝。", pinyin: "kon dedˋ doˋ! gagˋ anˋ ienˋ: fabˋ guedˋ iaˋ ha tai koiˋ siib ngi diamˋ, meuˇ lid am buˊ teuˇ qidˋ diamˋ, caˊ qidˋ diamˋ zungˊ. ngaiˇ zang siid zu."}
    hl: {hanzi: "看得著！隔恁遠：法國這下大概十二點，苗栗暗晡頭七點，差七點鐘。𠊎正食晝。", pinyin: "konˇ ded doˊ! gag anˊ rhanˊ: fab gued liaˊ ha+ tai+ koiˊ shibˋ ngi+ diamˊ, miau lidˋ amˇ buˋ teu cid diamˊ, caˋ cid diamˊ zhungˋ. ngai zhangˇ shidˋ zhiuˇ."}
  - n: 3
    speaker: 阿明
    en: "阿舅's here too! He's in 竹東, joining in on his phone."
    sx: {hanzi: "阿舅乜來了！佢在竹東，用手機仔同𠊎兜鬥陣講。", pinyin: "aˊ kiuˊ me loiˇ leˊ! giˇ coiˊ zugˋ dungˊ, iung suˋ giˊ eˋ tungˇ ngaiˇ deuˊ deu ciin gongˋ."}
    hl: {hanzi: "阿舅乜來了！佢在竹東，用手機摎𠊎兜鬥陣講。", pinyin: "a+ kiuˋ meˇ loi leˋ! gi coiˋ zug dungˋ, rhung+ shiuˊ giˋ lauˋ ngai deuˋ deuˇ chin+ gongˊ."}
    check: true
  - n: 4
    speaker: 阿舅
    en: "Sam, thank you for calling! Is it cold in Europe?"
    sx: {hanzi: "Sam，承蒙你打電話來！歐洲冷無？", pinyin: "Sam, siinˇ mungˇ nˇ daˋ tien fa loiˇ! euˊ zuˊ langˊ moˇ?"}
    hl: {hanzi: "Sam，承蒙你打電話來！歐洲冷無？", pinyin: "Sam, shin mung ngi daˊ tien+ faˇ loi! euˋ zhiuˋ langˋ mo?"}
    check: true
  - n: 5
    speaker: 阿婆
    en: "(not to be outdone) Is France cold?"
    sx: {hanzi: "法國寒無？", pinyin: "fabˋ guedˋ honˇ moˇ?"}
    hl: {hanzi: "法國寒無？", pinyin: "fab gued hon mo?"}
  - n: 6
    speaker: Sam
    en: "Grandma, it's 寒; 阿舅, it's 冷. Freezing, about zero, colder than the fridge, and it's even snowing!"
    sx: {hanzi: "阿婆，當寒；阿舅，當冷。冷颼颼仔，大概零度，比冰箱較冷，還落雪了！", pinyin: "aˊ poˇ, dongˊ honˇ; aˊ kiuˊ, dongˊ langˊ. langˊ xiuˇ xiuˇ eˋ, tai koiˋ langˇ tu, biˋ benˊ xiongˊ ka langˊ, hanˇ log xiedˋ leˊ!"}
    hl: {hanzi: "阿婆，當寒；阿舅，當冷。冷颼颼仔，大概零度，比冰箱較冷，還落雪了！", pinyin: "a+ po, dongˋ hon; a+ kiuˋ, dongˋ langˋ. langˋ siu siu er, tai+ koiˊ lang tu+, biˊ benˋ siongˋ haˇ langˋ, han logˋ sied leˋ!"}
    check: true
  - n: 7
    speaker: 阿明
    en: "One minute Sixian, the next Hailu: it's like listening to an interpreter!"
    sx: {hanzi: "你一下講四縣，一下講海陸，像在該翻譯！", pinyin: "nˇ idˋ ha gongˋ xi ien, idˋ ha gongˋ hoiˋ liug, qiong du ge fanˊ id!"}
    hl: {hanzi: "你一下講四縣，一下講海陸，像在該翻譯！", pinyin: "ngi rhid ha+ gongˊ siˇ rhanˇ, rhid ha+ gongˊ hoiˊ liugˋ, ciongˇ diˇ gai fanˋ rhidˋ!"}
  - n: 8
    speaker: 阿舅
    en: "Sam, are you hungry now?"
    sx: {hanzi: "Sam，你這下肚飢無？", pinyin: "Sam, nˇ iaˋ ha duˋ giˊ moˇ?"}
    hl: {hanzi: "Sam，你這下肚屎枵無？", pinyin: "Sam, ngi liaˊ ha+ duˊ shiˊ iauˋ mo?"}
  - n: 9
    speaker: Sam
    en: "I've just eaten, I'm not hungry. …阿舅, in 竹東 you say 肚屎枵, and in Miaoli we say 肚飢, don't we?"
    sx: {hanzi: "𠊎正食飽，毋會肚飢。……阿舅，你兜竹東講肚屎枵，𠊎兜苗栗講肚飢，係毋係？", pinyin: "ngaiˇ zang siid bauˋ, mˇ voi duˋ giˊ. … aˊ kiuˊ, nˇ deuˊ zugˋ dungˊ gongˋ duˋ siiˋ iauˊ, ngaiˇ deuˊ meuˇ lid gongˋ duˋ giˊ, he mˇ he?"}
    hl: {hanzi: "𠊎正食飽，毋會肚屎枵。……阿舅，你兜竹東講肚屎枵，𠊎兜苗栗講肚飢，係毋係？", pinyin: "ngai zhangˇ shidˋ bauˊ, m voi+ duˊ shiˊ iauˋ. … a+ kiuˋ, ngi deuˋ zug dungˋ gongˊ duˊ shiˊ iauˋ, ngai deuˋ miau lidˋ gongˊ duˊ giˋ, heˇ m heˇ?"}
    check: true
  - n: 10
    speaker: 阿舅
    en: "That's right. Each of us says it our own way, and everyone understands."
    sx: {hanzi: "係。各人講各人个，大家都聽得識。", pinyin: "he. gogˋ nginˇ gongˋ gogˋ nginˇ ge, tai gaˊ du tangˊ dedˋ siidˋ."}
    hl: {hanzi: "係。各人講各人个，大家都聽得識。", pinyin: "heˇ. gog ngin gongˊ gog ngin gaiˇ, tai+ gaˋ du+ tangˋ ded shid."}
    check: true
  - n: 11
    speaker: 阿婆
    en: "The accent is different; the Hakka is the same."
    sx: {hanzi: "腔調無共樣，客話係共樣个。", pinyin: "kiongˊ tiau moˇ kiung iong, hagˋ fa he kiung iong ge."}
    hl: {hanzi: "腔調無共樣，客話係共樣个。", pinyin: "kiongˋ tiau+ mo kiung+ rhong+, hag voiˋ heˇ kiung+ rhong+ gaiˇ."}
  - n: 12
    speaker: Sam
    en: "At first I thought Sixian and Hailu were very different. Only now do I see that most of it is the same."
    sx: {hanzi: "一開始𠊎試著四縣同海陸差別當大。這下正知，相同个較多。", pinyin: "idˋ koiˊ ciiˋ ngaiˇ cii doˋ xi ien tungˇ hoiˋ liug caˊ pied dongˊ tai. iaˋ ha zang diˊ, xiongˊ tungˇ ge ka doˊ."}
    hl: {hanzi: "一開始𠊎試著四縣摎海陸差別當大。這下正知，相同个較多。", pinyin: "rhid koiˋ shiˊ ngai chiˇ doˊ siˇ rhanˇ lauˋ hoiˊ liugˋ caˋ piedˋ dongˋ tai+. liaˊ ha+ zhangˇ diˋ, siongˋ tung gaiˇ haˇ doˋ."}
  - n: 13
    speaker: 阿英
    en: "Your memory's so good: you remember both."
    sx: {hanzi: "你个記性恁好，兩種都記得。", pinyin: "nˇ ge gi xin anˋ hoˋ, liongˋ zungˋ du gi dedˋ."}
    hl: {hanzi: "你个記性恁好，兩種都記得。", pinyin: "ngi gaiˇ giˇ sinˇ anˊ hoˊ, liongˊ zhungˊ du+ giˇ ded."}
  - n: 14
    speaker: Sam
    en: "It's not a good head, just an ordinary brain. Hear it every day and you pick it up. …But I'm afraid I'll go backwards, here."
    sx: {hanzi: "毋係頭腦好，係一般个腦筋定定。逐日聽，就會。……毋過𠊎驚會退步。", pinyin: "mˇ he teuˇ noˋ hoˋ, he idˋ banˊ ge noˋ ginˊ tin tin. dagˋ ngidˋ tangˊ, qiu voi. … mˇ go ngaiˇ giangˊ voi tui pu."}
    hl: {hanzi: "毋係頭腦好，係一般个腦筋定定。逐日聽，就會。……毋過𠊎驚會退步。", pinyin: "m heˇ teu noˊ hoˊ, heˇ rhid banˋ gaiˇ noˊ ginˋ tin+ tin+. dag ngid tangˋ, ciu+ voi+. … m goˇ ngai giangˋ voi+ tuiˇ pu+."}
  - n: 15
    speaker: 阿明
    en: "You won't! We'll take turns chatting with you: Saturdays Grandma, Sundays 阿舅."
    sx: {hanzi: "毋會退步！𠊎兜輪流同你打嘴鼓：禮拜六阿婆，禮拜日阿舅。", pinyin: "mˇ voi tui pu! ngaiˇ deuˊ lunˇ liuˇ tungˇ nˇ daˋ zoi guˋ: liˊ bai liugˋ aˊ poˇ, liˊ bai ngidˋ aˊ kiuˊ."}
    hl: {hanzi: "毋會退步！𠊎兜輪流摎你打嘴鼓：禮拜六阿婆，禮拜日阿舅。", pinyin: "m voi+ tuiˇ pu+! ngai deuˋ lun liu lauˋ ngi daˊ zhoiˇ guˊ: liˋ baiˇ liug a+ po, liˋ baiˇ ngid a+ kiuˋ."}
  - n: 16
    speaker: 阿英
    en: "In France you're a local; and when you come back to Miaoli, you're no outsider either."
    sx: {hanzi: "在法國你係本地人；轉來苗栗，你乜毋係外地人。", pinyin: "coiˊ fabˋ guedˋ nˇ he bunˋ ti nginˇ; zonˋ loiˇ meuˇ lid, nˇ me mˇ he ngoi ti nginˇ."}
    hl: {hanzi: "在法國你係本地人；轉來苗栗，你乜毋係外地人。", pinyin: "coiˋ fab gued ngi heˇ bunˊ ti+ ngin; zhonˊ loi miau lidˋ, ngi meˇ m heˇ ngoi+ ti+ ngin."}
  - n: 17
    speaker: 阿舅
    en: "Tomorrow the factory still has 粄條 to make, so I'm off to bed. Thank you, Sam!"
    sx: {hanzi: "天光日工廠還愛做粄條，𠊎先去睡目。承蒙你，Sam！", pinyin: "tienˊ gongˊ ngidˋ gungˊ congˋ hanˇ oi zo banˋ tiauˇ, ngaiˇ xienˊ hi soi mugˋ. siinˇ mungˇ nˇ, Sam!"}
    hl: {hanzi: "韶早工廠還愛做粄條，𠊎先去睡目。承蒙你，Sam！", pinyin: "shau zoˊ gungˋ chongˊ han oiˇ zoˇ banˊ tiau, ngai senˋ hiˇ shoi+ mug. shin mung ngi, Sam!"}
    check: true
  - n: 18
    speaker: Sam
    en: "Thank you, 阿舅! …And thank you, Grandma!"
    sx: {hanzi: "承蒙你，阿舅！……恁仔細，阿婆！", pinyin: "siinˇ mungˇ nˇ, aˊ kiuˊ! … anˋ ziiˋ se, aˊ poˇ!"}
    hl: {hanzi: "承蒙你，阿舅！……恁仔細，阿婆！", pinyin: "shin mung ngi, a+ kiuˋ! … anˊ ziiˊ seˇ, a+ po!"}
    check: true
  - n: 19
    speaker: 阿公
    en: "(leaning into the picture behind Grandma) Sam, have you eaten?"
    sx: {hanzi: "Sam，食飽吂？", pinyin: "Sam, siid bauˋ mangˇ?"}
    hl: {hanzi: "Sam，食飽吂？", pinyin: "Sam, shidˋ bauˊ mang?"}
  - n: 20
    speaker: Sam
    en: "I've eaten, Grandpa."
    sx: {hanzi: "食飽了，阿公。", pinyin: "siid bauˋ leˊ, aˊ gungˊ."}
    hl: {hanzi: "食飽了，阿公。", pinyin: "shidˋ bauˊ leˋ, a+ gungˋ."}

notes:
  - ref: 0
    topic: hailu
    text: >
      How to read this lesson's two columns. In the story Grandma speaks Sixian and 阿舅 Hailu, and Sam switches. The
      Sixian column gives 阿舅's lines as a Sixian speaker would say them (line 8: 肚飢, line 17: 天光日), and the Hailu
      column gives Grandma's lines in Hailu. Where the joke is in the words themselves (lines 4–6, 9, 17–18), both
      columns keep the same words. 寒 and 冷 have readings in both accents. 恁仔細 (MOE: 僅四縣用), 承蒙 (僅海陸用) and
      肚屎枵 (Hailu only) do not: their reading in the other column (Hailu anˊ ziiˊ seˇ, Sixian siinˇ mungˇ, duˋ siiˋ
      iauˊ) is built by the course, and those lines are marked for a check.
  - ref: 2
    topic: vocab
    text: >
      隔恁遠 "so far apart": 隔 gagˋ "be separated by". 差七點鐘 "seven hours' difference": 差 (lesson 59) + 點鐘 (lesson
      20). 暗晡頭 "the evening", 食晝 (lesson 57) "have lunch", 大概 tai koiˋ "about, roughly", before a number or a guess.
      正食晝 "have just had lunch": 正 "only just".
  - ref: 3
    topic: vocab
    text: >
      鬥陣 deu ciin "together, in a group" (MOE 湊成一夥: 大家鬥陣來去分佢請); 同𠊎兜鬥陣講 is the course's phrasing,
      marked for a check. In Hailu, 摎 again where Sixian has 同.
  - ref: 6
    topic: hailu
    text: >
      寒 and 冷. The word lists pair Sixian 寒 honˇ with Hailu 冷 langˋ for "cold" (寒冷). In the official sentences
      (counted per accent, without the accent-unmarked dictionary examples) 寒 is in 161 Sixian and 31 Hailu sentences,
      冷 in 100 Sixian and 210 Hailu ones: each accent has both words and leans to its own. Sixian 冷 langˊ is mostly
      "cold to the touch" and in 冷颼颼仔 (2 Sixian sentences). So Sam's answer is a courtesy, not a translation.
      冷颼颼仔 langˊ xiuˇ xiuˇ eˋ "bitterly cold" (Hailu langˋ siu siu er). 比冰箱較冷 "colder than the fridge": 比 + 較 +
      adjective (lesson 66).
  - ref: 7
    topic: grammar
    text: >
      一下…一下… "one moment…, the next…": 你一下講四縣，一下講海陸. 四縣 (lesson 53) and 海陸 are the names of the two accents
      (MOE 四縣: the four counties of the old 嘉應州; 海陸: 海豐 and 陸豐, lesson 53). 翻譯 fanˊ id "translate,
      interpreter".
  - ref: 9
    topic: hailu
    text: >
      肚飢 and 肚屎枵 "hungry": the word lists pair them (Sixian 肚飢 duˋ giˊ, Hailu 肚屎枵 duˊ shiˊ iauˋ). In the official
      sentences 肚飢 is in 12 Sixian and no Hailu ones, 肚屎枵 in 9 Hailu and no Sixian ones (MOE says Hailu has 肚枵). Sam's "you say…, we say…" is
      the right shape: 你兜竹東講…，𠊎兜苗栗講…, with 𠊎兜 because 阿舅 is not of Miaoli.
  - ref: 10
    topic: grammar
    text: >
      各人講各人个 "each says his own": 各人 gogˋ nginˇ "each person". 聽得識 "can understand (by ear)": V得 + result, as
      in 看得著 (line 1), the positive of 聽無 (lesson 64); 聽得識 is in the official sentences (2 Sixian, 2 Hailu).
      各人講各人个 follows the attested 各人用各人个 (official, both accents) and 各人做各人个.
  - ref: 12
    topic: hailu
    text: >
      What the course has met, with the data behind it. Counts are official sentences only (kaga115 + kaga: 14,969
      Sixian, 15,123 Hailu, near-equal pools), so the two accents compare directly. The 20,185 MOE dictionary examples
      carry no accent and are left out: they often hold both words, one in brackets (韶早﹝天光日﹞).
      Pairs where each accent keeps to its own word (Sixian / Hailu sentences): 恁仔細 4 / 0 and 承蒙 1 / 5; 故所 137 / 4
      and 所以 1 / 131; 落雨 70 / 0 and 落水 6 / 73 (Sixian 落水 is "fall into the water"); 天光日 69 / 4 and 韶早 0 / 65;
      肚飢 12 / 0 and 肚屎枵 0 / 9; 粥 32 / 0 and 糜 6 / 40; 右片 3 / 1 and 正手片 0 / 3; 鋸弦仔 2 / 0 and 挨弦仔 0 / 2;
      寒天 51 / 1 and 冷天 0 / 47; 吾 "my" 351 / 7 (Hailu says 𠊎 + noun).
      Pairs with a strong lean: "with, to" 同你 43 / 1 against 摎你 3 / 50; 寒 161 / 31 against 冷 100 / 210.
      Shared: 盡 "very, most" (1,158 / 745; 最 97 / 133; gloss it each time); 看啊 "try" (49 / 48; 看仔 0 / 2); 會做得
      "not bad" (10 / 11); 還好 "very" (10 / 9).
      Same character, other reading: 飯 fan / pon+ (MOE also gives Hailu fan+), 个 ge / gaiˇ, 這 iaˋ / liaˊ, 話 fa / faˇ
      (and voiˋ in 客話); durative 等 denˋ / denˊ (43 of 47 Hailu V等 list words; Glossika writes nen).
      Tones: nearly all syllables follow one code (lesson 0): Sixian ˊ → Hailu ˋ, ˇ → unmarked, ˋ → ˊ, unmarked → ˇ or
      +, checked ˋ → unmarked and unmarked → ˋ. Exceptions met in the course: 阿 aˊ → a+, 仔 eˋ → er. Initials: Hailu
      zh ch sh rh where Sixian has z c s or a vowel, and Sixian j q x become z c s (將, 想); a vowel does not always
      become rh (歐 euˋ).
      Several "rules" written at the start of this course turned out softer in the data: the counts, not the rules,
      are the guide.
  - ref: 14
    topic: vocab
    text: >
      頭腦 teuˇ noˋ "head, brains", 腦筋 noˋ ginˊ "mind, brain", 記性 gi xin (line 13) "memory": all three in the MOE
      examples. 一般个 "ordinary". 退步 tui pu "go backwards, get worse", the opposite of 進步 (lesson 94).
  - ref: 15
    topic: vocab
    text: >
      輪流 lunˇ liuˇ "take turns" and 打嘴鼓 (lesson 58) "chat": 輪流同你打嘴鼓 "take turns chatting with you".
  - ref: 16
    topic: vocab
    text: >
      本地人 "a local" and 外地人 "an outsider": 本地 bunˋ ti, 外地 ngoi ti.
  - ref: 17
    topic: hailu
    text: >
      The two columns at work: the Sixian line says 天光日, the Hailu line 韶早. 韶早 has no Sixian reading in the lists,
      so it only appears in Hailu lines (checklist). 一開始 (line 12) "at first" (lesson 64).
  - ref: 19
    topic: culture
    text: >
      Grandpa's 食飽吂？ is lesson 3's question, a year on and (general knowledge) some ten thousand kilometres away.

