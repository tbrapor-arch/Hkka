exercises:
  translate:
    - en: "Sam likes watching films."
      sx: {hanzi: "Sam 好看電影。", pinyin: "Sam hau kon tien iangˋ."}
      hl: {hanzi: "Sam 好看電影。", pinyin: "Sam hauˇ konˇ tien+ rhangˊ."}
    - en: "Do you know how to cook 客家小炒?"
      sx: {hanzi: "你曉得煮客家小炒無？", pinyin: "nˇ hiauˋ dedˋ zuˋ hagˋ gaˊ seuˋ cauˋ moˇ?"}
      hl: {hanzi: "你曉得煮客家小炒無？", pinyin: "ngi hiauˊ ded zhuˊ hag gaˋ siauˊ cauˊ mo?"}
    - en: "I've only got a hundred, that's all."
      sx: {hanzi: "𠊎有一百定定。", pinyin: "ngaiˇ iuˊ idˋ bagˋ tin tin."}
      hl: {hanzi: "𠊎有一百定定。", pinyin: "ngai rhiuˋ rhid bag tin+ tin+."}
    - en: "Grandpa dotes on his grandchildren."
      sx: {hanzi: "阿公當惜孫仔。", pinyin: "aˊ gungˊ dongˊ xiagˋ sunˊ eˋ."}
      hl: {hanzi: "阿公當惜孫仔。", pinyin: "a+ gungˋ dongˋ siag sunˋ er."}
    - en: "What are your hobbies? — Reading and studying."
      sx: {hanzi: "你个興趣係麼个？——看書、讀書。", pinyin: "nˇ ge him qi he maˋ ge? — kon suˊ, tug suˊ."}
      hl: {hanzi: "你个興趣係麼个？——看書、讀書。", pinyin: "ngi gaiˇ himˇ ciˇ heˇ maˊ gaiˇ? — konˇ shuˋ, tugˋ shuˋ."}
    - en: "A-yu writes beautiful characters; she wants to learn English."
      sx: {hanzi: "阿玉寫字當靚，佢想愛學英語。", pinyin: "aˊ ngiug xiaˋ sii dongˊ jiangˊ, giˇ xiongˋ oi hog inˊ ngiˊ."}
      hl: {hanzi: "阿玉寫字當靚，佢想愛學英語。", pinyin: "a+ ngiugˋ siaˊ sii+ dongˋ ziangˋ, gi siongˊ oiˇ hogˋ rhinˋ ngiˋ."}
  fill:
    - en: "Do you know A-yu? (the person)"
      sx: {hanzi: "你___阿玉無？", pinyin: "nˇ ___ aˊ ngiug moˇ?", answer_hanzi: "識", answer: "siidˋ"}
      hl: {hanzi: "你___阿玉無？", pinyin: "ngi ___ a+ ngiugˋ mo?", answer_hanzi: "識", answer: "shid"}
    - en: "Can you speak English? (a skill)"
      sx: {hanzi: "你___講英語無？", pinyin: "nˇ ___ gongˋ inˊ ngiˊ moˇ?", answer_hanzi: "曉得", answer: "hiauˋ dedˋ"}
      hl: {hanzi: "你___講英語無？", pinyin: "ngi ___ gongˊ rhinˋ ngiˋ mo?", answer_hanzi: "曉得", answer: "hiauˊ ded"}
    - en: "Just a little, that's all."
      sx: {hanzi: "一息仔___。", pinyin: "idˋ xid eˋ ___.", answer_hanzi: "定定", answer: "tin tin"}
      hl: {hanzi: "一息仔___。", pinyin: "rhid sid er+ ___.", answer_hanzi: "定定", answer: "tin+ tin+"}

