exercises:
  translate:
    - en: "Grandma's vegetable garden is very big, and very green."
      sx: {hanzi: "阿婆个菜園當大，當青。", pinyin: "aˊ poˇ ge coi ienˇ dongˊ tai, dongˊ qiangˊ."}
      hl: {hanzi: "阿婆个菜園當大，當青。", pinyin: "a+ po gaiˇ coiˇ rhan dongˋ tai+, dongˋ ciangˋ."}
    - en: "Don't run; there's another bus in twenty minutes."
      sx: {hanzi: "莫走，二十分鐘還有一班。", pinyin: "mog zeuˋ, ngi siib funˊ zungˊ hanˇ iuˊ idˋ banˊ."}
      hl: {hanzi: "莫走，二十分鐘還有一班。", pinyin: "mogˋ zeuˊ, ngi+ shibˋ funˋ zhungˋ han rhiuˋ rhid banˋ."}
    - en: "It's going to rain tonight. Bring the washing in!"
      sx: {hanzi: "暗晡會落雨，遽遽收衫褲！", pinyin: "am buˊ voi log iˋ, giagˋ giagˋ suˊ samˊ fu!"}
      hl: {hanzi: "暗晡會落水，遽遽收衫褲！", pinyin: "amˇ buˋ voi+ logˋ shuiˊ, giag giag shiuˋ samˋ fuˇ!"}
    - en: "A-min loves rice noodles; I'd like some soup."
      sx: {hanzi: "阿明盡好食粄條，𠊎想愛食湯。", pinyin: "aˊ minˇ qin hau siid banˋ tiauˇ, ngaiˇ xiongˋ oi siid tongˊ."}
      hl: {hanzi: "阿明最好食粄條，𠊎想愛食湯。", pinyin: "a+ min zuiˇ hauˇ shidˋ banˊ tiau, ngai siongˊ oiˇ shidˋ tongˋ."}
    - en: "We're at home. Where are you all?"
      sx: {hanzi: "𠊎兜在屋下。你兜在哪位？", pinyin: "ngaiˇ deuˊ cai vugˋ kaˊ. nˇ deuˊ cai nai vi?"}
      hl: {hanzi: "𠊎兜在屋下。你兜在哪位？", pinyin: "ngai deuˋ cai+ vug haˋ. ngi deuˋ cai+ nai+ vui+?"}
  fill:
    - en: "This chilli is the hottest."
      sx: {hanzi: "這條番椒___辣。", pinyin: "iaˋ tiauˇ fanˊ zeuˊ ___ lad.", answer_hanzi: "盡", answer: "qin"}
      hl: {hanzi: "這條番椒___辣。", pinyin: "liaˊ tiau fanˋ ziauˋ ___ ladˋ.", answer_hanzi: "最", answer: "zuiˇ"}
    - en: "Don't worry."
      sx: {hanzi: "毋使___。", pinyin: "mˇ siiˋ ___.", answer_hanzi: "驚", answer: "giangˊ"}
      hl: {hanzi: "毋使___。", pinyin: "m siiˊ ___.", answer_hanzi: "驚", answer: "giangˋ"}
    - en: "Grandpa talks to Sam."
      sx: {hanzi: "阿公___Sam 講。", pinyin: "aˊ gungˊ ___ Sam gongˋ.", answer_hanzi: "同", answer: "tungˇ"}
      hl: {hanzi: "阿公___Sam 講。", pinyin: "a+ gungˋ ___ Sam gongˊ.", answer_hanzi: "摎", answer: "lauˋ"}

