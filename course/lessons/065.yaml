exercises:
  translate:
    - en: "At 清明 everyone goes to the ancestors' graves to pay their respects."
      sx: {hanzi: "清明節大家都愛去祖先个墓地祭祖。", pinyin: "qiangˊ miangˇ jiedˋ tai gaˊ du oi hi zuˋ xienˊ ge mu ti ji zuˋ."}
      hl: {hanzi: "清明節大家都愛去祖先个墓地祭祖。", pinyin: "ciangˋ miang zied tai+ gaˋ du+ oiˇ hiˇ zuˊ sienˋ gaiˇ muˇ ti+ ziˇ zuˊ."}
      source: moe
    - en: "Grandpa's father passed away fifty years ago."
      sx: {hanzi: "阿公个爸五十年前就過身吔。", pinyin: "aˊ gungˊ ge baˊ ngˋ siib ngienˇ qienˇ qiu go siinˊ leˊ."}
      hl: {hanzi: "阿公个爸五十年前就過身咧。", pinyin: "a+ gungˋ gaiˇ baˋ ngˊ shibˋ ngien cien ciu+ goˇ shinˋ leˋ."}
    - en: "Later the family moved to Miaoli."
      sx: {hanzi: "後來，佢兜歸屋下搬到苗栗。", pinyin: "heu loiˇ, giˇ deuˊ guiˊ vugˋ kaˊ banˊ do meuˇ lid."}
      hl: {hanzi: "後來，佢兜歸屋下搬到苗栗。", pinyin: "heu+ loi, gi deuˋ guiˋ vug haˋ banˋ doˇ miau lidˋ."}
    - en: "In the old days people were poor; they had no land."
      sx: {hanzi: "頭擺个人當窮，無地好種。", pinyin: "teuˇ baiˋ ge nginˇ dongˊ kiungˇ, moˇ ti hoˋ zung."}
      hl: {hanzi: "頭擺个人當窮，無地好種。", pinyin: "teu baiˊ gaiˇ ngin dongˋ kiung, mo ti+ hoˊ zhungˇ."}
      check: true
    - en: "Grandma looks after the children; Grandpa looks after the tea garden."
      sx: {hanzi: "阿婆照顧細人仔，阿公照顧茶園。", pinyin: "aˊ poˇ zeu gu se nginˇ eˋ, aˊ gungˊ zeu gu caˇ ienˇ."}
      hl: {hanzi: "阿婆照顧細人仔，阿公照顧茶園。", pinyin: "a+ po zhauˇ guˇ seˇ ngin er, a+ gungˋ zhauˇ guˇ ca rhan."}
    - en: "This year's typhoon was bigger than last year's."
      sx: {hanzi: "今年个風搓比舊年較大。", pinyin: "gimˊ ngienˇ ge fungˊ caiˊ biˋ kiu ngienˇ ka tai."}
      hl: {hanzi: "今年个風搓比舊年較大。", pinyin: "gimˋ ngien gaiˇ fungˋ caiˋ biˊ kiu+ ngien haˇ tai+."}
    - en: "At 清明, 艾粄 is made with mugwort."
      sx: {hanzi: "清明用艾仔打艾粄。", pinyin: "qiangˊ miangˇ iung ngie eˋ daˋ ngie banˋ."}
      hl: {hanzi: "清明用艾打艾粄。", pinyin: "ciangˋ miang rhung+ ngieˇ daˊ ngieˇ banˊ."}
      source: kaga
