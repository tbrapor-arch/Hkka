id: 65
title:
  en: "清明: sweeping the graves"
  sx: {hanzi: "去掛紙", pinyin: "hi gua ziiˋ"}
  hl: {hanzi: "去掛紙", pinyin: "hiˇ guaˇ zhiˊ"}
review: false
setting: >-
  Monday 5 April, 清明, eight in the morning, on the hillside above the tea field, among the family graves. Everyone has
  come, A-in and Mr Liu included; the sickles and the basket of offerings went up first. The grass has grown waist
  high since last year.
names: [阿英, 阿明, 苗栗]

dialogue:
  - n: 1
    speaker: 阿爸
    en: "Everyone, cut the grass first, and then we'll pay our respects."
    sx: {hanzi: "大家先割草，正來拜。", pinyin: "tai gaˊ xienˊ godˋ coˋ, zang loiˇ bai."}
    hl: {hanzi: "大家先割草，正來拜。", pinyin: "tai+ gaˋ senˋ god coˊ, zhangˇ loi baiˇ."}
  - n: 2
    speaker: Sam
    en: "(an hour later, the grave cleared) Whose grave is this?"
    sx: {hanzi: "這係麼人个墓？", pinyin: "iaˋ he maˋ nginˇ ge mu?"}
    hl: {hanzi: "這係麼人个墓？", pinyin: "liaˊ heˇ maˊ ngin gaiˇ muˇ?"}
  - n: 3
    speaker: 阿婆
    en: "Grandpa's father's. You should call him 阿太, great-grandfather. He died thirty years ago."
    sx: {hanzi: "阿公个爸个。你愛喊佢阿太。佢過身三十年吔。", pinyin: "aˊ gungˊ ge baˊ ge. nˇ oi ham giˇ aˊ tai. giˇ go siinˊ samˊ siib ngienˇ leˊ."}
    hl: {hanzi: "阿公个爸个。你愛喊佢阿太。佢過身三十年咧。", pinyin: "a+ gungˋ gaiˇ baˋ gaiˇ. ngi oiˇ hamˇ gi a+ taiˇ. gi goˇ shinˋ samˋ shibˋ ngien leˋ."}
  - n: 4
    speaker: 阿明
    en: "Grandma, tell Sam the story about 阿太!"
    sx: {hanzi: "阿婆，講阿太个故事分 Sam 聽！", pinyin: "aˊ poˇ, gongˋ aˊ tai ge gu sii bunˊ Sam tangˊ!"}
    hl: {hanzi: "阿婆，講阿太个故事分 Sam 聽！", pinyin: "a+ po, gongˊ a+ taiˇ gaiˇ guˇ sii+ bunˋ Sam tangˋ!"}
  - n: 5
    speaker: 阿婆
    en: "In the old days, a long time ago, 阿太's family was very poor. He had no land at all. So he went up the mountain with nothing but a mattock."
    sx: {hanzi: "頭擺頭擺，阿太屋下當苦，一垤地都無。佢斯擐一支钁頭上山。", pinyin: "teuˇ baiˋ teuˇ baiˋ, aˊ tai vugˋ kaˊ dongˊ kuˋ, idˋ de ti du moˇ. giˇ siiˇ kuan idˋ giˊ giogˋ teuˇ songˊ sanˊ."}
    hl: {hanzi: "頭擺頭擺，阿太屋下當苦，一垤地都無。佢斯擐一支钁頭上山。", pinyin: "teu baiˊ teu baiˊ, a+ taiˇ vug haˋ dongˋ kuˊ, rhid deˇ ti+ du+ mo. gi sii+ kuan+ rhid giˋ giog teu shongˋ sanˋ."}
    check: true
  - n: 6
    speaker: 阿婆
    en: "First he cleared the hill and the forest, and after that he planted tea. Every day it took two hours just to walk there."
    sx: {hanzi: "佢先開山打林，過後正種茶。逐日愛行兩點鐘久正行得到。", pinyin: "giˇ xienˊ koiˊ sanˊ daˋ naˇ, go heu zang zung caˇ. dagˋ ngidˋ oi hangˇ liongˋ diamˋ zungˊ giuˋ zang hangˇ dedˋ do."}
    hl: {hanzi: "佢先開山打林，過後正種茶。逐日愛行兩點鐘久正行得到。", pinyin: "gi senˋ koiˋ sanˋ daˊ na, goˇ heu+ zhangˇ zhungˇ ca. dag ngid oiˇ hang liongˊ diamˊ zhungˋ giuˊ zhangˇ hang ded doˇ."}
  - n: 7
    speaker: 阿婆
    en: "Then one year, of all things, a typhoon came, and every bush was swept away."
    sx: {hanzi: "有一年，嗄來一隻大風搓，茶樹全部分風吹走忒吔。", pinyin: "iuˊ idˋ ngienˇ, sa loiˇ idˋ zagˋ tai fungˊ caiˊ, caˇ su qionˇ pu bunˊ fungˊ coiˊ zeuˋ tedˋ leˊ."}
    hl: {hanzi: "有一年，嗄來一隻大風搓，茶樹全部分風吹走忒咧。", pinyin: "rhiuˋ rhid ngien, saˇ loi rhid zhag tai+ fungˋ caiˋ, ca shu+ cion pu+ bunˋ fungˋ choiˋ zeuˊ ted leˋ."}
  - n: 8
    speaker: Sam
    en: "And after that?"
    sx: {hanzi: "後來呢？", pinyin: "heu loiˇ neˇ?"}
    hl: {hanzi: "後來呢？", pinyin: "heu+ loi neˇ?"}
  - n: 9
    speaker: 阿婆
    en: "After that he planted it all again. Three years later the tea garden was even bigger than before."
    sx: {hanzi: "後來佢又種過。三年過後，茶園比頭擺還較大。", pinyin: "heu loiˇ giˇ iu zung go. samˊ ngienˇ go heu, caˇ ienˇ biˋ teuˇ baiˋ hanˇ ka tai."}
    hl: {hanzi: "後來佢又種過。三年過後，茶園比頭擺還較大。", pinyin: "heu+ loi gi rhiu+ zhungˇ goˇ. samˋ ngien goˇ heu+, ca rhan biˊ teu baiˊ han haˇ tai+."}
  - n: 10
    speaker: 阿公
    en: "(quietly, pointing down the hill) The tea garden 阿太 planted is the one we have now."
    sx: {hanzi: "阿太種个茶園，就係這下个茶園。", pinyin: "aˊ tai zung ge caˇ ienˇ, qiu he iaˋ ha ge caˇ ienˇ."}
    hl: {hanzi: "阿太種个茶園，就係這下个茶園。", pinyin: "a+ taiˇ zhungˇ gaiˇ ca rhan, ciu+ heˇ liaˊ ha+ gaiˇ ca rhan."}
  - n: 11
    speaker: 阿英
    en: "And Grandpa has looked after it his whole life."
    sx: {hanzi: "阿公乜照顧一生人吔。", pinyin: "aˊ gungˊ me zeu gu idˋ senˊ nginˇ leˊ."}
    hl: {hanzi: "阿公乜照顧一生人咧。", pinyin: "a+ gungˋ meˇ zhauˇ guˇ rhid senˋ ngin leˋ."}
  - n: 12
    speaker: 阿婆
    en: "Right. Light the incense, burn the paper money for the ancestors. Once we've paid our respects, we'll eat the 艾粄."
    sx: {hanzi: "好吔，燒香，燒銀紙分祖先。拜好，斯食艾粄。", pinyin: "hoˋ leˊ, seuˊ hiongˊ, seuˊ ngiunˇ ziiˋ bunˊ zuˋ xienˊ. bai hoˋ, siiˇ siid ngie banˋ."}
    hl: {hanzi: "好咧，燒香，燒銀紙分祖先。拜好，斯食艾粄。", pinyin: "hoˊ leˋ, shauˋ hiongˋ, shauˋ ngiun zhiˊ bunˋ zuˊ sienˋ. baiˇ hoˊ, sii+ shidˋ ngieˇ banˊ."}
  - n: 13
    speaker: 阿明
    en: "艾粄! I'm starving!"
    sx: {hanzi: "艾粄！𠊎肚飢吔！", pinyin: "ngie banˋ! ngaiˇ duˋ giˊ leˊ!"}
    hl: {hanzi: "艾粄！𠊎肚屎枵咧！", pinyin: "ngieˇ banˊ! ngai duˊ shiˊ iauˋ leˋ!"}
  - n: 14
    speaker: 阿爸
    en: "Every time we sweep the graves, the only thing you think about is eating."
    sx: {hanzi: "你逐擺掛紙，都係想食定定。", pinyin: "nˇ dagˋ baiˋ gua ziiˋ, du he xiongˋ siid tin tin."}
    hl: {hanzi: "你逐擺掛紙，都係想食定定。", pinyin: "ngi dag baiˊ guaˇ zhiˊ, du+ heˇ siongˊ shidˋ tin+ tin+."}

notes:
  - ref: 1
    topic: culture
    text: >
      Line 1 is close to an official example: 正月十九掛紙，大家先割草正來拜 "on the 19th of the first month we sweep the
      graves: first everyone cuts the grass, then we pay our respects". The example puts 掛紙 in the first month; another
      gives 正月十六. The data gives no single date; by general knowledge, many families sweep the graves at any time between
      the Lantern Festival and 清明. The Liu family has chosen 清明 itself. 割草 "cut the grass": 割 (lesson 45) + 草 (lesson 40).
  - ref: 3
    topic: vocab
    text: >
      阿太 aˊ tai "great-grandparent": the dictionary gives it for both great-grandfather and great-grandmother (阿公太,
      阿婆太 when you need to tell them apart). 墓 mu (line 2) "grave".
  - ref: 5
    topic: grammar
    text: >
      Storytelling. 頭擺頭擺 "long, long ago", 頭擺 (lesson 20) said twice, is how Grandma starts; the doubled form has no
      official example and is marked for checking. Then the story moves with little words: 斯 siiˇ "so, and then",
      the storyteller's 就 (無斯會 "or else"; but 斯會 can also be 斯 + 會 "can", as in 麼个斯會 "can do anything"); 先…過後正… "first…, after that…" (line 6);
      嗄 (lesson 41) for the blow nobody expected (line 7); 後來 "later, after that" (lines 8, 9).
  - ref: 5
    topic: false-friend
    text: >
      屋下當苦 "the family was very poor": 苦 read kuˋ is "poor, hard up"; read fuˋ (lesson 24) it is "bitter". 一垤地都無
      "not one plot of land": 垤 de, the classifier for a piece of land or a lump, and 地 ti "land, ground". 钁頭
      giogˋ teuˇ "mattock", the hill farmer's tool. 佢先開山打林 (line 6) "first he cleared the hill and the forest": the dictionary's word for breaking new land
      (頭擺人淨用一雙手來開山打林 "in the old days people cleared the land with their bare hands").
  - ref: 7
    topic: vocab
    text: >
      風搓 fungˊ caiˊ "typhoon". 分風吹走忒吔 "was blown away by the wind": the passive 分 of lesson 34.
  - ref: 9
    topic: grammar
    text: >
      種過 "planted again": 過 after the verb as "again, over" (lesson 54, 買過). 比頭擺還較大 "even bigger than before":
      比 + thing + 較 + adjective; lesson 66 has more comparisons.
  - ref: 12
    topic: culture
    text: >
      Official examples: 清明逐家掛紙个時節都會燒銀紙 "at 清明 every family burns paper money when sweeping the graves", and
      客家人在清明會打艾粄 "at 清明 Hakka people make 艾粄", rice cakes coloured with mugwort (艾). 拜好，斯食艾粄 "once
      the offering is done, then we eat the 艾粄": 斯 again.

