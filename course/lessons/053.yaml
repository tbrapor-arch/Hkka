exercises:
  translate:
    - en: "On the second day of the year, married daughters go back to their own families."
      sx: {hanzi: "年初二，嫁出去个妹仔愛轉外家。", pinyin: "ngienˇ cuˊ ngi, ga cudˋ hi ge moi eˋ oi zonˋ ngoi gaˊ."}
      hl: {hanzi: "年初二，嫁出去个妹仔愛轉外家。", pinyin: "ngien cuˋ ngi+, gaˇ chud hiˇ gaiˇ moiˇ er oiˇ zhonˊ ngoi+ gaˋ."}
      check: true
    - en: "Granny and Grandad live in 竹東; aunt looks after them."
      sx: {hanzi: "姐公、姐婆歇竹東，舅姆照顧佢兜。", pinyin: "jiaˋ gungˊ, jiaˋ poˇ hed zugˋ dungˊ, kiuˊ meˊ zeu gu giˇ deuˊ."}
      hl: {hanzi: "姐公、姐婆歇竹東，舅姆照顧佢兜。", pinyin: "ziaˊ gungˋ, ziaˊ po hied zhug dungˋ, kiuˋ meˋ zhauˇ guˇ gi deuˋ."}
    - en: "Sam has a Miaoli accent."
      sx: {hanzi: "Sam 講話有苗栗腔。", pinyin: "Sam gongˋ fa iuˊ meuˇ lid kiongˊ."}
      hl: {hanzi: "Sam 講話有苗栗腔。", pinyin: "Sam gongˊ faˇ rhiuˋ miau lidˋ kiongˋ."}
      check: true
    - en: "Finding a job is hard; uncle's factory is short of people."
      sx: {hanzi: "頭路當難尋，阿舅个工廠欠人。", pinyin: "teuˇ lu dongˊ nanˇ qimˇ, aˊ kiuˊ ge gungˊ congˋ kiam nginˇ."}
      hl: {hanzi: "頭路當難尋，阿舅个工廠欠人。", pinyin: "teu lu+ dongˋ nan cim, a+ kiuˋ gaiˇ gungˋ chong kiamˇ ngin."}
    - en: "His pronunciation is very good, for example his tones."
      sx: {hanzi: "佢个口音當好，好比聲調。", pinyin: "giˇ ge kieuˋ imˊ dongˊ hoˋ, hoˋ biˋ sangˊ tiau."}
      hl: {hanzi: "佢个口音當好，好比聲調。", pinyin: "gi gaiˇ kieuˊ rhimˋ dongˋ hoˊ, hoˊ biˊ shangˋ tiau+."}
      check: true
    - en: "After the New Year Sam will work in 竹東 for a month."
      sx: {hanzi: "過年過後，Sam 愛去竹東做一隻月。", pinyin: "go ngienˇ go heu, Sam oi hi zugˋ dungˊ zo idˋ zagˋ ngied."}
      hl: {hanzi: "過年過後，Sam 愛去竹東做一隻月。", pinyin: "goˇ ngien goˇ heu+, Sam oiˇ hiˇ zhug dungˋ zoˇ rhid zhag ngiedˋ."}
