id: 53
title:
  en: "To Mrs Liu's family in 竹東"
  sx: {hanzi: "年初二轉外家", pinyin: "ngienˇ cuˊ ngi zonˋ ngoi gaˊ"}
  hl: {hanzi: "年初二轉外家", pinyin: "ngien cuˋ ngi+ zhonˊ ngoi+ gaˋ"}
review: false
setting: >-
  Sunday 7 February, the second day of the year, when married daughters go back to their own families. Mr and Mrs Liu
  drive A-in, A-min and Sam an hour north to 竹東, to Mrs Liu's parents (姐公 and 姐婆) and her brother's family, in 新竹 county, where Mrs Liu grew up. Grandma and Grandpa stay in
  Miaoli for their own visitors. In 竹東 the family speaks Hailu, and Mrs Liu switches the moment she steps out of the
  car.
names: [竹東, 新竹, 苗栗, 阿英, 阿明]

dialogue:
  - n: 1
    speaker: 阿姆
    en: "(at the door) Mum! Brother! We're here!"
    sx: {hanzi: "阿姆！阿哥！𠊎兜轉來吔！", pinyin: "aˊ meˊ! aˊ goˊ! ngaiˇ deuˊ zonˋ loiˇ leˊ!"}
    hl: {hanzi: "阿姆！阿哥！𠊎兜轉來咧！", pinyin: "a+ meˋ! a+ goˋ! ngai deuˋ zhonˊ loi leˋ!"}
  - n: 2
    speaker: 姐婆
    en: "You're back! Come in, quick, come in!"
    sx: {hanzi: "轉來吔！遽遽入來，入來！", pinyin: "zonˋ loiˇ leˊ! giagˋ giagˋ ngib loiˇ, ngib loiˇ!"}
    hl: {hanzi: "轉來咧！遽遽入來，入來！", pinyin: "zhonˊ loi leˋ! giag giag ngibˋ loi, ngibˋ loi!"}
  - n: 3
    speaker: 阿明
    en: "Grandad, Granny, Happy New Year!"
    sx: {hanzi: "姐公、姐婆，新年快樂！", pinyin: "jiaˋ gungˊ, jiaˋ poˇ, xinˊ ngienˇ kuai log!"}
    hl: {hanzi: "姐公、姐婆，新年快樂！", pinyin: "ziaˊ gungˋ, ziaˊ po, sinˋ ngien kuaiˇ logˋ!"}
  - n: 4
    speaker: 阿舅
    en: "So you're Sam? My sister says your Hakka is very good."
    sx: {hanzi: "你就係 Sam？阿妹講你个客話當好。", pinyin: "nˇ qiu he Sam? aˊ moi gongˋ nˇ ge hagˋ fa dongˊ hoˋ."}
    hl: {hanzi: "你就係 Sam？阿妹講你个客話當好。", pinyin: "ngi ciu+ heˇ Sam? a+ moiˇ gongˊ ngi gaiˇ hag voiˋ dongˋ hoˊ."}
  - n: 5
    speaker: Sam
    en: "Only a little, uncle. And thank you!"
    sx: {hanzi: "阿舅，一息仔定定。恁仔細！", pinyin: "aˊ kiuˊ, idˋ xid eˋ tin tin. anˋ ziiˋ se!"}
    hl: {hanzi: "阿舅，一息仔定定。恁仔細！", pinyin: "a+ kiuˋ, rhid sid er tin+ tin+. anˊ ziiˊ seˇ!"}
  - n: 6
    speaker: 姐婆
    en: "(laughing) 恁仔細! You've got a Miaoli accent. That's how they say it in Miaoli; here in 竹東 we say 承蒙你."
    sx: {hanzi: "恁仔細！你有苗栗腔。該係苗栗个講法，𠊎兜竹東講承蒙你。", pinyin: "anˋ ziiˋ se! nˇ iuˊ meuˇ lid kiongˊ. ge he meuˇ lid ge gongˋ fabˋ, ngaiˇ deuˊ zugˋ dungˊ gongˋ siinˇ mungˇ nˇ."}
    hl: {hanzi: "恁仔細！你有苗栗腔。該係苗栗个講法，𠊎兜竹東講承蒙你。", pinyin: "anˊ ziiˊ seˇ! ngi rhiuˋ miau lidˋ kiongˋ. gai heˇ miau lidˋ gaiˇ gongˊ fab, ngai deuˋ zhug dungˋ gongˊ shin mung ngi."}
    check: true
  - n: 7
    speaker: Sam
    en: "承蒙你? …Why is it different?"
    sx: {hanzi: "承蒙你？……做麼个無共樣？", pinyin: "siinˇ mungˇ nˇ? … zo maˋ ge moˇ kiung iong?"}
    hl: {hanzi: "承蒙你？……做麼个無共樣？", pinyin: "shin mung ngi? … zoˇ maˊ gaiˇ mo kiung+ rhong+?"}
  - n: 8
    speaker: 阿英
    en: "Mum's family all live in 新竹 and speak Hailu. Miaoli speaks Sixian."
    sx: {hanzi: "阿姆个屋下人全部歇新竹，講海陸話。苗栗講四縣話。", pinyin: "aˊ meˊ ge vugˋ kaˊ nginˇ qionˇ pu hed xinˊ zugˋ, gongˋ hoiˋ liugˋ fa. meuˇ lid gongˋ xi ien fa."}
    hl: {hanzi: "阿姆个屋下人全部歇新竹，講海陸話。苗栗講四縣話。", pinyin: "a+ meˋ gaiˇ vug haˋ ngin cion pu+ hied sinˋ zhug, gongˊ hoiˊ liugˋ voiˋ. miau lidˋ gongˊ siˇ rhanˇ voiˋ."}
  - n: 9
    speaker: 阿英
    en: "It's the same Hakka, but a lot of words are said differently. 'Tomorrow', for instance: we say 天光日, and they don't say it that way at all. (In the Hailu line: they say 韶早.)"
    sx: {hanzi: "共樣係客話，毋過當多話講法無共樣。好比天光日，佢兜毋係恁樣講。", pinyin: "kiung iong he hagˋ fa, mˇ go dongˊ doˊ fa gongˋ fabˋ moˇ kiung iong. hoˋ biˋ tienˊ gongˊ ngidˋ, giˇ deuˊ mˇ he anˋ ngiongˇ gongˋ."}
    hl: {hanzi: "共樣係客話，毋過當多話講法無共樣。好比天光日，佢兜講韶早。", pinyin: "kiung+ rhong+ heˇ hag voiˋ, m goˇ dongˋ doˋ voiˋ gongˊ fab mo kiung+ rhong+. hoˊ biˊ tienˋ gongˋ ngid, gi deuˋ gongˊ shau zoˊ."}
    check: true
  - n: 10
    speaker: 阿舅
    en: "Sam, are you free after the New Year? My 粄條 factory is short of hands. A month's work: how about it?"
    sx: {hanzi: "Sam，過年過後你有閒無？𠊎个粄條工廠欠人。做一隻月，好無？", pinyin: "Sam, go ngienˇ go heu nˇ iuˊ hanˇ moˇ? ngaiˇ ge banˋ tiauˇ gungˊ congˋ kiam nginˇ. zo idˋ zagˋ ngied, hoˋ moˇ?"}
    hl: {hanzi: "Sam，過年過後你有閒無？𠊎个粄條工廠欠人。做一隻月，好無？", pinyin: "Sam, goˇ ngien goˇ heu+ ngi rhiuˋ han mo? ngai gaiˇ banˊ tiau gungˋ chong kiamˇ ngin. zoˇ rhid zhag ngiedˋ, hoˊ mo?"}
    check: true
  - n: 11
    speaker: Sam
    en: "Make 粄條? I don't know how."
    sx: {hanzi: "做粄條？𠊎毋曉得做。", pinyin: "zo banˋ tiauˇ? ngaiˇ mˇ hiauˋ dedˋ zo."}
    hl: {hanzi: "做粄條？𠊎毋曉得做。", pinyin: "zoˇ banˊ tiau? ngai m hiauˊ ded zoˇ."}
  - n: 12
    speaker: 阿舅
    en: "Don't worry, I'll teach you. Board and lodging included, and a wage; my wife will look after you. And you can learn Hailu while you're at it."
    sx: {hanzi: "毋使驚，𠊎教你。有食有歇，還有工錢，舅姆會照顧你。你乜做得學海陸話。", pinyin: "mˇ siiˋ giangˊ, ngaiˇ gauˊ nˇ. iuˊ siid iuˊ hiedˋ, hanˇ iuˊ gungˊ qienˇ, kiuˊ meˊ voi zeu gu nˇ. nˇ me zo dedˋ hog hoiˋ liugˋ fa."}
    hl: {hanzi: "毋使驚，𠊎教你。有食有歇，還有工錢，舅姆會照顧你。你乜做得學海陸話。", pinyin: "m siiˊ giangˋ, ngai gauˋ ngi. rhiuˋ shidˋ rhiuˋ hied, han rhiuˋ gungˋ cien, kiuˋ meˋ voi+ zhauˇ guˇ ngi. ngi meˇ zoˇ ded hogˋ hoiˊ liugˋ voiˋ."}
    check: true
  - n: 13
    speaker: Sam
    en: "(after a glance at Mrs Liu, who nods) All right! I'll come. Thank you, uncle!"
    sx: {hanzi: "好！𠊎來。承蒙你，阿舅！", pinyin: "hoˋ! ngaiˇ loiˇ. siinˇ mungˇ nˇ, aˊ kiuˊ!"}
    hl: {hanzi: "好！𠊎來。承蒙你，阿舅！", pinyin: "hoˊ! ngai loi. shin mung ngi, a+ kiuˋ!"}
  - n: 14
    speaker: 阿英
    en: "Uncle, you'll feed him 粄條 till he's fat!"
    sx: {hanzi: "阿舅，你會分 Sam 食粄條食到大箍！", pinyin: "aˊ kiuˊ, nˇ voi bunˊ Sam siid banˋ tiauˇ siid do tai kieuˊ!"}
    hl: {hanzi: "阿舅，你會分 Sam 食粄條食到大箍！", pinyin: "a+ kiuˋ, ngi voi+ bunˋ Sam shidˋ banˊ tiau shidˋ doˇ tai+ kieuˋ!"}

notes:
  - ref: 0
    topic: culture
    text: >
      In the story, everyone in 竹東 is speaking Hailu, and Mrs Liu with them. The Sixian text gives you what they say in
      your accent; read the Hailu line next to it today, slowly: this is the first lesson where it is the real one.
  - ref: 1
    topic: culture
    text: >
      年初二轉外家 "on the second day of the year, (a married woman) goes back to her own family": an official example
      (年初二轉外家，愛早點出門正好). 外家 from lesson 43. Mrs Liu calls her mother 阿姆 and her brother 阿哥; to her
      children they are 姐婆 "granny (mother's mother)" and 阿舅 "uncle (mother's brother)". 姐公 is mother's father.
  - ref: 6
    topic: culture
    text: >
      恁仔細 is the Sixian "thank you", 承蒙你 siinˇ mungˇ nˇ the Hailu one, as lesson 1 already showed in the Hailu
      lines. Speakers know both; 承蒙 is also used in Sixian in a formal register (承蒙大家个愛惜 "thanks to everyone's
      kindness"). 姐婆's remark is marked for a check.
  - ref: 8
    topic: culture
    text: >
      An official example says nearly the same: 厥家族全部戴新竹，講海陸話 "his whole family lives in 新竹 and speaks Hailu".
      Another explains the name: 惠州府來到臺灣个客家人，大體係海豐縣、陸豐縣較多，一般係講海陸腔 "the Hakka who came to
      Taiwan from 惠州 were mostly from 海豐 and 陸豐 counties, and generally speak the Hailu accent". 四縣 Sixian means
      "four counties". 歇 hed "live" (lesson 22).
  - ref: 9
    topic: grammar
    text: >
      好比 "for example". 佢兜毋係恁樣講 "they don't say it like that": 竹東 says 韶早 shau zoˊ, a word Sixian doesn't
      have, so it appears only in the Hailu line. 共樣係客話 "it's the same Hakka": 共樣 (lesson 15) before the verb, "equally, just as much".
      The differences you have met in the Hailu lines so far: 韶早 / 天光日 "tomorrow", 承蒙 / 恁仔細 "thanks", 摎 / 同
      "with", 落水 / 落雨 "rain", 个 gaiˇ / ge, and a different set of tones throughout.
  - ref: 10
    topic: vocab
    text: >
      欠人 "be short of people": 欠 kiam "lack, owe". 粄條 "flat rice noodles", 竹東's speciality and 阿舅's trade;
      工廠 gungˊ congˋ "factory". 過年過後 "after the New Year" is marked for a check (no example has it).
  - ref: 12
    topic: grammar
    text: >
      有食有歇 "with food and a bed": 有 X 有 Y lists what comes with the job (no example has this pair: checked line). 工錢 "wages, pay". 學 (lesson 26) "learn".

