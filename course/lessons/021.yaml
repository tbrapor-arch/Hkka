exercises:
  translate:
    - en: "Have you ever made 客家小炒? — Never."
      sx: {hanzi: "你識煮過客家小炒無？——毋識。", pinyin: "nˇ siidˋ zuˋ go hagˋ gaˊ seuˋ cauˋ moˇ? — mˇ siidˋ."}
      hl: {hanzi: "你識煮過客家小炒無？——毋識。", pinyin: "ngi shid zhuˊ goˇ hag gaˋ shauˊ cauˊ mo? — m shid."}
    - en: "This coat is thicker than that one."
      sx: {hanzi: "這領襖婆比該領較厚。", pinyin: "iaˋ liangˊ oˋ poˇ biˋ ge liangˊ ka heu."}
      hl: {hanzi: "這領襖婆比該領較厚。", pinyin: "liaˊ liangˋ oˊ po biˊ gai liangˋ haˇ heu+."}
    - en: "Wash the vegetables first, then fry them."
      sx: {hanzi: "先同菜洗好，正炒。", pinyin: "xienˊ tungˇ coi seˋ hoˋ, zang cauˋ."}
      hl: {hanzi: "先摎菜洗好，正炒。", pinyin: "senˋ lauˋ coiˇ seˊ hoˊ, zhangˇ cauˊ."}
    - en: "On Saturday do you want to go out, or stay home and rest?"
      sx: {hanzi: "禮拜六你愛出去尞，還係在屋下歇睏？", pinyin: "liˊ bai liugˋ nˇ oi cudˋ hi liau, hanˇ he coiˊ vugˋ kaˊ hiedˋ kun?"}
      hl: {hanzi: "禮拜六你愛出去尞，抑係在屋下歇睏？", pinyin: "liˋ baiˇ liug ngi oiˇ chud hiˇ liau+, rha+ heˇ coiˋ vug haˋ hied kunˇ?"}
    - en: "A-in won't be back until Friday."
      sx: {hanzi: "阿英禮拜五正會轉來。", pinyin: "aˊ inˊ liˊ bai ngˋ zang voi zonˋ loiˇ."}
      hl: {hanzi: "阿英禮拜五正會轉來。", pinyin: "a+ rhinˋ liˋ baiˇ ngˊ zhangˇ voi+ zhonˊ loi."}
  fill:
    - en: "When I was young…"
      sx: {hanzi: "𠊎後生个___……", pinyin: "ngaiˇ heu sangˊ ge ___ …", answer_hanzi: "時節", answer: "siiˇ jiedˋ"}
      hl: {hanzi: "𠊎後生个___……", pinyin: "ngai heu+ sangˋ gaiˇ ___ …", answer_hanzi: "時節", answer: "shi zied"}
    - en: "I've never sold tea."
      sx: {hanzi: "𠊎無賣___茶。", pinyin: "ngaiˇ moˇ mai ___ caˇ.", answer_hanzi: "過", answer: "go"}
      hl: {hanzi: "𠊎無賣___茶。", pinyin: "ngai mo mai+ ___ ca.", answer_hanzi: "過", answer: "goˇ"}
    - en: "Your coat is the same as mine."
      sx: {hanzi: "你个襖婆同𠊎个___。", pinyin: "nˇ ge oˋ poˇ tungˇ ngaiˇ ge ___.", answer_hanzi: "共樣", answer: "kiung iong"}
      hl: {hanzi: "你个襖婆摎𠊎个___。", pinyin: "ngi gaiˇ oˊ po lauˋ ngai gaiˇ ___.", answer_hanzi: "共樣", answer: "kiung+ rhong+"}

