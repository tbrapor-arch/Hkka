exercises:
  translate:
    - en: "Yesterday was Mum's birthday; we all bought her a watch together."
      sx: {hanzi: "昨晡日阿姆做生日，大家共下買一隻時錶仔送分佢。", pinyin: "coˊ buˊ ngidˋ aˊ meˊ zo sangˊ ngidˋ, tai gaˊ kiung ha maiˊ idˋ zagˋ siiˇ beuˋ eˋ sung bunˊ giˇ."}
      hl: {hanzi: "昨晡日阿姆做生日，大家共下買一隻時錶送分佢。", pinyin: "coˋ buˋ ngid a+ meˋ zoˇ sangˋ ngid, tai+ gaˋ kiung+ ha+ maiˋ rhid zhag shi biauˊ sungˇ bunˋ gi."}
    - en: "Lend me your book."
      sx: {hanzi: "若書借分𠊎。", pinyin: "ngiaˊ suˊ jia bunˊ ngaiˇ."}
      hl: {hanzi: "若个書借分𠊎。", pinyin: "ngia gaiˇ shuˋ ziaˇ bunˋ ngai."}
    - en: "When is your birthday?"
      sx: {hanzi: "你个生日係幾時？", pinyin: "nˇ ge sangˊ ngidˋ he giˋ siiˇ?"}
      hl: {hanzi: "你个生日係幾時？", pinyin: "ngi gaiˇ sangˋ ngid heˇ giˊ shi?"}
    - en: "Grandpa is getting on in years: seventy-eight, with two grandchildren."
      sx: {hanzi: "阿公歲數大了：七十八歲，有兩隻孫仔。", pinyin: "aˊ gungˊ se sii tai leˊ: qidˋ siib badˋ se, iuˊ liongˋ zagˋ sunˊ eˋ."}
      hl: {hanzi: "阿公歲數大了：七十八歲，有兩隻孫仔。", pinyin: "a+ gungˋ soiˇ siiˇ tai+ leˋ: cid shibˋ bad soiˇ, rhiuˋ liongˊ zhag sunˋ er."}
    - en: "Last week I borrowed money from A-min."
