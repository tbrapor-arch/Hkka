      hl: {hanzi: "上禮拜𠊎摎阿明借錢。", pinyin: "shong+ liˋ baiˇ ngai lauˋ a+ min ziaˇ cien."}
    - en: "A birthday comes only once a year; everyone claps and sings."
      sx: {hanzi: "生日一年正一擺，大家拍手唱歌。", pinyin: "sangˊ ngidˋ idˋ ngienˇ zang idˋ baiˋ, tai gaˊ pogˋ suˋ cong goˊ."}
      hl: {hanzi: "生日一年正一擺，大家拍手唱歌。", pinyin: "sangˋ ngid rhid ngien zhangˇ rhid baiˊ, tai+ gaˋ pog shiuˊ chongˇ goˋ."}
    - en: "Last year A-in was still a child; now she's twenty-six!"
      sx: {hanzi: "舊年阿英還係細人仔，這下二十六歲了！", pinyin: "kiu ngienˇ aˊ inˊ hanˇ he se nginˇ eˋ, iaˋ ha ngi siib liugˋ se leˊ!"}
      hl: {hanzi: "舊年阿英還係細人仔，這下二十六歲了！", pinyin: "kiu+ ngien a+ rhinˋ han heˇ seˇ ngin er, liaˊ ha+ ngi+ shibˋ liug soiˇ leˋ!"}
