exercises:
  translate:
    - en: "Since he graduated, he's kept in touch with his classmates less and less."
      sx: {hanzi: "自從畢業以後，佢同同學緊來緊少聯絡。", pinyin: "cii qiungˇ bidˋ ngiab iˊ heu, giˇ tungˇ tungˇ hog ginˋ loiˇ ginˋ seuˋ lienˇ log."}
      hl: {hanzi: "自從畢業以後，佢摎同學緊來緊少聯絡。", pinyin: "cii+ ciung bid ngiabˋ rhiˋ heu+, gi lauˋ tung hogˋ ginˊ loi ginˊ shauˊ lien logˋ."}
      check: true
    - en: "A-min was so lovable when he was small."
      sx: {hanzi: "阿明細時節當得人惜。", pinyin: "aˊ minˇ se siiˇ jiedˋ dongˊ dedˋ nginˇ xiagˋ."}
      hl: {hanzi: "阿明細時節當得人惜。", pinyin: "a+ min seˇ shi zied dongˋ ded ngin siag."}
    - en: "The trip went off without a hitch: at last he's arrived."
      sx: {hanzi: "這擺出門當順利，總算到了。", pinyin: "iaˋ baiˋ cudˋ munˇ dongˊ sun li, zungˋ son do leˊ."}
      hl: {hanzi: "這擺出門當順利，總算到了。", pinyin: "liaˊ baiˊ chud mun dongˋ shun+ li+, zungˊ sonˇ doˇ leˋ."}
