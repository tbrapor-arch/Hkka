exercises:
  translate:
    - en: "First register, then see the doctor."
      sx: {hanzi: "先掛號，正看先生。", pinyin: "xienˊ gua ho, zang kon xinˊ sangˊ."}
      hl: {hanzi: "先掛號，正看先生。", pinyin: "senˋ guaˇ ho+, zhangˇ konˇ sinˋ sangˋ."}
    - en: "There are lots of patients at the clinic today."
      sx: {hanzi: "今晡日診所个病人當多。", pinyin: "gimˊ buˊ ngidˋ ziinˊ soˋ ge piang nginˇ dongˊ doˊ."}
      hl: {hanzi: "今晡日診所个病人當多。", pinyin: "gimˋ buˋ ngid zhinˊ soˊ gaiˇ piang+ ngin dongˋ doˋ."}
    - en: "Stick out your tongue; I'll take your temperature."
      sx: {hanzi: "舌嫲伸出來，𠊎同你量燒。", pinyin: "sad maˇ cunˊ cudˋ loiˇ, ngaiˇ tungˇ nˇ liongˇ seuˊ."}
      hl: {hanzi: "舌嫲伸出來，𠊎摎你量燒。", pinyin: "shadˋ ma chunˋ chud loi, ngai lauˋ ngi liong shauˋ."}
      check: true
    - en: "You have no energy today. Did you sleep?"
      sx: {hanzi: "你今晡日恁無精神。有睡目無？", pinyin: "nˇ gimˊ buˊ ngidˋ anˋ moˇ jinˊ siinˇ. iuˊ soi mugˋ moˇ?"}
      hl: {hanzi: "你今晡日恁無精神。有睡目無？", pinyin: "ngi gimˋ buˋ ngid anˊ mo zinˋ shin. rhiuˋ shoi+ mug mo?"}
    - en: "I'd like to go out, but it's too cold."
      sx: {hanzi: "𠊎想愛出去，毋過忒寒了。", pinyin: "ngaiˇ xiongˋ oi cudˋ hi, mˇ go tedˋ honˇ leˊ."}
      hl: {hanzi: "𠊎想愛出去，毋過忒冷了。", pinyin: "ngai siongˊ oiˇ chud hiˇ, m goˇ ted langˋ leˋ."}
  fill:
    - en: "Does it hurt?"
      sx: {hanzi: "會___無？", pinyin: "voi ___ moˇ?", answer_hanzi: "痛", answer: "tung"}
      hl: {hanzi: "會___無？", pinyin: "voi+ ___ mo?", answer_hanzi: "痛", answer: "tungˇ"}
    - en: "He's better (than before)."
      sx: {hanzi: "佢___較好了。", pinyin: "giˇ ___ ka hoˋ leˊ.", answer_hanzi: "有", answer: "iuˊ"}
      hl: {hanzi: "佢___較好了。", pinyin: "gi ___ haˇ hoˊ leˋ.", answer_hanzi: "有", answer: "rhiuˋ"}
    - en: "You need a good rest."
      sx: {hanzi: "你愛好好___。", pinyin: "nˇ oi hoˋ hoˋ ___.", answer_hanzi: "歇睏", answer: "hiedˋ kun"}
      hl: {hanzi: "你愛好好___。", pinyin: "ngi oiˇ hoˊ hoˊ ___.", answer_hanzi: "歇睏", answer: "hied kunˇ"}

