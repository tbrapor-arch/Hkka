exercises:
  translate:
    - en: "Since going abroad he can't get used to the food there, and often misses the taste of home."
      sx: {hanzi: "出國以後，佢食毋慣該片个東西，輒輒想念起屋下个家鄉味。", pinyin: "cudˋ guedˋ iˊ heu, giˇ siid mˇ guan ge pienˋ ge dungˊ xiˊ, jiab jiab xiongˋ ngiam hiˋ vugˋ kaˊ ge gaˊ hiongˊ mi."}
      hl: {hanzi: "出國以後，佢食毋慣該片个東西，輒輒想念起屋下个家鄉味。", pinyin: "chud gued rhiˋ heu+, gi shidˋ m guanˇ gai pienˊ gaiˇ dungˋ siˋ, ziabˋ ziabˋ siongˊ ngiam+ hiˊ vug haˋ gaiˇ gaˋ hiongˋ mui+."}
      source: kaga115
    - en: "Have you received my letter? Write back to me."
      sx: {hanzi: "𠊎个信你收到吂？愛回信分𠊎。", pinyin: "ngaiˇ ge xin nˇ suˊ do mangˇ? oi fiˇ xin bunˊ ngaiˇ."}
      hl: {hanzi: "𠊎个信你收到吂？愛回信分𠊎。", pinyin: "ngai gaiˇ sinˇ ngi shiuˋ doˇ mang? oiˇ fui sinˇ bunˋ ngai."}
    - en: "Grandma worries about Sam: how has he been lately?"
      sx: {hanzi: "阿婆當掛心 Sam：佢近來个情形仰般？", pinyin: "aˊ poˇ dongˊ gua ximˊ Sam: giˇ kiun loiˇ ge qinˇ hinˇ ngiongˋ banˊ?"}
      hl: {hanzi: "阿婆當掛心 Sam：佢近來个情形仰般？", pinyin: "a+ po dongˋ guaˇ simˋ Sam: gi kiun+ loi gaiˇ cin hin ngiongˊ banˋ?"}
    - en: "Write it with a pen; if you get a character wrong, correct it."
      sx: {hanzi: "用筆寫，字寫毋著就改。", pinyin: "iung bidˋ xiaˋ, sii xiaˋ mˇ cog qiu goiˋ."}
      hl: {hanzi: "用筆寫，字寫毋著就改。", pinyin: "rhung+ bid siaˊ, sii+ siaˊ m chogˋ ciu+ goiˊ."}
      check: true
    - en: "He works to earn money so that his parents can live well."
      sx: {hanzi: "佢做事賺錢，係為著分爺哀過好日仔。", pinyin: "giˇ zo se con qienˇ, he vi doˋ bunˊ iaˇ oiˊ go hoˋ ngidˋ eˋ."}
      hl: {hanzi: "佢做事賺錢，係為著分爺哀過好日仔。", pinyin: "gi zoˇ she+ con+ cien, heˇ vui+ doˊ bunˋ rha oiˋ goˇ hoˊ ngid er."}
      check: true
  fill:
    - en: "Wishing you good health."
      sx: {hanzi: "祝你身體___。", pinyin: "zugˋ nˇ siinˊ tiˋ ___.", answer_hanzi: "健康", answer: "kien kongˊ"}
      hl: {hanzi: "祝你身體___。", pinyin: "zhug ngi shinˋ tiˊ ___.", answer_hanzi: "健康", answer: "kien+ kongˋ"}
    - en: "I'm afraid I can't get the words out."
      sx: {hanzi: "𠊎驚講毋___。", pinyin: "ngaiˇ giangˊ gongˋ mˇ ___.", answer_hanzi: "出來", answer: "cudˋ loiˇ"}
      hl: {hanzi: "𠊎驚講毋___。", pinyin: "ngai giangˋ gongˊ m ___.", answer_hanzi: "出來", answer: "chud loi"}
    - en: "I miss Miaoli."
      sx: {hanzi: "𠊎當___苗栗。", pinyin: "ngaiˇ dongˊ ___ meuˇ lidˋ.", answer_hanzi: "想念", answer: "xiongˋ ngiam"}
      hl: {hanzi: "𠊎當___苗栗。", pinyin: "ngai dongˋ ___ miau lidˋ.", answer_hanzi: "想念", answer: "siongˊ ngiam+"}

