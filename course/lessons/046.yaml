exercises:
  translate:
    - en: "Miss, which of these clothes are cheaper?"
      sx: {hanzi: "細阿姊仔，哪兜衫較便宜？", pinyin: "se aˊ jiˋ eˇ, nai deuˊ samˊ ka pienˇ ngiˇ?"}
      hl: {hanzi: "細阿姊仔，哪兜衫較便宜？", pinyin: "seˇ a+ ze er, nai+ deuˋ samˋ haˇ pien ngi?"}
    - en: "Shopping by credit card is very convenient."
      sx: {hanzi: "買東西用信用卡，當方便。", pinyin: "maiˊ dungˊ xiˊ iung xin iung kaˋ, dongˊ fongˊ pien."}
      hl: {hanzi: "買東西用信用卡，當方便。", pinyin: "maiˋ dungˋ siˋ rhung+ sinˇ rhung+ kaˊ, dongˋ fongˋ pien+."}
    - en: "What size are you? This make runs small."
      sx: {hanzi: "你个尺寸幾多？這隻牌仔較細。", pinyin: "nˇ ge cagˋ cun giˋ doˊ? iaˋ zagˋ paiˇ eˋ ka se."}
      hl: {hanzi: "你个尺寸幾多？這隻牌仔較細。", pinyin: "ngi gaiˇ chag cunˇ giˊ doˋ? liaˊ zhag pai er haˇ seˇ."}
      check: true
    - en: "This jacket fits well; those shoes are too big, I'll send them back."
      sx: {hanzi: "這領衫當合身；該雙鞋忒大，𠊎愛退。", pinyin: "iaˋ liangˊ samˊ dongˊ gagˋ siinˊ; ge sungˊ haiˇ tedˋ tai, ngaiˇ oi tui."}
      hl: {hanzi: "這領衫當合身；該雙鞋忒大，𠊎愛退。", pinyin: "liaˊ liangˋ samˋ dongˋ gag shinˋ; gai sungˋ hai ted tai+, ngai oiˇ tuiˇ."}
    - en: "A-min secretly added a pair of shoes."
      sx: {hanzi: "阿明偷偷仔加一雙鞋。", pinyin: "aˊ minˇ teuˊ teuˊ eˋ gaˊ idˋ sungˊ haiˇ."}
      hl: {hanzi: "阿明偷偷加一雙鞋。", pinyin: "a+ min teuˋ teuˋ gaˋ rhid sungˋ hai."}
    - en: "Your card number has sixteen digits."
      sx: {hanzi: "你个卡號碼有十六隻數字。", pinyin: "nˇ ge kaˋ ho maˊ iuˊ siib liugˋ zagˋ su sii."}
      hl: {hanzi: "你个卡號碼有十六隻數字。", pinyin: "ngi gaiˇ kaˊ ho+ maˋ rhiuˋ shibˋ liug zhag suˇ sii+."}
      check: true
    - en: "A-min does his homework on the computer."
      sx: {hanzi: "阿明用電腦做功課。", pinyin: "aˊ minˇ iung tien noˋ zo gungˊ ko."}
      hl: {hanzi: "阿明用電腦做功課。", pinyin: "a+ min rhung+ tien+ noˊ zoˇ gungˋ koˇ."}
