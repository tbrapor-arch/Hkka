id: 46
title:
  en: "Shopping online"
  sx: {hanzi: "撿採忒細……", pinyin: "giamˋ caiˋ tedˋ se …"}
  hl: {hanzi: "撿採忒細……", pinyin: "giamˊ caiˊ ted seˇ …"}
review: false
setting: >-
  Tuesday evening. A-min is supposed to be doing his homework (功課, lesson 26) at the family computer. Sam passes behind him and sees,
  on the screen, a jacket.
names: [阿明]

dialogue:
  - n: 1
    speaker: 阿明
    en: "Sam, look! This jacket is so cool. You have to wear new clothes at New Year."
    sx: {hanzi: "Sam，你看！這領衫當派頭。過年愛著新衫。", pinyin: "Sam, nˇ kon! iaˋ liangˊ samˊ dongˊ pai teuˇ. go ngienˇ oi zogˋ xinˊ samˊ."}
    hl: {hanzi: "Sam，你看！這領衫當派頭。過年愛著新衫。", pinyin: "Sam, ngi konˇ! liaˊ liangˋ samˋ dongˋ paiˇ teu. goˇ ngien oiˇ zhog sinˋ samˋ."}
  - n: 2
    speaker: Sam
    en: "You're buying it online?"
    sx: {hanzi: "你在網路買？", pinyin: "nˇ coiˊ miongˋ lu maiˊ?"}
    hl: {hanzi: "你在網路買？", pinyin: "ngi coiˋ miongˊ lu+ maiˋ?"}
  - n: 3
    speaker: 阿明
    en: "Yes. Shopping online is really convenient, and you don't have to go out."
    sx: {hanzi: "係啊。在網路買東西當方便，又毋使出門。", pinyin: "he a. coiˊ miongˋ lu maiˊ dungˊ xiˊ dongˊ fongˊ pien, iu mˇ siiˋ cudˋ munˇ."}
    hl: {hanzi: "係啊。在網路買東西當方便，又毋使出門。", pinyin: "heˇ a+. coiˋ miongˊ lu+ maiˋ dungˋ siˋ dongˋ fongˋ pien+, rhiu+ m siiˊ chud mun."}
  - n: 4
    speaker: Sam
    en: "How much is it?"
    sx: {hanzi: "價錢幾多？", pinyin: "ga qienˇ giˋ doˊ?"}
    hl: {hanzi: "價錢幾多？", pinyin: "gaˇ cien giˊ doˋ?"}
  - n: 5
    speaker: 阿明
    en: "Eight hundred. …But I haven't got a credit card. Sam, could you lend me yours? I'll pay you back."
    sx: {hanzi: "八百。……毋過𠊎無信用卡。Sam，你个卡做得借𠊎用無？𠊎會還你。", pinyin: "badˋ bagˋ. … mˇ go ngaiˇ moˇ xin iung kaˋ. Sam, nˇ ge kaˋ zo dedˋ jia ngaiˇ iung moˇ? ngaiˇ voi vanˇ nˇ."}
    hl: {hanzi: "八百。……毋過𠊎無信用卡。Sam，你个卡做得借𠊎用無？𠊎會還你。", pinyin: "bad bag. … m goˇ ngai mo sinˇ rhung+ kaˊ. Sam, ngi gaiˇ kaˊ zoˇ ded ziaˇ ngai rhung+ mo? ngai voi+ van ngi."}
  - n: 6
    speaker: Sam
    en: "…All right. Just this once."
    sx: {hanzi: "……好。就這擺。", pinyin: "… hoˋ. qiu iaˋ baiˋ."}
    hl: {hanzi: "……好。就這擺。", pinyin: "… hoˊ. ciu+ liaˊ baiˊ."}
  - n: 7
    speaker: 阿明
    en: "What size do I want? In case it's too small…"
    sx: {hanzi: "這領衫愛麼个尺寸？撿採忒細……", pinyin: "iaˋ liangˊ samˊ oi maˋ ge cagˋ cun? giamˋ caiˋ tedˋ se …"}
    hl: {hanzi: "這領衫愛麼个尺寸？撿採忒細……", pinyin: "liaˊ liangˋ samˋ oiˇ maˊ gaiˇ chag cunˇ? giamˊ caiˊ ted seˇ …"}
  - n: 8
    speaker: Sam
    en: "If it's too small, can you change it?"
    sx: {hanzi: "撿採忒細，做得換無？", pinyin: "giamˋ caiˋ tedˋ se, zo dedˋ von moˇ?"}
    hl: {hanzi: "撿採忒細，做得換無？", pinyin: "giamˊ caiˊ ted seˇ, zoˇ ded von+ mo?"}
  - n: 9
    speaker: 阿明
    en: "Yes. The website says you can change it within seven days."
    sx: {hanzi: "做得。網站講，七日內做得換。", pinyin: "zo dedˋ. miongˋ zam gongˋ, qidˋ ngidˋ nui zo dedˋ von."}
    hl: {hanzi: "做得。網站講，七日內做得換。", pinyin: "zoˇ ded. miongˊ zhamˇ gongˊ, cid ngid nui+ zoˇ ded von+."}
  - n: 10
    speaker: Sam
    en: "Where does it get sent to?"
    sx: {hanzi: "寄到哪位？", pinyin: "gi do nai vi?"}
    hl: {hanzi: "寄到哪位？", pinyin: "giˇ doˇ nai+ vui+?"}
  - n: 11
    speaker: 阿明
    en: "Here, home. We'll get it on Friday."
    sx: {hanzi: "寄到屋下。禮拜五就會收著。", pinyin: "gi do vugˋ kaˊ. liˊ bai ngˋ qiu voi suˊ doˋ."}
    hl: {hanzi: "寄到屋下。禮拜五就會收著。", pinyin: "giˇ doˇ vug haˋ. liˋ baiˇ ngˊ ciu+ voi+ shiuˋ doˊ."}
  - n: 12
    speaker: Sam
    en: "(typing in the card number, then going upstairs) Right. The jacket only, OK?"
    sx: {hanzi: "好吔。淨衫定定，好無？", pinyin: "hoˋ leˊ. qiang samˊ tin tin, hoˋ moˇ?"}
    hl: {hanzi: "好咧。淨衫定定，好無？", pinyin: "hoˊ leˋ. ciang+ samˋ tin+ tin+, hoˊ mo?"}
  - n: 13
    speaker: 阿明
    en: "(alone, muttering) These shoes are cool too… I'll quietly add a pair. Nobody'll know."
    sx: {hanzi: "這雙鞋乜當派頭……偷偷仔加一雙。無人會知。", pinyin: "iaˋ sungˊ haiˇ me dongˊ pai teuˇ … teuˊ teuˊ eˋ gaˊ idˋ sungˊ. moˇ nginˇ voi diˊ."}
    hl: {hanzi: "這雙鞋乜當派頭……偷偷加一雙。無人會知。", pinyin: "liaˊ sungˋ hai meˇ dongˋ paiˇ teu … teuˋ teuˋ gaˋ rhid sungˋ. mo ngin voi+ diˋ."}
  - n: 14
    speaker: 阿婆
    en: "(from the kitchen) A-min, what are you doing over there?"
    sx: {hanzi: "阿明，你在該做麼个？", pinyin: "aˊ minˇ, nˇ du ge zo maˋ ge?"}
    hl: {hanzi: "阿明，你在該做麼个？", pinyin: "a+ min, ngi diˇ gai zoˇ maˊ gaiˇ?"}
  - n: 15
    speaker: 阿明
    en: "Nothing! Doing my homework!"
    sx: {hanzi: "無！在該做功課！", pinyin: "moˇ! du ge zo gungˊ ko!"}
    hl: {hanzi: "無！在該做功課！", pinyin: "mo! diˇ gai zoˇ gungˋ koˇ!"}

notes:
  - ref: 1
    topic: culture
    text: >
      過年愛著新衫 "at New Year you must wear new clothes": new clothes, new shoes and a haircut before the Lunar New Year
      are a custom children hold their parents to. 新衫 "new clothes".
  - ref: 2
    topic: vocab
    text: >
      New things get new words, mostly read from the Mandarin characters in Hakka: 網路 miongˋ lu "the internet",
      網站 "website", 電腦 tien noˋ "computer", 信用卡 "credit card", 號碼 "number". 在網路買東西 "shop online" (line 3) is an
      official sentence: 在網路 "on the internet", with 在, not 項.
  - ref: 4
    topic: vocab
    text: >
      價錢 "price" (lesson 25): 價錢幾多？ "how much is it?", a little more formal than 幾多錢 (lesson 5).
  - ref: 7
    topic: grammar
    text: >
      撿採 giamˋ caiˋ "in case, if by any chance": 撿採忒細 "in case it's too small". Like 若係 and 係講 (lesson 43), it
      opens a condition, but it expects the worst. Official example: 撿採阿松無來，還有阿森做得𢯭手 "in case A-song doesn't
      come, there's still A-sen to help". 尺寸 cagˋ cun "size": 這領衫係麼个尺寸？ "what size is this?" is an
      official sentence.
  - ref: 9
    topic: grammar
    text: >
      七日內 "within seven days": 內 nui "within", as in the official 三日內. (肚 "inside" is for places: 間房肚, lesson
      25.) 換 von "exchange, change"; 退 "send back, return".
  - ref: 11
    topic: grammar
    text: >
      收著 suˊ doˋ "receive, get (something sent)": 收 "receive" + 著 "and get it". Official example: 寄信仔以前寫好郵遞區號，
      收信人會較遽收著信仔 "write the postcode, and the addressee will receive the letter sooner".
  - ref: 12
    topic: grammar
    text: >
      淨衫定定 "only the jacket": 淨 qiang "only, nothing but" before the thing, and 定定 (lesson 26) at the end for good
      measure. Sam is being careful. A-min is not.

