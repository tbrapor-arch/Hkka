id: 15
title:
  en: "Buying a coat"
  sx: {hanzi: "這領比該領較靚", pinyin: "iaˋ liangˊ biˋ ge liangˊ ka jiangˊ"}
  hl: {hanzi: "這領比該領較靚", pinyin: "liaˊ liangˋ biˊ gai liangˋ haˇ ziangˋ"}
review: false
setting: >-
  Monday morning, the first cold front of the winter. Sam comes down to breakfast in a T-shirt. Mrs Liu looks at him
  and puts down her bowl.
names: [阿明]

dialogue:
  - n: 1
    speaker: 阿姆
    en: "Dressed like that, aren't you cold?"
    zh: "穿這麼少，會冷嗎？"
    source: sentence
    sx: {hanzi: "著恁少，會寒無？", pinyin: "zogˋ anˋ seuˋ, voi honˇ moˇ?"}
    hl: {hanzi: "著恁少，會冷無？", pinyin: "zhog anˊ shauˊ, voi+ langˋ mo?"}
  - n: 2
    speaker: Sam
    en: "I am, very… My clothes are thin."
    sx: {hanzi: "會，當寒……𠊎个衫當薄。", pinyin: "voi, dongˊ honˇ … ngaiˇ ge samˊ dongˊ pog."}
    hl: {hanzi: "會，當冷……𠊎个衫當薄。", pinyin: "voi+, dongˋ langˋ … ngai gaiˇ samˋ dongˋ pogˋ."}
  - n: 3
    speaker: 阿姆
    en: "Come on, we're going to buy you a padded coat."
    sx: {hanzi: "來，𫣆兜去買一領襖婆。", pinyin: "loiˇ, enˊ deuˊ hi maiˊ idˋ liangˊ oˋ poˇ."}
    hl: {hanzi: "來，𫣆兜去買一領襖婆。", pinyin: "loi, enˋ deuˋ hiˇ maiˋ rhid liangˋ oˊ po."}
  - n: 4
    speaker: Sam
    en: "A coat… grandma?"
    sx: {hanzi: "襖……婆？", pinyin: "oˋ … poˇ?"}
    hl: {hanzi: "襖……婆？", pinyin: "oˊ … po?"}
  - n: 5
    speaker: 阿姆
    en: "(laughing) A 襖婆 is a thick coat, not a grandma!"
    sx: {hanzi: "襖婆就係厚个衫，毋係阿婆！", pinyin: "oˋ poˇ qiu he heu ge samˊ, mˇ he aˊ poˇ!"}
    hl: {hanzi: "襖婆就係厚个衫，毋係阿婆！", pinyin: "oˊ po ciu+ heˇ heu+ gaiˇ samˋ, m heˇ a+ po!"}
  - n: 6
    speaker: Sam
    en: "(in a shop in town, holding up two coats) This one's nicer than that one, isn't it?"
    sx: {hanzi: "伯姆，這領比該領較靚，係無？", pinyin: "bagˋ meˊ, iaˋ liangˊ biˋ ge liangˊ ka jiangˊ, he moˇ?"}
    hl: {hanzi: "伯姆，這領比該領較靚，係無？", pinyin: "bag meˊ, liaˊ liangˋ biˊ gai liangˋ haˇ ziangˋ, heˇ mo?"}
  - n: 7
    speaker: 阿姆
    en: "Nicer. And dearer."
    sx: {hanzi: "較靚，乜較貴。", pinyin: "ka jiangˊ, me ka gui."}
    hl: {hanzi: "較靚，乜較貴。", pinyin: "haˇ ziangˋ, meˇ haˇ guiˇ."}
  - n: 8
    speaker: 頭家娘
    en: "Not dear at all! They're the same: twelve hundred."
    sx: {hanzi: "毋會貴，毋會貴！兩領共樣，一千二。", pinyin: "mˇ voi gui, mˇ voi gui! liongˋ liangˊ kiung iong, idˋ qienˊ ngi."}
    hl: {hanzi: "毋會貴，毋會貴！兩領共樣，一千二。", pinyin: "m voi+ guiˇ, m voi+ guiˇ! liongˊ liangˋ kiung+ rhong+, rhid cienˋ ngi+."}
  - n: 9
    speaker: Sam
    en: "(trying it on) How's that?"
    sx: {hanzi: "仰般？", pinyin: "ngiongˋ banˊ?"}
    hl: {hanzi: "仰般？", pinyin: "ngiongˊ banˋ?"}
  - n: 10
    speaker: 阿姆
    en: "Very nice… exactly like A-min's!"
    sx: {hanzi: "當靚……同阿明个共樣！", pinyin: "dongˊ jiangˊ … tungˇ aˊ minˇ ge kiung iong!"}
    hl: {hanzi: "當靚……摎阿明个共樣！", pinyin: "dongˋ ziangˋ … lauˋ a+ min gaiˇ kiung+ rhong+!"}
  - n: 11
    speaker: Sam
    en: "…I'll take the other one."
    sx: {hanzi: "……𠊎買該領。", pinyin: "… ngaiˇ maiˊ ge liangˊ."}
    hl: {hanzi: "……𠊎買該領。", pinyin: "… ngai maiˋ gai liangˋ."}

notes:
  - ref: 1
    topic: false-friend
    text: >
      著 zogˋ is "wear, put on" (穿): 著恁少 "wearing so little". It is the 著 of lesson 10 (cog "right") written the
      same and said differently. 寒 honˇ (lesson 9) is the usual word for feeling cold; 冷 is also heard, and is the word
      for cold things. This line is an official example sentence, word for word; it is what every Hakka mother says
      in December.
  - ref: 2
    topic: grammar
    text: >
      Answer a 會…無？ question with 會 "yes, I am" or 毋會 "no". 薄 pog "thin" (of cloth, paper), with its opposite
      厚 heu "thick", line 5.
  - ref: 3
    topic: grammar
    text: >
      領 liangˊ is the classifier for clothes (Mandarin 件): 一領衫, 一領襖婆. And for blankets and mats. 襖婆 oˋ poˇ
      "padded coat, winter coat".
  - ref: 3
    topic: grammar
    text: >
      𫣆兜 enˊ deuˊ "we, you and I": Mrs Liu is taking Sam, so the "we" includes the person spoken to. Compare lesson 10:
      𠊎兜 is "we, not you". 𫣆 is written with its own character; 𫣆兩儕 "the two of us".
  - ref: 5
    topic: vocab
    text: >
      Hakka words often end in 公, 婆, 牯, 嫲 that have lost any sense of man or woman: 襖婆 is a coat, 蝦公 a shrimp,
      刀嫲 a knife. Sam will meet more and will stop asking.
  - ref: 6
    topic: grammar
    text: >
      Comparing: X 比 Y 較 + adjective. 這領比該領較靚 "this one is nicer than that one". Mandarin can say 比較漂亮 or
      just 漂亮 after 比; Hakka usually puts 較 ka in. Without 比, 較 alone is "more": 較靚 "nicer", 較貴 "dearer".
      係無？ at the end asks for agreement: "isn't it?". 靚 jiangˊ "pretty, nice-looking", the everyday Hakka word, as
      in Cantonese.
  - ref: 8
    topic: grammar
    text: >
      毋會貴 "not dear (at all)": an adjective is negated with 毋會 or 無, not bare 毋: 毋會辣, 毋會寒, 無甜.
  - ref: 8
    topic: grammar
    text: >
      共樣 kiung iong "the same" (一樣), and its opposite 無共樣. "The same as X" is 同 X 共樣 (line 10). 一千二 "twelve
      hundred": as in Mandarin, the last unit can be dropped. 頭家娘 teuˇ gaˊ ngiongˇ is the woman who runs the shop.
  - ref: 9
    topic: vocab
    text: >
      仰般 ngiongˋ banˊ "how, what like" (怎麼樣): 仰般？ "how's that? how do I look?", 公館仰般？ "how was 公館?".
      With a verb, it asks the way to do something: 火車頭仰般去？ "how do I get to the station?" (lesson 17). Its
      cousin 仰會 (lesson 9) is "how come".
  - ref: 0
    topic: hailu
    text: >
      Hailu says 冷 where Sixian says 寒: 會冷無？ The comparison is the same (比…較…), with 較 haˇ. 摎 again for 同.

