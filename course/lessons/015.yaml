exercises:
  translate:
    - en: "Mandarins are cheaper than chillies."
      sx: {hanzi: "柑仔比辣椒仔較便宜。", pinyin: "gamˊ eˋ biˋ lad zeuˊ eˋ ka pienˇ ngiˇ."}
      hl: {hanzi: "柑仔比辣椒仔較便宜。", pinyin: "gamˋ er biˊ ladˋ ziauˋ er haˇ pien ngi."}
    - en: "Today is colder than yesterday."
      sx: {hanzi: "今晡日比昨晡日較寒。", pinyin: "gimˊ buˊ ngidˋ biˋ coˊ buˊ ngidˋ ka honˇ."}
      hl: {hanzi: "今晡日比昨晡日較冷。", pinyin: "gimˋ buˋ ngid biˊ coˋ buˋ ngid haˇ langˋ."}
    - en: "These two coats aren't the same."
      sx: {hanzi: "這兩領襖婆無共樣。", pinyin: "iaˋ liongˋ liangˊ oˋ poˇ moˇ kiung iong."}
      hl: {hanzi: "這兩領襖婆無共樣。", pinyin: "liaˊ liongˊ liangˋ oˊ po mo kiung+ rhong+."}
    - en: "A lot of people buy this one."
      sx: {hanzi: "這領當多人買。", pinyin: "iaˋ liangˊ dongˊ doˊ nginˇ maiˊ."}
      hl: {hanzi: "這領當多人買。", pinyin: "liaˊ liangˋ dongˋ doˋ ngin maiˋ."}
    - en: "Grandma is wearing a thick coat."
      sx: {hanzi: "阿婆著一領厚个襖婆。", pinyin: "aˊ poˇ zogˋ idˋ liangˊ heu ge oˋ poˇ."}
      hl: {hanzi: "阿婆著一領厚个襖婆。", pinyin: "a+ po zhog rhid liangˋ heu+ gaiˇ oˊ po."}
  fill:
    - en: "This one is nicer than that one."
      sx: {hanzi: "這領___該領較靚。", pinyin: "iaˋ liangˊ ___ ge liangˊ ka jiangˊ.", answer_hanzi: "比", answer: "biˋ"}
      hl: {hanzi: "這領___該領較靚。", pinyin: "liaˊ liangˋ ___ gai liangˋ haˇ ziangˋ.", answer_hanzi: "比", answer: "biˊ"}
    - en: "Wearing so little!"
      sx: {hanzi: "___恁少！", pinyin: "___ anˋ seuˋ!", answer_hanzi: "著", answer: "zogˋ"}
      hl: {hanzi: "___恁少！", pinyin: "___ anˊ shauˊ!", answer_hanzi: "著", answer: "zhog"}
    - en: "Your coat is the same as mine."
      sx: {hanzi: "若襖婆同𠊎个___。", pinyin: "ngiaˊ oˋ poˇ tungˇ ngaiˇ ge ___.", answer_hanzi: "共樣", answer: "kiung iong"}
      hl: {hanzi: "若个襖婆摎𠊎个___。", pinyin: "ngia gaiˇ oˊ po lauˋ ngai gaiˇ ___.", answer_hanzi: "共樣", answer: "kiung+ rhong+"}

