exercises:
  translate:
    - en: "A-min drove? — No, Dad drove; he gave us a lift home."
      sx: {hanzi: "阿明開車？——毋係，阿爸開車，載𠊎兜轉屋下。", pinyin: "aˊ minˇ koiˊ caˊ? — mˇ he, aˊ baˊ koiˊ caˊ, zai ngaiˇ deuˊ zonˋ vugˋ kaˊ."}
      hl: {hanzi: "阿明開車？——毋係，阿爸開車，載𠊎兜轉屋下。", pinyin: "a+ min koiˋ chaˋ? — m heˇ, a+ baˋ koiˋ chaˋ, zaiˇ ngai deuˋ zhonˊ vug haˋ."}
    - en: "People in the south and in the north speak differently; sometimes I can't catch it."
      sx: {hanzi: "南部人同北部人講話無共樣，有時節𠊎聽無。", pinyin: "namˇ pu nginˇ tungˇ bedˋ pu nginˇ gongˋ fa moˇ kiung iong, iuˊ siiˇ jiedˋ ngaiˇ tangˊ moˇ."}
      hl: {hanzi: "南部人摎北部人講話無共樣，有時節𠊎聽無。", pinyin: "nam pu+ ngin lauˋ bed pu+ ngin gongˊ faˇ mo kiung+ rhong+, rhiuˋ shi zied ngai tangˇ mo."}
    - en: "Grandma's 菜脯 has been drying in the sun for three days."
      sx: {hanzi: "阿婆个菜脯晒三日了。", pinyin: "aˊ poˇ ge coi puˋ sai samˊ ngidˋ leˊ."}
      hl: {hanzi: "阿婆个菜脯晒三日了。", pinyin: "a+ po gaiˇ coiˇ buˊ saiˇ samˋ ngid leˋ."}
    - en: "阿蘭嫂's 菜脯 has dried a lovely yellow in the sun."
      sx: {hanzi: "阿蘭嫂个菜脯晒到黃黃。", pinyin: "aˊ lanˇ soˋ ge coi puˋ sai do vongˇ vongˇ."}
      hl: {hanzi: "阿蘭嫂个菜脯晒到黃黃。", pinyin: "a+ lan soˊ gaiˇ coiˇ buˊ saiˇ doˇ vong vong."}
    - en: "竹東 is a lively place."
      sx: {hanzi: "竹東係當鬧熱个位所。", pinyin: "zugˋ dungˊ he dongˊ nau ngied ge vi soˋ."}
      hl: {hanzi: "竹東係當鬧熱个位所。", pinyin: "zhug dungˋ heˇ dongˋ nau+ ngiedˋ gaiˇ vui+ soˊ."}
    - en: "Is this all your luggage? It's very heavy!"
      sx: {hanzi: "你个行李就係這兜？當重！", pinyin: "nˇ ge hangˇ liˋ qiu he iaˋ deuˊ? dongˊ cungˊ!"}
      hl: {hanzi: "你个行李就係這兜？當重！", pinyin: "ngi gaiˇ hang liˊ ciu+ heˇ liaˊ deuˋ? dongˋ chungˋ!"}
    - en: "Don't frighten the children!"
      sx: {hanzi: "莫嚇細人仔！", pinyin: "mog hagˋ se nginˇ eˋ!"}
      hl: {hanzi: "莫嚇細人仔！", pinyin: "mogˋ hag seˇ ngin er!"}
    - en: "A-in looks nervous."
      sx: {hanzi: "阿英看起來當緊張。", pinyin: "aˊ inˊ kon hiˋ loiˇ dongˊ ginˋ zongˊ."}
      hl: {hanzi: "阿英看起來當緊張。", pinyin: "a+ rhinˋ konˇ hiˊ loi dongˋ ginˊ zhongˋ."}
    - en: "In a month Sam has turned into a 竹東 man!"
      sx: {hanzi: "一隻月，Sam 就變到竹東人了！", pinyin: "idˋ zagˋ ngied, Sam qiu bien do zugˋ dungˊ nginˇ leˊ!"}
      hl: {hanzi: "一隻月，Sam 就變到竹東人了！", pinyin: "rhid zhag ngiedˋ, Sam ciu+ bienˇ doˇ zhug dungˋ ngin leˋ!"}
    - en: "Where's the bus stop? — Over there, next to the factory."
      sx: {hanzi: "車站在哪位？——在該，工廠个隔壁。", pinyin: "caˊ zam coiˊ nai vi? — coiˊ ge, gungˊ congˋ ge gagˋ biagˋ."}
      hl: {hanzi: "車站在哪位？——在該，工廠个隔壁。", pinyin: "chaˋ zhamˇ coiˋ nai+ vui+? — coiˋ gai, gungˋ chongˊ gaiˇ gag biag."}
    - en: "Grandpa's never changed: he looks just as he did fifty years ago."
      sx: {hanzi: "阿公毋識變：看起來像五十年前个樣仔。", pinyin: "aˊ gungˊ mˇ siidˋ bien: kon hiˋ loiˇ qiong ngˋ siib ngienˇ qienˇ ge iong eˋ."}
      hl: {hanzi: "阿公毋識變：看起來像五十年前个樣仔。", pinyin: "a+ gungˋ m shid bienˇ: konˇ hiˊ loi ciongˇ ngˊ shibˋ ngien cien gaiˇ rhong+ er."}
      check: true
