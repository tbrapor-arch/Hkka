exercises:
  translate:
    - en: "A-min is still asleep."
      sx: {hanzi: "阿明還在該睡目。", pinyin: "aˊ minˇ hanˇ du ge soi mugˋ."}
      hl: {hanzi: "阿明還在該睡目。", pinyin: "a+ min han diˇ gai shoi+ mug."}
    - en: "Is there any congee?"
      sx: {hanzi: "有粥無？", pinyin: "iuˊ zugˋ moˇ?"}
      hl: {hanzi: "有糜無？", pinyin: "rhiuˋ moi mo?"}
    - en: "Grandma is at home."
      sx: {hanzi: "阿婆在屋下。", pinyin: "aˊ poˇ cai vugˋ kaˊ."}
      hl: {hanzi: "阿婆在屋下。", pinyin: "a+ po cai+ vug haˋ."}
    - en: "This is his tea."
      sx: {hanzi: "這係厥茶。", pinyin: "iaˋ he giaˊ caˇ."}
      hl: {hanzi: "這係厥茶。", pinyin: "liaˊ heˇ gia ca."}
    - en: "I didn't put any sugar in."
      sx: {hanzi: "𠊎無放糖。", pinyin: "ngaiˇ moˇ biong tongˇ."}
      hl: {hanzi: "𠊎無放糖。", pinyin: "ngai mo biongˇ tong."}
  fill:
    - en: "What is A-in doing?"
      sx: {hanzi: "阿英___做麼个？", pinyin: "aˊ inˊ ___ zo maˋ ge?", answer_hanzi: "在該", answer: "du ge"}
      hl: {hanzi: "阿英___做麼个？", pinyin: "a+ rhinˋ ___ zoˇ maˊ gaiˇ?", answer_hanzi: "在該", answer: "diˇ gai"}
    - en: "Do you want some tea?"
      sx: {hanzi: "食茶___？", pinyin: "siid caˇ ___?", answer_hanzi: "無", answer: "moˇ"}
      hl: {hanzi: "食茶___？", pinyin: "shidˋ ca ___?", answer_hanzi: "無", answer: "mo"}
    - en: "Where is Grandpa?"
      sx: {hanzi: "阿公在___？", pinyin: "aˊ gungˊ cai ___?", answer_hanzi: "哪位", answer: "nai vi"}
      hl: {hanzi: "阿公在___？", pinyin: "a+ gungˋ cai+ ___?", answer_hanzi: "哪位", answer: "nai+ vui+"}

