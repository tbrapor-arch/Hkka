id: 19
title:
  en: "Cooking 客家小炒 with Grandma"
  sx: {hanzi: "先炒肉，正放魷魚", pinyin: "xienˊ cauˋ ngiugˋ, zang biong iuˇ ngˇ"}
  hl: {hanzi: "先炒肉，正放魷魚", pinyin: "senˋ cauˊ ngiug, zhangˇ biongˇ rhiu ng"}
review: false
setting: >-
  Friday, five in the afternoon. A-in's bus gets in at seven. Grandma has been in the kitchen since three; now she
  needs another pair of hands.
names: [客家小炒, 阿英]

dialogue:
  - n: 1
    speaker: 阿婆
    en: "Sam, come and help in the kitchen! Tonight we're making 客家小炒."
    sx: {hanzi: "Sam，來灶下𢯭手！暗晡愛煮客家小炒。", pinyin: "Sam, loiˇ zo haˊ ten suˋ! am buˊ oi zuˋ hagˋ gaˊ seuˋ cauˋ."}
    hl: {hanzi: "Sam，來灶下𢯭手！暗晡愛煮客家小炒。", pinyin: "Sam, loi zoˇ haˋ tenˇ shiuˊ! amˇ buˋ oiˇ zhuˊ hag gaˋ siauˊ cauˊ."}
  - n: 2
    speaker: Sam
    en: "客家小炒? Is that A-in's favourite?"
    sx: {hanzi: "客家小炒？係阿英盡好食个菜？", pinyin: "hagˋ gaˊ seuˋ cauˋ? he aˊ inˊ qin hau siid ge coi?"}
    hl: {hanzi: "客家小炒？係阿英最好食个菜？", pinyin: "hag gaˋ siauˊ cauˊ? heˇ a+ rhinˋ zuiˇ hauˇ shidˋ gaiˇ coiˇ?"}
  - n: 3
    speaker: 阿婆
    en: "It is. First, cut up the pork belly."
    zh: "是。你先把五花肉切好。"
    sx: {hanzi: "係。你先同三層肉切好。", pinyin: "he. nˇ xienˊ tungˇ samˊ cenˇ ngiugˋ qiedˋ hoˋ."}
    hl: {hanzi: "係。你先摎三層肉切好。", pinyin: "heˇ. ngi senˋ lauˋ samˋ cen ngiug cied hoˊ."}
  - n: 4
    speaker: Sam
    en: "(cutting large chunks) Like this?"
    sx: {hanzi: "恁樣切？", pinyin: "anˋ ngiongˇ qiedˋ?"}
    hl: {hanzi: "恁樣切？", pinyin: "an ngiong cied?"}
  - n: 5
    speaker: 阿婆
    en: "No, smaller than that."
    sx: {hanzi: "毋係，切較細兜仔。", pinyin: "mˇ he, qiedˋ ka se deuˊ eˋ."}
    hl: {hanzi: "毋係，切較細兜仔。", pinyin: "m heˇ, cied haˇ seˇ deuˋ er."}
  - n: 6
    speaker: 阿婆
    en: "(heating the wok) Oil first. Fry the pork first, and only then put in the squid and the celery."
    sx: {hanzi: "先放油。先炒肉，正放魷魚同芹菜。", pinyin: "xienˊ biong iuˇ. xienˊ cauˋ ngiugˋ, zang biong iuˇ ngˇ tungˇ kiunˇ coi."}
    hl: {hanzi: "先放油。先炒肉，正放魷魚摎芹菜。", pinyin: "senˋ biongˇ rhiu. senˋ cauˊ ngiug, zhangˇ biongˇ rhiu ng lauˋ kiun coiˇ."}
  - n: 7
    speaker: Sam
    en: "Does it need sugar?"
    sx: {hanzi: "愛放糖無？", pinyin: "oi biong tongˇ moˇ?"}
    hl: {hanzi: "愛放糖無？", pinyin: "oiˇ biongˇ tong mo?"}
  - n: 8
    speaker: 阿婆
    en: "(with the exact look Grandpa gave him) …Soy sauce."
    sx: {hanzi: "……放豆油。", pinyin: "… biong teu iuˇ."}
    hl: {hanzi: "……放豆油。", pinyin: "… biongˇ teu+ rhiu."}
  - n: 9
    speaker: Sam
    en: "(sniffing the wok) It smells wonderful!"
    sx: {hanzi: "當香！", pinyin: "dongˊ hiongˊ!"}
    hl: {hanzi: "當香！", pinyin: "dongˋ hiongˋ!"}
  - n: 10
    speaker: 阿婆
    en: "Now you can make 客家小炒! A-in will be so pleased."
    sx: {hanzi: "你會煮客家小炒了！阿英會當歡喜。", pinyin: "nˇ voi zuˋ hagˋ gaˊ seuˋ cauˋ leˊ! aˊ inˊ voi dongˊ fonˊ hiˋ."}
    hl: {hanzi: "你會煮客家小炒了！阿英會當歡喜。", pinyin: "ngi voi+ zhuˊ hag gaˋ siauˊ cauˊ leˋ! a+ rhinˋ voi+ dongˋ fonˋ hiˊ."}

notes:
  - ref: 1
    topic: culture
    text: >
      客家小炒 hagˋ gaˊ seuˋ cauˋ, "Hakka stir-fry": strips of pork belly fried until they give up their fat, then dried
      squid, dried tofu, celery and spring onions, with soy sauce. It is on the menu of almost every Hakka restaurant in
      Taiwan, and is said to have begun as a way to use up the pork and dried squid offered to the gods at festivals. 灶下 zo haˊ "kitchen" (廚房),
      literally "below the stove".
  - ref: 3
    topic: grammar
    text: >
      同 + object + verb puts the object first, like Mandarin 把: 你先同三層肉切好 "first cut up the pork belly"
      (你先把五花肉切好). Hailu and many Sixian speakers say 摎 here: 摎三層肉切好. Use it when you do something to a
      particular thing: cut it, wash it, put it somewhere. 切好 "cut (properly), finish cutting": 好 after a verb is
      "done, ready", as in 洗好 "washed".
  - ref: 4
    topic: vocab
    text: >
      恁樣 anˋ ngiongˇ "like this, this way" (這樣). 恁 again, the "so" of 恁大. Point at your work and say 恁樣？
  - ref: 5
    topic: grammar
    text: >
      較細兜仔 "a bit smaller": 較 + adjective + 兜仔 "a bit more so". 兜, the plural of 𠊎兜, is also "some, a little":
      較大兜仔 "a bit bigger", 較遽兜仔 "a bit faster".
  - ref: 6
    topic: grammar
    text: >
      先…正… "first…, (and only) then…": 先炒肉，正放魷魚 "fry the pork first, then put in the squid". The 正 of lesson
      16 (三點正來 "not until three") in its other job. Recipes, directions and plans are built on it. 魷魚 iuˇ ngˇ
      "squid" (魚 ngˇ "fish": a syllable with no vowel, as in 五 ngˋ); 芹菜 kiunˇ coi "celery"; 油 iuˇ "oil".
  - ref: 8
    topic: culture
    text: >
      The third sugar scene (lessons 4 and 7). Hakka cooking leans on salt,
      soy sauce and preserved vegetables; sugar is not what this family reaches for.
  - ref: 10
    topic: vocab
    text: >
      歡喜 fonˊ hiˋ "happy, pleased", the everyday word (Mandarin 高興). 會 + verb + 了 "can (do it) now". 炒 cauˋ "stir-fry".
  - ref: 0
    topic: hailu
    text: >
      Hailu uses 摎 for 把: 摎三層肉切好. Its 炒 is cauˊ, 小 siauˊ.
  - ref: 0
    topic: vocab
    text: >
      肚 duˋ after a noun is "inside": 鑊肚 "in the wok", 店肚 "in the shop" (Mandarin 裡). The same 肚 as 肚屎 "belly".

