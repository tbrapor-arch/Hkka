exercises:
  translate:
    - en: "Wash the celery first, then cut it."
      sx: {hanzi: "先同芹菜洗好，正切。", pinyin: "xienˊ tungˇ kiunˇ coi seˋ hoˋ, zang qiedˋ."}
      hl: {hanzi: "先摎芹菜洗好，正切。", pinyin: "senˋ lauˋ kiun coiˇ seˊ hoˊ, zhangˇ cied."}
    - en: "Put some salt in the wok."
      sx: {hanzi: "鑊肚放一息仔鹽。", pinyin: "vog duˋ biong idˋ xid eˋ iamˇ."}
      hl: {hanzi: "鑊肚放一息仔鹽。", pinyin: "vogˋ duˊ biongˇ rhid sid er+ rham."}
    - en: "Is that how you cut spring onions?"
      sx: {hanzi: "蔥係恁樣切个？", pinyin: "cungˊ he anˋ ngiongˇ qiedˋ ge?"}
      hl: {hanzi: "蔥係恁樣切个？", pinyin: "cungˋ heˇ an ngiong cied gaiˇ?"}
    - en: "Grandma is very pleased today."
      sx: {hanzi: "阿婆今晡日當歡喜。", pinyin: "aˊ poˇ gimˊ buˊ ngidˋ dongˊ fonˊ hiˋ."}
      hl: {hanzi: "阿婆今晡日當歡喜。", pinyin: "a+ po gimˋ buˋ ngid dongˋ fonˋ hiˊ."}
    - en: "Is it too salty? — Not at all, it smells lovely."
      sx: {hanzi: "會鹹無？——毋會鹹，當香。", pinyin: "voi hamˇ moˇ? — mˇ voi hamˇ, dongˊ hiongˊ."}
      hl: {hanzi: "會鹹無？——毋會鹹，當香。", pinyin: "voi+ ham mo? — m voi+ ham, dongˋ hiongˋ."}
    - en: "Grandma is frying fish."
      sx: {hanzi: "阿婆在該煎魚。", pinyin: "aˊ poˇ du ge jienˊ ngˇ."}
      hl: {hanzi: "阿婆在該煎魚。", pinyin: "a+ po diˇ gai zienˋ ng."}
    - en: "Fry the meat first, then the vegetables."
      sx: {hanzi: "先炒肉，正炒菜。", pinyin: "xienˊ cauˋ ngiugˋ, zang cauˋ coi."}
      hl: {hanzi: "先炒肉，正炒菜。", pinyin: "senˋ cauˊ ngiug, zhangˇ cauˊ coiˇ."}
  fill:
    - en: "First cut up the pork."
      sx: {hanzi: "先___豬肉切好。", pinyin: "xienˊ ___ zuˊ ngiugˋ qiedˋ hoˋ.", answer_hanzi: "同", answer: "tungˇ"}
      hl: {hanzi: "先___豬肉切好。", pinyin: "senˋ ___ zhuˋ ngiug cied hoˊ.", answer_hanzi: "摎", answer: "lauˋ"}
    - en: "Like this?"
      sx: {hanzi: "___切？", pinyin: "___ qiedˋ?", answer_hanzi: "恁樣", answer: "anˋ ngiongˇ"}
      hl: {hanzi: "___切？", pinyin: "___ cied?", answer_hanzi: "恁樣", answer: "an ngiong"}
    - en: "Fry the pork first, then put in the squid."
      sx: {hanzi: "先炒肉，___放魷魚。", pinyin: "xienˊ cauˋ ngiugˋ, ___ biong iuˇ ngˇ.", answer_hanzi: "正", answer: "zang"}
      hl: {hanzi: "先炒肉，___放魷魚。", pinyin: "senˋ cauˊ ngiug, ___ biongˇ rhiu ng.", answer_hanzi: "正", answer: "zhangˇ"}

