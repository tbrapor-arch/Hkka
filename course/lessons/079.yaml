id: 79
title:
  en: "Visiting hours"
  sx: {hanzi: "人來就好", pinyin: "nginˇ loiˇ qiu hoˋ"}
  hl: {hanzi: "人來就好", pinyin: "ngin loi ciu+ hoˊ"}
review: false
setting: >-
  Thursday 3 June, three in the afternoon, visiting hours. Grandpa's leg is up on two pillows. The neighbours from
  lesson 32, 阿財伯 (leaning on a stick) and 財伯姆 (carrying far too much), come through the door.
names: [財伯姆, 阿財伯, 劉]

dialogue:
  - n: 1
    speaker: 財伯姆
    en: "Grandma Liu! We've come to visit the patient and ask after uncle."
    sx: {hanzi: "劉阿婆！𠊎兜來探病，問候阿伯。", pinyin: "liuˇ aˊ poˇ! ngaiˇ deuˊ loiˇ tamˋ piang, mun onˊ aˊ bagˋ."}
    hl: {hanzi: "劉阿婆！𠊎兜來探病，問候阿伯。", pinyin: "liu a+ po! ngai deuˋ loi tamˇ piang+, munˇ onˋ a+ bag."}
    check: true
  - n: 2
    speaker: 阿婆
    en: "Coming is enough, and you've brought presents too. You're too kind."
    sx: {hanzi: "人來就好，還擐等路來，恁客氣。", pinyin: "nginˇ loiˇ qiu hoˋ, hanˇ kuan denˋ lu loiˇ, anˋ hagˋ hi."}
    hl: {hanzi: "人來就好，還擐等路來，恁客氣。", pinyin: "ngin loi ciu+ hoˊ, han kuan+ denˊ lu+ loi, anˊ hag hiˇ."}
    source: moe
  - n: 3
    speaker: 財伯姆
    en: "Not at all. This box of apples and these flowers are for him. And I've cooked some 麵線卵, to chase his bad luck away."
    sx: {hanzi: "毋使客氣。這盒蘋果、這束花分阿伯。還有，𠊎煮麵線卵來，分阿伯過運。", pinyin: "mˇ siiˋ hagˋ hi. iaˋ hab lin goˋ, iaˋ sogˋ faˊ bunˊ aˊ bagˋ. hanˇ iuˊ, ngaiˇ zuˋ mien xien lonˋ loiˇ, bunˊ aˊ bagˋ go iun."}
    hl: {hanzi: "毋使客氣。這盒蘋果、這束花分阿伯。還有，𠊎煮麵線卵來，分阿伯過運。", pinyin: "m siiˊ hag hiˇ. liaˊ habˋ linˋ goˇ, liaˊ sog faˋ bunˋ a+ bag. han rhiuˋ, ngai zhuˊ mien+ sienˇ lonˊ loi, bunˋ a+ bag goˇ rhun+."}
    check: true
  - n: 4
    speaker: 阿婆
    en: "Thank you!"
    sx: {hanzi: "恁仔細！", pinyin: "anˋ ziiˋ se!"}
    hl: {hanzi: "承蒙你兜！", pinyin: "shin mung ngi deuˋ!"}
  - n: 5
    speaker: 財伯姆
    en: "(to Grandpa) Uncle, you look well today: your colour is better, and you seem in good spirits."
    sx: {hanzi: "阿伯，你今晡日面色當好，氣色較好，心情乜當好。", pinyin: "aˊ bagˋ, nˇ gimˊ buˊ ngidˋ mien sedˋ dongˊ hoˋ, hi sedˋ ka hoˋ, ximˊ qinˇ me dongˊ hoˋ."}
    hl: {hanzi: "阿伯，你今晡日面色當好，氣色較好，心情乜當好。", pinyin: "a+ bag, ngi gimˋ buˋ ngid mienˇ sed dongˋ hoˊ, hiˇ sed haˇ hoˊ, simˋ cin meˇ dongˋ hoˊ."}
  - n: 6
    speaker: 阿婆
    en: "(answering for him) He sleeps in the daytime and wakes up at night. He's fed up in the ward; Sam brought him a magazine."
    sx: {hanzi: "佢日時頭睡，暗晡醒。在病房當悶，Sam 拿一本雜誌分佢看。", pinyin: "giˇ ngidˋ siiˇ teuˇ soi, am buˊ xiangˋ. coiˊ piang fongˇ dongˊ mun, Sam naˊ idˋ bunˋ cab zii bunˊ giˇ kon."}
    hl: {hanzi: "佢日時頭睡，暗晡醒。在病房當悶，Sam 拿一本雜誌分佢看。", pinyin: "gi ngid shi teu shoi+, amˇ buˋ siangˊ. coiˋ piang+ fong dongˋ munˇ, Sam naˋ rhid bunˊ cabˋ zhiˇ bunˋ gi konˇ."}
    check: true
  - n: 7
    speaker: 阿財伯
    en: "(waving his stick, laughing) Old brother, once you're out, you'll need a stick too!"
    sx: {hanzi: "老阿哥，你出院以後，乜愛擎棍仔哦！", pinyin: "loˋ aˊ goˊ, nˇ cudˋ ien iˊ heu, me oi kiaˇ gun eˋ oˊ!"}
    hl: {hanzi: "老阿哥，你出院以後，乜愛擎棍仔哦！", pinyin: "loˊ a+ goˋ, ngi chud rhanˇ rhiˋ heu+, meˇ oiˇ kia gunˇ er oˊ!"}
  - n: 8
    speaker: 阿公
    en: "You first."
    sx: {hanzi: "你先。", pinyin: "nˇ xienˊ."}
    hl: {hanzi: "你先。", pinyin: "ngi senˋ."}
  - n: 9
    speaker: 財伯姆
    en: "Stop joking, you two. A patient needs peace and rest."
    sx: {hanzi: "莫講笑吔。病人愛安心歇睏。", pinyin: "mog gongˋ seu leˊ. piang nginˇ oi onˊ ximˊ hiedˋ kun."}
    hl: {hanzi: "莫講笑咧。病人愛安心歇睏。", pinyin: "mogˋ gongˊ siauˇ leˋ. piang+ ngin oiˇ onˋ simˋ hied kunˇ."}
  - n: 10
    speaker: 護士
    en: "Excuse me, visiting time is over. Uncle has to rest."
    sx: {hanzi: "失禮，探病个時間過吔。阿伯愛歇睏吔。", pinyin: "siidˋ liˊ, tamˋ piang ge siiˇ gienˊ go leˊ. aˊ bagˋ oi hiedˋ kun leˊ."}
    hl: {hanzi: "失禮，探病个時間過咧。阿伯愛歇睏咧。", pinyin: "shid liˋ, tamˇ piang+ gaiˇ shi gienˋ goˇ leˋ. a+ bag oiˇ hied kunˇ leˋ."}
    check: true
  - n: 11
    speaker: 財伯姆
    en: "All right, all right. Get well, uncle, and come home soon."
    sx: {hanzi: "好，好。阿伯，好好歇睏，早兜仔轉屋下。", pinyin: "hoˋ, hoˋ. aˊ bagˋ, hoˋ hoˋ hiedˋ kun, zoˋ deuˊ eˋ zonˋ vugˋ kaˊ."}
    hl: {hanzi: "好，好。阿伯，好好歇睏，早兜仔轉屋下。", pinyin: "hoˊ, hoˊ. a+ bag, hoˊ hoˊ hied kunˇ, zoˊ deuˋ er zhonˊ vug haˋ."}
  - n: 12
    speaker: 阿婆
    en: "Come and see us when you're free!"
    sx: {hanzi: "有閒正來尞！", pinyin: "iuˊ hanˇ zang loiˇ liau!"}
    hl: {hanzi: "有閒正來尞！", pinyin: "rhiuˋ han zhangˇ loi liau+!"}
  - n: 13
    speaker: Sam
    en: "(once they've gone) Grandma, they say 'no need to be polite', you say 'thank you', they say 'no need to be polite' again…"
    sx: {hanzi: "阿婆，佢兜講毋使客氣，你講恁仔細，佢兜又講毋使客氣……", pinyin: "aˊ poˇ, giˇ deuˊ gongˋ mˇ siiˋ hagˋ hi, nˇ gongˋ anˋ ziiˋ se, giˇ deuˊ iu gongˋ mˇ siiˋ hagˋ hi …"}
    hl: {hanzi: "阿婆，佢兜講毋使客氣，你講承蒙，佢兜又講毋使客氣……", pinyin: "a+ po, gi deuˋ gongˊ m siiˊ hag hiˇ, ngi gongˊ shin mung, gi deuˋ rhiu+ gongˊ m siiˊ hag hiˇ …"}
  - n: 14
    speaker: 阿婆
    en: "That's manners. When people bring you things, you say thank you; when you thank them, they say no need. The way it's always been done."
    sx: {hanzi: "這就係禮數。人送東西，你講恁仔細；你講恁仔細，人講毋使客氣。頭擺就係恁樣个規矩。", pinyin: "iaˋ qiu he liˊ su. nginˇ sung dungˊ xiˊ, nˇ gongˋ anˋ ziiˋ se; nˇ gongˋ anˋ ziiˋ se, nginˇ gongˋ mˇ siiˋ hagˋ hi. teuˇ baiˋ qiu he anˋ ngiongˇ ge guiˊ giˋ."}
    hl: {hanzi: "這就係禮數。人送東西，你講承蒙；你講承蒙，人講毋使客氣。頭擺就係恁樣个規矩。", pinyin: "liaˊ ciu+ heˇ liˋ suˇ. ngin sungˇ dungˋ siˋ, ngi gongˊ shin mung; ngi gongˊ shin mung, ngin gongˊ m siiˊ hag hiˇ. teu baiˊ ciu+ heˇ an ngiong gaiˇ guiˋ giˊ."}
  - n: 15
    speaker: 阿公
    en: "(from the bed, suddenly) The 麵線卵. And the treats."
    sx: {hanzi: "麵線卵。還有好料。", pinyin: "mien xien lonˋ. hanˇ iuˊ hoˋ liau."}
    hl: {hanzi: "麵線卵。還有好料。", pinyin: "mien+ sienˇ lonˊ. han rhiuˋ hoˊ liau+."}

notes:
  - ref: 2
    topic: culture
    text: >
      The official example sentence, word for word: 人來就好，還擐等路來，恁客氣 "coming is enough, and you bring presents
      too: so kind". 等路 "a present brought on a visit" and 擐 "carry (by a handle)" from lesson 52. The reply is
      always 毋使客氣 "no need to be polite" (line 3), from the official 請坐啊！毋使客氣. Both official sentences exist
      only in Sixian; their Hailu columns are the course's transposition.
  - ref: 3
    topic: culture
    text: >
      麵線卵 mien xien lonˋ "thin noodles with an egg". An official example: 客家人食麵線卵…有過運个意義 "when Hakka people
      eat 麵線卵… it is to get past bad luck" (過運); it is also a birthday dish (阿姆煮麵線卵同𠊎做生日). Taking it to a
      patient is this course's story (general knowledge at most). 盒 hab
      "box" (classifier), 束 sogˋ "bunch": 一盒蘋果, 一束花. The whole line is marked for a check: the official sentence
      gives the custom, not this way of offering it.
  - ref: 4
    topic: grammar
    text: >
      恁仔細！ stands alone, as always (lesson 1). Hailu says 承蒙你 / 承蒙你兜, with the person after it (lesson 53).
      That is the one place where the two columns of this lesson differ in substance.
  - ref: 5
    topic: vocab
    text: >
      面色 mien sedˋ "complexion, how someone looks": 你今晡日面色當好 "you look well today". From the official saying
      出門看天色，入門看面色 "outside, watch the sky; indoors, watch people's faces". 氣色 is a near-synonym.
  - ref: 6
    topic: vocab
    text: >
      日時頭 "in the daytime", 暗晡 "in the evening, at night" (lesson 25), 醒 xiangˋ "wake up". 無聊 moˇ liauˇ "bored,
      boring", as in Mandarin.
  - ref: 8
    topic: culture
    text: >
      你先 "you first": Grandpa's reply to "you'll need a stick too" uses the 先 of 你先行 "after you" (lesson 17). Two
      syllables, and the neighbour laughs the hardest. 擎 "hold (a stick, an umbrella)" from lesson 61; 棍仔 "stick"
      from lesson 36.
  - ref: 12
    topic: grammar
    text: >
      有閒正來尞 "come round when you're free", the farewell set phrase of lesson 54: 正 at the end of a condition, "when…,
      then". Said to visitors leaving a hospital ward, it is pure politeness.
  - ref: 14
    topic: culture
    text: >
      禮數 liˊ su "manners, the proper forms" and 規矩 guiˊ giˋ "rules, the way things are done". Grandma's lesson in
      politeness is the course's own summary, not a quotation: thanks, refusal of thanks, and nobody keeps count.

