exercises:
  translate:
    - en: "Here, sit down. No need to be polite."
      sx: {hanzi: "請坐啊！毋使客氣。", pinyin: "qiangˋ coˊ a! mˇ siiˋ hagˋ hi."}
      hl: {hanzi: "請坐啊！毋使客氣。", pinyin: "ciangˊ coˋ a+! m siiˊ hag hiˇ."}
      source: kaga115
    - en: "Put another pillow under his leg, and bring a face towel."
      sx: {hanzi: "佢个腳下背加一隻枕頭，乜拿一條面帕來。", pinyin: "giˇ ge giogˋ haˊ boi gaˊ idˋ zagˋ ziimˋ teuˇ, me naˊ idˋ tiauˇ mien pa loiˇ."}
      hl: {hanzi: "佢个腳下背加一隻枕頭，乜拿一條面帕來。", pinyin: "gi gaiˇ giog haˋ boiˇ gaˋ rhid zhag zhimˊ teu, meˇ naˋ rhid tiau mienˇ paˇ loi."}
      check: true
    - en: "Grandpa is bored in hospital."
      sx: {hanzi: "阿公在醫院當無聊。", pinyin: "aˊ gungˊ coiˊ iˊ ien dongˊ moˇ liauˇ."}
      hl: {hanzi: "阿公在醫院當無聊。", pinyin: "a+ gungˋ coiˋ rhiˋ rhanˇ dongˋ mo liau."}
    - en: "His colour is better today, and his mood is good too."
      sx: {hanzi: "佢今晡日氣色較好，心情乜當好。", pinyin: "giˇ gimˊ buˊ ngidˋ hi sedˋ ka hoˋ, ximˊ qinˇ me dongˊ hoˋ."}
      hl: {hanzi: "佢今晡日氣色較好，心情乜當好。", pinyin: "gi gimˋ buˋ ngid hiˇ sed haˇ hoˊ, simˋ cin meˇ dongˋ hoˊ."}
    - en: "Once he's home, Grandma will cook him all kinds of treats."
      sx: {hanzi: "轉屋下以後，阿婆會煮好料分佢補身體。", pinyin: "zonˋ vugˋ kaˊ iˊ heu, aˊ poˇ voi zuˋ hoˋ liau bunˊ giˇ buˋ siinˊ tiˋ."}
      hl: {hanzi: "轉屋下以後，阿婆會煮好料分佢補身體。", pinyin: "zhonˊ vug haˋ rhiˋ heu+, a+ po voi+ zhuˊ hoˊ liau+ bunˋ gi buˊ shinˋ tiˊ."}
    - en: "Thank you for your hospitality; come and see us when you're free."
      sx: {hanzi: "承蒙你个招待，有閒正來尞。", pinyin: "siinˇ mungˇ nˇ ge zeuˊ tai, iuˊ hanˇ zang loiˇ liau."}
      hl: {hanzi: "承蒙你个招待，有閒正來尞。", pinyin: "shin mung ngi gaiˇ zhauˋ tai+, rhiuˋ han zhangˇ loi liau+."}
      source: moe
    - en: "The neighbours really care about Grandpa."
      sx: {hanzi: "鄰舍當關心阿公。", pinyin: "linˇ sa dongˊ guanˊ ximˊ aˊ gungˊ."}
      hl: {hanzi: "鄰舍當關心阿公。", pinyin: "lin shaˇ dongˋ guanˋ simˋ a+ gungˋ."}
  fill:
