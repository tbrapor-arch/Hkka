      sx: {hanzi: "恁仔細！——___。", pinyin: "anˋ ziiˋ se! — ___.", answer_hanzi: "毋使客氣", answer: "mˇ siiˋ hagˋ hi"}
      hl: {hanzi: "承蒙你！——___。", pinyin: "shin mung ngi! — ___.", answer_hanzi: "毋使客氣", answer: "m siiˊ hag hiˇ"}
    - en: "We've come to visit the patient."
      sx: {hanzi: "𠊎兜來___吔。", pinyin: "ngaiˇ deuˊ loiˇ ___ leˊ.", answer_hanzi: "探病", answer: "tamˋ piang"}
      hl: {hanzi: "𠊎兜來___咧。", pinyin: "ngai deuˋ loi ___ leˋ.", answer_hanzi: "探病", answer: "tamˇ piang+"}
    - en: "Visiting time is over."
      sx: {hanzi: "探病个___過吔。", pinyin: "tamˋ piang ge ___ go leˊ.", answer_hanzi: "時間", answer: "siiˇ gienˊ"}
      hl: {hanzi: "探病个___過咧。", pinyin: "tamˇ piang+ gaiˇ ___ goˇ leˋ.", answer_hanzi: "時間", answer: "shi gienˋ"}

