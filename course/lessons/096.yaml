exercises:
  translate:
    - en: "Grandma patted him on the back and stroked his hair."
      sx: {hanzi: "阿婆拍佢个背囊，摸佢个頭那毛。", pinyin: "aˊ poˇ pogˋ giˇ ge boi nongˇ, miaˊ giˇ ge teuˇ naˇ moˊ."}
      hl: {hanzi: "阿婆拍佢个背囊，摸佢个頭那毛。", pinyin: "a+ po pog gi gaiˇ boiˇ nong, miaˋ gi gaiˇ teu na moˋ."}
    - en: "A-in is Grandma's granddaughter, and she's just like her."
      sx: {hanzi: "阿英係阿婆个孫女，同阿婆共樣。", pinyin: "aˊ inˊ he aˊ poˇ ge sunˊ ngˋ, tungˇ aˊ poˇ kiung iong."}
      hl: {hanzi: "阿英係阿婆个孫女，摎阿婆共樣。", pinyin: "a+ rhinˋ heˇ a+ po gaiˇ sunˋ ngˊ, lauˋ a+ po kiung+ rhong+."}
    - en: "The world is big; but there's only one Miaoli."
      sx: {hanzi: "世界恁大，毋過苗栗就一隻定定。", pinyin: "sii gie anˋ tai, mˇ go meuˇ lid qiu idˋ zagˋ tin tin."}
      hl: {hanzi: "世界恁大，毋過苗栗就一隻定定。", pinyin: "sheˇ gaiˇ anˊ tai+, m goˇ miau lidˋ ciu+ rhid zhag tin+ tin+."}
      check: true
    - en: "Grandma led A-min by the hand to school when he was small."
      sx: {hanzi: "阿明細時節，阿婆牽佢去學校。", pinyin: "aˊ minˇ se siiˇ jiedˋ, aˊ poˇ kienˊ giˇ hi hog gauˋ."}
      hl: {hanzi: "阿明細時節，阿婆牽佢去學校。", pinyin: "a+ min seˇ shi zied, a+ po kienˋ gi hiˇ hogˋ gauˊ."}
    - en: "He won't take the quilt: he says France is warm. Pack it all the same, all of it."
      sx: {hanzi: "佢毋肯帶被，講法國當燒暖。所有个東西還係愛帶。", pinyin: "giˇ mˇ henˋ dai piˊ, gongˋ fabˋ guedˋ dongˊ seuˊ nonˊ. soˋ iuˊ ge dungˊ xiˊ hanˇ he oi dai."}
      hl: {hanzi: "佢毋肯帶被，講法國當燒暖。所有个東西還係愛帶。", pinyin: "gi m henˊ daiˇ piˋ, gongˊ fab gued dongˋ shauˋ nonˋ. soˊ rhiuˋ gaiˇ dungˋ siˋ han heˇ oiˇ daiˇ."}
      check: true
  fill:
    - en: "I can't bear to leave."
      sx: {hanzi: "𠊎___走。", pinyin: "ngaiˇ ___ zeuˋ.", answer_hanzi: "毋盼得", answer: "mˇ pan dedˋ"}
