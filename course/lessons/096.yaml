id: 96
title:
  en: "Goodbye to Grandma"
  sx: {hanzi: "毋盼得", pinyin: "mˇ pan dedˋ"}
  hl: {hanzi: "毋盼得", pinyin: "m panˇ ded"}
review: false
setting: >-
  Wednesday 24 November, the evening. Sam leaves on Friday. His suitcase is open on the bed in the room he has
  slept in for a year; Grandma has come in without knocking and is folding his clothes, displeased with how he
  does it himself.
names: [法國, 阿英, 苗栗, 阿明]

dialogue:
  - n: 1
    speaker: 阿婆
    en: "Sam, I've folded your clothes for you."
    sx: {hanzi: "Sam，衫褲𠊎同你摺好了。", pinyin: "Sam, samˊ fu ngaiˇ tungˇ nˇ zabˋ hoˋ leˊ."}
    hl: {hanzi: "Sam，衫褲𠊎摎你摺好了。", pinyin: "Sam, samˋ fuˇ ngai lauˋ ngi zhab hoˊ leˋ."}
  - n: 2
    speaker: Sam
    en: "Grandma, I can do it myself… And there's no need to take a quilt: France has them."
    sx: {hanzi: "阿婆，𠊎自家來就好……被毋使帶，法國有。", pinyin: "aˊ poˇ, ngaiˇ qi gaˊ loiˇ qiu hoˋ … piˊ mˇ siiˋ dai, fabˋ guedˋ iuˊ."}
    hl: {hanzi: "阿婆，𠊎自家來就好……被毋使帶，法國有。", pinyin: "a+ po, ngai cid gaˋ loi ciu+ hoˊ … piˋ m siiˊ daiˇ, fab gued rhiuˋ."}
  - n: 3
    speaker: 阿婆
    en: "You fold them badly, and you won't let Grandma do it. And the suitcase is full: don't put anything else in."
    sx: {hanzi: "你摺毋好，又毋肯分阿婆摺。皮箱既經淰了，莫再放。", pinyin: "nˇ zabˋ mˇ hoˋ, iu mˇ henˋ bunˊ aˊ poˇ zabˋ. piˇ xiongˊ gi ginˊ nemˊ leˊ, mog zai biong."}
    hl: {hanzi: "你摺毋好，又毋肯分阿婆摺。皮箱既經淰了，莫再放。", pinyin: "ngi zhab m hoˊ, rhiu+ m henˊ bunˋ a+ po zhab. pi siongˋ giˇ ginˋ nemˋ leˋ, mogˋ zaiˇ biongˇ."}
    check: true
  - n: 4
    speaker: 阿婆
    en: "…Except this jar of pickled mustard greens. Grandma made it herself. Take it back to France and eat it slowly."
    sx: {hanzi: "……毋過這罐仔鹹菜愛放。阿婆自家做个。帶轉去法國，慢慢仔食。", pinyin: "… mˇ go iaˋ gon eˋ hamˇ coi oi biong. aˊ poˇ qi gaˊ zo ge. dai zonˋ hi fabˋ guedˋ, man man eˋ siid."}
    hl: {hanzi: "……毋過這罐仔鹹菜愛放。阿婆自家做个。帶轉去法國，慢慢仔食。", pinyin: "… m goˇ liaˊ gonˇ er ham coiˇ oiˇ biongˇ. a+ po cid gaˋ zoˇ gaiˇ. daiˇ zhonˊ hiˇ fab gued, man+ man+ er shidˋ."}
    check: true
  - n: 5
    speaker: Sam
    en: "It's so heavy… all my things won't fit."
    sx: {hanzi: "恁重……所有个東西都放毋落了。", pinyin: "anˋ cungˊ … soˋ iuˊ ge dungˊ xiˊ du biong mˇ log leˊ."}
    hl: {hanzi: "恁重……所有个東西都放毋落了。", pinyin: "anˊ chungˋ … soˊ rhiuˋ gaiˇ dungˋ siˋ du+ biongˇ m logˋ leˋ."}
  - n: 6
    speaker: 阿婆
    en: "Heavy, my foot! And here's this photo: Grandpa and me, fifty years ago."
    sx: {hanzi: "重麼个！還有這張相片：阿公同阿婆，五十年前个。", pinyin: "cungˊ maˋ ge! hanˇ iuˊ iaˋ zongˊ xiong pienˋ: aˊ gungˊ tungˇ aˊ poˇ, ngˋ siib ngienˇ qienˇ ge."}
    hl: {hanzi: "重麼个！還有這張相片：阿公摎阿婆，五十年前个。", pinyin: "chungˋ maˊ gaiˇ! han rhiuˋ liaˊ zhongˋ siongˇ pienˊ: a+ gungˋ lauˋ a+ po, ngˊ shibˋ ngien cien gaiˇ."}
  - n: 7
    speaker: Sam
    en: "But this is… the one Grandpa said 'This one, for me' about?"
    sx: {hanzi: "這毋係……阿公講「這張，分𠊎」該張？", pinyin: "iaˋ mˇ he … aˊ gungˊ gongˋ iaˋ zongˊ, bunˊ ngaiˇ ge zongˊ?"}
    hl: {hanzi: "這毋係……阿公講「這張，分𠊎」該張？", pinyin: "liaˊ m heˇ … a+ gungˋ gongˊ liaˊ zhongˋ, bunˋ ngai gai zhongˋ?"}
  - n: 8
    speaker: 阿婆
    en: "He had another one printed for you, on the quiet. Don't tell him I told you."
    sx: {hanzi: "佢偷偷仔同你洗一張。莫講係𠊎講个。", pinyin: "giˇ teuˊ teuˊ eˋ tungˇ nˇ seˋ idˋ zongˊ. mog gongˋ he ngaiˇ gongˋ ge."}
    hl: {hanzi: "佢偷偷仔摎你洗一張。莫講係𠊎講个。", pinyin: "gi teuˋ teuˋ er lauˋ ngi seˊ rhid zhongˋ. mogˋ gongˊ heˇ ngai gongˊ gaiˇ."}
  - n: 9
    speaker: 阿婆
    en: "A year gone so fast, it feels like no time at all. When you've gone, the house will be dead quiet. Grandma will be lonely."
    sx: {hanzi: "一年過到恁遽，好像無幾久。你轉去以後，屋下會恬索索，阿婆會孤栖。", pinyin: "idˋ ngienˇ go do anˋ giagˋ, hoˋ qiong moˇ gidˋ giuˋ. nˇ zonˋ hi iˊ heu, vugˋ kaˊ voi diamˊ sogˋ sogˋ, aˊ poˇ voi guˊ xiˊ."}
    hl: {hanzi: "一年過到恁遽，好像無幾久。你轉去以後，屋下會恬索索，阿婆會孤栖。", pinyin: "rhid ngien goˇ doˇ anˊ giag, hoˊ ciongˇ mo giˊ giuˊ. ngi zhonˊ hiˇ rhiˋ heu+, vug haˋ voi+ diamˋ sog sog, a+ po voi+ guˋ siˋ."}
  - n: 10
    speaker: Sam
    en: "I can't bear to go either."
    sx: {hanzi: "𠊎乜毋盼得走。", pinyin: "ngaiˇ me mˇ pan dedˋ zeuˋ."}
    hl: {hanzi: "𠊎乜毋盼得走。", pinyin: "ngai meˇ m panˇ ded zeuˊ."}
  - n: 11
    speaker: 阿婆
    en: "Grandma's granddaughter A-in says she's going to France next year to see you. What the two of you do is your business: Grandma won't interfere."
    sx: {hanzi: "阿婆个孫女阿英講佢過忒年愛去法國尋你。你兩儕个事，阿婆毋管。", pinyin: "aˊ poˇ ge sunˊ ngˋ aˊ inˊ gongˋ giˇ go tedˋ ngienˇ oi hi fabˋ guedˋ qimˇ nˇ. nˇ liongˋ saˇ ge sii, aˊ poˇ mˇ gonˋ."}
    hl: {hanzi: "阿婆个孫女阿英講佢明年愛去法國尋你。你兩儕个事，阿婆毋管。", pinyin: "a+ po gaiˇ sunˋ ngˊ a+ rhinˋ gongˊ gi mang ngien oiˇ hiˇ fab gued cim ngi. ngi liongˊ sa gaiˇ sii+, a+ po m gonˊ."}
  - n: 12
    speaker: 阿婆
    en: "But Grandma has three things to tell you. Keep them in your heart."
    sx: {hanzi: "毋過阿婆有三件事愛吩咐你，愛記入心。", pinyin: "mˇ go aˊ poˇ iuˊ samˊ kien sii oi funˊ fu nˇ, oi gi ngib ximˊ."}
    hl: {hanzi: "毋過阿婆有三件事愛吩咐你，愛記入心。", pinyin: "m goˇ a+ po rhiuˋ samˋ kien+ sii+ oiˇ funˋ fuˇ ngi, oiˇ giˇ ngibˋ simˋ."}
  - n: 13
    speaker: 阿婆
    en: "One: eat your bowl clean. Two: whatever happens to you, don't keep it in your heart, say it."
    sx: {hanzi: "第一，食飯愛食空空。第二，堵著麼个事情，毋好放在自家心肝肚，愛講出來。", pinyin: "ti idˋ, siid fan oi siid kungˊ kungˊ. ti ngi, duˇ doˋ maˋ ge sii qinˇ, mˇ hoˋ biong coiˊ qi gaˊ ximˊ gonˊ duˋ, oi gongˋ cudˋ loiˇ."}
    hl: {hanzi: "第一，食飯愛食空空。第二，堵著麼个事情，毋好放在自家心肝肚，愛講出來。", pinyin: "ti+ rhid, shidˋ pon+ oiˇ shidˋ kungˋ kungˋ. ti+ ngi+, du doˊ maˊ gaiˇ sii+ cin, m hoˊ biongˇ coiˋ cid gaˋ simˋ gonˋ duˊ, oiˇ gongˊ chud loi."}
  - n: 14
    speaker: Sam
    en: "And three?"
    sx: {hanzi: "第三呢？", pinyin: "ti samˊ neˇ?"}
    hl: {hanzi: "第三呢？", pinyin: "ti+ samˋ neˇ?"}
  - n: 15
    speaker: 阿婆
    en: "Three: come back."
    sx: {hanzi: "第三，愛轉來。", pinyin: "ti samˊ, oi zonˋ loiˇ."}
    hl: {hanzi: "第三，愛轉來。", pinyin: "ti+ samˋ, oiˇ zhonˊ loi."}
  - n: 16
    speaker: Sam
    en: "I'll come back. Absolutely. The world is so big, but there's only one Miaoli."
    sx: {hanzi: "𠊎會轉來。絕對會。世界恁大，毋過苗栗就一隻定定。", pinyin: "ngaiˇ voi zonˋ loiˇ. qied dui voi. sii gie anˋ tai, mˇ go meuˇ lid qiu idˋ zagˋ tin tin."}
    hl: {hanzi: "𠊎會轉來。絕對會。世界恁大，毋過苗栗就一隻定定。", pinyin: "ngai voi+ zhonˊ loi. ciedˋ duiˇ voi+. sheˇ gaiˇ anˊ tai+, m goˇ miau lidˋ ciu+ rhid zhag tin+ tin+."}
  - n: 17
    speaker: 阿婆
    en: "(her eyes wet) Come here: Grandma takes your hand, strokes your head, pats your back. Good, good. Off to bed."
    sx: {hanzi: "來，阿婆牽你个手，摸你个頭那，拍你个背囊。好，好。去睡目。", pinyin: "loiˇ, aˊ poˇ kienˊ nˇ ge suˋ, miaˊ nˇ ge teuˇ naˇ, pogˋ nˇ ge boi nongˇ. hoˋ, hoˋ. hi soi mugˋ."}
    hl: {hanzi: "來，阿婆牽你个手，摸你个頭那，拍你个背囊。好，好。去睡目。", pinyin: "loi, a+ po kienˋ ngi gaiˇ shiuˊ, miaˋ ngi gaiˇ teu na, pog ngi gaiˇ boiˇ nong. hoˊ, hoˊ. hiˇ shoi+ mug."}

notes:
  - ref: 1
    topic: vocab
    text: >
      摺 zabˋ "fold": 衫褲摺好 "fold the clothes (properly)", with 好 for "done right" (lesson 33). Grandma's 同你 "for you"
      (lesson 40).
  - ref: 3
    topic: vocab
    text: >
      淰 nemˊ "full (to the brim)", a Hakka-only word (dictionary: 滿). 既經 gi ginˊ "already" (dictionary: 已經), a word
      that sits where Mandarin puts 已經. 摺毋好 "folds them badly": V毋好 "do it badly".
  - ref: 4
    topic: culture
    text: >
      鹹菜 hamˇ coi is not "salted vegetables" in general but the Hakka pickled mustard greens (dictionary: 酸菜), made
      from the 芥菜 of lesson 8 (how it is made is general knowledge; kaga just says 酸菜); 罐仔 gon eˋ "jar, bottle". 慢慢仔食 "eat it slowly, make it last".
  - ref: 6
    topic: grammar
    text: >
      重麼个！ "heavy, what?!": the X麼个 retort (lessons 36, 39), Grandma's last. The photo is the one in the album of
      lesson 83.
  - ref: 8
    topic: vocab
    text: >
      偷偷仔 "on the quiet" (lesson 46). 洗一張 "have a print made": 洗 "wash" is the photographer's verb, as in Mandarin
      洗照片, and attested: kaga115 翕相館乜做得洗相片. 莫講係𠊎講个 "don't say I told you": 係…个 once more.
  - ref: 9
    topic: grammar
    text: >
      無幾久 moˇ gidˋ giuˋ "not long, no time at all". 孤栖 guˊ xiˊ "lonely" (dictionary: 孤獨；孤單): 一儕人來臺北食頭路…
      毋會有孤栖个心情 (official). The house will be 恬索索, as the hall was for the prizes (lesson 94).
  - ref: 10
    topic: vocab
    text: >
      毋盼得 mˇ pan dedˋ "can't bear to part with, can't bring oneself to": 厥爸毋盼得佢受苦 "his father couldn't bear him
      to suffer", 細人仔日漸成人長大，爺哀再毋盼得也係愛分家 "children grow up, and however much the parents hate it, the
      family has to split" (official). 毋盼得走 "can't bear to leave".
  - ref: 11
    topic: culture
    text: >
      過忒年 go tedˋ ngienˇ "next year; after the New Year" (kaga115: 明年；過年後、過完春節), in Hailu too (阿美過忒年就愛嫁咧);
      the Hailu column here has 明年. 明年 miangˇ ngienˇ is Sixian as well: no Sixian list entry, but MOE has it and
      kaga115 examples use it (佢計畫明年出國尞). 阿婆毋管 "Grandma won't interfere": the promise of lesson 42, kept, more or less. The thread of A-in and Sam
      ends where the course leaves it: a visit to France next year.
  - ref: 12
    topic: vocab
    text: >
      吩咐 funˊ fu "tell (someone to), give instructions": an elder's word. 記入心 gi ngib ximˊ "take to heart, keep in
      mind": 這恁重要个事情愛記入心，毋好毋記得 "something this important you must keep in mind, don't forget it"
      (official, both accents).
  - ref: 13
    topic: grammar
    text: >
      Grandma's first instruction is lesson 95's saying; the second is close to an official sentence: 先生希望大家有麼个問題
      全做得同佢講，毋好放在自家心肝肚 "don't keep it to yourself". 心肝肚 ximˊ gonˊ duˋ "in one's heart" (心肝 + 肚 "inside").
      堵著 duˇ doˋ "come across, meet with".
  - ref: 16
    topic: vocab
    text: >
      絕對 qied dui "absolutely, definitely". Sam's 會 is the 會 of lesson 1, "can", and of lesson 34, "will": both.

