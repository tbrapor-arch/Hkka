exercises:
  translate:
    - en: "In my view, both of you are as bad as each other: don't argue so loudly."
      sx: {hanzi: "照𠊎看，你兩儕共樣，莫恁大聲吵。", pinyin: "zeu ngaiˇ kon, nˇ liongˋ saˇ kiung iong, mog anˋ tai sangˊ cauˇ."}
      hl: {hanzi: "照𠊎看，你兩儕共樣，莫恁大聲吵。", pinyin: "zhauˇ ngai konˇ, ngi liongˊ sa kiung+ rhong+, mogˋ anˊ tai+ shangˋ cau."}
    - en: "My English isn't up to much; I have to join the beginners' class."
      source: moe
      abridged: true
      sx: {hanzi: "𠊎英文程度毋好，愛讀初級班。", pinyin: "ngaiˇ inˊ vunˇ cangˇ tu mˇ hoˋ, oi tug cuˊ gibˋ banˊ."}
      hl: {hanzi: "𠊎英文程度毋好，愛讀初級班。", pinyin: "ngai rhinˋ vun chang tu+ m hoˊ, oiˇ tugˋ cuˋ gib banˋ."}
      check: true
    - en: "Speak quietly: Grandpa is asleep."
      sx: {hanzi: "細聲講，阿公在該睡目。", pinyin: "se sangˊ gongˋ, aˊ gungˊ du ge soi mugˋ."}
      hl: {hanzi: "細聲講，阿公在該睡目。", pinyin: "seˇ shangˋ gongˊ, a+ gungˋ diˇ gai shoi+ mug."}
    - en: "What's your view? — My view is the same as Grandpa's."
      sx: {hanzi: "你个看法係仰般？——𠊎个看法同阿公共樣。", pinyin: "nˇ ge kon fabˋ he ngiongˋ banˊ? — ngaiˇ ge kon fabˋ tungˇ aˊ gungˊ kiung iong."}
      hl: {hanzi: "你个看法係仰般？——𠊎个看法摎阿公共樣。", pinyin: "ngi gaiˇ konˇ fab heˇ ngiongˊ banˋ? — ngai gaiˇ konˇ fab lauˋ a+ gungˋ kiung+ rhong+."}
    - en: "He's set his heart on winning next month's Hakka speech contest, and now he practises hard every day."
      sx: {hanzi: "佢一心想愛拿著下隻月客話演講比賽个第一名，這下逐日當煞猛練習。", pinyin: "giˇ idˋ ximˊ xiongˋ oi naˊ doˋ ha zagˋ ngied hagˋ fa ienˊ gongˋ biˋ soi ge ti idˋ miangˇ, iaˋ ha dagˋ ngidˋ dongˊ sadˋ mangˊ lien xib."}
      hl: {hanzi: "佢一心想愛拿著下隻月客話演講比賽个第一名，這下逐日當煞猛練習。", pinyin: "gi rhid simˋ siongˊ oiˇ naˋ doˊ ha+ zhag ngiedˋ hag voiˋ rhanˋ gongˊ biˊ soiˇ gaiˇ ti+ rhid miang, liaˊ ha+ dag ngid dongˋ sad mangˋ lien+ sibˋ."}
      source: moe
    - en: "English has twenty-six letters in all."
      sx: {hanzi: "英語總共有二十六個字母。", pinyin: "inˊ ngiˊ zungˋ kiung iuˊ ngi siib liugˋ ge sii muˊ."}
      hl: {hanzi: "英語總共有二十六個字母。", pinyin: "rhinˋ ngiˋ zungˊ kiung+ rhiuˋ ngi+ shibˋ liug gaiˇ sii+ muˋ."}
      source: moe
    - en: "After class A-min stays in the classroom and does his homework."
      sx: {hanzi: "下課以後，阿明在教室做功課。", pinyin: "ha ko iˊ heu, aˊ minˇ coiˊ gau siidˋ zo gungˊ ko."}
      hl: {hanzi: "下課以後，阿明在教室做功課。", pinyin: "haˋ koˇ rhiˋ heu+, a+ min coiˋ gauˇ shid zoˇ gungˋ koˇ."}
