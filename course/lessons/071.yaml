exercises:
  translate:
    - en: "I didn't understand just now; please say it once more."
      sx: {hanzi: "𠊎頭先聽毋識，請你再過講一擺。", pinyin: "ngaiˇ teuˇ xienˊ tangˊ mˇ siidˋ, qiangˋ nˇ zai go gongˋ idˋ baiˋ."}
      hl: {hanzi: "𠊎頭先聽毋識，請你再過講一擺。", pinyin: "ngai teu senˋ tangˋ m shid, ciangˊ ngi zaiˇ goˇ gongˊ rhid baiˊ."}
    - en: "The countryside is very quiet; there are banana groves everywhere."
      sx: {hanzi: "鄉下當安靜，四片都係弓蕉園。", pinyin: "hiongˊ ha dongˊ onˊ qin, xi pienˋ du he giungˊ zeuˊ ienˇ."}
      hl: {hanzi: "鄉下當安靜，四片都係弓蕉園。", pinyin: "hiongˋ ha+ dongˋ onˋ cin+, siˇ pienˊ du+ heˇ giungˋ ziauˋ rhan."}
      check: true
    - en: "Her accent is different from ours. Speak slowly."
      sx: {hanzi: "佢个口音同𠊎兜無共樣。你慢慢講。", pinyin: "giˇ ge kieuˋ imˊ tungˇ ngaiˇ deuˊ moˇ kiung iong. nˇ man man gongˋ."}
      hl: {hanzi: "佢个口音摎𠊎兜無共樣。你慢慢講。", pinyin: "gi gaiˇ kieuˊ rhimˋ lauˋ ngai deuˋ mo kiung+ rhong+. ngi man+ man+ gongˊ."}
    - en: "Most people in the north have never been to 六堆."
      sx: {hanzi: "北部大部分个人毋識去過六堆。", pinyin: "bedˋ pu tai pu fun ge nginˇ mˇ siidˋ hi go liugˋ duiˊ."}
      hl: {hanzi: "北部大部分个人毋識去過六堆。", pinyin: "bed pu+ tai+ pu+ fun+ gaiˇ ngin m shid hiˇ goˇ liug duiˋ."}
    - en: "The 伙房 and its courtyard are in the middle of the fields: a lovely place."
      sx: {hanzi: "伙房个禾埕在田中央，這隻地方蓋靚！", pinyin: "foˋ fongˇ ge voˇ tangˇ coiˊ tienˇ dungˊ ongˊ, iaˋ zagˋ ti fongˊ goi jiangˊ!"}
      hl: {hanzi: "伙房个禾埕在田中央，這隻地方當靚！", pinyin: "foˊ fong gaiˇ vo tang coiˋ tien dungˋ ongˋ, liaˊ zhag ti+ fongˋ dongˋ ziangˋ!"}
      check: true
  fill:
    - en: "very good (southern word; the Hailu column keeps 當)"
      sx: {hanzi: "___好", pinyin: "___ hoˋ", answer_hanzi: "蓋", answer: "goi"}
      hl: {hanzi: "___好", pinyin: "___ hoˊ", answer_hanzi: "當", answer: "dongˋ"}
    - en: "(southern) We're going back home on Sunday."
      sx: {hanzi: "𠊎等禮拜日___去。", pinyin: "ngaiˇ denˋ liˊ bai ngidˋ ___ hi.", answer_hanzi: "歸", answer: "guiˊ"}
      hl: {hanzi: "𠊎兜禮拜日___去。", pinyin: "ngai deuˋ liˋ baiˇ ngid ___ hiˇ.", answer_hanzi: "轉", answer: "zhonˊ"}

