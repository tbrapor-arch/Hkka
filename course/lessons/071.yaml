id: 71
title:
  en: "Arriving in 美濃"
  sx: {hanzi: "蓋好！", pinyin: "goi hoˋ!"}
  hl: {hanzi: "當好！", pinyin: "dongˋ hoˊ!"}
review: false
setting: >-
  Saturday 8 May, three in the afternoon. A-in has taken Sam south for the weekend: the high-speed train to 左營, then
  a bus through the banana groves to 美濃, under the hills at the edge of the 高雄 plain. An old couple, 鍾伯 and 鍾伯姆,
  run a small guesthouse in a 伙房 courtyard. They speak Sixian too, but the southern kind.
names: [美濃, 左營, 高雄, 鍾伯, 鍾伯姆, 阿英, 苗栗]

dialogue:
  - n: 1
    speaker: 鍾伯姆
    en: "Welcome, welcome! You've come from Miaoli, haven't you?"
    sx: {hanzi: "歡迎，歡迎！你兜係對苗栗來个，係無？", pinyin: "fonˊ ngiangˇ, fonˊ ngiangˇ! nˇ deuˊ he dui meuˇ lid loiˇ ge, he moˇ?"}
    hl: {hanzi: "歡迎，歡迎！你兜係對苗栗來个，係無？", pinyin: "fonˋ ngiang, fonˋ ngiang! ngi deuˋ heˇ duiˇ miau lidˋ loi gaiˇ, heˇ mo?"}
  - n: 2
    speaker: 阿英
    en: "Yes. The high-speed train to 左營, then the bus. This is Sam; he's learning Hakka in Miaoli."
    sx: {hanzi: "係。坐高鐵到左營，再過坐巴士。這係 Sam，佢在苗栗學客話。", pinyin: "he. coˊ goˊ tiedˋ do zoˋ iangˇ, zai go coˊ ba siiˋ. iaˋ he Sam, giˇ coiˊ meuˇ lid hog hagˋ fa."}
    hl: {hanzi: "係。坐高鐵到左營，再過坐巴士。這係 Sam，佢在苗栗學客話。", pinyin: "heˇ. coˋ goˋ tied doˇ zoˊ rhang, zaiˇ goˇ coˋ ba siiˋ. liaˊ heˇ Sam, gi coiˋ miau lidˋ hogˋ hag voiˋ."}
  - n: 3
    speaker: 鍾伯姆
    en: "A foreigner who speaks Hakka! Very good!"
    sx: {hanzi: "外國人講客話！蓋好！", pinyin: "ngoi guedˋ nginˇ gongˋ hagˋ fa! goi hoˋ!"}
    hl: {hanzi: "外國人講客話！當好！", pinyin: "ngoi+ gued ngin gongˊ hag voiˋ! dongˋ hoˊ!"}
  - n: 4
    speaker: Sam
    en: "(to A-in, under his breath) '蓋好'? 蓋… what does that mean?"
    sx: {hanzi: "「蓋好」？蓋……係麼个意思？", pinyin: "goi hoˋ? goi … he maˋ ge i sii?"}
    hl: {hanzi: "「蓋好」？蓋……係麼个意思？", pinyin: "goiˇ hoˊ? goiˇ … heˇ maˊ gaiˇ rhiˇ siiˇ?"}
  - n: 5
    speaker: 阿英
    en: "Here they say 蓋好; it's the 當好 we say in Miaoli."
    sx: {hanzi: "這位講「蓋好」，就係苗栗講个「當好」。", pinyin: "iaˋ vi gongˋ goi hoˋ, qiu he meuˇ lid gongˋ ge dongˊ hoˋ."}
    hl: {hanzi: "這位講「蓋好」，就係苗栗講个「當好」。", pinyin: "liaˊ vui+ gongˊ goiˇ hoˊ, ciu+ heˇ miau lidˋ gongˊ gaiˇ dongˋ hoˊ."}
  - n: 6
    speaker: 鍾伯
    en: "We 美濃 people don't speak quite like Miaoli people. Can you follow?"
    sx: {hanzi: "𠊎等美濃人講話，同苗栗人無共樣。你聽識無？", pinyin: "ngaiˇ denˋ miˊ nungˇ nginˇ gongˋ fa, tungˇ meuˇ lid nginˇ moˇ kiung iong. nˇ tangˊ siidˋ moˇ?"}
    hl: {hanzi: "𠊎兜美濃人講話，摎苗栗人無共樣。你聽識無？", pinyin: "ngai deuˋ mi nung ngin gongˊ faˇ, lauˋ miau lidˋ ngin mo kiung+ rhong+. ngi tangˋ shid mo?"}
    check: true
  - n: 7
    speaker: Sam
    en: "I can! …Most of it."
    sx: {hanzi: "聽識！……大部分聽識。", pinyin: "tangˊ siidˋ! … tai pu fun tangˊ siidˋ."}
    hl: {hanzi: "聽識！……大部分聽識。", pinyin: "tangˋ shid! … tai+ pu+ fun+ tangˋ shid."}
    check: true
  - n: 8
    speaker: 鍾伯姆
    en: "You're staying two nights, and going back on Sunday, is that right?"
    sx: {hanzi: "你兜歇兩暗晡，禮拜日正歸去，係無？", pinyin: "nˇ deuˊ hiedˋ liongˋ am buˊ, liˊ bai ngidˋ zang guiˊ hi, he moˇ?"}
    hl: {hanzi: "你兜歇兩暗晡，禮拜日正轉去，係無？", pinyin: "ngi deuˋ hied liongˊ amˇ buˋ, liˋ baiˇ ngid zhangˇ zhonˊ hiˇ, heˇ mo?"}
  - n: 9
    speaker: Sam
    en: "歸去?"
    sx: {hanzi: "歸去？", pinyin: "guiˊ hi?"}
    hl: {hanzi: "歸去？", pinyin: "guiˋ hiˇ?"}
  - n: 10
    speaker: 阿英
    en: "歸去 means 轉去, 'go back home'."
    sx: {hanzi: "歸去就係轉去。", pinyin: "guiˊ hi qiu he zonˋ hi."}
    hl: {hanzi: "歸去就係轉去。", pinyin: "guiˋ hiˇ ciu+ heˇ zhonˊ hiˇ."}
  - n: 11
    speaker: 鍾伯
    en: "Right. Put your bags down; this evening we'll take you two for 粄條."
    sx: {hanzi: "好。行李放好，暗晡𠊎等帶你兜去食粄條。", pinyin: "hoˋ. hangˇ liˋ biong hoˋ, am buˊ ngaiˇ denˋ dai nˇ deuˊ hi siid banˋ tiauˇ."}
    hl: {hanzi: "好。行李放好，暗晡𠊎兜帶你兜去食粄條。", pinyin: "hoˊ. hang liˊ biongˇ hoˊ, amˇ buˋ ngai deuˋ daiˇ ngi deuˋ hiˇ shidˋ banˊ tiau."}
  - n: 12
    speaker: 鍾伯姆
    en: "Not 粄條: 面帕粄! In 六堆 we call it 面帕粄."
    sx: {hanzi: "毋係粄條，係面帕粄！六堆人安做面帕粄。", pinyin: "mˇ he banˋ tiauˇ, he mien pa banˋ! liugˋ duiˊ nginˇ onˊ zo mien pa banˋ."}
    hl: {hanzi: "毋係粄條，係面帕粄！六堆人安到面帕粄。", pinyin: "m heˇ banˊ tiau, heˇ mienˇ paˇ banˊ! liug duiˋ ngin onˋ doˇ mienˇ paˇ banˊ."}
  - n: 13
    speaker: Sam
    en: "(to A-in) Here even the food has a different name."
    sx: {hanzi: "這位連食个東西都安到無共樣。", pinyin: "iaˋ vi lienˇ siid ge dungˊ xiˊ du onˊ do moˇ kiung iong."}
    hl: {hanzi: "這位連食个東西都安到無共樣。", pinyin: "liaˊ vui+ lien shidˋ gaiˇ dungˋ siˋ du+ onˋ doˇ mo kiung+ rhong+."}
  - n: 14
    speaker: 鍾伯
    en: "Before that, take a stroll behind the house. The fields at the foot of the hill are lovely, and there are banana groves all round."
    sx: {hanzi: "還吂食，你兜先去屋背行行啊。山腳个田蓋靚，四片都係弓蕉園。", pinyin: "hanˇ mangˇ siid, nˇ deuˊ xienˊ hi vugˋ boi hangˇ hangˇ a. sanˊ giogˋ ge tienˇ goi jiangˊ, xi pienˋ du he giungˊ zeuˊ ienˇ."}
    hl: {hanzi: "還吂食，你兜先去屋背行行啊。山腳个田當靚，四片都係弓蕉園。", pinyin: "han mang shidˋ, ngi deuˋ senˋ hiˇ vug boiˇ hang hang a+. sanˋ giog gaiˇ tien dongˋ ziangˋ, siˇ pienˊ du+ heˇ giungˋ ziauˋ rhan."}
    check: true
  - n: 15
    speaker: Sam
    en: "(later, in the courtyard) What a lovely place! The 伙房 courtyard right in the middle of the fields: I've never seen anything like it."
    sx: {hanzi: "這隻地方蓋靚！伙房个禾埕在田中央，𠊎毋識看過。", pinyin: "iaˋ zagˋ ti fongˊ goi jiangˊ! foˋ fongˇ ge voˇ tangˇ coiˊ tienˇ dungˊ ongˊ, ngaiˇ mˇ siidˋ kon go."}
    hl: {hanzi: "這隻地方當靚！伙房个禾埕在田中央，𠊎毋識看過。", pinyin: "liaˊ zhag ti+ fongˋ dongˋ ziangˋ! foˊ fong gaiˇ vo tang coiˋ tien dungˋ ongˋ, ngai m shid konˇ goˇ."}
  - n: 16
    speaker: 阿英
    en: "(laughing) 'Lovely' with a 蓋 already! The countryside is quiet like this: you can hear the birds."
    sx: {hanzi: "你乜講「蓋」了！鄉下就係恁安靜，聽得著鳥仔。", pinyin: "nˇ me gongˋ goi leˊ! hiongˊ ha qiu he anˋ onˊ qin, tangˊ dedˋ doˋ diauˊ eˋ."}
    hl: {hanzi: "你乜講「蓋」了！鄉下就係恁安靜，聽得著鳥仔。", pinyin: "ngi meˇ gongˊ goiˇ leˋ! hiongˋ ha+ ciu+ heˇ anˊ onˋ cin+, tangˋ ded doˊ diauˋ er."}
    check: true

notes:
  - ref: 1
    topic: grammar
    text: >
      對苗栗來 "come from Miaoli": 對 "from" (lesson 62). …係無？ at the end asks for confirmation, "…, isn't it?", like
      …係毋係？ (lesson 32); the official examples have both (毋記得麼个東西係無？).
  - ref: 3
    topic: grammar
    text: >
      蓋 goi "very": the MOE dictionary lists it with the sense 很、極. The data has a set of 176 everyday sentences
      recorded in southern Sixian (南四縣), parallel to the Sixian set: 蓋 is in 20 of them, and where the Sixian set says
      當 the southern one says 蓋: 今晡日天時蓋好 "the weather is lovely today", 寒天著膨線衫蓋燒暖 "a woollen jumper is
      very warm in winter". The official example sentences also give it as a bracketed alternative, 當（蓋）, 1,236
      times (臺灣个文旦柚當(蓋)好食). In Miaoli, keep saying 當. The Hailu line says 當 as usual.
  - ref: 6
    topic: grammar
    text: >
      𠊎等 "we": MOE defines it as 我們 and gives the Sixian reading ngaiˇ denˋ and the southern one ngaiˇ denˊ; one of the
      southern sentences has it (ngaiˇ denˊ…共下鬥等買美食, where Sixian says 這兜). In the official examples' brackets,
      𠊎等 stands for both 𠊎兜 (10 times: 𠊎兜（𠊎等）愛去看電影，你愛跈無？) and 𫣆兜 (16 times, plus 𫣆, 𫣆俚): the
      south does not make the north's split between "we without you" and "we with you" in the same way. 聽識 "follow, understand
      (by ear)": 聽 + 識 (lesson 26); 聽毋識 "not understand": 𠊎頭先聽毋識，請你再過講一擺 is an official example.
  - ref: 8
    topic: grammar
    text: >
      歸去 guiˊ hi "go back home" = 轉去: MOE gives 歸 the sense 返回. Two southern sentences have it where the Sixian set
      has 轉: 阿姆毋曾歸來 "Mum hasn't come home yet", 歸來了！ "back home!" (Sixian 轉來了). The brackets of the official
      examples have 轉（歸）over a hundred times (阿爸逐（每）日都轉（歸）屋下食晝). 歸 is also "the whole" (歸日, 歸屋下): context decides.
  - ref: 12
    topic: culture
    text: >
      面帕粄 mien pa banˋ: MOE says it outright: 臺灣北部客家人稱「粄條」，屏東六堆地區稱「面帕粄」, "northern Hakka call
      it 粄條, the 六堆 area calls it 面帕粄", literally "face-towel 粄", from the wide white sheets it is cut from.
      六堆 liugˋ duiˊ is the name of the southern Hakka settlements, 美濃 among them. 安做 "be called": an official example
      has exactly 粄條，六堆人安做面帕粄.
  - ref: 0
    topic: hailu
    text: >
      The Hailu column, as always, gives the Hailu way of saying each line: 當 for 蓋, 𠊎兜 for 𠊎等, 轉去 for 歸去, except
      where Sam and A-in are quoting the southern word.

