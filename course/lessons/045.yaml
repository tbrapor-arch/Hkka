exercises:
  translate:
    - en: "This year's harvest is good: the rice is a lovely yellow."
      sx: {hanzi: "今年个收成當好，禾仔黃黃。", pinyin: "gimˊ ngienˇ ge suˊ siinˇ dongˊ hoˋ, voˇ eˋ vongˇ vongˇ."}
      hl: {hanzi: "今年个收成當好，禾仔黃黃。", pinyin: "gimˋ ngien gaiˇ shiuˋ shin dongˋ hoˊ, vo er vong vong."}
      check: true
    - en: "The baby is round and chubby."
      sx: {hanzi: "這細人仔圓圓肥肥。", pinyin: "iaˋ se nginˇ eˋ ienˇ ienˇ piˇ piˇ."}
      hl: {hanzi: "這細人仔圓圓肥肥。", pinyin: "liaˊ seˇ ngin er rhan rhan pui pui."}
    - en: "Grandpa is thin; A-min is not fat either."
      sx: {hanzi: "阿公當瘦，阿明乜毋會肥。", pinyin: "aˊ gungˊ dongˊ ceu, aˊ minˇ me mˇ voi piˇ."}
      hl: {hanzi: "阿公當瘦，阿明乜毋會肥。", pinyin: "a+ gungˋ dongˋ seuˇ, a+ min meˇ m voi+ pui."}
    - en: "Sam's clothes are covered in mud."
      sx: {hanzi: "Sam 个衫全部係泥。", pinyin: "Sam ge samˊ qionˇ pu he naiˇ."}
      hl: {hanzi: "Sam 个衫全部係泥。", pinyin: "Sam gaiˇ samˋ cion pu+ heˇ nai."}
    - en: "The tangerine is sourish; the sweets are nice and sweet."
      sx: {hanzi: "柑仔酸酸，糖仔甜甜。", pinyin: "gamˊ eˋ sonˊ sonˊ, tongˇ eˋ tiamˇ tiamˇ."}
      hl: {hanzi: "柑仔酸酸，糖仔甜甜。", pinyin: "gamˋ er sonˋ sonˋ, tong er tiam tiam."}
  fill:
    - en: "Pull it gently."
      sx: {hanzi: "___挷。", pinyin: "___ bangˊ.", answer_hanzi: "輕輕仔", answer: "kiangˊ kiangˊ eˋ"}
      hl: {hanzi: "___挷。", pinyin: "___ bangˋ.", answer_hanzi: "輕輕仔", answer: "kiangˋ kiangˋ er"}
    - en: "What do you plant in winter?"
      sx: {hanzi: "寒天___麼个？", pinyin: "honˇ tienˊ ___ maˋ ge?", answer_hanzi: "種", answer: "zung"}
      hl: {hanzi: "冷天___麼个？", pinyin: "langˋ tienˋ ___ maˊ gaiˇ?", answer_hanzi: "種", answer: "zhungˇ"}
    - en: "In summer the fields are lush and green (AA, no 仔)."
      sx: {hanzi: "熱天田項___。", pinyin: "ngied tienˊ tienˇ hong ___.", answer_hanzi: "青青", answer: "qiangˊ qiangˊ"}
      hl: {hanzi: "熱天田項___。", pinyin: "ngiedˋ tienˋ tien hong+ ___.", answer_hanzi: "青青", answer: "ciangˋ ciangˋ"}

