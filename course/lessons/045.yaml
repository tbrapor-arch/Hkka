id: 45
title:
  en: "The fields"
  sx: {hanzi: "白白个蘿蔔", pinyin: "pag pag ge loˇ ped"}
  hl: {hanzi: "白白个菜頭", pinyin: "pagˋ pagˋ gaiˇ coiˇ teu"}
review: false
setting: >-
  Sunday morning, the day after the wedding. Everyone else is asleep. Grandpa, who went to bed at nine, is up at six
  and wants company. The rice fields behind the house have been harvested; one corner is now full of radishes.
names: [阿明, 阿財伯]

dialogue:
  - n: 1
    speaker: 阿公
    en: "A-min, Sam, come on. I'll take you to see the fields."
    sx: {hanzi: "阿明，Sam，來，𠊎帶你兜去田項看。", pinyin: "aˊ minˇ, Sam, loiˇ, ngaiˇ dai nˇ deuˊ hi tienˇ hong kon."}
    hl: {hanzi: "阿明，Sam，來，𠊎帶你兜去田項看。", pinyin: "a+ min, Sam, loi, ngai daiˇ ngi deuˋ hiˇ tien hong+ konˇ."}
  - n: 2
    speaker: 阿明
    en: "(yawning) Grandpa, there's nothing to see in the fields in winter!"
    sx: {hanzi: "阿公，寒天田項無麼个好看！", pinyin: "aˊ gungˊ, honˇ tienˊ tienˇ hong moˇ maˋ ge hoˋ kon!"}
    hl: {hanzi: "阿公，冷天田項無麼个好看！", pinyin: "a+ gungˋ, langˋ tienˋ tien hong+ mo maˊ gaiˇ hoˊ konˇ!"}
  - n: 3
    speaker: 阿公
    en: "The rice has been cut. Now we use the fields to grow vegetables and radishes."
    sx: {hanzi: "禾仔割忒了，這下田項拿來種菜摎蘿蔔。", pinyin: "voˇ eˋ godˋ tedˋ leˊ, iaˋ ha tienˇ hong naˊ loiˇ zung coi lauˊ loˇ ped."}
    hl: {hanzi: "禾仔割忒了，這下田項拿來種菜摎菜頭。", pinyin: "vo er god ted leˋ, liaˊ ha+ tien hong+ naˋ loi zhungˇ coiˇ lauˋ coiˇ teu."}
  - n: 4
    speaker: Sam
    en: "What's a 蘿蔔?"
    sx: {hanzi: "蘿蔔係麼个？", pinyin: "loˇ ped he maˋ ge?"}
    hl: {hanzi: "菜頭係麼个？", pinyin: "coiˇ teu heˇ maˊ gaiˇ?"}
  - n: 5
    speaker: 阿公
    en: "(pulling one up) This is a 蘿蔔. Nice and white, nice and big. At New Year we make radish cake with it."
    sx: {hanzi: "這就係蘿蔔。白白个，大大个。過年愛做蘿蔔粄。", pinyin: "iaˋ qiu he loˇ ped. pag pag ge, tai tai ge. go ngienˇ oi zo loˇ ped banˋ."}
    hl: {hanzi: "這就係菜頭。白白个，大大个。過年愛做菜頭粄。", pinyin: "liaˊ ciu+ heˇ coiˇ teu. pagˋ pagˋ gaiˇ, tai+ tai+ gaiˇ. goˇ ngien oiˇ zoˇ coiˇ teu banˊ."}
  - n: 6
    speaker: 阿明
    en: "That one's so fat. It looks like 阿財伯!"
    sx: {hanzi: "該隻肥肥，像阿財伯！", pinyin: "ge zagˋ piˇ piˇ, qiong aˊ coiˇ bagˋ!"}
    hl: {hanzi: "該隻肥肥，像阿財伯！", pinyin: "gai zhag pui pui, ciongˇ a+ coi bag!"}
  - n: 7
    speaker: Sam
    en: "Grandpa, did you farm when you were a child?"
    sx: {hanzi: "阿公，你細人仔个時節乜耕田無？", pinyin: "aˊ gungˊ, nˇ se nginˇ eˋ ge siiˇ jiedˋ me gangˊ tienˇ moˇ?"}
    hl: {hanzi: "阿公，你還細時節乜耕田無？", pinyin: "a+ gungˋ, ngi han seˇ shi zied meˇ gangˋ tien mo?"}
  - n: 8
    speaker: 阿公
    en: "I farmed. My family have been farmers for generations."
    sx: {hanzi: "耕田。𠊎屋下幾下世代都係耕田个。", pinyin: "gangˊ tienˇ. ngaiˇ vugˋ kaˊ giˋ ha sii toi du he gangˊ tienˇ ge."}
    hl: {hanzi: "耕田。𠊎屋下幾下世代都係耕田个。", pinyin: "gangˋ tien. ngai vug haˋ giˊ ha+ sheˇ toi+ du+ heˇ gangˋ tien gaiˇ."}
  - n: 9
    speaker: 阿公
    en: "In the old days farming was hard: you knelt in the paddy to pull the weeds by hand. Now it's all machines."
    sx: {hanzi: "頭擺耕田當辛苦，愛跪落田肚挲草。這下用機器。", pinyin: "teuˇ baiˋ gangˊ tienˇ dongˊ xinˊ kuˋ, oi kuiˋ log tienˇ duˋ soˊ coˋ. iaˋ ha iung giˊ hi."}
    hl: {hanzi: "頭擺耕田當辛苦，愛跪落田肚挲草。這下用機器。", pinyin: "teu baiˊ gangˋ tien dongˋ sinˋ kuˊ, oiˇ kuiˊ logˋ tien duˊ soˋ coˊ. liaˊ ha+ rhung+ giˋ hiˇ."}
  - n: 10
    speaker: 阿明
    en: "If it were me, I wouldn't farm."
    sx: {hanzi: "若係𠊎，𠊎毋愛耕田。", pinyin: "na he ngaiˇ, ngaiˇ mˇ oi gangˊ tienˇ."}
    hl: {hanzi: "若係𠊎，𠊎毋愛耕田。", pinyin: "na+ heˇ ngai, ngai m oiˇ gangˋ tien."}
  - n: 11
    speaker: 阿公
    en: "'Farmers eat by the grace of the sky.' …But as long as there are radishes and rice, that's enough."
    sx: {hanzi: "耕田人看天食飯。……毋過有蘿蔔、有飯食，就好。", pinyin: "gangˊ tienˇ nginˇ kon tienˊ siid fan. … mˇ go iuˊ loˇ ped, iuˊ fan siid, qiu hoˋ."}
    hl: {hanzi: "耕田人看天食飯。……毋過有菜頭、有飯食，就好。", pinyin: "gangˋ tien ngin konˇ tienˋ shidˋ pon+. … m goˇ rhiuˋ coiˇ teu, rhiuˋ pon+ shidˋ, ciu+ hoˊ."}
  - n: 12
    speaker: Sam
    en: "Grandpa, can I pull one up?"
    sx: {hanzi: "阿公，𠊎做得挷一隻無？", pinyin: "aˊ gungˊ, ngaiˇ zo dedˋ bangˊ idˋ zagˋ moˇ?"}
    hl: {hanzi: "阿公，𠊎做得挷一隻無？", pinyin: "a+ gungˋ, ngai zoˇ ded bangˋ rhid zhag mo?"}
  - n: 13
    speaker: 阿公
    en: "Pull it gently, slowly. Don't snap it."
    sx: {hanzi: "輕輕仔、慢慢仔挷，莫挷斷。", pinyin: "kiangˊ kiangˊ eˋ, man man eˋ bangˊ, mog bangˊ tonˊ."}
    hl: {hanzi: "輕輕仔、慢慢仔挷，莫挷斷。", pinyin: "kiangˋ kiangˋ er, man+ man+ er bangˋ, mogˋ bangˋ tonˋ."}
  - n: 14
    speaker: Sam
    en: "(a crack; half a radish in his hand) …It snapped."
    sx: {hanzi: "……斷了。", pinyin: "… tonˊ leˊ."}
    hl: {hanzi: "……斷了。", pinyin: "… tonˋ leˋ."}
  - n: 15
    speaker: 阿明
    en: "(delighted) Grandpa, can we eat the half that's left in the ground?"
    sx: {hanzi: "阿公，田肚該半隻做得食無？", pinyin: "aˊ gungˊ, tienˇ duˋ ge ban zagˋ zo dedˋ siid moˇ?"}
    hl: {hanzi: "阿公，田肚該半隻做得食無？", pinyin: "a+ gungˋ, tien duˊ gai banˇ zhag zoˇ ded shidˋ mo?"}

notes:
  - ref: 3
    topic: vocab
    text: >
      禾仔 voˇ eˋ "the rice plant" (in the field; the grain is 穀, the cooked rice 飯). 割 godˋ "cut, reap": 割禾 "harvest the rice".
      種 zung "plant" (verb), a different reading from 種 zungˋ "kind" (lesson 37): 種菜 "grow vegetables" (the phrase is
      not a dictionary headword; it is just 種 + 菜). 拿來種菜 "use (them) for growing vegetables": 拿來 + verb "use for". 蘿蔔 loˇ ped "white radish, daikon";
      Hailu calls it 菜頭 (the official examples give both: 蘿蔔粄﹝菜頭粄﹞).
  - ref: 5
    topic: grammar
    text: >
      白白个，大大个 "nice and white, nice and big": an adjective said twice describes how something looks, vividly, and
      often takes 个: 大大个腳印 "a great big footprint" (official example). 青青 "lush green", 肥肥 (line 6) "plump", 圓圓
      "round". The examples double one adjective at a time; don't run two together (白白大大). With 仔 after it, AA仔 is softer, "-ish, nicely": 輕輕仔 "gently",
      慢慢仔 (line 13) "slowly", 細細仔 "smallish". Official examples: 草青青仔, 細細仔. 蘿蔔粄 "radish cake" (Hailu 菜頭粄), one of the
      New Year 粄 (粄 banˋ, lesson 11), with 甜粄 and 發粄.
  - ref: 8
    topic: grammar
    text: >
      耕田 gangˊ tienˇ "farm", literally "plough the fields"; 耕田个 "farmers"; 耕田人 (line 11) "farmer". 幾下世代 "several
      generations", from an official example (阿牛伯个屋下，幾下世代係耕田个): 幾下 "several", 世代 "generation(s)".
  - ref: 9
    topic: culture
    text: >
      挲草 soˊ coˋ: kneeling in the flooded paddy and weeding by hand, the hardest job of the rice year. An official
      example: 這下耕田全用除草劑，毋使像頭擺愛跪落田肚挲草 "now farming uses weedkiller, no need to kneel in the paddy
      and weed by hand as in the old days". 田肚 "in the paddy": 肚 "inside".
  - ref: 11
    topic: culture
    text: >
      耕田人看天食飯 "farmers eat by the grace of the sky": a saying from the official examples (also 耕田儕看天食飯). Another one
      about farming: 人多好耕田，人少好過年 "many hands are good for farming, few mouths are good for New Year".
  - ref: 12
    topic: vocab
    text: >
      挷 bangˊ "pull (out)": the Hakka verb for pulling up a plant or a tooth. 挷斷 "pull and snap": verb + result, like
      剪短 (lesson 40). 斷 tonˊ "snap, break off".

