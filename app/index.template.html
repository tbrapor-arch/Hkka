<style>
/*__FONTS__*/
/* Layout: an app shell drawn as a school exercise book. Phones: one column with a bottom tab bar.
   Wide screens: a left rail with the same tabs. Squared paper, a red margin line, blue ink, boxy cards
   with an offset shadow. A second skin, "rose" (soft pink, round), is kept as an option. */
:root {
  --bg: #FCFCF8; --grid: #E3E9F6; --margin: #E8857F;
  --surface: #FFFFFF; --line: #1A2233; --soft-line: #CBD3E4;
  --text: #1A2233; --sub: #586276;
  --brand: #2347B5; --brand-ink: #FFFFFF; --brand-soft: #E5EBFA;
  --sun: #FFD84D; --sun-soft: #FFF5CC;
  --coral: #D23F38; --coral-soft: #FCE4E2;
  --shadow: 4px 4px 0 var(--brand); --shadow-soft: 3px 3px 0 var(--soft-line);
  --border: 2px solid var(--line); --border-soft: 2px solid var(--soft-line);
  --f-ui: "Atkinson Hyperlegible", "Noto Sans", system-ui, sans-serif;
  --f-rom: "HakkaRom", "Noto Sans", system-ui, sans-serif;   /* embedded Noto Sans with the tone letters ˊ ˇ ˋ */
  --f-han: "Iansui", "Noto Sans TC", "HakkaExt", "PingFang TC", sans-serif;
  --f-mix: "HakkaRom", "Noto Sans", "Iansui", "Noto Sans TC", "HakkaExt", system-ui, sans-serif;
  --w-han: 400; --r: 8px; --r-big: 10px;
  color-scheme: light;   /* white paper unless the reader turns on Night */
}
/* skin: rose */
:root[data-night] {
  --bg: #15171D; --grid: #1F2330; --margin: #6E3434; --surface: #1C1F27; --line: #C9D1E6; --soft-line: #343A4C;
  --text: #E7EAF2; --sub: #9AA3B8; --brand: #8FA8FF; --brand-ink: #10152A; --brand-soft: #232B47;
  --sun: #FFD84D; --sun-soft: #3A3417; --coral: #FF8F86; --coral-soft: #3F2426; color-scheme: dark; }
:root[data-skin="rose"] {
  --bg: #FFF0F3; --grid: transparent; --margin: transparent; --surface: #FFFFFF; --line: #F3C7D3; --soft-line: #F7D9E1;
  --text: #2B1A2E; --sub: #85566A; --brand: #C93466; --brand-ink: #FFFFFF; --brand-soft: #FFE1EA;
  --sun: #FFC64D; --sun-soft: #FFF2D2; --coral: #C2410C; --coral-soft: #FFE7D6;
  --shadow: 0 6px 18px rgb(201 52 102 / .12); --shadow-soft: 0 3px 10px rgb(201 52 102 / .08);
  --border: 0 solid transparent; --border-soft: 0 solid transparent;
  --f-ui: "Nunito", "Noto Sans", system-ui, sans-serif; --f-rom: "HakkaRom", "Noto Sans", system-ui, sans-serif;
  --f-han: "Noto Sans TC", "HakkaExt", "PingFang TC", sans-serif; --f-mix: "Nunito", "Noto Sans", "Noto Sans TC", "HakkaExt", sans-serif;
  --w-han: 900; --r: 22px; --r-big: 28px; }
:root[data-skin="rose"][data-night] {
  --bg: #1E1219; --surface: #2A1A24; --line: #4A2E3C; --soft-line: #3A2430; --text: #FBEFF4; --sub: #C9A3B4;
  --brand: #FF7AA5; --brand-ink: #2B0F1C; --brand-soft: #4A2236; --sun-soft: #3B3017; --coral: #FF9E6B; --coral-soft: #3E2618; color-scheme: dark; }


html, body { height: 100%; }
body { background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; color: var(--text); font-family: var(--f-mix); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.han { font-family: var(--f-han); }

/* shell */
.shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; border-right: 1px solid var(--line); padding-block: 1.5rem; padding-inline: 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
.logo { display: flex; align-items: center; gap: .6rem; padding-inline: .5rem; }
.logo .mark { width: 2.25rem; height: 2.25rem; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: var(--f-han); font-weight: 900; font-size: 1.15rem; }
.logo b { font-family: var(--f-han); font-weight: 900; font-size: 1.15rem; display: block; line-height: 1.1; }
.logo small { color: var(--sub); font-size: .8rem; }
.tabs { display: flex; flex-direction: column; gap: .25rem; }
.tab { display: flex; align-items: center; gap: .75rem; background: none; border: 0; border-radius: 12px; padding: .65rem .75rem; text-align: left; font-weight: 600; color: var(--sub); }
.tab svg { width: 1.35rem; height: 1.35rem; flex: none; }
.tab:hover { background: var(--surface); color: var(--text); }
.tab[aria-current="true"] { background: var(--brand-soft); color: var(--brand); }
.tab .count { margin-left: auto; background: var(--coral); color: #fff; border-radius: 999px; font-size: .72rem; padding: 0 .45rem; font-variant-numeric: tabular-nums; }
main { min-width: 0; padding-block: calc(2rem + env(safe-area-inset-top, 0px)) 5rem; padding-inline: clamp(16px, 4vw, 3rem); }
.col { max-width: 44rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5rem; }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; z-index: 15; top: auto; bottom: 0; left: 0; right: 0; height: auto; border-right: 0; border-top: 1px solid var(--line); background: var(--bg); padding-block: .35rem calc(.35rem + env(safe-area-inset-bottom, 0px)); padding-inline: .5rem; }
  .logo { display: none; }
  .tabs { flex-direction: row; justify-content: space-around; }
  .tab { flex-direction: column; gap: .15rem; font-size: .72rem; padding: .35rem .6rem; position: relative; }
  .tab .count { position: absolute; top: .1rem; right: .2rem; margin: 0; }
  main { padding-block: calc(1.25rem + env(safe-area-inset-top, 0px)) 6.5rem; }
}

/* type */
.eyebrow { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
h1 { margin: 0; font-family: var(--f-han); font-weight: 900; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
h2 { margin: 0; font-size: 1.15rem; font-weight: 800; display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
h2 .han { font-weight: 900; }
.rom { font-family: var(--f-rom); }
.sub { color: var(--sub); }
.head { display: flex; flex-direction: column; gap: .2rem; }
.head .rom { font-size: 1.2rem; color: var(--sub); }

/* cards and buttons */
.card { background: var(--surface); border-radius: var(--r); padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .6rem; }
.card.raised { background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: 0; border-radius: 999px; padding: .65rem 1.25rem; font-weight: 800; font-size: .95rem; background: var(--brand); color: var(--brand-ink); }
.btn:hover { filter: brightness(1.05); }
.btn.quiet { background: var(--surface); color: var(--text); }
.btn.line { background: none; border: 1.5px solid var(--line); color: var(--text); }
.btn.small { padding: .35rem .85rem; font-size: .85rem; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: .2rem .6rem; border-radius: 999px; }
.p-same { background: var(--surface); color: var(--sub); border: 1px solid var(--line); }
.p-ff { background: var(--coral-soft); color: var(--coral); }
.p-to { background: var(--brand-soft); color: var(--brand); }
.p-pt { background: var(--sun-soft); color: var(--text); }
.bar { height: .5rem; border-radius: 999px; background: var(--soft-line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); border-radius: 999px; }

.skin button[data-night][aria-pressed="true"] { border-color: var(--brand); color: var(--brand); font-weight: 700; }
.setgrid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .8rem 1rem; align-items: center; }
.setgrid .lab { font-family: var(--f-ui); font-weight: 700; font-size: .9rem; }
.setgrid .seg { justify-self: start; }
/* word card: places table folded */
.around summary { cursor: pointer; font-family: var(--f-ui); font-size: .72rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--sub); padding-block: .2rem; }
/* Mandarin equivalents */
.mlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .2rem; }
.mlist .han { font-size: 1.05rem; } .mlist .py { font-family: var(--f-rom); color: var(--brand); font-weight: 600; } .mlist .men { color: var(--sub); font-size: .9rem; }
/* keep the card header (and its close button) visible while the card scrolls */
.sheet .wc-top { position: sticky; top: -.5rem; z-index: 2; background: var(--bg); margin-inline: -1.25rem; padding: .5rem 1.25rem .4rem; border-bottom: 1px solid var(--soft-line); }
@media (min-width: 1100px) { .sheet .wc-top { top: calc(-1.25rem - env(safe-area-inset-top, 0px)); } }
/* note pop-up */
.note-body { margin: 0; font-size: 1.05rem; line-height: 1.6; max-width: 60ch; }
.note-tag { font-family: var(--f-ui); font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--brand); margin-top: .2rem; }
.note-tag.false-friend { color: var(--coral); }
.sent.noted .txt { background: var(--sun-soft); border-radius: 6px; }
.nlink { min-width: 1.9rem; height: 1.9rem; font-size: .85rem; }
.allnotes summary { cursor: pointer; font-family: var(--f-ui); font-weight: 700; font-size: 1rem; padding-block: .4rem; }
.allnotes .notes { margin-top: .6rem; }
/* variants */
ruby.tok.var rt .rw, span.tok.var { text-decoration: underline dotted var(--coral) 1.5px; text-underline-offset: 2px; }
.choices { display: flex; gap: .4rem; flex-wrap: wrap; }
.choice { display: flex; flex-direction: column; align-items: flex-start; border: var(--border-soft); background: var(--surface); border-radius: var(--r); padding: .35rem .7rem; min-height: 44px; }
.choice b { font-family: var(--f-rom); font-size: 1.05rem; }
.choice span { font-size: .72rem; color: var(--sub); font-family: var(--f-ui); }
.choice[aria-pressed="true"] { border: var(--border); border-color: var(--brand); background: var(--brand-soft); }
.ptable { border-collapse: collapse; width: 100%; font-size: .92rem; }
.ptable td, .ptable th { padding: .35rem .6rem; border-bottom: 1px solid var(--soft-line); text-align: left; white-space: nowrap; }
.ptable th { font-family: var(--f-ui); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); }
.ptable td { font-family: var(--f-rom); }
.ptable .big { font-size: 1.4rem; }
/* review segments, cloze, bridge, second wave */
.segs { display: flex; flex-direction: column; gap: .5rem; }
.seg-row { display: flex; gap: .6rem 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: var(--border-soft); border-radius: var(--r); padding: .7rem .9rem; }
.seg-t { display: flex; flex-direction: column; min-width: 0; }
.seg-t .han { font-size: 1.15rem; font-weight: var(--w-han); }
.seg-meta { font-size: .8rem; color: var(--sub); } .seg-meta b { color: var(--coral); }
.cloze { text-align: center; line-height: 2.4; }
.cloze .blank { color: var(--brand); } .cloze .blank rt { color: var(--brand); }
.cloze .hit { background: var(--sun-soft); border-radius: 4px; }
.answer { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
.answer .ah { font-size: 2.2rem; font-weight: var(--w-han); line-height: 1.1; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; width: 100%; max-width: 24rem; margin-top: .6rem; }
.opt { font-family: var(--f-rom); font-size: 1.3rem; font-weight: 600; padding: .7rem .5rem; border: var(--border); border-radius: var(--r); background: var(--surface); color: var(--text); }
.opt:not([disabled]):hover { background: var(--brand-soft); }
.opt.right { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.opt.wrong { background: var(--coral-soft); color: var(--coral); border-color: var(--coral); }
.explain { text-align: left; width: 100%; display: flex; flex-direction: column; gap: .4rem; margin-top: .6rem; }
.explain ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .3rem; }
.explain p { margin: 0; }
.verdict { font-weight: 700; } .verdict.ok { color: var(--brand); } .verdict.no { color: var(--coral); }
.wave { text-align: left; border: var(--border); border-color: var(--coral); }
.en.act { font-size: 1.2rem; font-weight: 600; }
/* lesson grid */
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: .5rem; }
.lt { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; background: var(--surface); border: var(--border-soft); border-radius: var(--r); padding: .3rem; min-width: 0; }
.lt .ln { font-family: var(--f-ui); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.lt .lh { font-family: var(--f-han); font-size: .78rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lt:not(.soon):hover { background: var(--brand-soft); }
.lt.next { border: var(--border); border-color: var(--brand); box-shadow: var(--shadow); }
.lt.done { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.lt.done .lh { color: var(--brand-ink); opacity: .85; }
.lt.soon { background: transparent; border-style: dashed; color: var(--sub); cursor: default; }
.lt.soon .ln { font-weight: 400; opacity: .6; }
.lt.rev.soon .lh { color: var(--coral); opacity: .7; }
@media (max-width: 420px) { .lgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
/* Part 2 (進修): a second notebook */
.pbreak { height: 0; border-top: 3px double var(--margin); margin: 1.2rem -1rem 0; }
.pcover { position: relative; background: var(--surface); border: var(--border); border-left: 14px solid var(--brand); border-radius: var(--r); box-shadow: var(--shadow); padding: 1.2rem 1.2rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: .45rem; scroll-margin-top: 1rem; }
.pcover h1 { font-size: clamp(2.2rem, 9vw, 2.8rem); }
.pcover .ptag { position: absolute; top: .9rem; right: 1rem; font-family: var(--f-ui); font-weight: 800; font-size: .75rem; color: var(--coral); border: 2px solid var(--coral); border-radius: 6px; padding: .05rem .4rem; transform: rotate(4deg); }
.lt .ln small { font-size: .7rem; color: var(--brand); margin-right: .05rem; }
.lt.done .ln small { color: var(--brand-ink); }
/* (old today styles below, unused) */
.hello { display: flex; flex-direction: column; gap: .15rem; }
.hello .big { font-family: var(--f-han); font-weight: 900; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.1; }
.hello .rom { font-size: 1.15rem; color: var(--sub); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; }
.stat { display: flex; align-items: baseline; gap: .4rem; }
.stat b { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.todaycard .lt { font-family: var(--f-han); font-size: 1.7rem; font-weight: 900; line-height: 1.2; }
.todaycard .lr { color: var(--sub); }
.wotd { cursor: pointer; text-align: left; border: 0; width: 100%; }
.wotd .wh { font-family: var(--f-han); font-size: 2.4rem; font-weight: 700; line-height: 1.15; }
.wotd .wr { font-size: 1.2rem; }
.days { display: flex; gap: .35rem; }
.days span { width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: .65rem; font-weight: 800; color: var(--sub); }
.days span.on { background: var(--sun); color: #2B2100; }

/* lists */
.list { display: flex; flex-direction: column; gap: .6rem; }
.item { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; align-items: center; gap: .9rem; background: var(--surface); border: 0; border-radius: var(--r); padding: .85rem 1rem; text-align: left; }
.item:hover { background: var(--brand-soft); }
.item .no { width: 3rem; height: 3rem; border-radius: 12px; background: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.item.done .no { background: var(--brand); color: var(--brand-ink); }
.item .tt { font-family: var(--f-han); font-weight: 700; font-size: 1.15rem; }
.item .ts { color: var(--sub); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .chev { color: var(--sub); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .8rem; }
.tcard { background: var(--surface); border: 0; border-radius: var(--r); padding: 1.2rem 1rem; text-align: left; display: flex; flex-direction: column; gap: .2rem; }
.tcard:hover { background: var(--brand-soft); }
.tcard .th { font-family: var(--f-han); font-size: 2rem; font-weight: 900; line-height: 1.15; }
.tcard .tr { color: var(--sub); }
.tcard .tn { margin-top: .5rem; font-size: .8rem; color: var(--brand); font-weight: 800; }

/* lesson reader */
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: .6rem; display: flex; gap: .5rem 1rem; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: .3rem .8rem; font-size: .85rem; font-weight: 600; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: var(--shadow); }
.toggle { display: inline-flex; align-items: center; gap: .4rem; font-size: .85rem; font-weight: 600; color: var(--sub); }
.toggle input { accent-color: var(--brand); width: 1.05rem; height: 1.05rem; }
.legend { display: flex; gap: .8rem; font-size: .78rem; color: var(--sub); flex-wrap: wrap; }
.legend .k-to { border-bottom: 2.5px solid var(--brand); }
.legend .k-ff { border-bottom: 2.5px dotted var(--coral); }
.setting { color: var(--sub); }
.lines { display: flex; flex-direction: column; gap: .75rem; }
.sent { background: var(--surface); border-radius: var(--r); padding: .85rem 1rem 1rem; display: flex; flex-direction: column; gap: .35rem; }
.sent .who { display: flex; align-items: center; gap: .5rem; font-size: .8rem; font-weight: 800; color: var(--sub); }
.av { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 800; background: var(--brand); color: var(--brand-ink); }
.av.b { background: var(--sun); color: #2B2100; }
.who .n { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.txt { font-family: var(--f-han); font-size: 1.6rem; line-height: 2.5; }
.mode-rom .txt { font-family: var(--f-ui); font-size: 1.3rem; line-height: 1.7; }
.mode-han .txt { line-height: 1.75; }
ruby.tok { ruby-position: over; cursor: pointer; border-radius: 6px; padding-inline: .05em; }
rt .rw { display: inline-block; white-space: nowrap; }
ruby.tok rt { font-family: var(--f-rom); font-size: .48em; font-weight: 600; color: var(--sub); }
.mode-han ruby.tok rt { display: none; }
span.tok { cursor: pointer; border-radius: 4px; }
.tok:hover, .tok.sel { background: var(--brand-soft); }
.tok.c-to { text-decoration: underline solid var(--brand) 2.5px; text-underline-offset: .3em; }
.tok.c-ff { text-decoration: underline dotted var(--coral) 2.5px; text-underline-offset: .3em; }
.punct { color: var(--sub); }
.under { display: flex; gap: .4rem .8rem; flex-wrap: wrap; align-items: center; }
.under.recap { margin: .6rem 0 0; }
.reveal { border: 0; background: var(--bg); border-radius: 999px; padding: .2rem .75rem; font-size: .8rem; font-weight: 600; color: var(--sub); }
.en { font-size: 1rem; }
.zh { font-family: var(--f-han); color: var(--sub); }
.nlink { border: 0; background: var(--brand-soft); color: var(--brand); border-radius: 999px; min-width: 1.6rem; height: 1.6rem; font-size: .78rem; font-weight: 800; }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; }
.note { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); gap: .7rem; padding: .7rem .8rem; border-radius: 12px; transition: background .5s; }
.note.flash { background: var(--sun-soft); }
.note .nn { width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.note p { margin: 0; max-width: 65ch; }

<script type="application/json" id="app-data">/*__DATA__*/null</script>
<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
// pinyin: the tone letters ˊ ˇ ˋ are spacing characters with wide side bearings; wrapped so CSS can pull them
// onto the syllable (ngaiˇ, not ngai ˇ)
const rom = s => esc(s).replace(/[ˊˇˋ]/g, m => `<span class="tm">${m}</span>`);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('hkka:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hkka:' + k, JSON.stringify(v)); } catch {} }
};
const prefs = Object.assign({ mode: 'both', en: false, acc: 'sx', skin: 'notebook', night: false, active: false, autoplay: true }, store.get('prefs', {}));
const savePrefs = () => store.set('prefs', prefs);
function applySkin() {
  const r = document.documentElement;
  if (prefs.skin === 'rose') r.dataset.skin = 'rose'; else delete r.dataset.skin;
  if (prefs.night) r.dataset.night = ''; else delete r.dataset.night;
  const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = getComputedStyle(r).getPropertyValue('--bg').trim() || '#FCFCF8';
}
const HOSTED = !!document.querySelector('link[rel=manifest]');
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (currentTab() === 'settings') showSettings(); });
if (HOSTED && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- progress
const doneAt = store.get('doneAt', {}), waveAt = store.get('waveAt', {});
const done = new Set(Object.keys(doneAt).map(Number));
function setDone(id, on) { if (on) { doneAt[id] = today(); done.add(id); } else { delete doneAt[id]; done.delete(id); } store.set('doneAt', doneAt); }
function setWave(id, on) { if (on) waveAt[id] = today(); else delete waveAt[id]; store.set('waveAt', waveAt); }
let deck = store.get('deck', {});
let studyDays = new Set(store.get('days', []));
const DAY = 864e5, BOXES = [0, 1, 3, 7, 16, 35];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
function studied() { studyDays.add(today()); store.set('days', [...studyDays]); }
function streak() { let n = 0; const d = new Date(); if (!studyDays.has(ymd(d))) d.setDate(d.getDate() - 1); while (studyDays.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); } return n; }

const COG = { 'same': ['p-same', 'Same as Mandarin', ''], 'false-friend': ['p-ff', 'False friend', 'c-ff'], 'hakka-only': ['p-to', 'Hakka only', 'c-to'], 'partial': ['p-pt', 'Partly shared', ''] };
const cog = id => COG[(DATA.dict[id] || {}).cog] || ['', '', ''];
const PUNCT = { '，': ', ', '。': '. ', '！': '! ', '？': '? ', '：': ': ', '、': ', ', '；': '; ', '「': '“', '」': '”', '『': '‘', '』': '’', '（': '(', '）': ')', '……': '… ' };
const ICONS = {
  lessons: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 1 2-2h13"/></svg>',
  review: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="3" width="13" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h10"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
};

// ---------- routing
let WAVE = false, homeY = 0;
function route() {
  const h = location.hash.slice(1) || 'lessons';
  closeSheet();
  let m; WAVE = false;
  if (h === 'lessons') return showLessons();
  if (h === 'lesson-0') return showLesson0();
  if ((m = h.match(/^(lesson|wave)-(\d+)$/))) { const L = DATA.lessons.find(l => l.id === +m[2]); if (L) { WAVE = m[1] === 'wave'; store.set('last', L.id); return showLesson(L); } }
  if (h === 'review') return showReview();
  if (h === 'settings') return showSettings();
  showLessons();
}
function go(h) { if (location.hash === '#' + h) { route(); window.scrollTo(0, 0); } else location.hash = h; }
let onHome = (location.hash.slice(1) || 'lessons') === 'lessons', resetHome = false;
addEventListener('hashchange', () => {
  if (onHome) homeY = window.scrollY;
  if (resetHome) { homeY = 0; resetHome = false; }
  route();
  onHome = (location.hash.slice(1) || 'lessons') === 'lessons';
  if (onHome && homeY) window.scrollTo(0, homeY); else window.scrollTo(0, 0);
});
function wireGo(root) { $$('[data-go]', root).forEach(b => b.onclick = () => go(b.dataset.go)); }
function currentTab() { const h = location.hash.slice(1) || 'lessons'; return /^(lesson|wave)/.test(h) ? 'lessons' : h; }
function renderTabs(cur) {
  const due = dueCards().length;
  const tabs = [['lessons', 'Lessons'], ['review', due ? `Practice · ${due}` : 'Practice'], ['settings', 'Settings']];
  $('#tabs').innerHTML = tabs.map(([k, t]) => `<button class="tab" data-tab="${k}" aria-current="${cur === k}">${ICONS[k]}<span>${t}</span></button>`).join('');
  $$('[data-tab]', $('#tabs')).forEach(b => b.onclick = () => { const k = b.dataset.tab; if (k === 'review') sess = null; if (k === 'lessons') resetHome = true; go(k); });
}

// ---------- lessons list
const TOTAL = 100, PART2 = 100, PTOTAL = 70;
const isP = id => id > PART2;
const lnum = id => isP(id) ? 'P' + (id - PART2) : String(id);
const lname = id => isP(id) ? `進修 ${id - PART2}` : `Lesson ${id}`;
const waveOff = id => isP(id) ? 35 : 49;
const GENRES = { dialogue: 'Dialogue', article: 'Article', letter: 'Letter', interview: 'Interview', tale: 'Tale', diary: 'Diary', debate: 'Debate', speech: 'Speech', essay: 'Essay', document: 'Document', song: 'Song', review: 'Review', news: 'News', story: 'Story', play: 'Play' };
// the accent shown: Hailu only exists in Part 1
const accOf = L => (prefs.acc === 'hl' && !L.p2) ? 'hl' : 'sx';
const titleOf = (L, a) => L.title[a] || L.title.sx;
function tile(byId, id, next) {
  const l = byId[id], n = isP(id) ? id - PART2 : id, rev = n % 7 === 0, pre = isP(id) ? '<small>P</small>' : '';
  if (!l) return `<button class="lt soon ${rev ? 'rev' : ''}" disabled aria-label="${lname(id)}, not written yet"><span class="ln">${pre}${n}</span><span class="lh">${rev ? '復習' : ''}</span></button>`;
  const st = done.has(id) ? 'done' : (next && next.id === id ? 'next' : '');
  return `<button class="lt ${st} ${rev ? 'rev' : ''}" data-go="lesson-${id}" aria-label="${lname(id)}: ${esc(l.title.en)}${done.has(id) ? ', done' : ''}"><span class="ln">${done.has(id) ? '✓ ' : ''}${pre}${n}</span><span class="lh">${esc(titleOf(l, accOf(l)).h)}</span>${waveAt[id] ? '<span class="w2" aria-hidden="true">2</span>' : ''}</button>`;
}
function showLessons() {
  renderTabs('lessons');
  const byId = Object.fromEntries(DATA.lessons.map(l => [l.id, l]));
  const next = DATA.lessons.find(l => !done.has(l.id));
  const last = store.get('last', null), wv = nextWave(), dt = Object.values(doneAt).filter(d => d === today()).length, st = streak();
  const inMain = id => id >= 1 && id <= TOTAL, mdone = [...done].filter(inMain).length, mwritten = DATA.lessons.filter(l => inMain(l.id)).length;
  const p2 = [...Array(PTOTAL)].map((_, i) => PART2 + i + 1), pdone = p2.filter(id => done.has(id)).length, pwritten = p2.filter(id => byId[id]).length;

    .filter(x => x[0]).sort((a, b) => b[0].localeCompare(a[0]) || b[1] - a[1]);
  $('#main').innerHTML = `<div class="col">
    <div class="head"><span class="eyebrow">Course</span><h1>課程</h1>
      <span class="rom">${mdone} done · ${mwritten} of ${TOTAL} written</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.round(100 * mdone / TOTAL)}%"></i></div>
    ${next ? `<div class="card raised nextcard">
      <span class="eyebrow">${last === next.id ? 'Carry on' : 'Next lesson'}${dt ? ` · ${dt} done today` : ''}${st > 1 ? ` · ${st}-day streak` : ''}</span>
      <div class="nc-main"><span class="nc-n">${lnum(next.id)}</span><span class="nc-t"><span class="han">${esc(titleOf(next, accOf(next)).h)}</span><span class="rom sub">${rom(titleOf(next, accOf(next)).p)} · ${esc(next.title.en)}</span></span>
        <button class="btn" data-go="lesson-${next.id}">${last === next.id ? 'Resume' : 'Start'} →</button></div></div>`
      : `<div class="card raised"><span class="eyebrow">All written lessons are done</span><span>New lessons will appear here as they are written.</span></div>`}
    ${wv ? `<div class="card wave"><span class="eyebrow">${wv.review ? 'Review · second wave' : 'Second wave'}</span>
      <div class="nc-main"><span class="nc-n">${lnum(wv.id)}</span><span class="nc-t"><span class="han">${esc(titleOf(wv, accOf(wv)).h)}</span><span class="sub">Read the English, say it in Hakka, then check.</span></span>
        <button class="btn line" data-go="wave-${wv.id}">Do it →</button></div></div>` : ''}
    <button class="item" data-go="lesson-0"><span class="no">0</span><span><span class="tt">讀拼音</span><br><span class="ts">Reading Hakka pinyin · start here</span></span><span class="chev">›</span></button>
    <div class="lgrid">${[...Array(TOTAL)].map((_, i) => tile(byId, i + 1, next)).join('')}</div>
    <p class="sub" style="margin:0;font-size:.85rem">Every 7th lesson (復習) is a review. From lesson 50 the second wave starts: each lesson you finish brings back lesson N−49 in active mode (English → Hakka); a small <b>2</b> marks the ones redone.</p>
    <div class="pbreak" aria-hidden="true"></div>
    <section class="pcover" id="part2" aria-label="Part 2, Perfectionnement"><span class="ptag">Part 2</span>
      <span class="eyebrow">Perfectionnement · Sixian only</span><h1>進修</h1>
      <span class="rom">jin xiuˊ · after the 100 lessons</span>
      <p class="sub" style="margin:0">Longer lessons, and not only dialogues: letters, interviews, news, tales, speeches, essays. Sam is back in Taiwan for a year at 聯合大學. A review every 7th lesson; from 進修 36 each lesson also brings back 進修 N−35.</p>
      <div class="bar" aria-hidden="true"><i style="width:${Math.round(100 * pdone / PTOTAL)}%"></i></div>
      <span class="sub" style="font-size:.85rem">${pdone} done · ${pwritten} of ${PTOTAL} written</span></section>
    <div class="lgrid pgrid">${p2.map(id => tile(byId, id, next)).join('')}</div>
    <details class="journal"><summary><span class="han">日記</span> Journal (${journal.length})</summary>
      ${journal.length ? `<ul>${journal.map(([d, n, k]) => { const l = byId[n]; return `<li><time>${fmtDate(d)}</time><button class="linkish" data-go="${k}-${n}">${k === 'wave' ? 'Second wave · ' : ''}${lname(n)} · ${esc(l ? l.title.en : '')}</button></li>`; }).join('')}</ul>`
        : '<p class="sub">Lessons you finish show up here with their date.</p>'}</details>
    <p class="sub" style="margin:0;font-size:.8rem">Built ${esc(DATA.built)}.</p>
  </div>`;
  wireGo($('#main'));
}
function nextWave() {
  for (const inPart of [l => !isP(l.id), l => isP(l.id)]) {
    for (const l of DATA.lessons.filter(inPart)) { if (waveAt[l.id]) continue; if (done.has(l.id + waveOff(l.id)) && isP(l.id + waveOff(l.id)) === isP(l.id)) return l; break; }
  }
  return null;
}

// ---------- tokenised sentence
const HAN_RE = /[㐀-鿿\u{20000}-\u{3ffff}豈-﫿]/u;
const TOKS = {};
function rtHTML(r) { return `<rt><span class="rw">${rom(r)}</span></rt>`; }
function tokHTML(tok, key) {
  if (tok.x !== undefined) {
    if (tok.p !== undefined) return prefs.mode === 'rom' ? rom(tok.p) : `<ruby>${esc(tok.x)}${prefs.mode === 'han' ? '' : rtHTML(tok.p)}</ruby>`;   // a line that could not be cut
    if (tok.name) return `<span class="punct">${esc(tok.x)}</span>${prefs.mode === 'rom' ? ' ' : ''}`;
    return `<span class="punct">${esc(prefs.mode === 'rom' ? (PUNCT[tok.x] ?? tok.x) : tok.x)}</span>`;
  }
  const w = tok.w, cls = 'tok ' + (w.id ? cog(w.id)[2] : '');
  TOKS[key] = w;
  const a = `class="${cls}" tabindex="0" role="button" data-tok="${key}"`;
  if (prefs.mode === 'rom') return `<span ${a}>${rom(w.p)}</span> `;
  if (prefs.mode === 'han') return `<span ${a}>${esc(w.h)}</span>`;
  return `<ruby ${a}>${esc(w.h)}${rtHTML(w.p)}</ruby>`;
}
function sentence(b, prefix) { return b.t.map((t, i) => tokHTML(t, prefix + ':' + i)).join(''); }
function wireTokens(root) {
  $$('.tok', root).forEach(t => {
    const open = () => {
      if (prefs.mode === 'tap' && t.tagName === 'RUBY' && !t.classList.contains('show')) { t.classList.add('show'); return; }
      $$('.tok.sel').forEach(x => x.classList.remove('sel')); t.classList.add('sel'); const w = TOKS[t.dataset.tok]; openCard(w.id, w);
    };
    t.onclick = open; t.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  });
}
function toolbar(L, withActive) {
  return `<div class="toolbar" role="toolbar" aria-label="Display">
    ${withActive ? `<label class="toggle"><input type="checkbox" id="opt-active" ${prefs.active ? 'checked' : ''}> Active (EN → Hakka)</label>` : ''}

(() => {   // swipe the sheet down to close it

  sh.addEventListener('touchstart', e => { if (wide() || e.touches.length > 1) return; armed = sh.scrollTop <= 0; drag = false; dy = 0; y0 = e.touches[0].clientY; t0 = Date.now(); }, { passive: true });
  sh.addEventListener('touchmove', e => {

});

// ---------- practice: word cards in Leitner boxes (1, 3, 7, 16, 35 days)
function addToDeck(ids) { let n = 0; ids.forEach(id => { if (id && DATA.dict[id] && !deck[id]) { deck[id] = { box: 0, due: Date.now(), at: Date.now() }; n++; } }); store.set('deck', deck); return n; }
function dueCards() { const now = Date.now(); return Object.keys(deck).filter(id => deck[id].due <= now && DATA.dict[id]); }
let sess = null;
function showReview() {
  renderTabs('review');
  if (sess) return showCard();
  const ids = Object.keys(deck).filter(id => DATA.dict[id]), due = dueCards();
  const byLesson = {};
  ids.forEach(id => { const at = DATA.dict[id].atid || 0; (byLesson[at] = byLesson[at] || []).push(id); });
  const doneIds = DATA.lessons.filter(l => done.has(l.id)).map(l => l.id);
  $('#main').innerHTML = `<div class="col">
    <div class="head"><span class="eyebrow">Practice</span><h1>溫習</h1><span class="rom">Word cards</span></div>
    <div class="card raised"><div class="stat"><b>${due.length}</b><span class="sub">cards due · ${ids.length} in Practice</span></div>
      <div class="row">${due.length ? `<button class="btn" id="due">Review ${due.length}</button>` : ''}${ids.length ? `<button class="btn ${due.length ? 'quiet' : 'line'}" id="all">Practise all</button>` : ''}
      ${doneIds.length ? `<button class="btn small quiet" id="adddone">Add the words of the lessons I've done</button>` : ''}</div></div>
    ${ids.length ? `<h2>By lesson</h2><div class="segs">${Object.entries(byLesson).sort((x, y) => x[0] - y[0]).map(([at, list]) => { const d = list.filter(id => deck[id].due <= Date.now()).length; return `<div class="seg-row"><div class="seg-t"><span class="han">${at > 0 ? esc(lname(+at)) : 'Other words'}</span><span class="seg-meta">${list.length} words${d ? ` · <b>${d} due</b>` : ''}</span></div><div class="row"><button class="btn small line" data-study="${at}">Practise</button></div></div>`; }).join('')}</div>`
      : `<p class="sub">No cards yet. In a lesson, tap <b>Add all to Practice</b> under the new words, or <b>Add to Practice</b> on a word card.</p>`}
    <p class="sub" style="font-size:.85rem;margin:0">A card you remember comes back after 1, 3, 7, 16 and 35 days; one you miss comes back at the end of the session.</p>
  </div>`;
  const start = (q, title) => { sess = { queue: shuffle(q), i: 0, flipped: false, title, missed: new Set(), total: q.length }; showCard(); };
  const d = $('#due'); if (d) d.onclick = () => start(due, 'due cards');
  const al = $('#all'); if (al) al.onclick = () => start(ids, 'all cards');
  const ad = $('#adddone'); if (ad) ad.onclick = () => { const a = prefs.acc; const n = addToDeck(DATA.lessons.filter(l => done.has(l.id)).flatMap(l => l.words.map(w => ((!l.p2 && w[a]) || w.sx || {}).id))); toast(n ? `${n} words added` : 'Already there'); showReview(); };
  $$('[data-study]').forEach(b => b.onclick = () => start(byLesson[b.dataset.study], lname(+b.dataset.study)));
}
function showCard() {
  const m = $('#main');
  if (sess.i >= sess.queue.length) {
    m.innerHTML = `<div class="col"><div class="head"><span class="eyebrow">Practice · ${esc(sess.title)}</span><h1>好勢！</h1><span class="rom">Done</span></div>
      <div class="card raised"><div class="stat"><b>${sess.total - sess.missed.size}/${sess.total}</b><span class="sub">remembered the first time</span></div>${sess.missed.size ? `<span class="sub">To look at again: ${[...sess.missed].map(id => `<span class="han">${esc(DATA.dict[id].h)}</span> ${rom(DATA.dict[id].p)}`).join(' · ')}</span>` : ''}</div>
      <div class="row"><button class="btn" id="back">Back</button></div></div>`;
    $('#back').onclick = () => { sess = null; showReview(); };
    return;
  }
  const id = sess.queue[sess.i], c = DATA.dict[id], [pc, pt] = cog(id);
  m.innerHTML = `<div class="col">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Practice · ${esc(sess.title)}</span><span class="sub">${sess.i + 1} / ${sess.queue.length}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.round(100 * sess.i / sess.queue.length)}%"></i></div>
    <div class="card raised fc" aria-live="polite"><div class="big han">${esc(c.h)}</div>
      ${sess.flipped ? `<div class="answer"><span class="r">${rom(c.p)}</span>
          ${c.clip ? `<button class="btn small line" id="rplay">▶ Listen</button>` : ''}
          ${pt ? `<span class="pill ${pc}">${pt}</span>` : ''}${c.g || c.en ? `<span>${esc(c.g || c.en)}</span>` : ''}
          ${c.m ? `<span class="zh">華語 ${esc(c.m)}</span>` : ''}${c.a === 'hailu' ? '<span class="pos">海陸 Hailu</span>' : ''}</div>
        <div class="row" style="justify-content:center"><button class="btn line" id="again">Again <kbd>1</kbd></button><button class="btn" id="good">Got it <kbd>2</kbd></button></div>`
      : `<p class="empty" style="margin:0">Say the reading and the meaning, then check.</p>
        <div class="row" style="justify-content:center"><button class="btn" id="flip">Show answer <kbd>space</kbd></button></div>`}
    </div>
    <div class="row"><button class="btn small quiet" id="quit">Stop</button></div></div>`;
  $('#quit').onclick = () => { sess = null; showReview(); };
  if (sess.flipped) { $('#again').onclick = () => grade(false); $('#good').onclick = () => grade(true); const rp = $('#rplay'); if (rp) { rp.onclick = () => play(c.clip, rp); if (prefs.autoplay) play(c.clip, rp); } }
  else $('#flip').onclick = () => { sess.flipped = true; showCard(); };
}
function grade(ok) {
  const id = sess.queue[sess.i];
  if (!deck[id]) deck[id] = { box: 0, due: Date.now() };
  const d = deck[id];
  d.box = ok ? Math.min(d.box + 1, BOXES.length - 1) : 0;
  d.due = Date.now() + (ok ? BOXES[d.box] * DAY : 60e3); d.at = Date.now();
  store.set('deck', deck); studied();
  if (!ok) { sess.missed.add(id); sess.queue.push(id); }
  sess.i++; sess.flipped = false; renderTabs('review'); showCard();
}

// ---------- settings
function showSettings() {
  renderTabs('settings');
  const opt = (name, cur, list) => `<div class="seg" role="group" aria-label="${name}">${list.map(([k, t]) => `<button data-set="${name}" data-val="${k}" aria-pressed="${cur === k}">${t}</button>`).join('')}</div>`;
  const m = $('#main');
  m.innerHTML = `<div class="col">
    <div class="head"><span class="eyebrow">Settings</span><h1>設定</h1></div>
    <div class="card raised setgrid">
      <span class="lab">Look</span>${opt('skin', prefs.skin, [['notebook', 'Notebook'], ['rose', 'Rose']])}
      <span class="lab">Night mode</span>${opt('night', prefs.night ? 'on' : 'off', [['off', 'Off'], ['on', 'On']])}
      <span class="lab">Accent (Part 1)</span>${opt('acc', prefs.acc, [['sx', '四縣 Sixian'], ['hl', '海陸 Hailu']])}
      <span class="lab">Practice audio</span>${opt('autoplay', prefs.autoplay ? 'on' : 'off', [['on', 'Play on answer'], ['off', 'Silent']])}
    </div>
    <p class="sub" style="margin:0;max-width:65ch;font-size:.9rem"><b>Accent</b>: every Part 1 lesson is written in Sixian and in Hailu; this picks the one shown (you can also switch inside a lesson). 進修 is Sixian only.</p>
    ${HOSTED && !STANDALONE ? `<h2><span class="han">安裝</span> Install the app</h2>
    <div class="card"><span>Put 客話 on your home screen: it opens full screen like an app and works offline.</span>
      ${installEvt ? '<div class="row"><button class="btn small" id="install">Install</button></div>'
        : /iphone|ipad|ipod/i.test(navigator.userAgent) ? '<span class="sub" style="font-size:.9rem">In Safari: tap the Share button, then <b>Add to Home Screen</b>.</span>'
        : '<span class="sub" style="font-size:.9rem">In your browser menu: <b>Install app</b> or <b>Add to Home screen</b>.</span>'}</div>` : ''}
    <h2><span class="han">進度</span> Your progress</h2>
    <div class="card"><span>${done.size} lessons done · ${Object.keys(waveAt).length} second-wave · ${Object.keys(deck).length} words in Practice · ${studyDays.size} days studied</span>
      <span class="sub" style="font-size:.9rem">Progress is kept in this browser only. Save a copy to move it to another phone or computer.</span>
      <div class="row"><button class="btn small" id="exp">Save progress file</button><button class="btn small line" id="imp">Load progress file</button>
        <input type="file" id="imp-file" accept=".json,application/json" hidden></div></div>
    <h2><span class="han">來源</span> Sources</h2>
    <div class="card"><span class="sub" style="font-size:.9rem">Word lists and example sentences: 客家委員會 客語能力認證詞彙 (115年度 and 102年版). Dictionary: 教育部《臺灣客家語常用詞辭典》. Course text: CC BY-SA. Rare characters: Plangothic (SIL OFL). Built ${esc(DATA.built)}.</span></div>
  </div>`;
  $$('[data-set]', m).forEach(b => b.onclick = () => {
    const k = b.dataset.set, v = b.dataset.val;
    if (k === 'night') prefs.night = v === 'on'; else if (k === 'autoplay') prefs.autoplay = v === 'on'; else prefs[k] = v;
    savePrefs(); applySkin(); showSettings();
  });
  const ins = $('#install', m); if (ins) ins.onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; showSettings(); };
  $('#exp', m).onclick = () => {
    const blob = new Blob([JSON.stringify({ app: 'hkka', v: 1, doneAt, waveAt, deck, days: [...studyDays], prefs }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `hakka-progress-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#imp', m).onclick = () => $('#imp-file', m).click();
  $('#imp-file', m).onchange = async e => {
    try {
      const d = JSON.parse(await e.target.files[0].text());
      if (d.app !== 'hkka') throw 0;
      Object.assign(doneAt, d.doneAt || {}); Object.keys(doneAt).forEach(k => done.add(+k)); store.set('doneAt', doneAt);
      Object.assign(waveAt, d.waveAt || {}); store.set('waveAt', waveAt);
      deck = Object.assign(deck, d.deck || {}); store.set('deck', deck);
      (d.days || []).forEach(x => studyDays.add(x)); store.set('days', [...studyDays]);
      toast('Progress loaded'); showSettings();
    } catch { toast('Not a progress file from this app'); }
  };
}

// ---------- audio: one recording at a time
let player = null;
function play(src, btn) {
  try { if (player) player.pause(); player = new Audio(src); } catch { return; }
  player.play().catch(() => { if (btn) { btn.disabled = true; btn.textContent = 'No recording here'; } });
}
// the whole lesson, line after line (Assimil style); a tap on any ▶ or a second tap here stops it
let allRun = 0;
async function playAll(L, a, btn) {
  const run = ++allRun;
  if (btn.classList.contains('on')) { btn.classList.remove('on'); btn.textContent = btn.dataset.t; if (player) player.pause(); return; }
  btn.dataset.t = btn.textContent; btn.classList.add('on'); btn.textContent = '■ Stop';
  for (const ln of L.lines) {
    const b = ln[a] || ln.sx; if (!b.audio) continue;
    if (run !== allRun) break;
    const el = document.getElementById('line-' + ln.n); $$('.sent.saying').forEach(x => x.classList.remove('saying')); if (el) { el.classList.add('saying'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    await new Promise(res => { try { if (player) player.pause(); player = new Audio(b.audio); player.onended = res; player.onerror = res; player.play().catch(res); } catch { res(); } });
    await new Promise(r => setTimeout(r, 450));
  }
  $$('.sent.saying').forEach(x => x.classList.remove('saying'));
  if (run === allRun) { btn.classList.remove('on'); btn.textContent = btn.dataset.t; }
}
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

applySkin();
route();
</script>
